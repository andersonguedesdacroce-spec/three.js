{id:"p12-32",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Pedi bife à parmegiana no intervalo.", "Pedi bife a parmegiana no intervalo.", "Pedi bife há parmegiana no intervalo.", "Pedi bife á parmegiana no intervalo.", "Pedi bife às parmegiana no intervalo."],c:"Expressão “à moda de” subentendida."},
{id:"p12-33",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["O sargento ficou frente a frente com o suspeito.", "O sargento ficou frente à frente com o suspeito.", "O sargento ficou frente há frente com o suspeito.", "O sargento ficou frente á frente com o suspeito.", "O sargento ficou frente às frente com o suspeito."],c:"Palavras repetidas: sem crase."},
{id:"p12-34",n:2,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["Entregou a carta à Vossa Senhoria.", "Entregou a carta à senhora.", "Entregou a carta à chefe.", "Entregou a carta àquela agente.", "Entregou a carta às 10h."],c:"Vossa Senhoria não aceita artigo; “senhora” aceita."},
{id:"p12-35",n:2,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["Os agentes saíram à cavalo.", "Os agentes saíram à noite.", "Os agentes saíram às pressas.", "Os agentes saíram à procura do suspeito.", "Os agentes saíram à tarde."],c:"Cavalo é masculino: a cavalo."},
{id:"p12-36",n:2,e:"Complete: “A Guarda respondeu ____ reclamações dos moradores ____ partir de segunda-feira.”",a:["às / a", "as / à", "às / à", "há / a", "as / há"],c:"Responder a + as reclamações = às; antes do verbo partir, só a."},
{id:"p12-37",n:2,e:"Em “Refiro-me àquilo que você disse”, o acento grave resulta da fusão de",a:["preposição “a” com o pronome “aquilo”.", "artigo com artigo.", "preposição com verbo.", "dois pronomes.", "preposição com advérbio."],c:"Referir-se a + aquilo = àquilo."},
{id:"p12-38",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Estou disposto a colaborar com a investigação.", "Estou disposto à colaborar com a investigação.", "Estou disposto há colaborar com a investigação.", "Estou disposto á colaborar com a investigação.", "Estou disposto às colaborar com a investigação."],c:"Antes de verbo, sem crase."},
{id:"p12-39",n:2,tx:"tr",e:"No primeiro parágrafo, em “A medida atende às reclamações”, há crase porque",a:["o verbo foi construído com a preposição “a”, e “reclamações” vem com o artigo “as”.", "antecede hora.", "é locução adverbial.", "antecede verbo.", "é facultativa antes de plural."],c:"Atender a + as reclamações = às reclamações."},
{id:"p12-40",n:2,tx:"tr",e:"No segundo parágrafo, em “Os agentes circularão a pé”, não há crase porque",a:["“pé” é palavra masculina.", "antecede verbo.", "antecede pronome.", "antecede nome de cidade.", "é locução facultativa."],c:"Antes de masculino, sem crase."},
{id:"p12-41",n:3,tx:"tr",e:"No terceiro parágrafo, “Há duas semanas” está escrito com “há”, e não com “a”, porque",a:["indica tempo passado, com o verbo haver.", "indica distância.", "indica tempo futuro.", "é preposição antes de numeral.", "é crase facultativa."],c:"Há = faz: tempo passado."},
{id:"p12-42",n:3,tx:"tr",e:"No segundo parágrafo, em “de 10 a 30 de novembro”, não há crase porque",a:["não há artigo antes do numeral, apenas a preposição.", "“novembro” é masculino.", "antecede verbo.", "antecede pronome.", "a crase é facultativa entre numerais."],c:"Entre numerais sem artigo, só preposição."},
{id:"p12-43",n:3,tx:"tr",e:"No terceiro parágrafo, em “dirigir-se a qualquer agente”, não há crase porque",a:["“qualquer agente” não admite artigo feminino.", "antecede verbo.", "indica hora.", "é locução adverbial.", "a crase é facultativa antes de pronome indefinido."],c:"Pronome indefinido não aceita artigo."},
{id:"p12-44",n:3,tx:"tr",e:"No terceiro parágrafo, em “à frente da bilheteria”, o acento grave se justifica por se tratar de",a:["locução prepositiva formada com palavra feminina.", "hora determinada.", "nome próprio de pessoa.", "pronome possessivo.", "verbo no infinitivo."],c:"À frente de é locução feminina."},
{id:"p12-45",n:3,e:"Assinale a alternativa em que o acento grave está correto em todas as ocorrências.",a:["Fui à delegacia às 10h e voltei à noite.", "Fui à delegacia às 10h e voltei à pé.", "Fui a delegacia às 10h e voltei à noite.", "Fui à delegacia as 10h e voltei à noite.", "Fui à delegacia às 10h e comecei à escrever."],c:"Ir a + a delegacia; hora determinada; locução feminina."},
{id:"p12-46",n:3,e:"Assinale a alternativa em que o acento grave está INCORRETO.",a:["Chegou à uma conclusão rapidamente.", "Chegou à uma hora da manhã.", "Chegou à praça às 22h.", "Chegou à conclusão certa.", "Chegou à noite."],c:"Artigo indefinido “uma” não leva crase, salvo na indicação de hora."},
{id:"p12-47",n:3,e:"Complete: “Entreguei o termo ____ Vossa Senhoria, mas o original ficou ____ disposição da chefe ____ partir de hoje.”",a:["a / à / a", "à / à / à", "a / a / à", "à / a / a", "a / à / à"],c:"Tratamento sem artigo; locução feminina; antes de verbo, sem crase."},
{id:"p12-48",n:3,e:"Assinale a alternativa em que a troca por uma palavra masculina comprova a crase.",a:["Fui à praça. / Fui ao parque.", "Fui a Campinas. / Fui a Sorocaba.", "Comecei a correr. / Comecei a andar.", "Entreguei a ela. / Entreguei a ele.", "Fiquei cara a cara. / Fiquei frente a frente."],c:"Se o masculino pede “ao”, o feminino pede “à”."},
{id:"p12-49",n:3,e:"Assinale a frase em que há erro no uso de “há” ou “a”.",a:["Daqui há dez minutos a viatura chega.", "Há dez minutos a viatura chegou.", "Daqui a dez minutos a viatura chega.", "A viatura está a dez metros.", "Há muito tempo não chove."],c:"Futuro: daqui a dez minutos."},
{id:"p12-50",n:3,e:"Assinale a frase em que o acento grave é obrigatório.",a:["Assisti à operação inteira.", "Assisti a uma operação.", "Assisti a esta operação.", "Assisti a ela.", "Assisti a operações."],c:"Assistir a + a operação. Nas demais: artigo indefinido, demonstrativo, pessoal e plural sem artigo."},
{id:"p12-51",n:3,e:"Assinale a alternativa em que as duas formas são aceitas.",a:["Foi até a praça. / Foi até à praça.", "Foi a pé. / Foi à pé.", "Chegou às 10h. / Chegou as 10h.", "Vou a Campinas. / Vou à Campinas.", "Começou a chover. / Começou à chover."],c:"Depois de “até”, a crase é facultativa."},
{id:"p12-52",n:3,e:"Assinale a alternativa em que as duas formas são aceitas.",a:["Refiro-me a sua escala. / Refiro-me à sua escala.", "Refiro-me a escala. / Refiro-me à escala.", "Refiro-me aquela escala. / Refiro-me àquela escala.", "Refiro-me a ela. / Refiro-me à ela.", "Refiro-me a esta escala. / Refiro-me à esta escala."],c:"Antes de possessivo feminino singular, a crase é facultativa."},
{id:"p12-53",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["O guarda aspira à promoção desde o ano passado.", "O guarda aspira a promoção desde o ano passado.", "O guarda aspira há promoção desde o ano passado.", "O guarda aspira á promoção desde o ano passado.", "O guarda aspira às promoção desde o ano passado."],c:"Aspirar (desejar) pede a; “promoção” aceita artigo: à promoção."},
{id:"p12-54",n:3,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["A medida não agradou à todos.", "A medida não agradou à população.", "A medida não agradou às famílias.", "A medida não agradou àquela comissão.", "A medida não agradou à equipe."],c:"“Todos” é masculino e indefinido: agradou a todos."},
{id:"p12-55",n:3,e:"Assinale a frase em que a crase ocorre antes de nome masculino por indicar “à moda de”.",a:["Ele dribla à Garrincha.", "Ele chegou à praça.", "Ele saiu à noite.", "Ele dirigiu-se à chefe.", "Ele obedeceu à regra."],c:"À Garrincha = à moda de Garrincha."},
{id:"p12-56",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Os ambulantes ficaram à espera da fiscalização.", "Os ambulantes ficaram a espera da fiscalização.", "Os ambulantes ficaram há espera da fiscalização.", "Os ambulantes ficaram á espera da fiscalização.", "Os ambulantes ficaram às espera da fiscalização."],c:"Locução feminina: à espera de."},
{id:"p12-57",n:3,e:"Complete: “Ele não se referiu ____ você nem ____ ninguém; referiu-se apenas ____ delegada.”",a:["a / a / à", "à / à / à", "a / à / a", "à / a / à", "a / a / a"],c:"Você e ninguém não aceitam artigo; “delegada” aceita."},
{id:"p12-58",n:3,e:"Assinale a alternativa em que o acento grave está correto.",a:["Esta ocorrência é igual à que registramos ontem.", "A escala à que me refiro mudou.", "Entreguei o termo à quem pediu.", "Fui à uma reunião.", "Estou à seu dispor."],c:"À que = àquela que. Nas demais: a que (relativo), a quem, a uma, a seu dispor."},
{id:"p12-59",n:3,e:"Assinale a afirmação INCORRETA sobre crase.",a:["Há crase antes de verbo no infinitivo.", "Há crase nas horas determinadas.", "Não há crase antes de palavra masculina, salvo com “à moda de”.", "Depois de “até”, a crase é facultativa.", "Antes de pronome possessivo feminino singular, a crase é facultativa."],c:"Antes de verbo nunca há crase."},
{id:"p12-60",n:3,e:"Complete: “Das 8h ____ 18h, os agentes ficam ____ porta do prédio; ____ noite, o turno passa ____ uma equipe reserva.”",a:["às / à / À / a", "às / a / A / à", "as / à / À / à", "às / à / A / à", "as / a / À / a"],c:"Horas; à porta (ficar à porta); locução à noite; artigo indefinido uma, sem crase."}
];

BANCO["gm-1"] = [
{id:"g1-01",n:1,e:"A Lei 13.022/2014 institui normas gerais para as guardas municipais, disciplinando o",a:["§ 8º do art. 144 da Constituição Federal.", "§ 4º do art. 144 da Constituição Federal.", "art. 30 da Constituição Federal.", "art. 5º da Constituição Federal.", "§ 7º do art. 144 da Constituição Federal."],c:"Art. 1º."},
{id:"g1-02",n:1,e:"Segundo a Lei 13.022/2014, as guardas municipais são instituições de caráter",a:["civil.", "militar.", "paramilitar.", "policial militar.", "auxiliar do Exército."],c:"Art. 2º."},
{id:"g1-03",n:1,e:"De acordo com o art. 2º da Lei 13.022/2014, incumbe às guardas municipais a função de proteção municipal",a:["preventiva.", "repressiva.", "judiciária.", "investigativa.", "exclusivamente patrimonial."],c:"Art. 2º: proteção municipal preventiva."},
{id:"g1-04",n:1,e:"As guardas municipais são, nos termos da lei, uniformizadas e armadas",a:["conforme previsto em lei.", "em qualquer caso, por determinação do prefeito.", "somente com armas não letais.", "somente em Municípios com mais de 500 mil habitantes.", "apenas durante grandes eventos."],c:"Art. 2º: armadas conforme previsto em lei."},
{id:"g1-05",n:1,e:"É princípio mínimo de atuação das guardas municipais o",a:["patrulhamento preventivo.", "patrulhamento repressivo.", "policiamento judiciário.", "uso irrestrito da força.", "controle de fronteiras."],c:"Art. 3º, III."},
{id:"g1-06",n:1,e:"Entre os princípios mínimos de atuação, a lei prevê o uso",a:["progressivo da força.", "imediato da força.", "máximo da força.", "exclusivo de armas de fogo.", "preventivo de armas letais."],c:"Art. 3º, V."},
{id:"g1-07",n:1,e:"Assinale o princípio mínimo de atuação previsto no art. 3º da Lei 13.022/2014.",a:["Preservação da vida, redução do sofrimento e diminuição das perdas.", "Hierarquia e disciplina militares.", "Primazia do interesse arrecadatório do Município.", "Repressão imediata de qualquer infração.", "Sigilo absoluto das ações."],c:"Art. 3º, II."},
{id:"g1-08",n:1,e:"É competência geral das guardas municipais a proteção de",a:["bens, serviços, logradouros públicos municipais e instalações do Município.", "bens particulares e estabelecimentos comerciais.", "rodovias federais e estaduais.", "presídios estaduais.", "fronteiras e portos."],c:"Art. 4º."},
{id:"g1-09",n:1,e:"Uma praça pública é exemplo de bem de",a:["uso comum do povo.", "uso especial.", "dominial.", "propriedade privada.", "uso exclusivo da guarda."],c:"Bens de uso comum podem ser usados por todos livremente."},
{id:"g1-10",n:1,e:"O prédio de uma escola municipal é exemplo de bem de",a:["uso especial.", "uso comum do povo.", "dominial.", "propriedade particular.", "uso restrito da União."],c:"Bem destinado a um serviço público: uso especial."},
{id:"g1-11",n:1,e:"Um terreno vago pertencente ao Município, sem destinação pública, é bem",a:["dominial.", "de uso comum do povo.", "de uso especial.", "particular.", "da União."],c:"Dominiais são bens do Município sem destinação pública específica."},
{id:"g1-12",n:1,e:"Compete à guarda municipal zelar pelos",a:["bens, equipamentos e prédios públicos do Município.", "imóveis particulares do Município.", "presídios estaduais.", "quartéis da polícia militar.", "prédios do Poder Judiciário estadual."],c:"Art. 5º, I."},
{id:"g1-13",n:1,e:"Diante de flagrante delito, a guarda municipal deve encaminhar o autor da infração",a:["ao delegado de polícia.", "ao juiz de direito.", "ao promotor de justiça.", "ao prefeito.", "ao comandante da polícia militar."],c:"Art. 5º, XIV."},
{id:"g1-14",n:1,e:"Compete à guarda municipal auxiliar na segurança de",a:["grandes eventos e na proteção de autoridades e dignatários.", "instituições financeiras privadas.", "presídios federais.", "embaixadas estrangeiras, com exclusividade.", "fronteiras internacionais."],c:"Art. 5º, XVII."},
{id:"g1-15",n:1,e:"Na segurança escolar, a guarda municipal deve atuar mediante ações",a:["preventivas, zelando pelo entorno e participando de ações educativas.", "repressivas dentro das salas de aula.", "de revista diária de todos os alunos.", "exclusivamente nas escolas estaduais.", "de fiscalização pedagógica dos professores."],c:"Art. 5º, XVIII."},
{id:"g1-16",n:1,e:"As competências de trânsito da guarda municipal são exercidas",a:["nas vias e logradouros municipais, nos termos do Código de Trânsito Brasileiro, ou de forma concorrente, mediante convênio.", "nas rodovias federais, por delegação da Polícia Rodoviária Federal.", "em todas as vias do Estado, sem necessidade de convênio.", "somente em dias de grandes eventos.", "apenas mediante autorização do Ministério Público."],c:"Art. 5º, VI."},
{id:"g1-17",n:1,e:"Cabe à guarda municipal cooperar com os demais órgãos de",a:["defesa civil em suas atividades.", "polícia judiciária na condução de inquéritos.", "inteligência das Forças Armadas.", "fiscalização tributária federal.", "administração penitenciária."],c:"Art. 5º, VIII."},
{id:"g1-18",n:1,e:"A guarda municipal pode proteger o patrimônio",a:["ecológico, histórico, cultural, arquitetônico e ambiental do Município.", "privado de empresas instaladas no Município.", "federal localizado no Município, com exclusividade.", "artístico estrangeiro.", "exclusivamente arquitetônico."],c:"Art. 5º, VII."},
{id:"g1-19",n:1,e:"A Lei 13.022/2014 é conhecida como",a:["Estatuto Geral das Guardas Municipais.", "Estatuto do Desarmamento.", "Lei Orgânica das Polícias Militares.", "Código de Trânsito Brasileiro.", "Lei do Sistema Único de Segurança Pública."],c:"Nome dado à lei."},
{id:"g1-20",n:1,tx:"tg1",e:"No caso narrado, ao encontrar o autor do furto em flagrante, a conduta correta da equipe, segundo a lei, foi",a:["encaminhá-lo ao delegado de polícia.", "levá-lo à prefeitura para registro.", "liberá-lo após identificar a vítima.", "encaminhá-lo diretamente ao fórum.", "mantê-lo na base da guarda até o dia seguinte."],c:"Art. 5º, XIV."},
{id:"g1-21",n:2,e:"Assinale a alternativa que reproduz corretamente o art. 2º da Lei 13.022/2014.",a:["Incumbe às guardas municipais, instituições de caráter civil, uniformizadas e armadas conforme previsto em lei, a função de proteção municipal preventiva, ressalvadas as competências da União, dos Estados e do Distrito Federal.", "Incumbe às guardas municipais, instituições de caráter militar, a função de policiamento ostensivo estadual.", "Incumbe às guardas municipais, instituições de caráter civil, desarmadas, a função de proteção patrimonial exclusiva.", "Incumbe às guardas municipais, instituições de caráter civil, a função de polícia judiciária no Município.", "Incumbe às guardas municipais, instituições auxiliares da polícia militar, a função de proteção preventiva estadual."],c:"Texto literal do art. 2º."},
{id:"g1-22",n:2,e:"Os princípios previstos no art. 3º da Lei 13.022/2014 são",a:["mínimos, podendo a lei municipal acrescentar outros.", "taxativos, não admitindo complementação.", "facultativos, a critério do comandante.", "aplicáveis apenas às guardas armadas.", "exclusivos das guardas de capitais."],c:"O caput fala em princípios mínimos."},
{id:"g1-23",n:2,e:"Assinale a alternativa que NÃO corresponde a princípio mínimo de atuação das guardas municipais.",a:["Hierarquia e disciplina militares.", "Proteção dos direitos humanos fundamentais, do exercício da cidadania e das liberdades públicas.", "Patrulhamento preventivo.", "Compromisso com a evolução social da comunidade.", "Uso progressivo da força."],c:"As guardas são civis; hierarquia militar não está no art. 3º."},
{id:"g1-24",n:2,e:"Quanto às ocorrências emergenciais, compete à guarda municipal",a:["garantir o atendimento, ou prestá-lo direta e imediatamente quando deparar-se com elas.", "apenas comunicá-las à polícia militar, sem prestar atendimento.", "prestar atendimento somente quando solicitada pelo Corpo de Bombeiros.", "atendê-las apenas se ocorrerem em bens municipais.", "registrá-las para posterior encaminhamento ao Ministério Público."],c:"Art. 5º, XIII."},
{id:"g1-25",n:2,e:"Na hipótese de flagrante delito, a preservação do local do crime pela guarda municipal deve ocorrer",a:["quando possível e sempre que necessário.", "em todos os casos, sem exceção.", "apenas por ordem judicial.", "somente nos crimes contra a vida.", "apenas quando solicitada pelo delegado."],c:"Art. 5º, XIV."},
{id:"g1-26",n:2,e:"Nas hipóteses de ocorrência emergencial e de flagrante delito, diante do comparecimento de órgão do art. 144 da Constituição, a guarda municipal deverá",a:["prestar todo o apoio à continuidade do atendimento.", "retirar-se imediatamente do local.", "assumir o comando da ocorrência.", "exigir autorização do prefeito para permanecer.", "encerrar o atendimento e lavrar relatório."],c:"Art. 5º, parágrafo único."},
{id:"g1-27",n:2,e:"Quanto aos conflitos que seus integrantes presenciarem, compete à guarda municipal",a:["colaborar com a pacificação, atentando para o respeito aos direitos fundamentais das pessoas.", "intervir com o uso imediato da força.", "apenas registrar o fato, sem intervir.", "conduzir os envolvidos ao juiz de paz.", "encaminhar o caso ao Conselho Tutelar em qualquer hipótese."],c:"Art. 5º, V."},
{id:"g1-28",n:2,e:"A atuação da guarda municipal para prevenir e inibir infrações, prevista no art. 5º, II, se dá",a:["pela presença e vigilância, bem como pela coibição de infrações penais ou administrativas e atos infracionais que atentem contra bens, serviços e instalações municipais.", "pela investigação de crimes e instauração de inquérito.", "pela aplicação de penas administrativas aos infratores.", "exclusivamente pela fiscalização de posturas.", "pela prisão preventiva de suspeitos."],c:"Art. 5º, II."},
{id:"g1-29",n:2,e:"Ao exercer competências de trânsito, a guarda municipal atua",a:["nas vias e logradouros municipais, nos termos do CTB, ou de forma concorrente, mediante convênio com órgão de trânsito estadual ou municipal.", "em qualquer via do país, independentemente de convênio.", "apenas nas rodovias estaduais.", "somente em apoio à Polícia Rodoviária Federal.", "exclusivamente na educação para o trânsito."],c:"Art. 5º, VI."},
{id:"g1-30",n:2,e:"A guarda municipal pode firmar parcerias com órgãos estaduais e da União, ou de Municípios vizinhos, por meio de",a:["convênios ou consórcios.", "decretos estaduais.", "portarias do comandante.", "contratos de terceirização.", "acordos informais."],c:"Art. 5º, X."},
{id:"g1-31",n:2,e:"Para o ordenamento urbano, a guarda municipal deve",a:["integrar-se com os demais órgãos de poder de polícia administrativa.", "substituir os fiscais de posturas.", "aplicar multas tributárias.", "conceder alvarás de funcionamento.", "fiscalizar obras federais."],c:"Art. 5º, XII."},
{id:"g1-32",n:2,e:"Por ocasião da construção de empreendimentos de grande porte, a guarda municipal pode",a:["contribuir no estudo de impacto na segurança local, conforme o plano diretor municipal.", "embargar a obra por conta própria.", "conceder licença ambiental.", "fiscalizar o recolhimento de tributos.", "definir o plano diretor."],c:"Art. 5º, XV."},
{id:"g1-33",n:2,e:"Compete à guarda municipal desenvolver ações de prevenção",a:["primária à violência, isoladamente ou em conjunto com outros órgãos.", "exclusivamente terciária, após o crime.", "apenas no interior das escolas.", "somente com autorização do Ministério Público.", "apenas em parceria com a iniciativa privada."],c:"Art. 5º, XVI."},
{id:"g1-34",n:2,e:"Segundo o art. 5º, IX, a guarda municipal deve interagir com",a:["a sociedade civil para discussão de soluções de problemas e projetos locais voltados à melhoria das condições de segurança.", "os partidos políticos para definir a escala.", "as empresas de segurança privada para dividir competências.", "os tribunais para fixar penas.", "as Forças Armadas para o controle de fronteiras."],c:"Art. 5º, IX."},
{id:"g1-35",n:2,e:"As competências específicas do art. 5º são exercidas",a:["respeitadas as competências dos órgãos federais e estaduais.", "com preferência sobre as da polícia militar.", "independentemente das competências federais.", "apenas quando a polícia não puder atuar.", "mediante autorização prévia do governador."],c:"Caput do art. 5º."},
{id:"g1-36",n:2,e:"Segundo o STF, no julgamento do Tema 656 da repercussão geral (2025), as guardas municipais podem realizar",a:["policiamento ostensivo e comunitário, excluída qualquer atividade de polícia judiciária.", "investigação criminal e instauração de inquérito.", "policiamento ostensivo estadual, em substituição à polícia militar.", "apenas a proteção de prédios públicos.", "atividades de polícia judiciária, sob controle do delegado."],c:"Tese do Tema 656."},
{id:"g1-37",n:2,e:"De acordo com a tese do Tema 656 do STF, as guardas municipais",a:["são submetidas ao controle externo da atividade policial pelo Ministério Público.", "não se submetem a nenhum controle externo.", "são controladas exclusivamente pelo Tribunal de Contas.", "são controladas pela polícia militar.", "são controladas pelo Poder Judiciário estadual."],c:"Tese do Tema 656."},
{id:"g1-38",n:2,e:"Na ADPF 995, o STF reconheceu que as guardas municipais",a:["integram o Sistema de Segurança Pública.", "são órgãos auxiliares das Forças Armadas.", "não podem portar arma de fogo.", "são instituições de caráter militar.", "podem exercer funções de polícia judiciária."],c:"ADPF 995."},
{id:"g1-39",n:2,tx:"tg1",e:"No caso narrado, ao se deparar com o motociclista ferido, a equipe agiu conforme a lei porque",a:["prestou o atendimento direta e imediatamente à ocorrência emergencial.", "aguardou a chegada da polícia para agir.", "limitou-se a registrar a ocorrência.", "encaminhou a vítima ao delegado de polícia.", "assumiu a investigação do acidente."],c:"Art. 5º, XIII."},
{id:"g1-40",n:2,tx:"tg1",e:"No caso narrado, a postura da equipe após a chegada da polícia militar está de acordo com a lei porque a guarda",a:["prestou todo o apoio à continuidade do atendimento.", "assumiu o comando da ocorrência.", "retirou-se sem prestar informações.", "entregou o caso ao Ministério Público.", "exigiu a lavratura do flagrante na base da guarda."],c:"Art. 5º, parágrafo único."},
{id:"g1-41",n:3,e:"Assinale a alternativa INCORRETA de acordo com a Lei 13.022/2014.",a:["As guardas municipais são instituições de caráter militar, armadas conforme previsto em lei.", "Incumbe às guardas municipais a proteção municipal preventiva.", "São ressalvadas as competências da União, dos Estados e do Distrito Federal.", "O patrulhamento preventivo é princípio mínimo de atuação.", "O uso progressivo da força é princípio mínimo de atuação."],c:"O caráter é civil."},
{id:"g1-42",n:3,e:"Assinale a alternativa INCORRETA quanto aos bens protegidos pela guarda municipal.",a:["Os bens dominiais estão excluídos da proteção da guarda.", "Os bens de uso comum estão incluídos.", "Os bens de uso especial estão incluídos.", "Logradouros públicos municipais estão incluídos.", "Instalações do Município estão incluídas."],c:"O parágrafo único do art. 4º inclui os dominiais."},
{id:"g1-43",n:3,e:"Considere as afirmações: I. Diante de flagrante, a guarda encaminha o autor ao delegado de polícia. II. A preservação do local do crime é obrigatória em todos os casos. III. Chegando a polícia, a guarda presta apoio à continuidade do atendimento. Está correto o que se afirma em",a:["I e III, apenas.", "I, II e III.", "I e II, apenas.", "II e III, apenas.", "III, apenas."],c:"II erra: é quando possível e sempre que necessário."},
{id:"g1-44",n:3,e:"Considere as afirmações: I. Os princípios do art. 3º são mínimos. II. O uso da força pela guarda é progressivo. III. O patrulhamento previsto como princípio é ostensivo e repressivo. Está correto o que se afirma em",a:["I e II, apenas.", "I, II e III.", "I e III, apenas.", "II e III, apenas.", "I, apenas."],c:"O princípio é patrulhamento preventivo."},
{id:"g1-45",n:3,e:"Segundo a tese do Tema 656 do STF, ao exercer ações de segurança urbana, as guardas municipais devem",a:["respeitar as atribuições dos demais órgãos de segurança pública e não exercer atividade de polícia judiciária.", "substituir a polícia militar no policiamento ostensivo.", "conduzir inquéritos policiais em crimes de menor potencial ofensivo.", "atuar apenas em bens de uso especial.", "submeter-se ao controle externo do Tribunal de Justiça."],c:"Tese do Tema 656."},
{id:"g1-46",n:3,e:"Assinale a alternativa que associa corretamente o inciso do art. 5º à competência.",a:["XIV: encaminhar ao delegado de polícia, diante de flagrante delito, o autor da infração.", "XIII: auxiliar na segurança de grandes eventos.", "XVIII: exercer competências de trânsito.", "VI: atuar na segurança escolar.", "XVII: atender ocorrências emergenciais."],c:"XIV é o flagrante; os demais estão trocados."},
{id:"g1-47",n:3,e:"Assinale a alternativa que associa corretamente o inciso do art. 5º à competência.",a:["XIII: garantir o atendimento de ocorrências emergenciais.", "XIV: proteger o patrimônio ecológico.", "V: estudo de impacto em empreendimentos de grande porte.", "I: segurança escolar.", "XV: pacificação de conflitos presenciados."],c:"XIII é a ocorrência emergencial."},
{id:"g1-48",n:3,e:"Na segurança escolar, segundo o art. 5º, XVIII, a guarda municipal participa de ações educativas com",a:["o corpo discente e docente das unidades de ensino municipal.", "os pais dos alunos das escolas particulares, com exclusividade.", "os diretores das escolas estaduais apenas.", "a Secretaria Estadual de Educação.", "os conselhos tutelares, que coordenam a ação."],c:"Art. 5º, XVIII."},
{id:"g1-49",n:3,e:"Assinale a alternativa em que a substituição altera o sentido da lei.",a:["“proteção municipal preventiva” por “proteção municipal repressiva”.", "“instituições de caráter civil” por “instituições civis”.", "“uso progressivo da força” por “uso da força de forma progressiva”.", "“patrulhamento preventivo” por “patrulhamento de caráter preventivo”.", "“preservação da vida” por “preservar a vida”."],c:"Preventiva e repressiva têm sentidos opostos."},
{id:"g1-50",n:3,e:"Segundo a lei, a guarda municipal pode colaborar ou atuar conjuntamente com",a:["órgãos de segurança pública da União, dos Estados e do Distrito Federal ou de congêneres de Municípios vizinhos.", "apenas a polícia militar de seu Estado.", "empresas de segurança privada, com exclusividade.", "as Forças Armadas, como força auxiliar.", "somente as guardas de Municípios da mesma região metropolitana."],c:"Art. 5º, parágrafo único."},
{id:"g1-51",n:3,tx:"tg1",e:"No caso narrado, a equipe deixou o portão do galpão como estava e impediu a entrada de curiosos até a chegada da perícia. Essa conduta corresponde a",a:["preservar o local do crime, quando possível e sempre que necessário.", "usar a força de forma progressiva.", "exercer competência de trânsito.", "colaborar com a defesa civil.", "atuar na segurança escolar."],c:"Art. 5º, XIV."},
{id:"g1-52",n:3,tx:"tg1",e:"No caso narrado, o galpão abandonado onde o furto ocorreu pertence à prefeitura e não tem uso público. Trata-se de bem",a:["dominial, também protegido pela guarda municipal.", "de uso especial, único protegido pela guarda.", "de uso comum, protegido pela guarda.", "particular, fora da proteção da guarda.", "dominial, excluído da proteção da guarda."],c:"Art. 4º, parágrafo único: os dominiais estão incluídos."},
{id:"g1-53",n:3,tx:"tg1",e:"No caso narrado, se a equipe tivesse algemado e agredido o suspeito que já estava rendido, violaria principalmente o princípio",a:["do uso progressivo da força.", "do patrulhamento preventivo.", "do compromisso com a evolução social da comunidade.", "da competência geral sobre logradouros.", "da cooperação com a defesa civil."],c:"A força deve ser proporcional e progressiva à resistência."},
{id:"g1-54",n:3,e:"Assinale a alternativa correta sobre a decisão do STF na ADPF 1214 (2026).",a:["Os Municípios não podem substituir a denominação “Guarda Municipal” por “Polícia Municipal” ou denominação similar.", "Os Municípios podem adotar a denominação “Polícia Municipal” por lei local.", "A guarda municipal passou a ter caráter militar.", "As guardas municipais deixaram de integrar a segurança pública.", "A denominação passou a ser escolhida por decreto do prefeito."],c:"Tese da ADPF 1214."},
{id:"g1-55",n:3,e:"Assinale a alternativa INCORRETA sobre as competências específicas das guardas municipais.",a:["A guarda municipal pode instaurar inquérito policial nos crimes ocorridos em bens municipais.", "A guarda municipal pode auxiliar na proteção de autoridades e dignatários.", "A guarda municipal pode cooperar com a defesa civil.", "A guarda municipal pode exercer competências de trânsito.", "A guarda municipal pode atuar na segurança escolar."],c:"Inquérito é atividade de polícia judiciária, excluída das guardas."},
{id:"g1-56",n:3,e:"A expressão “ressalvadas as competências da União, dos Estados e do Distrito Federal”, no art. 2º, significa que a guarda municipal",a:["exerce sua função sem invadir as atribuições desses entes.", "está subordinada ao governador do Estado.", "pode substituir as polícias estaduais quando necessário.", "depende de autorização federal para atuar.", "exerce competência exclusiva sobre a segurança pública."],c:"A ressalva preserva as competências dos outros entes."},
{id:"g1-57",n:3,e:"Considere as afirmações: I. A guarda pode atuar nas vias municipais conforme o CTB. II. Pode exercer competência de trânsito de forma concorrente, mediante convênio. III. Pode fiscalizar o trânsito em rodovias federais por ato próprio. Está correto o que se afirma em",a:["I e II, apenas.", "I, II e III.", "I e III, apenas.", "II e III, apenas.", "III, apenas."],c:"Art. 5º, VI. Rodovia federal não é via municipal."},
{id:"g1-58",n:3,e:"De acordo com a Lei 13.022/2014, é correto afirmar que",a:["a guarda municipal deve articular-se com os órgãos municipais de políticas sociais, visando à adoção de ações interdisciplinares de segurança.", "a guarda municipal é órgão de polícia judiciária do Município.", "os princípios de atuação das guardas são definidos exclusivamente por lei municipal.", "as guardas municipais são forças auxiliares e reserva do Exército.", "a guarda municipal só pode atuar em bens de uso especial."],c:"Art. 5º, XI."},
{id:"g1-59",n:3,e:"Assinale a alternativa que contém apenas competências específicas previstas no art. 5º da Lei 13.022/2014.",a:["Cooperar com a defesa civil; auxiliar na segurança de grandes eventos; atuar na segurança escolar.", "Instaurar inquérito; cooperar com a defesa civil; atuar na segurança escolar.", "Auxiliar na segurança de grandes eventos; julgar infrações de trânsito; proteger o patrimônio cultural.", "Policiar fronteiras; atuar na segurança escolar; cooperar com a defesa civil.", "Lavrar auto de prisão em flagrante; proteger autoridades; zelar por prédios públicos."],c:"Incisos VIII, XVII e XVIII. Inquérito e auto de prisão em flagrante cabem à polícia judiciária."},
{id:"g1-60",n:3,e:"Assinale a alternativa correta sobre o art. 1º da Lei 13.022/2014.",a:["A lei institui normas gerais, cabendo aos Municípios complementá-las sem contrariá-las.", "A lei proíbe os Municípios de legislar sobre suas guardas.", "A lei regulamenta o art. 144, § 5º, que trata das polícias militares.", "A lei só se aplica às guardas criadas depois de 2014.", "A lei institui normas específicas para cada guarda."],c:"Normas gerais definem o piso comum; a lei municipal completa."}
];

BANCO["gm-2"] = [
{id:"g2-01",n:1,e:"Segundo a Lei 13.022/2014, o Município pode criar sua guarda municipal por meio de",a:["lei.", "decreto.", "portaria.", "resolução da Câmara.", "convênio com o Estado."],c:"Art. 6º."},
{id:"g2-02",n:1,e:"A guarda municipal é subordinada ao",a:["chefe do Poder Executivo municipal.", "governador do Estado.", "presidente da Câmara Municipal.", "delegado de polícia.", "juiz da comarca."],c:"Art. 6º, parágrafo único."},
{id:"g2-03",n:1,e:"Em Municípios com até 50 mil habitantes, o efetivo da guarda não pode superar",a:["0,4% da população.", "0,3% da população.", "0,2% da população.", "0,5% da população.", "1% da população."],c:"Art. 7º, I."},
{id:"g2-04",n:1,e:"Em Municípios com mais de 50 mil e menos de 500 mil habitantes, o efetivo da guarda não pode superar",a:["0,3% da população.", "0,4% da população.", "0,2% da população.", "0,1% da população.", "0,5% da população."],c:"Art. 7º, II."},
{id:"g2-05",n:1,e:"A guarda municipal é formada por servidores públicos integrantes de",a:["carreira única e plano de cargos e remuneração.", "carreiras múltiplas, conforme a especialidade.", "cargos comissionados de livre nomeação.", "contratos temporários.", "quadro da polícia militar cedido ao Município."],c:"Art. 9º."},
{id:"g2-06",n:1,e:"É requisito básico para investidura em cargo da guarda municipal a",a:["nacionalidade brasileira.", "naturalidade do próprio Município.", "residência no Município há mais de dois anos.", "filiação partidária.", "experiência prévia em segurança."],c:"Art. 10, I."},
{id:"g2-07",n:1,e:"O nível de escolaridade exigido como requisito básico pela lei é",a:["nível médio completo.", "nível fundamental completo.", "nível superior completo.", "nível técnico em segurança.", "pós-graduação."],c:"Art. 10, IV."},
{id:"g2-08",n:1,e:"A idade mínima exigida pela lei para investidura na guarda municipal é de",a:["18 anos.", "21 anos.", "16 anos.", "20 anos.", "25 anos."],c:"Art. 10, V."},
{id:"g2-09",n:1,e:"O controle externo da guarda municipal é exercido por",a:["ouvidoria.", "corregedoria.", "polícia militar.", "Câmara de Vereadores, diretamente.", "Tribunal de Justiça."],c:"Art. 13, II."},
{id:"g2-10",n:1,e:"O controle interno da guarda municipal é exercido por",a:["corregedoria.", "ouvidoria.", "Ministério Público.", "Tribunal de Contas.", "conselho comunitário."],c:"Art. 13, I."},
{id:"g2-11",n:1,e:"Segundo a lei, as guardas municipais não podem ficar sujeitas a regulamentos disciplinares de natureza",a:["militar.", "civil.", "administrativa.", "municipal.", "ética."],c:"Art. 14, parágrafo único."},
{id:"g2-12",n:1,e:"Aos guardas municipais é autorizado o porte de arma de fogo",a:["conforme previsto em lei.", "em qualquer circunstância.", "somente durante o serviço noturno.", "apenas com autorização do prefeito.", "apenas nas capitais."],c:"Art. 16."},
{id:"g2-13",n:1,e:"A linha telefônica destinada pela Anatel aos Municípios que possuem guarda municipal é a de número",a:["153.", "190.", "192.", "193.", "197."],c:"Art. 17."},
{id:"g2-14",n:1,e:"O uniforme das guardas municipais deve ser padronizado, preferencialmente na cor",a:["azul-marinho.", "cinza.", "preta.", "verde-oliva.", "caqui."],c:"Art. 21."},
{id:"g2-15",n:1,e:"Quando sujeito à prisão antes de condenação definitiva, o guarda municipal tem assegurado o",a:["recolhimento à cela, isoladamente dos demais presos.", "direito à prisão domiciliar.", "direito de responder em liberdade, sempre.", "recolhimento em quartel militar.", "afastamento remunerado em sua casa."],c:"Art. 18."},
{id:"g2-16",n:1,e:"A estrutura hierárquica da guarda municipal não pode utilizar denominação idêntica à das",a:["forças militares.", "guardas de outros Municípios.", "secretarias municipais.", "polícias civis.", "empresas de segurança privada."],c:"Art. 19."},
{id:"g2-17",n:1,e:"Segundo o art. 8º, Municípios limítrofes podem usar reciprocamente os serviços da guarda municipal, de maneira compartilhada, mediante",a:["consórcio público.", "decreto estadual.", "contrato de terceirização.", "portaria do comandante.", "acordo verbal."],c:"Art. 8º."},
{id:"g2-18",n:1,e:"O parágrafo único do art. 22 assegura o uso de outras denominações consagradas pelo uso, como",a:["guarda civil metropolitana.", "polícia municipal.", "polícia comunitária.", "brigada municipal.", "força municipal."],c:"Art. 22, parágrafo único."},
{id:"g2-19",n:1,e:"O exercício das atribuições dos cargos da guarda municipal requer",a:["capacitação específica, com matriz curricular compatível com suas atividades.", "formação militar prévia.", "curso superior em direito.", "estágio em unidade da polícia civil.", "apenas o curso de tiro."],c:"Art. 11."},
{id:"g2-20",n:1,tx:"tg2",e:"No caso narrado, a criação da guarda do Município de Vale Verde por decreto do prefeito",a:["contraria a lei, que exige lei para a criação.", "está correta, pois o decreto basta.", "está correta, desde que a Câmara seja informada.", "contraria a lei, que exige autorização do Estado.", "está correta se o efetivo for pequeno."],c:"Art. 6º: o Município pode criar, por lei, sua guarda."},
{id:"g2-21",n:2,e:"Em Município com mais de 500 mil habitantes, o efetivo máximo é de 0,2% da população, desde que",a:["não seja inferior ao limite da faixa anterior.", "não ultrapasse mil guardas.", "seja aprovado pelo governador.", "haja convênio com a polícia militar.", "a guarda seja armada."],c:"Art. 7º, III."},
{id:"g2-22",n:2,e:"Se houver redução da população em censo ou estimativa oficial do IBGE, a lei garante",a:["a preservação do efetivo existente, que deverá ser ajustado à variação populacional, nos termos de lei municipal.", "a demissão imediata dos guardas excedentes.", "a transferência dos excedentes para a polícia militar.", "a extinção da guarda municipal.", "o congelamento do efetivo por dez anos."],c:"Art. 7º, parágrafo único."},
{id:"g2-23",n:2,e:"É requisito básico de investidura previsto no art. 10 a",a:["quitação com as obrigações militares e eleitorais.", "comprovação de renda mínima.", "residência no Município.", "aprovação em curso de formação militar.", "apresentação de carta de recomendação."],c:"Art. 10, III."},
{id:"g2-24",n:2,e:"A idoneidade moral, requisito de investidura, deve ser comprovada por",a:["investigação social e certidões expedidas perante o Poder Judiciário estadual, federal e distrital.", "declaração do próprio candidato.", "atestado do comandante da guarda.", "certidão da Câmara Municipal.", "entrevista com psicólogo."],c:"Art. 10, VII."},
{id:"g2-25",n:2,e:"Quanto aos requisitos de investidura, o parágrafo único do art. 10 dispõe que",a:["outros requisitos poderão ser estabelecidos em lei municipal.", "nenhum outro requisito pode ser exigido.", "os requisitos podem ser dispensados por decreto.", "os requisitos são definidos pelo Estado.", "os requisitos valem só para guardas armadas."],c:"Art. 10, parágrafo único."},
{id:"g2-26",n:2,e:"A matriz curricular da guarda municipal pode ser adaptada da matriz nacional para formação em segurança pública formulada pela",a:["Secretaria Nacional de Segurança Pública (Senasp) do Ministério da Justiça.", "Secretaria Estadual de Educação.", "Academia de Polícia Militar.", "Escola Superior de Guerra.", "Câmara Municipal."],c:"Art. 11, parágrafo único."},
{id:"g2-27",n:2,e:"O órgão de formação mantido pelo Estado, mediante convênio com os Municípios,",a:["não pode ser o mesmo destinado à formação de forças militares.", "deve ser o mesmo da polícia militar.", "é obrigatório em todos os Estados.", "dispensa a participação dos Municípios.", "só forma guardas armados."],c:"Art. 12, § 3º."},
{id:"g2-28",n:2,e:"A ouvidoria das guardas municipais existe",a:["qualquer que seja o número de servidores da guarda.", "apenas nas guardas com mais de 50 servidores.", "apenas nas guardas que utilizam arma de fogo.", "apenas nas capitais.", "por decisão facultativa do prefeito."],c:"Art. 13, II."},
{id:"g2-29",n:2,e:"A ouvidoria da guarda municipal é",a:["independente em relação à direção da respectiva guarda.", "subordinada ao comandante da guarda.", "composta pelos próprios guardas.", "órgão da polícia militar.", "órgão do Ministério Público."],c:"Art. 13, II."},
{id:"g2-30",n:2,e:"A perda do mandato de corregedores e ouvidores será decidida pela",a:["maioria absoluta da Câmara Municipal, fundada em razão relevante e específica prevista em lei municipal.", "decisão do prefeito.", "maioria simples da Câmara Municipal.", "decisão do comandante da guarda.", "decisão do Ministério Público."],c:"Art. 13, § 2º."},
{id:"g2-31",n:2,e:"O órgão colegiado para controle social das atividades de segurança do Município",a:["poderá ser criado pelo Poder Executivo municipal.", "é obrigatório em todos os Municípios.", "é criado pela polícia militar.", "substitui a ouvidoria.", "é presidido pelo comandante da guarda."],c:"Art. 13, § 1º."},
{id:"g2-32",n:2,e:"Para fins de controle interno, a guarda municipal terá",a:["código de conduta próprio, conforme dispuser lei municipal.", "regulamento disciplinar do Exército.", "regulamento disciplinar da polícia militar estadual.", "código de ética da OAB.", "apenas normas verbais do comandante."],c:"Art. 14."},
{id:"g2-33",n:2,e:"Os cargos em comissão das guardas municipais devem ser providos por",a:["membros efetivos do quadro de carreira do órgão ou entidade.", "pessoas de livre escolha do prefeito, em qualquer caso.", "oficiais da polícia militar.", "delegados de polícia.", "vereadores."],c:"Art. 15, caput."},
{id:"g2-34",n:2,e:"Nos primeiros anos de funcionamento, a guarda municipal poderá ser dirigida por profissional estranho a seus quadros pelo prazo de",a:["4 anos.", "2 anos.", "1 ano.", "5 anos.", "10 anos."],c:"Art. 15, § 1º."},
{id:"g2-35",n:2,e:"Para ocupação dos cargos em todos os níveis da carreira, deverá ser observado",a:["o percentual mínimo para o sexo feminino, definido em lei municipal.", "o percentual máximo de 30% para mulheres.", "a preferência por candidatos com serviço militar.", "a ordem de antiguidade exclusivamente.", "o percentual de 50% para cada sexo, fixado na lei federal."],c:"Art. 15, § 2º."},
{id:"g2-36",n:2,e:"Suspende-se o direito ao porte de arma de fogo do guarda municipal em razão de",a:["restrição médica, decisão judicial ou justificativa da adoção da medida pelo respectivo dirigente.", "férias regulamentares.", "mudança de turno.", "transferência de setor.", "licença-paternidade."],c:"Art. 16, parágrafo único."},
{id:"g2-37",n:2,e:"A Anatel destinará aos Municípios que possuam guarda municipal",a:["linha telefônica de número 153 e faixa exclusiva de frequência de rádio.", "linha 190 e viaturas.", "faixa de televisão educativa.", "apenas faixa de rádio compartilhada com a polícia.", "linha 0800 gratuita."],c:"Art. 17."},
{id:"g2-38",n:2,e:"As guardas que já existiam na data de publicação da lei deveriam adaptar-se às suas disposições no prazo de",a:["2 anos.", "4 anos.", "1 ano.", "5 anos.", "6 meses."],c:"Art. 22, caput."},
{id:"g2-39",n:2,tx:"tg2",e:"No caso narrado, o efetivo de 80 guardas previsto para o Município de Vale Verde, com 40 mil habitantes,",a:["respeita o limite legal, que seria de até 160 guardas.", "ultrapassa o limite legal, que seria de 40 guardas.", "ultrapassa o limite legal, que seria de 60 guardas.", "respeita o limite, que seria de até 80 guardas exatos, por ser 0,2%.", "depende de autorização do Estado."],c:"Até 50 mil habitantes: 0,4% de 40.000 = 160."},
{id:"g2-40",n:2,tx:"tg2",e:"No caso narrado, a proposta de o Município de Vale Verde usar a guarda do Município vizinho Serra Alta, com o qual faz divisa, é possível desde que",a:["seja firmado consórcio público.", "haja decreto do governador.", "os guardas sejam cedidos sem formalidade.", "Serra Alta tenha mais de 500 mil habitantes.", "a Câmara aprove por maioria simples."],c:"Art. 8º: limítrofes, mediante consórcio público."},
{id:"g2-41",n:3,e:"Assinale a alternativa INCORRETA de acordo com a Lei 13.022/2014.",a:["O Município é obrigado a criar guarda municipal quando ultrapassar 50 mil habitantes.", "O Município pode criar, por lei, sua guarda municipal.", "A guarda municipal é subordinada ao chefe do Executivo municipal.", "A guarda é formada por servidores de carreira única.", "Outros requisitos de investidura podem ser fixados em lei municipal."],c:"A criação é faculdade (“pode”)."},
{id:"g2-42",n:3,e:"Um Município tem 300 mil habitantes. Segundo o art. 7º, sua guarda pode ter, no máximo,",a:["900 guardas, desde que esse número não seja inferior ao limite da faixa anterior.", "1.200 guardas.", "600 guardas.", "300 guardas.", "1.500 guardas."],c:"Faixa de 50 mil a 500 mil: 0,3% de 300.000 = 900."},
{id:"g2-43",n:3,e:"Considere as afirmações: I. A corregedoria é obrigatória em guardas com mais de 50 servidores. II. A corregedoria é obrigatória em todas as guardas que usam arma de fogo, ainda que pequenas. III. A ouvidoria só existe nas guardas armadas. Está correto o que se afirma em",a:["I e II, apenas.", "I, II e III.", "I e III, apenas.", "II e III, apenas.", "I, apenas."],c:"A ouvidoria existe em qualquer guarda."},
{id:"g2-44",n:3,e:"Considere as afirmações sobre o art. 15: I. Cargos em comissão são providos por membros efetivos da carreira. II. Nos primeiros 4 anos, a guarda pode ser dirigida por profissional externo, preferencialmente com experiência em segurança. III. A progressão funcional é garantida em todos os níveis. Está correto o que se afirma em",a:["I, II e III.", "I e II, apenas.", "I e III, apenas.", "II e III, apenas.", "I, apenas."],c:"Art. 15, caput e §§ 1º e 3º."},
{id:"g2-45",n:3,e:"Assinale a alternativa que NÃO constitui hipótese de suspensão do porte de arma de fogo prevista no art. 16.",a:["Pedido de vereador.", "Restrição médica.", "Decisão judicial.", "Justificativa da adoção da medida pelo respectivo dirigente.", "Decisão judicial em processo envolvendo o guarda."],c:"Só restrição médica, decisão judicial ou justificativa do dirigente."},
{id:"g2-46",n:3,e:"Assinale a alternativa que NÃO é requisito básico de investidura previsto no art. 10.",a:["Carteira nacional de habilitação.", "Nacionalidade brasileira.", "Gozo dos direitos políticos.", "Aptidão física, mental e psicológica.", "Nível médio completo."],c:"A CNH pode ser exigida por lei municipal, mas não está no art. 10."},
{id:"g2-47",n:3,e:"Segundo o art. 19, a hierarquia da guarda municipal não pode utilizar denominação idêntica à das forças militares quanto a",a:["postos e graduações, títulos, uniformes, distintivos e condecorações.", "apenas postos e graduações.", "apenas uniformes.", "nomes das unidades e bases.", "horários de serviço."],c:"Art. 19."},
{id:"g2-48",n:3,e:"É reconhecida a representatividade das guardas municipais no",a:["Conselho Nacional de Segurança Pública, no Conselho Nacional das Guardas Municipais e no Conselho Nacional de Secretários e Gestores Municipais de Segurança Pública.", "Conselho Nacional de Justiça.", "Conselho Nacional do Ministério Público.", "Conselho de Defesa Nacional.", "Conselho Federal da OAB."],c:"Art. 20."},
{id:"g2-49",n:3,e:"Assinale a alternativa correta sobre o uniforme das guardas municipais.",a:["Deve ser padronizado, preferencialmente na cor azul-marinho.", "Deve ser obrigatoriamente azul-marinho, sob pena de nulidade.", "Pode ser idêntico ao das forças militares.", "É definido pela polícia militar estadual.", "É livre, a critério de cada guarda."],c:"Art. 21: preferencialmente."},
{id:"g2-50",n:3,e:"Considere as afirmações sobre o art. 12: I. É facultada ao Município a criação de órgão de formação. II. Os Municípios podem consorciar-se para esse fim. III. O órgão estadual de formação pode ser o mesmo das forças militares. Está correto o que se afirma em",a:["I e II, apenas.", "I, II e III.", "I e III, apenas.", "II e III, apenas.", "III, apenas."],c:"Art. 12, § 3º veda o mesmo órgão das forças militares."},
{id:"g2-51",n:3,e:"Segundo decisão do STF de 2026 (ADPF 1214), assinale a denominação que um Município NÃO pode adotar para sua guarda.",a:["Polícia Municipal.", "Guarda Civil Metropolitana.", "Guarda Civil Municipal.", "Guarda Metropolitana.", "Guarda Municipal."],c:"O STF vedou a troca por “Polícia Municipal” e similares."},
{id:"g2-52",n:3,e:"Assinale a alternativa correta sobre o controle das guardas municipais.",a:["Os órgãos de controle devem ser próprios, permanentes, autônomos e com atribuições de fiscalização, investigação e auditoria.", "O controle é exercido exclusivamente pela polícia militar.", "A corregedoria é subordinada à ouvidoria.", "O controle social é obrigatório e substitui a ouvidoria.", "O mandato dos corregedores é de livre exoneração pelo prefeito."],c:"Art. 13, caput."},
{id:"g2-53",n:3,e:"Assinale a alternativa INCORRETA.",a:["Municípios de qualquer região podem compartilhar suas guardas por simples convênio.", "Municípios limítrofes podem compartilhar suas guardas mediante consórcio público.", "O compartilhamento previsto no art. 8º é recíproco.", "O art. 8º exige consórcio público.", "O art. 8º se refere a Municípios que fazem divisa."],c:"O art. 8º exige Municípios limítrofes e consórcio público."},
{id:"g2-54",n:3,e:"Assinale a alternativa que associa corretamente o artigo ao conteúdo.",a:["Art. 18: cela separada em prisão antes de condenação definitiva.", "Art. 17: uniforme azul-marinho.", "Art. 21: telefone 153.", "Art. 19: porte de arma de fogo.", "Art. 16: denominações consagradas pelo uso."],c:"Os demais estão trocados."},
{id:"g2-55",n:3,e:"Considere as afirmações: I. As guardas municipais podem adotar regulamento disciplinar da polícia militar. II. As guardas têm código de conduta próprio, conforme lei municipal. III. A corregedoria apura as infrações disciplinares atribuídas aos integrantes do quadro. Está correto o que se afirma em",a:["II e III, apenas.", "I, II e III.", "I e II, apenas.", "I e III, apenas.", "II, apenas."],c:"Art. 14, parágrafo único proíbe regulamento militar."},
{id:"g2-56",n:3,tx:"tg2",e:"No caso narrado, a nomeação de um coronel da reserva, sem vínculo com a guarda, para comandá-la no primeiro ano de funcionamento é",a:["permitida, pois nos primeiros 4 anos a guarda pode ser dirigida por profissional estranho a seus quadros.", "proibida, pois o comando deve ser de membro efetivo desde o início.", "permitida por tempo indeterminado.", "proibida, por se tratar de militar.", "permitida somente com aprovação do Estado."],c:"Art. 15, § 1º."},
{id:"g2-57",n:3,tx:"tg2",e:"No caso narrado, a proposta de que os agentes de Vale Verde usem as patentes de soldado, cabo e sargento",a:["contraria o art. 19, que proíbe denominação idêntica à das forças militares quanto a postos e graduações.", "está de acordo com a lei, desde que aprovada pela Câmara.", "contraria apenas o regulamento da polícia militar.", "está de acordo com a lei, por serem guardas armados.", "é permitida somente para os cargos de comando."],c:"Art. 19."},
{id:"g2-58",n:3,tx:"tg2",e:"No caso narrado, a proposta de dispensar a ouvidoria por ser uma guarda pequena e desarmada",a:["contraria a lei, pois a ouvidoria existe qualquer que seja o número de servidores.", "está correta, pois a ouvidoria só é exigida nas guardas armadas.", "está correta, pois a ouvidoria só é exigida com mais de 50 servidores.", "contraria a lei apenas se a guarda for armada.", "depende de decisão do Ministério Público."],c:"Art. 13, II."},
{id:"g2-59",n:3,e:"Um Município com 40 mil habitantes cria guarda desarmada com 30 servidores. Segundo o art. 13, ele está obrigado a manter",a:["ouvidoria, mas não corregedoria.", "corregedoria e ouvidoria.", "corregedoria, mas não ouvidoria.", "nenhum órgão de controle.", "apenas o conselho de controle social."],c:"Corregedoria só com mais de 50 servidores ou arma de fogo; ouvidoria sempre."},
{id:"g2-60",n:3,e:"Assinale a alternativa correta sobre o art. 22 da Lei 13.022/2014.",a:["A lei se aplica a todas as guardas existentes na data de sua publicação, que deviam adaptar-se em 2 anos.", "A lei se aplica apenas às guardas criadas após sua publicação.", "As guardas existentes ficaram dispensadas de adaptação.", "O prazo de adaptação foi de 4 anos.", "O art. 22 autoriza a denominação “Polícia Municipal”."],c:"Art. 22, caput."}
];

/* ---------- Textos de apoio das questões ---------- */
const TEXTOS = {
tg1: "<strong>Equipe da Guarda atende duas ocorrências na mesma noite</strong><br><br>Durante ronda preventiva no Jardim Proença, uma equipe da Guarda Municipal se deparou com um motociclista caído na via, ferido após uma queda. Os agentes prestaram os primeiros socorros, sinalizaram o local e acionaram o Samu. Quando uma viatura da polícia militar chegou, a equipe repassou as informações e permaneceu dando apoio até a remoção da vítima.<br><br>Pouco depois, a equipe foi chamada a um galpão abandonado que pertence à prefeitura e não tem uso público. Lá, flagrou um homem saindo com fios de cobre retirados da instalação elétrica. O suspeito não resistiu e foi contido sem uso de força além da necessária.<br><br>Os agentes deixaram o portão do galpão como estava, impediram a entrada de curiosos até a chegada da perícia e conduziram o suspeito ao delegado de polícia de plantão.",
tg2: "<strong>Município de Vale Verde discute a criação de sua guarda</strong><br><br>O prefeito de Vale Verde, cidade fictícia de 40 mil habitantes, anunciou que pretende criar a guarda municipal por decreto, com efetivo de 80 agentes, todos desarmados no primeiro momento. Para comandar a corporação no primeiro ano, ele indicou um coronel da reserva da polícia militar, sem vínculo com a guarda.<br><br>O projeto apresentado à imprensa prevê que os agentes usem as patentes de soldado, cabo e sargento e propõe dispensar a ouvidoria, “por se tratar de uma guarda pequena e desarmada”.<br><br>Para cobrir a falta de efetivo nos primeiros meses, a prefeitura estuda usar os serviços da guarda de Serra Alta, município vizinho que faz divisa com Vale Verde.",
tp: "<strong>Guarda vistoria quiosques da orla do lago</strong><br><br>A Guarda Municipal procedeu, na manhã de ontem, à vistoria dos quiosques instalados às margens do lago do parque. A ação atende a um pedido dos frequentadores, que reclamavam do som alto nos fins de semana.<br><br>Os comerciantes foram informados das novas regras e terão 15 dias para se adequar. Segundo a coordenação, o descumprimento implica multa e, em caso de reincidência, a suspensão da licença.<br><br>A medida agradou aos moradores do entorno, com quem a Guarda se reuniu na semana passada. A corporação prefere orientar a multar, mas lembra que as regras a que todos devem obedecer estão afixadas em cada quiosque.",
tq: "<strong>Guarda encontra idoso desaparecido</strong><br><br>Um idoso de 78 anos que estava desaparecido desde a manhã de domingo foi encontrado por agentes da Guarda Municipal na tarde de ontem. Os guardas avistaram-no sentado em um banco da praça central, confuso e com frio.<br><br>Segundo a corporação, a equipe aproximou-se com calma, ofereceu-lhe água e conversou com ele até que se lembrasse do nome da filha. Não se sabe ainda como ele chegou ao centro.<br><br>A família agradeceu aos agentes e disse que nunca se esquecerá do cuidado com que o idoso foi tratado. Encaminhá-lo-ão, nos próximos dias, a uma avaliação médica.",
tr: "<strong>Guarda reforça rondas no terminal à noite</strong><br><br>A partir da próxima segunda-feira, a Guarda Municipal reforçará as rondas no terminal central, das 18h às 23h. A medida atende às reclamações de passageiros, que relataram furtos à saída das plataformas.<br><br>Os agentes circularão a pé e ficarão à disposição dos usuários para qualquer orientação. Segundo a coordenação, a operação deve durar de 10 a 30 de novembro e poderá ser estendida a outros terminais.<br><br>Há duas semanas, a corporação já havia instalado uma base móvel à frente da bilheteria. Quem precisar de ajuda deve dirigir-se a qualquer agente uniformizado.",
ta: "<strong>Bicicleta furtada é localizada após aviso de comerciante</strong><br><br>Uma bicicleta furtada na última quinta-feira foi localizada na manhã de sábado em uma praça da região central. Segundo a Guarda Municipal, um comerciante reconheceu o veículo pela foto que o dono havia divulgado nas redes sociais e acionou a equipe pelo telefone 153.<br><br>Os guardas encontraram a bicicleta presa a um poste, sem o cadeado original. Ninguém foi detido. O dono, um estudante de 19 anos, retirou o veículo no mesmo dia e disse que pretende instalar um rastreador.<br><br>De acordo com a corporação, a colaboração de moradores e comerciantes tem sido decisiva para a recuperação de objetos furtados na região.",
tb: "<strong>O ponto de ônibus</strong><br><br>Todo dia, às 6h40, a mesma senhora chega ao ponto antes de mim. Traz uma sacola de pano e um guarda-chuva, faça sol ou faça chuva. Nunca trocamos uma palavra além do “bom dia”, mas já sei que ela desce três pontos depois do meu e que prefere o banco da janela.<br><br>Na semana passada, ela não apareceu. O ônibus chegou, eu subi e passei a viagem inteira olhando para o banco da janela, vazio. Fiquei imaginando doenças, mudanças, aposentadorias. Nenhuma das hipóteses era da minha conta, e todas me ocuparam até o trabalho.<br><br>Na segunda-feira, lá estava ela, com a sacola e o guarda-chuva. Disse “bom dia”, como sempre. Respondi “bom dia”, como sempre. Mas desta vez eu sorri, e ela também. A cidade grande tem dessas coisas: a gente só percebe que conhecia alguém quando sente a falta dele.",
tc: "<strong>Câmera não substitui gente</strong><br><br>Toda vez que um bairro registra uma sequência de furtos, a primeira resposta é a mesma: instalar câmeras. Elas são úteis, sem dúvida. Ajudam a identificar suspeitos e a reconstituir ocorrências. Mas é um erro acreditar que, sozinhas, tornam a rua segura.<br><br>A câmera registra; ela não acolhe a vítima, não orienta o pedestre perdido, não percebe o morador que mudou de comportamento. Essas tarefas dependem de pessoas presentes no território, que conhecem a comunidade e são conhecidas por ela.<br><br>Dirão que contratar e formar agentes custa caro. Custa. Mas um equipamento que apenas grava o problema, sem ninguém para agir, sai mais caro ainda, porque transforma a prevenção em arquivo.<br><br>Câmeras devem existir. Só não podem servir de desculpa para tirar as pessoas das ruas.",
td: "<strong>Por que algumas ruas são mais quentes</strong><br><br>Em uma mesma cidade, a temperatura pode variar bastante de um bairro para outro. O fenômeno, conhecido como ilha de calor, aparece com mais força em áreas com muito asfalto, concreto e pouca vegetação.<br><br>Isso acontece porque esses materiais absorvem o calor do sol durante o dia e o liberam lentamente à noite. As árvores, ao contrário, fazem sombra e liberam umidade pelas folhas, o que ajuda a resfriar o ambiente.<br><br>Por esse motivo, o plantio de árvores e a criação de áreas verdes estão entre as medidas mais citadas por especialistas para reduzir o calor nas cidades.",
te: "<strong>Canção do exílio</strong> (trecho), de Gonçalves Dias, 1843 — domínio público<br><br>Minha terra tem palmeiras,<br>Onde canta o Sabiá;<br>As aves, que aqui gorjeiam,<br>Não gorjeiam como lá.<br><br>Nosso céu tem mais estrelas,<br>Nossas várzeas têm mais flores,<br>Nossos bosques têm mais vida,<br>Nossa vida mais amores.",
tf: "<strong>Tirinha (descrição)</strong><br><br>Quadro 1: um homem passa por uma praça com lixo espalhado pelo chão e reclama em voz alta: “Ninguém cuida desta cidade!”.<br>Quadro 2: ele termina de beber um refrigerante em lata.<br>Quadro 3: ele joga a lata no chão, ao lado de uma lixeira vazia, e segue andando, ainda resmungando: “Um absurdo...”.",
tg: "<strong>Orientações ao pedestre</strong><br><br>Atravesse sempre na faixa e, se houver semáforo, aguarde o sinal verde para pedestres. Antes de atravessar, olhe para os dois lados, mesmo em ruas de mão única. À noite, prefira roupas claras. Nunca atravesse entre veículos estacionados.",
th: "<strong>Guarda orienta moradores após série de furtos em condomínios</strong><br><br>A Guarda Municipal reuniu moradores de três condomínios de um bairro da região sul para orientá-los sobre medidas de prevenção. Segundo o inspetor responsável, que coordenou o encontro, os furtos ocorreram sempre à noite, quando os portões ficam abertos por mais tempo.<br><br>Os síndicos receberam um roteiro com cuidados simples, cujo objetivo é reduzir as chances de novas ocorrências. Entre eles, estão a troca de fechaduras e a instalação de iluminação nas áreas comuns. Isso, de acordo com a corporação, já ajudou a diminuir os casos em outros bairros.<br><br>Os moradores também foram convidados a registrar qualquer atitude suspeita pelo telefone 153. Quem tiver imagens de câmeras pode entregá-las à equipe, que as analisará.",
ti: "<strong>Rua cheia, cidade viva</strong><br><br>Há quem defenda que a segurança de uma cidade depende apenas de policiamento. Essa é uma ideia incompleta. A rua movimentada, onde há comércio aberto, gente caminhando e luz acesa, desestimula a ação de criminosos, que preferem lugares vazios.<br><br>Os moradores de bairros bem cuidados costumam conhecer seus vizinhos. Isso cria uma rede de atenção mútua: quem percebe algo estranho avisa o outro. É essa rede, cuja força depende da convivência, que ajuda a prevenir ocorrências.<br><br>Não se trata de dispensar a guarda ou a polícia, mas de reconhecer que elas atuam melhor com o apoio da comunidade. Esta, por sua vez, só se envolve quando se sente ouvida.",
tj: "<strong>Comerciante tem loja arrombada pela segunda vez no mês</strong><br><br>Uma loja de eletrônicos do centro foi arrombada na madrugada de ontem. Quando a equipe da Guarda Municipal chegou, por volta das 3h, os autores já haviam deixado o local. Segundo vizinhos, eles teriam fugido em um carro escuro.<br><br>Foram levados celulares e um computador. O proprietário, que fechava a loja todos os dias às 19h, contou que instalara um alarme na semana anterior, mas o aparelho não disparou.<br><br>A Guarda informou que as imagens das câmeras da rua serão analisadas nos próximos dias. Se os autores forem identificados, o caso seguirá para a Polícia Civil.",
tk: "<strong>A pressa da avenida</strong><br><br>Todo fim de tarde, a avenida vira um teste de paciência. Os motoristas avançam lentamente, buzinam sem parar e, quase sempre, culpam alguém que nem está ali. Felizmente, há quem prefira esperar com calma.<br><br>Ontem, um senhor parou o carro bem perto da faixa e fez sinal para uma criança atravessar. Ela cruzou depressa, meio assustada, e agradeceu de longe. Ninguém buzinou naquele instante.<br><br>Talvez a cidade mude quando mais gente entender que chegar dois minutos depois raramente é um problema. Atravessar a rua com medo, sim.",
tl: "<strong>Feira noturna terá reforço na segurança</strong><br><br>A partir da próxima sexta-feira, a feira noturna do centro contará com equipes da Guarda Municipal. A medida foi adotada porque os comerciantes registraram, nos últimos meses, uma série de furtos de celulares entre os frequentadores.<br><br>Segundo a coordenação da Guarda, os agentes circularão a pé pelos corredores, para que possam atender rapidamente qualquer chamado. Embora a feira tenha poucas entradas, todas terão um ponto de apoio com rádio.<br><br>Os feirantes aprovaram a iniciativa, mas pedem também melhor iluminação nas ruas próximas. Caso a experiência dê certo, o modelo poderá ser levado a outras feiras da cidade.",
tm: "<strong>Atenção ao que é pequeno</strong><br><br>Muitos acreditam que só os grandes crimes merecem preocupação. Contudo, quem trabalha nas ruas sabe que, quando pequenas desordens são toleradas, o ambiente se degrada e outros problemas aparecem.<br><br>Uma lixeira quebrada ou uma lâmpada apagada parecem detalhes. Mas, à medida que se acumulam, transmitem a ideia de que ninguém cuida do lugar, e quem pretende cometer um delito se sente mais à vontade. Por isso, a manutenção do espaço público não é apenas uma questão estética.<br><br>Isso não significa punir com rigor cada pequena falha, e sim agir cedo. Cuidar do que é pequeno, portanto, é também uma forma de prevenção.",
tn: "<strong>Bairro tem aumento de furtos em residências</strong><br><br>Na última semana, foram registrados três furtos em residências do bairro, todos no período da tarde. Segundo a Guarda Municipal, os autores aproveitaram horários em que os moradores estavam no trabalho.<br><br>Faltam dois agentes na escala da região, informou o comando, que prometeu reforço até o fim do mês. Em reunião com a corporação, a maioria dos moradores aprovou a criação de uma rede de vizinhos por aplicativo.<br><br>O comandante pediu que qualquer movimentação estranha seja comunicada pelo telefone 153. Seguem anexas ao relatório entregue ao delegado as imagens das câmeras da rua. É necessário cautela antes de divulgar fotos de suspeitos nas redes."
};

/* ---------- Estado ---------- */
const KEY = "rota-gm-campinas-v2";
function novoEstado(){ return {acesso:false, aprovados:{}, tentativas:{}, vistas:{}, atualizado:0}; }
let S = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)) || novoEstado(); }catch(e){ return novoEstado(); } })();
let docRef = null;
let IS_OWNER = false;
async function salvar(){
  S.atualizado = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(docRef){ try{ await docRef.set({estado: JSON.stringify(S), atualizado: S.atualizado}); }catch(e){} }
}
(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await claude.use("db"); const user = await claude.use("user");
    if(user){ try{ IS_OWNER = !!(await user.isOwner()); if(IS_OWNER && V.tela==="posto") render(); }catch(e){} }
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    docRef = db.doc("data/users/" + uid + "/progresso");
    const snap = await docRef.get();
    if(snap.exists){
      const remoto = JSON.parse(snap.data().estado);
      if((remoto.atualizado||0) > (S.atualizado||0)){ S = remoto; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
    } else if(S.atualizado){ salvar(); }
  }catch(e){}
})();

function qrFake(){
  let r=""; const n=21; let seed=7;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const olho=(x,y,ox,oy)=>{ const dx=x-ox, dy=y-oy; if(dx<0||dy<0||dx>6||dy>6) return null; return (dx===0||dy===0||dx===6||dy===6||(dx>1&&dx<5&&dy>1&&dy<5)); };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    let v = olho(x,y,0,0); if(v===null) v = olho(x,y,n-7,0); if(v===null) v = olho(x,y,0,n-7);
    if(v===null) v = rnd()>.5;
    if(v) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" role="img" aria-label="QR Code de demonstração" fill="currentColor">${r}</svg>`;
}

function txtDe(el){ return (el.textContent||"").replace(/\s+/g," ").trim(); }
function montarAula(art, pid){

  const hs = [...art.querySelectorAll(":scope > h3")];
  if(hs.length > 2){

    nav.querySelectorAll("a").forEach(a=>a.onclick = e=>{ e.preventDefault(); hs[+a.dataset.i].scrollIntoView({block:"start"}); });
    hs[0].before(nav);
  }
  art.querySelectorAll(".tabela > table").forEach(tb=>{
    const rows = [...tb.rows].map(r=>[...r.cells]); if(rows.length < 2) return;
    const head = rows[0].map(txtDe), box = tb.parentElement, corpo = rows.slice(1);
    if(head.length !== 2) return;
    const w = document.createElement("div");
    if(/^armadilha/i.test(head[0])){
      w.innerHTML = '<ul class="pegas">' + corpo.map(r=>`<li><span class="pg-t">${r[0].innerHTML}</span> — ${r[1].innerHTML}</li>`).join("") + '</ul>';
    } else if(/fala corrente|errad|evite|não diga/i.test(head[0]) && /norma|cert|use|padrão/i.test(head[1])){
      w.innerHTML = '<ol class="exs">' + corpo.map(r=>`<li><span class="rej">${r[0].innerHTML}</span>${r[1].innerHTML}</li>`).join("") + '</ol>' + (art.querySelector(".exs") ? "" : '<p class="exs-nota">O asterisco marca a forma que a norma-padrão não aceita.</p>');
    } else {
      w.innerHTML = '<dl class="pares">' + (head[0]||head[1] ? `<div class="pares-h"><dt>${head[0]}</dt><dd>${head[1]}</dd></div>` : "") + corpo.map(r=>`<div><dt>${r[0].innerHTML}</dt><dd>${r[1].innerHTML}</dd></div>`).join("") + '</dl>';
    }
    box.replaceWith(...w.childNodes);
  });
  art.querySelectorAll(".box").forEach(b=>{ const a = document.createElement("aside"); a.className = "nota"; a.innerHTML = b.innerHTML; b.replaceWith(a); });
  art.querySelectorAll("ol.alts").forEach(ol=>{
    let n = ol.nextElementSibling;
    if(n && n.tagName==="P" && /^Resposta:/.test(txtDe(n))){ const d = document.createElement("details"); d.className = "gab"; d.innerHTML = "<summary>Ver resposta comentada</summary>"; n.before(d); d.appendChild(n); }
  });

  const nq = (BANCO[pid]||[]).length;
  if(nq){ const fim = document.createElement("p"); fim.className = "fim-aula"; fim.innerHTML = `Terminou a leitura? <a href="#">Faça as questões deste posto</a>: são ${nq}, e cada tentativa sorteia ${N_QUESTOES}.`; fim.querySelector("a").onclick = e=>{ e.preventDefault(); ir({aba:"questoes"}); }; art.appendChild(fim); }
}

/* ---------- Sorteio: evita repetir a última tentativa e prioriza as menos vistas ---------- */
const POR_NIVEL = {1:3, 2:4, 3:3}; // fáceis, médias, difíceis em cada tentativa
function sortear(pid){
  const tent = S.tentativas[pid] || [];
  const ultima = new Set(tent.length ? tent[tent.length-1].ids : []);
  const peso = q => (S.vistas[q.id]||0)*10 + (ultima.has(q.id) ? 100 : 0) + Math.random();
  const banco = BANCO[pid].slice().sort((a,b)=>peso(a)-peso(b));
  if(!banco.some(q=>q.n)) return banco.slice(0, N_QUESTOES);
  let sel = [];
  [1,2,3].forEach(n=>{ sel = sel.concat(banco.filter(q=>q.n===n).slice(0, POR_NIVEL[n])); });
  if(sel.length < N_QUESTOES) sel = sel.concat(banco.filter(q=>!sel.includes(q)).slice(0, N_QUESTOES-sel.length));
  return sel.sort((a,b)=>(a.n||0)-(b.n||0));
}
function iniciarProva(pid){
  Q = {pid, i:0, itens: sortear(pid).map(q=>({q, ordem: embaralhar(q.a.map((txt,i)=>({txt, certa:i===0}))), escolha:null}))};
  ir({tela:"prova"});
}

/* ---------- Prova ---------- */
function telaProva(){
  const it = Q.itens[Q.i], ultima = Q.i===Q.itens.length-1;
  $app.innerHTML = `
  <section class="topico">
    <button class="voltar" id="sair">‹ Sair das questões</button>
    <div class="qtopo"><span>Questão ${Q.i+1} de ${Q.itens.length}</span><span>Nota mínima: ${NOTA_MIN}</span></div>
    <div class="bar" aria-hidden="true"><i style="width:${(Q.i/Q.itens.length*100)}%"></i></div>
    <div class="qcard">
      ${it.q.tx ? `<blockquote class="txt">${TEXTOS[it.q.tx]}</blockquote>` : ""}<p class="enun">${it.q.e}</p>
      ${it.ordem.map((o,k)=>`<button class="alt" data-k="${k}" aria-pressed="${it.escolha===k}"><span class="l">${LETRAS[k]}</span><span>${o.txt}</span></button>`).join("")}
    </div>
    <div class="acoes">
      <button class="btn sec" id="ant" ${Q.i===0?"disabled":""}>Anterior</button>
      <button class="btn" id="prox" ${it.escolha===null?"disabled":""}>${ultima ? "Corrigir" : "Próxima"}</button>
    </div>
  </section>`;
  $app.querySelectorAll(".alt").forEach(b=>b.onclick=()=>{ it.escolha = +b.dataset.k; telaProva(); });
  document.getElementById("ant").onclick = ()=>{ Q.i--; telaProva(); };
  document.getElementById("prox").onclick = ()=>{ if(ultima) corrigir(); else { Q.i++; telaProva(); } };
  document.getElementById("sair").onclick = ()=>{ if(confirm("Sair agora descarta esta tentativa. Continuar?")){ const pid=Q.pid; Q=null; ir({tela:"posto", posto:pid, aba:"questoes"}); } };
}
async function corrigir(){
  const nota = Q.itens.filter(it=>it.ordem[it.escolha].certa).length;
  (S.tentativas[Q.pid] = S.tentativas[Q.pid] || []).push({nota, data:Date.now(), ids:Q.itens.map(it=>it.q.id)});
  Q.itens.forEach(it=>{ S.vistas[it.q.id] = (S.vistas[it.q.id]||0)+1; });
  if(nota>=NOTA_MIN && !S.aprovados[Q.pid]) S.aprovados[Q.pid] = {nota, data:Date.now()};
  Q.nota = nota;
  await salvar();
  ir({tela:"resultado"});
}

/* ---------- Resultado ---------- */
function telaResultado(){
  const ok = Q.nota>=NOTA_MIN, p = POSTO[Q.pid], prox = POSTO[p.tr.id+"-"+(p.n+2)];
  const revisao = Q.itens.map((it,n)=>{
    const acertou = it.ordem[it.escolha].certa, certa = it.ordem.findIndex(o=>o.certa);
    return `<div class="rev ${acertou?"ok":"bad"}"><div class="st">Questão ${n+1}: ${acertou?"acertou":"errou"}</div>
      <p>${it.q.e}</p>${acertou ? "" : `<p>Sua resposta: ${LETRAS[it.escolha]}) ${it.ordem[it.escolha].txt}</p>`}
      <p><strong>Correta: ${LETRAS[certa]}) ${it.ordem[certa].txt}</strong></p><p class="ref">${it.q.c}</p></div>`;
  }).join("");
  $app.innerHTML = `
  <section class="topico">
    <div class="res ${ok?"ok":"bad"}">
      <div class="nota">${Q.nota}/10</div>
      <h2>${ok ? (prox ? "Posto concluído. O próximo foi liberado." : "Trilha concluída.") : "Ainda não foi desta vez."}</h2>
      <p>${ok ? (prox ? `Próximo: ${prox.t}.` : `Você terminou a trilha de ${p.tr.nome}.`) : `Você precisa de ${NOTA_MIN} acertos. Revise a correção abaixo e tente de novo: as questões serão outras.`}</p>
      <div class="acoes">
        ${ok && prox ? `<button class="btn" id="seguir">Ir para o próximo posto</button>` : (ok ? "" : `<button class="btn" id="denovo">Tentar de novo</button>`)}
        <button class="btn sec" id="trilha">Ver a trilha</button>
      </div>
    </div>
    <h2 style="font-size:24px;margin:8px 0">Correção comentada</h2>
    ${revisao}
  </section>`;
  const s = document.getElementById("seguir"); if(s) s.onclick = ()=>ir({tela:"posto", posto:prox.id, aba:"aula"});
  const d = document.getElementById("denovo"); if(d) d.onclick = ()=>iniciarProva(p.id);
  document.getElementById("trilha").onclick = ()=>ir({tela:"trilha", trilha:p.tr.id});
}

/* ---------- Revisão do banco (visível só para o dono) ---------- */
function telaBanco(){
  const p = POSTO[V.posto], qs = BANCO[p.id] || [];
  const nome = {1:"Fácil",2:"Média",3:"Difícil"};
  const cont = [1,2,3].map(n=>`${nome[n]}: ${qs.filter(q=>q.n===n).length}`).join(" · ");
  $app.innerHTML = `<section class="topico"><button class="voltar" id="voltar">‹ ${p.t}</button><h2>Banco de questões</h2><p class="meta">${qs.length} questões · ${cont} · a alternativa correta aparece em negrito</p>${qs.map((q,i)=>`<div class="rev ok"><div class="st">${i+1}. ${nome[q.n]||""} · ${q.id}</div>${q.tx?`<blockquote class="txt">${TEXTOS[q.tx]}</blockquote>`:""}<p>${q.e}</p><ol class="alts" type="A">${q.a.map((x,k)=>`<li>${k===0?`<strong>${x}</strong>`:x}</li>`).join("")}</ol><p class="ref">${q.c}</p></div>`).join("")}</section>`;
  document.getElementById("voltar").onclick = ()=>ir({tela:"posto", aba:"questoes"});
}

/* ---------- Guia do TAF (Anexo II do edital) ---------- */
function telaTAF(){
  $app.innerHTML = `
  <section class="topico">
    <button class="voltar" data-go="painel">‹ Voltar ao painel</button>
    <h2>Guia do Teste de Aptidão Física</h2>

    <article class="aula">
      <h3>Por que o TAF pesa tanto</h3>
      <p>A nota final é a soma da prova objetiva (até 50 pontos) com a nota do TAF (até 100 pontos), e a maior nota no TAF é o primeiro critério de desempate. <span class="ref">(itens 13.31, 15.1 e 15.2)</span></p>
      <h3>Como a nota é calculada</h3>
      <p>Cada uma das cinco provas vale de 20 a 100 pontos, e a nota do TAF é a média das cinco. Para seguir no concurso, é preciso média de pelo menos 50 e no mínimo 20 pontos em cada prova. Não há segunda tentativa. <span class="ref">(itens 13.27 a 13.30)</span></p>
      <h3>Índices mínimo (20 pontos) e máximo (100 pontos)</h3>

        <tr><td>Abdominal com flexão dos joelhos, 1 min</td><td>22 a 38</td><td>30 a 46</td></tr>
        <tr><td>Flexão de braço, 1 min</td><td>12 a 28 (joelhos apoiados)</td><td>14 a 30</td></tr>
        <tr><td>Corrida de 50 m</td><td>9”50 a 7”50</td><td>8”25 a 6”25</td></tr>

      <div class="box"><strong>Atenção às regras de execução:</strong> sem luvas na barra; na flexão masculina na barra não valem impulso, balanço ou kipping; repetições fora do padrão do Anexo II não contam.</div>
      <p class="ref">Fonte: Edital 02/2026 da Guarda Municipal de Campinas, Anexo II. Confira sempre o texto oficial.</p>
    </article>
  </section>`;

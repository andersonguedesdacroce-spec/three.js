<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota GM Campinas — preparação para a Guarda Municipal de Campinas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#0F1E33; --muted:#56667C; --line:#CDD6E1;
  --navy:#16325C; --on-navy:#FFFFFF; --amber:#E39B0B; --ok:#1F7A4D; --bad:#B3261E;
  --soft-ok:#E3F2EA; --soft-bad:#FBE7E5; --soft-amber:#FDF1D8;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1626; --surface:#13223A; --ink:#E7EDF5; --muted:#9AAABF; --line:#28405F;
    --navy:#8FB3E8; --on-navy:#0C1626; --amber:#F2B53A; --ok:#4CC38A; --bad:#F2766B;
    --soft-ok:#123A2A; --soft-bad:#3E1A1A; --soft-amber:#3A2C10; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1626; --surface:#13223A; --ink:#E7EDF5; --muted:#9AAABF; --line:#28405F;
  --navy:#8FB3E8; --on-navy:#0C1626; --amber:#F2B53A; --ok:#4CC38A; --bad:#F2766B;
  --soft-ok:#123A2A; --soft-bad:#3E1A1A; --soft-amber:#3A2C10; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.08;margin:0}
button{font:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:11px;padding-bottom:11px}
.brand{background:none;border:0;color:inherit;text-align:left;padding:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px}
.brand small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:13px;opacity:.85}
.count{text-align:right;line-height:1.1}
.count b{font-family:"Barlow Condensed",sans-serif;font-size:28px;display:block}
.count span{font-size:12px;opacity:.85}
.topo-dir{display:flex;align-items:center;gap:12px}
.tema{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;padding:0;opacity:.9}
.tema svg{width:18px;height:18px}

/* Botões */
.btn{display:inline-block;border:0;border-radius:10px;padding:13px 20px;font-weight:600;background:var(--navy);color:var(--on-navy);text-decoration:none;text-align:center}
.btn.amber{background:var(--amber);color:#1b1300}
.btn.sec{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.voltar{background:none;border:0;color:var(--navy);font-weight:600;padding:16px 0 4px}

/* Página de vendas */
.lp-hero{padding:30px 0 10px}
.lp-hero h1{font-size:44px;letter-spacing:-.2px}
.lp-hero p{font-size:19px;color:var(--muted);max-width:36em;margin:14px 0 20px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.credencial{margin:28px 0 8px;border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.credencial .faixa{background:var(--navy);color:var(--on-navy);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.credencial .faixa strong{font-family:"Barlow Condensed",sans-serif;font-size:22px}
.credencial dl{display:grid;grid-template-columns:1fr 1fr;margin:0}
.credencial dl div{padding:12px 16px;border-top:1px solid var(--line)}
.credencial dl div:nth-child(odd){border-right:1px solid var(--line)}
.credencial dt{font-size:13.5px;color:var(--muted)}
.credencial dd{margin:2px 0 0;font-weight:600}
.lp-sec{padding:34px 0 6px}
.lp-sec h2{font-size:32px}
.lp-sec > p{color:var(--muted);margin:8px 0 14px}
.bloco-tit{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;margin:20px 0 6px}
.lista-materias{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lista-materias li{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.lista-materias li:first-child{border-top:0}
.lista-materias span:last-child{color:var(--muted);font-size:14.5px;white-space:nowrap}
.passos{margin:12px 0 0;padding-left:22px}
.passos li{margin:10px 0}
.destaque{background:var(--soft-amber);border-left:5px solid var(--amber);border-radius:0 14px 14px 0;padding:18px}
.destaque h2{font-size:28px}
.destaque p{margin:8px 0 0}
.oferta-box{background:var(--surface);border:2px solid var(--navy);border-radius:16px;padding:20px}
.oferta-box ul{padding-left:20px;margin:10px 0 16px}
.oferta-box li{margin:6px 0}
.preco{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}
.preco b{font-family:"Barlow Condensed",sans-serif;font-size:52px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{font-weight:600;cursor:pointer}
.faq p{margin:8px 0 0;color:var(--muted)}
.aviso{font-size:13.5px;color:var(--muted);text-align:center;padding:26px 0 36px}

/* Checkout */
.pag{display:grid;gap:10px;margin-top:14px}
.pix{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;margin-top:16px}
.pix svg{width:170px;height:170px;display:block;margin:10px auto}
.demo{font-size:13.5px;color:var(--muted);margin-top:12px}

/* Painel */
.hero{padding:22px 0 8px}
.hero h1{font-size:34px}
.hero p{margin:6px 0 0;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
.bar.fina{height:6px;margin:8px 0 2px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.trilhas{display:grid;gap:10px;margin:8px 0}
.tcard{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tcard .nome{font-weight:600;font-size:17.5px}
.tcard .info{font-size:14px;color:var(--muted)}
.tcard.feita{border-color:var(--ok)}
.tcard.taf{border:2px solid var(--amber)}
.tcard.trava{opacity:.6;cursor:not-allowed}

/* Rota */
.rota{list-style:none;margin:18px 0 40px;padding:0;position:relative}
.rota::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--line)}
.posto{position:relative;padding:0 0 14px 56px}
.posto .pin{position:absolute;left:6px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;color:var(--muted)}
.posto.ok .pin{background:var(--ok);border-color:var(--ok);color:#fff}
.posto.atual .pin{border-color:var(--amber);background:var(--amber);color:#1b1300}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px}
.posto.atual .card{border:2px solid var(--amber)}
.posto.bloq .card{opacity:.62;cursor:not-allowed}
.card .tit{display:block;font-weight:600;line-height:1.3}
.card .sub{display:block;font-size:14px;color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion:no-preference){
  .posto.atual .pin{animation:pulso 2.2s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(227,155,11,.55)}50%{box-shadow:0 0 0 9px rgba(227,155,11,0)}}
}

/* Tópico */
.topico h2{font-size:30px;margin-top:4px}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.abas{display:flex;gap:6px;margin:16px 0 0;border-bottom:2px solid var(--line)}
.abas button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.painel{padding:16px 0 40px}
.aula h3{font-size:22px;margin:22px 0 6px}
.aula p{margin:8px 0}
.aula ul{padding-left:20px;margin:8px 0}
.aula li{margin:4px 0}
.ref{font-size:13.5px;color:var(--muted)}
.box{border-left:4px solid var(--amber);background:var(--soft-amber);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0}
.aula h4{font-family:"Barlow Condensed",sans-serif;font-size:19px;margin:18px 0 4px}
.aula blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--line);background:var(--surface);border-radius:0 10px 10px 0}
.aula ol.alts{margin:6px 0 8px;padding-left:28px}
.status{display:inline-block;font-size:13px;font-weight:600;background:var(--soft-amber);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.fig{margin:16px 0}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.fig text{fill:var(--ink)}
.fig .q{fill:var(--muted)}
.fig .ln{fill:none;stroke:var(--muted);stroke-width:1.25}
.fig .bx{fill:none;stroke:var(--muted);stroke-width:1.25}
.fig .ac{fill:var(--navy);fill-opacity:.12;stroke:var(--navy);stroke-width:2}
.fig .tint{fill:var(--soft-amber);stroke:var(--muted);stroke-width:1.25}
.fig .bad{fill:none;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 5}
.fig .good{fill:none;stroke:var(--ok);stroke-width:1.5}
.fig .mk{fill:var(--muted)}
.tabela{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-weight:600}
.vazio{border:2px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted)}
.regra{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.historico{font-size:14px;color:var(--muted);margin-top:10px}

/* Questões */
.qtopo{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin:14px 0 8px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.qcard .enun{font-weight:500;margin:0 0 12px}
.txt{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0;font-size:15.5px}
ol.alts{margin:6px 0 8px;padding-left:28px}
.alt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 12px;margin:8px 0}
.alt .l{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:600;font-size:14px}
.alt[aria-pressed="true"]{border-color:var(--navy)}
.alt[aria-pressed="true"] .l{background:var(--navy);color:var(--on-navy)}
.acoes{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}

/* Resultado */
.nota{font-family:"Barlow Condensed",sans-serif;font-size:72px;font-weight:700;line-height:1}
.res{border-radius:14px;padding:20px;margin:16px 0}
.res.ok{background:var(--soft-ok)}
.res.bad{background:var(--soft-bad)}
.res h2{font-size:28px;margin-top:6px}
.rev{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0}
.rev .st{font-weight:600;font-size:14px}
.rev.ok .st{color:var(--ok)}
.rev.bad .st{color:var(--bad)}
.rev p{margin:6px 0}
.rodape{text-align:center;padding:10px 0 34px}
.rodape button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}

/* ---------- Aula: formato apostila ---------- */
.aula.apostila{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:18.5px;line-height:1.66;max-width:66ch;padding-bottom:12px}
.aula.apostila .status{background:none;padding:0;font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);margin:0 0 10px;display:block}
.aula.apostila>.status+p{font-size:20.5px;line-height:1.55}
.aula.apostila h3{font-size:29px;line-height:1.1;margin:44px 0 12px;scroll-margin-top:84px}
.aula.apostila h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;margin:28px 0 6px}
.aula.apostila p{margin:0 0 14px}
.aula.apostila ul{padding-left:22px;margin:0 0 16px}
.aula.apostila li{margin:0 0 8px}
.aula.apostila strong{font-weight:600}
.sumario{font-family:"Barlow",system-ui,sans-serif;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0 8px;margin:22px 0 6px}
.sumario p{font-weight:600;font-size:14.5px;color:var(--muted);margin:0 0 6px!important}
.sumario ul{list-style:none;padding:0!important;margin:0!important;columns:2 230px;column-gap:28px}
.sumario li{margin:0 0 5px!important;break-inside:avoid}
.sumario a{color:var(--ink);text-decoration:none;font-size:15.5px}
.sumario a:hover{text-decoration:underline;text-underline-offset:3px}
/* tabelas de livro: só fios horizontais */
.aula.apostila .tabela{border:0;background:none;border-radius:0;margin:20px 0 22px}
.aula.apostila table{font-family:"Barlow",system-ui,sans-serif;font-size:15.5px;line-height:1.45;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.aula.apostila th{background:none;font:600 15.5px "Barlow",system-ui,sans-serif;border-bottom:1px solid var(--ink)}
.aula.apostila th,.aula.apostila td{padding:7px 14px 7px 0}
.aula.apostila td{border-bottom:0}
/* pares de duas colunas viram texto */
.pares{margin:14px 0 20px}
.pares>div{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:2px 20px;padding:4px 0}
.pares dt{font-weight:600}
.pares dd{margin:0}
.pares>.pares-h{font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.pares>.pares-h dt{font-weight:500}
/* exemplos numerados, como nas gramáticas */
.exs{list-style:none;counter-reset:ex;padding:0!important;margin:14px 0 8px!important}
.exs li{counter-increment:ex;position:relative;padding-left:44px;margin:0 0 12px!important}
.exs li::before{content:"(" counter(ex) ")";position:absolute;left:0;top:0;font-family:"Barlow",system-ui,sans-serif;color:var(--muted)}
.exs .rej{display:block;color:var(--muted)}
.exs .rej::before{content:"*";color:var(--bad);font-weight:700;margin-right:3px}
.aula.apostila>ol:not(.alts):not(.exs){list-style:none;counter-reset:ex;padding-left:0;margin:12px 0 18px}
.aula.apostila>ol:not(.alts):not(.exs)>li{counter-increment:ex;position:relative;padding-left:44px;margin:0 0 10px}
.aula.apostila>ol:not(.alts):not(.exs)>li::before{content:"(" counter(ex) ")";position:absolute;left:0;top:0;font-family:"Barlow",system-ui,sans-serif;color:var(--muted)}
.exs-nota{font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);margin:0 0 20px!important}
/* pegadinhas em lista corrida */
.pegas{list-style:none;padding:0!important;margin:12px 0 20px!important}
.pegas li{padding:9px 0;margin:0!important;border-bottom:1px solid var(--line)}
.pegas .pg-t{font-weight:600}
/* notas na margem */
.aula.apostila .nota{display:block;font:400 15.5px/1.5 "Barlow",system-ui,sans-serif;color:var(--muted);border-left:2px solid var(--amber);padding:2px 0 2px 14px;margin:16px 0;background:none;border-radius:0}
.aula.apostila .nota strong{color:var(--ink);font-weight:600}
@media (min-width:1200px){
  .aula.apostila .nota{float:right;clear:right;width:230px;margin:4px -272px 14px 0;border-left:0;border-top:2px solid var(--amber);padding:8px 0 0}
}
/* questões resolvidas: gabarito recolhido */
.aula.apostila ol.alts{font-size:17.5px;margin:6px 0 10px;padding-left:30px}
.aula.apostila ol.alts li{margin:0 0 4px}
.gab{margin:0 0 18px}
.gab summary{cursor:pointer;font:600 15.5px "Barlow",system-ui,sans-serif;color:var(--navy);list-style:none;display:inline-block;padding:4px 0}
.gab summary::-webkit-details-marker{display:none}
.gab summary::before{content:"▸ "}
.gab[open] summary::before{content:"▾ "}
.gab p{margin:6px 0 0!important}
/* figuras sem moldura */
.aula.apostila .fig{background:none;border:0;padding:0;margin:22px 0}
.aula.apostila .fig figcaption{font:400 14.5px/1.45 "Barlow",system-ui,sans-serif}
.aula.apostila .ref{font-family:"Barlow",system-ui,sans-serif}
.fim-aula{font-family:"Barlow",system-ui,sans-serif;border-top:1px solid var(--line);padding-top:14px;margin-top:28px!important;font-size:16.5px}
.fim-aula a{font-weight:600}
@media (max-width:520px){
  .aula.apostila{font-size:18px}
  .aula.apostila h3{font-size:26px;margin-top:38px}
  .pares>div{grid-template-columns:1fr;gap:0}
  .pares>.pares-h{display:none}
  .aula.apostila .fig{overflow-x:auto}
  .aula.apostila .fig svg{min-width:620px}
}

.aula.apostila blockquote.lei{margin:16px 0 18px 18px;padding:2px 0 2px 16px;border-left:2px solid var(--ink);background:none;border-radius:0;font-size:17.5px;line-height:1.6}
.aula.apostila blockquote.lei p{margin:0 0 4px}
.aula.apostila blockquote.lei cite{display:block;font:500 13.5px "Barlow",system-ui,sans-serif;font-style:normal;color:var(--muted)}
@media (max-width:520px){.aula.apostila blockquote.lei{margin-left:6px;padding-left:12px;font-size:17px}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="brand">Rota GM Campinas<small>Guarda Municipal 3ª Classe · Vunesp</small></button>
    <div class="topo-dir"><button class="tema" id="tema" type="button" aria-label="Alternar modo claro e escuro"></button><div class="count"><b id="dias">—</b><span>dias até a prova</span></div></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ---------- Edital ---------- */
const PROVA = new Date("2027-03-21T13:00:00-03:00");
const FIM_CONTEUDO = new Date("2027-03-14T23:59:00-03:00");
const NOTA_MIN = 7, N_QUESTOES = 10;

/* Cada trilha é uma matéria do Anexo I. Cada posto: [título, recorte do edital]. */
const TRILHAS = [
 {id:"pt", bloco:"Conhecimentos Gerais", nome:"Língua Portuguesa", q:"12 questões", postos:[
  ["Leitura e interpretação de textos literários e não literários","Tipos e gêneros textuais; informações explícitas e implícitas; inferência"],
  ["Sinônimos e antônimos","Substituição de palavras e relações de sentido no contexto"],
  ["Sentido próprio e figurado das palavras","Denotação, conotação e figuras de linguagem"],
  ["Pontuação","Vírgula, ponto e vírgula, dois-pontos, travessão e aspas"],
  ["Substantivo, adjetivo e numeral","Emprego e sentido nas relações que estabelecem"],
  ["Pronome","Emprego, colocação no texto e função de retomada"],
  ["Verbo e advérbio","Tempos, modos, vozes verbais e circunstâncias adverbiais"],

<h3>1. Compreender, interpretar e não extrapolar</h3>
<p>Toda questão de interpretação pede uma de três coisas: o que o texto <strong>diz</strong>, o que ele <strong>permite concluir</strong> ou o que ele <strong>não autoriza</strong>. A maior parte das alternativas erradas mora nesta terceira zona.</p>

<h4>Compreensão: o que está escrito</h4>
<p><strong>Compreender</strong> é localizar uma informação que está no texto, com as mesmas palavras ou com palavras equivalentes. Não há dedução: a resposta pode ser apontada com o dedo.</p>
<p>Comandos típicos: “De acordo com o texto...”, “Segundo o autor...”, “O texto informa que...”, “Conforme o segundo parágrafo...”.</p>
<h4>Interpretação: o que se conclui</h4>
<p><strong>Interpretar</strong> é tirar uma conclusão que o texto não escreve, mas obriga a aceitar. A conclusão precisa nascer do texto, não do que você sabe sobre o mundo.</p>
<p>Comandos típicos: “Infere-se do texto que...”, “Depreende-se que...”, “O texto permite concluir que...”, “Subentende-se que...”.</p>
<p>As conclusões que o texto autoriza são de dois tipos: o <strong>pressuposto</strong> e o <strong>subentendido</strong>.</p>
<div class="tabela"><table>
<tr><th></th><th>Pressuposto</th><th>Subentendido</th></tr>
<tr><td>De onde vem</td><td>De uma palavra ou expressão da própria frase</td><td>Do contexto, da situação</td></tr>
<tr><td>Quem falou pode negar?</td><td>Não: está preso às palavras</td><td>Sim: pode dizer que não quis dizer aquilo</td></tr>
<tr><td>Exemplo</td><td>“A praça <strong>voltou a</strong> ter iluminação.” → antes ela ficou sem luz</td><td>“Está quente aqui dentro, não?” → um pedido para ligar o ventilador</td></tr>
</table></div>
<h4>Palavras que carregam pressupostos</h4>
<div class="tabela"><table>
<tr><th>Marcador</th><th>Frase</th><th>O que fica pressuposto</th></tr>
<tr><td>voltar a</td><td>“O bairro voltou a ter ônibus à noite.”</td><td>Já teve e deixou de ter</td></tr>
<tr><td>deixar de, parar de</td><td>“A feira deixou de funcionar aos domingos.”</td><td>Funcionava aos domingos</td></tr>
<tr><td>passar a</td><td>“A escola passou a ter ronda escolar.”</td><td>Antes não tinha</td></tr>
<tr><td>continuar, ainda</td><td>“A rua ainda está interditada.”</td><td>Já estava interditada antes</td></tr>
<tr><td>já</td><td>“O suspeito já tinha sido abordado.”</td><td>Houve abordagem anterior</td></tr>
<tr><td>até</td><td>“Até o vereador reclamou do barulho.”</td><td>Outros reclamaram, e não se esperava que ele reclamasse</td></tr>
<tr><td>também</td><td>“O centro também recebeu câmeras.”</td><td>Outro lugar recebeu câmeras</td></tr>
<tr><td>só, apenas</td><td>“Só dois guardas atenderam a ocorrência.”</td><td>Esperava-se que fossem mais</td></tr>
</table></div>
<h4>Os três erros das alternativas</h4>
<div class="tabela"><table>
<tr><th>Erro</th><th>O que a alternativa faz</th><th>Como reconhecer</th></tr>

</table></div>

<h3>2. Tema, ideia central, tese e título</h3>
<p>Quatro perguntas diferentes, que a prova costuma misturar: <strong>sobre o que</strong> é o texto, <strong>o que</strong> ele afirma sobre isso, <strong>qual posição</strong> defende e <strong>que nome</strong> o resume.</p>
<div class="tabela"><table>
<tr><th>Conceito</th><th>Pergunta</th><th>Exemplo</th></tr>
<tr><td><strong>Assunto</strong></td><td>Sobre o que o texto fala?</td><td>Iluminação pública</td></tr>
<tr><td><strong>Tema</strong></td><td>Qual recorte do assunto?</td><td>A falta de iluminação nas praças da periferia</td></tr>
<tr><td><strong>Ideia central</strong></td><td>O que o texto afirma sobre o tema?</td><td>A falta de iluminação afasta os moradores das praças à noite</td></tr>
<tr><td><strong>Tese</strong></td><td>Que posição o autor defende?</td><td>A prefeitura deveria priorizar a iluminação das praças da periferia</td></tr>
<tr><td><strong>Título</strong></td><td>Que nome resume o texto?</td><td>“Praça apagada, praça vazia”</td></tr>
</table></div>
<h4>Como achar a ideia central</h4>
<ol><li>Leia o texto inteiro antes das alternativas.</li><li>Resuma cada parágrafo em uma frase curta.</li><li>Procure a frase que “abraça” todos os resumos.</li><li>Se a alternativa servir só para um parágrafo, é redução; se trouxer algo que nenhum parágrafo diz, é extrapolação.</li></ol>
<h4>Onde a tese costuma aparecer</h4>
<ul><li>No primeiro parágrafo, logo depois da apresentação do tema.</li><li>No último parágrafo, retomada como conclusão.</li><li>Em expressões de opinião: “é preciso”, “deve-se”, “é inaceitável”, “o melhor caminho é”.</li></ul>
<h4>Argumentos a serviço da tese</h4>
<div class="tabela"><table>
<tr><th>Tipo</th><th>Exemplo (criado para a aula)</th></tr>
<tr><td>Dados e números</td><td>“Três em cada quatro moradores evitam a praça à noite.”</td></tr>
<tr><td>Exemplo</td><td>“Na semana passada, a feira noturna foi cancelada por falta de luz.”</td></tr>
<tr><td>Autoridade</td><td>“Segundo urbanistas, espaço iluminado é espaço ocupado.”</td></tr>
<tr><td>Causa e consequência</td><td>“Sem luz, ninguém circula; sem circulação, a praça se degrada.”</td></tr>
<tr><td>Comparação</td><td>“As praças reformadas do centro estão sempre cheias.”</td></tr>
<tr><td>Contra-argumento</td><td>“Dirão que falta verba; mas iluminar custa menos que reformar.”</td></tr>
</table></div>

<h3>3. Tipos textuais</h3>
<p><strong>Tipo textual</strong> é o modo de organizar o texto. Um mesmo texto mistura tipos, mas um deles predomina.</p>
<div class="tabela"><table>
<tr><th>Tipo</th><th>Finalidade</th><th>Marcas</th><th>Exemplo</th></tr>
<tr><td><strong>Narrativo</strong></td><td>Contar fatos em sequência</td><td>Verbos de ação no pretérito; marcadores de tempo</td><td>“Às 22h, a equipe chegou à praça e encontrou o portão arrombado.”</td></tr>
<tr><td><strong>Descritivo</strong></td><td>Mostrar como algo é</td><td>Adjetivos; verbos de estado</td><td>“A praça é ampla, cercada de ipês, com bancos já gastos.”</td></tr>
<tr><td><strong>Expositivo</strong></td><td>Explicar ou informar, sem defender posição</td><td>Presente atemporal; definições</td><td>“A guarda municipal é uma instituição de caráter civil.”</td></tr>
<tr><td><strong>Argumentativo</strong></td><td>Defender uma posição</td><td>Tese, argumentos, conectores</td><td>“É urgente iluminar as praças, pois espaço escuro afasta quem as ocuparia.”</td></tr>
<tr><td><strong>Injuntivo</strong></td><td>Orientar o leitor a fazer algo</td><td>Imperativo ou infinitivo; passos</td><td>“Ligue 153 e informe o endereço da ocorrência.”</td></tr>
</table></div>
<p>Para identificar o tipo, pergunte o que o texto <strong>quer</strong> do leitor: que conheça uma história, visualize algo, entenda um assunto, concorde com uma posição ou execute uma ação. Só o argumentativo defende uma posição.</p>
<h4>Discurso direto e indireto</h4>
<div class="tabela"><table>
<tr><th>Discurso direto</th><th>Discurso indireto</th></tr>
<tr><td>A moradora disse: “Eu vi o carro fugir.”</td><td>A moradora disse que tinha visto o carro fugir.</td></tr>
<tr><td>Fala com as palavras do falante, entre aspas ou após travessão</td><td>Fala contada pelo narrador, com “que” ou “se”</td></tr>
<tr><td>1ª pessoa e tempo da fala</td><td>3ª pessoa e tempo recuado</td></tr>
</table></div>

<h3>4. Gêneros textuais e linguagem não verbal</h3>
<p><strong>Gênero textual</strong> é a forma social do texto, aquela que reconhecemos no dia a dia.</p>
<div class="tabela"><table>
<tr><th>Gênero</th><th>Finalidade</th><th>Marcas típicas</th></tr>
<tr><td>Notícia</td><td>Informar um fato recente</td><td>Título, lide, linguagem objetiva, 3ª pessoa</td></tr>
<tr><td>Reportagem</td><td>Aprofundar um assunto</td><td>Dados, entrevistas, várias fontes</td></tr>
<tr><td>Crônica</td><td>Comentar o cotidiano com olhar pessoal</td><td>Linguagem leve, humor ou lirismo, fato comum como ponto de partida</td></tr>
<tr><td>Artigo de opinião</td><td>Defender um ponto de vista, assinado</td><td>Tese clara, argumentos, autor identificado</td></tr>
<tr><td>Editorial</td><td>Expressar a opinião do veículo</td><td>Sem assinatura individual</td></tr>
<tr><td>Charge</td><td>Criticar um fato atual com humor</td><td>Desenho, caricatura, depende de conhecer o fato</td></tr>
<tr><td>Tirinha</td><td>Contar uma situação curta com humor</td><td>Quadros em sequência; quebra de expectativa no fim</td></tr>
<tr><td>Anúncio</td><td>Convencer a comprar ou aderir</td><td>Imperativo, imagem, slogan</td></tr>
<tr><td>Conto</td><td>Narrar uma história ficcional curta</td><td>Poucos personagens, um conflito</td></tr>
<tr><td>Poema</td><td>Expressar emoção ou ideia com valor estético</td><td>Versos, ritmo, sentido figurado</td></tr>
<tr><td>Texto normativo</td><td>Estabelecer regras</td><td>Artigos, incisos, “deverá”, “é vedado”</td></tr>
</table></div>
<h4>O lide da notícia</h4>
<p>O primeiro parágrafo da notícia responde às perguntas principais: <strong>quem</strong> (a Guarda Municipal), <strong>o quê</strong> (recuperou uma bicicleta furtada), <strong>quando</strong> (sábado de manhã), <strong>onde</strong> (uma praça da região central), <strong>como</strong> (após aviso de um comerciante) e <strong>por quê</strong> (ele reconheceu a bicicleta pela foto divulgada pelo dono). Fato criado para esta aula.</p>
<h4>Charge e tirinha: imagem e texto juntos</h4>
<ol><li><strong>Descreva a cena</strong> antes de interpretar.</li><li><strong>Observe os detalhes não verbais</strong>: expressões, tamanho das letras, objetos em destaque.</li><li><strong>Encontre a quebra de expectativa</strong>, de onde nasce o humor.</li><li><strong>Identifique o alvo da crítica</strong>, na charge.</li><li><strong>Confira se a alternativa usa os dois códigos</strong>, imagem e texto.</li></ol>
<p><strong>Exemplo descrito.</strong> Numa tirinha de três quadros, um motorista ao celular diz: “Só uma mensagem rapidinha”. No último quadro, o carro está parado ao lado de um agente que preenche a autuação, e o motorista diz: “Ficou rapidinha mesmo”. A crítica é ao uso do celular ao volante; o humor está na retomada irônica de “rapidinha”.</p>

<h3>5. Texto literário e não literário</h3>
<div class="tabela"><table>
<tr><th></th><th>Não literário</th><th>Literário</th></tr>
<tr><td>Finalidade</td><td>Informar, explicar, orientar, convencer</td><td>Criar efeito estético, emocionar</td></tr>
<tr><td>Linguagem</td><td>Denotação (sentido literal)</td><td>Conotação (sentido figurado)</td></tr>
<tr><td>Leituras</td><td>Uma leitura, sem ambiguidade</td><td>Várias leituras (plurissignificação)</td></tr>
<tr><td>Gêneros</td><td>Notícia, reportagem, artigo, lei</td><td>Poema, conto, romance, crônica literária</td></tr>
</table></div>
<p><strong>Literário</strong>: trecho da “Canção do exílio”, de Gonçalves Dias (1843), em domínio público.</p>
<blockquote>Minha terra tem palmeiras,<br>Onde canta o Sabiá;<br>As aves, que aqui gorjeiam,<br>Não gorjeiam como lá.</blockquote>
<p><strong>Não literário</strong>, criado para a aula: “O sabiá-laranjeira é uma ave comum em várias regiões do Brasil e é conhecida pelo canto.”</p>
<p>No poema, as palmeiras e o sabiá representam a terra natal e a saudade de quem está longe; a comparação entre “aqui” e “lá” é afetiva. Na frase informativa, o sabiá é só a ave. A voz que fala no poema é o <strong>eu lírico</strong>, que não se confunde com o autor.</p>
<h4>Figuras de linguagem mais frequentes</h4>
<div class="tabela"><table>
<tr><th>Figura</th><th>Exemplo</th></tr>
<tr><td>Metáfora</td><td>“A cidade é um formigueiro.”</td></tr>
<tr><td>Comparação</td><td>“A cidade fervilha como um formigueiro.”</td></tr>
<tr><td>Ironia</td><td>“Que pontualidade: o ônibus chegou só uma hora atrasado.”</td></tr>
<tr><td>Hipérbole</td><td>“Já falei isso mil vezes.”</td></tr>
<tr><td>Personificação</td><td>“A praça dorme depois das dez.”</td></tr>
</table></div>
<p>O estudo completo está no posto 3 desta trilha.</p>

<h3>6. Coesão e referenciação</h3>
<p>Uma das perguntas mais frequentes é “o termo destacado refere-se a...”. A <strong>anáfora</strong> retoma algo que já apareceu; a <strong>catáfora</strong> antecipa algo que ainda vai aparecer.</p>
<div class="tabela"><table>
<tr><th>Recurso</th><th>Exemplo</th><th>Refere-se a</th></tr>
<tr><td>Pronome pessoal</td><td>“Os guardas chegaram cedo. <strong>Eles</strong> isolaram a área.”</td><td>os guardas</td></tr>
<tr><td>Pronome demonstrativo</td><td>“A praça foi reformada, mas <strong>isso</strong> não trouxe mais visitantes.”</td><td>a reforma da praça</td></tr>
<tr><td>Pronome relativo</td><td>“A moradora <strong>que</strong> fez a denúncia foi ouvida.”</td><td>a moradora</td></tr>
<tr><td>Advérbio de lugar</td><td>“Fomos ao terminal. <strong>Lá</strong>, a fila dobrava o quarteirão.”</td><td>o terminal</td></tr>
<tr><td>Expressão equivalente</td><td>“O prefeito visitou o bairro. <strong>O chefe do Executivo</strong> prometeu obras.”</td><td>o prefeito</td></tr>
<tr><td>Termo genérico</td><td>“Roubaram fios, cabos e lâmpadas. <strong>O material</strong> não foi recuperado.”</td><td>fios, cabos e lâmpadas</td></tr>
<tr><td>Elipse</td><td>“A guarda chegou às 22h e isolou a área.”</td><td>a guarda, subentendida</td></tr>
<tr><td>Catáfora</td><td>“Só peço <strong>isto</strong>: que respeitem a faixa de pedestres.”</td><td>que respeitem a faixa</td></tr>
</table></div>
<h4>“Este”, “esse” e “aquele” no texto</h4>
<ul><li><strong>este, isto</strong>: anuncia o que vai ser dito ou, numa enumeração, retoma o último citado.</li><li><strong>esse, isso</strong>: retoma o que já foi dito.</li><li><strong>aquele</strong>: numa enumeração, retoma o primeiro citado.</li></ul>
<p>“Guarda e polícia atuaram: <strong>esta</strong> no flagrante, <strong>aquela</strong> na prevenção.” Esta = polícia; aquela = guarda.</p>
<h4>Como resolver</h4>
<ol><li>Leia a frase do termo e a anterior inteiras.</li><li>Substitua o termo por cada alternativa.</li><li>Fica a que mantém o sentido e a concordância.</li><li>Se o termo for “isso” ou “tal fato”, a resposta costuma ser uma ideia inteira.</li></ol>

<h3>7. Método de resolução, passo a passo</h3>
<ol><li><strong>Leia o comando primeiro</strong> e repare se pede a correta ou a <strong>incorreta</strong>.</li><li><strong>Leia o texto inteiro</strong> uma vez, sem parar.</li><li><strong>Resuma cada parágrafo</strong> em poucas palavras.</li><li><strong>Volte ao trecho citado</strong> e releia as frases ao redor.</li><li><strong>Antecipe a resposta</strong> com suas palavras.</li><li><strong>Elimine</strong> extrapolação, redução e contradição.</li><li><strong>Compare as finalistas</strong> palavra por palavra.</li><li><strong>Confira</strong> se a escolhida responde exatamente ao comando.</li></ol>
<div class="tabela"><table>
<tr><th>Palavra de alerta</th><th>Risco</th></tr>
<tr><td>sempre, nunca, jamais</td><td>Generalização que o texto raramente sustenta</td></tr>
<tr><td>todos, nenhum, qualquer</td><td>Amplia o alcance do que o texto disse</td></tr>
<tr><td>apenas, somente, exclusivamente</td><td>Reduz e exclui outras possibilidades</td></tr>
<tr><td>certamente, comprovadamente</td><td>Transforma possibilidade em certeza</td></tr>
<tr><td>deve, precisa</td><td>Transforma constatação em opinião ou ordem</td></tr>
</table></div>
<p>Essas palavras não tornam a alternativa errada automaticamente; elas mandam conferir no texto se aquele grau de certeza está escrito lá.</p>

<h3>8. Texto comentado e questões resolvidas</h3>
<blockquote><strong>A praça que voltou a acender</strong><br><br>(1) Durante anos, a pequena praça do bairro foi um lugar de passagem rápida. Ninguém se demorava ali depois que o sol se punha: os postes, quebrados um a um, transformavam o espaço em um borrão escuro entre duas avenidas.<br><br>(2) No mês passado, a prefeitura trocou a iluminação e instalou bancos novos. A mudança parecia pequena, quase burocrática. Mas, na primeira semana, já havia crianças de bicicleta às oito da noite e um vendedor de pipoca que ninguém via por ali havia anos.<br><br>(3) É tentador atribuir a transformação apenas às lâmpadas. Seria um engano. A luz não fez as pessoas saírem de casa; ela apenas tirou a desculpa que tinham para não sair. O que manteve a praça cheia foi a presença dos próprios moradores, que passaram a cuidar uns dos outros simplesmente por estarem ali.<br><br>(4) Talvez esteja aí uma lição para quem planeja a cidade: segurança não se constrói só com equipamentos, mas com gente ocupando o espaço público. Uma praça vazia, por mais iluminada que esteja, continua sendo uma praça vazia.</blockquote>
<p class="ref">Texto criado para esta aula.</p>
<p><strong>Leitura guiada.</strong> (1) a praça às escuras era evitada; (2) a reforma trouxe gente de volta; (3) a causa real é a ocupação pelos moradores, não só a luz; (4) segurança depende de gente no espaço público.</p>
<h4>Questão 1 — ideia central</h4>
<p>O texto defende, principalmente, que</p>
<ol class="alts" type="A"><li>a ocupação do espaço público pelas pessoas é decisiva para torná-lo seguro.</li><li>a troca da iluminação foi suficiente para resolver o problema da praça.</li><li>a prefeitura deveria instalar bancos em todas as praças da cidade.</li><li>as crianças só brincam na rua quando há policiamento.</li><li>o vendedor de pipoca foi o responsável pela volta dos moradores.</li></ol>
<p><strong>Resposta: A.</strong> (B) contradiz o parágrafo 3; (C) e (D) extrapolam; (E) reduz o texto a um detalhe.</p>
<h4>Questão 2 — pressuposto</h4>
<p>No título, a expressão “voltou a” pressupõe que a praça</p>
<ol class="alts" type="A"><li>já foi iluminada antes de ficar às escuras.</li><li>nunca teve iluminação.</li><li>recebeu iluminação pela primeira vez.</li><li>ficará iluminada para sempre.</li><li>foi construída recentemente.</li></ol>
<p><strong>Resposta: A.</strong> “Voltar a” pressupõe que algo já aconteceu e deixou de acontecer.</p>
<h4>Questão 3 — inferência</h4>
<p>A partir do 3º parágrafo, infere-se que, antes da reforma,</p>
<ol class="alts" type="A"><li>a escuridão funcionava como justificativa para os moradores não frequentarem a praça.</li><li>os moradores eram proibidos de permanecer na praça à noite.</li><li>os moradores preferiam frequentar praças de outros bairros.</li><li>os moradores exigiam da prefeitura a instalação de câmeras.</li><li>a praça era frequentada apenas por crianças.</li></ol>
<p><strong>Resposta: A.</strong> Se a luz “tirou a desculpa que tinham para não sair”, a falta de luz era essa desculpa.</p>
<h4>Questão 4 — referenciação</h4>
<p>Em “ela apenas tirou a desculpa que tinham para não sair”, o pronome “ela” refere-se a</p>
<ol class="alts" type="A"><li>luz.</li><li>transformação.</li><li>praça.</li><li>prefeitura.</li><li>desculpa.</li></ol>
<p><strong>Resposta: A.</strong> A frase anterior começa com “A luz não fez as pessoas saírem de casa”.</p>
<h4>Questão 5 — tipo e gênero</h4>
<p>O texto apresenta as características de</p>
<ol class="alts" type="A"><li>crônica de tom argumentativo, que parte de um fato do cotidiano para propor uma reflexão.</li><li>notícia, pois se limita a informar a reforma da praça.</li><li>texto injuntivo, pois orienta o leitor a frequentar a praça.</li><li>texto descritivo, pois se dedica a caracterizar o mobiliário da praça.</li><li>editorial, pois expressa a posição oficial da prefeitura.</li></ol>
<p><strong>Resposta: A.</strong> O fato cotidiano leva à reflexão do último parágrafo; há opinião, não há ordens nem posição oficial.</p>
<h4>Questão 6 — sentido figurado</h4>
<p>A expressão “um borrão escuro entre duas avenidas” foi empregada em sentido</p>
<ol class="alts" type="A"><li>figurado, para mostrar que a praça, sem luz, perdia os contornos e se tornava indistinta.</li><li>literal, para indicar uma mancha de tinta no chão da praça.</li><li>literal, para descrever a cor do piso.</li><li>figurado, para indicar que a praça foi pintada de preto.</li><li>técnico, como termo próprio do urbanismo.</li></ol>
<p><strong>Resposta: A.</strong> “Borrão” é imagem, não fato. (D) também diz “figurado”, mas atribui um sentido que o texto não autoriza.</p>
<h4>Questão 7 — assinale a incorreta</h4>
<p>Assinale a alternativa que <strong>não</strong> está de acordo com o texto.</p>
<ol class="alts" type="A"><li>A troca da iluminação veio acompanhada da instalação de bancos novos.</li><li>Já na primeira semana após a reforma havia crianças na praça à noite.</li><li>O autor considera um engano atribuir a mudança somente às lâmpadas.</li><li>Para o autor, uma praça bem iluminada é, por si só, uma praça segura.</li><li>Os postes da praça foram sendo quebrados aos poucos.</li></ol>
<p><strong>Resposta: D.</strong> O último parágrafo diz o contrário.</p>

<h3>9. Na rotina do guarda</h3>
<ul><li><strong>Ordem de serviço.</strong> “Reforçar a ronda <strong>até</strong> sexta-feira” é diferente de “<strong>a partir de</strong> sexta-feira”.</li><li><strong>Relato de ocorrência.</strong> Separe o que foi visto do que foi deduzido: “o suspeito correu em direção à avenida” não é “o suspeito fugiu para casa”.</li><li><strong>Texto de lei.</strong> “Poderá”, “deverá” e “é vedado” têm sentidos distintos.</li><li><strong>Atendimento.</strong> Entender o subentendido ajuda a conduzir a ocorrência com calma.</li></ul>

<h3>10. Onde a Vunesp costuma pegar</h3>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>Verdade do mundo, não do texto</td><td>Pergunte: “em que linha está?”</td></tr>
<tr><td>Troca de grau (“pode” vira “sempre”)</td><td>Compare o grau de certeza palavra por palavra</td></tr>
<tr><td>Troca de sujeito (personagem vira autor)</td><td>Verifique quem diz o quê</td></tr>
<tr><td>Parágrafo errado</td><td>Volte ao parágrafo pedido</td></tr>
<tr><td>Pedido de incorreta</td><td>Sublinhe “incorreta”, “exceto”, “não”</td></tr>
<tr><td>Detalhe como ideia central</td><td>Teste se resume o texto inteiro</td></tr>
<tr><td>Sinônimo falso (eminente x iminente)</td><td>Substitua na frase e releia</td></tr>
<tr><td>Charge lida só pelo texto</td><td>Descreva a imagem antes de responder</td></tr>
</table></div>

<h3>11. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><td>Compreensão</td><td>O que está escrito: “de acordo com o texto”</td></tr>
<tr><td>Interpretação</td><td>O que o texto obriga a concluir: “infere-se”</td></tr>
<tr><td>Pressuposto</td><td>Preso a uma palavra: voltar a, deixar de, ainda, já, até, também, só</td></tr>
<tr><td>Subentendido</td><td>Depende do contexto; quem falou pode negar</td></tr>
<tr><td>Três erros</td><td>Extrapolação, redução, contradição</td></tr>
<tr><td>Tema, ideia central, tese</td><td>Recorte do assunto; frase que o texto afirma; posição defendida</td></tr>
<tr><td>Tipos textuais</td><td>Narrativo, descritivo, expositivo, argumentativo, injuntivo</td></tr>
<tr><td>Literário x não literário</td><td>Conotação e várias leituras x denotação e leitura única</td></tr>
<tr><td>Referenciação</td><td>Substitua o termo e confira sentido e concordância</td></tr>
<tr><td>este / esse / aquele</td><td>O que vem ou o último citado / o já dito / o primeiro citado</td></tr>
<tr><td>Alerta</td><td>sempre, nunca, todos, apenas, certamente: confira o grau no texto</td></tr>
</table></div>

<h3>1. Sinônimos: o sentido depende do contexto</h3>
<p><strong>Sinônimos</strong> são palavras de sentido igual ou muito próximo. Quase nunca são idênticas: uma pode ser mais formal, mais intensa ou servir só em certas frases. A pergunta certa não é “esta palavra é sinônima daquela?”, e sim “nesta frase, ela pode ocupar o lugar daquela?”.</p>
<div class="tabela"><table>
<tr><th>Diferença</th><th>Exemplo</th><th>Por que a troca falha</th></tr>
<tr><td>Registro</td><td>morrer, falecer, “bater as botas”</td><td>Num boletim, “bater as botas” é inadequado</td></tr>
<tr><td>Intensidade</td><td>medo, receio, pavor</td><td>“Tive receio” não equivale a “tive pavor”</td></tr>
<tr><td>Valor positivo ou negativo</td><td>econômico, pão-duro</td><td>O primeiro elogia; o segundo critica</td></tr>
<tr><td>Uso fixo</td><td>“tomar uma decisão”</td><td>“Pegar uma decisão” não se usa</td></tr>
</table></div>
<h4>Polissemia: uma palavra, vários sentidos</h4>
<p><strong>Polissemia</strong> é a propriedade de uma palavra ter vários sentidos. O sinônimo correto muda conforme o sentido em uso.</p>
<div class="tabela"><table>
<tr><th>Frase</th><th>Sinônimo no contexto</th></tr>
<tr><td>“Os guardas fizeram ronda no <strong>ponto</strong> de ônibus.”</td><td>parada</td></tr>
<tr><td>“Esse é o <strong>ponto</strong> principal do relatório.”</td><td>aspecto, questão</td></tr>
<tr><td>“Os guardas <strong>pegaram</strong> o suspeito na esquina.”</td><td>detiveram, alcançaram</td></tr>
<tr><td>“A moradora <strong>pegou</strong> um resfriado.”</td><td>contraiu</td></tr>
<tr><td>“O motor não <strong>pegou</strong>.”</td><td>funcionou, deu partida</td></tr>
<tr><td>“A prefeitura <strong>fechou</strong> a rua.”</td><td>interditou, bloqueou</td></tr>
<tr><td>“As partes <strong>fecharam</strong> o acordo.”</td><td>concluíram, firmaram</td></tr>
</table></div>
<div class="box"><strong>Regra de ouro:</strong> antes de olhar as alternativas, diga com suas palavras o que a palavra significa naquela frase.</div>

<h3>2. Como a Vunesp cobra a substituição</h3>
<p>O formato mais comum: “No trecho X, a palavra Y pode ser substituída, sem alteração de sentido, por...”.</p>
<ol><li><strong>Defina o sentido no contexto.</strong></li><li><strong>Substitua de verdade</strong>, lendo a frase com cada alternativa.</li><li><strong>Confira o sentido</strong>: mesma ideia, mesma intensidade, mesmo valor.</li><li><strong>Confira a gramática</strong>: mesma classe de palavra e preposições que combinam.</li><li><strong>Desconfie da palavra parecida</strong> com a destacada (eminente/iminente).</li></ol>
<div class="tabela"><table>
<tr><th>Original</th><th>Troca</th><th>Funciona?</th></tr>
<tr><td>“O guarda <strong>assistiu</strong> a vítima.” (ajudou)</td><td>“O guarda <strong>socorreu</strong> a vítima.”</td><td>Sim</td></tr>
<tr><td>“Ele <strong>aspira ao</strong> cargo.” (deseja)</td><td>“Ele <strong>deseja o</strong> cargo.”</td><td>Sim, ajustando a preposição</td></tr>
<tr><td>“Ele <strong>aspira ao</strong> cargo.”</td><td>“Ele <strong>respira o</strong> cargo.”</td><td>Não: é outro sentido de “aspirar”</td></tr>
</table></div>
<p><strong>Exemplo:</strong> “A Guarda Municipal tem o papel de <strong>coibir</strong> infrações contra os bens do município.” “Reprimir” mantém o sentido; “incentivar” é o oposto; “registrar” muda a ação; “coabitar” só tem som parecido. O verbo “coibir” está no Estatuto Geral das Guardas Municipais (Lei 13.022/2014, art. 5º, II).</p>

<h3>3. Antônimos e seus tipos</h3>
<p><strong>Antônimos</strong> são palavras de sentido oposto, e o antônimo também depende do contexto: o contrário de “leve” é “pesado” em “mala leve”, mas “grave” em “ferimento leve”.</p>

<tr><th>Tipo</th><th>Como funciona</th><th>Exemplos</th></tr>

<h4>Antônimos formados por prefixo</h4>
<ul><li><strong>in-, im-, i-</strong>: legal / ilegal; possível / impossível; responsável / irresponsável.</li><li><strong>des-</strong>: honesto / desonesto; leal / desleal.</li><li><strong>a-, an-</strong>: típico / atípico; moral / amoral.</li><li><strong>anti-</strong>: social / antissocial; ético / antiético.</li></ul>
<div class="box"><strong>Cuidado:</strong> nem todo “in-” nega. <strong>Inflamável</strong> significa “que pega fogo com facilidade”, como “flamável”; o contrário é “não inflamável”.</div>
<div class="tabela"><table>
<tr><th>Frase</th><th>Antônimo no contexto</th></tr>
<tr><td>“A vítima teve um ferimento <strong>leve</strong>.”</td><td>grave</td></tr>
<tr><td>“A mochila era <strong>leve</strong>.”</td><td>pesada</td></tr>
<tr><td>“O relatório foi <strong>conciso</strong>.”</td><td>prolixo</td></tr>
<tr><td>“O prazo é <strong>exíguo</strong>.”</td><td>amplo</td></tr>
<tr><td>“A medida teve efeito <strong>efêmero</strong>.”</td><td>duradouro</td></tr>
</table></div>

<h3>4. Hiperônimos e hipônimos</h3>
<p><strong>Hiperônimo</strong> é a palavra geral (a categoria); <strong>hipônimo</strong>, a específica (um membro). Veículo → carro, moto, ônibus. Crime → furto, roubo, homicídio. Logradouro → rua, avenida, praça.</p>
<p>O geral pode retomar o específico: “Uma <strong>moto</strong> foi abandonada na praça. O <strong>veículo</strong> estava sem placa.” O contrário, em geral, não funciona, porque o leitor não sabia que o veículo era uma moto.</p>

<h3>5. Parônimos e homônimos</h3>
<p>Palavras <strong>parecidas na forma</strong> e <strong>diferentes no sentido</strong>: são a alternativa-armadilha mais comum nas questões de substituição.</p>
<div class="tabela"><table>
<tr><th>Palavra</th><th>Sentido</th><th>Palavra</th><th>Sentido</th></tr>
<tr><td><strong>mandado</strong></td><td>ordem judicial</td><td><strong>mandato</strong></td><td>período de cargo eletivo</td></tr>
<tr><td><strong>tráfego</strong></td><td>trânsito de veículos</td><td><strong>tráfico</strong></td><td>comércio ilegal</td></tr>
<tr><td><strong>flagrante</strong></td><td>evidente; ato surpreendido</td><td><strong>fragrante</strong></td><td>perfumado</td></tr>
<tr><td><strong>infringir</strong></td><td>violar uma norma</td><td><strong>infligir</strong></td><td>aplicar pena ou castigo</td></tr>
<tr><td><strong>eminente</strong></td><td>ilustre</td><td><strong>iminente</strong></td><td>prestes a acontecer</td></tr>
<tr><td><strong>ratificar</strong></td><td>confirmar</td><td><strong>retificar</strong></td><td>corrigir</td></tr>
<tr><td><strong>descrição</strong></td><td>ato de descrever</td><td><strong>discrição</strong></td><td>reserva, prudência</td></tr>
<tr><td><strong>comprimento</strong></td><td>extensão</td><td><strong>cumprimento</strong></td><td>saudação; execução</td></tr>
<tr><td><strong>deferir</strong></td><td>conceder</td><td><strong>diferir</strong></td><td>adiar; ser diferente</td></tr>
<tr><td><strong>emergir</strong></td><td>vir à tona</td><td><strong>imergir</strong></td><td>afundar</td></tr>
<tr><td><strong>emigrar</strong></td><td>sair do país</td><td><strong>imigrar</strong></td><td>entrar em outro país</td></tr>
<tr><td><strong>delatar</strong></td><td>denunciar</td><td><strong>dilatar</strong></td><td>ampliar, adiar</td></tr>
<tr><td><strong>despensa</strong></td><td>depósito de alimentos</td><td><strong>dispensa</strong></td><td>licença, liberação</td></tr>
<tr><td><strong>vultoso</strong></td><td>volumoso, de grande valor</td><td><strong>vultuoso</strong></td><td>rosto inchado e avermelhado</td></tr>
</table></div>
<h4>Homônimos</h4>
<ul><li><strong>Homófonos</strong> (mesmo som, grafia diferente): cassar (anular) / caçar (perseguir animais); sessão (reunião) / seção (setor) / cessão (ato de ceder); cela / sela; concerto (musical) / conserto (reparo); censo / senso; acender / ascender; espiar / expiar.</li><li><strong>Homógrafos</strong> (mesma grafia, pronúncia diferente): colher (verbo, “ê” fechado) / colher (talher, “é” aberto); sede (vontade de beber, “ê”) / sede (local, “é”).</li><li><strong>Perfeitos</strong> (mesma grafia e som): são (sadio) / são (verbo) / são (santo); cedo (advérbio) / cedo (verbo ceder).</li></ul>
<div class="box"><strong>Dica:</strong> associe cada parônimo a uma frase do cargo: “cumprir um <strong>mandado</strong>”, “controlar o <strong>tráfego</strong>”, “prender em <strong>flagrante</strong>”, “<strong>infringir</strong> o CTB”, “perigo <strong>iminente</strong>”, “<strong>cassar</strong> a habilitação”.</div>

<h3>6. Vocabulário de leis e provas</h3>
<div class="tabela"><table>
<tr><th>Palavra</th><th>Sentido</th><th>Antônimo</th></tr>
<tr><td>coibir</td><td>reprimir, impedir</td><td>incentivar</td></tr>
<tr><td>zelar</td><td>cuidar com atenção</td><td>descuidar</td></tr>
<tr><td>vedado</td><td>proibido</td><td>permitido, facultado</td></tr>
<tr><td>facultado</td><td>permitido, opcional</td><td>obrigatório, vedado</td></tr>
<tr><td>precípuo</td><td>principal, essencial</td><td>secundário</td></tr>
<tr><td>ensejar</td><td>possibilitar, dar ocasião</td><td>impedir</td></tr>
<tr><td>obstar / óbice</td><td>impedir / obstáculo</td><td>facilitar / facilidade</td></tr>
<tr><td>dirimir</td><td>resolver (dúvida, conflito)</td><td>suscitar</td></tr>
<tr><td>prescindir</td><td>dispensar</td><td>precisar, depender</td></tr>
<tr><td>célere</td><td>rápido</td><td>moroso</td></tr>
<tr><td>exíguo</td><td>escasso</td><td>amplo</td></tr>
<tr><td>profícuo</td><td>proveitoso</td><td>inútil</td></tr>
<tr><td>efêmero</td><td>passageiro</td><td>duradouro</td></tr>
<tr><td>inócuo</td><td>sem efeito, inofensivo</td><td>eficaz; nocivo</td></tr>
<tr><td>incólume</td><td>ileso, intacto</td><td>ferido, danificado</td></tr>
<tr><td>contumaz</td><td>persistente, reincidente</td><td>ocasional</td></tr>
<tr><td>prolixo</td><td>longo demais</td><td>conciso</td></tr>
</table></div>
<div class="box"><strong>Atenção a “prescindir”:</strong> “prescindir de” significa <strong>dispensar</strong>, não “precisar”. “Não prescinde de” quer dizer “depende de”.</div>

<h3>7. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Em “A prefeitura <strong>interditou</strong> a rua para a feira”, o termo destacado pode ser substituído, sem alteração de sentido, por</p>
<ol class="alts" type="A"><li>liberou.</li><li>asfaltou.</li><li>bloqueou.</li><li>iluminou.</li><li>vistoriou.</li></ol>
<p><strong>Resposta: C.</strong> Interditar é impedir o uso; (A) é o antônimo.</p>
<h4>Questão 2</h4>
<p>Assinale a alternativa em que a palavra destacada está empregada corretamente.</p>
<ol class="alts" type="A"><li>O juiz expediu o <strong>mandato</strong> de prisão.</li><li>O motorista <strong>infligiu</strong> o Código de Trânsito.</li><li>A operação reduziu o <strong>tráfico</strong> de veículos na avenida.</li><li>O suspeito foi preso em <strong>flagrante</strong>.</li><li>A prefeitura vai <strong>retificar</strong> o acordo, confirmando todos os termos.</li></ol>
<p><strong>Resposta: D.</strong> O correto seria: mandado, infringiu, tráfego e ratificar.</p>
<h4>Questão 3</h4>
<p>Em “A atuação preventiva não <strong>prescinde</strong> da presença dos agentes”, a atuação preventiva</p>
<ol class="alts" type="A"><li>dispensa a presença dos agentes.</li><li>depende da presença dos agentes.</li><li>proíbe a presença dos agentes.</li><li>antecede a presença dos agentes.</li><li>substitui a presença dos agentes.</li></ol>
<p><strong>Resposta: B.</strong> “Não prescindir” é não poder dispensar, ou seja, depender.</p>
<h4>Questão 4</h4>
<p>No par “comprar / vender”, a relação de sentido é a mesma que em</p>
<ol class="alts" type="A"><li>quente / frio.</li><li>vivo / morto.</li><li>dar / receber.</li><li>alto / baixo.</li><li>aprovado / reprovado.</li></ol>
<p><strong>Resposta: C.</strong> Antônimos recíprocos. (A) e (D) são graduais; (B) e (E), complementares.</p>

<h3>8. Na rotina do guarda</h3>
<ul><li><strong>Relatórios.</strong> “O condutor <strong>infligiu</strong> a lei” em vez de “<strong>infringiu</strong>” compromete o documento.</li><li><strong>Linguagem adequada.</strong> Em documento oficial, usa-se “faleceu”, nunca uma expressão informal.</li><li><strong>Leitura de leis.</strong> “Vedado” e “facultado” são antônimos; confundi-los inverte a regra.</li><li><strong>Atendimento.</strong> Trocar uma palavra técnica por um sinônimo simples ajuda o cidadão a entender.</li></ul>

<h3>9. Onde a Vunesp costuma pegar</h3>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>Sinônimo de outro sentido (polissemia)</td><td>Defina o sentido na frase antes das alternativas</td></tr>
<tr><td>Parônimo na alternativa</td><td>Desconfie da palavra parecida com a destacada</td></tr>
<tr><td>Antônimo disfarçado (“prescindir” lido como “precisar”)</td><td>Substitua e releia a frase inteira</td></tr>
<tr><td>Intensidade diferente (receio x pavor)</td><td>Compare a força das palavras</td></tr>
<tr><td>Classe gramatical ou preposição que não combina</td><td>A palavra nova precisa caber na mesma posição</td></tr>
<tr><td>Prefixo que não nega (inflamável)</td><td>Confira se o prefixo realmente nega</td></tr>
</table></div>

<h3>10. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><td>Sinônimo</td><td>Sentido próximo; atenção a registro, intensidade e valor</td></tr>
<tr><td>Polissemia</td><td>O sinônimo muda com o sentido em uso</td></tr>
<tr><td>Teste da troca</td><td>Sentido no contexto, troca real, mesmo sentido, mesma gramática, desconfiar da palavra parecida</td></tr>
<tr><td>Antônimos</td><td>Graduais (com meio-termo), complementares (sem meio-termo), recíprocos (dois lados)</td></tr>
<tr><td>Hiperônimo</td><td>O geral retoma o específico: moto → veículo</td></tr>
<tr><td>Parônimos do cargo</td><td>mandado/mandato; tráfego/tráfico; infringir/infligir; iminente/eminente; ratificar/retificar</td></tr>
<tr><td>Homófonos do cargo</td><td>cassar/caçar; sessão/seção/cessão; cela/sela</td></tr>
<tr><td>Prescindir</td><td>Dispensar, não “precisar”</td></tr>
</table></div>

<h3>1. Denotação e conotação</h3>
<p><strong>Sentido próprio (denotação)</strong> é o sentido literal, o primeiro do dicionário. <strong>Sentido figurado (conotação)</strong> é um sentido novo, criado pela frase a partir de uma associação de ideias.</p>
<div class="tabela"><table>
<tr><th>Palavra</th><th>Sentido próprio</th><th>Sentido figurado</th></tr>
<tr><td>pedra</td><td>“Tropeçou numa pedra da calçada.”</td><td>“Ele tem um coração de pedra.” (insensível)</td></tr>
<tr><td>fogo</td><td>“O fogo atingiu o terreno.”</td><td>“A discussão pegou fogo.” (ficou intensa)</td></tr>
<tr><td>porta</td><td>“Feche a porta do carro.”</td><td>“O curso abriu as portas do emprego.” (oportunidades)</td></tr>
<tr><td>frio</td><td>“A noite está fria.”</td><td>“Recebeu a notícia com um olhar frio.” (sem emoção)</td></tr>
<tr><td>doce</td><td>“O café está doce.”</td><td>“Ela tem uma voz doce.” (suave)</td></tr>
</table></div>
<div class="box"><strong>Teste do sentido literal:</strong> pergunte “isso pode acontecer ao pé da letra?”. Se a leitura literal for impossível no contexto, o sentido é figurado.</div>
<h4>Expressões idiomáticas</h4>
<p>Grupos de palavras com sentido figurado fixo, que não se deduz das palavras isoladas.</p>
<div class="tabela"><table>
<tr><th>Expressão</th><th>Sentido</th></tr>
<tr><td>pisar na bola</td><td>errar, falhar</td></tr>
<tr><td>custar os olhos da cara</td><td>ser muito caro</td></tr>
<tr><td>chover no molhado</td><td>repetir o óbvio</td></tr>
<tr><td>pôr a mão no fogo por alguém</td><td>garantir a honestidade de alguém</td></tr>
<tr><td>dar com a língua nos dentes</td><td>revelar um segredo</td></tr>
<tr><td>fazer vista grossa</td><td>fingir que não viu</td></tr>
<tr><td>tirar o cavalo da chuva</td><td>desistir de uma expectativa</td></tr>
<tr><td>ficar de braços cruzados</td><td>não agir</td></tr>
<tr><td>enxugar gelo</td><td>fazer esforço inútil</td></tr>
<tr><td>colocar o carro na frente dos bois</td><td>inverter a ordem certa</td></tr>
</table></div>

<h3>2. Figuras de palavra</h3>
<p>Mudam o sentido de um termo. As gramáticas nem sempre agrupam as figuras do mesmo jeito; para a prova, o importante é reconhecer o efeito.</p>
<figure class="fig">
<svg viewBox="0 0 760 314" role="img" aria-label="Semelhança ou proximidade separa as três figuras" font-size="13">
<defs><marker id="mk5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker></defs>
<text x="24" y="28" font-size="16" font-weight="600">Semelhança ou proximidade separa as três figuras</text>
<path class="ln" d="M240 140H298" marker-end="url(#mk5)"/><path class="ln" d="M500 140H516V98H546" marker-end="url(#mk5)"/><path class="ln" d="M516 140V182H546" marker-end="url(#mk5)"/><path class="ln" d="M140 182V232" marker-end="url(#mk5)"/>
<polygon class="bx" points="40,140 140,98 240,140 140,182"/><text x="140" y="136" text-anchor="middle">Relação de</text><text x="140" y="152" text-anchor="middle">semelhança?</text>
<polygon class="bx" points="300,140 400,98 500,140 400,182"/><text x="400" y="136" text-anchor="middle">Há conectivo</text><text x="400" y="152" text-anchor="middle">(como, parece)?</text>
<rect class="ac" x="548" y="70" width="196" height="56" rx="8"/><text x="646" y="94" text-anchor="middle" font-weight="600">Comparação</text><text x="646" y="112" text-anchor="middle" font-size="12">“A sala parecia um forno.”</text>
<rect class="ac" x="548" y="154" width="196" height="56" rx="8"/><text x="646" y="178" text-anchor="middle" font-weight="600">Metáfora</text><text x="646" y="196" text-anchor="middle" font-size="12">“A sala era um forno.”</text>
<rect class="ac" x="42" y="234" width="196" height="56" rx="8"/><text x="140" y="258" text-anchor="middle" font-weight="600">Metonímia</text><text x="140" y="276" text-anchor="middle" font-size="12">“Li Machado de Assis.”</text>
<text class="q" x="269" y="130" text-anchor="middle" font-size="12">sim</text><text class="q" x="531" y="90" text-anchor="middle" font-size="12">sim</text><text class="q" x="531" y="174" text-anchor="middle" font-size="12">não</text><text class="q" x="150" y="212" font-size="12">não: proximidade</text>
</svg>
<figcaption>Duas perguntas resolvem a dúvida mais comum: se a relação é de semelhança e, se for, se há conectivo.</figcaption>
</figure>
<div class="tabela"><table>
<tr><th>Figura</th><th>O que faz</th><th>Exemplo</th></tr>
<tr><td><strong>Comparação</strong></td><td>Aproxima por semelhança, com conectivo</td><td>“A avenida parece um estacionamento.”</td></tr>
<tr><td><strong>Metáfora</strong></td><td>Aproxima por semelhança, sem conectivo: A é B</td><td>“A avenida é um estacionamento.”</td></tr>
<tr><td><strong>Metonímia</strong></td><td>Troca por proximidade, não por semelhança</td><td>“Li Machado de Assis.”</td></tr>
<tr><td><strong>Catacrese</strong></td><td>Metáfora que virou nome comum</td><td>pé da mesa, braço da cadeira, dente de alho</td></tr>
<tr><td><strong>Sinestesia</strong></td><td>Mistura sensações de sentidos diferentes</td><td>“voz doce”, “olhar frio”, “cor gritante”</td></tr>
<tr><td><strong>Antonomásia</strong></td><td>Nomeia por uma característica marcante</td><td>“o Rei do Futebol” (Pelé); “a Princesa d’Oeste” (Campinas)</td></tr>
</table></div>
<h4>Os tipos de metonímia</h4>
<div class="tabela"><table>
<tr><th>Relação</th><th>Exemplo</th><th>Quer dizer</th></tr>
<tr><td>Autor pela obra</td><td>“Leu Machado de Assis nas férias.”</td><td>os livros dele</td></tr>
<tr><td>Continente pelo conteúdo</td><td>“Bebeu dois copos.”</td><td>a bebida</td></tr>
<tr><td>Lugar pela instituição</td><td>“O Planalto anunciou a medida.”</td><td>a Presidência</td></tr>
<tr><td>Parte pelo todo (sinédoque)</td><td>“Faltam braços na lavoura.”</td><td>trabalhadores</td></tr>
<tr><td>Marca pelo produto</td><td>“Pediu um Bombril para a pia.”</td><td>palha de aço</td></tr>
<tr><td>Abstrato pelo concreto</td><td>“A juventude ocupou as ruas.”</td><td>os jovens</td></tr>
<tr><td>Efeito pela causa</td><td>“Ganha a vida com o suor do rosto.”</td><td>o trabalho</td></tr>
<tr><td>Matéria pelo objeto</td><td>“Os metais da banda tocaram alto.”</td><td>os instrumentos</td></tr>
</table></div>

<h3>3. Figuras de pensamento</h3>
<div class="tabela"><table>
<tr><th>Figura</th><th>O que faz</th><th>Exemplo</th></tr>
<tr><td><strong>Ironia</strong></td><td>Diz o contrário do que pensa, com crítica ou humor</td><td>“Que motorista prudente: passou o sinal vermelho a 100 km/h.”</td></tr>
<tr><td><strong>Hipérbole</strong></td><td>Exagera para dar ênfase</td><td>“Morri de rir.”</td></tr>
<tr><td><strong>Eufemismo</strong></td><td>Suaviza uma ideia desagradável</td><td>“Ele nos deixou” (morreu)</td></tr>
<tr><td><strong>Personificação</strong></td><td>Dá ações humanas a seres não humanos</td><td>“O vento uivava na janela.”</td></tr>
<tr><td><strong>Antítese</strong></td><td>Aproxima ideias opostas, sem contradição</td><td>“Riso e choro dividiam a mesma sala.”</td></tr>
<tr><td><strong>Paradoxo</strong></td><td>Une opostos no mesmo ser, numa afirmação aparentemente impossível</td><td>“É ferida que dói, e não se sente” (Camões)</td></tr>
<tr><td><strong>Gradação</strong></td><td>Enumera em intensidade crescente ou decrescente</td><td>“Andou, correu, voou.”</td></tr>
<tr><td><strong>Lítotes</strong></td><td>Afirma negando o contrário</td><td>“Ele não é nada bobo.”</td></tr>
</table></div>
<p>Luís de Camões (século XVI, domínio público):</p>
<blockquote>Amor é fogo que arde sem se ver,<br>é ferida que dói, e não se sente;<br>é um contentamento descontente,<br>é dor que desatina sem doer.</blockquote>
<ul><li><strong>Antítese x paradoxo:</strong> na antítese os opostos convivem lado a lado; no paradoxo estão no mesmo ser ao mesmo tempo (“contentamento descontente”).</li><li><strong>Ironia x hipérbole:</strong> a ironia inverte o sentido (“Que trânsito tranquilo!” no engarrafamento); a hipérbole só aumenta (“Fiquei um século parado”).</li></ul>

<h3>4. Figuras de construção e de som</h3>
<div class="tabela"><table>
<tr><th>Figura</th><th>Exemplo</th></tr>
<tr><td><strong>Elipse</strong>: omite termo subentendido</td><td>“Na praça, só dois guardas.” (havia)</td></tr>
<tr><td><strong>Zeugma</strong>: omite termo já citado</td><td>“Ele gosta de futebol; ela, de vôlei.”</td></tr>
<tr><td><strong>Pleonasmo</strong>: repete para dar ênfase</td><td>“Vi com meus próprios olhos.”</td></tr>
<tr><td><strong>Polissíndeto</strong>: repete o conectivo</td><td>“E corria, e gritava, e pedia ajuda.”</td></tr>
<tr><td><strong>Assíndeto</strong>: retira os conectivos</td><td>“Chegou, olhou, saiu.”</td></tr>
<tr><td><strong>Anáfora</strong>: repete palavra no início de versos</td><td>“É ferida... é um contentamento... é dor...”</td></tr>
<tr><td><strong>Aliteração</strong>: repete consoantes</td><td>“O rato roeu a roupa do rei de Roma.”</td></tr>
<tr><td><strong>Assonância</strong>: repete vogais</td><td>“A lua nua flutua na rua.”</td></tr>
<tr><td><strong>Onomatopeia</strong>: imita um som</td><td>“Trim! O telefone tocou.”</td></tr>
</table></div>
<div class="box"><strong>Pleonasmo vicioso</strong> é erro: “subir para cima”, “elo de ligação”, “surpresa inesperada”. E atenção: “anáfora” como figura (repetição) não é a anáfora da coesão (retomada), vista no posto 1.</div>

<h3>5. Sentido figurado fora da literatura</h3>
<div class="tabela"><table>
<tr><th>Onde</th><th>Exemplo</th><th>Figura</th></tr>
<tr><td>Título de notícia</td><td>“Chuva transforma avenida em rio”</td><td>Metáfora</td></tr>
<tr><td>Notícia</td><td>“O Paço Municipal decidiu adiar a obra.”</td><td>Metonímia</td></tr>
<tr><td>Publicidade</td><td>“Nosso café abraça você pela manhã.”</td><td>Personificação</td></tr>
<tr><td>Artigo de opinião</td><td>“A câmera registra; ela não acolhe a vítima.”</td><td>Personificação negada</td></tr>
</table></div>
<p>Em leis, boletins e relatórios, a linguagem deve ser <strong>denotativa</strong>: “o suspeito saiu voando” vira “saiu correndo em direção à avenida”; “havia um mar de gente” vira “havia cerca de 200 pessoas”.</p>

<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Em “O Paço Municipal anunciou novas regras para o comércio”, ocorre</p>
<ol class="alts" type="A"><li>metáfora.</li><li>metonímia.</li><li>hipérbole.</li><li>antítese.</li><li>catacrese.</li></ol>
<p><strong>Resposta: B.</strong> O prédio está no lugar da administração: proximidade, não semelhança.</p>
<h4>Questão 2</h4>
<p>“Que atendimento rápido: esperei só quatro horas na fila.” A figura predominante é a</p>
<ol class="alts" type="A"><li>hipérbole.</li><li>ironia.</li><li>personificação.</li><li>metonímia.</li><li>comparação.</li></ol>
<p><strong>Resposta: B.</strong> O elogio é desmentido pelo fato.</p>
<h4>Questão 3</h4>
<p>Assinale a alternativa que apresenta metáfora, e não comparação.</p>
<ol class="alts" type="A"><li>Ele dirige como um piloto de corrida.</li><li>A sala parecia um forno.</li><li>O centro da cidade é um formigueiro ao meio-dia.</li><li>Ela corre feito uma flecha.</li><li>Os prédios, tal qual gigantes, cercavam a praça.</li></ol>
<p><strong>Resposta: C.</strong> Não há conectivo: o centro é um formigueiro.</p>

<h3>7. Na rotina do guarda</h3>
<ul><li><strong>Relato objetivo:</strong> o boletim pede denotação.</li><li><strong>Escuta atenta:</strong> “o bairro está largado”, “esse barulho me mata”; entender a figura revela a queixa real.</li><li><strong>Eufemismo no atendimento:</strong> em situações delicadas, a linguagem cuidadosa faz parte do bom atendimento.</li></ul>

<h3>8. Onde a Vunesp costuma pegar</h3>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>Metáfora x comparação</td><td>Procure o conectivo</td></tr>
<tr><td>Metáfora x metonímia</td><td>Semelhança x proximidade</td></tr>
<tr><td>Ironia x hipérbole</td><td>Inverte x só aumenta</td></tr>
<tr><td>Antítese x paradoxo</td><td>Lado a lado x no mesmo ser</td></tr>
<tr><td>Catacrese tratada como metáfora criativa</td><td>“Pé da mesa” já é o nome comum</td></tr>
<tr><td>Expressão idiomática lida ao pé da letra</td><td>Procure o sentido fixo da expressão</td></tr>
<tr><td>Instituição que “age” (“a Câmara aprovou”)</td><td>É metonímia (os vereadores), não personificação</td></tr>
</table></div>

<h3>9. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><td>Denotação x conotação</td><td>Literal x figurado; teste do “ao pé da letra”</td></tr>
<tr><td>Comparação x metáfora</td><td>Com conectivo x sem conectivo</td></tr>
<tr><td>Metonímia</td><td>Proximidade: autor/obra, lugar/instituição, parte/todo, marca/produto</td></tr>
<tr><td>Catacrese / sinestesia</td><td>Pé da mesa / voz doce</td></tr>
<tr><td>Pensamento</td><td>Ironia, hipérbole, eufemismo, personificação, antítese, paradoxo, gradação, lítotes</td></tr>
<tr><td>Construção</td><td>Elipse, zeugma, pleonasmo, polissíndeto, assíndeto, anáfora</td></tr>
<tr><td>Som</td><td>Aliteração, assonância, onomatopeia</td></tr>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I; Luís de Camões, “Amor é fogo que arde sem se ver” (domínio público). Referências de base: Bechara, <em>Moderna Gramática Portuguesa</em>; Cunha e Cintra, <em>Nova Gramática do Português Contemporâneo</em>. Exemplos criados para esta aula.</p>`,

<span class="status">Versão 1 · em revisão</span>
<p>Pontuação não é pausa para respirar: é parte da estrutura da frase e pode mudar o sentido. A Vunesp cobra principalmente a vírgula, em três formatos: apontar a frase corretamente pontuada, explicar por que uma vírgula foi usada e dizer se uma mudança de pontuação altera o sentido.</p>

<h3>Mapa do assunto</h3>

{id:"p4-13",n:1,e:"Em “Afaste-se da área!”, o ponto de exclamação indica",a:["ordem enfática.","dúvida.","pergunta.","citação.","interrupção da fala."],c:"Exclamação marca emoção ou ordem enfática."},
{id:"p4-14",n:1,e:"Em “— Onde fica a delegacia? — perguntou a turista”, o primeiro travessão indica",a:["o início da fala de uma personagem.","uma enumeração.","uma ironia.","uma informação acessória.","o fim do parágrafo."],c:"No diálogo, o travessão introduz a fala."},
{id:"p4-15",n:1,e:"Em “Chegou, olhou, saiu”, as vírgulas separam",a:["orações sem conectivo.","vocativos.","apostos.","adjuntos adverbiais.","sujeito e verbo."],c:"Orações coordenadas assindéticas."},
{id:"p4-16",n:1,e:"Em “O suspeito fugiu, isto é, deixou o local antes da equipe”, as vírgulas isolam",a:["uma expressão explicativa.","um vocativo.","o sujeito.","uma data.","uma pergunta."],c:"“Isto é” introduz uma explicação e fica entre vírgulas."},
{id:"p4-17",n:1,e:"Assinale a frase corretamente pontuada.",a:["O guarda chegou e isolou a área.","O guarda, chegou e isolou a área.","O guarda chegou e isolou, a área.","O guarda chegou e, isolou a área.","O, guarda chegou e isolou a área."],c:"Mesmo sujeito e “e” aditivo: sem vírgula. As outras quebram a regra de ouro."},
{id:"p4-18",n:1,e:"Em “O ‘atalho’ levou o motorista direto ao engarrafamento”, as aspas indicam",a:["ironia.","citação literal.","título de obra.","palavra estrangeira.","enumeração."],c:"O “atalho” não encurtou nada: aspas de sentido irônico."},
{id:"p4-19",n:1,e:"Em “Quando a viatura chegou, o local estava vazio”, a vírgula separa",a:["a oração adverbial anteposta à principal.","o sujeito do verbo.","um vocativo.","um aposto.","itens de enumeração."],c:"Oração adverbial antes da principal pede vírgula."},
{id:"p4-20",n:1,e:"Assinale a frase em que a vírgula separa indevidamente o verbo de seu complemento.",a:["A equipe encontrou, a bicicleta furtada.","A equipe, segundo o boletim, encontrou a bicicleta.","No sábado, a equipe encontrou a bicicleta.","A equipe encontrou a bicicleta, que estava presa a um poste.","A equipe encontrou a bicicleta e avisou o dono."],c:"“Encontrou” e “a bicicleta furtada” não podem ser separados."},
{id:"p4-21",n:2,e:"“Os moradores que reclamaram foram ouvidos.” Pela pontuação, entende-se que",a:["só os moradores que reclamaram foram ouvidos.","todos os moradores reclamaram.","nenhum morador reclamou.","todos os moradores foram ouvidos.","os moradores não foram ouvidos."],c:"Sem vírgulas, a oração é restritiva: separa parte do grupo."},
{id:"p4-22",n:2,e:"“Os agentes, que estavam fardados, entraram no prédio.” Pela pontuação, entende-se que",a:["todos os agentes citados estavam fardados.","só parte dos agentes estava fardada.","nenhum agente estava fardado.","só os fardados entraram.","os fardados ficaram do lado de fora."],c:"Com vírgulas, a oração é explicativa: vale para todos."},
{id:"p4-23",n:2,e:"Em “Carlos, o guarda chegou”, a pontuação indica que",a:["alguém fala com Carlos e informa que o guarda chegou.","Carlos é o guarda que chegou.","Carlos e o guarda chegaram.","o guarda se chama Carlos.","Carlos não chegou."],c:"“Carlos” é vocativo."},
{id:"p4-24",n:2,e:"Em “Carlos, o guarda, chegou”, a pontuação indica que",a:["Carlos é o guarda que chegou.","alguém fala com Carlos.","Carlos e o guarda são pessoas diferentes.","o guarda não chegou.","Carlos é um vocativo."],c:"“O guarda” é aposto de “Carlos”."},
{id:"p4-25",n:2,e:"Sobre as ordens “Não, pare!” e “Não pare!”, é correto afirmar que",a:["têm sentidos opostos.","têm o mesmo sentido.","as duas mandam continuar.","as duas mandam parar.","a vírgula é facultativa e não muda nada."],c:"Com vírgula: não (resposta) + pare. Sem vírgula: não pare, continue."},
{id:"p4-26",n:2,e:"Em “A ronda, porém, foi mantida”, as vírgulas",a:["isolam uma conjunção deslocada.","separam sujeito e verbo indevidamente.","isolam um vocativo.","isolam um aposto.","indicam omissão de verbo."],c:"“Porém” fora do início da oração fica entre vírgulas; a intercalação justifica as duas vírgulas."},
{id:"p4-27",n:2,e:"Em “Eu fiquei na base; ele, na viatura”, a vírgula após “ele” indica",a:["a omissão do verbo “ficou”.","um vocativo.","uma enumeração.","uma oração intercalada.","um aposto."],c:"Zeugma: o verbo já citado é omitido e marcado pela vírgula."},
{id:"p4-28",n:2,e:"Em “Participaram a Guarda, com dez agentes; a PM, com seis; e a Defesa Civil, com quatro”, o ponto e vírgula",a:["separa itens de uma enumeração que já têm vírgulas internas.","introduz uma fala.","isola um vocativo.","indica dúvida.","separa sujeito e verbo."],c:"Evita a confusão que várias vírgulas seguidas causariam."},
{id:"p4-29",n:2,e:"Em “Só havia uma saída: chamar reforço”, os dois-pontos introduzem",a:["uma explicação do que foi anunciado.","uma fala de personagem.","um vocativo.","uma pergunta.","um título."],c:"Esclarecem qual era a saída."},
{id:"p4-30",n:2,e:"Em “A operação, disse o comandante, foi um sucesso”, as vírgulas isolam",a:["uma oração intercalada.","um vocativo.","um aposto.","uma conjunção.","uma enumeração."],c:"“Disse o comandante” interrompe a oração principal."},
{id:"p4-31",n:2,e:"Em “O guarda chamou, e o suspeito correu”, a vírgula antes de “e” é admitida porque",a:["as orações têm sujeitos diferentes.","o “e” tem valor de explicação.","há um vocativo.","a frase é uma pergunta.","o sujeito é o mesmo."],c:"Sujeitos diferentes (o guarda / o suspeito) justificam a vírgula."},
{id:"p4-32",n:2,e:"Em “Estudou o ano todo, e não passou”, o “e” tem valor",a:["adversativo, equivalente a “mas”.","aditivo.","conclusivo.","explicativo.","temporal."],c:"Com valor de oposição, o “e” vem precedido de vírgula."},
{id:"p4-33",n:2,e:"A frase “O comandante quis saber quem estava de plantão” não leva ponto de interrogação porque",a:["é uma pergunta indireta.","é uma ordem.","tem vocativo.","é uma exclamação.","tem verbo no passado."],c:"A pergunta está embutida numa declaração: não há “?”."},
{id:"p4-34",n:2,e:"Em “A praça — reformada no ano passado — voltou a receber famílias”, os travessões podem ser substituídos, sem alteração de sentido, por",a:["vírgulas.","ponto final.","dois-pontos.","ponto de interrogação.","aspas."],c:"Vírgulas e travessões isolam a mesma intercalação; muda só o destaque."},
{id:"p4-35",n:2,e:"Assinale a frase em que a vírgula isola um adjunto adverbial deslocado.",a:["No fim da tarde, os guardas retornaram à base.","Senhor, aguarde aqui.","Campinas, a Princesa d’Oeste, cresceu.","Foram chamados guardas, bombeiros e paramédicos.","A ronda, contudo, continuou."],c:"“No fim da tarde” (tempo) está no início. As outras: vocativo, aposto, enumeração, conjunção."},
{id:"p4-36",n:2,tx:"ta",e:"No 1º parágrafo, a vírgula após “Segundo a Guarda Municipal” isola",a:["uma expressão deslocada que indica a fonte da informação.","um vocativo.","o sujeito do verbo.","uma oração restritiva.","um aposto."],c:"“Segundo a Guarda Municipal” é adjunto (conformidade) anteposto à oração."},
{id:"p4-37",n:2,tx:"tc",e:"No 1º parágrafo, em “Elas são úteis, sem dúvida”, a vírgula separa",a:["uma expressão adverbial de afirmação.","um vocativo.","o sujeito do verbo.","duas orações adversativas.","um aposto."],c:"“Sem dúvida” é expressão de reforço, separada por vírgula."},
{id:"p4-38",n:2,tx:"tc",e:"No 3º parágrafo, o ponto final que isola “Custa.” produz",a:["ênfase: uma frase curta que confirma a objeção.","uma pergunta retórica.","uma enumeração.","uma citação literal.","um erro de pontuação."],c:"A frase de uma palavra destaca a concessão antes do “Mas”."},
{id:"p4-39",n:2,tx:"tb",e:"No 3º parágrafo, as aspas em “bom dia” indicam",a:["reprodução literal da fala.","ironia.","palavra estrangeira.","título.","gíria."],c:"Reproduzem a fala exata dos personagens."},
{id:"p4-40",n:2,e:"Assinale a frase incorretamente pontuada.",a:["A praça reformada no ano passado, voltou a receber famílias.","A praça, reformada no ano passado, voltou a receber famílias.","A praça reformada no ano passado voltou a receber famílias.","No ano passado, a praça foi reformada.","A praça foi reformada e voltou a receber famílias."],c:"Uma vírgula só entre o sujeito (“A praça reformada no ano passado”) e o verbo. (B) tem duas vírgulas, isolando a intercalação."},
{id:"p4-41",n:3,e:"“Os envolvidos, que estavam alcoolizados, foram conduzidos à delegacia.” Retirando-se as vírgulas,",a:["passa-se a entender que só os envolvidos alcoolizados foram conduzidos.","o sentido permanece exatamente o mesmo.","passa-se a entender que todos estavam alcoolizados.","a frase fica gramaticalmente errada.","passa-se a entender que ninguém foi conduzido."],c:"De explicativa (todos) para restritiva (só parte)."},
{id:"p4-42",n:3,e:"Assinale a alternativa em que a retirada da vírgula NÃO altera o sentido.",a:["Ontem, a equipe saiu cedo.","Não, pare!","Carlos, o guarda chegou.","Os guardas, que estavam de folga, foram convocados.","Senhor, o documento caiu."],c:"Com adjunto curto, a vírgula é facultativa. Nas demais, sai um vocativo, uma resposta ou uma explicativa."},
{id:"p4-43",n:3,e:"Compare: (I) “O suspeito disse: o guarda mentiu.” (II) “O suspeito, disse o guarda, mentiu.” É correto afirmar que",a:["em I o suspeito acusa o guarda; em II o guarda acusa o suspeito.","as duas frases têm o mesmo sentido.","em I o guarda acusa o suspeito.","em II o suspeito acusa o guarda.","as duas frases são incorretas."],c:"A pontuação inverte quem fala e quem é acusado."},
{id:"p4-44",n:3,e:"Assinale a frase corretamente pontuada.",a:["Os guardas, segundo o comandante, isolaram a área.","Os guardas, segundo o comandante isolaram a área.","Os guardas segundo o comandante, isolaram a área.","Os guardas segundo, o comandante, isolaram a área.","Os guardas, segundo, o comandante isolaram a área."],c:"A intercalação “segundo o comandante” pede duas vírgulas, uma de cada lado."},
{id:"p4-45",n:3,e:"Assinale a frase em que o ponto e vírgula está corretamente empregado.",a:["A equipe chegou às 22h; o suspeito, porém, já havia deixado o local.","A equipe; chegou às 22h.","Foram apreendidos; um celular e uma carteira.","O guarda pediu; que todos se afastassem.","Quando a viatura chegou; o local estava vazio."],c:"Separa duas orações, a segunda já com vírgulas internas. Nas outras, o sinal corta ligações da frase."},
{id:"p4-46",n:3,e:"Em “Só havia uma saída: chamar reforço”, assinale a reescrita que mantém o sentido.",a:["Só havia uma saída, que era chamar reforço.","Só havia uma saída; e chamar reforço.","Só havia uma saída? Chamar reforço.","Só havia, uma saída chamar reforço.","Só havia uma saída mas chamar reforço."],c:"A oração “que era chamar reforço” faz o mesmo papel explicativo dos dois-pontos."},
{id:"p4-47",n:3,e:"“A praça, onde ocorreu o furto, fica no centro.” Retirando-se as vírgulas, a oração “onde ocorreu o furto” passa a",a:["restringir, distinguindo essa praça de outras.","explicar, valendo para todas as praças.","funcionar como vocativo.","funcionar como aposto.","indicar tempo."],c:"Sem vírgulas, a oração passa a identificar qual praça, entre outras possíveis."},
{id:"p4-48",n:3,e:"Assinale a frase em que a vírgula antes de “e” está justificada.",a:["O vigia avisou, e o guarda chegou em minutos.","O guarda chegou, e isolou a área.","Os guardas, e os bombeiros chegaram.","Ele comprou pão, e leite.","A equipe saiu, e voltou."],c:"Sujeitos diferentes (o vigia / o guarda). Nas outras, o sujeito é o mesmo, há enumeração simples ou separação do sujeito."},
{id:"p4-49",n:3,tx:"tc",e:"No 2º parágrafo, em “A câmera registra; ela não acolhe a vítima, não orienta o pedestre perdido...”, o ponto e vírgula separa",a:["o que a câmera faz do que ela não faz.","um vocativo do restante da frase.","o sujeito do verbo.","uma pergunta de sua resposta.","uma citação literal."],c:"Divide o período em duas partes que se contrapõem; a segunda tem vírgulas internas."},
{id:"p4-50",n:3,e:"Em “O local já estava vazio quando a viatura chegou”, a colocação de vírgula antes de “quando” é",a:["facultativa, por se tratar de oração adverbial depois da principal.","obrigatória, por se tratar de oração adverbial.","proibida, por separar sujeito e verbo.","obrigatória, por haver vocativo.","proibida, por separar verbo e complemento."],c:"Posposta, a adverbial admite ou dispensa a vírgula."},
{id:"p4-51",n:3,e:"Em “Faltou apenas uma coisa à operação — sorte”, o travessão",a:["destaca o termo final.","introduz uma fala.","isola um vocativo.","indica dúvida.","separa sujeito e verbo."],c:"O travessão dá ênfase à palavra que encerra a frase."},
{id:"p4-52",n:3,e:"Assinale a alternativa inteiramente correta quanto à pontuação.",a:["Senhor, por favor, aguarde aqui; a área ainda está isolada.","Senhor por favor, aguarde aqui; a área ainda, está isolada.","Senhor, por favor aguarde, aqui a área; ainda está isolada.","Senhor, por favor, aguarde, aqui; a área ainda está, isolada.","Senhor por favor aguarde aqui, a área, ainda está isolada."],c:"Vocativo e expressão de cortesia isolados; ponto e vírgula entre as orações; nenhuma vírgula dentro da segunda oração."},
{id:"p4-53",n:3,e:"Em “O guarda, Carlos, chegou”, as vírgulas indicam que “Carlos”",a:["é aposto explicativo que nomeia o guarda já identificado no contexto.","é vocativo.","é o sujeito, e “o guarda” é vocativo.","distingue esse guarda de outros guardas presentes.","é adjunto adverbial."],c:"Entre vírgulas, o aposto acrescenta o nome; sem vírgulas (“o guarda Carlos”) ele restringiria, distinguindo Carlos de outros guardas."},
{id:"p4-54",n:3,e:"Em “A equipe fez um ‘briefing’ antes da ação”, as aspas",a:["destacam uma palavra estrangeira.","indicam ironia obrigatória.","reproduzem uma fala.","marcam um título de obra.","indicam dúvida do autor."],c:"Estrangeirismos costumam vir entre aspas ou em itálico."},
{id:"p4-55",n:3,e:"Assinale a pontuação correta para introduzir a fala da testemunha.",a:["A testemunha declarou: “Vi dois homens correndo.”","A testemunha: declarou “Vi dois homens correndo.”","A testemunha declarou; “Vi dois homens correndo.”","A testemunha declarou “Vi: dois homens correndo.”","A, testemunha declarou: Vi dois homens correndo."],c:"Dois-pontos após o verbo de dizer e aspas na fala."},
{id:"p4-56",n:3,e:"Assinale a frase corretamente pontuada.",a:["Foram chamados guardas, bombeiros e paramédicos.","Foram chamados, guardas, bombeiros e paramédicos.","Foram, chamados guardas, bombeiros e paramédicos.","Foram chamados guardas bombeiros, e, paramédicos.","Foram chamados guardas, bombeiros, e, paramédicos."],c:"Vírgula entre os itens; o “e” final dispensa vírgula; nada separa o verbo do seu sujeito posposto."},
{id:"p4-57",n:3,e:"Pelo rádio, o agente recebe a ordem “Não, aguarde a viatura”. Ele deve",a:["esperar a viatura.","seguir sem esperar a viatura.","ir ao encontro da viatura.","cancelar a ocorrência.","devolver a viatura."],c:"“Não” responde a algo dito antes; a ordem é “aguarde”. Sem a vírgula, “não aguarde” mandaria seguir."},
{id:"p4-58",n:3,e:"Em “Aguarde, senhor, que já vamos atendê-lo”, as vírgulas isolam",a:["um vocativo intercalado.","um aposto.","o sujeito.","uma oração restritiva.","uma enumeração."],c:"“Senhor” é chamamento no meio da frase: duas vírgulas."},
{id:"p4-59",n:3,e:"Assinale a afirmação INCORRETA.",a:["A vírgula antes de “e” é sempre proibida.","Não se separa o sujeito do verbo por vírgula na ordem direta.","A oração adjetiva explicativa vem entre vírgulas.","O vocativo é isolado por vírgula.","A pergunta indireta não leva ponto de interrogação."],c:"É aceita com sujeitos diferentes, valor de oposição ou “e” repetido."},
{id:"p4-60",n:3,e:"Em “Os guardas que estavam de folga foram convocados”, inserir vírgulas depois de “guardas” e depois de “folga”",a:["altera o sentido: a oração passa a se referir a todos os guardas.","mantém o sentido, pois as vírgulas são facultativas.","torna a frase gramaticalmente errada.","transforma “guardas” em vocativo.","separa indevidamente o sujeito do verbo."],c:"De restritiva (só os de folga) para explicativa (todos, que estavam de folga)."}
];

BANCO["pt-5"] = [
{id:"p5-01",n:1,e:"Assinale o substantivo sobrecomum.",a:["testemunha","agente","estudante","policial","motorista"],c:"“A testemunha” serve para homem ou mulher, sem trocar o artigo. Os demais são comuns de dois gêneros."},
{id:"p5-02",n:1,e:"Em “A agente registrou a ocorrência”, “agente” é substantivo",a:["comum de dois gêneros.","sobrecomum.","epiceno.","coletivo.","abstrato."],c:"Mesma forma para os dois gêneros; o artigo (o/a) indica o sexo."},
{id:"p5-03",n:1,e:"O substantivo coletivo “frota” indica conjunto de",a:["veículos ou navios.","cães.","soldados.","estrelas.","ilhas."],c:"Frota: conjunto de navios ou de veículos de uma mesma organização."},
{id:"p5-04",n:1,e:"Assinale o substantivo abstrato.",a:["segurança","viatura","praça","rádio","colete"],c:"Segurança é um estado ou conceito; os demais são seres ou objetos concretos."},
{id:"p5-05",n:1,e:"Em “A Guarda de Campinas recebeu novas viaturas”, “Campinas” é substantivo",a:["próprio.","comum.","coletivo.","abstrato.","sobrecomum."],c:"Nome específico de um lugar."},
{id:"p5-06",n:1,e:"A locução “do município” equivale ao adjetivo",a:["municipal.","urbano.","rural.","estadual.","federal."],c:"“Guarda do município” = “Guarda Municipal”."},
{id:"p5-07",n:1,e:"A locução “da cidade” equivale ao adjetivo",a:["urbano.","rural.","pluvial.","bélico.","infantil."],c:"“Área da cidade” = “área urbana”."},
{id:"p5-08",n:1,e:"Quem nasce em Campinas é",a:["campineiro.","campinense.","paulistano.","campinano.","campinês."],c:"Adjetivo pátrio de Campinas (SP): campineiro."},
{id:"p5-09",n:1,e:"O adjetivo “paulistano” refere-se à",a:["cidade de São Paulo.","todo o estado de São Paulo.","cidade de Campinas.","região metropolitana de Campinas.","capital federal."],c:"Paulistano é da capital; paulista, do estado."},
{id:"p5-10",n:1,e:"O superlativo absoluto sintético de “fácil” é",a:["facílimo.","muito fácil.","o mais fácil.","mais fácil.","tão fácil."],c:"Sintético = com sufixo. “Muito fácil” é analítico."},
{id:"p5-11",n:1,e:"O comparativo de superioridade de “bom” é",a:["melhor.","mais bom.","ótimo.","boníssimo.","maior."],c:"Forma especial: bom → melhor."},
{id:"p5-12",n:1,e:"“Art. 5º” deve ser lido como",a:["artigo quinto.","artigo cinco.","artigo cinquenta.","quinto artigo do parágrafo.","artigo cinco grau."],c:"Até o 9º, os artigos de lei são lidos como ordinais."},
{id:"p5-13",n:1,e:"“Art. 13” deve ser lido como",a:["artigo treze.","artigo décimo terceiro.","artigo um três.","treze artigos.","artigo terceiro."],c:"A partir do 10, os artigos são lidos como cardinais."},
{id:"p5-14",n:1,e:"Em “O efetivo dobrou: agora é o dobro do ano passado”, “dobro” é numeral",a:["multiplicativo.","cardinal.","ordinal.","fracionário.","coletivo."],c:"Indica multiplicação por dois."},
{id:"p5-15",n:1,e:"Em “Ambos os agentes foram ouvidos”, “ambos” indica",a:["os dois agentes.","um agente.","vários agentes.","nenhum agente.","o primeiro agente."],c:"“Ambos” é numeral dual: os dois."},
{id:"p5-16",n:1,e:"Em “O prédio é alto”, “alto” é",a:["adjetivo.","advérbio.","substantivo.","numeral.","pronome."],c:"Caracteriza o substantivo “prédio”."},
{id:"p5-17",n:1,e:"Em “O guarda falou alto com o motorista”, “alto” é",a:["advérbio.","adjetivo.","substantivo.","numeral.","pronome."],c:"Modifica o verbo “falou” e não varia."},
{id:"p5-18",n:1,e:"O plural de “guarda-civil” é",a:["guardas-civis.","guarda-civis.","guardas-civil.","guarda-civil.","guardas-civiles."],c:"“Guarda” (pessoa) e “civil” vão ao plural."},
{id:"p5-19",n:1,e:"O plural de “guarda-chuva” é",a:["guarda-chuvas.","guardas-chuvas.","guardas-chuva.","guarda-chuva.","guardas-de-chuva."],c:"Aqui “guarda” é verbo (guardar) e não varia."},
{id:"p5-20",n:1,e:"Assinale a forma correta.",a:["Trezentos gramas de carne.","Trezentas gramas de carne.","Trezentos grama de carne.","Trezentas grama de carne.","Trezento gramas de carne."],c:"O grama (unidade de massa) é masculino."},
{id:"p5-21",n:2,e:"Em “O capital da empresa foi bloqueado”, “capital” significa",a:["dinheiro, patrimônio.","cidade sede.","pena de morte.","letra maiúscula.","sede do governo."],c:"No masculino, capital é dinheiro; no feminino, cidade sede."},
{id:"p5-22",n:2,e:"Em “O cabeça da quadrilha foi preso”, “o cabeça” significa",a:["o líder.","a parte do corpo.","o mais jovem.","o informante.","a vítima."],c:"No masculino, “o cabeça” é o chefe do grupo."},
{id:"p5-23",n:2,e:"Em “A guia de recolhimento foi anexada ao processo”, “a guia” é",a:["um documento.","uma pessoa que conduz.","um veículo.","um mapa turístico.","uma testemunha."],c:"No feminino, guia é o documento; no masculino, quem conduz."},
{id:"p5-24",n:2,e:"Em “A rádio local noticiou a operação”, “a rádio” é",a:["a emissora.","o aparelho.","o comunicador da viatura.","um elemento químico.","um osso do braço."],c:"A rádio = emissora; o rádio = aparelho."},
{id:"p5-25",n:2,e:"Em “O pobre homem perdeu tudo na enchente”, “pobre” significa",a:["digno de pena.","sem dinheiro, necessariamente.","desonesto.","idoso.","desconhecido."],c:"Antes do substantivo, “pobre” indica compaixão; depois (“homem pobre”), falta de dinheiro."},
{id:"p5-26",n:2,e:"Em “Ele é um velho amigo da equipe”, “velho” indica",a:["amizade de longa data.","idade avançada do amigo.","amigo aposentado.","amigo desgastado.","amigo distante."],c:"Antes do substantivo, “velho” indica tempo de relação; “amigo velho” seria idoso."},
{id:"p5-27",n:2,e:"Em “Um alto funcionário da prefeitura visitou a base”, “alto” indica",a:["cargo elevado.","estatura.","tom de voz.","idade.","salário baixo."],c:"Antes do substantivo, “alto” indica posição hierárquica."},
{id:"p5-28",n:2,e:"Em “O guarda explicou o porquê da abordagem”, “porquê” é",a:["substantivo.","conjunção.","advérbio.","pronome.","preposição."],c:"Precedido de artigo, “porquê” é substantivo (= o motivo)."},
{id:"p5-29",n:2,e:"Em “O não do comandante foi firme”, “não” funciona como",a:["substantivo.","advérbio de negação.","conjunção.","adjetivo.","numeral."],c:"O artigo “o” substantiva a palavra."},
{id:"p5-30",n:2,e:"Em “Ele sempre dá um jeitinho”, o diminutivo expressa",a:["malícia, esperteza, e não tamanho pequeno.","tamanho reduzido.","carinho pela pessoa.","respeito.","quantidade exata."],c:"Diminutivo com valor expressivo, não de dimensão."},
{id:"p5-31",n:2,e:"Em “Isso não passa de um livreco”, o sufixo expressa",a:["desprezo.","admiração.","carinho.","tamanho grande.","quantidade."],c:"Diminutivo pejorativo."},
{id:"p5-32",n:2,e:"Em “Chegou um guarda, e não os três que pedimos”, “um” é",a:["numeral.","artigo indefinido.","pronome.","advérbio.","substantivo."],c:"Indica quantidade, em oposição a “três”."},
{id:"p5-33",n:2,e:"Em “Chegou um guarda para atender a ocorrência”, “um” é",a:["artigo indefinido.","numeral.","pronome.","advérbio.","substantivo."],c:"Indica um guarda qualquer, não quantidade."},
{id:"p5-34",n:2,e:"Em “A equipe chegou primeiro à ocorrência”, “primeiro” é",a:["advérbio.","numeral ordinal.","adjetivo.","substantivo.","pronome."],c:"Modifica o verbo (chegou antes dos outros)."},
{id:"p5-35",n:2,e:"Em “Foi o primeiro guarda a chegar”, “primeiro” é",a:["numeral ordinal.","advérbio.","artigo.","pronome.","verbo."],c:"Indica ordem e acompanha o substantivo “guarda”."},
{id:"p5-36",n:2,e:"Assinale o adjetivo que expressa opinião de quem fala.",a:["irresponsável, em “motorista irresponsável”","vermelho, em “carro vermelho”","estreita, em “rua estreita”","molhado, em “chão molhado”","quebrado, em “vidro quebrado”"],c:"É um julgamento (subjetivo). Os demais descrevem características verificáveis."},
{id:"p5-37",n:2,e:"Assinale a descrição mais objetiva para um relatório.",a:["O condutor avançou o sinal vermelho.","O condutor irresponsável avançou o sinal.","O condutor, um absurdo, avançou o sinal.","O péssimo condutor avançou o sinal.","O condutor, claramente perigoso, avançou o sinal."],c:"Descreve o fato, sem adjetivos de opinião."},
{id:"p5-38",n:2,e:"“Século XXI” lê-se",a:["século vinte e um.","século vigésimo primeiro.","século dois um.","século onze.","século vinte primeiro."],c:"Acima de dez, o algarismo romano é lido como cardinal."},
{id:"p5-39",n:2,e:"“Dom Pedro II” lê-se",a:["Dom Pedro segundo.","Dom Pedro dois.","Dom Pedro duas vezes.","Dom Pedro décimo primeiro.","Dom Pedro onze."],c:"Até dez, o romano é lido como ordinal."},
{id:"p5-40",n:2,e:"Em “A vítima, um homem de 40 anos, foi socorrida”, o adjetivo “socorrida” está no feminino porque",a:["concorda com “vítima”, substantivo sobrecomum feminino.","concorda com “homem”.","está errado e deveria ser “socorrido”.","é invariável.","concorda com “anos”."],c:"O adjetivo concorda com o substantivo a que se refere: “a vítima”."},
{id:"p5-41",n:3,e:"Assinale a frase em que “mais bom” está corretamente empregado.",a:["Ele é mais bom do que esperto.","Este café é mais bom que aquele.","O turno da manhã é mais bom.","Ele é mais bom jogador que o irmão.","Nada é mais bom que férias."],c:"“Mais bom” só cabe ao comparar duas qualidades do mesmo ser. Nos demais casos, usa-se “melhor”."},
{id:"p5-42",n:3,e:"Assinale a alternativa com superlativo absoluto sintético.",a:["A tarefa foi facílima.","A tarefa foi muito fácil.","Foi a tarefa mais fácil da prova.","A tarefa foi mais fácil que a outra.","A tarefa foi tão fácil quanto a outra."],c:"Sufixo -ílimo. (B) analítico; (C) relativo; (D) e (E) comparativos."},
{id:"p5-43",n:3,e:"Em “É a praça mais segura da cidade”, o adjetivo está no grau",a:["superlativo relativo de superioridade.","superlativo absoluto sintético.","comparativo de superioridade.","comparativo de igualdade.","normal."],c:"Destaca a praça em relação a um conjunto (as da cidade)."},
{id:"p5-44",n:3,e:"Assinale a frase em que “doente” é substantivo.",a:["O doente recebeu atendimento no local.","O homem doente recebeu atendimento.","Ele parecia doente.","A criança ficou doente.","Encontraram um cão doente."],c:"Precedido de artigo e núcleo do sujeito. Nas outras, caracteriza um substantivo (adjetivo)."},
{id:"p5-45",n:3,e:"Em “A onça macho foi vista na mata”, “onça” é substantivo",a:["epiceno.","sobrecomum.","comum de dois gêneros.","coletivo.","abstrato."],c:"Animal com uma só forma; “macho” indica o sexo."},
{id:"p5-46",n:3,e:"“A criança, um menino de 7 anos, estava ______.” Completa corretamente:",a:["perdida","perdido","perdidos","perdidas","perder"],c:"O adjetivo concorda com “a criança” (sobrecomum feminino), mesmo sendo um menino."},
{id:"p5-47",n:3,e:"Assinale a frase com ERRO.",a:["Comprou duzentas gramas de queijo.","Comprou duzentos gramas de queijo.","A grama do parque foi aparada.","O grama é unidade de massa.","Pesava quinhentos gramas."],c:"O grama (peso) é masculino: duzentos gramas."},
{id:"p5-48",n:3,e:"Assinale a alternativa com os dois plurais corretos.",a:["guardas-noturnos e guarda-volumes","guarda-noturnos e guardas-volumes","guardas-noturno e guarda-volume","guardas-noturnos e guardas-volumes","guarda-noturno e guarda-volumes"],c:"Guarda (pessoa) varia; guarda (verbo) não."},
{id:"p5-49",n:3,e:"Assinale a correspondência INCORRETA entre locução e adjetivo.",a:["de fogo = fluvial","de guerra = bélico","de chuva = pluvial","do campo = rural","de criança = infantil"],c:"De fogo = ígneo. Fluvial é “de rio”."},
{id:"p5-50",n:3,e:"Em “Ele não é um simples guarda: coordena toda a região”, “simples” significa",a:["mero, apenas.","modesto, humilde.","fácil.","ingênuo.","sem enfeites."],c:"Antes do substantivo, “simples” indica “apenas um”; depois (“guarda simples”), modesto."},
{id:"p5-51",n:3,e:"“§ 10” deve ser lido como",a:["parágrafo dez.","parágrafo décimo.","parágrafo um zero.","décimo parágrafo do artigo primeiro.","parágrafo único."],c:"Mesma regra dos artigos: cardinal a partir do 10."},
{id:"p5-52",n:3,e:"Assinale a leitura correta de “Art. 9º e Art. 10”.",a:["artigo nono e artigo dez","artigo nove e artigo décimo","artigo nono e artigo décimo","artigo nove e artigo dez","nono artigo e décimo artigo"],c:"Ordinal até o 9º; cardinal a partir do 10."},
{id:"p5-53",n:3,tx:"tc",e:"No 3º parágrafo, em “contratar e formar agentes custa caro”, a palavra “caro” é",a:["advérbio, pois modifica o verbo “custa”.","adjetivo, pois caracteriza “agentes”.","substantivo.","numeral.","adjetivo, pois caracteriza “contratar”."],c:"Em “custar caro”, “caro” modifica o verbo e não varia (“as coisas custam caro”)."},
{id:"p5-54",n:3,tx:"ta",e:"No 2º parágrafo, em “um estudante de 19 anos”, as palavras “um” e “19” são, respectivamente,",a:["artigo indefinido e numeral cardinal.","numeral e numeral ordinal.","pronome e adjetivo.","artigo definido e numeral cardinal.","numeral cardinal e artigo."],c:"“Um” apresenta o estudante sem quantificar; “19” indica quantidade."},
{id:"p5-55",n:3,tx:"td",e:"No 3º parágrafo, em “as medidas mais citadas por especialistas”, o adjetivo “citadas” está no grau",a:["superlativo relativo de superioridade.","comparativo de igualdade.","superlativo absoluto sintético.","comparativo de inferioridade.","normal, sem intensificação."],c:"“As mais citadas” destaca essas medidas em relação ao conjunto de medidas."},
{id:"p5-56",n:3,e:"Assinale a frase em que “meio” é numeral.",a:["Comprou meio quilo de pão.","Estava meio cansada após o plantão.","Ficou no meio da rua.","Usou um meio legal para resolver.","Chegou ao meio-dia."],c:"Fracionário (metade). (B) advérbio; (C) e (D) substantivo; (E) parte de substantivo composto."},
{id:"p5-57",n:3,e:"Em “O andar do suspeito era nervoso”, “andar” é",a:["substantivo.","verbo no infinitivo.","adjetivo.","advérbio.","numeral."],c:"Verbo substantivado pelo artigo “o”: é o núcleo do sujeito."},
{id:"p5-58",n:3,e:"Assinale a afirmação INCORRETA.",a:["Sobrecomum é o substantivo que troca o artigo conforme o sexo, como “o/a agente”.","Epiceno indica o sexo do animal com “macho” ou “fêmea”.","Qualquer palavra precedida de artigo pode ser substantivada.","A posição do adjetivo pode alterar o sentido.","“Ambos” é numeral dual."],c:"Trocar o artigo é característica do comum de dois gêneros. O sobrecomum tem artigo fixo (a vítima)."},
{id:"p5-59",n:3,e:"Assinale o par em que a mudança de posição do adjetivo NÃO altera o sentido.",a:["rua estreita / estreita rua","grande homem / homem grande","pobre homem / homem pobre","velho amigo / amigo velho","alto funcionário / funcionário alto"],c:"“Estreita” mantém o sentido (pouca largura) nas duas posições; muda só o efeito de estilo."},
{id:"p5-60",n:3,e:"Assinale a frase em que o gênero está adequado ao sentido.",a:["A capital paulista recebeu a feira.","O capital do estado é São Paulo.","A grama do ouro subiu.","O cabeça doeu depois da queda.","A rádio de pilha quebrou."],c:"A capital = cidade sede. Nas demais: a capital do estado; o grama do ouro; a cabeça doeu; o rádio (aparelho)."}
];

BANCO["pt-6"] = [
{id:"p6-01",n:1,e:"Assinale o pronome pessoal do caso reto.",a:["eu", "me", "mim", "lhe", "comigo"],c:"“Eu” é o reto, usado como sujeito. “Me” e “lhe” são oblíquos átonos; “mim” e “comigo”, oblíquos tônicos."},
{id:"p6-02",n:1,e:"Em “O guarda me entregou o relatório”, o pronome “me” é pessoal",a:["oblíquo átono.", "reto.", "oblíquo tônico.", "de tratamento.", "possessivo."],c:"“Me” (= a mim) completa o verbo, sem preposição: oblíquo átono."},
{id:"p6-03",n:1,e:"Assinale a alternativa que completa corretamente: “O chefe pediu para ____ chegar mais cedo.”",a:["eu", "mim", "me", "comigo", "si"],c:"“Eu” é o sujeito do infinitivo “chegar”. Depois de preposição, o sujeito pede o reto: “para eu chegar”."},
{id:"p6-04",n:1,e:"Assinale a alternativa que completa corretamente: “Esse presente é para ____.”",a:["mim", "eu", "me", "comigo", "lhe"],c:"Preposição + pronome que não é sujeito pede o tônico: “para mim”."},
{id:"p6-05",n:1,e:"O pronome de tratamento “Vossa Excelência” é usado para",a:["autoridades de alto escalão, como o Presidente da República e os governadores.", "o papa.", "reitores de universidades.", "cardeais.", "reis e imperadores."],c:"Vossa Excelência é o tratamento de autoridades dos Poderes da República. Papa: Vossa Santidade; reitores: Vossa Magnificência; cardeais: Vossa Eminência; reis: Vossa Majestade."},
{id:"p6-06",n:1,e:"O tratamento adequado ao papa é",a:["Vossa Santidade.", "Vossa Eminência.", "Vossa Magnificência.", "Vossa Excelência.", "Vossa Senhoria."],c:"Vossa Santidade é o tratamento do papa; Vossa Eminência, dos cardeais."},
{id:"p6-07",n:1,e:"Em “O guarda cumpriu sua tarefa”, o termo “sua” é pronome",a:["possessivo.", "pessoal reto.", "demonstrativo.", "indefinido.", "relativo."],c:"Indica posse: a tarefa pertence ao guarda."},
{id:"p6-08",n:1,e:"Em “Este crachá é meu”, o demonstrativo “este” indica um objeto",a:["próximo de quem fala.", "próximo de quem ouve.", "distante de quem fala e de quem ouve.", "já citado no texto anterior.", "sem localização definida."],c:"Este, esta e isto situam o que está perto de quem fala."},
{id:"p6-09",n:1,e:"Em “Naquele tempo, a cidade era menor”, o demonstrativo “aquele” situa o fato",a:["em um passado distante.", "no presente.", "no futuro.", "em um passado muito recente.", "em um tempo indeterminado."],c:"Aquele, aquela e aquilo indicam o que está longe, no espaço ou no tempo."},
{id:"p6-10",n:1,e:"Assinale o pronome indefinido.",a:["ninguém", "nosso", "aquele", "cujo", "vós"],c:"“Ninguém” refere-se de modo vago a pessoas. Nosso é possessivo; aquele, demonstrativo; cujo, relativo; vós, pessoal reto."},
{id:"p6-11",n:1,e:"Em “O guarda que atendeu a ocorrência foi elogiado”, a palavra “que” é pronome",a:["relativo, pois retoma “o guarda”.", "interrogativo.", "indefinido.", "demonstrativo.", "pessoal."],c:"Liga duas orações e retoma o antecedente “o guarda”; pode ser trocado por “o qual”."},
{id:"p6-12",n:1,e:"Em “O prédio cujo telhado caiu foi interditado”, o pronome “cujo” expressa ideia de",a:["posse.", "lugar.", "tempo.", "modo.", "quantidade."],c:"“Cujo telhado” = o telhado do prédio: relação de posse."},
{id:"p6-13",n:1,e:"Assinale a frase em que o pronome “onde” está empregado corretamente.",a:["A rua onde ocorreu o acidente foi fechada.", "A situação onde ele se meteu é grave.", "O ano onde nasci foi 1990.", "O dia onde tudo aconteceu foi domingo.", "O funcionário onde pedi ajuda sumiu."],c:"“Onde” só retoma lugar. Nas demais: a situação em que, o ano em que, o dia em que, o funcionário a quem."},
{id:"p6-14",n:1,e:"“Trabalhou todo o dia” significa que ele trabalhou",a:["o dia inteiro.", "em qualquer dia.", "em dias alternados.", "apenas um dia.", "só de manhã."],c:"Com artigo (“todo o dia”), “todo” significa inteiro. Sem artigo (“todo dia”), significa cada dia, qualquer dia."},
{id:"p6-15",n:1,e:"Em “Quem chegou?”, o pronome “quem” é",a:["interrogativo.", "relativo.", "demonstrativo.", "possessivo.", "reflexivo."],c:"Faz uma pergunta direta sobre pessoa."},
{id:"p6-16",n:1,e:"Assinale a frase em que o “se” indica ação recíproca.",a:["Os dois guardas abraçaram-se ao fim do turno.", "O guarda feriu-se ao cair.", "O guarda queixou-se do chefe.", "Vende-se uma viatura.", "Precisa-se de ajuda."],c:"Em (A), um abraçou o outro. Em (B), o “se” é reflexivo (feriu a si mesmo); em (C), parte do verbo queixar-se; em (D), apassivador; em (E), indeterminação do sujeito."},
{id:"p6-17",n:1,e:"O plural de “qualquer” é",a:["quaisquer.", "qualquers.", "quaisqueres.", "qualqueres.", "qual quer."],c:"Só o primeiro elemento (qual) varia: quaisquer."},
{id:"p6-18",n:1,e:"Em “Dei-lhe o relatório”, o pronome “lhe” exerce a função de",a:["objeto indireto.", "objeto direto.", "sujeito.", "predicativo.", "agente da passiva."],c:"Quem dá, dá algo (objeto direto: o relatório) a alguém (objeto indireto: lhe)."},
{id:"p6-19",n:1,e:"Em “Tudo quanto vi foi anotado”, o pronome relativo “quanto” tem como antecedente",a:["tudo.", "vi.", "anotado.", "foi.", "a frase toda."],c:"“Quanto” retoma o indefinido “tudo”: tudo o que vi."},
{id:"p6-20",n:1,tx:"th",e:"No primeiro parágrafo, em “orientá-los”, o pronome “los” retoma",a:["os moradores.", "os condomínios.", "a Guarda Municipal.", "o inspetor.", "os furtos."],c:"“Los” (forma de “os”) é objeto direto de “orientar” e retoma “moradores”."},
{id:"p6-21",n:2,e:"Assinale a frase em que o emprego dos pronomes está de acordo com a norma-padrão.",a:["Entre mim e o chefe não há desentendimento.", "Entre eu e o chefe não há desentendimento.", "Deram o documento para mim assinar.", "Ele trouxe o material para mim organizar.", "Não há mais nada entre eu e ela."],c:"Depois de “entre”, usa-se o tônico (mim, ti). Em “para mim assinar”, o pronome é sujeito do infinitivo e exige “eu”: para eu assinar."},
{id:"p6-22",n:2,e:"Assinale a alternativa que completa corretamente: “Todos saíram, exceto ____.”",a:["eu", "mim", "me", "comigo", "si"],c:"Depois de exceto, salvo, menos, fora, segundo, conforme, consoante e como, a norma tradicional pede o pronome reto."},
{id:"p6-23",n:2,e:"Em “O guarda levou a arma consigo”, o pronome “consigo” é",a:["reflexivo, pois se refere ao sujeito “o guarda”.", "pessoal de 1ª pessoa, equivalente a “comigo”.", "pronome de tratamento.", "equivalente a “com você”.", "incorreto; o certo seria “com ele”."],c:"Consigo é o tônico reflexivo de 3ª pessoa: a arma ficou com o próprio sujeito. Não equivale a “com você”."},
{id:"p6-24",n:2,e:"Em “O colega a quem entreguei o relatório chegou”, o pronome “quem” é",a:["relativo, usado só para pessoas e precedido de preposição.", "interrogativo, em pergunta indireta.", "indefinido, sem antecedente.", "pessoal, de 3ª pessoa.", "demonstrativo."],c:"“Quem” retoma “o colega”, é relativo e vem com a preposição pedida pelo verbo (entregar a)."},
{id:"p6-25",n:2,e:"Em “Deixe-me sair”, o pronome “me” exerce a função de",a:["sujeito do infinitivo “sair”.", "objeto indireto de “deixe”.", "predicativo do sujeito.", "adjunto adnominal.", "agente da passiva."],c:"Com deixar, mandar, fazer, ver, ouvir e sentir seguidos de infinitivo, o oblíquo átono é o sujeito do infinitivo: eu saio."},
{id:"p6-26",n:2,e:"Em “O guarda disse ao colega que seu carro estava mal estacionado”, o problema de redação é",a:["a ambiguidade do possessivo “seu”, que pode se referir ao guarda ou ao colega.", "o uso do pronome relativo “que” sem antecedente.", "a falta de concordância com “carro”.", "o uso de pronome reto como objeto.", "a repetição da palavra “guarda”."],c:"“Seu” é de 3ª pessoa e admite dois donos. Solução: nomear o dono (“o carro do colega”)."},
{id:"p6-27",n:2,e:"Em “Ele tem seus 40 anos”, o possessivo “seus” expressa",a:["valor aproximado (cerca de 40 anos).", "posse real dos anos.", "exclusão.", "indeterminação do sujeito.", "ênfase na juventude."],c:"Possessivo de aproximação: “seus 40 anos” = por volta de 40 anos."},
{id:"p6-28",n:2,e:"Em “Escrevi a Pedro e a João; este respondeu logo, aquele demorou”, o pronome “aquele” retoma",a:["Pedro.", "João.", "a carta.", "os dois.", "o autor da frase."],c:"De dois termos citados, “este” retoma o último (João) e “aquele”, o primeiro (Pedro)."},
{id:"p6-29",n:2,tx:"th",e:"No segundo parágrafo, em “Entre eles, estão a troca de fechaduras e a instalação de iluminação”, o pronome “eles” retoma",a:["os cuidados simples do roteiro.", "os síndicos.", "os moradores.", "os condomínios.", "as novas ocorrências."],c:"“Eles” retoma “cuidados”, o termo mais próximo que combina em número e sentido: a troca de fechaduras e a iluminação são cuidados."},
{id:"p6-30",n:2,e:"Em “O que mais me preocupa é a demora”, a palavra “o” é",a:["pronome demonstrativo, equivalente a “aquilo”.", "artigo definido.", "pronome pessoal oblíquo.", "pronome relativo.", "preposição."],c:"Antes do relativo “que”, “o” equivale a “aquilo”: aquilo que mais me preocupa."},
{id:"p6-31",n:2,tx:"ti",e:"No primeiro parágrafo, em “Essa é uma ideia incompleta”, o pronome “Essa” retoma",a:["a afirmação de que a segurança depende apenas de policiamento.", "a rua movimentada.", "os criminosos.", "o comércio aberto.", "a luz acesa."],c:"“Essa” retoma a ideia da frase anterior, não um substantivo isolado."},
{id:"p6-32",n:2,e:"Em “Não havia dúvida alguma”, a expressão “dúvida alguma” equivale a",a:["nenhuma dúvida.", "alguma dúvida.", "muita dúvida.", "pouca dúvida.", "dúvida certa."],c:"“Algum” depois do substantivo, em frase negativa, reforça a negação."},
{id:"p6-33",n:2,e:"Em “Havia bastantes guardas na reunião”, a palavra “bastantes” é",a:["pronome indefinido variável, equivalente a “muitos”.", "advérbio invariável.", "adjetivo qualitativo.", "numeral.", "pronome demonstrativo."],c:"Modifica o substantivo “guardas” e concorda com ele. Como advérbio (“estavam bastante cansados”), não varia."},
{id:"p6-34",n:2,e:"O pronome indefinido “cada” é",a:["invariável e acompanha substantivo ou “um”.", "variável em gênero e número.", "variável apenas em número.", "usado só diante de verbos.", "usado só no plural."],c:"“Cada” não varia: cada guarda, cada um."},
{id:"p6-35",n:2,e:"Assinale a frase em que o pronome “cujo” está empregado corretamente.",a:["O guarda cujo carro foi levado registrou a ocorrência.", "O guarda cujo o carro foi levado registrou a ocorrência.", "O guarda que o carro dele foi levado registrou a ocorrência.", "O guarda cuja carro foi levado registrou a ocorrência.", "O guarda onde o carro foi levado registrou a ocorrência."],c:"“Cujo” concorda com a coisa possuída (carro) e não leva artigo."},
{id:"p6-36",n:2,e:"Assinale a alternativa em que a preposição que antecede o relativo está corretamente empregada.",a:["O documento de que preciso está na gaveta.", "O documento que preciso está na gaveta.", "O documento a que preciso está na gaveta.", "O documento em que preciso está na gaveta.", "O documento com que preciso está na gaveta."],c:"Quem precisa, precisa de algo: “de que preciso”."},
{id:"p6-37",n:2,e:"Compare: (1) “Os guardas, que estavam de folga, foram convocados.” e (2) “Os guardas que estavam de folga foram convocados.” A diferença de sentido é que, em (1),",a:["todos os guardas estavam de folga.", "só alguns guardas foram convocados.", "ninguém estava de folga.", "a folga foi cancelada.", "os guardas foram convocados antes da folga."],c:"Com vírgulas, a oração explica e vale para todos os guardas; sem vírgulas, restringe: só os que estavam de folga."},
{id:"p6-38",n:2,e:"Em “Quero saber qual é o procedimento”, o pronome “qual” é",a:["interrogativo, em pergunta indireta.", "relativo.", "indefinido.", "demonstrativo.", "possessivo."],c:"Pergunta de modo indireto, sem ponto de interrogação."},
{id:"p6-39",n:2,e:"Em “Precisa-se de guardas”, o “se” é",a:["índice de indeterminação do sujeito.", "partícula apassivadora.", "pronome reflexivo.", "conjunção condicional.", "parte integrante do verbo."],c:"Verbo transitivo indireto (precisar de) + se: sujeito indeterminado, verbo no singular."},
{id:"p6-40",n:2,e:"Em “Vendem-se viaturas usadas”, o “se” é",a:["partícula apassivadora, e “viaturas” é o sujeito.", "índice de indeterminação do sujeito.", "pronome reflexivo.", "pronome recíproco.", "conjunção integrante."],c:"Verbo transitivo direto + se: voz passiva sintética; o verbo concorda com o sujeito (viaturas)."},
{id:"p6-41",n:3,tx:"th",e:"No último parágrafo, em “à equipe, que as analisará”, os termos “que” e “as” retomam, respectivamente,",a:["a equipe e as imagens de câmeras.", "a equipe e os moradores.", "as imagens de câmeras e a equipe.", "o telefone 153 e as imagens.", "os moradores e as câmeras."],c:"“Que” é relativo e retoma “a equipe” (sujeito de “analisará”). “As” é objeto direto e retoma “imagens de câmeras”."},
{id:"p6-42",n:3,tx:"th",e:"No segundo parágrafo, o pronome “Isso”, em “Isso, de acordo com a corporação, já ajudou a diminuir os casos”, retoma",a:["a troca de fechaduras e a instalação de iluminação.", "os síndicos.", "a corporação.", "o encontro com os moradores.", "os furtos noturnos."],c:"“Isso” retoma o fato anterior: as medidas citadas (troca de fechaduras e iluminação). Não é um substantivo isolado."},
{id:"p6-43",n:3,tx:"ti",e:"No segundo parágrafo, em “essa rede, cuja força depende da convivência”, o pronome “cuja” estabelece relação de posse entre",a:["“força” e “rede”.", "“força” e “convivência”.", "“rede” e “ocorrências”.", "“moradores” e “vizinhos”.", "“atenção” e “alguém”."],c:"A força é da rede: “cuja” liga o antecedente “rede” ao termo possuído “força”, com o qual concorda."},
{id:"p6-44",n:3,tx:"ti",e:"No último parágrafo, em “Esta, por sua vez, só se envolve quando se sente ouvida”, o pronome “Esta” retoma",a:["a comunidade.", "a guarda.", "a polícia.", "a guarda e a polícia.", "o apoio."],c:"“Esta” aponta o último termo citado, “comunidade”; o adjetivo “ouvida” (feminino singular) confirma. “Elas”, na frase anterior, é que retoma guarda e polícia."},
{id:"p6-45",n:3,tx:"ti",e:"No primeiro parágrafo, em “Há quem defenda que a segurança de uma cidade depende apenas de policiamento”, a palavra “quem” equivale a",a:["“pessoas que”, sem antecedente expresso.", "“o qual”, retomando “segurança”.", "“cujo”, indicando posse.", "“onde”, indicando lugar.", "“que”, retomando “cidade”."],c:"Relativo sem antecedente: há pessoas que defendem essa ideia."},
{id:"p6-46",n:3,e:"Assinale a frase em que o “se” é parte integrante do verbo.",a:["Os suspeitos queixaram-se da abordagem.", "Vendem-se motos usadas.", "Precisa-se de agentes.", "Os colegas abraçaram-se.", "Se houver chuva, a ronda será cancelada."],c:"“Queixar-se” é verbo pronominal: o “se” faz parte do verbo e não tem função sintática. (B) apassivador; (C) indeterminação; (D) recíproco; (E) conjunção."},
{id:"p6-47",n:3,e:"Assinale a frase em que a palavra “se” é conjunção, e não pronome.",a:["Não sei se o prazo foi prorrogado.", "Vendeu-se a viatura antiga.", "O suspeito arrependeu-se do crime.", "Fala-se muito do caso.", "O cidadão feriu-se ao cair."],c:"Em (A), “se” introduz oração (conjunção integrante). Nas demais é pronome: apassivador, parte do verbo, indeterminação e reflexivo."},
{id:"p6-48",n:3,e:"Em “Os documentos que o guarda deixou na mesa foram levados”, o pronome “que” exerce a função de",a:["objeto direto de “deixou”.", "sujeito de “foram levados”.", "objeto indireto de “deixou”.", "agente da passiva.", "adjunto adnominal de “mesa”."],c:"Quem deixa, deixa algo: “o guarda deixou os documentos”. O relativo substitui “os documentos”, objeto direto."},
{id:"p6-49",n:3,e:"Assinale a frase em que a palavra “que” é pronome relativo.",a:["O manual que o guarda leu é atualizado.", "Pediu que todos saíssem.", "Disse que chegaria cedo.", "Era tão cansativo que dormiu.", "Que dia difícil!"],c:"Só em (A) o “que” retoma um antecedente (“manual”) e pode ser trocado por “o qual”. Em (B) e (C) é conjunção integrante; em (D), consecutiva; em (E), exclamativo."},
{id:"p6-50",n:3,e:"Em “Os guardas falaram com os moradores e eles anotaram as queixas”, a ambiguidade ocorre porque",a:["“eles” pode retomar os guardas ou os moradores.", "“queixas” não tem artigo.", "falta concordância verbal.", "“com” é preposição inadequada.", "“falaram” é transitivo direto."],c:"Dois antecedentes plurais servem para “eles”. Solução: repetir o termo ou reescrever."},
{id:"p6-51",n:3,e:"A frase “O delegado disse ao guarda que ele deveria assumir o caso” é ambígua. Assinale a reescrita que elimina a ambiguidade.",a:["O delegado disse ao guarda: “Você deverá assumir o caso”.", "O delegado disse ao guarda que ele mesmo deveria assumir o caso.", "O delegado disse-lhe que ele deveria assumir o caso.", "O delegado disse ao guarda que o responsável deveria assumir o caso.", "O delegado disse que ele deveria assumir o caso ao guarda."],c:"O discurso direto com “você” deixa claro que o guarda assumirá o caso. As demais mantêm a dúvida sobre quem é “ele” ou criam outra (quem é “o responsável”?)."},
{id:"p6-52",n:3,e:"Assinale a alternativa em que há erro no emprego do pronome, segundo a norma-padrão.",a:["Há um segredo entre eu e ela.", "Trouxe os documentos comigo.", "Para mim, o prazo é suficiente.", "Dei-lhe os parabéns.", "Não vá sem mim."],c:"Depois de “entre”, o certo é “entre mim e ela”. Nas demais, os pronomes estão adequados."},
{id:"p6-53",n:3,e:"Em “Digo-lhe apenas isto: a segurança começa na prevenção”, o pronome “isto” antecipa",a:["a afirmação que vem depois dos dois-pontos.", "o que já foi dito antes.", "o pronome “lhe”.", "o verbo “digo”.", "o advérbio “apenas”."],c:"Catáfora: “isto” aponta para o que será dito a seguir."},
{id:"p6-54",n:3,e:"Assinale a alternativa em que o pronome de tratamento está corretamente associado ao destinatário.",a:["Vossa Magnificência: reitor de universidade.", "Vossa Eminência: rei.", "Vossa Santidade: cardeal.", "Vossa Majestade: governador.", "Vossa Senhoria: papa."],c:"Vossa Magnificência é dos reitores; Vossa Eminência, dos cardeais; Vossa Santidade, do papa; Vossa Majestade, de reis e imperadores."},
{id:"p6-55",n:3,e:"Em “Vossa Excelência trouxe seus documentos?”, a forma “seus” está correta porque",a:["pronomes de tratamento levam verbo e possessivo na 3ª pessoa.", "“Vossa” exige verbo e possessivo na 2ª pessoa.", "o possessivo deveria ser “vossos”.", "o possessivo deveria ser “teus”.", "o verbo deveria estar no plural."],c:"Embora se dirijam a quem ouve, os pronomes de tratamento concordam na 3ª pessoa."},
{id:"p6-56",n:3,e:"Em “Os guardas chegaram cedo, e isso facilitou a ronda”, o pronome “isso” retoma",a:["toda a ideia da oração anterior.", "apenas o substantivo “guardas”.", "apenas o substantivo “ronda”.", "o verbo “facilitou”.", "o advérbio “cedo”, isoladamente."],c:"“Isso” resume o fato anterior (os guardas chegarem cedo): retomada de ideia, não de substantivo."},
{id:"p6-57",n:3,e:"Assinale a frase em que “mesmo” concorda corretamente com o termo a que se refere.",a:["As testemunhas mesmas confirmaram o relato.", "As testemunhas mesmo confirmaram o relato.", "Eles chegaram mesmos atrasados.", "Ela falou mesmas o que viu.", "Mesmos cansados, seguiram em frente."],c:"Como reforço (“as próprias testemunhas”), “mesmo” varia. Como advérbio (realmente, até), não varia."},
{id:"p6-58",n:3,e:"Em “O guarda cuja viatura quebrou pediu ajuda ao colega, que o atendeu logo”, os pronomes “cuja”, “que” e “o” retomam, respectivamente,",a:["guarda, colega e guarda.", "viatura, colega e guarda.", "guarda, guarda e colega.", "guarda, colega e colega.", "viatura, guarda e colega."],c:"“Cuja” retoma o possuidor (guarda) e concorda com “viatura”; “que” retoma “colega”; “o” é objeto direto e retoma o guarda."},
{id:"p6-59",n:3,e:"Assinale a alternativa INCORRETA quanto ao emprego de “onde” e “aonde”.",a:["A cidade aonde moro é pequena.", "A cidade aonde vamos é pequena.", "A cidade onde moro é pequena.", "A cidade a que vamos é pequena.", "A cidade de onde viemos é pequena."],c:"“Aonde” (= a onde) só convém a verbos de movimento: aonde vamos. Com “morar”, o certo é “onde moro”."},
{id:"p6-60",n:3,e:"Assinale a afirmação INCORRETA sobre pronomes.",a:["Os pronomes oblíquos átonos (me, te, lhe...) vêm sempre precedidos de preposição.", "O pronome relativo retoma um termo da oração anterior, o antecedente.", "O pronome “cujo” concorda com o termo que vem depois dele.", "Os pronomes de tratamento levam o verbo na 3ª pessoa.", "“Cada” é pronome indefinido invariável."],c:"Os átonos não vêm com preposição (me, te, lhe, o, a). Quem vem com preposição são os tônicos (mim, ti, ele...)."}
];

BANCO["pt-7"] = [
{id:"p7-01",n:1,e:"Em “O suspeito fugiu pela rua lateral”, o verbo está no modo",a:["indicativo, pois apresenta o fato como certo.", "subjuntivo, pois expressa hipótese.", "imperativo, pois expressa ordem.", "infinitivo, pois é o nome do verbo.", "gerúndio, pois indica ação em curso."],c:"O indicativo apresenta o fato como certo: ele fugiu."},
{id:"p7-02",n:1,e:"Em “Espero que ele compareça à audiência”, a forma “compareça” está no",a:["presente do subjuntivo.", "presente do indicativo.", "futuro do presente.", "pretérito perfeito.", "pretérito imperfeito do subjuntivo."],c:"Depois de verbo de desejo ou expectativa (“espero que”), usa-se o presente do subjuntivo."},
{id:"p7-03",n:1,e:"Em “Desligue o motor, por favor”, o verbo expressa",a:["pedido ou ordem, no modo imperativo.", "fato certo, no modo indicativo.", "hipótese, no modo subjuntivo.", "ação passada concluída.", "ação futura certa."],c:"O imperativo expressa ordem, pedido ou conselho."},
{id:"p7-04",n:1,e:"Em “A equipe atendeu a ocorrência às 22h”, o tempo verbal indica ação",a:["concluída no passado.", "habitual no passado.", "anterior a outra ação passada.", "futura.", "hipotética."],c:"Pretérito perfeito: ação terminada."},
{id:"p7-05",n:1,e:"Em “O comerciante fechava a loja às 19h todos os dias”, o pretérito imperfeito indica",a:["hábito no passado.", "ação concluída de uma só vez.", "ação futura.", "ordem.", "dúvida."],c:"O imperfeito apresenta ação contínua ou repetida no passado."},
{id:"p7-06",n:1,e:"Assinale a frase com verbo no futuro do presente.",a:["A operação começará amanhã.", "A operação começaria amanhã.", "A operação começou ontem.", "A operação começava cedo.", "Que a operação comece logo."],c:"Começará: futuro do presente. Começaria é futuro do pretérito; começou, perfeito; começava, imperfeito; comece, presente do subjuntivo."},
{id:"p7-07",n:1,e:"Assinale a forma que completa corretamente: “Se o guarda ____ o suspeito, deve avisar a central.”",a:["vir", "ver", "vier", "verá", "vendo"],c:"Futuro do subjuntivo de ver: se ele vir. “Vier” é do verbo vir (chegar)."},
{id:"p7-08",n:1,e:"Assinale a forma que completa corretamente: “Quando você ____ a mochila no chão, afaste-se.”",a:["puser", "por", "pôr", "pusesse", "ponha"],c:"Futuro do subjuntivo de pôr: quando você puser."},
{id:"p7-09",n:1,e:"Assinale a forma correta: “Ontem, o guarda ____ na briga.”",a:["interveio", "interviu", "interveu", "intervisse", "intervido"],c:"Intervir segue vir: ele veio, ele interveio."},
{id:"p7-10",n:1,e:"Assinale a forma correta: “A equipe ____ o suspeito na saída do shopping.”",a:["deteve", "deteu", "detia", "deteram", "detém-se"],c:"Deter segue ter: ele teve, ele deteve."},
{id:"p7-11",n:1,e:"Em “O suspeito terá, no máximo, 20 anos”, o futuro do presente expressa",a:["probabilidade, uma estimativa.", "certeza sobre um fato futuro.", "ordem.", "hábito no passado.", "fato concluído."],c:"Aqui o futuro não fala de um fato que vai acontecer: é um cálculo aproximado sobre o presente."},
{id:"p7-12",n:1,e:"Assinale a frase na voz reflexiva.",a:["O guarda feriu-se na perseguição.", "O guarda deteve o suspeito.", "O suspeito foi detido.", "Detiveram-se dois suspeitos.", "O guarda foi ferido."],c:"Na reflexiva, o sujeito pratica e sofre a ação: ele feriu a si mesmo."},
{id:"p7-13",n:1,e:"Assinale a frase correta quanto ao verbo “haver”.",a:["Houve três ocorrências na noite.", "Houveram três ocorrências na noite.", "Haviam muitos guardas na praça.", "Hão muitos problemas na rua.", "Houveram muitas reclamações."],c:"Haver no sentido de existir é impessoal: fica no singular."},
{id:"p7-14",n:1,e:"Assinale a frase correta.",a:["Faz dois anos que trabalho na Guarda.", "Fazem dois anos que trabalho na Guarda.", "Fazem muitos anos que não chove.", "Fizeram três meses do concurso.", "Fazem dias que ele sumiu."],c:"Fazer indicando tempo decorrido é impessoal: faz dois anos."},
{id:"p7-15",n:1,e:"Em “O guarda agiu rapidamente”, a palavra “rapidamente” é",a:["advérbio de modo.", "adjetivo.", "advérbio de tempo.", "substantivo.", "advérbio de lugar."],c:"Indica o modo como ele agiu."},
{id:"p7-16",n:1,e:"Em “Ontem não houve ocorrências”, as palavras “ontem” e “não” indicam, respectivamente,",a:["tempo e negação.", "lugar e negação.", "tempo e afirmação.", "modo e dúvida.", "tempo e intensidade."],c:"Ontem: tempo. Não: negação."},
{id:"p7-17",n:1,e:"Em “A rua estava muito escura”, o advérbio “muito” modifica",a:["o adjetivo “escura”, intensificando-o.", "o substantivo “rua”.", "o verbo “estava”.", "outro advérbio.", "a oração inteira."],c:"“Muito” intensifica a qualidade “escura”."},
{id:"p7-18",n:1,e:"Em “Naquela noite, o guarda entra na loja e encontra o caixa aberto”, o presente do indicativo é usado para",a:["narrar um fato passado de modo mais vivo.", "indicar um hábito.", "indicar um fato futuro.", "expressar dúvida.", "dar uma ordem."],c:"É o presente histórico: o fato é passado (“naquela noite”), mas o presente aproxima o leitor da cena."},
{id:"p7-19",n:1,e:"Em “O guarda chegou correndo”, a forma “correndo” é",a:["gerúndio.", "particípio.", "infinitivo.", "presente do indicativo.", "imperativo."],c:"Terminação -ndo: gerúndio, ação simultânea à chegada."},
{id:"p7-20",n:1,tx:"tj",e:"No primeiro parágrafo, a forma “teriam fugido” indica que a fuga em um carro escuro é",a:["uma informação não confirmada, atribuída aos vizinhos.", "um fato comprovado pela Guarda.", "uma ordem dada aos autores.", "um hábito dos autores.", "um desejo do proprietário."],c:"O futuro do pretérito composto marca informação que quem escreve não garante."},
{id:"p7-21",n:2,e:"Em “Quando a viatura chegou, o suspeito já fugira”, a forma “fugira” indica",a:["um fato passado anterior a outro fato passado.", "um fato futuro.", "um hábito no passado.", "um fato presente.", "uma hipótese."],c:"Mais-que-perfeito: a fuga aconteceu antes da chegada da viatura. Equivale a “tinha fugido”."},
{id:"p7-22",n:2,e:"Em “Gostaria de ver seus documentos”, o futuro do pretérito expressa",a:["cortesia, suavizando o pedido.", "fato não confirmado.", "ação passada concluída.", "certeza sobre o futuro.", "hábito."],c:"O futuro do pretérito torna o pedido mais educado."},
{id:"p7-23",n:2,e:"Em “Queria pedir uma informação”, dita no balcão da Guarda, o pretérito imperfeito tem valor de",a:["cortesia, equivalendo a “quero”.", "hábito no passado.", "fato não confirmado.", "ação anterior a outra passada.", "ordem."],c:"Imperfeito de cortesia: o pedido é atual, dito de modo polido."},
{id:"p7-24",n:2,e:"Em “Amanhã começa a operação no centro”, o presente do indicativo expressa",a:["um fato futuro próximo.", "um hábito.", "uma verdade geral.", "uma ação passada.", "uma hipótese."],c:"Com “amanhã”, o presente ganha valor de futuro."},
{id:"p7-25",n:2,e:"Assinale a alternativa com correlação verbal correta.",a:["Se a rua tivesse luz, haveria menos furtos.", "Se a rua tivesse luz, haverá menos furtos.", "Se a rua tiver luz, haveria menos furtos.", "Se a rua teria luz, haveria menos furtos.", "Se a rua tivesse luz, há menos furtos."],c:"Imperfeito do subjuntivo (tivesse) pede futuro do pretérito (haveria). Futuro do subjuntivo (tiver) pede futuro do presente (haverá)."},
{id:"p7-26",n:2,e:"Assinale a forma que completa corretamente: “Se o motorista ____ a calma, a abordagem será tranquila.”",a:["mantiver", "manter", "mantesse", "manteu", "mantenha"],c:"Manter segue ter: se ele tiver, se ele mantiver. Com “será”, a correlação está certa."},
{id:"p7-27",n:2,e:"Assinale a frase em que o verbo está corretamente flexionado.",a:["Os guardas se propuseram a ajudar.", "Os guardas se proporam a ajudar.", "Os guardas se propunheram a ajudar.", "O guarda se propos a ajudar.", "Os guardas se propusseram a ajudar."],c:"Propor segue pôr: puseram, propuseram."},
{id:"p7-28",n:2,e:"Na abordagem, tratando o motorista por “você”, a ordem correta é",a:["Pare o carro e mostre os documentos.", "Pare o carro e mostra os documentos.", "Para o carro e mostre os documentos.", "Pare o carro e mostrai os documentos.", "Parai o carro e mostre os documentos."],c:"Você é 3ª pessoa: pare, mostre. “Mostra” e “para” são de tu; “mostrai” e “parai”, de vós."},
{id:"p7-29",n:2,e:"O imperativo negativo de “falar”, dirigido a “você”, é",a:["não fale", "não fala", "não falas", "não falar", "não falai"],c:"O imperativo negativo vem do presente do subjuntivo: que você fale, não fale."},
{id:"p7-30",n:2,e:"Assinale a frase em que o particípio está empregado de acordo com a norma-padrão.",a:["O suspeito foi preso em flagrante.", "O suspeito foi prendido em flagrante.", "O suspeito havia preso pela equipe.", "A equipe tinha prendo o suspeito.", "O suspeito foi prendo na saída."],c:"Com ser e estar, usa-se o particípio irregular: foi preso."},
{id:"p7-31",n:2,e:"Assinale a frase em que o particípio está empregado de acordo com a norma-padrão.",a:["O documento foi entregue ao delegado.", "O documento foi entregado ao delegado.", "O pedido foi aceitado pela chefia.", "O suspeito foi prendido na saída.", "O candidato foi elegido vereador."],c:"Com ser, usa-se o particípio irregular: entregue, aceito, preso, eleito."},
{id:"p7-32",n:2,e:"Transpondo para a voz passiva a frase “A Guarda apreenderá as motos”, obtém-se",a:["As motos serão apreendidas pela Guarda.", "As motos foram apreendidas pela Guarda.", "As motos seriam apreendidas pela Guarda.", "As motos serão apreendido pela Guarda.", "A Guarda será apreendida pelas motos."],c:"Apreenderá (futuro do presente) vira serão apreendidas, com o particípio concordando com “motos”."},
{id:"p7-33",n:2,e:"Transpondo para a voz passiva a frase “A equipe estava interditando a rua”, obtém-se",a:["A rua estava sendo interditada pela equipe.", "A rua era interditada pela equipe.", "A rua foi interditada pela equipe.", "A rua estava interditando a equipe.", "A rua estará sendo interditada pela equipe."],c:"Estava interditando vira estava sendo interditada: o auxiliar mantém o tempo."},
{id:"p7-34",n:2,e:"Em “Apreenderam-se três motos”, a voz verbal é",a:["passiva sintética.", "ativa.", "passiva analítica.", "reflexiva.", "recíproca."],c:"Verbo transitivo direto + se: equivale a “três motos foram apreendidas”."},
{id:"p7-35",n:2,e:"Assinale a frase correta.",a:["Deve haver soluções para o problema.", "Devem haver soluções para o problema.", "Podem haver vagas no estacionamento.", "Vão haver mudanças na escala.", "Costumam haver filas na entrada."],c:"Haver no sentido de existir é impessoal e torna impessoal também o auxiliar da locução."},
{id:"p7-36",n:2,e:"Em “Infelizmente, ninguém anotou a placa”, o advérbio “infelizmente”",a:["expressa a opinião de quem fala sobre a oração inteira.", "modifica apenas o verbo “anotou”.", "indica circunstância de lugar.", "intensifica um adjetivo.", "funciona como adjetivo de “ninguém”."],c:"Ele avalia todo o fato: é uma lástima que ninguém tenha anotado a placa."},
{id:"p7-37",n:2,e:"Assinale a frase em que “meio” está corretamente empregado.",a:["As testemunhas estavam meio nervosas.", "As testemunhas estavam meias nervosas.", "Ela ficou meia preocupada.", "Os guardas estavam meios cansados.", "Chegou ao meio-dia e meio."],c:"Meio = um pouco é advérbio e não varia. Na hora, “meio-dia e meia” (meia hora)."},
{id:"p7-38",n:2,e:"Em “Por causa da chuva, a ronda atrasou; apesar disso, terminou no horário”, as expressões “por causa da chuva” e “apesar disso” indicam, respectivamente,",a:["causa e concessão.", "concessão e causa.", "causa e finalidade.", "tempo e condição.", "consequência e concessão."],c:"A chuva causou o atraso; o atraso não impediu o fim no horário (concessão)."},
{id:"p7-39",n:2,e:"Em “Sem autorização, ninguém entra no prédio”, a expressão “sem autorização” indica",a:["condição.", "causa.", "tempo.", "lugar.", "finalidade."],c:"Equivale a “se não houver autorização”: condição."},
{id:"p7-40",n:2,tx:"tk",e:"No segundo parágrafo, em “Ela cruzou depressa, meio assustada”, as palavras “depressa” e “meio” indicam, respectivamente,",a:["modo e intensidade.", "tempo e lugar.", "intensidade e modo.", "lugar e modo.", "modo e dúvida."],c:"Depressa: o modo de cruzar. Meio: intensidade (um pouco assustada)."},
{id:"p7-41",n:3,tx:"tj",e:"No segundo parágrafo, as formas “fechava” e “instalara” expressam, respectivamente,",a:["hábito no passado e fato anterior a outro fato passado.", "ação concluída e ação futura.", "fato não confirmado e hábito.", "hipótese e certeza.", "ação presente e ação passada."],c:"Fechava: hábito (todos os dias). Instalara: o alarme foi instalado antes de o dono contar o caso (mais-que-perfeito)."},
{id:"p7-42",n:3,tx:"tj",e:"No primeiro parágrafo, “os autores já haviam deixado o local” pode ser reescrito, sem alteração de sentido, como",a:["os autores já tinham deixado o local.", "os autores já deixavam o local.", "os autores já deixarão o local.", "os autores já teriam deixado o local.", "os autores já deixam o local."],c:"Haviam deixado e tinham deixado são formas compostas do mais-que-perfeito. “Teriam deixado” transformaria o fato em informação não confirmada."},
{id:"p7-43",n:3,tx:"tj",e:"No segundo parágrafo, “Foram levados celulares e um computador” está na voz passiva. Na voz ativa, com sujeito indeterminado, a frase fica",a:["Levaram celulares e um computador.", "Levou-se celulares e um computador.", "Celulares e um computador levaram.", "Foram levando celulares e um computador.", "Levaria celulares e um computador."],c:"Sujeito indeterminado na ativa: verbo na 3ª pessoa do plural, sem sujeito expresso. (B) erra a concordância da passiva sintética."},
{id:"p7-44",n:3,tx:"tj",e:"No último parágrafo, em “Se os autores forem identificados, o caso seguirá para a Polícia Civil”, a correlação entre os verbos é",a:["futuro do subjuntivo na condição e futuro do presente na consequência.", "pretérito imperfeito do subjuntivo e futuro do pretérito.", "presente do subjuntivo e presente do indicativo.", "futuro do pretérito e futuro do presente.", "imperativo e futuro do presente."],c:"Forem (futuro do subjuntivo) + seguirá (futuro do presente): correlação de fato possível."},
{id:"p7-45",n:3,tx:"tk",e:"No primeiro parágrafo, “lentamente” e “Felizmente” têm, respectivamente, valor de",a:["modo, ligado ao verbo “avançam”, e opinião de quem escreve sobre o fato.", "tempo e lugar.", "intensidade e dúvida.", "negação e afirmação.", "lugar e modo."],c:"Lentamente: modo de avançar. Felizmente: avaliação de quem escreve sobre toda a oração."},
{id:"p7-46",n:3,tx:"tk",e:"No segundo parágrafo, em “parou o carro bem perto da faixa”, a palavra “bem”",a:["intensifica o advérbio “perto”.", "indica modo, modificando “parou”.", "é adjetivo de “carro”.", "indica afirmação.", "é substantivo."],c:"“Bem perto” = muito perto: um advérbio de intensidade modificando outro advérbio."},
{id:"p7-47",n:3,tx:"tk",e:"“Talvez”, no último parágrafo, e “de longe”, no segundo, expressam, respectivamente,",a:["dúvida e lugar.", "certeza e lugar.", "dúvida e modo.", "negação e tempo.", "tempo e lugar."],c:"Talvez: dúvida. De longe: locução adverbial de lugar."},
{id:"p7-48",n:3,e:"Assinale a frase em que o verbo está corretamente empregado no futuro do subjuntivo.",a:["Quando eles vierem, avise a central.", "Quando eles virem amanhã para a reunião, avise a central.", "Se eles trazerem os documentos, avise a central.", "Se eles fazerem a ronda, avise a central.", "Quando eles saberem do caso, avise a central."],c:"Vir (chegar) faz vierem. Nas demais: vierem, trouxerem, fizerem, souberem."},
{id:"p7-49",n:3,e:"Assinale a alternativa em que a passagem para a voz passiva manteve o tempo verbal.",a:["A equipe tinha isolado a área. / A área tinha sido isolada pela equipe.", "A equipe isolou a área. / A área era isolada pela equipe.", "A equipe isolava a área. / A área foi isolada pela equipe.", "A equipe isolará a área. / A área seria isolada pela equipe.", "A equipe isolaria a área. / A área será isolada pela equipe."],c:"Tinha isolado (mais-que-perfeito composto) vira tinha sido isolada. Nas demais, o tempo do verbo ser mudou."},
{id:"p7-50",n:3,e:"Só o verbo transitivo direto admite voz passiva. Assinale a frase que NÃO pode ser passada para a voz passiva.",a:["O guarda precisou de ajuda.", "O guarda pediu ajuda.", "O guarda registrou a ocorrência.", "O guarda multou o motorista.", "O guarda conduziu o suspeito."],c:"Precisar de é transitivo indireto. As demais têm objeto direto (ajuda foi pedida; ocorrência foi registrada...)."},
{id:"p7-51",n:3,e:"Assinale a frase em que o “se” forma voz passiva sintética e o verbo concorda corretamente.",a:["Registraram-se três ocorrências na madrugada.", "Registrou-se três ocorrências na madrugada.", "Precisam-se de voluntários.", "Trata-se de casos graves.", "Vende-se motos apreendidas."],c:"Verbo transitivo direto + se: o termo seguinte é sujeito e o verbo concorda. (B) e (E) erram a concordância; (C) e (D) têm verbo transitivo indireto, com se de indeterminação; (D) está correta, mas não é passiva."},
{id:"p7-52",n:3,e:"Assinale a alternativa em que a palavra destacada é advérbio, e não adjetivo.",a:["As motos custaram caro.", "Comprou um carro caro.", "Os sapatos caros estragaram.", "A vida está cara.", "Foi um erro caro."],c:"Em “custaram caro”, a palavra modifica o verbo e não varia. Nas demais, caracteriza um substantivo."},
{id:"p7-53",n:3,e:"Em “O guarda agiu rápida e cuidadosamente”, ocorre",a:["omissão do sufixo -mente no primeiro advérbio, recurso aceito pela norma.", "erro de concordância, pois o certo é “rápido”.", "erro, pois o sufixo deveria aparecer nas duas palavras.", "uso de adjetivo no lugar de advérbio, o que é incorreto.", "flexão indevida do advérbio no feminino."],c:"Em advérbios coordenados em -mente, o sufixo pode ficar só no último. “Rápida” é a forma feminina que serve de base ao advérbio."},
{id:"p7-54",n:3,e:"Em “Fez a ronda com o parceiro” e “Abriu o portão com a chave reserva”, as expressões iniciadas por “com” indicam, respectivamente,",a:["companhia e instrumento.", "instrumento e companhia.", "modo e causa.", "causa e finalidade.", "companhia e finalidade."],c:"Com o parceiro: companhia. Com a chave: instrumento."},
{id:"p7-55",n:3,e:"Em “A equipe permaneceu no local para preservar a cena”, o trecho “para preservar a cena” indica",a:["finalidade.", "causa.", "consequência.", "condição.", "concessão."],c:"Explica o objetivo de permanecer no local."},
{id:"p7-56",n:3,e:"No relatório, a frase “Vou estar enviando o boletim amanhã” fica de acordo com a norma-padrão e mais clara reescrita como",a:["Enviarei o boletim amanhã.", "Vou estar enviado o boletim amanhã.", "Estarei enviando-se o boletim amanhã.", "Vou enviando o boletim amanhã.", "Ia estar enviando o boletim amanhã."],c:"O gerundismo (vou estar + gerúndio) deve ser trocado por futuro simples ou “vou enviar”."},
{id:"p7-57",n:3,e:"Assinale a alternativa em que o verbo “fazer” está corretamente flexionado.",a:["Faz meses que a praça está sem iluminação.", "Fazem meses que a praça está sem iluminação.", "Fizeram dez dias que ele sumiu.", "Vão fazer dois anos que entrei na Guarda.", "Devem fazer 30 graus agora."],c:"Fazer de tempo ou de clima é impessoal, e o auxiliar acompanha: vai fazer, deve fazer."},
{id:"p7-58",n:3,e:"Em “Pediu para os guardas saírem”, o infinitivo está flexionado porque",a:["tem sujeito próprio, “os guardas”, no plural.", "concorda com o sujeito de “pediu”.", "está na voz passiva.", "forma locução verbal com “pediu”.", "é impessoal."],c:"Quem sai são os guardas: o infinitivo tem sujeito próprio e pode concordar com ele."},
{id:"p7-59",n:3,e:"Assinale a afirmação INCORRETA.",a:["O modo subjuntivo apresenta os fatos como certos.", "O futuro do pretérito pode indicar fato não confirmado.", "O pretérito mais-que-perfeito indica passado anterior a outro passado.", "O imperativo negativo vem do presente do subjuntivo.", "O verbo haver, no sentido de existir, é impessoal."],c:"O subjuntivo expressa hipótese, desejo ou dúvida. Quem apresenta o fato como certo é o indicativo."},
{id:"p7-60",n:3,e:"Assinale a afirmação INCORRETA sobre os advérbios.",a:["Advérbios variam em gênero e número para concordar com o verbo.", "O advérbio pode modificar um adjetivo.", "O advérbio pode modificar outro advérbio.", "Locuções como “às pressas” e “de longe” funcionam como advérbios.", "“Certamente” e “sem dúvida” expressam afirmação."],c:"O advérbio é invariável."}
];

BANCO["pt-8"] = [
{id:"p8-01",n:1,e:"Assinale a alternativa que contém apenas preposições.",a:["de, para, com, sem", "e, mas, porém, logo", "que, se, como, quando", "muito, bem, já, ainda", "o, a, os, as"],c:"De, para, com e sem são preposições essenciais. As demais listas trazem conjunções, advérbios ou artigos."},
{id:"p8-02",n:1,e:"Em “A viatura da Guarda chegou”, a preposição “de” (em “da”) indica",a:["posse.", "lugar.", "tempo.", "causa.", "finalidade."],c:"A viatura pertence à Guarda."},
{id:"p8-03",n:1,e:"Em “Abriu o portão com a chave reserva”, a preposição “com” indica",a:["instrumento.", "companhia.", "causa.", "tempo.", "oposição."],c:"A chave é o instrumento usado para abrir."},
{id:"p8-04",n:1,e:"Em “Fez a ronda com o parceiro”, a preposição “com” indica",a:["companhia.", "instrumento.", "modo.", "causa.", "lugar."],c:"O parceiro acompanhou a ronda."},
{id:"p8-05",n:1,e:"Em “O suspeito foi detido pelo guarda”, a expressão “pelo guarda” é introduzida pela preposição “por” e indica",a:["o agente da ação na voz passiva.", "o lugar da ação.", "a finalidade da ação.", "o tempo da ação.", "a causa da ação."],c:"Na voz passiva, “por” introduz quem pratica a ação: o guarda deteve o suspeito."},
{id:"p8-06",n:1,e:"Em “A equipe ficou no local para preservar a cena”, a preposição “para” indica",a:["finalidade.", "causa.", "lugar.", "tempo.", "oposição."],c:"Para preservar = a fim de preservar."},
{id:"p8-07",n:1,e:"Assinale a conjunção adversativa.",a:["porém", "porque", "quando", "embora", "se"],c:"Porém indica oposição. Porque é causal; quando, temporal; embora, concessiva; se, condicional."},
{id:"p8-08",n:1,e:"Em “Estudou e passou no concurso”, a conjunção “e” indica",a:["adição.", "oposição.", "conclusão.", "explicação.", "alternância."],c:"Soma dois fatos que combinam."},
{id:"p8-09",n:1,e:"Em “Ou você estuda, ou desiste da vaga”, o par “ou... ou” expressa",a:["alternância.", "adição.", "causa.", "conclusão.", "concessão."],c:"Uma possibilidade exclui a outra."},
{id:"p8-10",n:1,e:"Em “A rua estava escura; portanto, a ronda foi reforçada”, “portanto” indica",a:["conclusão.", "oposição.", "causa.", "tempo.", "condição."],c:"O reforço é a conclusão tirada da rua escura."},
{id:"p8-11",n:1,e:"Em “A ronda foi adiada porque choveu”, “porque” indica",a:["causa.", "consequência.", "condição.", "finalidade.", "concessão."],c:"A chuva é o motivo do adiamento."},
{id:"p8-12",n:1,e:"Em “Embora estivesse cansado, o guarda terminou a ronda”, “embora” indica",a:["concessão.", "causa.", "condição.", "conclusão.", "tempo."],c:"O cansaço é um obstáculo que não impediu a ronda."},
{id:"p8-13",n:1,e:"Em “Se chover, a feira será cancelada”, “se” indica",a:["condição.", "causa.", "tempo.", "concessão.", "finalidade."],c:"O cancelamento depende da chuva."},
{id:"p8-14",n:1,e:"Em “Quando a viatura chegou, o suspeito fugiu”, “quando” indica",a:["tempo.", "causa.", "condição.", "conformidade.", "proporção."],c:"Marca o momento da fuga."},
{id:"p8-15",n:1,e:"Em “O relatório foi feito conforme o manual”, “conforme” indica",a:["conformidade.", "comparação.", "condição.", "causa.", "tempo."],c:"Conforme = de acordo com."},
{id:"p8-16",n:1,e:"Em “Ele correu tanto que ficou sem fôlego”, a construção “tanto... que” indica",a:["consequência.", "causa.", "finalidade.", "comparação.", "concessão."],c:"Ficar sem fôlego é o resultado de correr tanto."},
{id:"p8-17",n:1,e:"A palavra “pelo”, em “Passou pelo centro”, é formada por",a:["preposição “por” + artigo “o”.", "preposição “para” + artigo “o”.", "pronome + artigo.", "conjunção + artigo.", "advérbio + artigo."],c:"Por + o = pelo, uma contração."},
{id:"p8-18",n:1,e:"Em “Passou a noite sob custódia”, a preposição “sob” indica",a:["posição inferior, sujeição.", "posição superior.", "assunto.", "companhia.", "oposição."],c:"Sob = debaixo de, sujeito a. Não confunda com sobre."},
{id:"p8-19",n:1,e:"Em “Falaram sobre o caso na reunião”, “sobre” indica",a:["assunto.", "posição inferior.", "tempo.", "companhia.", "causa."],c:"Sobre o caso = a respeito do caso."},
{id:"p8-20",n:1,tx:"tl",e:"No primeiro parágrafo, “porque” introduz",a:["a causa da medida adotada.", "a consequência da medida.", "uma condição para a medida.", "uma oposição à medida.", "a finalidade da medida."],c:"Os furtos registrados explicam por que a Guarda reforçou a feira."},
{id:"p8-21",n:2,e:"Em “Estudou muito e não passou”, a conjunção “e” tem valor",a:["adversativo, equivalendo a “mas”.", "aditivo.", "conclusivo.", "explicativo.", "alternativo."],c:"Os fatos se chocam: estudou muito, mas não passou."},
{id:"p8-22",n:2,e:"Em “Leve o guarda-chuva, pois vai chover”, “pois” é",a:["explicativo.", "conclusivo.", "adversativo.", "alternativo.", "aditivo."],c:"Antes do verbo, justifica a ordem dada."},
{id:"p8-23",n:2,e:"Em “Choveu muito; a ronda, pois, foi adiada”, “pois” é",a:["conclusivo, equivalendo a “portanto”.", "explicativo.", "causal, equivalendo a “porque”.", "adversativo.", "aditivo."],c:"Depois do verbo e entre vírgulas, “pois” conclui."},
{id:"p8-24",n:2,e:"Em “Como estava chovendo, a ronda foi adiada”, “como” indica",a:["causa.", "comparação.", "conformidade.", "modo.", "tempo."],c:"No início da frase, “como” = já que."},
{id:"p8-25",n:2,e:"Em “Fiz o relatório como o chefe pediu”, “como” indica",a:["conformidade.", "causa.", "comparação.", "condição.", "tempo."],c:"Como = conforme."},
{id:"p8-26",n:2,e:"Em “Ele é forte como um touro”, “como” indica",a:["comparação.", "causa.", "conformidade.", "condição.", "finalidade."],c:"Compara a força dele à de um touro."},
{id:"p8-27",n:2,e:"Em “Você entra, desde que apresente o crachá”, “desde que” indica",a:["condição.", "tempo.", "causa.", "concessão.", "finalidade."],c:"Com subjuntivo (apresente), desde que = contanto que."},
{id:"p8-28",n:2,e:"Em “Desde que entrou na Guarda, ele trabalha à noite”, “desde que” indica",a:["tempo.", "condição.", "causa.", "conformidade.", "finalidade."],c:"Com indicativo (entrou), marca o ponto de partida no tempo."},
{id:"p8-29",n:2,e:"Em “À medida que a noite avançava, o movimento diminuía”, a locução destacada indica",a:["proporção.", "causa.", "condição.", "concessão.", "finalidade."],c:"Um fato varia junto com o outro."},
{id:"p8-30",n:2,e:"Em “Fale baixo para que o bebê não acorde”, “para que” indica",a:["finalidade.", "causa.", "consequência.", "condição.", "tempo."],c:"Indica o objetivo de falar baixo."},
{id:"p8-31",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Chegou a hora de o guarda sair.", "Chegou a hora do guarda sair.", "Está na hora dele assinar o termo.", "Apesar do motorista ter parado, foi multado.", "Antes dos agentes chegarem, a rua foi fechada."],c:"Quando o termo é sujeito do infinitivo, a preposição não se junta a ele: de o guarda sair."},
{id:"p8-32",n:2,e:"Segundo a norma-padrão, a expressão “ao invés de” indica",a:["oposição, ideia contrária.", "simples substituição, troca.", "causa.", "finalidade.", "tempo."],c:"Ao invés de = ao contrário de. Para troca, usa-se em vez de."},
{id:"p8-33",n:2,e:"Assinale a frase em que “ao invés de” está empregado de acordo com a norma-padrão.",a:["Ao invés de subir, o preço desceu.", "Ao invés de café, pediu chá.", "Ao invés do guarda André, veio o guarda Bruno.", "Ao invés de ônibus, foi de táxi.", "Ao invés de caneta, usou lápis."],c:"Só em (A) há ideias opostas (subir e descer). Nas demais, há simples troca: em vez de."},
{id:"p8-34",n:2,e:"Em “O carro foi de encontro ao poste”, a expressão indica",a:["choque, colisão.", "a favor, na direção de.", "finalidade.", "proximidade sem contato.", "concordância."],c:"De encontro a = contra, em choque com."},
{id:"p8-35",n:2,e:"Em “A proposta vem ao encontro do que pedimos”, a expressão indica",a:["concordância com o que se deseja.", "oposição.", "choque.", "causa.", "tempo."],c:"Ao encontro de = em direção a, a favor de."},
{id:"p8-36",n:2,e:"Assinale a reescrita que mantém o sentido de “Embora estivesse cansado, continuou a ronda”.",a:["Estava cansado, mas continuou a ronda.", "Estava cansado, porque continuou a ronda.", "Se estava cansado, continuou a ronda.", "Estava cansado, portanto continuou a ronda.", "Estava cansado, ou continuou a ronda."],c:"A concessão (embora) pode virar oposição (mas), com o verbo ajustado ao indicativo."},

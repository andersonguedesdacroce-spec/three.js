{id:"p12-13",n:1,e:"Complete: “____ dez anos, ele entrou na Guarda.”",a:["Há", "A", "À", "Às", "Ah"],c:"Tempo passado: há (faz dez anos)."},
{id:"p12-14",n:1,e:"Complete: “O posto fica ____ dois quilômetros daqui.”",a:["a", "há", "à", "às", "á"],c:"Distância: preposição a."},
{id:"p12-15",n:1,e:"Complete: “Os agentes estão ____ disposição da população.”",a:["à", "a", "há", "ás", "as"],c:"Locução feminina: à disposição."},
{id:"p12-16",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Ele começou a trabalhar cedo.", "Ele começou à trabalhar cedo.", "Ele começou há trabalhar cedo.", "Ele começou á trabalhar cedo.", "Ele começou às trabalhar cedo."],c:"Antes de verbo, nunca há crase."},
{id:"p12-17",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["O carro estava à venda na esquina.", "O carro estava há venda na esquina.", "O carro estava á venda na esquina.", "O carro estava às venda na esquina.", "O carro estava àa venda na esquina."],c:"Locução feminina: à venda."},
{id:"p12-18",n:1,e:"Assinale a frase em que há crase obrigatória.",a:["Obedeça à sinalização.", "Obedeça a todas as regras.", "Obedeça a esta regra.", "Obedeça a ela.", "Obedeça a qualquer ordem."],c:"Obedecer a + a sinalização. Nas demais, o termo não aceita artigo."},
{id:"p12-19",n:1,e:"Complete: “Prefiro a ronda ____ base.”",a:["à", "a", "há", "às", "á"],c:"Preferir A a B; “base” aceita artigo: à base."},
{id:"p12-20",n:1,tx:"tr",e:"No primeiro parágrafo, em “das 18h às 23h”, o acento grave se justifica porque",a:["indica horas determinadas, com preposição e artigo.", "antecede verbo.", "antecede palavra masculina.", "antecede nome de cidade.", "é facultativo."],c:"Horas determinadas levam crase."},
{id:"p12-21",n:2,e:"Assinale a frase em que o acento grave é facultativo.",a:["Refiro-me à sua escala.", "Refiro-me à escala.", "Refiro-me àquela escala.", "Cheguei às 22h.", "Saiu às pressas."],c:"Antes de possessivo feminino singular, o artigo é opcional."},
{id:"p12-22",n:2,e:"Assinale a frase em que o acento grave é facultativo.",a:["Foi até à delegacia.", "Foi à delegacia.", "Foi às pressas.", "Voltou à noite.", "Assistiu à palestra."],c:"Depois de “até”, a crase é facultativa."},
{id:"p12-23",n:2,e:"Assinale a frase em que o acento grave é facultativo.",a:["Entreguei o relatório à Mariana.", "Entreguei o relatório à delegada.", "Entreguei o relatório à chefia.", "Entreguei o relatório à equipe.", "Entreguei o relatório às 18h."],c:"Antes de nome próprio feminino de pessoa, o artigo é opcional."},
{id:"p12-24",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Voltou a casa depois do plantão.", "Voltou à casa depois do plantão.", "Voltou há casa depois do plantão.", "Voltou às casa depois do plantão.", "Voltou á casa depois do plantão."],c:"Casa no sentido de lar, sem determinante: sem crase."},
{id:"p12-25",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Voltou à casa dos pais depois do plantão.", "Voltou a casa dos pais depois do plantão.", "Voltou há casa dos pais depois do plantão.", "Voltou ás casa dos pais depois do plantão.", "Voltou às casa dos pais depois do plantão."],c:"Com determinante (dos pais), casa aceita artigo: crase."},
{id:"p12-26",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Fui à Campinas da minha infância.", "Fui a Campinas da minha infância.", "Fui há Campinas da minha infância.", "Fui às Campinas da minha infância.", "Fui á Campinas da minha infância."],c:"Cidade com determinante aceita artigo: crase."},
{id:"p12-27",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["A ocorrência de hoje é semelhante à de ontem.", "A ocorrência de hoje é semelhante a de ontem.", "A ocorrência de hoje é semelhante há de ontem.", "A ocorrência de hoje é semelhante á de ontem.", "A ocorrência de hoje é semelhante àa de ontem."],c:"Semelhante a + a (= aquela) de ontem: à de ontem."},
{id:"p12-28",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["A escala à qual me refiro foi alterada.", "A escala a qual me refiro foi alterada.", "A escala há qual me refiro foi alterada.", "A escala á qual me refiro foi alterada.", "A escala às qual me refiro foi alterada."],c:"Referir-se a + a qual: à qual."},
{id:"p12-29",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Fui a reuniões a semana toda.", "Fui à reuniões a semana toda.", "Fui às reunião a semana toda.", "Fui á reuniões a semana toda.", "Fui há reuniões a semana toda."],c:"“A” no singular antes de plural é só preposição."},
{id:"p12-30",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["A operação vai de 10 a 30 de novembro.", "A operação vai de 10 à 30 de novembro.", "A operação vai de 10 há 30 de novembro.", "A operação vai de 10 às 30 de novembro.", "A operação vai de 10 á 30 de novembro."],c:"Numeral sem artigo: sem crase."},
{id:"p12-31",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Daqui a dois dias, a escala muda.", "Daqui à dois dias, a escala muda.", "Daqui há dois dias, a escala muda.", "Daqui á dois dias, a escala muda.", "Daqui às dois dias, a escala muda."],c:"Futuro: daqui a."},
{id:"p12-32",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Pedi bife à parmegiana no intervalo.", "Pedi bife a parmegiana no intervalo.", "Pedi bife há parmegiana no intervalo.", "Pedi bife á parmegiana no intervalo.", "Pedi bife às parmegiana no intervalo."],c:"Expressão “à moda de” subentendida."},
{id:"p12-33",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["O sargento ficou frente a frente com o suspeito.", "O sargento ficou frente à frente com o suspeito.", "O sargento ficou frente há frente com o suspeito.", "O sargento ficou frente á frente com o suspeito.", "O sargento ficou frente às frente com o suspeito."],c:"Palavras repetidas: sem crase."},
{id:"p12-34",n:2,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["Entregou a carta à Vossa Senhoria.", "Entregou a carta à senhora.", "Entregou a carta à chefe.", "Entregou a carta àquela agente.", "Entregou a carta às 10h."],c:"Vossa Senhoria não aceita artigo; “senhora” aceita."},
{id:"p12-35",n:2,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["Os agentes saíram à cavalo.", "Os agentes saíram à noite.", "Os agentes saíram às pressas.", "Os agentes saíram à procura do suspeito.", "Os agentes saíram à tarde."],c:"Cavalo é masculino: a cavalo."},
{id:"p12-36",n:2,e:"Complete: “A Guarda respondeu ____ reclamações dos moradores ____ partir de segunda-feira.”",a:["às / a", "as / à", "às / à", "há / a", "as / há"],c:"Responder a + as reclamações = às; antes do verbo partir, só a."},
{id:"p12-37",n:2,e:"Em “Refiro-me àquilo que você disse”, o acento grave resulta da fusão de",a:["preposição “a” com o pronome “aquilo”.", "artigo com artigo.", "preposição com verbo.", "dois pronomes.", "preposição com advérbio."],c:"Referir-se a + aquilo = àquilo."},
{id:"p12-38",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Estou disposto a colaborar com a investigação.", "Estou disposto à colaborar com a investigação.", "Estou disposto há colaborar com a investigação.", "Estou disposto á colaborar com a investigação.", "Estou disposto às colaborar com a investigação."],c:"Antes de verbo, sem crase."},
{id:"p12-39",n:2,tx:"tr",e:"No primeiro parágrafo, em “A medida atende às reclamações”, há crase porque",a:["o verbo foi construído com a preposição “a”, e “reclamações” vem com o artigo “as”.", "antecede hora.", "é locução adverbial.", "antecede verbo.", "é facultativa antes de plural."],c:"Atender a + as reclamações = às reclamações."},
{id:"p12-40",n:2,tx:"tr",e:"No segundo parágrafo, em “Os agentes circularão a pé”, não há crase porque",a:["“pé” é palavra masculina.", "antecede verbo.", "antecede pronome.", "antecede nome de cidade.", "é locução facultativa."],c:"Antes de masculino, sem crase."},
{id:"p12-41",n:3,tx:"tr",e:"No terceiro parágrafo, “Há duas semanas” está escrito com “há”, e não com “a”, porque",a:["indica tempo passado, com o verbo haver.", "indica distância.", "indica tempo futuro.", "é preposição antes de numeral.", "é crase facultativa."],c:"Há = faz: tempo passado."},
{id:"p12-42",n:3,tx:"tr",e:"No segundo parágrafo, em “de 10 a 30 de novembro”, não há crase porque",a:["não há artigo antes do numeral, apenas a preposição.", "“novembro” é masculino.", "antecede verbo.", "antecede pronome.", "a crase é facultativa entre numerais."],c:"Entre numerais sem artigo, só preposição."},
{id:"p12-43",n:3,tx:"tr",e:"No terceiro parágrafo, em “dirigir-se a qualquer agente”, não há crase porque",a:["“qualquer agente” não admite artigo feminino.", "antecede verbo.", "indica hora.", "é locução adverbial.", "a crase é facultativa antes de pronome indefinido."],c:"Pronome indefinido não aceita artigo."},
{id:"p12-44",n:3,tx:"tr",e:"No terceiro parágrafo, em “à frente da bilheteria”, o acento grave se justifica por se tratar de",a:["locução prepositiva formada com palavra feminina.", "hora determinada.", "nome próprio de pessoa.", "pronome possessivo.", "verbo no infinitivo."],c:"À frente de é locução feminina."},
{id:"p12-45",n:3,e:"Assinale a alternativa em que o acento grave está correto em todas as ocorrências.",a:["Fui à delegacia às 10h e voltei à noite.", "Fui à delegacia às 10h e voltei à pé.", "Fui a delegacia às 10h e voltei à noite.", "Fui à delegacia as 10h e voltei à noite.", "Fui à delegacia às 10h e comecei à escrever."],c:"Ir a + a delegacia; hora determinada; locução feminina."},
{id:"p12-46",n:3,e:"Assinale a alternativa em que o acento grave está INCORRETO.",a:["Chegou à uma conclusão rapidamente.", "Chegou à uma hora da manhã.", "Chegou à praça às 22h.", "Chegou à conclusão certa.", "Chegou à noite."],c:"Artigo indefinido “uma” não leva crase, salvo na indicação de hora."},
{id:"p12-47",n:3,e:"Complete: “Entreguei o termo ____ Vossa Senhoria, mas o original ficou ____ disposição da chefe ____ partir de hoje.”",a:["a / à / a", "à / à / à", "a / a / à", "à / a / a", "a / à / à"],c:"Tratamento sem artigo; locução feminina; antes de verbo, sem crase."},
{id:"p12-48",n:3,e:"Assinale a alternativa em que a troca por uma palavra masculina comprova a crase.",a:["Fui à praça. / Fui ao parque.", "Fui a Campinas. / Fui a Sorocaba.", "Comecei a correr. / Comecei a andar.", "Entreguei a ela. / Entreguei a ele.", "Fiquei cara a cara. / Fiquei frente a frente."],c:"Se o masculino pede “ao”, o feminino pede “à”."},
{id:"p12-49",n:3,e:"Assinale a frase em que há erro no uso de “há” ou “a”.",a:["Daqui há dez minutos a viatura chega.", "Há dez minutos a viatura chegou.", "Daqui a dez minutos a viatura chega.", "A viatura está a dez metros.", "Há muito tempo não chove."],c:"Futuro: daqui a dez minutos."},
{id:"p12-50",n:3,e:"Assinale a frase em que o acento grave é obrigatório.",a:["Assisti à operação inteira.", "Assisti a uma operação.", "Assisti a esta operação.", "Assisti a ela.", "Assisti a operações."],c:"Assistir a + a operação. Nas demais: artigo indefinido, demonstrativo, pessoal e plural sem artigo."},
{id:"p12-51",n:3,e:"Assinale a alternativa em que as duas formas são aceitas.",a:["Foi até a praça. / Foi até à praça.", "Foi a pé. / Foi à pé.", "Chegou às 10h. / Chegou as 10h.", "Vou a Campinas. / Vou à Campinas.", "Começou a chover. / Começou à chover."],c:"Depois de “até”, a crase é facultativa."},
{id:"p12-52",n:3,e:"Assinale a alternativa em que as duas formas são aceitas.",a:["Refiro-me a sua escala. / Refiro-me à sua escala.", "Refiro-me a escala. / Refiro-me à escala.", "Refiro-me aquela escala. / Refiro-me àquela escala.", "Refiro-me a ela. / Refiro-me à ela.", "Refiro-me a esta escala. / Refiro-me à esta escala."],c:"Antes de possessivo feminino singular, a crase é facultativa."},
{id:"p12-53",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["O guarda aspira à promoção desde o ano passado.", "O guarda aspira a promoção desde o ano passado.", "O guarda aspira há promoção desde o ano passado.", "O guarda aspira á promoção desde o ano passado.", "O guarda aspira às promoção desde o ano passado."],c:"Aspirar (desejar) pede a; “promoção” aceita artigo: à promoção."},
{id:"p12-54",n:3,e:"Assinale a frase em que o acento grave está INCORRETO.",a:["A medida não agradou à todos.", "A medida não agradou à população.", "A medida não agradou às famílias.", "A medida não agradou àquela comissão.", "A medida não agradou à equipe."],c:"“Todos” é masculino e indefinido: agradou a todos."},
{id:"p12-55",n:3,e:"Assinale a frase em que a crase ocorre antes de nome masculino por indicar “à moda de”.",a:["Ele dribla à Garrincha.", "Ele chegou à praça.", "Ele saiu à noite.", "Ele dirigiu-se à chefe.", "Ele obedeceu à regra."],c:"À Garrincha = à moda de Garrincha."},
{id:"p12-56",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Os ambulantes ficaram à espera da fiscalização.", "Os ambulantes ficaram a espera da fiscalização.", "Os ambulantes ficaram há espera da fiscalização.", "Os ambulantes ficaram á espera da fiscalização.", "Os ambulantes ficaram às espera da fiscalização."],c:"Locução feminina: à espera de."},
{id:"p12-57",n:3,e:"Complete: “Ele não se referiu ____ você nem ____ ninguém; referiu-se apenas ____ delegada.”",a:["a / a / à", "à / à / à", "a / à / a", "à / a / à", "a / a / a"],c:"Você e ninguém não aceitam artigo; “delegada” aceita."},
{id:"p12-58",n:3,e:"Assinale a alternativa em que o acento grave está correto.",a:["Esta ocorrência é igual à que registramos ontem.", "A escala à que me refiro mudou.", "Entreguei o termo à quem pediu.", "Fui à uma reunião.", "Estou à seu dispor."],c:"À que = àquela que. Nas demais: a que (relativo), a quem, a uma, a seu dispor."},
{id:"p12-59",n:3,e:"Assinale a afirmação INCORRETA sobre crase.",a:["Há crase antes de verbo no infinitivo.", "Há crase nas horas determinadas.", "Não há crase antes de palavra masculina, salvo com “à moda de”.", "Depois de “até”, a crase é facultativa.", "Antes de pronome possessivo feminino singular, a crase é facultativa."],c:"Antes de verbo nunca há crase."},
{id:"p12-60",n:3,e:"Complete: “Das 8h ____ 18h, os agentes ficam ____ porta do prédio; ____ noite, o turno passa ____ uma equipe reserva.”",a:["às / à / À / a", "às / a / A / à", "as / à / À / à", "às / à / A / à", "as / a / À / a"],c:"Horas; à porta (ficar à porta); locução à noite; artigo indefinido uma, sem crase."}
];

BANCO["mt-1"] = [
{id:"m1-01",n:1,e:"Uma viatura gastou 1/2 do tanque pela manhã e 1/3 do tanque à tarde. Ao todo, gastou",a:["5/6", "2/5", "1/6", "2/3", "3/5"],c:"MMC de 2 e 3 é 6: 3/6 + 2/6 = 5/6. Não se somam os denominadores."},
{id:"m1-02",n:1,e:"O resultado de 3/4 − 1/6 é",a:["7/12", "2/2", "1/2", "5/12", "1/5"],c:"MMC 12: 9/12 − 2/12 = 7/12."},
{id:"m1-03",n:1,e:"O produto 2/5 × 3/4 é igual a",a:["3/10", "5/9", "6/9", "1/2", "8/15"],c:"Numerador com numerador, denominador com denominador: 6/20 = 3/10."},
{id:"m1-04",n:1,e:"O resultado de 3 ÷ 1/2 é",a:["6", "3/2", "1/6", "2/3", "1,5"],c:"Dividir por 1/2 é multiplicar por 2: 3 × 2 = 6."},
{id:"m1-05",n:1,e:"O valor de 3/5 de 40 é",a:["24", "8", "16", "25", "120"],c:"40 ÷ 5 = 8, e 8 × 3 = 24."},
{id:"m1-06",n:1,e:"A soma 2,4 + 0,75 é igual a",a:["3,15", "2,79", "3,0", "3,05", "2,115"],c:"Alinhando a vírgula: 2,40 + 0,75 = 3,15."},
{id:"m1-07",n:1,e:"O resultado de 5 − 1,35 é",a:["3,65", "4,35", "3,75", "4,65", "3,35"],c:"5,00 − 1,35 = 3,65."},
{id:"m1-08",n:1,e:"O produto 0,3 × 0,2 é igual a",a:["0,06", "0,6", "0,5", "0,006", "0,05"],c:"3 × 2 = 6, e há duas casas decimais no total: 0,06."},
{id:"m1-09",n:1,e:"O quociente de 7,2 ÷ 0,6 é",a:["12", "1,2", "0,12", "120", "1,12"],c:"Multiplicando os dois por 10: 72 ÷ 6 = 12."},
{id:"m1-10",n:1,e:"A fração 3/4, escrita na forma decimal, é",a:["0,75", "0,34", "0,25", "3,4", "0,43"],c:"3 ÷ 4 = 0,75."},
{id:"m1-11",n:1,e:"O número decimal 0,6, escrito como fração irredutível, é",a:["3/5", "6/100", "1/6", "2/3", "6/5"],c:"0,6 = 6/10 = 3/5."},
{id:"m1-12",n:1,e:"O valor de 2<sup>5</sup> é",a:["32", "10", "25", "64", "16"],c:"2 × 2 × 2 × 2 × 2 = 32."},
{id:"m1-13",n:1,e:"O valor de √81 é",a:["9", "8", "40,5", "18", "27"],c:"9 × 9 = 81."},
{id:"m1-14",n:1,e:"O valor de (−3)<sup>2</sup> é",a:["9", "−9", "6", "−6", "1/9"],c:"Expoente par: os sinais negativos se anulam. (−3) × (−3) = 9."},
{id:"m1-15",n:1,e:"O valor de 12 + 3 × 4 é",a:["24", "60", "15", "48", "144"],c:"A multiplicação vem antes: 3 × 4 = 12, e 12 + 12 = 24."},
{id:"m1-16",n:1,e:"O número misto 4 1/2, escrito como fração imprópria, é",a:["9/2", "5/2", "4/2", "8/2", "41/2"],c:"(4 × 2 + 1)/2 = 9/2."},
{id:"m1-17",n:1,e:"A fração 18/24, na forma irredutível, é",a:["3/4", "9/12", "6/8", "2/3", "1/2"],c:"Dividindo por 6 (maior divisor comum): 3/4. As frações 9/12 e 6/8 são equivalentes, mas não irredutíveis."},
{id:"m1-18",n:1,e:"A fração de maior valor entre as listadas é",a:["3/4", "2/3", "5/8", "1/2", "3/5"],c:"Em decimais: 0,75; 0,667; 0,625; 0,5; 0,6. A maior é 3/4."},
{id:"m1-19",n:1,tx:"mt1a",e:"De acordo com o texto, a fração do tanque que a viatura gastou nas duas semanas, somadas, foi",a:["17/20", "4/9", "3/10", "1/2", "4/5"],c:"3/5 + 1/4 = 12/20 + 5/20 = 17/20."},
{id:"m1-20",n:1,tx:"mt1a",e:"Segundo o texto, na primeira semana a viatura gastou, em litros,",a:["30", "25", "20", "15", "12,5"],c:"3/5 de 50 = 50 ÷ 5 × 3 = 30 litros."},
{id:"m1-21",n:2,e:"O valor de 5/6 − 3/8 + 1/4 é",a:["17/24", "3/18", "1/2", "7/12", "3/4"],c:"MMC 24: 20/24 − 9/24 + 6/24 = 17/24."},
{id:"m1-22",n:2,e:"A soma 2 1/3 + 1 3/4 é igual a",a:["4 1/12", "3 4/7", "3 1/12", "4 1/7", "4"],c:"7/3 + 7/4 = 28/12 + 21/12 = 49/12 = 4 1/12."},
{id:"m1-23",n:2,e:"O valor da fração (2/3) / (4/9) é",a:["3/2", "8/27", "2/3", "1/3", "6"],c:"2/3 ÷ 4/9 = 2/3 × 9/4 = 18/12 = 3/2."},
{id:"m1-24",n:2,e:"O valor de 3/4 de 2/5 de 200 é",a:["60", "80", "120", "150", "30"],c:"2/5 de 200 = 80; 3/4 de 80 = 60."},
{id:"m1-25",n:2,e:"O valor de 0,25 × 1,2 ÷ 0,05 é",a:["6", "0,6", "60", "0,06", "1,5"],c:"0,25 × 1,2 = 0,3, e 0,3 ÷ 0,05 = 30 ÷ 5 = 6."},
{id:"m1-26",n:2,e:"O valor de 0,333... + 1/6 é",a:["1/2", "1/3", "5/9", "2/9", "1/18"],c:"0,333... = 1/3. Então 1/3 + 1/6 = 2/6 + 1/6 = 1/2."},
{id:"m1-27",n:2,e:"A fração geratriz da dízima 0,4545... é",a:["5/11", "45/100", "9/20", "4/9", "4/11"],c:"Período 45 sobre 99: 45/99 = 5/11 (dividindo por 9)."},
{id:"m1-28",n:2,e:"O valor de 2<sup>−3</sup> + 2<sup>−2</sup> é",a:["3/8", "1/32", "−5", "1/5", "1/2"],c:"2<sup>−3</sup> = 1/8 e 2<sup>−2</sup> = 1/4. Então 1/8 + 2/8 = 3/8."},
{id:"m1-29",n:2,e:"O valor de (3<sup>4</sup> × 3<sup>−2</sup>) ÷ 3 é",a:["3", "27", "1/3", "9", "81"],c:"Somam-se e subtraem-se os expoentes: 4 − 2 − 1 = 1. Resultado 3<sup>1</sup> = 3."},
{id:"m1-30",n:2,e:"O valor de √(49/64) é",a:["7/8", "49/8", "7/64", "1/8", "7/16"],c:"A raiz do quociente é o quociente das raízes: √49 / √64 = 7/8."},
{id:"m1-31",n:2,e:"O radical √50, simplificado, é igual a",a:["5√2", "25√2", "2√5", "10√5", "5√10"],c:"50 = 25 × 2, e √25 = 5. Logo √50 = 5√2."},
{id:"m1-32",n:2,e:"O valor de 10 − 2 × (3 + 1)<sup>2</sup> ÷ 8 é",a:["6", "−2", "16", "1", "−6"],c:"Parêntese: 4; ao quadrado, 16. Depois 2 × 16 ÷ 8 = 4. Por fim, 10 − 4 = 6."},
{id:"m1-33",n:2,e:"O valor de 1/2 + 1/3 ÷ 1/6 é",a:["5/2", "1", "1/9", "2/9", "3"],c:"A divisão vem antes: 1/3 ÷ 1/6 = 1/3 × 6 = 2. Depois 1/2 + 2 = 5/2."},
{id:"m1-34",n:2,e:"Do efetivo de 120 guardas, 2/3 estão de serviço e, destes, 3/8 patrulham a pé. O número de guardas que patrulham a pé é",a:["30", "45", "80", "60", "40"],c:"2/3 de 120 = 80; 3/8 de 80 = 30."},
{id:"m1-35",n:2,e:"Com 9 litros de água, o número de garrafas de 3/4 de litro que se enchem é",a:["12", "6", "8", "10", "27/4"],c:"9 ÷ 3/4 = 9 × 4/3 = 12."},
{id:"m1-36",n:2,e:"O valor de (0,1)<sup>2</sup> + 0,9 é",a:["0,91", "1,0", "0,19", "0,29", "1,9"],c:"(0,1)<sup>2</sup> = 0,01. Então 0,01 + 0,9 = 0,91."},
{id:"m1-37",n:2,tx:"mt1a",e:"Considerando que o tanque estava cheio, o número de litros gastos nas duas semanas foi",a:["42,5", "40", "45", "42", "35"],c:"17/20 de 50 = 50 × 17 ÷ 20 = 42,5 litros."},
{id:"m1-38",n:2,tx:"mt1a",e:"Com o litro a R$ 6,40, o custo do combustível gasto nas duas semanas foi",a:["R$ 272,00", "R$ 256,00", "R$ 192,00", "R$ 280,00", "R$ 217,60"],c:"42,5 × 6,40 = 272,00."},
{id:"m1-39",n:2,tx:"mt1a",e:"Após a economia estimada pela Guarda, o gasto mensal passa a ser de",a:["R$ 17.000,00", "R$ 3.000,00", "R$ 19.985,00", "R$ 15.000,00", "R$ 18.500,00"],c:"Economia: 0,15 × 20.000 = 3.000. Novo gasto: 20.000 − 3.000 = 17.000."},
{id:"m1-40",n:2,tx:"mt1b",e:"De acordo com o texto, a distância percorrida pela equipe à tarde foi, em km,",a:["12,4", "9,3", "12,6", "13,2", "28"],c:"2/3 de 18,6 = 18,6 ÷ 3 × 2 = 6,2 × 2 = 12,4."},
{id:"m1-41",n:3,e:"O valor do produto (1 − 1/2)(1 − 1/3)(1 − 1/4)(1 − 1/5) é",a:["1/5", "1/120", "1/2", "24/120", "4/5"],c:"Cada parêntese é 1/2, 2/3, 3/4 e 4/5. O produto cancela em sequência: 1/2 × 2/3 × 3/4 × 4/5 = 1/5."},
{id:"m1-42",n:3,e:"O valor de 1 / (1/2 + 1/3) é",a:["6/5", "5/6", "2/5", "1/5", "5"],c:"1/2 + 1/3 = 5/6. O inverso de 5/6 é 6/5."},
{id:"m1-43",n:3,e:"O valor de (3/4 + 1/2) ÷ (5/8 − 1/4) é",a:["10/3", "15/32", "3/10", "2", "5/3"],c:"3/4 + 1/2 = 5/4 e 5/8 − 1/4 = 3/8. Então 5/4 ÷ 3/8 = 5/4 × 8/3 = 40/12 = 10/3."},
{id:"m1-44",n:3,e:"O valor de 0,1212... + 0,333... é",a:["5/11", "15/45", "1/2", "0,4545", "4/11"],c:"0,1212... = 12/99 = 4/33 e 0,333... = 1/3 = 11/33. A soma é 15/33 = 5/11."},
{id:"m1-45",n:3,e:"A fração geratriz de 1,2333... é",a:["37/30", "123/100", "12/9", "11/9", "111/90"],c:"A parte inteira entra à parte. Em 0,2333..., antiperíodo 2 e período 3: (23 − 2)/90 = 21/90 = 7/30. Somando 1: 37/30."},
{id:"m1-46",n:3,e:"O valor de (2<sup>−1</sup> + 3<sup>−1</sup>)<sup>−1</sup> é",a:["6/5", "5/6", "1/5", "5", "−5"],c:"2<sup>−1</sup> + 3<sup>−1</sup> = 1/2 + 1/3 = 5/6. O expoente −1 inverte: 6/5."},
{id:"m1-47",n:3,e:"O valor de 5√2 + 3√8 − √18 é",a:["8√2", "7√2", "5√8", "13√2", "8√28"],c:"√8 = 2√2 e √18 = 3√2. Então 5√2 + 6√2 − 3√2 = 8√2."},
{id:"m1-48",n:3,e:"O valor de √0,0144 é",a:["0,12", "0,012", "1,2", "0,0012", "0,144"],c:"0,12 × 0,12 = 0,0144."},
{id:"m1-49",n:3,e:"O valor de 8<sup>2/3</sup> é",a:["4", "16/3", "2", "64", "8/3"],c:"8<sup>2/3</sup> = (raiz cúbica de 8)<sup>2</sup> = 2<sup>2</sup> = 4."},
{id:"m1-50",n:3,e:"O valor de −2<sup>2</sup> + (−2)<sup>3</sup> − (−1)<sup>5</sup> é",a:["−11", "−13", "−9", "5", "−7"],c:"−2<sup>2</sup> = −4; (−2)<sup>3</sup> = −8; −(−1)<sup>5</sup> = −(−1) = +1. A soma é −4 − 8 + 1 = −11."},
{id:"m1-51",n:3,e:"Assinale a igualdade que é verdadeira.",a:["√(9 × 16) = √9 × √16", "√(9 + 16) = √9 + √16", "(−2)<sup>2</sup> = −4", "2<sup>−1</sup> = −2", "(2 + 3)<sup>2</sup> = 2<sup>2</sup> + 3<sup>2</sup>"],c:"A raiz distribui no produto: 12 = 3 × 4. Nas outras: √25 = 5, não 7; (−2)<sup>2</sup> = 4; 2<sup>−1</sup> = 1/2; (2 + 3)<sup>2</sup> = 25, não 13."},
{id:"m1-52",n:3,e:"O valor de (2<sup>7</sup> × 4<sup>2</sup>) ÷ 8<sup>3</sup> é",a:["4", "1", "2", "8", "16"],c:"Tudo na base 2: 2<sup>7</sup> × 2<sup>4</sup> ÷ 2<sup>9</sup> = 2<sup>7+4−9</sup> = 2<sup>2</sup> = 4."},
{id:"m1-53",n:3,e:"O valor de (1/2 + 1/3) ÷ (1/2 − 1/3) é",a:["5", "5/36", "1", "1/5", "6"],c:"1/2 + 1/3 = 5/6 e 1/2 − 1/3 = 1/6. Então 5/6 ÷ 1/6 = 5."},
{id:"m1-54",n:3,e:"Um tanque perdeu 1/3 do combustível na ida e, na volta, gastou 1/4 do que restava. A fração do tanque que sobrou foi",a:["1/2", "5/12", "7/12", "1/6", "2/3"],c:"Restou 2/3. Na volta gastou 1/4 de 2/3 = 1/6. Sobrou 2/3 − 1/6 = 4/6 − 1/6 = 3/6 = 1/2."},
{id:"m1-55",n:3,e:"Uma fita de 7,2 m é cortada em pedaços de 0,45 m. O número de pedaços obtidos é",a:["16", "15", "14", "18", "1,6"],c:"7,2 ÷ 0,45 = 720 ÷ 45 = 16."},
{id:"m1-56",n:3,e:"O valor da expressão 8 ÷ 2 × 4 − 3 é",a:["13", "−2", "1", "−1", "5"],c:"Divisão e multiplicação, da esquerda para a direita: 8 ÷ 2 = 4; 4 × 4 = 16. Depois 16 − 3 = 13."},
{id:"m1-57",n:3,e:"Os números 0,65; 2/3; 5/8 e 0,6, em ordem crescente, ficam",a:["0,6; 5/8; 0,65; 2/3", "5/8; 0,6; 0,65; 2/3", "0,6; 0,65; 5/8; 2/3", "2/3; 0,65; 5/8; 0,6", "5/8; 0,6; 2/3; 0,65"],c:"Em decimais: 0,6; 0,625; 0,65; 0,667."},
{id:"m1-58",n:3,e:"O valor de (√2)<sup>6</sup> é",a:["8", "12", "6", "2√2", "64"],c:"(√2)<sup>6</sup> = (2<sup>1/2</sup>)<sup>6</sup> = 2<sup>3</sup> = 8."},
{id:"m1-59",n:3,tx:"mt1a",e:"Se o tanque estava cheio no início da primeira semana, ao final da segunda semana restavam no tanque, em litros,",a:["7,5", "15", "12,5", "8", "10"],c:"Sobrou 1 − 17/20 = 3/20 do tanque. 3/20 de 50 = 7,5 litros."},
{id:"m1-60",n:3,tx:"mt1b",e:"Se o total percorrido pela equipe no dia, manhã e tarde, tivesse sido feito em 5 horas de deslocamento, a velocidade média seria, em km/h, de",a:["6,2", "3,72", "7,44", "6,0", "18,6"],c:"Total: 18,6 + 12,4 = 31 km. Em 5 horas, 31 ÷ 5 = 6,2 km/h."}
];

BANCO["mt-2"] = [
{id:"m2-01",n:1,e:"O máximo divisor comum de 12 e 18 é",a:["6", "3", "2", "36", "1"],c:"12 = 2<sup>2</sup> × 3 e 18 = 2 × 3<sup>2</sup>. Comuns: 2 e 3, com menor expoente. MDC = 6."},
{id:"m2-02",n:1,e:"O mínimo múltiplo comum de 4 e 6 é",a:["12", "2", "24", "10", "6"],c:"Múltiplos de 4: 4, 8, 12. Múltiplos de 6: 6, 12. O menor comum é 12."},
{id:"m2-03",n:1,e:"Entre os números abaixo, o único que é primo é",a:["29", "27", "33", "39", "51"],c:"27 = 3<sup>3</sup>; 33 = 3 × 11; 39 = 3 × 13; 51 = 3 × 17. Só o 29 tem exatamente dois divisores."},
{id:"m2-04",n:1,e:"A decomposição de 60 em fatores primos é",a:["2<sup>2</sup> × 3 × 5", "2 × 3 × 10", "4 × 15", "2 × 30", "2<sup>3</sup> × 3 × 5"],c:"60 ÷ 2 = 30; 30 ÷ 2 = 15; 15 ÷ 3 = 5; 5 ÷ 5 = 1. Logo 60 = 2<sup>2</sup> × 3 × 5."},
{id:"m2-05",n:1,e:"O número de divisores positivos de 12 é",a:["6", "4", "5", "12", "3"],c:"Divisores: 1, 2, 3, 4, 6 e 12. Pela fatoração 2<sup>2</sup> × 3: (2 + 1)(1 + 1) = 6."},
{id:"m2-06",n:1,e:"O mínimo múltiplo comum de 5 e 10 é",a:["10", "5", "15", "50", "2"],c:"10 já é múltiplo de 5. O MMC de um número e do seu múltiplo é o maior deles."},
{id:"m2-07",n:1,e:"Os números 8 e 15 são primos entre si porque",a:["o MDC entre eles é 1.", "ambos são primos.", "o MMC entre eles é 1.", "ambos são ímpares.", "ambos são múltiplos de 1 e de 3."],c:"Primos entre si são os que não têm fator comum além do 1. 8 = 2<sup>3</sup> e 15 = 3 × 5, e o MDC é 1. O 8 e o 15 não são primos."},
{id:"m2-08",n:1,e:"Entre os números abaixo, o divisível por 9 é",a:["4.527", "4.526", "4.525", "4.528", "4.529"],c:"Soma dos algarismos de 4.527: 4 + 5 + 2 + 7 = 18, múltiplo de 9."},
{id:"m2-09",n:1,e:"Entre 20 e 40, a quantidade de múltiplos de 7 é",a:["3", "2", "4", "5", "6"],c:"21, 28 e 35."},
{id:"m2-10",n:1,e:"O mínimo múltiplo comum de 3 e 5 é",a:["15", "8", "2", "1", "30"],c:"Primos entre si: o MMC é o produto, 3 × 5 = 15."},
{id:"m2-11",n:1,e:"O máximo divisor comum de 24 e 36 é",a:["12", "6", "24", "72", "4"],c:"24 = 2<sup>3</sup> × 3 e 36 = 2<sup>2</sup> × 3<sup>2</sup>. Comuns, menor expoente: 2<sup>2</sup> × 3 = 12."},
{id:"m2-12",n:1,e:"O mínimo múltiplo comum de 6 e 8 é",a:["24", "48", "2", "14", "12"],c:"6 = 2 × 3 e 8 = 2<sup>3</sup>. Maiores expoentes: 2<sup>3</sup> × 3 = 24."},
{id:"m2-13",n:1,e:"O máximo divisor comum de 18 e 27 é",a:["9", "3", "54", "6", "18"],c:"18 = 2 × 3<sup>2</sup> e 27 = 3<sup>3</sup>. Comum: 3<sup>2</sup> = 9."},
{id:"m2-14",n:1,e:"A decomposição de 84 em fatores primos é",a:["2<sup>2</sup> × 3 × 7", "2 × 3 × 14", "2<sup>3</sup> × 3 × 7", "4 × 21", "2 × 42"],c:"84 ÷ 2 = 42; 42 ÷ 2 = 21; 21 ÷ 3 = 7. Logo 84 = 2<sup>2</sup> × 3 × 7."},
{id:"m2-15",n:1,e:"O mínimo múltiplo comum de 2, 3 e 4 é",a:["12", "24", "9", "6", "4"],c:"2 = 2; 3 = 3; 4 = 2<sup>2</sup>. Maiores expoentes: 2<sup>2</sup> × 3 = 12."},
{id:"m2-16",n:1,e:"Um guarda passa por um ponto a cada 10 minutos e outro a cada 15 minutos. Passaram juntos às 8h. Passarão juntos novamente às",a:["8h30", "8h25", "8h10", "9h", "8h50"],c:"MMC(10, 15) = 30 minutos. 8h + 30 min = 8h30."},
{id:"m2-17",n:1,e:"Uma equipe tem 20 cones e 30 coletes para montar kits iguais, sem sobra, com o maior número possível de kits. O número de kits é",a:["10", "5", "2", "60", "15"],c:"Partes iguais, o maior possível: MDC(20, 30) = 10 kits."},
{id:"m2-18",n:1,e:"O número de divisores positivos de 7 é",a:["2", "1", "3", "7", "0"],c:"7 é primo: tem só o 1 e o 7."},
{id:"m2-19",n:1,tx:"mt2a",e:"De acordo com o texto, as equipes A e B passam juntas pelo portão pela primeira vez, depois da saída, após",a:["36 minutos.", "6 minutos.", "30 minutos.", "18 minutos.", "216 minutos."],c:"MMC(12, 18) = 36 minutos."},
{id:"m2-20",n:1,tx:"mt2b",e:"De acordo com o texto, o maior número possível de kits idênticos, sem sobras, é",a:["36", "12", "18", "24", "72"],c:"MDC(72, 108, 144): 72 = 2<sup>3</sup> × 3<sup>2</sup>, 108 = 2<sup>2</sup> × 3<sup>3</sup>, 144 = 2<sup>4</sup> × 3<sup>2</sup>. Comuns, menor expoente: 2<sup>2</sup> × 3<sup>2</sup> = 36."},
{id:"m2-21",n:2,e:"O mínimo múltiplo comum de 12, 15 e 20 é",a:["60", "30", "120", "180", "20"],c:"12 = 2<sup>2</sup> × 3; 15 = 3 × 5; 20 = 2<sup>2</sup> × 5. Maiores expoentes: 2<sup>2</sup> × 3 × 5 = 60."},
{id:"m2-22",n:2,e:"O máximo divisor comum de 48, 72 e 120 é",a:["24", "12", "8", "6", "48"],c:"48 = 2<sup>4</sup> × 3; 72 = 2<sup>3</sup> × 3<sup>2</sup>; 120 = 2<sup>3</sup> × 3 × 5. Comuns, menor expoente: 2<sup>3</sup> × 3 = 24."},
{id:"m2-23",n:2,e:"O MDC de dois números é 6 e o MMC é 60. Se um deles é 12, o outro é",a:["30", "20", "10", "36", "5"],c:"MDC × MMC = produto. 6 × 60 = 360, e 360 ÷ 12 = 30."},
{id:"m2-24",n:2,e:"O menor número natural, maior que 1, que dividido por 4, por 6 e por 9 deixa sempre resto 1 é",a:["37", "36", "35", "73", "13"],c:"O número menos 1 é múltiplo de 4, 6 e 9: MMC = 36. O número é 37."},
{id:"m2-25",n:2,e:"O maior número que divide 90 e 126 sem deixar resto é",a:["18", "9", "6", "3", "36"],c:"90 = 2 × 3<sup>2</sup> × 5 e 126 = 2 × 3<sup>2</sup> × 7. MDC = 2 × 3<sup>2</sup> = 18."},
{id:"m2-26",n:2,e:"O número de divisores positivos de 72 é",a:["12", "9", "8", "6", "24"],c:"72 = 2<sup>3</sup> × 3<sup>2</sup>. (3 + 1)(2 + 1) = 12."},
{id:"m2-27",n:2,e:"O menor número natural, diferente de zero, divisível por 2, 3, 4, 5 e 6 é",a:["60", "30", "120", "12", "360"],c:"Maiores expoentes: 2<sup>2</sup> (do 4), 3, 5. 4 × 3 × 5 = 60."},
{id:"m2-28",n:2,e:"O menor número natural diferente de zero que é, ao mesmo tempo, múltiplo de 12 e de 18 e um quadrado perfeito é",a:["36", "216", "72", "144", "18"],c:"MMC(12, 18) = 36 = 6<sup>2</sup>, já é quadrado perfeito."},
{id:"m2-29",n:2,e:"Um piso retangular de 3,6 m por 4,8 m será coberto com ladrilhos quadrados, todos iguais e inteiros, sem cortes e com o maior lado possível. O lado do ladrilho, em centímetros, é",a:["120", "60", "30", "240", "12"],c:"MDC(360, 480): 360 = 2<sup>3</sup> × 3<sup>2</sup> × 5 e 480 = 2<sup>5</sup> × 3 × 5. Comuns: 2<sup>3</sup> × 3 × 5 = 120."},
{id:"m2-30",n:2,e:"Dois relógios tocam, um a cada 45 minutos e outro a cada 60 minutos. Tocaram juntos às 6h. Tocarão juntos novamente às",a:["9h", "7h", "8h", "10h", "12h"],c:"MMC(45, 60) = 180 minutos = 3 horas. 6h + 3h = 9h."},
{id:"m2-31",n:2,e:"Três lâmpadas piscam, a primeira a cada 4 s, a segunda a cada 6 s e a terceira a cada 10 s. Se piscaram juntas num instante, voltarão a piscar juntas depois de",a:["60 s.", "20 s.", "30 s.", "120 s.", "24 s."],c:"MMC(4, 6, 10): 4 = 2<sup>2</sup>, 6 = 2 × 3, 10 = 2 × 5. Resultado 2<sup>2</sup> × 3 × 5 = 60 s."},
{id:"m2-32",n:2,e:"O valor de 2<sup>3</sup> × 3 × 5<sup>2</sup> é",a:["600", "120", "360", "300", "150"],c:"8 × 3 = 24 e 24 × 25 = 600."},
{id:"m2-33",n:2,e:"O número de divisores positivos de 100 é",a:["9", "4", "6", "10", "25"],c:"100 = 2<sup>2</sup> × 5<sup>2</sup>. (2 + 1)(2 + 1) = 9."},
{id:"m2-34",n:2,e:"O máximo divisor comum de 150 e 225 é",a:["75", "25", "15", "50", "45"],c:"150 = 2 × 3 × 5<sup>2</sup> e 225 = 3<sup>2</sup> × 5<sup>2</sup>. Comuns: 3 × 5<sup>2</sup> = 75."},
{id:"m2-35",n:2,e:"O menor número de pessoas com o qual se podem formar grupos de 6, de 8 ou de 10 pessoas, sem sobra em qualquer caso, é",a:["120", "24", "60", "240", "30"],c:"MMC(6, 8, 10): 2<sup>3</sup> × 3 × 5 = 120."},
{id:"m2-36",n:2,e:"O MDC entre 2<sup>3</sup> × 3<sup>2</sup> × 5 e 2<sup>2</sup> × 3<sup>3</sup> × 7 é",a:["2<sup>2</sup> × 3<sup>2</sup>", "2<sup>3</sup> × 3<sup>3</sup>", "2<sup>2</sup> × 3<sup>3</sup> × 5 × 7", "2 × 3", "2<sup>3</sup> × 3<sup>2</sup> × 5 × 7"],c:"No MDC, só fatores comuns, com menor expoente: 2<sup>2</sup> × 3<sup>2</sup> = 36."},
{id:"m2-37",n:2,e:"O MMC entre 2<sup>3</sup> × 3<sup>2</sup> × 5 e 2<sup>2</sup> × 3<sup>3</sup> × 7 é",a:["7.560", "36", "2.520", "3.780", "15.120"],c:"No MMC, todos os fatores com maior expoente: 2<sup>3</sup> × 3<sup>3</sup> × 5 × 7 = 8 × 27 × 35 = 7.560."},
{id:"m2-38",n:2,tx:"mt2a",e:"Depois da saída às 22h, as equipes A, B e C do texto passam juntas pelo portão pela primeira vez às",a:["1h.", "22h36.", "23h.", "23h30.", "0h."],c:"MMC(12, 18, 30) = 180 minutos = 3 horas. 22h + 3h = 1h."},
{id:"m2-39",n:2,tx:"mt2a",e:"Considerando o texto, entre a saída das 22h e as 1h, incluindo as 1h, o número de vezes em que as equipes A e B passam juntas pelo portão é",a:["5", "4", "6", "3", "15"],c:"A e B coincidem a cada 36 minutos: aos 36, 72, 108, 144 e 180 minutos. São 5 passagens conjuntas."},
{id:"m2-40",n:2,tx:"mt2b",e:"Segundo o texto, cada kit idêntico terá",a:["2 coletes, 3 lanternas e 4 apitos.", "3 coletes, 2 lanternas e 4 apitos.", "4 coletes, 6 lanternas e 8 apitos.", "1 colete, 3 lanternas e 4 apitos.", "36 coletes, 36 lanternas e 36 apitos."],c:"São 36 kits: 72 ÷ 36 = 2; 108 ÷ 36 = 3; 144 ÷ 36 = 4."},
{id:"m2-41",n:3,e:"O MDC de dois números é 12 e o MMC é 180. Se um deles é 36, o outro é",a:["60", "45", "90", "30", "15"],c:"MDC × MMC = produto: 12 × 180 = 2.160. 2.160 ÷ 36 = 60."},
{id:"m2-42",n:3,e:"O menor número natural que, dividido por 6, por 8 e por 12, deixa sempre resto 5 é",a:["29", "24", "19", "53", "47"],c:"O número menos 5 é múltiplo comum: MMC(6, 8, 12) = 24. O número é 24 + 5 = 29."},
{id:"m2-43",n:3,e:"O menor número natural que, dividido por 5, por 6 e por 7, deixa sempre resto 3 é",a:["213", "210", "207", "423", "63"],c:"5, 6 e 7 não têm fatores em comum dois a dois, então MMC(5, 6, 7) = 5 × 6 × 7 = 210. O número é 210 + 3 = 213."},
{id:"m2-44",n:3,e:"O maior número que, dividindo 200 e 250, deixa resto 8 e 10, respectivamente, é",a:["48", "24", "16", "12", "50"],c:"Se sobra 8 em 200, o divisor divide 192. Se sobra 10 em 250, divide 240. MDC(192, 240) = 48. Como 48 é maior que os restos 8 e 10, serve."},
{id:"m2-45",n:3,e:"O menor número natural pelo qual se deve multiplicar 12 para obter um quadrado perfeito é",a:["3", "2", "4", "6", "12"],c:"12 = 2<sup>2</sup> × 3. Falta um fator 3 para o expoente do 3 ficar par. 12 × 3 = 36 = 6<sup>2</sup>."},
{id:"m2-46",n:3,e:"O menor número natural pelo qual se deve multiplicar 90 para obter um cubo perfeito é",a:["300", "30", "900", "10", "60"],c:"90 = 2 × 3<sup>2</sup> × 5. Para ser cubo, todos os expoentes devem ser múltiplos de 3. Faltam 2<sup>2</sup>, 3 e 5<sup>2</sup>: 4 × 3 × 25 = 300, e 90 × 300 = 27.000 = 30<sup>3</sup>."},
{id:"m2-47",n:3,e:"Entre os divisores positivos de 360, o número dos que são ímpares é",a:["6", "12", "24", "3", "9"],c:"360 = 2<sup>3</sup> × 3<sup>2</sup> × 5. Divisores ímpares não levam o fator 2: (2 + 1)(1 + 1) = 6."},
{id:"m2-48",n:3,e:"O produto de dois números naturais é 1.296 e o MDC deles é 6. Então o MMC é",a:["216", "1.290", "7.776", "162", "432"],c:"MMC = produto ÷ MDC = 1.296 ÷ 6 = 216."},
{id:"m2-49",n:3,e:"Três ônibus saem às 6h de um terminal, com intervalos de 15, 20 e 24 minutos. Contando a saída das 6h, o número de vezes em que saem juntos até as 18h, inclusive, é",a:["7", "6", "8", "12", "5"],c:"MMC(15, 20, 24) = 120 minutos. Em 12 horas (720 minutos) há 6 intervalos, e com a saída inicial são 7 vezes."},
{id:"m2-50",n:3,e:"Duas engrenagens têm 18 e 30 dentes e giram acopladas. Partindo da posição em que dois dentes marcados estão em contato, elas voltam a essa posição quando a primeira tiver dado",a:["5 voltas e a segunda, 3.", "3 voltas e a segunda, 5.", "15 voltas e a segunda, 9.", "9 voltas e a segunda, 15.", "30 voltas e a segunda, 18."],c:"MMC(18, 30) = 90 dentes passados. Primeira: 90 ÷ 18 = 5 voltas. Segunda: 90 ÷ 30 = 3 voltas."},
{id:"m2-51",n:3,e:"Três cordas de 84 m, 126 m e 210 m serão cortadas em pedaços iguais, os maiores possíveis, sem sobra. O número total de pedaços é",a:["10", "7", "21", "5", "42"],c:"MDC(84, 126, 210) = 42 m. Pedaços: 84 ÷ 42 = 2, 126 ÷ 42 = 3, 210 ÷ 42 = 5. Total 10."},
{id:"m2-52",n:3,e:"A forma irredutível da fração 252/420 é",a:["3/5", "126/210", "6/10", "9/15", "21/35"],c:"MDC(252, 420) = 84. 252 ÷ 84 = 3 e 420 ÷ 84 = 5. As demais são equivalentes, porém não irredutíveis."},
{id:"m2-53",n:3,e:"O menor número natural que, dividido por 12, por 15 e por 20, deixa resto 7 em todos os casos é",a:["67", "60", "53", "127", "47"],c:"MMC(12, 15, 20) = 60. O número é 60 + 7 = 67."},
{id:"m2-54",n:3,e:"Entre 1 e 100, inclusive, o número de múltiplos comuns de 6 e de 8 é",a:["4", "3", "8", "12", "16"],c:"São os múltiplos de MMC(6, 8) = 24: 24, 48, 72 e 96."},
{id:"m2-55",n:3,e:"O valor de 1/12 + 1/18 + 1/30 é",a:["31/180", "3/60", "1/20", "1/10", "3/180"],c:"MMC(12, 18, 30) = 180. 15/180 + 10/180 + 6/180 = 31/180."},
{id:"m2-56",n:3,e:"O número de divisores positivos de 2<sup>4</sup> × 3<sup>2</sup> × 5 é",a:["30", "11", "15", "24", "45"],c:"(4 + 1)(2 + 1)(1 + 1) = 5 × 3 × 2 = 30."},
{id:"m2-57",n:3,e:"O MDC de dois números naturais é 15 e o MMC é 210. Se um deles é 30, o outro é",a:["105", "70", "90", "210", "45"],c:"MDC × MMC = produto: 15 × 210 = 3.150. 3.150 ÷ 30 = 105."},
{id:"m2-58",n:3,e:"Assinale a afirmação INCORRETA.",a:["O MDC de dois números naturais pode ser maior que o MMC deles.", "O MMC de dois números é divisível por cada um deles.", "O MDC de dois números primos entre si é 1.", "O MMC de um número e do seu dobro é o dobro desse número.", "O produto do MDC pelo MMC de dois números é igual ao produto dos dois números."],c:"O MDC nunca é maior que o MMC: o MDC divide o MMC. Todas as demais afirmações são verdadeiras."},
{id:"m2-59",n:3,tx:"mt2a",e:"No texto, quando as três equipes passam juntas pelo portão pela primeira vez, as equipes A, B e C terão completado, respectivamente,",a:["15, 10 e 6 voltas.", "6, 10 e 15 voltas.", "12, 18 e 30 voltas.", "15, 9 e 6 voltas.", "30, 20 e 12 voltas."],c:"Passam juntas aos 180 minutos. A: 180 ÷ 12 = 15. B: 180 ÷ 18 = 10. C: 180 ÷ 30 = 6."},
{id:"m2-60",n:3,tx:"mt2b",e:"Se a Secretaria do texto recebesse 180 apitos, em vez de 144, e mantivesse os 72 coletes e as 108 lanternas, montando de novo o maior número possível de kits idênticos, sem sobras, cada kit teria",a:["5 apitos.", "4 apitos.", "3 apitos.", "6 apitos.", "2 apitos."],c:"MDC(72, 108, 180) = 36, pois 180 = 2<sup>2</sup> × 3<sup>2</sup> × 5 mantém os fatores comuns 2<sup>2</sup> × 3<sup>2</sup>. São 36 kits, com 180 ÷ 36 = 5 apitos cada."}
];

BANCO["mt-3"] = [
{id:"m3-01",n:1,e:"O valor de 10% de 200 é",a:["20", "10", "2", "100", "180"],c:"10% é a décima parte: 200 ÷ 10 = 20."},
{id:"m3-02",n:1,e:"O valor de 25% de 80 é",a:["20", "25", "32", "40", "8"],c:"25% é a quarta parte: 80 ÷ 4 = 20."},
{id:"m3-03",n:1,e:"O número decimal 0,35, escrito como porcentagem, é",a:["35%", "3,5%", "0,35%", "350%", "3%"],c:"Multiplica-se por 100: 0,35 × 100 = 35%."},
{id:"m3-04",n:1,e:"A fração 3/4, escrita como porcentagem, é",a:["75%", "34%", "43%", "7,5%", "25%"],c:"3 ÷ 4 = 0,75 = 75%."},
{id:"m3-05",n:1,e:"O valor de 20% de 300 é",a:["60", "6", "20", "600", "150"],c:"0,20 × 300 = 60."},

{id:"m3-09",n:1,e:"O valor de 5% de 400 é",a:["20", "5", "40", "80", "2"],c:"10% de 400 é 40, então 5% é a metade: 20."},

{id:"m3-11",n:1,e:"O fator multiplicador de um desconto de 15% é",a:["0,85", "1,15", "0,15", "1,5", "0,015"],c:"100% − 15% = 85% = 0,85."},
{id:"m3-12",n:1,e:"Um guarda recebe R$ 3.000,00 e terá aumento de 5%. O novo salário será",a:["R$ 3.150,00", "R$ 3.015,00", "R$ 3.050,00", "R$ 3.500,00", "R$ 3.105,00"],c:"3.000 × 1,05 = 3.150."},
{id:"m3-13",n:1,e:"Em uma turma de 40 candidatos, 60% são mulheres. O número de mulheres é",a:["24", "16", "20", "60", "40"],c:"0,60 × 40 = 24."},
{id:"m3-14",n:1,e:"A porcentagem 12%, escrita como número decimal, é",a:["0,12", "1,2", "0,012", "12", "0,0012"],c:"12 ÷ 100 = 0,12."},
{id:"m3-15",n:1,e:"O valor de 1% de 2.500 é",a:["25", "250", "2,5", "0,25", "1"],c:"2.500 ÷ 100 = 25."},
{id:"m3-16",n:1,e:"O valor de 150% de 40 é",a:["60", "6", "15", "150", "40"],c:"1,5 × 40 = 60."},
{id:"m3-17",n:1,e:"Um produto de R$ 200,00 recebeu desconto de 10%. O valor a pagar é",a:["R$ 180,00", "R$ 190,00", "R$ 20,00", "R$ 220,00", "R$ 100,00"],c:"200 × 0,90 = 180."},
{id:"m3-18",n:1,e:"O número 8 corresponde a quantos por cento de 32?",a:["25%", "4%", "40%", "8%", "256%"],c:"8 ÷ 32 = 0,25 = 25%."},
{id:"m3-19",n:1,tx:"mt3a",e:"Segundo o texto, os 20% de queda dos furtos no segundo semestre correspondem, em ocorrências, a",a:["50", "25", "20", "200", "75"],c:"20% de 250 = 0,20 × 250 = 50."},
{id:"m3-20",n:1,tx:"mt3a",e:"De acordo com o texto, o número de furtos de bicicleta no segundo semestre foi",a:["200", "230", "50", "275", "220"],c:"O fator da queda de 20% é 0,80: 250 × 0,80 = 200."},
{id:"m3-21",n:2,e:"Depois de um aumento de 25%, um produto custa R$ 150,00. O preço antes do aumento era",a:["R$ 120,00", "R$ 112,50", "R$ 125,00", "R$ 130,00", "R$ 187,50"],c:"150 ÷ 1,25 = 120."},
{id:"m3-22",n:2,e:"Depois de um desconto de 20%, um produto foi vendido por R$ 144,00. O preço original era",a:["R$ 180,00", "R$ 172,80", "R$ 164,00", "R$ 160,00", "R$ 115,20"],c:"144 ÷ 0,80 = 180."},
{id:"m3-23",n:2,e:"Um aumento de 20% seguido de um desconto de 20% resulta em",a:["queda de 4%.", "manutenção do valor.", "aumento de 4%.", "queda de 2%.", "aumento de 2%."],c:"1,20 × 0,80 = 0,96, ou seja, 96% do original: queda de 4%."},
{id:"m3-24",n:2,e:"Dois descontos sucessivos, de 10% e de 20%, equivalem a um desconto único de",a:["28%", "30%", "32%", "27%", "18%"],c:"0,90 × 0,80 = 0,72. Desconto de 1 − 0,72 = 28%."},
{id:"m3-25",n:2,e:"Dois aumentos sucessivos de 10% equivalem a um aumento único de",a:["21%", "20%", "11%", "10,5%", "22%"],c:"1,10 × 1,10 = 1,21: aumento de 21%."},
{id:"m3-26",n:2,e:"Um salário de R$ 2.400,00 teve aumento de 15% e, depois, de 10%. O salário final é",a:["R$ 3.036,00", "R$ 3.000,00", "R$ 3.024,00", "R$ 2.760,00", "R$ 3.060,00"],c:"2.400 × 1,15 = 2.760; 2.760 × 1,10 = 3.036."},
{id:"m3-27",n:2,e:"Um valor passou de 80 para 100. O aumento percentual foi de",a:["25%", "20%", "80%", "125%", "10%"],c:"A base é o valor inicial: (100 − 80) ÷ 80 = 0,25."},
{id:"m3-28",n:2,e:"Um valor passou de 100 para 80. A variação percentual foi de",a:["queda de 20%.", "queda de 25%.", "aumento de 20%.", "queda de 80%.", "queda de 10%."],c:"(80 − 100) ÷ 100 = −0,20."},
{id:"m3-29",n:2,e:"Em uma prova de 50 questões, um candidato acertou 38. O percentual de acertos foi",a:["76%", "38%", "12%", "19%", "88%"],c:"38 ÷ 50 = 0,76."},
{id:"m3-30",n:2,e:"A população de um bairro passou de 8.000 para 9.200 habitantes. O crescimento percentual foi de",a:["15%", "12%", "13%", "20%", "1.200%"],c:"Aumento de 1.200 sobre a base de 8.000: 1.200 ÷ 8.000 = 0,15."},
{id:"m3-31",n:2,e:"Após um aumento de 20%, um produto custa R$ 360,00. O preço anterior era",a:["R$ 300,00", "R$ 288,00", "R$ 320,00", "R$ 340,00", "R$ 432,00"],c:"360 ÷ 1,20 = 300."},
{id:"m3-32",n:2,e:"A taxa de aprovação de um curso passou de 40% para 55%. Essa mudança corresponde a um aumento de",a:["15 pontos percentuais.", "15%.", "37,5 pontos percentuais.", "27,5%.", "55 pontos percentuais."],c:"A diferença das taxas é 15 pontos percentuais. Em termos relativos, seriam 37,5%, mas a alternativa exata é a que diz “pontos”."},
{id:"m3-33",n:2,e:"Uma loja dá 15% de desconto no pagamento à vista. Um item de R$ 640,00 sai à vista por",a:["R$ 544,00", "R$ 96,00", "R$ 625,00", "R$ 576,00", "R$ 736,00"],c:"640 × 0,85 = 544."},
{id:"m3-34",n:2,e:"O valor de 20% de 30% de 500 é",a:["30", "100", "150", "75", "300"],c:"30% de 500 = 150; 20% de 150 = 30. Os fatores se multiplicam: 0,20 × 0,30 = 0,06, e 0,06 × 500 = 30."},
{id:"m3-35",n:2,e:"Se 35% de um número é 70, esse número é",a:["200", "24,5", "245", "105", "35"],c:"O todo é parte ÷ taxa: 70 ÷ 0,35 = 200."},
{id:"m3-36",n:2,e:"Um valor de R$ 250,00 recebeu acréscimo de 8%. O valor final é",a:["R$ 270,00", "R$ 258,00", "R$ 252,00", "R$ 280,00", "R$ 200,00"],c:"250 × 1,08 = 270."},
{id:"m3-37",n:2,e:"Em um grupo de 60 guardas, 45% são mulheres. O número de homens é",a:["33", "27", "45", "15", "30"],c:"Homens são 55%: 0,55 × 60 = 33."},
{id:"m3-38",n:2,tx:"mt3a",e:"Segundo o texto, no terceiro semestre o número de furtos de bicicleta foi de",a:["220", "225", "230", "210", "240"],c:"Fator 1,10 sobre o semestre anterior: 200 × 1,10 = 220."},
{id:"m3-39",n:2,tx:"mt3a",e:"Segundo o texto, as bicicletas recuperadas entre as furtadas no primeiro semestre foram",a:["75", "30", "50", "175", "25"],c:"30% de 250 = 0,30 × 250 = 75."},
{id:"m3-40",n:2,tx:"mt3b",e:"De acordo com o texto, o preço de cada camisa no fornecedor A, já com o desconto, é de",a:["R$ 68,00", "R$ 65,00", "R$ 12,00", "R$ 70,00", "R$ 72,00"],c:"80 × 0,85 = 68. Como a compra é de 200 unidades (acima de 150), vale o desconto."},
{id:"m3-41",n:3,e:"Depois de um aumento de 25%, que desconto deve ser aplicado para o preço voltar ao valor original?",a:["20%", "25%", "15%", "30%", "12,5%"],c:"Fator do aumento 1,25. Para voltar a 1, é preciso multiplicar por 1 ÷ 1,25 = 0,80, um desconto de 20%."},
{id:"m3-42",n:3,e:"Depois de um desconto de 20%, que aumento deve ser aplicado para o preço voltar ao valor original?",a:["25%", "20%", "15%", "30%", "80%"],c:"Fator 0,80. Para voltar a 1: 1 ÷ 0,80 = 1,25, um aumento de 25%."},
{id:"m3-43",n:3,e:"Três descontos sucessivos de 10% equivalem a um desconto único de",a:["27,1%", "30%", "29%", "27%", "33,1%"],c:"0,90<sup>3</sup> = 0,729. Desconto de 1 − 0,729 = 0,271, ou 27,1%."},
{id:"m3-44",n:3,e:"Um produto teve aumento de 30% e, depois, desconto de 30%. Em relação ao preço original, o preço final é",a:["9% menor.", "igual.", "9% maior.", "30% menor.", "3% menor."],c:"1,30 × 0,70 = 0,91. O preço final é 91% do original: queda de 9%."},
{id:"m3-45",n:3,e:"Um salário teve dois aumentos sucessivos de 20% cada e hoje é de R$ 3.600,00. O salário antes dos dois aumentos era",a:["R$ 2.500,00", "R$ 2.571,43", "R$ 2.592,00", "R$ 3.000,00", "R$ 2.160,00"],c:"O fator total é 1,20 × 1,20 = 1,44. Salário original = 3.600 ÷ 1,44 = 2.500."},
{id:"m3-46",n:3,e:"Um valor que cresce 10% ao mês, sempre sobre o valor do mês anterior, terá crescido, depois de 3 meses, um total de",a:["33,1%", "30%", "31%", "33%", "36,3%"],c:"1,10<sup>3</sup> = 1,331: aumento total de 33,1%."},
{id:"m3-47",n:3,e:"Em uma sala, 40% dos candidatos são mulheres. Saindo 10 homens, as mulheres passam a ser 50% dos presentes. O número inicial de candidatos era",a:["50", "40", "60", "100", "80"],c:"Com N candidatos: 0,4N = 0,6N − 10, logo 0,2N = 10 e N = 50."},
{id:"m3-48",n:3,e:"Uma mercadoria foi vendida por R$ 96,00, com lucro de 20% sobre o preço de custo. O custo foi de",a:["R$ 80,00", "R$ 76,80", "R$ 72,00", "R$ 115,20", "R$ 84,00"],c:"Preço de venda = 1,20 × custo. Custo = 96 ÷ 1,20 = 80."},
{id:"m3-49",n:3,e:"Um produto custava R$ 200,00, teve aumento de 10% e, em seguida, desconto de 10%. O preço final é",a:["R$ 198,00", "R$ 200,00", "R$ 202,00", "R$ 180,00", "R$ 220,00"],c:"200 × 1,10 = 220; 220 × 0,90 = 198."},
{id:"m3-50",n:3,e:"Sobre um salário bruto de R$ 5.000,00 incidem descontos de 11% e de 7,5%, ambos calculados sobre o valor bruto. O salário líquido é",a:["R$ 4.075,00", "R$ 4.050,00", "R$ 4.162,50", "R$ 4.100,00", "R$ 4.000,00"],c:"Descontos somados: 18,5% do bruto. 5.000 × (1 − 0,185) = 4.075. Aqui os percentuais se somam porque têm a mesma base, o salário bruto."},
{id:"m3-51",n:3,e:"Um reservatório perde por evaporação 20% da água que tem no início de cada semana. Depois de duas semanas, a água restante é",a:["64% do volume inicial.", "60% do volume inicial.", "80% do volume inicial.", "40% do volume inicial.", "66% do volume inicial."],c:"0,80 × 0,80 = 0,64."},
{id:"m3-52",n:3,e:"Se A é 20% maior que B, então B é, em relação a A, aproximadamente",a:["16,7% menor.", "20% menor.", "16% menor.", "25% menor.", "17,5% menor."],c:"A = 1,2B. B = A ÷ 1,2 = 0,8333A, ou seja, B vale cerca de 83,3% de A, 16,7% menor."},
{id:"m3-53",n:3,e:"Misturam-se 40 litros de uma solução com 30% de álcool e 60 litros de outra com 20% de álcool. A concentração da mistura é",a:["24%", "25%", "20%", "26%", "22,5%"],c:"Álcool: 0,30 × 40 + 0,20 × 60 = 12 + 12 = 24 litros em 100 litros: 24%. A média simples, 25%, ignora as quantidades."},
{id:"m3-54",n:3,e:"Um item foi comprado por R$ 120,00, com 20% de desconto sobre o preço de tabela. O preço de tabela era",a:["R$ 150,00", "R$ 144,00", "R$ 140,00", "R$ 96,00", "R$ 160,00"],c:"120 = 0,80 × tabela. Tabela = 120 ÷ 0,80 = 150."},
{id:"m3-55",n:3,e:"As vendas de uma loja subiram 20% em um mês e caíram 25% no mês seguinte. No conjunto dos dois meses, as vendas",a:["caíram 10%.", "caíram 5%.", "subiram 5%.", "ficaram iguais.", "caíram 4%."],c:"1,20 × 0,75 = 0,90. Queda de 10%."},
{id:"m3-56",n:3,e:"O preço de um produto foi reduzido em 10% e, depois, aumentado em x%, ficando 8% acima do preço original. O valor de x é",a:["20%", "18%", "19%", "16%", "17,5%"],c:"Fatores: 0,90 × (1 + x) = 1,08. Então 1 + x = 1,08 ÷ 0,90 = 1,20, e x = 20%."},
{id:"m3-57",n:3,tx:"mt3a",e:"Segundo o texto, em relação ao número de furtos do primeiro semestre, o do terceiro semestre foi",a:["12% menor.", "10% menor.", "12% maior.", "8% menor.", "10% maior."],c:"220 ÷ 250 = 0,88. Queda de 12%. Os 20% de queda e os 10% de alta não se compensam."},
{id:"m3-58",n:3,tx:"mt3a",e:"Se, no quarto semestre, os furtos caíssem 25% em relação ao terceiro, a variação total, do primeiro ao quarto semestre, seria de",a:["queda de 34%.", "queda de 35%.", "queda de 33%.", "queda de 25%.", "queda de 20%."],c:"Fatores: 0,80 × 1,10 × 0,75 = 0,66. Queda de 34%. Em números: 250 → 200 → 220 → 165."},
{id:"m3-59",n:3,tx:"mt3b",e:"Segundo o texto, os dois descontos sucessivos do fornecedor B equivalem a um desconto único de",a:["14,5%", "15%", "5%", "10%", "14%"],c:"0,90 × 0,95 = 0,855. Desconto de 1 − 0,855 = 14,5%."},
{id:"m3-60",n:3,tx:"mt3b",e:"Segundo o texto, ao comprar as 200 camisas, o fornecedor B resulta em um valor total",a:["R$ 775,00 menor que o do fornecedor A.", "R$ 775,00 maior que o do fornecedor A.", "R$ 1.000,00 menor que o do fornecedor A.", "igual ao do fornecedor A.", "R$ 200,00 menor que o do fornecedor A."],c:"A: 200 × 68 = 13.600. B: 75 × 0,90 × 0,95 = 64,125 por camisa; 200 × 64,125 = 12.825. Diferença: 13.600 − 12.825 = 775."}
];

BANCO["mt-4"] = [
{id:"m4-01",n:1,e:"A razão entre 15 e 25, na forma irredutível, é",a:["3/5", "5/3", "15/10", "3/25", "1/10"],c:"15/25 = 3/5 (divisão por 5)."},
{id:"m4-02",n:1,e:"O valor de x na proporção 3/4 = x/20 é",a:["15", "12", "16", "5", "80/3"],c:"Meios e extremos: 4x = 3 × 20 = 60, logo x = 15."},
{id:"m4-03",n:1,e:"Em um desenho de escala 1:100, um comprimento de 5 cm representa, na realidade,",a:["5 m", "50 cm", "500 m", "0,5 m", "50 m"],c:"5 × 100 = 500 cm = 5 m."},
{id:"m4-04",n:1,e:"Uma viatura percorre 120 km em 2 horas. A velocidade média é",a:["60 km/h", "240 km/h", "120 km/h", "30 km/h", "6 km/h"],c:"Razão distância/tempo: 120 ÷ 2 = 60 km/h."},
{id:"m4-05",n:1,e:"Oito canetas custam R$ 24,00. Dezesseis canetas, mesmo preço unitário, custam",a:["R$ 48,00", "R$ 12,00", "R$ 32,00", "R$ 36,00", "R$ 40,00"],c:"Grandezas diretas: dobra a quantidade, dobra o preço."},
{id:"m4-06",n:1,e:"Quatro guardas fazem um trabalho em 6 horas. Oito guardas, no mesmo ritmo, fazem em",a:["3 horas", "12 horas", "24 horas", "2 horas", "4 horas"],c:"Inversa: o dobro de guardas leva à metade do tempo."},
{id:"m4-07",n:1,e:"Dividir 100 em partes diretamente proporcionais a 1 e 4 resulta em",a:["20 e 80", "25 e 75", "10 e 40", "50 e 50", "40 e 60"],c:"Soma 5; 100 ÷ 5 = 20. Partes 20 e 80."},
{id:"m4-08",n:1,e:"A razão entre 40 minutos e 2 horas é",a:["1/3", "1/20", "20", "3", "2/3"],c:"2 h = 120 min. 40/120 = 1/3."},
{id:"m4-09",n:1,e:"O valor de x na proporção 5/x = 10/4 é",a:["2", "8", "5", "12,5", "0,5"],c:"10x = 20, x = 2."},
{id:"m4-10",n:1,e:"A razão entre 3 km e 500 m é",a:["6", "3/500", "1/6", "0,6", "600"],c:"3 km = 3.000 m. 3.000 ÷ 500 = 6."},
{id:"m4-11",n:1,e:"O valor de x na proporção x/6 = 10/15 é",a:["4", "9", "25", "15", "2,5"],c:"15x = 60, x = 4."},
{id:"m4-12",n:1,e:"Em um grupo há 12 homens e 18 mulheres. A razão entre o número de homens e o total é",a:["2/5", "2/3", "3/5", "4/9", "3/2"],c:"Total 30. 12/30 = 2/5."},
{id:"m4-13",n:1,e:"Duas grandezas são inversamente proporcionais quando",a:["o produto entre elas é constante.", "a razão entre elas é constante.", "a soma entre elas é constante.", "a diferença entre elas é constante.", "ambas crescem na mesma proporção."],c:"Dobrando uma, a outra cai pela metade: o produto se mantém."},
{id:"m4-14",n:1,e:"A razão entre 20 e 80, escrita como porcentagem, é",a:["25%", "20%", "4%", "40%", "16%"],c:"20/80 = 1/4 = 25%."},
{id:"m4-15",n:1,e:"Uma receita usa 2 copos de A para 3 copos de B. Com 12 copos de A, serão necessários de B",a:["18 copos", "8 copos", "12 copos", "24 copos", "15 copos"],c:"2/3 = 12/x, 2x = 36, x = 18."},
{id:"m4-16",n:1,e:"Em um mapa de escala 1:50.000, 3 cm representam",a:["1,5 km", "15 km", "150 m", "3 km", "0,5 km"],c:"1 cm = 500 m; 3 cm = 1.500 m."},
{id:"m4-17",n:1,e:"Dividir 90 em partes diretamente proporcionais a 2 e 3 resulta em",a:["36 e 54", "30 e 60", "45 e 45", "40 e 50", "18 e 72"],c:"Soma 5; 90 ÷ 5 = 18. Partes 36 e 54."},
{id:"m4-18",n:1,e:"A razão entre 7 e 21 é",a:["1/3", "3", "7/3", "1/7", "2/3"],c:"7/21 = 1/3."},
{id:"m4-19",n:1,tx:"mt4a",e:"No texto da gratificação, a soma das ocorrências atendidas pelos três guardas é",a:["20", "12", "15", "18", "25"],c:"5 + 7 + 8 = 20."},
{id:"m4-20",n:1,tx:"mt4b",e:"Segundo o texto, o trajeto de 6 cm no mapa 1:50.000 mede, na realidade,",a:["3 km", "30 km", "300 m", "6 km", "0,3 km"],c:"6 × 500 m = 3.000 m = 3 km."},
{id:"m4-21",n:2,e:"Dividir R$ 12.000,00 em partes proporcionais a 5, 7 e 8 dá ao terceiro",a:["R$ 4.800,00", "R$ 4.000,00", "R$ 3.000,00", "R$ 4.200,00", "R$ 5.600,00"],c:"Soma 20; 12.000 ÷ 20 = 600. Terceiro: 8 × 600 = 4.800."},
{id:"m4-22",n:2,e:"Quatro guardas vistoriam um prédio em 6 horas. Seis guardas, no mesmo ritmo, fariam em",a:["4 horas", "9 horas", "3 horas", "5 horas", "8 horas"],c:"4 × 6 = 24 e 24 ÷ 6 = 4."},
{id:"m4-23",n:2,e:"Em um mapa 1:25.000, 8 cm correspondem a",a:["2 km", "200 m", "20 km", "3,2 km", "2,5 km"],c:"8 × 250 m = 2.000 m."},
{id:"m4-24",n:2,e:"Dividir 130 em partes inversamente proporcionais a 2 e 3 dá",a:["78 e 52", "52 e 78", "65 e 65", "80 e 50", "60 e 70"],c:"Inversos 1/2 e 1/3: razões 3 e 2. 130 ÷ 5 = 26. Partes 78 e 52."},
{id:"m4-25",n:2,e:"Um carro faz 12 km por litro. Para percorrer 150 km, são necessários",a:["12,5 litros", "15 litros", "10 litros", "18 litros", "8 litros"],c:"Direta: 150 ÷ 12 = 12,5 litros."},
{id:"m4-26",n:2,e:"Uma viatura a 60 km/h faz um trajeto em 40 minutos. A 80 km/h, fará o mesmo trajeto em",a:["30 minutos", "53 minutos", "45 minutos", "20 minutos", "35 minutos"],c:"Velocidade e tempo são inversos: 60 × 40 = 80 × t, t = 30."},
{id:"m4-27",n:2,e:"Se a razão entre dois números é 3/5 e sua soma é 40, o maior deles é",a:["25", "15", "24", "30", "20"],c:"Soma das razões 3 + 5 = 8; 40 ÷ 8 = 5. Maior: 5 × 5 = 25."},
{id:"m4-28",n:2,e:"Uma planta tem escala 1:200. Um muro de 12 m aparece na planta com",a:["6 cm", "60 cm", "1,2 cm", "24 cm", "12 cm"],c:"12 m = 1.200 cm. 1.200 ÷ 200 = 6 cm."},
{id:"m4-29",n:2,e:"Se x/y = 3/4 e x + y = 56, então x vale",a:["24", "32", "21", "28", "18"],c:"3 + 4 = 7; 56 ÷ 7 = 8. x = 3 × 8 = 24."},
{id:"m4-30",n:2,e:"Dez operários constroem um muro em 12 dias. Em quantos dias 15 operários, no mesmo ritmo, constroem o mesmo muro?",a:["8", "18", "6", "10", "9"],c:"Inversa: 10 × 12 = 120; 120 ÷ 15 = 8."},
{id:"m4-31",n:2,e:"Três quilos de tinta cobrem 45 m². Cinco quilos, mantido o rendimento, cobrem",a:["75 m²", "27 m²", "60 m²", "90 m²", "15 m²"],c:"Direta: 45 ÷ 3 = 15 m² por quilo; 5 × 15 = 75."},
{id:"m4-32",n:2,e:"Assinale as grandezas diretamente proporcionais.",a:["Quantidade de combustível e distância percorrida, com consumo constante.", "Número de guardas e tempo para concluir uma tarefa.", "Velocidade e tempo para uma mesma distância.", "Idade e altura de uma pessoa.", "Número de torneiras e tempo para encher um tanque."],c:"Distância cresce na proporção do combustível. As demais são inversas ou não proporcionais."},
{id:"m4-33",n:2,e:"Um prêmio de R$ 1.800,00 é dividido proporcionalmente a 4 e 5 anos de serviço. Quem tem 5 anos recebe",a:["R$ 1.000,00", "R$ 800,00", "R$ 900,00", "R$ 1.080,00", "R$ 720,00"],c:"9 partes, R$ 200,00 cada. 5 × 200 = 1.000."},
{id:"m4-34",n:2,e:"A razão entre a idade de um pai e a do filho é 5/2. Se o pai tem 40 anos, o filho tem",a:["16", "20", "8", "100", "25"],c:"40/x = 5/2, x = 16."},
{id:"m4-35",n:2,e:"Em uma maquete de escala 1:500, um prédio tem 8 cm de altura. A altura real é",a:["40 m", "4 m", "400 m", "5 m", "16 m"],c:"8 × 500 = 4.000 cm = 40 m."},
{id:"m4-36",n:2,e:"Dividir 220 em partes proporcionais a 3, 4 e 4 dá à menor parte",a:["60", "80", "55", "40", "44"],c:"Soma 11; 220 ÷ 11 = 20. Menor: 3 × 20 = 60."},
{id:"m4-37",n:2,e:"Uma torneira enche um tanque em 6 horas. Duas torneiras idênticas, juntas, enchem em",a:["3 horas", "12 horas", "4 horas", "2 horas", "8 horas"],c:"Inversa: dobro de torneiras, metade do tempo."},
{id:"m4-38",n:2,tx:"mt4a",e:"No texto da gratificação, Ana receberá",a:["R$ 3.000,00", "R$ 2.400,00", "R$ 4.200,00", "R$ 3.600,00", "R$ 2.000,00"],c:"12.000 ÷ 20 = 600; 5 × 600 = 3.000."},
{id:"m4-39",n:2,tx:"mt4b",e:"Pelo texto, a velocidade da viatura na ronda de reforço, em relação à da ronda original, deve ser",a:["1,5 vez maior.", "2 vezes maior.", "igual.", "0,5 vez maior.", "3 vezes maior."],c:"Tempo inverso da velocidade: 30 ÷ 20 = 1,5."},
{id:"m4-40",n:2,tx:"mt4b",e:"Considerando o texto, a velocidade da ronda original é de",a:["6 km/h", "3 km/h", "12 km/h", "1,5 km/h", "18 km/h"],c:"3 km em 30 min = 3 km em 0,5 h: 6 km/h."},
{id:"m4-41",n:3,e:"Dividir 120 em partes inversamente proporcionais a 2, 3 e 6 dá à maior parte",a:["60", "20", "40", "30", "36"],c:"Inversos 1/2, 1/3 e 1/6 = 3/6, 2/6 e 1/6: razões 3, 2 e 1. Soma 6; 120 ÷ 6 = 20. Maior parte: 3 × 20 = 60."},
{id:"m4-42",n:3,e:"Se 5 máquinas produzem 200 peças em 8 horas, 8 máquinas, no mesmo ritmo, produzem em 5 horas",a:["200 peças", "125 peças", "320 peças", "160 peças", "250 peças"],c:"Produção por máquina-hora: 200 ÷ 40 = 5. 8 × 5 × 5 = 200."},
{id:"m4-43",n:3,e:"A razão entre dois números é 3/7 e a diferença entre eles é 24. O maior número é",a:["42", "18", "56", "63", "30"],c:"7 − 3 = 4; 24 ÷ 4 = 6. Maior: 7 × 6 = 42."},
{id:"m4-44",n:3,e:"Um mapa tem escala 1:40.000. Uma praça quadrada, de 1,6 km de lado, aparece no mapa com lado de",a:["4 cm", "2,5 cm", "40 cm", "16 cm", "0,4 cm"],c:"1,6 km = 160.000 cm. 160.000 ÷ 40.000 = 4 cm."},
{id:"m4-45",n:3,e:"Três sócios investiram R$ 2.000,00, R$ 3.000,00 e R$ 5.000,00 e dividiram o lucro proporcionalmente. Se o primeiro recebeu R$ 600,00, o lucro total foi de",a:["R$ 3.000,00", "R$ 2.400,00", "R$ 6.000,00", "R$ 1.800,00", "R$ 5.000,00"],c:"Razão 2:3:5, soma 10. O primeiro tem 2/10 do lucro. 600 ÷ (2/10) = 3.000."},
{id:"m4-46",n:3,e:"Se A é diretamente proporcional a B e A = 12 quando B = 8, então A, quando B = 20, vale",a:["30", "25", "32", "24", "15"],c:"A/B = 12/8 = 1,5. A = 1,5 × 20 = 30."},
{id:"m4-47",n:3,e:"Se A é inversamente proporcional a B e A = 12 quando B = 8, então A, quando B = 16, vale",a:["6", "24", "12", "3", "4"],c:"Produto constante: 12 × 8 = 96. A = 96 ÷ 16 = 6."},
{id:"m4-48",n:3,e:"A razão entre o número de homens e o de mulheres de um grupo é 3/5. Se há 12 pessoas a mais de mulheres, o total de pessoas é",a:["48", "30", "60", "36", "72"],c:"5 − 3 = 2 partes valem 12; cada parte 6. Total 8 partes = 48."},
{id:"m4-49",n:3,e:"Uma tinta é feita misturando A e B na razão 2 para 5. Para fazer 28 litros, são necessários de A",a:["8 litros", "10 litros", "12 litros", "14 litros", "20 litros"],c:"Soma 7 partes; 28 ÷ 7 = 4. A: 2 × 4 = 8."},
{id:"m4-50",n:3,e:"Se x/3 = y/5 = z/7 e x + y + z = 90, então z vale",a:["42", "18", "30", "35", "27"],c:"Soma das razões 15; 90 ÷ 15 = 6. z = 7 × 6 = 42."},
{id:"m4-51",n:3,e:"Em uma proporção, os extremos são 6 e 20 e um dos meios é 8. O outro meio é",a:["15", "16", "12", "10", "24"],c:"Meios × meios = extremos: 8 × m = 6 × 20 = 120, m = 15."},
{id:"m4-52",n:3,e:"Quatro guardas, trabalhando 6 horas por dia, concluem uma vistoria em 5 dias. Seis guardas, 4 horas por dia, concluem em",a:["5 dias", "4 dias", "6 dias", "3 dias", "10 dias"],c:"Trabalho total: 4 × 6 × 5 = 120 guarda-horas. 6 × 4 = 24 por dia; 120 ÷ 24 = 5."},
{id:"m4-53",n:3,e:"A idade de A está para a de B como 3 está para 4. Daqui a 10 anos, a soma das idades será 90. A idade atual de A é",a:["30", "24", "40", "45", "20"],c:"Soma atual 70, razões 3 e 4, constante 10. A tem 30."},
{id:"m4-54",n:3,e:"Dois números estão na razão 4/9. Se o menor aumenta em 10 unidades, ficam iguais. O maior é",a:["18", "8", "20", "36", "12"],c:"9k − 4k = 10 → 5k = 10, k = 2. Maior 18."},
{id:"m4-55",n:3,e:"Um prêmio é dividido em partes inversamente proporcionais ao número de faltas de dois guardas, que tiveram 2 e 6 faltas. Quem faltou 2 vezes recebe, do total,",a:["3/4", "1/4", "2/3", "1/3", "1/2"],c:"Inversos 1/2 e 1/6 = 3/6 e 1/6. O primeiro fica com 3/4."},
{id:"m4-56",n:3,tx:"mt4b",e:"Segundo o texto, o trajeto de 6 cm será feito na ronda de reforço a uma velocidade de",a:["9 km/h", "6 km/h", "3 km/h", "12 km/h", "4,5 km/h"],c:"3 km em 20 min = 3 km em 1/3 h: 9 km/h."},
{id:"m4-57",n:3,tx:"mt4a",e:"Segundo o texto, se Bruno atendesse 3 ocorrências a mais, com a mesma gratificação dividida entre os três, Ana passaria a receber",a:["R$ 2.608,70, aproximadamente.", "R$ 3.000,00", "R$ 2.400,00", "R$ 2.857,14, aproximadamente.", "R$ 3.200,00"],c:"Ocorrências: 5, 10, 8; soma 23. 12.000 ÷ 23 × 5 ≈ 2.608,70."},
{id:"m4-58",n:3,e:"Dividir 310 em partes proporcionais a 1/2, 1/3 e 1/5 dá à maior parte",a:["150", "100", "60", "120", "130"],c:"Com denominador 30: 15/30, 10/30, 6/30, razões 15, 10 e 6. Soma 31; 310 ÷ 31 = 10. Maior: 15 × 10 = 150."},
{id:"m4-59",n:3,e:"A velocidade da viatura A é 3/4 da velocidade da B. Se B faz um percurso em 6 horas, A fará o mesmo percurso em",a:["8 horas", "4,5 horas", "9 horas", "7 horas", "10 horas"],c:"Velocidade e tempo são inversos. Tempo de A = 6 ÷ (3/4) = 8 horas."},
{id:"m4-60",n:3,e:"A razão entre as velocidades de dois ciclistas é 5/3. No mesmo tempo, o mais rápido percorre 40 km. O outro percorre",a:["24 km", "66,7 km", "30 km", "20 km", "25 km"],c:"5/3 = 40/x, 5x = 120, x = 24."}

{id:"m5-01",n:1,e:"Três viaturas gastam 24 litros em uma ronda. Cinco viaturas gastam",a:["40 litros", "14,4 litros", "30 litros", "45 litros", "120 litros"],c:"Direta: 24 ÷ 3 = 8 por viatura; 5 × 8 = 40."},
{id:"m5-02",n:1,e:"Quatro guardas fazem um trabalho em 6 horas. Oito guardas fazem o mesmo trabalho em",a:["3 horas", "12 horas", "4 horas", "2 horas", "24 horas"],c:"Inversa: 4 × 6 = 24; 24 ÷ 8 = 3."},
{id:"m5-03",n:1,e:"Se 2 cadernos custam R$ 10,00, 6 cadernos custam",a:["R$ 30,00", "R$ 20,00", "R$ 12,00", "R$ 60,00", "R$ 15,00"],c:"Direta: R$ 5,00 cada; 6 × 5 = 30."},

{id:"m5-06",n:1,e:"Um guarda caminha 3 km em 30 minutos. No mesmo ritmo, em 2 horas caminha",a:["12 km", "6 km", "9 km", "18 km", "10 km"],c:"2 horas são 120 minutos; 120 ÷ 30 = 4; 4 × 3 = 12."},
{id:"m5-07",n:1,e:"Se 10 operários fazem um muro em 12 dias, 20 operários fazem em",a:["6 dias", "24 dias", "10 dias", "12 dias", "3 dias"],c:"Inversa: o dobro de operários, metade do tempo."},
{id:"m5-08",n:1,e:"Um carro gasta 8 litros em 100 km. Em 250 km gasta",a:["20 litros", "16 litros", "25 litros", "12 litros", "32 litros"],c:"Direta: 250 ÷ 100 = 2,5; 2,5 × 8 = 20."},
{id:"m5-09",n:1,e:"Uma bomba enche 300 litros em 10 minutos. Em 25 minutos enche",a:["750 litros", "600 litros", "500 litros", "120 litros", "1200 litros"],c:"30 litros por minuto; 25 × 30 = 750."},
{id:"m5-10",n:1,e:"Dez cadeiras custam R$ 400,00. Quinze cadeiras, mesmo preço unitário, custam",a:["R$ 600,00", "R$ 500,00", "R$ 800,00", "R$ 450,00", "R$ 560,00"],c:"R$ 40,00 cada; 15 × 40 = 600."},
{id:"m5-11",n:1,e:"Em 3 horas, um guarda faz 4 rondas. Em 9 horas, faz",a:["12 rondas", "6 rondas", "16 rondas", "36 rondas", "8 rondas"],c:"Direta: 9 ÷ 3 = 3; 3 × 4 = 12."},
{id:"m5-12",n:1,e:"Uma impressora imprime 120 folhas em 4 minutos. Em 10 minutos imprime",a:["300 folhas", "200 folhas", "480 folhas", "40 folhas", "150 folhas"],c:"30 folhas por minuto; 10 × 30 = 300."},
{id:"m5-13",n:1,e:"Dois pedreiros constroem 6 m de muro por dia. Quatro pedreiros, mesmo ritmo, constroem por dia",a:["12 m", "3 m", "8 m", "24 m", "10 m"],c:"Direta: dobro de pedreiros, dobro de muro."},
{id:"m5-14",n:1,e:"Uma equipe de 4 guardas atende 20 ocorrências por semana. Uma equipe de 6, no mesmo ritmo, atende",a:["30 ocorrências", "24 ocorrências", "10 ocorrências", "80 ocorrências", "26 ocorrências"],c:"Direta: 5 por guarda; 6 × 5 = 30."},
{id:"m5-15",n:1,e:"Com velocidade de 40 km/h, uma viatura faz um trajeto em 3 horas. A 60 km/h, faz em",a:["2 horas", "4 horas", "4,5 horas", "1 horas", "1,5 horas"],c:"Inversa: 40 × 3 = 120; 120 ÷ 60 = 2."},
{id:"m5-16",n:1,e:"Um pacote com 500 folhas dura 25 dias. Um pacote com 750 folhas, mesmo consumo diário, dura",a:["37,5 dias", "50 dias", "30 dias", "35 dias", "75 dias"],c:"Direta: 20 folhas por dia; 750 ÷ 20 = 37,5."},
{id:"m5-17",n:1,e:"Dois ralos esvaziam uma caixa em 6 horas. Três ralos iguais esvaziam em",a:["4 horas", "9 horas", "3 horas", "12 horas", "5 horas"],c:"Inversa: 2 × 6 = 12; 12 ÷ 3 = 4."},
{id:"m5-18",n:1,e:"Uma fotocópia custa R$ 0,25. Cem fotocópias custam",a:["R$ 25", "R$ 2,5", "R$ 250", "R$ 12,5", "R$ 4"],c:"100 × 0,25 = 25."},
{id:"m5-19",n:1,tx:"mt5a",e:"No texto, o consumo de água por guarda por dia é de",a:["5 litros", "4 litros", "6 litros", "40 litros", "8 litros"],c:"480 ÷ (12 × 8) = 5."},
{id:"m5-20",n:1,tx:"mt5b",e:"No texto, a equipe original de 5 fiscais vistoria, por dia,",a:["15 estabelecimentos", "12 estabelecimentos", "10 estabelecimentos", "60 estabelecimentos", "20 estabelecimentos"],c:"60 ÷ 4 = 15 por dia."},
{id:"m5-21",n:2,e:"Seis guardas, 8 horas por dia, patrulham um parque em 5 dias. Dez guardas, 6 horas por dia, patrulham em",a:["4 dias", "6 dias", "5 dias", "7,5 dias", "3 dias"],c:"Trabalho: 6 × 8 × 5 = 240 guarda-horas; 10 × 6 = 60 por dia; 4 dias."},
{id:"m5-22",n:2,e:"Três máquinas produzem 120 peças em 4 horas. Cinco máquinas, em 6 horas, produzem",a:["300 peças", "200 peças", "240 peças", "180 peças", "150 peças"],c:"10 peças por máquina-hora; 5 × 6 × 10 = 300."},
{id:"m5-23",n:2,e:"Oito pedreiros constroem 20 m de muro em 5 dias. Doze pedreiros, no mesmo ritmo, constroem 60 m em",a:["10 dias", "7,5 dias", "6 dias", "15 dias", "12 dias"],c:"Por pedreiro-dia: 20 ÷ 40 = 0,5 m. 60 ÷ (12 × 0,5) = 10 dias."},
{id:"m5-24",n:2,e:"Um ônibus a 60 km/h leva 3 h 20 min para uma viagem. A 80 km/h levará",a:["150 min", "200 min", "160 min", "170 min", "140 min"],c:"Tempo de 200 min; inversa: 200 × 60 ÷ 80 = 150 minutos, ou 2 h 30."},
{id:"m5-25",n:2,e:"Cinco guardas consomem 40 refeições em 4 dias. Oito guardas, em 10 dias, consomem",a:["160 refeições", "100 refeições", "80 refeições", "128 refeições", "200 refeições"],c:"2 refeições por guarda-dia; 8 × 10 × 2 = 160."},
{id:"m5-26",n:2,e:"Uma equipe de 3 pessoas pinta 90 m² de parede em 6 horas. Para pintar 150 m² em 5 horas, são necessárias",a:["6 pessoas", "5 pessoas", "4 pessoas", "3 pessoas", "10 pessoas"],c:"Rendimento: 5 m² por pessoa-hora. 150 ÷ (5 × 5) = 6."},
{id:"m5-27",n:2,e:"Uma torneira despeja 12 litros por minuto e enche um tanque em 50 minutos. Com 15 litros por minuto, enche em",a:["40 minutos", "62,5 minutos", "30 minutos", "45 minutos", "60 minutos"],c:"Volume 600 litros; 600 ÷ 15 = 40."},
{id:"m5-28",n:2,e:"Se 8 máquinas fazem um serviço em 15 dias, 10 máquinas, no mesmo ritmo, fazem em",a:["12 dias", "18,75 dias", "10 dias", "13 dias", "9 dias"],c:"Inversa: 8 × 15 = 120; 120 ÷ 10 = 12."},
{id:"m5-29",n:2,e:"Um fiscal vistoria 12 estabelecimentos em 3 dias. Para vistoriar 40 estabelecimentos no mesmo ritmo são necessários",a:["10 dias", "12 dias", "9 dias", "13,3 dias", "8 dias"],c:"4 por dia; 40 ÷ 4 = 10."},
{id:"m5-30",n:2,e:"Quatro operários fazem uma obra em 15 dias. Depois de 5 dias, chegam mais 4 operários. A obra termina em mais",a:["5 dias", "7,5 dias", "10 dias", "6 dias", "4 dias"],c:"Trabalho total 60 operário-dias; feitos 20; restam 40. Com 8 operários: 5 dias."},
{id:"m5-31",n:2,e:"Se 3 gatos pegam 3 ratos em 3 minutos, 9 gatos pegam 9 ratos, no mesmo ritmo, em",a:["3 minutos", "9 minutos", "1 minutos", "27 minutos", "6 minutos"],c:"Cada gato pega 1 rato em 3 minutos; 9 gatos pegam 9 ratos em 3 minutos."},
{id:"m5-32",n:2,e:"Uma viatura percorre 300 km com 25 litros. Com 40 litros, percorre",a:["480 km", "375 km", "420 km", "520 km", "320 km"],c:"12 km por litro; 40 × 12 = 480."},
{id:"m5-33",n:2,e:"Em 2 dias, 6 guardas fazem 24 rondas. Em 5 dias, 10 guardas fazem",a:["100 rondas", "60 rondas", "80 rondas", "120 rondas", "50 rondas"],c:"2 rondas por guarda-dia; 10 × 5 × 2 = 100."},
{id:"m5-34",n:2,e:"Um tanque tem uma torneira que o enche em 6 horas e um ralo que o esvazia em 12 horas. Com ambos abertos, o tanque enche em",a:["12 horas", "9 horas", "18 horas", "8 horas", "6 horas"],c:"Por hora: 1/6 − 1/12 = 1/12. Enche em 12 horas."},
{id:"m5-35",n:2,e:"Em um acampamento, há comida para 30 pessoas por 12 dias. Se chegarem mais 10 pessoas, a comida dura",a:["9 dias", "16 dias", "10 dias", "8 dias", "6 dias"],c:"Total 360 pessoa-dias; 360 ÷ 40 = 9."},
{id:"m5-36",n:2,e:"Uma bomba enche 4.800 litros em 2 horas. Duas bombas iguais enchem 14.400 litros em",a:["3 horas", "6 horas", "2 horas", "4 horas", "1,5 horas"],c:"Cada bomba: 2.400 L/h; duas: 4.800 L/h; 14.400 ÷ 4.800 = 3."},
{id:"m5-37",n:2,e:"Um texto de 12 páginas é digitado em 90 minutos. Em 4 horas, digitam-se",a:["32 páginas", "24 páginas", "30 páginas", "36 páginas", "48 páginas"],c:"7,5 min por página; 240 ÷ 7,5 = 32."},
{id:"m5-38",n:2,tx:"mt5a",e:"Segundo o texto, a previsão de consumo de água para o evento é de",a:["900 litros", "600 litros", "720 litros", "750 litros", "1000 litros"],c:"5 litros × 18 guardas × 10 dias = 900."},
{id:"m5-39",n:2,tx:"mt5b",e:"Segundo o texto, o mutirão de 10 fiscais, em 1 dia de 8 horas, vistoria",a:["40 estabelecimentos", "30 estabelecimentos", "60 estabelecimentos", "80 estabelecimentos", "20 estabelecimentos"],c:"0,5 estab. por fiscal-hora; 10 × 8 × 0,5 = 40."},
{id:"m5-40",n:2,tx:"mt5b",e:"Pelo texto, a quantidade de dias de mutirão necessária é de",a:["4 dias", "3 dias", "5 dias", "6 dias", "2 dias"],c:"160 ÷ 40 por dia = 4 dias."},
{id:"m5-41",n:3,e:"Um grupo de 12 guardas faz um serviço em 10 dias, 8 horas por dia. Trabalhando 6 horas por dia, 16 guardas fazem o mesmo serviço em",a:["10 dias", "8 dias", "12 dias", "7,5 dias", "9 dias"],c:"Total 12 × 10 × 8 = 960 guarda-horas. 16 × 6 = 96 por dia; 10 dias."},
{id:"m5-42",n:3,e:"Uma torneira enche um tanque em 3 horas, outra em 6 horas. Abertas juntas, enchem em",a:["2 horas", "4,5 horas", "3 horas", "1,5 horas", "9 horas"],c:"Por hora: 1/3 + 1/6 = 1/2. Enchem em 2 horas."},
{id:"m5-43",n:3,e:"Um serviço seria feito por 10 operários em 24 dias. Depois de 8 dias, saíram 5 operários. Os que ficaram concluem o restante em",a:["32 dias", "16 dias", "24 dias", "20 dias", "40 dias"],c:"Total 240 operário-dias; feitos 80; restam 160. Com 5 operários: 160 ÷ 5 = 32 dias."},
{id:"m5-44",n:3,e:"Uma equipe de 8 pessoas planejava terminar um relatório em 15 dias, 6 horas por dia. Se a equipe passar para 10 pessoas, com 4 horas por dia, o relatório sai em",a:["18 dias", "12 dias", "20 dias", "16 dias", "24 dias"],c:"Total 8 × 15 × 6 = 720 pessoa-horas. 10 × 4 = 40 por dia; 18 dias."},
{id:"m5-45",n:3,e:"Para pintar 4 salas, 3 pintores gastam 6 dias. Para pintar 10 salas, com 5 pintores, gastam",a:["9 dias", "8 dias", "10 dias", "12 dias", "7,5 dias"],c:"3 × 6 = 18 pintor-dias por 4 salas, 4,5 por sala. 10 salas: 45; ÷ 5 = 9."},
{id:"m5-46",n:3,e:"Quatro guardas fazem 3 rondas em 6 horas. Seis guardas fazem 9 rondas em",a:["12 horas", "8 horas", "9 horas", "6 horas", "16 horas"],c:"Cada guarda faz 3/24 = 1/8 de ronda por hora. 6 guardas: 6/8 = 0,75 ronda por hora; 9 ÷ 0,75 = 12."},
{id:"m5-47",n:3,e:"Um relógio atrasa 3 minutos a cada 12 horas. Em 5 dias, atrasa",a:["30 minutos", "15 minutos", "36 minutos", "45 minutos", "18 minutos"],c:"5 dias = 10 períodos de 12 h; 10 × 3 = 30."},
{id:"m5-48",n:3,e:"Uma obra, com 20 operários, ficaria pronta em 30 dias. Depois de 10 dias, 10 operários foram dispensados. A obra termina em mais",a:["40 dias", "20 dias", "30 dias", "35 dias", "45 dias"],c:"Total 600; feitos 200; restam 400; com 10 operários: 40 dias."},
{id:"m5-49",n:3,e:"Se 5 homens ou 8 mulheres fazem um serviço em 12 dias, 10 homens e 8 mulheres, juntos, fazem o mesmo serviço em",a:["4 dias", "6 dias", "3 dias", "5 dias", "8 dias"],c:"5 homens equivalem a 8 mulheres, então 10 homens equivalem a 16. Juntos com 8 mulheres, são 24 mulheres-equivalentes. 8 mulheres levam 12 dias; 24 levam 12 ÷ 3 = 4 dias."},
{id:"m5-50",n:3,e:"Uma fábrica produz 1.200 peças com 5 máquinas em 8 dias. Para produzir 2.700 peças em 9 dias, são necessárias",a:["10 máquinas", "8 máquinas", "12 máquinas", "15 máquinas", "9 máquinas"],c:"Por máquina-dia: 30 peças. 2.700 ÷ (30 × 9) = 10."},
{id:"m5-51",n:3,e:"Um motorista a 90 km/h leva 4 horas. Para chegar 1 hora mais cedo, a velocidade média deve ser de",a:["120 km/h", "100 km/h", "110 km/h", "135 km/h", "105 km/h"],c:"Distância 360 km; em 3 horas: 120 km/h."},
{id:"m5-52",n:3,e:"Para encher uma piscina, 4 bombas levam 12 horas. Se 2 bombas pararem após 4 horas, as outras 2 terminam em mais",a:["16 horas", "8 horas", "12 horas", "24 horas", "10 horas"],c:"Total 48 bomba-horas; feitas 16; restam 32; 2 bombas: 16 horas."},
{id:"m5-53",n:3,e:"Uma torneira enche um tanque em 4 horas e outra, em 12 horas. Abertas juntas, enchem o tanque em",a:["3 horas", "8 horas", "6 horas", "4,5 horas", "2 horas"],c:"Por hora: 1/4 + 1/12 = 4/12 = 1/3. Enchem em 3 horas."},
{id:"m5-54",n:3,e:"Uma tinta de 18 litros pinta 270 m². Para pintar 450 m², com a mesma tinta, são necessários",a:["30 litros", "27 litros", "24 litros", "36 litros", "45 litros"],c:"15 m² por litro; 450 ÷ 15 = 30."},
{id:"m5-55",n:3,e:"Doze operários fazem 3/5 de uma obra em 9 dias. Para terminar o restante em 4 dias, o número total de operários deve ser",a:["18 operários", "12 operários", "15 operários", "24 operários", "20 operários"],c:"Total da obra = 9 ÷ (3/5) = 15 dias com 12 operários = 180 operário-dias. Restam 72; em 4 dias: 18 operários."},
{id:"m5-56",n:3,e:"Em um quartel, 30 soldados têm comida para 20 dias. Depois de 5 dias, chegam 15 soldados. A comida restante dura mais",a:["10 dias", "15 dias", "12 dias", "9 dias", "8 dias"],c:"Total 600 soldado-dias; consumidos 150; restam 450; com 45: 10 dias."},
{id:"m5-57",n:3,e:"Seis máquinas iguais fazem um serviço em 20 dias. Para fazer em 8 dias, o número de máquinas deve ser",a:["15 máquinas", "9 máquinas", "12 máquinas", "18 máquinas", "10 máquinas"],c:"Total 120 máquina-dias; 120 ÷ 8 = 15."},
{id:"m5-58",n:3,e:"Um relatório de 30 páginas é digitado por 3 pessoas em 5 horas. Para digitar 80 páginas em 8 horas, são necessárias",a:["5 pessoas", "4 pessoas", "6 pessoas", "8 pessoas", "7,5 pessoas"],c:"2 páginas por pessoa-hora. 80 ÷ (2 × 8) = 5."},
{id:"m5-59",n:3,tx:"mt5a",e:"No texto, se o evento durasse 15 dias com 12 guardas, o consumo previsto seria de",a:["900 litros", "720 litros", "600 litros", "1000 litros", "1200 litros"],c:"5 × 12 × 15 = 900."},
{id:"m5-60",n:3,tx:"mt5b",e:"No texto, para fazer o mutirão em 2 dias com 8 horas por dia, seriam necessários, no mínimo,",a:["20 fiscais", "16 fiscais", "10 fiscais", "15 fiscais", "30 fiscais"],c:"160 ÷ 2 = 80 por dia; 0,5 × 8 = 4 por fiscal; 80 ÷ 4 = 20."}

{id:"m6-26",n:2,e:"As raízes de x<sup>2</sup> − 7x + 12 = 0 são",a:["3 e 4", "−3 e −4", "2 e 6", "1 e 12", "−3 e 4"],c:"Soma 7, produto 12: 3 e 4."},
{id:"m6-27",n:2,e:"As raízes de x<sup>2</sup> + 2x − 15 = 0 são",a:["3 e −5", "−3 e 5", "3 e 5", "−3 e −5", "15 e −1"],c:"Soma −2 e produto −15: 3 e −5."},
{id:"m6-28",n:2,e:"A soma das raízes de x<sup>2</sup> − 8x + 15 = 0 é",a:["8", "15", "−8", "7", "3"],c:"Soma = −b/a = 8."},

{id:"m6-31",n:2,e:"Três números inteiros consecutivos somam 72. O menor é",a:["23", "24", "22", "21", "25"],c:"3x + 3 = 72, x = 23."},
{id:"m6-32",n:2,e:"O discriminante de 2x<sup>2</sup> − 3x − 2 = 0 é",a:["25", "1", "−7", "17", "9"],c:"Δ = 9 − 4 × 2 × (−2) = 25."},
{id:"m6-33",n:2,e:"As raízes de 2x<sup>2</sup> − 3x − 2 = 0 são",a:["2 e −1/2", "−2 e 1/2", "3 e −2", "1 e −2", "2 e 1/2"],c:"(3 ± 5)/4."},
{id:"m6-34",n:2,e:"Daqui a 5 anos, a idade de Ana será o dobro da que ela tinha há 3 anos. A idade atual de Ana é",a:["11", "8", "13", "16", "10"],c:"x + 5 = 2(x − 3), x + 5 = 2x − 6, x = 11."},

{id:"m6-41",n:3,e:"A raiz positiva de x<sup>2</sup> − x − 56 = 0 é",a:["8", "7", "14", "56", "9"],c:"Soma 1 e produto −56: 8 e −7."},
{id:"m6-42",n:3,e:"A soma dos quadrados de dois números inteiros consecutivos é 61. O menor é",a:["5", "6", "4", "3", "7"],c:"x<sup>2</sup> + (x + 1)<sup>2</sup> = 61 → x<sup>2</sup> + x − 30 = 0 → x = 5. Confira: 25 + 36 = 61."},
{id:"m6-43",n:3,e:"Um retângulo tem perímetro 30 m e área 56 m². Seu maior lado mede, em metros,",a:["8", "7", "14", "15", "6"],c:"Semiperímetro 15: lados x e 15 − x. x(15 − x) = 56 → x<sup>2</sup> − 15x + 56 = 0 → 7 e 8."},

{id:"m6-47",n:3,e:"A soma dos quadrados das raízes de x<sup>2</sup> − 5x + 6 = 0 é",a:["13", "25", "11", "30", "5"],c:"As raízes são 2 e 3: 4 + 9 = 13."},
{id:"m6-48",n:3,e:"Um guarda caminha 24 km. Se andasse 2 km/h mais depressa, chegaria 1 hora mais cedo. Sua velocidade é, em km/h,",a:["6", "8", "4", "12", "3"],c:"24/x − 24/(x + 2) = 1 → x<sup>2</sup> + 2x − 48 = 0 → x = 6. Conferindo: 4 h contra 3 h."},

{id:"m6-50",n:3,e:"A solução de x/(x − 1) = 3/2 é",a:["3", "1", "2", "−3", "6"],c:"2x = 3x − 3, x = 3."},

<figcaption>Dos seis grupos, os três de cima tratam do verbo e os três de baixo, do nome; os dois lados dependem de achar o termo certo.</figcaption>
</figure>
<h3>1. A regra geral da concordância verbal</h3>
<p>O verbo concorda em <strong>número</strong> e <strong>pessoa</strong> com o núcleo do sujeito. O difícil não é a regra, é achar o núcleo. Duas situações escondem o sujeito.</p>
<p>A primeira é o <strong>sujeito depois do verbo</strong>. Pergunte “quem?” ou “o quê?” ao verbo e a resposta é o sujeito, mesmo que venha no fim:</p>
<ol>
<li><strong>Chegaram</strong> os reforços da Guarda.</li>
<li><strong>Faltam</strong> dois agentes na escala.</li>
<li><strong>Ocorreram</strong>, durante a madrugada, três furtos na região.</li>
</ol>
<p>A segunda é o <strong>sujeito longe do verbo</strong>, com palavras no meio. O verbo concorda com o núcleo, não com a palavra mais próxima:</p>
<ol>
<li>A <strong>lista</strong> com os nomes dos suspeitos <strong>foi</strong> entregue ao delegado.</li>
<li>O <strong>número</strong> de ocorrências nos bairros <strong>aumentou</strong>.</li>
</ol>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Chegou os reforços da Guarda</td>
<td><strong>Chegaram</strong> os reforços da Guarda</td>
</tr>
<tr>
<td>Falta dois agentes na escala</td>
<td><strong>Faltam</strong> dois agentes na escala</td>
</tr>
<tr>
<td>A lista com os nomes dos suspeitos foram entregues</td>
<td>A lista com os nomes dos suspeitos <strong>foi entregue</strong></td>
</tr>
</tbody>
</table></div>
<h3>2. Sujeito composto</h3>
<p>Com sujeito composto <strong>antes do verbo</strong>, o verbo vai para o plural: “O guarda e o motorista <strong>discutiram</strong>.”</p>
<p>Com sujeito composto <strong>depois do verbo</strong>, o verbo pode ir para o plural ou concordar com o núcleo mais próximo: “<strong>Chegaram</strong> o guarda e o motorista” ou “<strong>Chegou</strong> o guarda e o motorista”.</p>
<p>Quando os núcleos são de <strong>pessoas diferentes</strong>, vence a 1ª pessoa; sem a 1ª, vence a 2ª ou se usa a 3ª do plural:</p>
<ol>
<li>Eu e você <strong>iremos</strong> à reunião. (eu + você = nós)</li>
<li>Tu e ele <strong>ireis</strong> à reunião, ou tu e ele <strong>irão</strong>.</li>
</ol>
<p>Três situações pedem atenção:</p>
<ul>
<li>Núcleos ligados por <strong>ou</strong> com sentido de exclusão levam o verbo ao singular: “O guarda ou o fiscal <strong>assinará</strong> o termo” (só um assina). Com sentido de inclusão, plural: “Furto ou roubo <strong>exigem</strong> registro.”</li>
<li>Núcleos resumidos por <strong>tudo, nada, ninguém</strong> levam o verbo ao singular: “Viaturas, armas, coletes, <strong>tudo foi</strong> conferido.”</li>
<li>Núcleos sinônimos ou em gradação admitem singular ou plural: “O medo e o pavor <strong>tomou</strong> (ou <strong>tomaram</strong>) conta da rua.”</li>
</ul>
<h3>3. Casos especiais do verbo</h3>
<p><strong>Coletivo e expressão partitiva.</strong> Coletivo no singular leva o verbo ao singular: “A multidão <strong>invadiu</strong> a praça.” Expressões como “a maioria de”, “grande parte de”, “metade de” seguidas de plural admitem singular ou plural: “A maioria dos guardas <strong>votou</strong> (ou <strong>votaram</strong>) pela nova escala.”</p>
<p><strong>Porcentagem.</strong> Sem termo depois, o verbo concorda com o número: “30% <strong>faltaram</strong>”; “1% <strong>faltou</strong>”. Com termo depois, pode concordar com ele: “30% da tropa <strong>faltou</strong> (ou <strong>faltaram</strong>)”.</p>
<p><strong>Mais de um.</strong> O verbo fica no singular: “<strong>Mais de um</strong> guarda <strong>faltou</strong>.”</p>
<p><strong>Um dos que.</strong> O verbo vai, de preferência, para o plural: “Ele é um dos que mais <strong>trabalham</strong>.”</p>
<p><strong>Pronome relativo.</strong> Com “que”, o verbo concorda com o antecedente: “Fui <strong>eu que fiz</strong> o registro.” Com “quem”, vai para a 3ª pessoa do singular ou concorda com o antecedente: “Fui eu <strong>quem fez</strong> (ou <strong>quem fiz</strong>).”</p>
<p><strong>Nome próprio no plural.</strong> Com artigo no plural, o verbo vai ao plural: “<strong>Os Estados Unidos são</strong> um país grande.” Sem artigo, singular: “<strong>Campinas cresceu</strong> nas últimas décadas.”</p>
<p><strong>Horas com dar, bater e soar.</strong> O verbo concorda com o número de horas: “<strong>Deram</strong> três horas.” Se o sujeito for o relógio, concorda com ele: “O relógio <strong>deu</strong> três horas.”</p>
<p><strong>Haver, fazer e o “se”.</strong> Como no posto 7: haver de existir e fazer de tempo ficam no singular (houve ocorrências; faz dois anos); o “se” apassivador concorda (vendem-se casas); o de indeterminação, não (precisa-se de guardas).</p>
<h3>4. O verbo ser</h3>
<p>O verbo <strong>ser</strong> é o único que costuma concordar com o predicativo, não com o sujeito. As situações cobradas são estas:</p>
<ol>
<li><strong>Horas, datas e distâncias:</strong> concorda com o número. “<strong>São</strong> duas horas”; “<strong>É</strong> uma hora”; “Hoje <strong>são</strong> 12 de novembro” (ou “hoje <strong>é</strong> dia 12”); “Daqui à praça <strong>são</strong> dois quilômetros”.</li>
<li><strong>Pessoa:</strong> quando um dos termos é pronome pessoal, o verbo concorda com ele. “O responsável <strong>sou</strong> eu.”</li>
<li><strong>Tudo, isto, isso, aquilo + plural:</strong> o verbo prefere o plural. “Tudo <strong>são</strong> flores”; “Isso <strong>são</strong> problemas da escala.”</li>
<li><strong>Quantidade com pouco, muito, suficiente:</strong> o verbo fica no singular. “Dez reais <strong>é</strong> pouco”; “Dois agentes <strong>é</strong> muito para essa praça.”</li>
</ol>
<h3>5. A regra geral da concordância nominal</h3>
<p>Artigo, adjetivo, pronome e numeral concordam em <strong>gênero</strong> e <strong>número</strong> com o substantivo a que se referem: “as <strong>novas</strong> viaturas”, “os <strong>dois</strong> guardas <strong>escalados</strong>”.</p>
<p>Quando um adjetivo se refere a <strong>dois ou mais substantivos</strong>, a posição decide:</p>
<ul>
<li><strong>Depois</strong> dos substantivos: concorda com o mais próximo ou vai para o plural, com o masculino prevalecendo. “Guardas e agentes <strong>treinados</strong>”; “camisa e calça <strong>novas</strong>” (ou “nova”).</li>
<li><strong>Antes</strong> dos substantivos: concorda com o mais próximo. “<strong>Nova</strong> camisa e calça”; “<strong>Novos</strong> coletes e luvas”.</li>
</ul>
<h3>6. Casos especiais do nome</h3>
<p><strong>É proibido, é necessário, é bom.</strong> Sem artigo ou pronome antes do substantivo, a expressão fica invariável; com eles, concorda:</p>
<ol>
<li><strong>É proibido</strong> entrada de pessoas estranhas. / <strong>É proibida a</strong> entrada de pessoas estranhas.</li>
<li><strong>É necessário</strong> paciência. / <strong>É necessária a</strong> paciência.</li>
</ol>
<p><strong>Anexo, incluso, obrigado, mesmo, próprio, quite</strong> concordam com o termo a que se referem: “Seguem <strong>anexas</strong> as fotos”; “<strong>Obrigada</strong>, disse a vítima”; “Estamos <strong>quites</strong>”. A locução <strong>em anexo</strong> não varia: “Seguem <strong>em anexo</strong> as fotos.”</p>
<p><strong>Meio, bastante, só.</strong> Como adjetivo ou numeral, variam; como advérbio, não:</p>
<ol>
<li>Comeu <strong>meia</strong> pizza. / A vítima estava <strong>meio</strong> assustada.</li>
<li>Havia <strong>bastantes</strong> agentes. / Os agentes estavam <strong>bastante</strong> atentos.</li>
<li>Elas ficaram <strong>sós</strong> (sozinhas). / <strong>Só</strong> elas ficaram (somente).</li>
</ol>
<p><strong>Menos</strong> não varia: “<strong>menos</strong> pessoas”; a forma “menas” não existe.</p>
<p><strong>Possível</strong> concorda com o artigo da expressão: “<strong>o</strong> mais rápido <strong>possível</strong>”; “<strong>as</strong> respostas mais rápidas <strong>possíveis</strong>”.</p>
<p><strong>Cores.</strong> Adjetivo composto de cor varia só no último elemento (“olhos verde-<strong>claros</strong>”), mas cor indicada por substantivo não varia (“uniformes <strong>azul-marinho</strong>”, “camisas <strong>cinza</strong>”, “cones <strong>laranja</strong>”).</p>
<div class="box">“Junto” varia como adjetivo (“elas chegaram <strong>juntas</strong>”), mas “junto a” e “junto de” não variam (“ficaram <strong>junto ao</strong> portão”).</div>
<h3>7. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Falta dois agentes no turno da noite.</li><li>Houveram dois chamados no turno.</li><li>Faltam dois agentes no turno da noite.</li><li>Fazem dois anos que a praça foi reformada.</li><li>Vende-se motos apreendidas.</li></ol>
<p><strong>Resposta: C.</strong> “Dois agentes” é o sujeito de “faltar”, posposto: faltam. Nas demais: houve, faz, vendem-se.</p>
<h4>Questão 2</h4>
<p>Assinale a alternativa em que a concordância nominal está correta.</p>
<ol class="alts" type="A"><li>Seguem anexas as fotos da ocorrência.</li><li>Seguem anexo as fotos da ocorrência.</li><li>É proibida entrada de pessoas estranhas.</li><li>A vítima estava meia assustada.</li><li>Havia menas pessoas na praça.</li></ol>
<p><strong>Resposta: A.</strong> Anexo concorda com “fotos”. Nas demais: é proibido entrada (ou é proibida a entrada), meio assustada, menos pessoas.</p>
<h4>Questão 3</h4>
<p>Assinale a frase correta quanto à concordância do verbo ser.</p>
<ol class="alts" type="A"><li>São uma hora da tarde.</li><li>É duas horas da tarde.</li><li>Eram uma hora quando chegaram.</li><li>É uma hora da tarde.</li><li>Daqui à praça é dois quilômetros.</li></ol>
<p><strong>Resposta: D.</strong> Com horas, ser concorda com o número: é uma hora; são duas horas; são dois quilômetros.</p>
<h4>Questão 4</h4>
<p>Na frase “A lista com os nomes dos suspeitos ____ entregue ao delegado”, a lacuna é preenchida por</p>
<ol class="alts" type="A"><li>foram</li><li>foi</li><li>foi-se</li><li>foram-se</li><li>eram</li></ol>
<p><strong>Resposta: B.</strong> O núcleo do sujeito é “lista”: a lista foi entregue.</p>
<h3>8. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório com sujeito no fim:</strong> “<strong>Foram apreendidos</strong> dois celulares e uma faca.” Ache o sujeito antes de escrever o verbo.</li>
<li><strong>Escala:</strong> “<strong>Faltam</strong> três agentes no turno da noite”, não “falta”.</li>
<li><strong>Ofício com anexos:</strong> “Seguem <strong>anexos</strong> os documentos” ou “Seguem <strong>em anexo</strong> os documentos”.</li>
<li><strong>Placa e aviso:</strong> “<strong>É proibida a</strong> entrada” ou “<strong>É proibido</strong> entrada”, nunca “é proibida entrada”.</li>
<li><strong>Uniforme:</strong> “uniformes <strong>azul-marinho</strong>”, com a cor invariável.</li>
</ul>
<h3>9. Onde a Vunesp pega</h3>

<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>

</tr>
<tr>

<tr>

</tr>
<tr>

</tr>
<tr>

<td>sem artigo, invariável: é proibido entrada</td>
</tr>
<tr>

</tr>
<tr>

</tr>
<tr>

</table></div>

<span class="status">Versão 1 · em revisão</span>
<p>Regência é a relação entre uma palavra que exige um complemento e esse complemento. Na prática, é saber se depois do verbo ou do nome vem preposição, e qual. A Vunesp cobra três coisas: verbos que mudam de sentido conforme a regência, verbos que a fala usa errado e a preposição que sobe para antes do pronome relativo.</p>

<h3>Mapa do assunto</h3>

<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Com pronome ou sem</text>
<text x="624" y="96" text-anchor="middle" font-size="12">esquecer-se de; lembrar-se de</text>
<text x="624" y="112" text-anchor="middle" font-size="12">simpatizar com (sem se)</text>
<text x="624" y="128" text-anchor="middle" font-size="12">custou-me entender</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Dois complementos</text>
<text x="136" y="224" text-anchor="middle" font-size="12">informar alguém de algo</text>
<text x="136" y="240" text-anchor="middle" font-size="12">comunicar algo a alguém</text>
<text x="136" y="256" text-anchor="middle" font-size="12">pagar algo a alguém</text>

<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Regência nominal</text>
<text x="380" y="224" text-anchor="middle" font-size="12">favorável a; apto para</text>
<text x="380" y="240" text-anchor="middle" font-size="12">compatível com; residente em</text>
<text x="380" y="256" text-anchor="middle" font-size="12">aversão a; passível de</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Relativo com preposição</text>
<text x="624" y="224" text-anchor="middle" font-size="12">o filme a que assisti</text>
<text x="624" y="240" text-anchor="middle" font-size="12">a escala de que discordo</text>
<text x="624" y="256" text-anchor="middle" font-size="12">as pessoas com quem trabalho</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 5</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: desfaça o relativo para achar a preposição: assisti ao filme, o filme a que assisti</text>
</svg>
<figcaption>Os quatro primeiros grupos tratam do verbo; os dois últimos, do nome e do relativo. Em todos, quem decide a preposição é a palavra regente.</figcaption>
</figure>
<h3>1. O que é regência</h3>
<p>Toda palavra que pede complemento é o <strong>termo regente</strong>; o complemento é o <strong>termo regido</strong>. Quando a ligação entre os dois exige preposição, é ela que a regência controla. Em “Os agentes obedecem <strong>ao</strong> regulamento”, “obedecer” é o regente e exige a preposição “a”.</p>
<p>O verbo que liga o complemento sem preposição é <strong>transitivo direto</strong> (registrou a ocorrência). O que liga com preposição é <strong>transitivo indireto</strong> (precisou de ajuda). Alguns verbos mudam de sentido conforme a regência, e é aí que mora a maior parte das questões.</p>
<h3>2. Verbos que mudam de sentido com a regência</h3>
<p><strong>Assistir.</strong> No sentido de ver, presenciar, pede “a” e não aceita “lhe”: “Assisti <strong>ao</strong> jogo”; “Assisti <strong>a ele</strong>”. No sentido de ajudar, prestar assistência, é transitivo direto: “O médico assistiu <strong>o</strong> ferido.” No sentido de caber, ser de direito, pede “a”: “Assiste <strong>ao</strong> preso o direito de permanecer calado.”</p>
<p><strong>Aspirar.</strong> No sentido de desejar, pretender, pede “a”: “Ele aspira <strong>ao</strong> cargo de inspetor.” No sentido de respirar, é transitivo direto: “Aspirou <strong>o</strong> ar frio da madrugada.”</p>
<p><strong>Visar.</strong> No sentido de mirar ou de pôr visto, é transitivo direto: “Visou <strong>o</strong> alvo”; “O fiscal visou <strong>o</strong> documento.” No sentido de pretender, a norma tradicional pede “a”: “A operação visa <strong>à</strong> redução dos furtos.”</p>
<p><strong>Proceder.</strong> No sentido de realizar, dar início, pede “a”: “Procederam <strong>à</strong> vistoria.” No sentido de ter fundamento, não tem complemento: “A denúncia não procede.” No sentido de vir de, pede “de”: “O carregamento procede <strong>de</strong> Santos.”</p>
<p><strong>Querer.</strong> No sentido de desejar, é transitivo direto: “Quero <strong>o</strong> relatório até as 18h.” No sentido de estimar, ter afeto, pede “a”: “O comandante quer bem <strong>aos</strong> seus agentes”; “Quero-<strong>lhe</strong> muito bem.”</p>
<p><strong>Chamar.</strong> No sentido de convocar, é transitivo direto: “Chamei <strong>o</strong> guarda para a reunião” (chamei-<strong>o</strong>). No sentido de dar nome, qualificar, aceita as duas formas, com ou sem “de”: “Chamou-<strong>o</strong> (de) covarde” ou “Chamou-<strong>lhe</strong> (de) covarde”.</p>
<h3>3. Verbos que a fala usa diferente da norma</h3>
<p>Estes verbos aparecem errados no dia a dia, e a prova cobra justamente a forma da norma-padrão.</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Os agentes obedecem o regulamento</td>
<td>Os agentes obedecem <strong>ao</strong> regulamento</td>
</tr>
<tr>
<td>Prefiro patrulhar do que ficar na base</td>
<td>Prefiro patrulhar <strong>a</strong> ficar na base</td>
</tr>
<tr>
<td>A viatura chegou na delegacia</td>
<td>A viatura chegou <strong>à</strong> delegacia</td>
</tr>
<tr>
<td>O guarda foi no centro</td>
<td>O guarda foi <strong>ao</strong> centro</td>
</tr>
<tr>
<td>O suspeito reside à Rua das Flores</td>
<td>O suspeito reside <strong>na</strong> Rua das Flores</td>
</tr>
<tr>
<td>A demora implica em prejuízo</td>
<td>A demora implica prejuízo</td>
</tr>
<tr>
<td>Esqueci do crachá</td>
<td>Esqueci o crachá / Esqueci-<strong>me do</strong> crachá</td>
</tr>
<tr>
<td>Ela namora com um colega</td>
<td>Ela namora um colega</td>
</tr>
<tr>
<td>Me simpatizo com a ideia</td>
<td>Simpatizo <strong>com</strong> a ideia</td>
</tr>
<tr>
<td>Eu custei a entender</td>
<td>Custou-<strong>me</strong> entender</td>
</tr>
</tbody>
</table></div>
<p>Alguns verbos têm <strong>dois complementos</strong>, um de coisa e um de pessoa, e a preposição vai para um só deles:</p>
<ol>
<li><strong>Informar</strong> e <strong>avisar</strong>: informar alguém <strong>de</strong> algo, ou informar algo <strong>a</strong> alguém. “Informei o motorista <strong>da</strong> multa” ou “Informei a multa <strong>ao</strong> motorista”, nunca “informei ao motorista da multa”.</li>
<li><strong>Comunicar</strong>: comunicar algo <strong>a</strong> alguém. “Comunicou o fato <strong>à</strong> delegacia.”</li>
<li><strong>Pagar</strong>, <strong>perdoar</strong> e <strong>agradecer</strong>: a coisa sem preposição, a pessoa com “a”. “Paguei o conserto <strong>ao</strong> mecânico”; “Agradeci <strong>ao</strong> guarda a ajuda.”</li>
</ol>
<div class="box">“Preferir” já significa “querer mais”: não leva “mais”, “antes” nem “do que”. O segundo termo vem com “a”: “Prefiro a ronda <strong>à</strong> base.”</div>
<h3>4. Regência nominal</h3>
<p>Substantivos, adjetivos e advérbios também pedem preposição. Não há regra que dispense a memória; o que ajuda é agrupar pelos mais cobrados.</p>
<ul>
<li><strong>Pedem “a”:</strong> acessível, alheio, aversão (ou “por”), contrário, favorável, fiel, imune (ou “de”), inerente, necessário (ou “para”), obediência, paralelo, preferível, propenso, relativo. “A medida é <strong>favorável aos</strong> moradores.”</li>
<li><strong>Pedem “com”:</strong> compatível, conforme, cuidadoso, solidário. “A decisão é <strong>compatível com</strong> a lei.”</li>
<li><strong>Pedem “de”:</strong> capaz, cheio, digno, passível, suspeito. “O ato é <strong>passível de</strong> multa.”</li>
<li><strong>Pedem “em”:</strong> residente, situado, domiciliado, versado. “Ele é <strong>residente em</strong> Campinas.”</li>
<li><strong>Pedem “para” ou “a”:</strong> apto, útil, prejudicial. “Ele é <strong>apto para</strong> o serviço.”</li>
<li><strong>Pedem “por”:</strong> ansioso, responsável. “Está <strong>ansioso por</strong> resultados.”</li>
</ul>
<h3>5. Preposição antes do pronome relativo</h3>
<p>Quando o verbo da oração com “que”, “quem” ou “cujo” exige preposição, ela vai para <strong>antes do relativo</strong>. O teste é desfazer a frase e ver a preposição aparecer:</p>
<ol>
<li>Assisti <strong>ao</strong> filme → o filme <strong>a que</strong> assisti.</li>
<li>Aspiro <strong>ao</strong> cargo → o cargo <strong>a que</strong> aspiro.</li>
<li>Todos obedecem <strong>ao</strong> regulamento → o regulamento <strong>a que</strong> todos obedecem.</li>
<li>Discordo <strong>da</strong> escala → a escala <strong>de que</strong> discordo.</li>
<li>Trabalho <strong>com</strong> essas pessoas → as pessoas <strong>com quem</strong> trabalho.</li>
<li>Moro <strong>na</strong> rua → a rua <strong>em que</strong> moro.</li>
<li>Atendemos <strong>ao</strong> pedido do inspetor → o inspetor <strong>a cujo</strong> pedido atendemos.</li>
</ol>
<p>Se o verbo não pede preposição, o relativo vem sozinho: “a escala <strong>que</strong> todos preferem” (preferir algo).</p>
<div class="box">Regência e crase andam juntas: quando o verbo pede “a” e o nome é feminino com artigo, surge a crase (chegou <strong>à</strong> delegacia; procederam <strong>à</strong> vistoria). O assunto completo está no posto 12.</div>
<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase em que o verbo assistir está no sentido de ver e com a regência da norma-padrão.</p>
<ol class="alts" type="A"><li>Os guardas assistiram a palestra.</li><li>Os guardas assistiram-lhe com atenção.</li><li>Os guardas assistiram à palestra.</li><li>Os guardas assistiram na palestra.</li><li>O médico assistiu o ferido.</li></ol>
<p><strong>Resposta: C.</strong> No sentido de ver, assistir pede a: à palestra. Em (E), o sentido é ajudar.</p>
<h4>Questão 2</h4>
<p>Complete: “O cargo ____ ele aspira exige experiência; a vistoria ____ procedemos durou duas horas.”</p>
<ol class="alts" type="A"><li>que / que</li><li>de que / a que</li><li>a que / que</li><li>a que / a que</li><li>que / em que</li></ol>
<p><strong>Resposta: D.</strong> Aspirar (desejar) e proceder (realizar) pedem a: a que, a que.</p>
<h4>Questão 3</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Prefiro mais orientar do que multar.</li><li>Prefiro orientar a multar.</li><li>Prefiro orientar do que multar.</li><li>Prefiro antes orientar que multar.</li><li>Prefiro muito mais orientar a multar.</li></ol>
<p><strong>Resposta: B.</strong> Preferir pede “a” no segundo termo, sem “mais”, “antes” ou “do que”.</p>
<h4>Questão 4</h4>
<p>Assinale a alternativa em que o nome está seguido da preposição que exige.</p>
<ol class="alts" type="A"><li>Tenho aversão com barulho.</li><li>Ele é residente à Rua das Flores.</li><li>A lei é compatível ao decreto.</li><li>O guarda é apto em dirigir.</li><li>A medida é favorável aos moradores.</li></ol>
<p><strong>Resposta: E.</strong> Favorável a. Nas demais: aversão a (ou por), residente em, compatível com, apto para (ou a).</p>
<h3>7. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório:</strong> “A equipe procedeu <strong>à</strong> vistoria do local” e “chegou <strong>à</strong> delegacia às 23h”, não “chegou na delegacia”.</li>
<li><strong>Qualificação:</strong> “O conduzido reside <strong>na</strong> Rua das Flores, 120”, não “à Rua”.</li>
<li><strong>Ofício:</strong> “Informo Vossa Senhoria <strong>de</strong> que...” ou “Informo <strong>a</strong> Vossa Senhoria que...”; “Comunico o ocorrido <strong>a</strong> esta chefia.”</li>
<li><strong>Abordagem:</strong> “Os condutores devem obedecer <strong>à</strong> sinalização.”</li>
</ul>

"pt-11": `
<span class="status">Versão 1 · em revisão</span>
<p>Colocação pronominal é a posição dos pronomes oblíquos átonos (me, te, se, o, a, lhe, nos, vos) em relação ao verbo. São três posições: antes (próclise), depois (ênclise) e no meio (mesóclise). A prova cobra a norma-padrão, que nem sempre coincide com a fala do dia a dia.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Primeiro procure a palavra que atrai; sem ela, olhe o tempo do verbo" font-size="13">
<text x="24" y="28" font-size="16" font-weight="600">Primeiro procure a palavra que atrai; sem ela, olhe o tempo do verbo</text>
<rect class="ac" x="24" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="74" text-anchor="middle" font-weight="600">Próclise: antes</text>
<text x="136" y="96" text-anchor="middle" font-size="12">não, nunca, ninguém, tudo</text>
<text x="136" y="112" text-anchor="middle" font-size="12">que, quem; quando, se, embora</text>
<text x="136" y="128" text-anchor="middle" font-size="12">perguntas, exclamações, desejos</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">Ênclise: depois</text>
<text x="380" y="96" text-anchor="middle" font-size="12">início de frase: diga-me</text>
<text x="380" y="112" text-anchor="middle" font-size="12">imperativo: entregue-me</text>
<text x="380" y="128" text-anchor="middle" font-size="12">gerúndio; depois de vírgula</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Mesóclise: no meio</text>
<text x="624" y="96" text-anchor="middle" font-size="12">só futuro do presente</text>
<text x="624" y="112" text-anchor="middle" font-size="12">e futuro do pretérito</text>
<text x="624" y="128" text-anchor="middle" font-size="12">entregar-lhe-ei; far-se-ia</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Locuções verbais</text>
<text x="136" y="224" text-anchor="middle" font-size="12">vou-lhe entregar</text>
<text x="136" y="240" text-anchor="middle" font-size="12">vou entregar-lhe</text>
<text x="136" y="256" text-anchor="middle" font-size="12">tinha-me avisado</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 5</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Lo, la, no, na</text>
<text x="380" y="224" text-anchor="middle" font-size="12">entregá-lo; fi-lo; fê-lo</text>
<text x="380" y="240" text-anchor="middle" font-size="12">encontraram-no; põe-no</text>
<text x="380" y="256" text-anchor="middle" font-size="12">queremo-lo; abordamo-lo</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 6</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">O que nunca se faz</text>
<text x="624" y="224" text-anchor="middle" font-size="12">começar frase com me</text>
<text x="624" y="240" text-anchor="middle" font-size="12">entregarei-lhe; faria-se</text>
<text x="624" y="256" text-anchor="middle" font-size="12">tinha avisado-me</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seções 3 a 5</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: palavra atrativa decide antes de tudo; sem ela, valem o tempo verbal e o início da frase</text>
</svg>
<figcaption>Os três primeiros grupos são as posições; os três últimos, os casos que mais caem.</figcaption>
</figure>
<h3>1. As três posições</h3>
<p>O pronome oblíquo átono se apoia no verbo. A posição dele tem nome:</p>
<ol>
<li><strong>Próclise</strong>, antes do verbo: “Não <strong>me</strong> avisaram.”</li>
<li><strong>Ênclise</strong>, depois do verbo, com hífen: “Avisaram-<strong>me</strong> tarde.”</li>
<li><strong>Mesóclise</strong>, no meio do verbo, com dois hifens: “Avisar-<strong>me</strong>-ão amanhã.”</li>
</ol>
<p>Quem decide a posição é, primeiro, a presença de uma <strong>palavra atrativa</strong> antes do verbo. Sem ela, contam o tempo do verbo e o lugar na frase.</p>
<h3>2. Próclise: quando a palavra puxa o pronome</h3>
<p>Certas palavras atraem o pronome para antes do verbo. Com elas, a próclise é obrigatória:</p>
<ul>
<li><strong>Palavras negativas</strong> (não, nunca, jamais, ninguém, nada, nem): “<strong>Não me</strong> avisaram.” “<strong>Nunca se</strong> esquecerá.”</li>
<li><strong>Pronomes relativos</strong>: “O guarda <strong>que me</strong> atendeu foi gentil.”</li>
<li><strong>Pronomes indefinidos</strong> (alguém, ninguém, tudo, todos, algo): “<strong>Alguém me</strong> chamou no rádio.” “<strong>Tudo se</strong> resolveu.”</li>
<li><strong>Conjunções subordinativas</strong> (quando, se, embora, que, como, porque): “<strong>Quando o</strong> vi, chamei a central.” “<strong>Embora se</strong> esforçasse...”</li>
<li><strong>Advérbios</strong>, sem vírgula depois: “<strong>Aqui se</strong> trabalha em silêncio.” “<strong>Ontem o</strong> encontrei.”</li>
<li><strong>Frases interrogativas, exclamativas e de desejo</strong>: “<strong>Quem te</strong> contou?” “<strong>Quanto me</strong> custou!” “Deus <strong>o</strong> acompanhe!”</li>
<li><strong>Em + gerúndio</strong>: “<strong>Em se</strong> tratando de segurança, todo cuidado é pouco.”</li>
</ul>
<div class="box">A vírgula desfaz a atração do advérbio: “Ontem <strong>o</strong> encontrei” (próclise), mas “Ontem, encontrei-<strong>o</strong>” (ênclise).</div>
<h3>3. Ênclise: quando o pronome vai depois</h3>
<p>Sem palavra atrativa, a ênclise é a posição de base da norma-padrão. Ela é obrigatória em quatro situações:</p>
<ol>
<li><strong>Início de frase</strong>: a norma-padrão não começa frase com pronome átono. “Diga-<strong>me</strong> a verdade”, e não “Me diga a verdade”.</li>
<li><strong>Imperativo afirmativo</strong>: “Entregue-<strong>me</strong> os documentos.”</li>
<li><strong>Gerúndio sem “em”</strong>: “Saiu, deixando-<strong>o</strong> sozinho na praça.”</li>
<li><strong>Depois de vírgula ou pausa</strong>: “Ontem, encontrei-<strong>o</strong> na praça.”</li>
</ol>
<p>Com <strong>infinitivo</strong>, a ênclise é a forma comum (“É preciso avisá-<strong>lo</strong>”); com palavra negativa antes, as duas posições são aceitas (“para não <strong>o</strong> avisar” ou “para não avisá-<strong>lo</strong>”).</p>
<p>Quando o sujeito vem expresso antes do verbo e não há palavra atrativa, as duas posições são aceitas: “Os guardas <strong>se</strong> aproximaram” ou “Os guardas aproximaram-<strong>se</strong>”.</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Me avisaram tarde da mudança</td>
<td>Avisaram-<strong>me</strong> tarde da mudança</td>
</tr>
<tr>
<td>Me entregue os documentos</td>
<td>Entregue-<strong>me</strong> os documentos</td>
</tr>
<tr>
<td>Ninguém avisou-me</td>
<td>Ninguém <strong>me</strong> avisou</td>
</tr>
<tr>
<td>O guarda que atendeu-me</td>
<td>O guarda que <strong>me</strong> atendeu</td>
</tr>
</tbody>
</table></div>
<h3>4. Mesóclise: só com dois tempos</h3>
<p>A mesóclise só existe com o <strong>futuro do presente</strong> e o <strong>futuro do pretérito</strong>, quando não há palavra atrativa e o verbo abre a frase ou vem depois de pausa. O pronome entra entre o radical e a terminação:</p>
<ol>
<li>Entregar-<strong>lhe</strong>-ei o relatório amanhã. (entregarei)</li>
<li>Far-<strong>se</strong>-ia a vistoria se houvesse tempo. (faria)</li>
<li>Dir-<strong>se</strong>-ia que ninguém viu nada. (diria)</li>
</ol>
<p>Com palavra atrativa, o futuro volta à próclise: “<strong>Não lhe</strong> entregarei.” E o futuro <strong>nunca</strong> aceita ênclise: “entregarei-lhe” e “faria-se” estão errados.</p>
<h3>5. Locuções verbais</h3>
<p>Na locução, o pronome pode ficar depois do auxiliar ou depois do verbo principal, mas nunca solto entre os dois sem hífen na norma-padrão:</p>
<ol>
<li>Com infinitivo ou gerúndio: “Vou-<strong>lhe</strong> entregar o relatório” ou “Vou entregar-<strong>lhe</strong> o relatório”.</li>
<li>Com palavra atrativa, antes do auxiliar ou depois do principal: “Não <strong>lhe</strong> vou entregar” ou “Não vou entregar-<strong>lhe</strong>”.</li>
<li>Com <strong>particípio</strong>, nunca depois do particípio: “Tinha-<strong>me</strong> avisado” ou “Não <strong>me</strong> tinha avisado”, e não “tinha avisado-me”.</li>
</ol>
<h3>6. As formas lo, la, no, na</h3>
<p>Os pronomes <strong>o, a, os, as</strong> mudam de forma depois de certos finais de verbo:</p>
<ol>
<li>Verbo terminado em <strong>-r, -s, -z</strong>: a letra cai e o pronome vira <strong>lo, la, los, las</strong>. “entregar + o = entregá-<strong>lo</strong>”; “queremos + o = queremo-<strong>lo</strong>”; “fiz + o = fi-<strong>lo</strong>”; “fez + o = fê-<strong>lo</strong>”; “abordamos + o = abordamo-<strong>lo</strong>”.</li>
<li>Verbo terminado em <strong>som nasal</strong> (-am, -em, -ão, -õe): o pronome vira <strong>no, na, nos, nas</strong>. “encontraram + o = encontraram-<strong>no</strong>”; “põe + o = põe-<strong>no</strong>”.</li>
<li>Na mesóclise, a regra continua valendo: “encaminhar + o + ão = encaminhá-<strong>lo</strong>-ão”.</li>
</ol>
<div class="box">Note o acento que aparece quando a última sílaba fica tônica: entregá-lo, fê-lo, pô-lo, vendê-lo.</div>
<h3>7. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Me avisaram tarde da escala.</li><li>Ninguém avisou-me da escala.</li><li>Não me avisaram da escala.</li><li>Avisarei-lhe da escala amanhã.</li><li>O guarda que avisou-me saiu.</li></ol>
<p><strong>Resposta: C.</strong> A negativa atrai o pronome. Nas demais: avisaram-me, ninguém me avisou, avisar-lhe-ei, que me avisou.</p>
<h4>Questão 2</h4>
<p>As formas corretas de “entregaram + o” e “entregar + o” são, respectivamente,</p>
<ol class="alts" type="A"><li>entregaram-o / entregar-o</li><li>entregaram-lo / entregá-o</li><li>entregara-no / entregá-lo-o</li><li>entregaram-no / entregar-lo</li><li>entregaram-no / entregá-lo</li></ol>
<p><strong>Resposta: E.</strong> Depois de som nasal, “no”; depois de -r, o r cai e entra “lo”, com acento.</p>
<h4>Questão 3</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Encaminhar-lhe-emos o ofício.</li><li>Encaminharemos-lhe o ofício.</li><li>Lhe encaminharemos o ofício.</li><li>Não encaminhar-lhe-emos o ofício.</li><li>Encaminharemo-lhe o ofício.</li></ol>
<p><strong>Resposta: A.</strong> Futuro do presente, sem atrativa, no início: mesóclise. Com “não”, seria “não lhe encaminharemos”.</p>
<h4>Questão 4</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Não vou-lhe mentir.</li><li>Não lhe vou mentir.</li><li>Lhe vou mentir.</li><li>Vou mentir-lhe-ia.</li><li>Não vou mentir-lhe-ei.</li></ol>
<p><strong>Resposta: B.</strong> Com palavra atrativa, o pronome vai antes do auxiliar (ou depois do principal: não vou mentir-lhe).</p>
<h3>8. Na rotina do guarda</h3>
<ul>
<li><strong>Ofício:</strong> “Solicito-<strong>lhe</strong> as imagens” ou “Encaminho-<strong>lhe</strong> o relatório”, nunca começando por “Lhe”.</li>
<li><strong>Relatório:</strong> “Abordamo-<strong>lo</strong> na saída do terminal” ou “O abordamos”, se a frase não começar pelo pronome.</li>
<li><strong>Ordem na abordagem:</strong> “Entregue-<strong>me</strong> os documentos”, no imperativo, com ênclise.</li>
<li><strong>Fato não ocorrido:</strong> “Não <strong>o</strong> encontramos no local”, com a negativa puxando o pronome.</li>
</ul>
<h3>9. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Frase começando com “me”, “te”, “lhe”</td>
<td>na norma, ênclise: diga-me</td>
</tr>
<tr>

</tr>
<tr>
<td>“Entregar-o”, “encontraram-o”</td>
<td>entregá-lo; encontraram-no</td>
</tr>
<tr>
<td>“Ontem encontrei-o” sem vírgula</td>
<td>advérbio atrai: ontem o encontrei</td>
</tr>
<tr>
<td>“Quanto custou-me!”</td>
<td>exclamativa atrai: quanto me custou</td>
</tr>
</tbody>
</table></div>
<h3>10. Quadro-resumo</h3>
<div class="tabela"><table>

<span class="status">Versão 1 · em revisão</span>
<p>Crase é a fusão de duas vogais “a”, marcada pelo acento grave. Ela só existe quando duas coisas acontecem ao mesmo tempo: uma palavra pede a preposição “a” e a palavra seguinte aceita o artigo “a”. Quase toda questão de crase se resolve com dois testes rápidos.</p>

<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Há ou a</text>
<text x="624" y="224" text-anchor="middle" font-size="12">há dez anos: passado</text>
<text x="624" y="240" text-anchor="middle" font-size="12">daqui a dez dias: futuro</text>
<text x="624" y="256" text-anchor="middle" font-size="12">a dois quilômetros: distância</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 5</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: troque por masculino; se surgir “ao”, há crase</text>
</svg>
<figcaption>Os quatro primeiros grupos são a regra e seus três casos; os dois últimos, as confusões mais cobradas.</figcaption>
</figure>
<h3>1. O que é crase e os dois testes</h3>
<p>Crase é a fusão da <strong>preposição “a”</strong> com:</p>
<ol>
<li>o <strong>artigo “a” ou “as”</strong>: chegou <strong>à</strong> delegacia (a + a delegacia);</li>
<li>o “a” inicial de <strong>aquele, aquela, aquilo</strong>: refiro-me <strong>àquele</strong> guarda;</li>
<li>o pronome <strong>“a” ou “as”</strong> equivalente a “aquela(s)”: esta ocorrência é igual <strong>à</strong> de ontem (à = àquela).</li>
</ol>
<p>O primeiro teste é <strong>trocar a palavra feminina por uma masculina</strong>. Se aparecer “ao”, há crase:</p>
<ol>
<li>Fui <strong>à</strong> praça → Fui <strong>ao</strong> parque. (crase)</li>
<li>Fui <strong>a</strong> pé → nem precisa trocar: “pé” já é masculino. (sem crase)</li>
<li>Comecei <strong>a</strong> correr → Comecei <strong>a</strong> andar. (sem crase: não há artigo antes de verbo)</li>
</ol>
<p>O segundo teste serve para <strong>nomes de lugar</strong>: troque “ir a” por “voltar de”. Se aparecer “da”, há crase; se aparecer só “de”, não há:</p>
<ol>
<li>Vou <strong>a</strong> Campinas → volto <strong>de</strong> Campinas. (sem crase)</li>
<li>Vou <strong>à</strong> Bahia → volto <strong>da</strong> Bahia. (crase)</li>
</ol>
<h3>2. Crase obrigatória</h3>
<ul>
<li><strong>Termo que pede “a” + palavra feminina com artigo:</strong> “Chegou <strong>à</strong> delegacia”; “Obedeça <strong>à</strong> sinalização”; “Procedeu <strong>à</strong> vistoria”; “Prefiro a ronda <strong>à</strong> base”.</li>
<li><strong>Horas determinadas:</strong> “<strong>às</strong> 22h”; “<strong>à</strong> meia-noite”; “<strong>à</strong> uma hora”; “das 8h <strong>às</strong> 18h”.</li>
<li><strong>Locuções femininas:</strong> <strong>à</strong> noite, <strong>à</strong> tarde, <strong>às</strong> pressas, <strong>às</strong> vezes, <strong>à</strong> esquerda, <strong>à</strong> direita, <strong>à</strong> vista, <strong>à</strong> venda, <strong>à</strong> disposição, <strong>à</strong> espera de, <strong>à</strong> procura de, <strong>à</strong> frente de, <strong>à</strong> medida que.</li>
<li><strong>Aquele, aquela, aquilo</strong> depois de termo que pede “a”: “Refiro-me <strong>àquele</strong> relatório”; “Assisti <strong>àquilo</strong> de perto”.</li>
<li><strong>A qual, as quais</strong> quando o verbo pede “a”: “A escala <strong>à qual</strong> me refiro foi alterada.”</li>
<li><strong>“À moda de”</strong>, mesmo escondida, inclusive antes de masculino: “bife <strong>à</strong> parmegiana”; “dribla <strong>à</strong> Garrincha”.</li>
</ul>
<h3>3. Crase proibida</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Os agentes foram à pé</td>
<td>Os agentes foram <strong>a</strong> pé</td>
</tr>
<tr>
<td>Começou à chover</td>
<td>Começou <strong>a</strong> chover</td>
</tr>
<tr>
<td>Entreguei o crachá à ela</td>
<td>Entreguei o crachá <strong>a</strong> ela</td>
</tr>
<tr>
<td>Dirijo-me à Vossa Excelência</td>
<td>Dirijo-me <strong>a</strong> Vossa Excelência</td>
</tr>
<tr>
<td>Chegamos à uma conclusão</td>
<td>Chegamos <strong>a</strong> uma conclusão</td>
</tr>
<tr>
<td>Ficou cara à cara com o suspeito</td>
<td>Ficou cara <strong>a</strong> cara com o suspeito</td>
</tr>
<tr>
<td>Vou à Campinas na sexta</td>
<td>Vou <strong>a</strong> Campinas na sexta</td>
</tr>
<tr>
<td>Fui à reuniões a semana toda</td>
<td>Fui <strong>a</strong> reuniões a semana toda</td>
</tr>
<tr>
<td>A operação vai de 10 à 30 de novembro</td>
<td>A operação vai de 10 <strong>a</strong> 30 de novembro</td>
</tr>
</tbody>
</table></div>
<p>As razões são sempre as mesmas: palavra masculina, verbo, pronome que não aceita artigo (pessoal, de tratamento, indefinido, “esta” e “essa”), artigo indefinido “uma” (que não seja hora), palavras repetidas, cidade sem artigo, “a” no singular antes de plural e numeral sem artigo.</p>
<p>Dois casos com determinante mudam a regra: “Voltou <strong>a</strong> casa” (o lar, sem determinante), mas “Voltou <strong>à</strong> casa dos pais”; “Vou <strong>a</strong> Campinas”, mas “Vou <strong>à</strong> Campinas da minha infância”.</p>
<div class="box">“Senhora”, “senhorita” e “dona” aceitam artigo: “Entreguei o termo <strong>à</strong> senhora”. Os demais pronomes de tratamento, não: “a Vossa Senhoria”.</div>
<h3>4. Crase facultativa</h3>
<p>Em três situações, a crase pode aparecer ou não, porque o artigo é opcional:</p>
<ol>
<li>Antes de <strong>pronome possessivo feminino no singular</strong>: “Refiro-me <strong>a</strong> sua escala” ou “Refiro-me <strong>à</strong> sua escala”.</li>
<li>Antes de <strong>nome próprio feminino de pessoa</strong>: “Entreguei o relatório <strong>a</strong> Mariana” ou “<strong>à</strong> Mariana”.</li>
<li>Depois de <strong>até</strong>: “Foi até <strong>a</strong> delegacia” ou “até <strong>à</strong> delegacia”.</li>
</ol>
<h3>5. Há ou a?</h3>
<p>A confusão entre “há” e “a” aparece em quase toda prova com crase.</p>
<ol>
<li><strong>Há</strong> é o verbo haver e indica <strong>tempo passado</strong>: “<strong>Há</strong> dez anos, ele entrou na Guarda.” Dá para trocar por “faz”.</li>
<li><strong>A</strong> é preposição e indica <strong>tempo futuro</strong> ou <strong>distância</strong>: “Daqui <strong>a</strong> dois dias, a escala muda”; “O posto fica <strong>a</strong> dois quilômetros”.</li>
</ol>
<p>Nunca se escreve “daqui há”: o “daqui” já aponta para o futuro.</p>
<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase em que o acento grave está correto.</p>
<ol class="alts" type="A"><li>O tempo começou à fechar.</li><li>Os agentes saíram à pé.</li><li>Entregou o termo à ele.</li><li>A equipe chegou à delegacia às 23h.</li><li>Chegou à uma conclusão rápida.</li></ol>
<p><strong>Resposta: D.</strong> Chegar pede a, e delegacia aceita artigo; às 23h é hora determinada. Nas demais: verbo, masculino, pronome pessoal e artigo indefinido.</p>
<h4>Questão 2</h4>
<p>Assinale a frase em que a crase é facultativa.</p>
<ol class="alts" type="A"><li>Foi à praça.</li><li>Foi até à praça.</li><li>Chegou às 10h.</li><li>Saiu às pressas.</li><li>Refiro-me àquela praça.</li></ol>
<p><strong>Resposta: B.</strong> Depois de “até”, o artigo é opcional. Nas demais, a crase é obrigatória.</p>
<h4>Questão 3</h4>
<p>Complete: “____ três dias, o posto fechou; daqui ____ dois dias, reabrirá.”</p>
<ol class="alts" type="A"><li>Há / a</li><li>A / há</li><li>À / há</li><li>Há / à</li><li>A / a</li></ol>
<p><strong>Resposta: A.</strong> Passado: há (faz três dias). Futuro: daqui a.</p>
<h4>Questão 4</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Vou à Campinas e depois à Bahia.</li><li>Vou a Campinas e depois a Bahia.</li><li>Vou à Campinas e depois a Bahia.</li><li>Vou há Campinas e depois à Bahia.</li><li>Vou a Campinas e depois à Bahia.</li></ol>
<p><strong>Resposta: E.</strong> Volto de Campinas (sem crase); volto da Bahia (com crase).</p>
<h3>7. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório:</strong> “A equipe chegou <strong>à</strong> delegacia <strong>às</strong> 23h e entregou o conduzido <strong>à</strong> autoridade de plantão.”</li>
<li><strong>Escala:</strong> “Plantão das 19h <strong>às</strong> 7h”; “operação de 10 <strong>a</strong> 30 de novembro”, sem crase entre numerais.</li>
<li><strong>Deslocamento:</strong> “Seguiram <strong>a</strong> pé até <strong>a</strong> praça” (ou “até <strong>à</strong> praça”).</li>
<li><strong>Ofício:</strong> “Encaminho <strong>a</strong> Vossa Senhoria o relatório” e “Fico <strong>à</strong> disposição”.</li>
</ul>
<h3>8. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Crase antes de verbo</td>
<td>nunca: começou a chover</td>
</tr>
<tr>
<td>Crase antes de masculino</td>
<td>só com “à moda de”: a pé, mas bife à parmegiana</td>
</tr>
<tr>
<td>Crase antes de “ela”, “Vossa Excelência”</td>
<td>pessoais e de tratamento não aceitam artigo</td>
</tr>
<tr>
<td>“À uma conclusão”</td>
<td>artigo indefinido não leva crase; só “à uma hora”</td>
</tr>
<tr>
<td>“Vou à Campinas”</td>
<td>volto de Campinas: sem crase</td>
</tr>
<tr>
<td>“Fui à reuniões”</td>
<td>“a” no singular antes de plural é só preposição</td>
</tr>
<tr>
<td>“De 10 à 30”</td>
<td>numeral sem artigo: de 10 a 30</td>
</tr>
<tr>
<td>“Daqui há dois dias”</td>
<td>futuro: daqui a dois dias</td>
</tr>
<tr>
<td>“A escala à que me refiro”</td>
<td>antes do relativo “que”, não há artigo: a que me refiro</td>
</tr>
</tbody>
</table></div>
<h3>9. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>O que é</td>
<td>preposição a + artigo a; ou a + aquele, aquela, aquilo</td>
</tr>
<tr>
<td>Teste do masculino</td>
<td>se virar “ao”, há crase</td>
</tr>
<tr>
<td>Teste do lugar</td>
<td>volto da: crase; volto de: sem crase</td>
</tr>
<tr>
<td>Obrigatória</td>
<td>pedido de “a” + feminino com artigo; horas; locuções femininas</td>
</tr>
<tr>
<td>À moda de</td>
<td>bife à parmegiana; dribla à Garrincha</td>
</tr>
<tr>
<td>Proibida</td>
<td>masculino, verbo, pronome sem artigo, “uma”, repetição, plural sem artigo</td>
</tr>
<tr>
<td>Casa e cidade</td>
<td>sem determinante, sem crase; com determinante, crase</td>
</tr>
<tr>
<td>Senhora</td>
<td>aceita artigo: à senhora</td>
</tr>
<tr>
<td>Facultativa</td>
<td>possessivo feminino singular, nome de mulher, depois de até</td>
</tr>
<tr>
<td>Há ou a</td>
<td>há = passado (faz); a = futuro ou distância</td>
</tr>
</tbody>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Bechara, <em>Moderna Gramática Portuguesa</em>; Cunha e Cintra, <em>Nova Gramática do Português Contemporâneo</em>. Exemplos criados para a aula.</p>

<p>A Lei 13.022/2014, o Estatuto Geral das Guardas Municipais, é a norma que define o que a guarda é e o que ela pode fazer em qualquer cidade do país. Esta primeira parte cobre os arts. 1º a 5º: natureza, princípios e competências. A Vunesp cobra quase sempre a letra da lei, trocando uma palavra para ver se o candidato percebe.</p>

<h3>Mapa do assunto</h3>

<text x="136" y="224" text-anchor="middle" font-size="12">zelar por prédios e bens</text>

<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: civil, preventiva, progressiva, delegado de polícia e “quando possível e sempre que necessário”</text>
</svg>
<figcaption>Os três primeiros grupos dizem o que a guarda é; os três últimos, o que ela faz e como o STF lê a lei hoje.</figcaption>
</figure>
<h3>1. O que a lei faz</h3>
<p>A Constituição diz, no art. 144, § 8º, que os Municípios podem constituir guardas municipais destinadas à proteção de seus bens, serviços e instalações, conforme dispuser a lei. A Lei 13.022/2014 é essa lei: ela traz as <strong>normas gerais</strong> que valem para todas as guardas do país.</p>
<blockquote class="lei"><p>Esta Lei institui normas gerais para as guardas municipais, disciplinando o § 8º do art. 144 da Constituição Federal.</p><cite>art. 1º</cite></blockquote>

<p>“Normas gerais” quer dizer que a lei federal fixa o piso comum. Cada Município, ao criar sua guarda, completa os detalhes por lei municipal, mas não pode contrariar o Estatuto.</p>
<h3>2. Natureza: civil, uniformizada e preventiva</h3>
<blockquote class="lei"><p>Incumbe às guardas municipais, instituições de caráter civil, uniformizadas e armadas conforme previsto em lei, a função de proteção municipal preventiva, ressalvadas as competências da União, dos Estados e do Distrito Federal.</p><cite>art. 2º</cite></blockquote>

<p>Quatro palavras deste artigo aparecem em quase toda prova:</p>
<ol>
<li><strong>Civil.</strong> A guarda não é instituição militar. Por isso, mais adiante, a lei proíbe regulamento disciplinar militar e denominações militares (arts. 14 e 19, no posto gm-2).</li>
<li><strong>Uniformizadas.</strong> O uniforme é característica da instituição.</li>
<li><strong>Armadas conforme previsto em lei.</strong> O porte de arma não vem deste artigo; depende do que a lei específica autorizar.</li>
<li><strong>Proteção municipal preventiva.</strong> A função central é prevenir, no âmbito do Município, sem invadir o que cabe à União, aos Estados e ao Distrito Federal.</li>
</ol>
<div class="box">A Vunesp gosta de trocar “civil” por “militar” e “preventiva” por “repressiva” ou “ostensiva”. A letra da lei diz caráter civil e proteção municipal preventiva.</div>
<h3>3. Princípios mínimos de atuação</h3>
<blockquote class="lei"><p>São princípios mínimos de atuação das guardas municipais:</p><cite>art. 3º, caput</cite></blockquote>

<ol>
<li>proteção dos direitos humanos fundamentais, do exercício da cidadania e das liberdades públicas;</li>
<li>preservação da vida, redução do sofrimento e diminuição das perdas;</li>
<li>patrulhamento preventivo;</li>
<li>compromisso com a evolução social da comunidade; e</li>
<li>uso progressivo da força.</li>
</ol>
<p>A palavra “mínimos” importa: a lei municipal pode acrescentar princípios, mas não retirar estes cinco. E repare no último: o uso da força é <strong>progressivo</strong>, ou seja, proporcional à resistência encontrada, começando pela simples presença e pela verbalização. A lei não fala em uso “máximo”, “imediato” ou “irrestrito” da força.</p>
<h3>4. Competência geral</h3>
<blockquote class="lei"><p>É competência geral das guardas municipais a proteção de bens, serviços, logradouros públicos municipais e instalações do Município.</p><cite>art. 4º, caput</cite></blockquote>

<blockquote class="lei"><p>Os bens mencionados no caput abrangem os de uso comum, os de uso especial e os dominiais.</p><cite>art. 4º, parágrafo único</cite></blockquote>

<p>As três espécies de bens públicos vêm do Código Civil e costumam aparecer com exemplos:</p>
<ul>
<li><strong>Uso comum do povo:</strong> os que qualquer pessoa usa livremente, como praças, ruas, parques e calçadas.</li>
<li><strong>Uso especial:</strong> os destinados a um serviço público, como o prédio da prefeitura, a escola municipal e o posto de saúde.</li>
<li><strong>Dominiais:</strong> os que pertencem ao Município sem destinação pública específica, como um terreno vago ou um imóvel desocupado da prefeitura.</li>
</ul>
<p>Como a lei protege as três espécies, uma alternativa que limite a proteção a “bens de uso especial” ou exclua os dominiais está errada.</p>
<h3>5. Competências específicas</h3>
<blockquote class="lei"><p>São competências específicas das guardas municipais, respeitadas as competências dos órgãos federais e estaduais:</p><cite>art. 5º, caput</cite></blockquote>

<p>O art. 5º tem dezoito incisos. Decorar a ordem não ajuda; ajuda saber agrupá-los pelo que a guarda faz.</p>
<p><strong>Proteger e prevenir.</strong> Zelar pelos bens, equipamentos e prédios públicos do Município (I); prevenir e inibir, pela presença e vigilância, bem como coibir, infrações penais ou administrativas e atos infracionais que atentem contra os bens, serviços e instalações municipais (II); atuar preventiva e permanentemente no território do Município, para a proteção sistêmica da população que utiliza os bens, serviços e instalações municipais (III); proteger o patrimônio ecológico, histórico, cultural, arquitetônico e ambiental do Município, inclusive com ações preventivas e educativas (VII).</p>
<p><strong>Integrar-se a outros órgãos.</strong> Colaborar, de forma integrada com os órgãos de segurança pública, em ações conjuntas que contribuam com a paz social (IV); cooperar com os demais órgãos de defesa civil (VIII); firmar parcerias com órgãos estaduais, da União ou de Municípios vizinhos, por convênios ou consórcios (X); articular-se com os órgãos municipais de políticas sociais (XI); integrar-se com os demais órgãos de poder de polícia administrativa, para o ordenamento urbano (XII); desenvolver ações de prevenção primária à violência (XVI).</p>
<p><strong>Trânsito.</strong> Exercer as competências de trânsito que lhes forem conferidas, nas vias e logradouros municipais, nos termos do Código de Trânsito Brasileiro, ou de forma concorrente, mediante convênio com órgão de trânsito estadual ou municipal (VI).</p>
<p><strong>Comunidade e cidade.</strong> Interagir com a sociedade civil para discutir soluções e projetos locais de segurança (IX); contribuir no estudo de impacto na segurança local, conforme o plano diretor, quando houver construção de empreendimentos de grande porte (XV).</p>
<p><strong>Atuar na ocorrência.</strong> Três incisos descrevem a guarda agindo diretamente:</p>
<blockquote class="lei"><p>colaborar com a pacificação de conflitos que seus integrantes presenciarem, atentando para o respeito aos direitos fundamentais das pessoas;</p><cite>art. 5º, V</cite></blockquote>

<blockquote class="lei"><p>garantir o atendimento de ocorrências emergenciais, ou prestá-lo direta e imediatamente quando deparar-se com elas;</p><cite>art. 5º, XIII</cite></blockquote>

<blockquote class="lei"><p>encaminhar ao delegado de polícia, diante de flagrante delito, o autor da infração, preservando o local do crime, quando possível e sempre que necessário;</p><cite>art. 5º, XIV</cite></blockquote>

<p>Completam a lista o auxílio na segurança de grandes eventos e na proteção de autoridades e dignatários (XVII) e a atuação preventiva na segurança escolar, zelando pelo entorno e participando de ações educativas com o corpo discente e docente das unidades de ensino municipal (XVIII).</p>
<p>Por fim, o parágrafo único trata do encontro com as polícias:</p>
<blockquote class="lei"><p>No exercício de suas competências, a guarda municipal poderá colaborar ou atuar conjuntamente com órgãos de segurança pública da União, dos Estados e do Distrito Federal ou de congêneres de Municípios vizinhos e, nas hipóteses previstas nos incisos XIII e XIV deste artigo, diante do comparecimento de órgão descrito nos incisos do caput do art. 144 da Constituição Federal, deverá a guarda municipal prestar todo o apoio à continuidade do atendimento.</p><cite>art. 5º, parágrafo único</cite></blockquote>

<p>Em outras palavras: na ocorrência emergencial e no flagrante, a guarda age primeiro; quando a polícia chega, a guarda passa a dar apoio para o atendimento continuar.</p>
<div class="box">No flagrante, o autor é encaminhado ao delegado de polícia, não ao juiz nem ao Ministério Público. E o local do crime é preservado “quando possível e sempre que necessário”, não em qualquer caso.</div>
<h3>6. O que o STF já decidiu</h3>
<p>O Estatuto é lido hoje junto com três decisões do Supremo Tribunal Federal, que a prova pode cobrar como atualidade:</p>
<ol>
<li><strong>ADPF 995 (2023):</strong> reconheceu que as guardas municipais integram o Sistema de Segurança Pública. Por isso o art. 4º do Estatuto traz, na versão consolidada, a remissão a essa ação.</li>
<li><strong>Tema 656 da repercussão geral (fevereiro de 2025):</strong> é constitucional que as guardas exerçam ações de segurança urbana, inclusive policiamento ostensivo e comunitário, respeitadas as atribuições dos demais órgãos de segurança pública e excluída qualquer atividade de polícia judiciária. Elas ficam sujeitas ao controle externo da atividade policial pelo Ministério Público, e as leis municipais devem observar as normas gerais fixadas pelo Congresso Nacional.</li>
<li><strong>ADPF 1214 (abril de 2026):</strong> os Municípios não podem trocar o nome “Guarda Municipal” por “Polícia Municipal” ou denominação semelhante. O tema volta no art. 22, no posto gm-2.</li>
</ol>
<p>Em síntese: a guarda pode fazer policiamento preventivo e ostensivo, mas não investiga crimes nem conduz inquérito, que é atividade de polícia judiciária.</p>
<h3>7. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>De acordo com a Lei 13.022/2014, as guardas municipais são instituições de caráter</p>
<ol class="alts" type="A"><li>militar, uniformizadas e armadas, com função de proteção municipal repressiva.</li><li>civil, não uniformizadas, com função exclusiva de proteção do patrimônio.</li><li>civil, uniformizadas e armadas conforme previsto em lei, com função de proteção municipal preventiva.</li><li>militar, auxiliares da polícia militar, com função de policiamento ostensivo estadual.</li><li>civil, desarmadas, com função de fiscalização de posturas municipais.</li></ol>
<p><strong>Resposta: C.</strong> Art. 2º: caráter civil, uniformizadas, armadas conforme previsto em lei, proteção municipal preventiva.</p>
<h4>Questão 2</h4>
<p>Constitui princípio mínimo de atuação das guardas municipais, nos termos da lei,</p>
<ol class="alts" type="A"><li>o uso progressivo da força.</li><li>o uso imediato da força.</li><li>o patrulhamento repressivo.</li><li>a subordinação à polícia militar.</li><li>a investigação de infrações penais.</li></ol>
<p><strong>Resposta: A.</strong> Art. 3º, V. O patrulhamento é preventivo (inciso III).</p>
<h4>Questão 3</h4>
<p>Diante de flagrante delito, compete à guarda municipal encaminhar o autor da infração</p>
<ol class="alts" type="A"><li>ao juiz de plantão, preservando o local do crime em qualquer caso.</li><li>ao Ministério Público, sem necessidade de preservar o local.</li><li>ao comandante da guarda, que decidirá sobre a lavratura do flagrante.</li><li>à polícia militar, que fará o registro e a investigação.</li><li>ao delegado de polícia, preservando o local do crime, quando possível e sempre que necessário.</li></ol>
<p><strong>Resposta: E.</strong> Art. 5º, XIV.</p>
<h4>Questão 4</h4>
<p>Os bens protegidos pela guarda municipal, conforme o parágrafo único do art. 4º, abrangem</p>
<ol class="alts" type="A"><li>apenas os de uso especial.</li><li>os de uso comum, os de uso especial e os dominiais.</li><li>apenas os de uso comum do povo.</li><li>os de uso comum e os de uso especial, excluídos os dominiais.</li><li>os bens particulares situados no Município.</li></ol>
<p><strong>Resposta: B.</strong> Art. 4º, parágrafo único.</p>
<h3>8. Na rotina do guarda</h3>
<ul>
<li><strong>Flagrante na praça:</strong> o guarda conduz o autor ao delegado de polícia e, quando possível e necessário, preserva o local até a chegada da perícia.</li>
<li><strong>Acidente com vítima:</strong> a guarda presta o atendimento direta e imediatamente; quando o Samu ou a polícia chegam, passa a apoiar a continuidade.</li>
<li><strong>Briga presenciada:</strong> a atuação é colaborar com a pacificação, respeitando os direitos fundamentais dos envolvidos.</li>
<li><strong>Entorno da escola:</strong> ronda preventiva e participação em ações educativas com alunos e professores.</li>
<li><strong>Terreno vago da prefeitura invadido:</strong> também é bem público (dominial) e está sob a proteção da guarda.</li>
</ul>

<p>A segunda parte do Estatuto (arts. 6º a 22) trata da guarda como órgão: como é criada, qual o tamanho máximo, quem pode entrar, como é controlada e que prerrogativas seus integrantes têm. É a parte mais numérica da lei, e a Vunesp explora justamente os números: percentuais, idade, prazos e limites de efetivo.</p>

<h3>1. Criação e subordinação</h3>
<blockquote class="lei"><p>O Município pode criar, por lei, sua guarda municipal.</p><cite>art. 6º</cite></blockquote>

<blockquote class="lei"><p>A guarda municipal é subordinada ao chefe do Poder Executivo municipal.</p><cite>art. 6º, parágrafo único</cite></blockquote>

<p>Dois pontos: a criação é uma <strong>faculdade</strong> (“pode”), não uma obrigação, e exige <strong>lei</strong>, não decreto. A subordinação é ao <strong>prefeito</strong>, e não ao governador, à Câmara Municipal ou às polícias.</p>
<h3>2. Limite do efetivo e uso compartilhado</h3>
<blockquote class="lei"><p>As guardas municipais não poderão ter efetivo superior a:</p><cite>art. 7º, caput</cite></blockquote>

<div class="tabela"><table>
<thead>
<tr>
<th>População do Município</th>
<th>Efetivo máximo</th>
<th>Condição</th>
</tr>
</thead>
<tbody>
<tr>
<td>até 50 mil habitantes</td>
<td>0,4% da população</td>
<td>—</td>
</tr>
<tr>
<td>mais de 50 mil e menos de 500 mil</td>
<td>0,3% da população</td>
<td>não inferior ao limite da faixa anterior</td>
</tr>
<tr>
<td>mais de 500 mil</td>
<td>0,2% da população</td>
<td>não inferior ao limite da faixa anterior</td>
</tr>
</tbody>
</table></div>
<p>A condição da última coluna evita que uma cidade maior acabe com um teto menor do que o de uma cidade menor. Campinas, com cerca de 1,14 milhão de habitantes no Censo de 2022, está na última faixa: 0,2% dá um teto em torno de 2.280 guardas.</p>
<p>Se a população cair em censo ou estimativa oficial do IBGE, o efetivo existente é preservado e depois ajustado à variação populacional, nos termos de lei municipal (parágrafo único).</p>
<blockquote class="lei"><p>Municípios limítrofes podem, mediante consórcio público, utilizar, reciprocamente, os serviços da guarda municipal de maneira compartilhada.</p><cite>art. 8º</cite></blockquote>

<div class="box">São três condições juntas: Municípios limítrofes, consórcio público e uso recíproco. Convênio com qualquer Município ou cessão sem consórcio não atendem ao art. 8º.</div>
<h3>3. Carreira e requisitos de investidura</h3>
<blockquote class="lei"><p>A guarda municipal é formada por servidores públicos integrantes de carreira única e plano de cargos e remuneração, nos termos de lei municipal.</p><cite>art. 9º</cite></blockquote>

<blockquote class="lei"><p>São requisitos básicos para investidura em cargo público na guarda municipal:</p><cite>art. 10, caput</cite></blockquote>

<ol>
<li>nacionalidade brasileira;</li>
<li>gozo dos direitos políticos;</li>
<li>quitação com as obrigações militares e eleitorais;</li>
<li>nível médio completo de escolaridade;</li>
<li>idade mínima de 18 (dezoito) anos;</li>
<li>aptidão física, mental e psicológica; e</li>
<li>idoneidade moral comprovada por investigação social e certidões expedidas perante o Poder Judiciário estadual, federal e distrital.</li>
</ol>
<p>Outros requisitos podem ser fixados em lei municipal (parágrafo único). Repare que são requisitos <strong>básicos</strong>: o edital de Campinas pode exigir mais, como carteira de habilitação, desde que a lei municipal preveja.</p>
<h3>4. Formação e capacitação</h3>
<p>O exercício do cargo exige <strong>capacitação específica</strong>, com matriz curricular compatível com as atividades. Pode ser adaptada a matriz curricular nacional para formação em segurança pública, formulada pela Senasp, do Ministério da Justiça (art. 11).</p>
<p>O Município <strong>pode</strong> criar órgão próprio de formação, treinamento e aperfeiçoamento, guiado pelos princípios do art. 3º (art. 12). Também pode firmar convênios ou consorciar-se com outros Municípios para isso (§ 1º). O Estado pode, por convênio, manter órgão de formação centralizado, com participação dos Municípios conveniados no conselho gestor (§ 2º).</p>
<blockquote class="lei"><p>O órgão referido no § 2º não pode ser o mesmo destinado a formação, treinamento ou aperfeiçoamento de forças militares.</p><cite>art. 12, § 3º</cite></blockquote>
<h3>5. Controle interno, externo e social</h3>
<blockquote class="lei"><p>O funcionamento das guardas municipais será acompanhado por órgãos próprios, permanentes, autônomos e com atribuições de fiscalização, investigação e auditoria, mediante:</p><cite>art. 13, caput</cite></blockquote>

<p>São dois controles obrigatórios, com regras diferentes de cabimento:</p>
<ol>
<li><strong>Controle interno, pela corregedoria.</strong> Existe nas guardas com efetivo <strong>superior a 50 servidores</strong> e em <strong>todas as que utilizam arma de fogo</strong>. Serve para apurar as infrações disciplinares de seus integrantes (inciso I).</li>
<li><strong>Controle externo, pela ouvidoria.</strong> Existe em <strong>qualquer guarda</strong>, qualquer que seja o número de servidores. É independente da direção da guarda e recebe, examina e encaminha reclamações, sugestões, elogios e denúncias sobre a conduta dos dirigentes e integrantes (inciso II).</li>
</ol>
<p>O Executivo municipal <strong>pode</strong> criar órgão colegiado de <strong>controle social</strong> das atividades de segurança do Município (§ 1º). E corregedores e ouvidores têm <strong>mandato</strong>, cuja perda só pode ser decidida pela <strong>maioria absoluta da Câmara Municipal</strong>, fundada em razão relevante e específica prevista em lei municipal (§ 2º).</p>
<p>Para o controle interno, a guarda tem <strong>código de conduta próprio</strong>, conforme lei municipal (art. 14).</p>
<blockquote class="lei"><p>As guardas municipais não podem ficar sujeitas a regulamentos disciplinares de natureza militar.</p><cite>art. 14, parágrafo único</cite></blockquote>
<h3>6. Comando e carreira</h3>
<blockquote class="lei"><p>Os cargos em comissão das guardas municipais deverão ser providos por membros efetivos do quadro de carreira do órgão ou entidade.</p><cite>art. 15, caput</cite></blockquote>

<p>A exceção está no § 1º: nos <strong>primeiros 4 anos</strong> de funcionamento, a guarda pode ser dirigida por profissional estranho a seus quadros, preferencialmente com experiência ou formação na área de segurança ou defesa social.</p>
<p>Para ocupar cargos em todos os níveis da carreira, deve ser observado <strong>percentual mínimo para o sexo feminino</strong>, definido em lei municipal (§ 2º). E é garantida a <strong>progressão funcional</strong> em todos os níveis (§ 3º).</p>
<h3>7. Prerrogativas e identidade</h3>
<blockquote class="lei"><p>Aos guardas municipais é autorizado o porte de arma de fogo, conforme previsto em lei.</p><cite>art. 16</cite></blockquote>

<p>O porte é suspenso em razão de <strong>restrição médica</strong>, <strong>decisão judicial</strong> ou <strong>justificativa da adoção da medida pelo respectivo dirigente</strong> (parágrafo único). O detalhamento do porte está no Estatuto do Desarmamento.</p>
<p>Os demais artigos garantem:</p>
<ul>
<li><strong>Telefone 153 e faixa de rádio:</strong> a Anatel destina a linha 153 e faixa exclusiva de frequência de rádio aos Municípios que possuam guarda municipal (art. 17).</li>
<li><strong>Cela separada:</strong> o guarda municipal é recolhido à cela, isoladamente dos demais presos, quando sujeito à prisão antes de condenação definitiva (art. 18).</li>
<li><strong>Sem denominação militar:</strong> a hierarquia não pode usar denominação idêntica à das forças militares quanto a postos e graduações, títulos, uniformes, distintivos e condecorações (art. 19).</li>
<li><strong>Representação:</strong> as guardas têm representatividade no Conselho Nacional de Segurança Pública, no Conselho Nacional das Guardas Municipais e, no interesse dos Municípios, no Conselho Nacional de Secretários e Gestores Municipais de Segurança Pública (art. 20).</li>
<li><strong>Uniforme:</strong> padronizado, preferencialmente na cor <strong>azul-marinho</strong> (art. 21).</li>
</ul>
<h3>8. Disposições finais e o nome da guarda</h3>
<p>As guardas que já existiam em 2014 tiveram <strong>2 anos</strong> para se adaptar ao Estatuto (art. 22, caput).</p>
<blockquote class="lei"><p>É assegurada a utilização de outras denominações consagradas pelo uso, como guarda civil, guarda civil municipal, guarda metropolitana e guarda civil metropolitana.</p><cite>art. 22, parágrafo único</cite></blockquote>

<p>É por isso que Campinas usa “Guarda Municipal” e São Paulo, “Guarda Civil Metropolitana”: ambas as formas são aceitas. Mas, em abril de 2026, o STF decidiu na <strong>ADPF 1214</strong> que nenhum Município pode trocar o nome por <strong>“Polícia Municipal”</strong> ou denominação semelhante. As variações permitidas são apenas as de “guarda”.</p>
<h3>9. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>De acordo com a Lei 13.022/2014, a guarda municipal é subordinada</p>
<ol class="alts" type="A"><li>ao governador do Estado.</li><li>à Câmara Municipal.</li><li>ao chefe do Poder Executivo municipal.</li><li>ao comandante da polícia militar.</li><li>ao secretário estadual de segurança pública.</li></ol>
<p><strong>Resposta: C.</strong> Art. 6º, parágrafo único.</p>
<h4>Questão 2</h4>
<p>Em Município com mais de 500 mil habitantes, o efetivo da guarda municipal não pode ser superior a</p>
<ol class="alts" type="A"><li>0,2% da população, desde que não inferior ao limite da faixa anterior.</li><li>0,4% da população.</li><li>0,3% da população, sem outra condição.</li><li>0,5% da população.</li><li>0,1% da população.</li></ol>
<p><strong>Resposta: A.</strong> Art. 7º, III.</p>
<h4>Questão 3</h4>
<p>O controle interno, exercido por corregedoria, é obrigatório nas guardas</p>
<ol class="alts" type="A"><li>com efetivo superior a 100 servidores, apenas.</li><li>de Municípios com mais de 500 mil habitantes, apenas.</li><li>que tenham ouvidoria.</li><li>com efetivo superior a 50 servidores e em todas as que utilizam arma de fogo.</li><li>em qualquer caso, independentemente do efetivo.</li></ol>
<p><strong>Resposta: D.</strong> Art. 13, I.</p>
<h4>Questão 4</h4>
<p>É requisito básico para investidura em cargo da guarda municipal</p>
<ol class="alts" type="A"><li>idade mínima de 21 anos.</li><li>idade mínima de 18 anos.</li><li>nível superior completo.</li><li>carteira nacional de habilitação, por força da lei federal.</li><li>serviço militar prestado.</li></ol>
<p><strong>Resposta: B.</strong> Art. 10, V.</p>
<h3>10. Na rotina do guarda</h3>
<ul>
<li><strong>Telefone da guarda:</strong> o 153 é o número nacional destinado às guardas municipais.</li>
<li><strong>Denúncia de abuso:</strong> quem reclama da conduta de um agente procura a ouvidoria, que é externa e independente da direção.</li>
<li><strong>Infração disciplinar:</strong> é apurada pela corregedoria, segundo o código de conduta, e nunca por regulamento militar.</li>
<li><strong>Afastamento médico:</strong> a restrição médica suspende o porte de arma.</li>
<li><strong>Patentes:</strong> a guarda não usa “sargento”, “tenente” ou “capitão”; as classes têm nomes próprios.</li>
</ul>

{id:"p1-01",n:1,tx:"ta",e:"De acordo com o texto, a bicicleta foi localizada",a:["na manhã de sábado, em uma praça da região central.","na quinta-feira, na casa do dono.","no domingo, em um estacionamento.","na sexta-feira, em frente a uma escola.","no sábado à noite, em um terminal de ônibus."],c:"Compreensão: o 1º parágrafo diz “na manhã de sábado em uma praça da região central”. A quinta-feira é o dia do furto."},
{id:"p1-02",n:1,tx:"ta",e:"Segundo o texto, quem acionou a Guarda Municipal foi",a:["um comerciante que reconheceu a bicicleta pela foto.","o próprio dono da bicicleta.","um policial que passava pela praça.","um morador que viu o furto acontecer.","o autor do furto, arrependido."],c:"O 1º parágrafo informa que o comerciante reconheceu o veículo pela foto e acionou a equipe pelo 153."},
{id:"p1-03",n:1,tx:"ta",e:"O texto pertence ao gênero",a:["notícia.","crônica.","poema.","anúncio publicitário.","conto."],c:"Informa um fato recente, com título, lide e linguagem objetiva em 3ª pessoa: marcas da notícia."},
{id:"p1-04",n:1,tx:"ta",e:"Conforme o segundo parágrafo,",a:["ninguém foi detido.","o autor do furto foi preso em flagrante.","o cadeado original foi recuperado.","o dono não quis retirar a bicicleta.","a bicicleta estava danificada."],c:"O 2º parágrafo diz: “Ninguém foi detido”. A bicicleta estava sem o cadeado original, e o dono a retirou no mesmo dia."},
{id:"p1-05",n:1,tx:"tb",e:"De acordo com o texto, o narrador e a senhora",a:["só trocavam cumprimentos de “bom dia”.","eram vizinhos de porta.","conversavam durante toda a viagem.","trabalhavam na mesma empresa.","nunca se cumprimentavam."],c:"“Nunca trocamos uma palavra além do ‘bom dia’” (1º parágrafo)."},
{id:"p1-06",n:1,tx:"tb",e:"Na semana em que a senhora não apareceu, o narrador",a:["passou a viagem imaginando o que teria acontecido com ela.","decidiu sentar no banco da janela.","perguntou ao motorista por ela.","ficou aliviado com o ônibus vazio.","desceu três pontos depois do seu."],c:"O 2º parágrafo: “Fiquei imaginando doenças, mudanças, aposentadorias”."},
{id:"p1-07",n:1,tx:"tg",e:"O texto é predominantemente",a:["injuntivo, pois orienta o leitor a agir.","narrativo, pois conta uma história.","descritivo, pois caracteriza uma rua.","argumentativo, pois defende uma tese polêmica.","poético, pois é organizado em versos."],c:"Verbos no imperativo (atravesse, aguarde, olhe, prefira) orientam o leitor: tipo injuntivo."},
{id:"p1-08",n:1,tx:"td",e:"De acordo com o texto, a ilha de calor aparece com mais força em áreas com",a:["muito asfalto, concreto e pouca vegetação.","muitas árvores e pouca sombra.","rios e lagos.","pouca circulação de veículos.","muitas áreas verdes."],c:"Está no 1º parágrafo."},
{id:"p1-09",n:1,tx:"td",e:"Segundo o texto, as árvores ajudam a resfriar o ambiente porque",a:["fazem sombra e liberam umidade pelas folhas.","absorvem o calor e o liberam à noite.","impedem a chuva de cair.","aumentam a área de asfalto.","bloqueiam a passagem do vento."],c:"2º parágrafo. A alternativa B descreve o comportamento do asfalto e do concreto, não das árvores."},
{id:"p1-10",n:1,tx:"te",e:"No poema, a palavra “lá” refere-se",a:["à terra natal do eu lírico.","ao lugar onde o eu lírico está no momento.","a um país estrangeiro que ele admira.","ao céu estrelado.","às aves que gorjeiam aqui."],c:"“Lá” é a terra das palmeiras e do sabiá, a “minha terra”; “aqui” é onde o eu lírico está."},
{id:"p1-11",n:1,e:"Em “A loja voltou a abrir aos domingos”, a expressão “voltou a” indica que a loja",a:["já abria aos domingos e tinha deixado de abrir.","nunca tinha aberto aos domingos.","abrirá apenas neste domingo.","fechou definitivamente.","abre todos os dias da semana."],c:"“Voltar a” pressupõe que algo aconteceu antes e foi interrompido."},
{id:"p1-12",n:1,e:"Em “A moradora chamou os guardas, e eles chegaram em cinco minutos”, o pronome “eles” refere-se a",a:["os guardas.","a moradora.","os vizinhos.","os minutos.","os suspeitos."],c:"“Eles” retoma “os guardas” (anáfora), com concordância de gênero e número."},
{id:"p1-13",n:1,e:"Assinale a alternativa em que a linguagem está em sentido figurado.",a:["“Aquele bairro é um forno no verão.”","“A rua tem 300 metros de extensão.”","“O ônibus passa às 6h40.”","“A praça fica ao lado da escola.”","“Choveu 20 milímetros ontem.”"],c:"O bairro não é literalmente um forno: a metáfora indica calor intenso. As demais têm sentido literal."},
{id:"p1-14",n:1,tx:"tb",e:"O texto é uma",a:["crônica, que parte de um fato do cotidiano.","notícia, que informa um fato de interesse público.","reportagem, com dados e entrevistas.","receita, com instruções numeradas.","lei, com artigos e incisos."],c:"Fato comum (a ausência de uma passageira), primeira pessoa e reflexão final: marcas da crônica."},
{id:"p1-15",n:1,e:"Qual comando indica uma questão de compreensão, isto é, de informação explícita?",a:["“De acordo com o texto...”","“Infere-se do texto que...”","“Depreende-se que...”","“Subentende-se que...”","“O texto permite concluir que...”"],c:"“De acordo com o texto” pede o que está escrito. Os demais comandos pedem conclusão (interpretação)."},
{id:"p1-16",n:1,tx:"tf",e:"Na tirinha, o homem",a:["reclama da sujeira, mas também joga lixo no chão.","recolhe o lixo da praça.","joga a lata na lixeira.","elogia a limpeza da cidade.","pede ajuda a um guarda."],c:"No 3º quadro ele joga a lata no chão, ao lado da lixeira, depois de reclamar da sujeira."},
{id:"p1-17",n:1,tx:"tc",e:"No texto, o autor considera as câmeras",a:["úteis, mas insuficientes sozinhas.","inúteis e desnecessárias.","a única solução para os furtos.","mais importantes que os agentes.","caras demais para existirem."],c:"“Elas são úteis, sem dúvida” e “é um erro acreditar que, sozinhas, tornam a rua segura”."},
{id:"p1-18",n:1,e:"Em “O guarda disse: ‘Eu vou isolar a área.’”, a fala do guarda está em",a:["discurso direto.","discurso indireto.","linguagem não verbal.","texto descritivo.","sentido figurado."],c:"A fala aparece com as palavras do próprio falante, entre aspas e em 1ª pessoa: discurso direto."},
{id:"p1-19",n:1,e:"No texto literário, predomina",a:["a linguagem conotativa, com valor estético.","a linguagem técnica e objetiva.","a ausência de figuras de linguagem.","a finalidade exclusiva de informar.","a organização em artigos e incisos."],c:"O texto literário busca efeito estético e admite várias leituras, com predomínio da conotação."},
{id:"p1-20",n:1,tx:"td",e:"O texto é predominantemente",a:["expositivo, pois explica um fenômeno.","narrativo, pois conta a história de um bairro.","injuntivo, pois dá ordens ao leitor.","literário, pois é escrito em versos.","argumentativo, pois rebate um contra-argumento."],c:"Explica o que é a ilha de calor e por que ocorre, em linguagem objetiva: tipo expositivo."},
{id:"p1-21",n:2,tx:"ta",e:"Infere-se do texto que a divulgação da foto nas redes sociais",a:["contribuiu para que a bicicleta fosse reconhecida e recuperada.","foi a causa do furto da bicicleta.","dificultou o trabalho da Guarda Municipal.","foi feita pelo comerciante.","não teve relação com a recuperação."],c:"O comerciante reconheceu a bicicleta “pela foto que o dono havia divulgado”: a foto foi o meio do reconhecimento."},
{id:"p1-22",n:2,tx:"ta",e:"A afirmação de que a colaboração de moradores e comerciantes “tem sido decisiva” é atribuída",a:["à Guarda Municipal.","ao dono da bicicleta.","ao comerciante.","ao repórter, como opinião pessoal.","aos moradores da região."],c:"“De acordo com a corporação”: a avaliação é da Guarda. Cuidado com a troca de sujeito."},
{id:"p1-23",n:2,tx:"ta",e:"A informação de que o dono “pretende instalar um rastreador” permite inferir que ele",a:["quer facilitar a localização da bicicleta caso ela seja levada de novo.","já tinha um rastreador instalado.","vai vender a bicicleta.","desconfia do comerciante.","foi orientado pela Guarda a não usar cadeado."],c:"A intenção de instalar um rastreador logo após o furto indica preocupação em localizar o bem. “Pretende instalar” também mostra que ainda não havia rastreador."},
{id:"p1-24",n:2,tx:"tb",e:"A ideia central do texto é:",a:["Pessoas com quem convivemos sem perceber ganham importância quando faltam.","O transporte público da cidade é sempre pontual.","O narrador não gosta de conversar com desconhecidos.","A senhora estava doente na semana em que faltou.","Nas cidades grandes, ninguém se importa com ninguém."],c:"É a reflexão que fecha o texto. (D) extrapola: o motivo da ausência não é revelado. (E) contradiz a experiência narrada."},

<h3>1. O que a lei faz</h3>
<p>A Constituição diz, no art. 144, § 8º, que os Municípios podem constituir guardas municipais destinadas à proteção de seus bens, serviços e instalações, conforme dispuser a lei. A Lei 13.022/2014 é essa lei: ela traz as <strong>normas gerais</strong> que valem para todas as guardas do país.</p>
<blockquote class="lei"><p>Esta Lei institui normas gerais para as guardas municipais, disciplinando o § 8º do art. 144 da Constituição Federal.</p><cite>art. 1º</cite></blockquote>

<p>“Normas gerais” quer dizer que a lei federal fixa o piso comum. Cada Município, ao criar sua guarda, completa os detalhes por lei municipal, mas não pode contrariar o Estatuto.</p>
<h3>2. Natureza: civil, uniformizada e preventiva</h3>
<blockquote class="lei"><p>Incumbe às guardas municipais, instituições de caráter civil, uniformizadas e armadas conforme previsto em lei, a função de proteção municipal preventiva, ressalvadas as competências da União, dos Estados e do Distrito Federal.</p><cite>art. 2º</cite></blockquote>

<p>Quatro palavras deste artigo aparecem em quase toda prova:</p>
<ol>
<li><strong>Civil.</strong> A guarda não é instituição militar. Por isso, mais adiante, a lei proíbe regulamento disciplinar militar e denominações militares (arts. 14 e 19, no posto gm-2).</li>
<li><strong>Uniformizadas.</strong> O uniforme é característica da instituição.</li>
<li><strong>Armadas conforme previsto em lei.</strong> O porte de arma não vem deste artigo; depende do que a lei específica autorizar.</li>
<li><strong>Proteção municipal preventiva.</strong> A função central é prevenir, no âmbito do Município, sem invadir o que cabe à União, aos Estados e ao Distrito Federal.</li>
</ol>
<div class="box">A Vunesp gosta de trocar “civil” por “militar” e “preventiva” por “repressiva” ou “ostensiva”. A letra da lei diz caráter civil e proteção municipal preventiva.</div>
<h3>3. Princípios mínimos de atuação</h3>
<blockquote class="lei"><p>São princípios mínimos de atuação das guardas municipais:</p><cite>art. 3º, caput</cite></blockquote>

<ol>
<li>proteção dos direitos humanos fundamentais, do exercício da cidadania e das liberdades públicas;</li>
<li>preservação da vida, redução do sofrimento e diminuição das perdas;</li>
<li>patrulhamento preventivo;</li>
<li>compromisso com a evolução social da comunidade; e</li>
<li>uso progressivo da força.</li>
</ol>
<p>A palavra “mínimos” importa: a lei municipal pode acrescentar princípios, mas não retirar estes cinco. E repare no último: o uso da força é <strong>progressivo</strong>, ou seja, proporcional à resistência encontrada, começando pela simples presença e pela verbalização. A lei não fala em uso “máximo”, “imediato” ou “irrestrito” da força.</p>
<h3>4. Competência geral</h3>
<blockquote class="lei"><p>É competência geral das guardas municipais a proteção de bens, serviços, logradouros públicos municipais e instalações do Município.</p><cite>art. 4º, caput</cite></blockquote>

<blockquote class="lei"><p>Os bens mencionados no caput abrangem os de uso comum, os de uso especial e os dominiais.</p><cite>art. 4º, parágrafo único</cite></blockquote>

<p>As três espécies de bens públicos vêm do Código Civil e costumam aparecer com exemplos:</p>
<ul>
<li><strong>Uso comum do povo:</strong> os que qualquer pessoa usa livremente, como praças, ruas, parques e calçadas.</li>
<li><strong>Uso especial:</strong> os destinados a um serviço público, como o prédio da prefeitura, a escola municipal e o posto de saúde.</li>
<li><strong>Dominiais:</strong> os que pertencem ao Município sem destinação pública específica, como um terreno vago ou um imóvel desocupado da prefeitura.</li>
</ul>
<p>Como a lei protege as três espécies, uma alternativa que limite a proteção a “bens de uso especial” ou exclua os dominiais está errada.</p>
<h3>5. Competências específicas</h3>
<blockquote class="lei"><p>São competências específicas das guardas municipais, respeitadas as competências dos órgãos federais e estaduais:</p><cite>art. 5º, caput</cite></blockquote>

<p>O art. 5º tem dezoito incisos. Decorar a ordem não ajuda; ajuda saber agrupá-los pelo que a guarda faz.</p>
<p><strong>Proteger e prevenir.</strong> Zelar pelos bens, equipamentos e prédios públicos do Município (I); prevenir e inibir, pela presença e vigilância, bem como coibir, infrações penais ou administrativas e atos infracionais que atentem contra os bens, serviços e instalações municipais (II); atuar preventiva e permanentemente no território do Município, para a proteção sistêmica da população que utiliza os bens, serviços e instalações municipais (III); proteger o patrimônio ecológico, histórico, cultural, arquitetônico e ambiental do Município, inclusive com ações preventivas e educativas (VII).</p>
<p><strong>Integrar-se a outros órgãos.</strong> Colaborar, de forma integrada com os órgãos de segurança pública, em ações conjuntas que contribuam com a paz social (IV); cooperar com os demais órgãos de defesa civil (VIII); firmar parcerias com órgãos estaduais, da União ou de Municípios vizinhos, por convênios ou consórcios (X); articular-se com os órgãos municipais de políticas sociais (XI); integrar-se com os demais órgãos de poder de polícia administrativa, para o ordenamento urbano (XII); desenvolver ações de prevenção primária à violência (XVI).</p>
<p><strong>Trânsito.</strong> Exercer as competências de trânsito que lhes forem conferidas, nas vias e logradouros municipais, nos termos do Código de Trânsito Brasileiro, ou de forma concorrente, mediante convênio com órgão de trânsito estadual ou municipal (VI).</p>
<p><strong>Comunidade e cidade.</strong> Interagir com a sociedade civil para discutir soluções e projetos locais de segurança (IX); contribuir no estudo de impacto na segurança local, conforme o plano diretor, quando houver construção de empreendimentos de grande porte (XV).</p>
<p><strong>Atuar na ocorrência.</strong> Três incisos descrevem a guarda agindo diretamente:</p>
<blockquote class="lei"><p>colaborar com a pacificação de conflitos que seus integrantes presenciarem, atentando para o respeito aos direitos fundamentais das pessoas;</p><cite>art. 5º, V</cite></blockquote>

<blockquote class="lei"><p>garantir o atendimento de ocorrências emergenciais, ou prestá-lo direta e imediatamente quando deparar-se com elas;</p><cite>art. 5º, XIII</cite></blockquote>

<blockquote class="lei"><p>encaminhar ao delegado de polícia, diante de flagrante delito, o autor da infração, preservando o local do crime, quando possível e sempre que necessário;</p><cite>art. 5º, XIV</cite></blockquote>

<p>Completam a lista o auxílio na segurança de grandes eventos e na proteção de autoridades e dignatários (XVII) e a atuação preventiva na segurança escolar, zelando pelo entorno e participando de ações educativas com o corpo discente e docente das unidades de ensino municipal (XVIII).</p>
<p>Por fim, o parágrafo único trata do encontro com as polícias:</p>
<blockquote class="lei"><p>No exercício de suas competências, a guarda municipal poderá colaborar ou atuar conjuntamente com órgãos de segurança pública da União, dos Estados e do Distrito Federal ou de congêneres de Municípios vizinhos e, nas hipóteses previstas nos incisos XIII e XIV deste artigo, diante do comparecimento de órgão descrito nos incisos do caput do art. 144 da Constituição Federal, deverá a guarda municipal prestar todo o apoio à continuidade do atendimento.</p><cite>art. 5º, parágrafo único</cite></blockquote>

<p>Em outras palavras: na ocorrência emergencial e no flagrante, a guarda age primeiro; quando a polícia chega, a guarda passa a dar apoio para o atendimento continuar.</p>
<div class="box">No flagrante, o autor é encaminhado ao delegado de polícia, não ao juiz nem ao Ministério Público. E o local do crime é preservado “quando possível e sempre que necessário”, não em qualquer caso.</div>
<h3>6. O que o STF já decidiu</h3>
<p>O Estatuto é lido hoje junto com três decisões do Supremo Tribunal Federal, que a prova pode cobrar como atualidade:</p>
<ol>
<li><strong>ADPF 995 (2023):</strong> reconheceu que as guardas municipais integram o Sistema de Segurança Pública. Por isso o art. 4º do Estatuto traz, na versão consolidada, a remissão a essa ação.</li>
<li><strong>Tema 656 da repercussão geral (fevereiro de 2025):</strong> é constitucional que as guardas exerçam ações de segurança urbana, inclusive policiamento ostensivo e comunitário, respeitadas as atribuições dos demais órgãos de segurança pública e excluída qualquer atividade de polícia judiciária. Elas ficam sujeitas ao controle externo da atividade policial pelo Ministério Público, e as leis municipais devem observar as normas gerais fixadas pelo Congresso Nacional.</li>
<li><strong>ADPF 1214 (abril de 2026):</strong> os Municípios não podem trocar o nome “Guarda Municipal” por “Polícia Municipal” ou denominação semelhante. O tema volta no art. 22, no posto gm-2.</li>
</ol>
<p>Em síntese: a guarda pode fazer policiamento preventivo e ostensivo, mas não investiga crimes nem conduz inquérito, que é atividade de polícia judiciária.</p>
<h3>7. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>De acordo com a Lei 13.022/2014, as guardas municipais são instituições de caráter</p>
<ol class="alts" type="A"><li>militar, uniformizadas e armadas, com função de proteção municipal repressiva.</li><li>civil, não uniformizadas, com função exclusiva de proteção do patrimônio.</li><li>civil, uniformizadas e armadas conforme previsto em lei, com função de proteção municipal preventiva.</li><li>militar, auxiliares da polícia militar, com função de policiamento ostensivo estadual.</li><li>civil, desarmadas, com função de fiscalização de posturas municipais.</li></ol>
<p><strong>Resposta: C.</strong> Art. 2º: caráter civil, uniformizadas, armadas conforme previsto em lei, proteção municipal preventiva.</p>
<h4>Questão 2</h4>
<p>Constitui princípio mínimo de atuação das guardas municipais, nos termos da lei,</p>
<ol class="alts" type="A"><li>o uso progressivo da força.</li><li>o uso imediato da força.</li><li>o patrulhamento repressivo.</li><li>a subordinação à polícia militar.</li><li>a investigação de infrações penais.</li></ol>
<p><strong>Resposta: A.</strong> Art. 3º, V. O patrulhamento é preventivo (inciso III).</p>
<h4>Questão 3</h4>
<p>Diante de flagrante delito, compete à guarda municipal encaminhar o autor da infração</p>
<ol class="alts" type="A"><li>ao juiz de plantão, preservando o local do crime em qualquer caso.</li><li>ao Ministério Público, sem necessidade de preservar o local.</li><li>ao comandante da guarda, que decidirá sobre a lavratura do flagrante.</li><li>à polícia militar, que fará o registro e a investigação.</li><li>ao delegado de polícia, preservando o local do crime, quando possível e sempre que necessário.</li></ol>
<p><strong>Resposta: E.</strong> Art. 5º, XIV.</p>
<h4>Questão 4</h4>
<p>Os bens protegidos pela guarda municipal, conforme o parágrafo único do art. 4º, abrangem</p>
<ol class="alts" type="A"><li>apenas os de uso especial.</li><li>os de uso comum, os de uso especial e os dominiais.</li><li>apenas os de uso comum do povo.</li><li>os de uso comum e os de uso especial, excluídos os dominiais.</li><li>os bens particulares situados no Município.</li></ol>
<p><strong>Resposta: B.</strong> Art. 4º, parágrafo único.</p>
<h3>8. Na rotina do guarda</h3>
<ul>
<li><strong>Flagrante na praça:</strong> o guarda conduz o autor ao delegado de polícia e, quando possível e necessário, preserva o local até a chegada da perícia.</li>
<li><strong>Acidente com vítima:</strong> a guarda presta o atendimento direta e imediatamente; quando o Samu ou a polícia chegam, passa a apoiar a continuidade.</li>
<li><strong>Briga presenciada:</strong> a atuação é colaborar com a pacificação, respeitando os direitos fundamentais dos envolvidos.</li>
<li><strong>Entorno da escola:</strong> ronda preventiva e participação em ações educativas com alunos e professores.</li>
<li><strong>Terreno vago da prefeitura invadido:</strong> também é bem público (dominial) e está sob a proteção da guarda.</li>
</ul>

<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: números (0,4/0,3/0,2%; 18 anos; mais de 50; 4 anos; 2 anos) e as palavras “pode” e “preferencialmente”</text>
</svg>
<figcaption>Os grupos seguem a ordem da lei: do nascimento da guarda até o nome que ela pode usar.</figcaption>

<h3>1. Criação e subordinação</h3>
<blockquote class="lei"><p>O Município pode criar, por lei, sua guarda municipal.</p><cite>art. 6º</cite></blockquote>

<blockquote class="lei"><p>A guarda municipal é subordinada ao chefe do Poder Executivo municipal.</p><cite>art. 6º, parágrafo único</cite></blockquote>

<p>Dois pontos: a criação é uma <strong>faculdade</strong> (“pode”), não uma obrigação, e exige <strong>lei</strong>, não decreto. A subordinação é ao <strong>prefeito</strong>, e não ao governador, à Câmara Municipal ou às polícias.</p>
<h3>2. Limite do efetivo e uso compartilhado</h3>
<blockquote class="lei"><p>As guardas municipais não poderão ter efetivo superior a:</p><cite>art. 7º, caput</cite></blockquote>

<div class="tabela"><table>
<thead>
<tr>
<th>População do Município</th>
<th>Efetivo máximo</th>
<th>Condição</th>
</tr>
</thead>
<tbody>
<tr>
<td>até 50 mil habitantes</td>
<td>0,4% da população</td>
<td>—</td>
</tr>
<tr>
<td>mais de 50 mil e menos de 500 mil</td>
<td>0,3% da população</td>
<td>não inferior ao limite da faixa anterior</td>
</tr>
<tr>
<td>mais de 500 mil</td>
<td>0,2% da população</td>
<td>não inferior ao limite da faixa anterior</td>
</tr>
</tbody>
</table></div>
<p>A condição da última coluna evita que uma cidade maior acabe com um teto menor do que o de uma cidade menor. Campinas, com cerca de 1,14 milhão de habitantes no Censo de 2022, está na última faixa: 0,2% dá um teto em torno de 2.280 guardas.</p>
<p>Se a população cair em censo ou estimativa oficial do IBGE, o efetivo existente é preservado e depois ajustado à variação populacional, nos termos de lei municipal (parágrafo único).</p>
<blockquote class="lei"><p>Municípios limítrofes podem, mediante consórcio público, utilizar, reciprocamente, os serviços da guarda municipal de maneira compartilhada.</p><cite>art. 8º</cite></blockquote>

<div class="box">São três condições juntas: Municípios limítrofes, consórcio público e uso recíproco. Convênio com qualquer Município ou cessão sem consórcio não atendem ao art. 8º.</div>
<h3>3. Carreira e requisitos de investidura</h3>
<blockquote class="lei"><p>A guarda municipal é formada por servidores públicos integrantes de carreira única e plano de cargos e remuneração, nos termos de lei municipal.</p><cite>art. 9º</cite></blockquote>

<blockquote class="lei"><p>São requisitos básicos para investidura em cargo público na guarda municipal:</p><cite>art. 10, caput</cite></blockquote>

<ol>
<li>nacionalidade brasileira;</li>
<li>gozo dos direitos políticos;</li>
<li>quitação com as obrigações militares e eleitorais;</li>
<li>nível médio completo de escolaridade;</li>
<li>idade mínima de 18 (dezoito) anos;</li>
<li>aptidão física, mental e psicológica; e</li>
<li>idoneidade moral comprovada por investigação social e certidões expedidas perante o Poder Judiciário estadual, federal e distrital.</li>
</ol>
<p>Outros requisitos podem ser fixados em lei municipal (parágrafo único). Repare que são requisitos <strong>básicos</strong>: o edital de Campinas pode exigir mais, como carteira de habilitação, desde que a lei municipal preveja.</p>
<h3>4. Formação e capacitação</h3>
<p>O exercício do cargo exige <strong>capacitação específica</strong>, com matriz curricular compatível com as atividades. Pode ser adaptada a matriz curricular nacional para formação em segurança pública, formulada pela Senasp, do Ministério da Justiça (art. 11).</p>
<p>O Município <strong>pode</strong> criar órgão próprio de formação, treinamento e aperfeiçoamento, guiado pelos princípios do art. 3º (art. 12). Também pode firmar convênios ou consorciar-se com outros Municípios para isso (§ 1º). O Estado pode, por convênio, manter órgão de formação centralizado, com participação dos Municípios conveniados no conselho gestor (§ 2º).</p>
<blockquote class="lei"><p>O órgão referido no § 2º não pode ser o mesmo destinado a formação, treinamento ou aperfeiçoamento de forças militares.</p><cite>art. 12, § 3º</cite></blockquote>
<h3>5. Controle interno, externo e social</h3>
<blockquote class="lei"><p>O funcionamento das guardas municipais será acompanhado por órgãos próprios, permanentes, autônomos e com atribuições de fiscalização, investigação e auditoria, mediante:</p><cite>art. 13, caput</cite></blockquote>

<p>São dois controles obrigatórios, com regras diferentes de cabimento:</p>
<ol>
<li><strong>Controle interno, pela corregedoria.</strong> Existe nas guardas com efetivo <strong>superior a 50 servidores</strong> e em <strong>todas as que utilizam arma de fogo</strong>. Serve para apurar as infrações disciplinares de seus integrantes (inciso I).</li>
<li><strong>Controle externo, pela ouvidoria.</strong> Existe em <strong>qualquer guarda</strong>, qualquer que seja o número de servidores. É independente da direção da guarda e recebe, examina e encaminha reclamações, sugestões, elogios e denúncias sobre a conduta dos dirigentes e integrantes (inciso II).</li>
</ol>
<p>O Executivo municipal <strong>pode</strong> criar órgão colegiado de <strong>controle social</strong> das atividades de segurança do Município (§ 1º). E corregedores e ouvidores têm <strong>mandato</strong>, cuja perda só pode ser decidida pela <strong>maioria absoluta da Câmara Municipal</strong>, fundada em razão relevante e específica prevista em lei municipal (§ 2º).</p>
<p>Para o controle interno, a guarda tem <strong>código de conduta próprio</strong>, conforme lei municipal (art. 14).</p>
<blockquote class="lei"><p>As guardas municipais não podem ficar sujeitas a regulamentos disciplinares de natureza militar.</p><cite>art. 14, parágrafo único</cite></blockquote>
<h3>6. Comando e carreira</h3>
<blockquote class="lei"><p>Os cargos em comissão das guardas municipais deverão ser providos por membros efetivos do quadro de carreira do órgão ou entidade.</p><cite>art. 15, caput</cite></blockquote>

<p>A exceção está no § 1º: nos <strong>primeiros 4 anos</strong> de funcionamento, a guarda pode ser dirigida por profissional estranho a seus quadros, preferencialmente com experiência ou formação na área de segurança ou defesa social.</p>
<p>Para ocupar cargos em todos os níveis da carreira, deve ser observado <strong>percentual mínimo para o sexo feminino</strong>, definido em lei municipal (§ 2º). E é garantida a <strong>progressão funcional</strong> em todos os níveis (§ 3º).</p>
<h3>7. Prerrogativas e identidade</h3>
<blockquote class="lei"><p>Aos guardas municipais é autorizado o porte de arma de fogo, conforme previsto em lei.</p><cite>art. 16</cite></blockquote>

<p>O porte é suspenso em razão de <strong>restrição médica</strong>, <strong>decisão judicial</strong> ou <strong>justificativa da adoção da medida pelo respectivo dirigente</strong> (parágrafo único). O detalhamento do porte está no Estatuto do Desarmamento.</p>
<p>Os demais artigos garantem:</p>
<ul>
<li><strong>Telefone 153 e faixa de rádio:</strong> a Anatel destina a linha 153 e faixa exclusiva de frequência de rádio aos Municípios que possuam guarda municipal (art. 17).</li>
<li><strong>Cela separada:</strong> o guarda municipal é recolhido à cela, isoladamente dos demais presos, quando sujeito à prisão antes de condenação definitiva (art. 18).</li>
<li><strong>Sem denominação militar:</strong> a hierarquia não pode usar denominação idêntica à das forças militares quanto a postos e graduações, títulos, uniformes, distintivos e condecorações (art. 19).</li>
<li><strong>Representação:</strong> as guardas têm representatividade no Conselho Nacional de Segurança Pública, no Conselho Nacional das Guardas Municipais e, no interesse dos Municípios, no Conselho Nacional de Secretários e Gestores Municipais de Segurança Pública (art. 20).</li>
<li><strong>Uniforme:</strong> padronizado, preferencialmente na cor <strong>azul-marinho</strong> (art. 21).</li>
</ul>
<h3>8. Disposições finais e o nome da guarda</h3>
<p>As guardas que já existiam em 2014 tiveram <strong>2 anos</strong> para se adaptar ao Estatuto (art. 22, caput).</p>
<blockquote class="lei"><p>É assegurada a utilização de outras denominações consagradas pelo uso, como guarda civil, guarda civil municipal, guarda metropolitana e guarda civil metropolitana.</p><cite>art. 22, parágrafo único</cite></blockquote>

<p>É por isso que Campinas usa “Guarda Municipal” e São Paulo, “Guarda Civil Metropolitana”: ambas as formas são aceitas. Mas, em abril de 2026, o STF decidiu na <strong>ADPF 1214</strong> que nenhum Município pode trocar o nome por <strong>“Polícia Municipal”</strong> ou denominação semelhante. As variações permitidas são apenas as de “guarda”.</p>
<h3>9. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>De acordo com a Lei 13.022/2014, a guarda municipal é subordinada</p>
<ol class="alts" type="A"><li>ao governador do Estado.</li><li>à Câmara Municipal.</li><li>ao chefe do Poder Executivo municipal.</li><li>ao comandante da polícia militar.</li><li>ao secretário estadual de segurança pública.</li></ol>
<p><strong>Resposta: C.</strong> Art. 6º, parágrafo único.</p>
<h4>Questão 2</h4>
<p>Em Município com mais de 500 mil habitantes, o efetivo da guarda municipal não pode ser superior a</p>
<ol class="alts" type="A"><li>0,2% da população, desde que não inferior ao limite da faixa anterior.</li><li>0,4% da população.</li><li>0,3% da população, sem outra condição.</li><li>0,5% da população.</li><li>0,1% da população.</li></ol>
<p><strong>Resposta: A.</strong> Art. 7º, III.</p>
<h4>Questão 3</h4>
<p>O controle interno, exercido por corregedoria, é obrigatório nas guardas</p>
<ol class="alts" type="A"><li>com efetivo superior a 100 servidores, apenas.</li><li>de Municípios com mais de 500 mil habitantes, apenas.</li><li>que tenham ouvidoria.</li><li>com efetivo superior a 50 servidores e em todas as que utilizam arma de fogo.</li><li>em qualquer caso, independentemente do efetivo.</li></ol>
<p><strong>Resposta: D.</strong> Art. 13, I.</p>
<h4>Questão 4</h4>
<p>É requisito básico para investidura em cargo da guarda municipal</p>
<ol class="alts" type="A"><li>idade mínima de 21 anos.</li><li>idade mínima de 18 anos.</li><li>nível superior completo.</li><li>carteira nacional de habilitação, por força da lei federal.</li><li>serviço militar prestado.</li></ol>
<p><strong>Resposta: B.</strong> Art. 10, V.</p>
<h3>10. Na rotina do guarda</h3>
<ul>
<li><strong>Telefone da guarda:</strong> o 153 é o número nacional destinado às guardas municipais.</li>
<li><strong>Denúncia de abuso:</strong> quem reclama da conduta de um agente procura a ouvidoria, que é externa e independente da direção.</li>
<li><strong>Infração disciplinar:</strong> é apurada pela corregedoria, segundo o código de conduta, e nunca por regulamento militar.</li>
<li><strong>Afastamento médico:</strong> a restrição médica suspende o porte de arma.</li>
<li><strong>Patentes:</strong> a guarda não usa “sargento”, “tenente” ou “capitão”; as classes têm nomes próprios.</li>
</ul>

{id:"p1-18",n:1,e:"Em “O guarda disse: ‘Eu vou isolar a área.’”, a fala do guarda está em",a:["discurso direto.","discurso indireto.","linguagem não verbal.","texto descritivo.","sentido figurado."],c:"A fala aparece com as palavras do próprio falante, entre aspas e em 1ª pessoa: discurso direto."},
{id:"p1-19",n:1,e:"No texto literário, predomina",a:["a linguagem conotativa, com valor estético.","a linguagem técnica e objetiva.","a ausência de figuras de linguagem.","a finalidade exclusiva de informar.","a organização em artigos e incisos."],c:"O texto literário busca efeito estético e admite várias leituras, com predomínio da conotação."},
{id:"p1-20",n:1,tx:"td",e:"O texto é predominantemente",a:["expositivo, pois explica um fenômeno.","narrativo, pois conta a história de um bairro.","injuntivo, pois dá ordens ao leitor.","literário, pois é escrito em versos.","argumentativo, pois rebate um contra-argumento."],c:"Explica o que é a ilha de calor e por que ocorre, em linguagem objetiva: tipo expositivo."},
{id:"p1-21",n:2,tx:"ta",e:"Infere-se do texto que a divulgação da foto nas redes sociais",a:["contribuiu para que a bicicleta fosse reconhecida e recuperada.","foi a causa do furto da bicicleta.","dificultou o trabalho da Guarda Municipal.","foi feita pelo comerciante.","não teve relação com a recuperação."],c:"O comerciante reconheceu a bicicleta “pela foto que o dono havia divulgado”: a foto foi o meio do reconhecimento."},
{id:"p1-22",n:2,tx:"ta",e:"A afirmação de que a colaboração de moradores e comerciantes “tem sido decisiva” é atribuída",a:["à Guarda Municipal.","ao dono da bicicleta.","ao comerciante.","ao repórter, como opinião pessoal.","aos moradores da região."],c:"“De acordo com a corporação”: a avaliação é da Guarda. Cuidado com a troca de sujeito."},
{id:"p1-23",n:2,tx:"ta",e:"A informação de que o dono “pretende instalar um rastreador” permite inferir que ele",a:["quer facilitar a localização da bicicleta caso ela seja levada de novo.","já tinha um rastreador instalado.","vai vender a bicicleta.","desconfia do comerciante.","foi orientado pela Guarda a não usar cadeado."],c:"A intenção de instalar um rastreador logo após o furto indica preocupação em localizar o bem. “Pretende instalar” também mostra que ainda não havia rastreador."},
{id:"p1-24",n:2,tx:"tb",e:"A ideia central do texto é:",a:["Pessoas com quem convivemos sem perceber ganham importância quando faltam.","O transporte público da cidade é sempre pontual.","O narrador não gosta de conversar com desconhecidos.","A senhora estava doente na semana em que faltou.","Nas cidades grandes, ninguém se importa com ninguém."],c:"É a reflexão que fecha o texto. (D) extrapola: o motivo da ausência não é revelado. (E) contradiz a experiência narrada."},
{id:"p1-25",n:2,tx:"tb",e:"Em “Nenhuma das hipóteses era da minha conta, e todas me ocuparam até o trabalho”, o narrador reconhece que",a:["se preocupou com algo que não lhe dizia respeito diretamente.","descobriu o motivo da ausência da senhora.","perdeu o ônibus por causa da senhora.","se arrependeu de não ter falado com ela.","chegou atrasado ao trabalho."],c:"“Não era da minha conta” e, mesmo assim, “me ocuparam”: ele admite a preocupação com algo alheio."},
{id:"p1-26",n:2,tx:"tb",e:"No último parágrafo, o sorriso trocado entre os dois sugere que",a:["a ausência da senhora tornou visível um vínculo que já existia.","eles passaram a conversar longamente.","o narrador se mudou de bairro.","a senhora percebeu que o narrador havia faltado.","ambos estavam atrasados."],c:"O gesto novo, após a ausência, confirma a reflexão final: só se percebe que se conhecia alguém quando ele falta."},
{id:"p1-27",n:2,tx:"tc",e:"A tese defendida no texto é:",a:["As câmeras são úteis, mas não substituem a presença de pessoas na segurança das ruas.","Câmeras não devem ser instaladas nos bairros.","Contratar agentes é mais barato que instalar câmeras.","Os furtos acontecem porque faltam câmeras.","A segurança depende apenas de equipamentos modernos."],c:"O título e o último parágrafo resumem a tese. (C) contradiz o texto, que admite: “Custa”."},
{id:"p1-28",n:2,tx:"tc",e:"No 3º parágrafo, o trecho “Dirão que contratar e formar agentes custa caro. Custa.” é um exemplo de",a:["contra-argumento: o autor admite a objeção para depois rebatê-la.","dado estatístico.","argumento de autoridade.","narração de um fato.","descrição de um lugar."],c:"O autor antecipa a objeção (“dirão que”), concorda (“Custa.”) e a rebate com “Mas...”."},
{id:"p1-29",n:2,tx:"tc",e:"No 2º parágrafo, a expressão “Essas tarefas” retoma",a:["acolher a vítima, orientar o pedestre e perceber o morador que mudou de comportamento.","instalar câmeras e identificar suspeitos.","registrar e arquivar ocorrências.","contratar e formar agentes.","reconstituir ocorrências."],c:"“Essas” retoma o que acabou de ser dito: as ações que a câmera não realiza."},
{id:"p1-30",n:2,tx:"tc",e:"A expressão “transforma a prevenção em arquivo” (3º parágrafo) significa que",a:["sem alguém para agir, o equipamento apenas guarda o registro do problema em vez de evitá-lo.","as câmeras ajudam a prevenir crimes.","os arquivos policiais são mais importantes que a prevenção.","a prevenção deve ser feita por arquivistas.","as imagens gravadas são apagadas rapidamente."],c:"Sentido figurado: o que deveria evitar o problema vira apenas registro dele."},
{id:"p1-31",n:2,tx:"td",e:"No 2º parágrafo, o pronome “Isso” retoma",a:["a ilha de calor, mais intensa em áreas com asfalto, concreto e pouca vegetação.","o sol.","as árvores.","a umidade das folhas.","os especialistas."],c:"“Isso” retoma a ideia inteira do parágrafo anterior, não uma palavra isolada."},
{id:"p1-32",n:2,tx:"td",e:"Pode-se inferir do texto que um bairro arborizado tende a ser",a:["menos quente que um bairro vizinho com muito asfalto e pouca vegetação.","mais quente durante a noite.","imune às variações de temperatura.","o mais frio da cidade em qualquer estação.","mais úmido por causa do asfalto."],c:"Decorre da explicação do texto. (C) e (D) extrapolam com generalizações; “tende a” é o grau certo."},
{id:"p1-33",n:2,tx:"te",e:"No poema, o eu lírico expressa principalmente",a:["saudade da terra natal, que considera superior ao lugar onde está.","alegria por viver em outro país.","indiferença em relação à pátria.","crítica à natureza da terra natal.","desejo de nunca voltar."],c:"A comparação “aqui” x “lá” sempre favorece “lá”: saudade e exaltação da terra natal."},
{id:"p1-34",n:2,tx:"te",e:"As expressões “mais estrelas” e “mais flores” indicam",a:["valorização afetiva da terra natal, sem pretensão de exatidão científica.","dados reais sobre a quantidade de estrelas e flores.","uma descrição técnica da vegetação.","que o poema é um texto não literário.","desprezo pelo lugar de origem."],c:"No texto literário, a comparação é afetiva (conotação), não uma medição."},
{id:"p1-35",n:2,tx:"tf",e:"O humor da tirinha resulta",a:["da contradição entre a reclamação do homem e sua própria atitude.","da limpeza da praça no último quadro.","do fato de a lixeira estar cheia.","da gentileza do homem com os outros.","da chegada de um guarda ao local."],c:"A quebra de expectativa: quem reclama da sujeira suja a praça. A lixeira estava vazia, o que agrava a contradição."},
{id:"p1-36",n:2,e:"Em “Pedestres e ciclistas têm regras diferentes: estes devem circular no sentido do trânsito; aqueles devem atravessar nas faixas”, os pronomes “estes” e “aqueles” referem-se, respectivamente, a",a:["ciclistas e pedestres.","pedestres e ciclistas.","motoristas e pedestres.","ciclistas e motoristas.","pedestres e motoristas."],c:"Na enumeração, “estes” retoma o último citado (ciclistas) e “aqueles”, o primeiro (pedestres)."},
{id:"p1-37",n:2,e:"O morador afirmou: “Eu vi o carro estacionado aqui ontem.” Em discurso indireto, a frase fica corretamente:",a:["O morador afirmou que tinha visto o carro estacionado ali no dia anterior.","O morador afirmou que eu vi o carro estacionado aqui ontem.","O morador afirmou: tinha visto o carro estacionado.","O morador afirmou que vê o carro estacionado aqui hoje.","O morador afirmou que verá o carro estacionado ali amanhã."],c:"No indireto: 3ª pessoa, verbo recuado (vi → tinha visto), “aqui” → “ali”, “ontem” → “no dia anterior”."},
{id:"p1-38",n:2,e:"Em “Até o motorista do ônibus parou para ajudar”, a palavra “até” pressupõe que",a:["outras pessoas também ajudaram, e a ajuda do motorista não era esperada.","o motorista sempre ajuda os passageiros.","ninguém mais ajudou.","o motorista foi obrigado a parar.","o ônibus estava vazio."],c:"“Até” inclui o motorista num grupo e marca o fato como inesperado."},
{id:"p1-39",n:2,e:"Num artigo de opinião sobre o uso do celular ao volante, o trecho “Segundo especialistas em segurança viária, a distração com o celular aumenta o risco de acidentes” é um argumento de",a:["autoridade.","contra-argumento.","comparação.","exemplo pessoal.","descrição."],c:"O autor apoia a tese na palavra de quem entende do assunto: argumento de autoridade."},
{id:"p1-40",n:2,tx:"ta",e:"A alternativa que resume corretamente o lide da notícia é:",a:["Uma bicicleta furtada foi localizada no sábado, numa praça central, após um comerciante reconhecê-la e avisar a Guarda pelo 153.","Um estudante de 19 anos pretende instalar um rastreador na bicicleta.","A colaboração da população é decisiva para a segurança.","Ninguém foi detido pela Guarda Municipal.","O cadeado original da bicicleta foi furtado."],c:"O lide é o 1º parágrafo, com o quê, quando, onde, como e quem. As outras são detalhes de parágrafos seguintes (redução)."},
{id:"p1-41",n:3,tx:"ta",e:"Assinale a alternativa que NÃO pode ser afirmada com base no texto.",a:["O comerciante presenciou o furto da bicicleta.","A bicicleta foi encontrada sem o cadeado original.","O dono retirou a bicicleta no mesmo dia em que ela foi localizada.","A Guarda foi acionada pelo telefone 153.","O dono havia divulgado uma foto da bicicleta nas redes sociais."],c:"O texto diz que o comerciante reconheceu a bicicleta pela foto, não que viu o furto: extrapolação."},
{id:"p1-42",n:3,tx:"ta",e:"A afirmação “A bicicleta foi furtada por alguém que frequenta a praça” constitui, em relação ao texto,",a:["extrapolação, pois o texto não informa quem furtou nem se essa pessoa frequenta a praça.","compreensão, pois está escrita no texto.","inferência necessária do segundo parágrafo.","contradição, pois o texto afirma que o autor era de outra cidade.","redução da ideia central."],c:"Encontrar a bicicleta na praça não obriga a concluir quem a furtou. (D) inventa uma informação para parecer contradição."},
{id:"p1-43",n:3,tx:"ta",e:"Da frase “Ninguém foi detido”, pode-se concluir com segurança apenas que",a:["a recuperação ocorreu sem que alguém fosse detido naquela ocasião.","o autor do furto nunca será identificado.","a Guarda decidiu não investigar o caso.","não houve furto, apenas esquecimento.","o comerciante era o suspeito."],c:"As demais projetam o futuro ou inventam motivos. O grau de certeza permitido é só o do fato narrado."},
{id:"p1-44",n:3,tx:"tb",e:"Assinale a alternativa INCORRETA sobre o texto.",a:["O narrador descobre, ao final, o motivo da ausência da senhora.","A senhora costuma chegar ao ponto antes do narrador.","O narrador sabe em que ponto a senhora desce.","A senhora leva o guarda-chuva independentemente do tempo.","Na segunda-feira, os dois trocaram um sorriso."],c:"O motivo da ausência nunca é revelado; as hipóteses ficam só na imaginação do narrador."},
{id:"p1-45",n:3,tx:"tb",e:"A frase final “a gente só percebe que conhecia alguém quando sente a falta dele” apresenta",a:["uma generalização que amplia a experiência pessoal do narrador para a vida na cidade grande.","um dado estatístico sobre a vida urbana.","uma ordem dirigida ao leitor.","a opinião da senhora sobre o narrador.","uma contradição com o restante do texto."],c:"O “a gente” e o presente atemporal transformam o caso particular em reflexão geral, típico da crônica."},
{id:"p1-46",n:3,tx:"tb",e:"Considerando o texto, é correto afirmar que o narrador",a:["reconhece uma preocupação desproporcional ao pouco convívio que tinha com a senhora.","considera a senhora sua melhor amiga.","sabe o nome e o endereço da senhora.","critica a senhora por ter faltado.","decide trocar de horário de ônibus."],c:"Eles só trocavam “bom dia”, mas a ausência o ocupou a viagem inteira, e ele admite que “não era da minha conta”."},
{id:"p1-47",n:3,tx:"tc",e:"Assinale a inferência autorizada pelo texto.",a:["Para o autor, investir apenas em câmeras pode reduzir a capacidade de agir diante dos problemas.","O autor é contra o uso de qualquer tecnologia na segurança.","O autor trabalha como agente de segurança.","As câmeras aumentam os furtos nos bairros.","Contratar agentes é mais barato que instalar câmeras."],c:"Decorre de “sem ninguém para agir” e “tirar as pessoas das ruas”. (B) contradiz “Câmeras devem existir”; (E) contradiz “Custa”."},
{id:"p1-48",n:3,tx:"tc",e:"Em “Câmeras devem existir. Só não podem servir de desculpa para tirar as pessoas das ruas.”, a palavra “Só” introduz",a:["uma restrição à concessão feita na frase anterior.","uma conclusão favorável apenas às câmeras.","uma explicação técnica.","uma enumeração de tipos de câmeras.","um exemplo retirado do primeiro parágrafo."],c:"O autor concede (“devem existir”) e limita a concessão com “Só não podem...”, equivalente a “apenas”, “contudo”."},
{id:"p1-49",n:3,tx:"tc",e:"No 1º parágrafo, a frase “Elas são úteis, sem dúvida.” funciona como",a:["concessão: o autor reconhece um mérito das câmeras antes de apresentar sua ressalva.","tese principal do texto.","conclusão do artigo.","ironia, pois o autor considera as câmeras inúteis.","argumento de autoridade."],c:"A ressalva vem logo depois: “Mas é um erro acreditar que, sozinhas...”. Não é ironia, pois o último parágrafo confirma que as câmeras devem existir."},
{id:"p1-50",n:3,tx:"tc",e:"Assinale a reescrita que mantém o sentido de “Mas é um erro acreditar que, sozinhas, tornam a rua segura.”",a:["No entanto, é equivocado supor que apenas as câmeras garantam a segurança da rua.","Por isso, é correto acreditar que as câmeras tornam a rua segura.","Além disso, as câmeras sozinhas tornam a rua segura.","Portanto, a rua só é segura sem câmeras.","Mas é certo que as câmeras, juntas, deixam a rua insegura."],c:"“No entanto” mantém a oposição de “mas”, e “apenas as câmeras” equivale a “sozinhas”. As demais mudam o conector ou invertem o sentido."},
{id:"p1-51",n:3,tx:"td",e:"Assinale a alternativa que extrapola o texto.",a:["O plantio de árvores elimina completamente o calor nas cidades.","Áreas com pouca vegetação tendem a apresentar ilhas de calor mais intensas.","O asfalto libera lentamente à noite o calor absorvido durante o dia.","Especialistas citam áreas verdes como medida para reduzir o calor.","A temperatura pode variar de um bairro para outro."],c:"O texto fala em “reduzir o calor”; “elimina completamente” aumenta o grau de certeza além do texto."},
{id:"p1-52",n:3,tx:"td",e:"Em “Por esse motivo, o plantio de árvores...”, a expressão “Por esse motivo” estabelece com o parágrafo anterior uma relação de",a:["conclusão, apresentando uma medida que decorre da explicação dada.","oposição.","tempo.","comparação.","condição."],c:"Se as árvores resfriam o ambiente, então plantá-las é uma medida: relação de conclusão (consequência)."},
{id:"p1-53",n:3,tx:"te",e:"A passagem de “Minha terra” (1ª estrofe) para “Nosso céu” e “Nossas várzeas” (2ª estrofe) revela",a:["a ampliação do sentimento individual para um sentimento coletivo de pertencimento.","que o eu lírico fala em nome de estrangeiros.","que o poema é um texto informativo sobre o Brasil.","uma contradição entre as duas estrofes.","o desprezo do eu lírico por sua terra."],c:"Do possessivo de 1ª pessoa do singular para o plural: a saudade individual torna-se identidade compartilhada."},
{id:"p1-54",n:3,tx:"te",e:"Gonçalves Dias escreveu o poema longe do Brasil. Sobre a voz que fala no poema, é correto afirmar:",a:["O eu lírico é a voz do poema e não deve ser automaticamente confundido com o autor, ainda que expresse experiência semelhante.","O eu lírico é sempre o próprio autor, sem nenhuma distinção.","O eu lírico é o sabiá.","O eu lírico é um narrador de notícia.","Não há eu lírico em poemas escritos em primeira pessoa."],c:"Eu lírico e autor são instâncias diferentes, mesmo quando a biografia do autor ajuda a ler o poema."},
{id:"p1-55",n:3,tx:"tf",e:"A crítica da tirinha dirige-se principalmente",a:["a quem cobra responsabilidade dos outros sem praticá-la.","à falta de lixeiras na praça.","ao serviço de limpeza da prefeitura.","ao consumo de refrigerantes.","aos guardas municipais."],c:"Havia uma lixeira vazia ao lado: o problema não é falta de lixeira, é a atitude de quem reclama e suja."},
{id:"p1-56",n:3,e:"Um morador diz ao guarda: “Faz três noites que nenhuma viatura passa por esta rua.” Considerando a situação, a fala contém",a:["um subentendido: o morador sugere que deseja rondas na rua.","apenas informação explícita, sem nenhum sentido implícito.","uma ordem direta ao guarda, no modo imperativo.","um pressuposto de que viaturas nunca passaram pela rua.","uma contradição entre “três noites” e “nenhuma viatura”."],c:"O pedido não está nas palavras, mas na situação: é subentendido. (D) erra: “faz três noites que” sugere justamente que antes passavam."},
{id:"p1-57",n:3,e:"Assinale a alternativa INCORRETA.",a:["O subentendido está preso a palavras da frase e não pode ser negado por quem falou.","A extrapolação afirma algo que o texto não diz nem permite concluir.","A redução apresenta um detalhe como se fosse a ideia central.","O pressuposto pode ser marcado por palavras como “ainda”, “já” e “deixar de”.","Na charge, o sentido depende da combinação de imagem e texto."],c:"A alternativa A descreve o pressuposto. O subentendido depende do contexto e pode ser negado por quem falou."},
{id:"p1-58",n:3,tx:"ta",e:"Com base no último parágrafo, a afirmação mais fiel ao texto é:",a:["A Guarda Municipal avalia que a colaboração da população tem sido decisiva para recuperar objetos furtados na região.","Está comprovado que a colaboração da população reduziu os furtos em toda a cidade.","Sem a colaboração da população, nenhum objeto seria recuperado.","A colaboração da população é a única forma de recuperar objetos furtados.","Os moradores afirmam que a Guarda depende deles."],c:"Mantém quem diz (a Guarda), o alcance (a região) e o grau (“tem sido decisiva”). As outras ampliam, absolutizam ou trocam o sujeito."},
{id:"p1-59",n:3,e:"Em “O agente pediu apenas isto: que os curiosos se afastassem da área isolada”, o pronome “isto”",a:["antecipa a informação que vem depois dos dois-pontos.","retoma o agente.","retoma a área isolada.","refere-se aos curiosos citados antes.","não tem referente no período."],c:"“Isto” anuncia o que vai ser dito (catáfora): o pedido para que os curiosos se afastassem."},
{id:"p1-60",n:3,tx:"tc",e:"O trecho “A câmera registra; ela não acolhe a vítima, não orienta o pedestre perdido, não percebe o morador que mudou de comportamento.” tem, no texto, a função de",a:["sustentar a tese por meio da enumeração do que a câmera não é capaz de fazer.","narrar uma ocorrência específica.","descrever tecnicamente o funcionamento de uma câmera.","apresentar a objeção que o autor vai rebater.","concluir o texto com uma proposta."],c:"É o argumento central: mostra o limite da câmera e prepara a ideia de que essas tarefas dependem de pessoas."}
];

BANCO["pt-2"] = [
{id:"p2-01",n:1,e:"Em “A prefeitura <strong>interditou</strong> a rua”, a palavra destacada pode ser substituída, sem alteração de sentido, por",a:["bloqueou.","liberou.","asfaltou.","iluminou.","vistoriou."],c:"Interditar é impedir o uso. “Liberou” é o antônimo."},
{id:"p2-02",n:1,e:"Em “É <strong>vedado</strong> estacionar na calçada”, a palavra destacada significa",a:["proibido.","permitido.","recomendado.","obrigatório.","tolerado."],c:"Vedado = proibido. “Permitido” (ou “facultado”) é o antônimo."},
{id:"p2-03",n:1,e:"Em “Os guardas chegaram <strong>cedo</strong>”, o antônimo da palavra destacada é",a:["tarde.","logo.","rápido.","depressa.","antes."],c:"Cedo e tarde são antônimos graduais (há “na hora” no meio)."},
{id:"p2-04",n:1,e:"Em “O perigo era <strong>iminente</strong>”, a palavra destacada significa",a:["prestes a acontecer.","ilustre.","distante.","inexistente.","antigo."],c:"Iminente = prestes a acontecer. “Ilustre” é o sentido do parônimo “eminente”."},
{id:"p2-05",n:1,e:"Complete corretamente: “O juiz expediu o ______ de prisão.”",a:["mandado","mandato","mando","mandante","mandamento"],c:"Mandado é a ordem judicial. Mandato é o período de um cargo eletivo."},
{id:"p2-06",n:1,e:"Complete corretamente: “A operação combateu o ______ de drogas.”",a:["tráfico","tráfego","trânsito","trajeto","transporte"],c:"Tráfico é comércio ilegal; tráfego é o movimento de veículos."},
{id:"p2-07",n:1,e:"Em “O guarda deve <strong>zelar</strong> pelos bens públicos”, a palavra destacada pode ser substituída por",a:["cuidar.","desistir.","abandonar.","vender.","avaliar."],c:"Zelar = cuidar com atenção. A troca mantém a preposição: “cuidar dos bens”."},
{id:"p2-08",n:1,e:"O antônimo de “aprovado” é",a:["reprovado.","aprovável.","aprovador.","provado.","comprovado."],c:"Aprovado e reprovado são antônimos complementares: não há meio-termo."},
{id:"p2-09",n:1,e:"Em “O motorista <strong>infringiu</strong> a lei”, a palavra destacada significa",a:["violou.","cumpriu.","aplicou.","criou.","explicou."],c:"Infringir = violar. Não confunda com “infligir” (aplicar pena)."},
{id:"p2-10",n:1,e:"Em “A <strong>sessão</strong> da Câmara começou às 9h”, a palavra destacada significa",a:["reunião.","setor.","ato de ceder.","parte de um livro.","divisão de uma loja."],c:"Sessão = reunião, tempo de duração. Seção = setor; cessão = ato de ceder."},
{id:"p2-11",n:1,tx:"ta",e:"No 1º parágrafo, a palavra “localizada” pode ser substituída, sem alteração de sentido, por",a:["encontrada.","perdida.","furtada.","vendida.","consertada."],c:"Localizar = encontrar. “Perdida” é o oposto."},
{id:"p2-12",n:1,tx:"ta",e:"No trecho “acionou a equipe pelo telefone 153”, o verbo “acionou” equivale a",a:["chamou.","dispensou.","criticou.","acompanhou.","substituiu."],c:"Acionar a equipe = chamar, pôr em ação."},
{id:"p2-13",n:1,tx:"tb",e:"Em “Nunca trocamos uma palavra além do ‘bom dia’”, o antônimo de “nunca” é",a:["sempre.","jamais.","nem.","ainda.","talvez."],c:"“Jamais” é sinônimo de “nunca”, não antônimo."},
{id:"p2-14",n:1,e:"A palavra que funciona como hiperônimo de “carro”, “moto” e “ônibus” é",a:["veículos.","rodas.","motoristas.","estradas.","combustíveis."],c:"Hiperônimo é a categoria geral que inclui os itens específicos."},
{id:"p2-15",n:1,e:"Em “O suspeito foi preso em <strong>flagrante</strong>”, a expressão indica que ele foi preso",a:["no momento em que cometia o crime.","de forma perfumada.","dias depois do crime.","por engano.","sem testemunhas."],c:"Flagrante = ato surpreendido no momento. “Fragrante” é perfumado."},
{id:"p2-16",n:1,e:"O antônimo de “legal” formado por prefixo é",a:["ilegal.","legalizado.","legalmente.","legalidade.","legislativo."],c:"O prefixo “i-” (variação de “in-”) indica negação."},
{id:"p2-17",n:1,e:"Em “A prefeitura vai <strong>cassar</strong> a licença do estabelecimento”, a palavra destacada significa",a:["anular.","perseguir.","conceder.","renovar.","cadastrar."],c:"Cassar = anular. “Caçar”, homófono, é perseguir animais."},
{id:"p2-18",n:1,e:"O antônimo de “satisfação” é",a:["insatisfação.","alegria.","prazer.","contentamento.","gosto."],c:"As demais são sinônimas de satisfação."},
{id:"p2-19",n:1,tx:"td",e:"No 2º parágrafo, o verbo de sentido oposto a “absorvem” é",a:["liberam.","fazem.","ajuda.","acontece.","resfriar."],c:"Os materiais absorvem o calor e o liberam: absorver x liberar."},
{id:"p2-20",n:1,e:"Em “O pacote chegou <strong>intacto</strong>”, a palavra destacada significa",a:["inteiro, sem dano.","quebrado.","atrasado.","incompleto.","usado."],c:"Intacto = sem dano. Sinônimo de “incólume”."},
{id:"p2-21",n:2,tx:"tc",e:"No 1º parágrafo, “reconstituir ocorrências” significa",a:["refazer a sequência dos fatos das ocorrências.","impedir as ocorrências.","esconder as ocorrências.","multiplicar as ocorrências.","encerrar as ocorrências."],c:"Reconstituir = recompor o que aconteceu, a partir das imagens."},
{id:"p2-22",n:2,tx:"tc",e:"Em “Essas tarefas dependem de pessoas presentes no território”, a forma “dependem de” pode ser substituída, sem alteração de sentido, por",a:["exigem.","dispensam.","prescindem de.","evitam.","substituem."],c:"Depender de = exigir. “Dispensam” e “prescindem de” dizem o contrário."},
{id:"p2-23",n:2,e:"“A ação não <strong>prescinde</strong> de planejamento.” A frase significa que a ação",a:["depende de planejamento.","dispensa planejamento.","proíbe o planejamento.","antecede o planejamento.","substitui o planejamento."],c:"Prescindir = dispensar. “Não prescindir” = não poder dispensar = depender."},
{id:"p2-24",n:2,tx:"ta",e:"No 3º parágrafo, a palavra “decisiva” pode ser substituída, sem alteração de sentido, por",a:["determinante.","irrelevante.","duvidosa.","recente.","tímida."],c:"Decisiva = que decide o resultado, determinante."},
{id:"p2-25",n:2,tx:"tb",e:"Em “Nenhuma das hipóteses era da minha conta”, a expressão “era da minha conta” significa",a:["dizia respeito a mim.","cabia no meu orçamento.","era uma dívida minha.","fazia parte das minhas contas.","era culpa minha."],c:"Expressão fixa: “ser da conta de alguém” = dizer respeito a ele. As demais tomam “conta” no sentido financeiro."},
{id:"p2-26",n:2,e:"Em “O relatório foi <strong>conciso</strong>”, o antônimo da palavra destacada é",a:["prolixo.","breve.","sucinto.","resumido.","objetivo."],c:"Conciso = breve; o oposto é prolixo, longo demais. As demais são sinônimas."},
{id:"p2-27",n:2,e:"Em “A moradora <strong>pegou</strong> um resfriado”, o verbo destacado pode ser substituído por",a:["contraiu.","segurou.","alcançou.","prendeu.","transportou."],c:"Polissemia: “pegar” doença = contrair. As outras são sentidos de “pegar” em outros contextos."},
{id:"p2-28",n:2,e:"Em “As partes <strong>fecharam</strong> o acordo”, o verbo destacado equivale a",a:["firmaram.","interditaram.","trancaram.","bloquearam.","desfizeram."],c:"Fechar um acordo = concluí-lo, firmá-lo. “Interditar” serve para “fechar a rua”."},
{id:"p2-29",n:2,e:"Em “Ele <strong>aspira</strong> ao cargo de inspetor”, o verbo destacado significa",a:["deseja.","respira.","recusa.","ocupa.","abandona."],c:"Aspirar a = desejar. “Aspirar” sem preposição pode significar respirar, inspirar."},
{id:"p2-30",n:2,e:"A relação de sentido entre “comprar” e “vender” é a mesma que entre",a:["dar e receber.","alto e baixo.","vivo e morto.","quente e frio.","feliz e infeliz."],c:"Antônimos recíprocos: a mesma cena vista dos dois lados."},
{id:"p2-31",n:2,e:"A relação de sentido entre “presente” e “ausente” é a mesma que entre",a:["aprovado e reprovado.","morno e quente.","grande e pequeno.","rico e pobre.","cedo e tarde."],c:"Complementares: não há meio-termo; quem não está presente está ausente."},
{id:"p2-32",n:2,e:"Assinale a frase em que o vocabulário está empregado corretamente.",a:["A prefeitura vai ratificar o acordo já assinado, confirmando-o.","O jornal vai ratificar o erro publicado ontem.","O juiz expediu o mandato de busca.","O guarda agiu com descrição para não chamar atenção.","O condutor infligiu as regras de trânsito."],c:"Ratificar = confirmar. Nas outras: retificar o erro, mandado, discrição e infringiu."},
{id:"p2-33",n:2,e:"Complete corretamente: “A ______ eleitoral fica no térreo da escola.”",a:["seção","sessão","cessão","sucessão","concessão"],c:"Seção = setor, divisão (a seção eleitoral). Sessão é reunião; cessão é o ato de ceder."},
{id:"p2-34",n:2,e:"“Uma moto foi abandonada na praça. O veículo estava sem placa.” A expressão “O veículo” retoma",a:["a moto.","a praça.","a placa.","o dono.","o guarda."],c:"Hiperônimo retomando hipônimo: “veículo” retoma “moto”."},
{id:"p2-35",n:2,e:"Em “O atendimento foi <strong>célere</strong>”, a palavra destacada significa",a:["rápido.","demorado.","caro.","gentil.","confuso."],c:"Célere = rápido. O antônimo é moroso."},
{id:"p2-36",n:2,e:"“A medida foi <strong>inócua</strong>.” Isso significa que a medida",a:["não produziu efeito.","causou danos graves.","foi muito eficaz.","foi ilegal.","foi aprovada."],c:"Inócuo = sem efeito, inofensivo."},
{id:"p2-37",n:2,e:"O antônimo de “efêmero” é",a:["duradouro.","passageiro.","breve.","rápido.","momentâneo."],c:"Efêmero = passageiro. As alternativas B a E são sinônimas."},
{id:"p2-38",n:2,e:"Um produto “inflamável” é aquele",a:["que pega fogo com facilidade.","que não pega fogo.","que apaga incêndios.","que resiste ao calor.","que não tem cheiro."],c:"Aqui, “in-” não nega: inflamável e flamável têm o mesmo sentido."},
{id:"p2-39",n:2,tx:"td",e:"No 3º parágrafo, “Por esse motivo” pode ser substituído, sem alteração de sentido, por",a:["Por isso.","Apesar disso.","Ao contrário.","Antes disso.","Mesmo assim."],c:"Ambos indicam conclusão. “Apesar disso” e “mesmo assim” indicam concessão."},
{id:"p2-40",n:2,tx:"ta",e:"No 2º parágrafo, em “pretende instalar um rastreador”, o verbo “pretende” equivale a",a:["tem a intenção de.","já conseguiu.","foi proibido de.","desistiu de.","finge."],c:"Pretender = ter a intenção. O falso cognato “fingir” vem do inglês “pretend”."},
{id:"p2-41",n:3,tx:"tc",e:"No 1º parágrafo, a expressão “sem dúvida” pode ser substituída, mantendo o sentido, por",a:["certamente.","talvez.","possivelmente.","raramente.","dificilmente."],c:"“Sem dúvida” expressa certeza. “Talvez” e “possivelmente” reduzem o grau de certeza."},
{id:"p2-42",n:3,tx:"tc",e:"No 3º parágrafo, a frase “Custa.” tem o sentido de",a:["é, de fato, caro.","é difícil de entender.","demora para acontecer.","não vale a pena.","é barato."],c:"“Custa” retoma “custa caro” e confirma a objeção. “Custar” no sentido de “ser difícil” existe, mas não é o deste contexto."},
{id:"p2-43",n:3,tx:"tc",e:"No último parágrafo, “servir de desculpa” pode ser substituído, sem alteração de sentido, por",a:["servir de pretexto.","servir de prova.","servir de exemplo.","servir de solução.","servir de aviso."],c:"Aqui “desculpa” é justificativa aparente, pretexto, e não pedido de perdão."},
{id:"p2-44",n:3,tx:"tb",e:"No 1º parágrafo, a expressão “faça sol ou faça chuva” equivale a",a:["em qualquer circunstância.","somente quando chove.","somente quando faz sol.","raramente.","por obrigação."],c:"Expressão fixa de sentido figurado: sempre, independentemente das condições."},
{id:"p2-45",n:3,tx:"tb",e:"No 2º parágrafo, em “todas me ocuparam até o trabalho”, o verbo “ocuparam” significa",a:["preencheram meus pensamentos.","me deram emprego.","me atrasaram.","me levaram de carro.","me acompanharam fisicamente."],c:"As hipóteses “ocuparam” a mente do narrador durante o trajeto. “Dar emprego” é outro sentido de “ocupar”."},
{id:"p2-46",n:3,e:"Em “Tive <strong>receio</strong> de que a chuva atrapalhasse a operação”, a palavra que substitui a destacada sem aumentar a intensidade é",a:["apreensão.","pavor.","terror.","pânico.","horror."],c:"Receio e apreensão são temores leves. As demais indicam medo intenso."},
{id:"p2-47",n:3,e:"Em “O vereador é <strong>econômico</strong> com o dinheiro público”, a palavra que mantém o sentido e o valor positivo é",a:["comedido.","pão-duro.","avarento.","mesquinho.","sovina."],c:"As alternativas B a E têm valor negativo; mudariam o tom de elogio para crítica."},
{id:"p2-48",n:3,e:"Assinale a alternativa em que as duas palavras destacadas estão empregadas corretamente.",a:["O guarda <strong>cumprimentou</strong> o <strong>eminente</strong> juiz antes da audiência.","O motorista <strong>infligiu</strong> a lei e teve a habilitação <strong>caçada</strong>.","A operação reduziu o <strong>tráfico</strong> de veículos e o perigo <strong>eminente</strong>.","O jornal <strong>ratificou</strong> o erro e pediu <strong>descrição</strong> aos leitores.","A <strong>sessão</strong> de achados e perdidos fica perto da <strong>sela</strong> dos presos."],c:"Cumprimentar (saudar) e eminente (ilustre) estão certos. Nas outras: infringiu/cassada; tráfego/iminente; retificou/discrição; seção/cela."},
{id:"p2-49",n:3,e:"Em “O médico disse que o ferimento era <strong>leve</strong>”, o antônimo da palavra destacada, no contexto, é",a:["grave.","pesado.","escuro.","lento.","difícil."],c:"“Pesado” é antônimo de “leve” quanto ao peso, mas, para ferimento, o oposto é “grave”."},
{id:"p2-50",n:3,e:"Assinale a reescrita que mantém o sentido de “A abordagem dispensou a presença de testemunhas”.",a:["A abordagem prescindiu da presença de testemunhas.","A abordagem precisou da presença de testemunhas.","A abordagem exigiu a presença de testemunhas.","A abordagem dependeu da presença de testemunhas.","A abordagem impôs a presença de testemunhas."],c:"Prescindir de = dispensar. As demais invertem o sentido."},
{id:"p2-51",n:3,e:"“Os guardas apreenderam um revólver e uma faca. ______ foram encaminhadas à delegacia.” Completa corretamente a lacuna:",a:["As armas","Os objetos","Os revólveres","As facas","Os materiais"],c:"O hiperônimo “as armas” abrange os dois itens e concorda com “encaminhadas”. “Os objetos” pediria “encaminhados”."},
{id:"p2-52",n:3,e:"Assinale a frase em que “ponto” tem o sentido de “aspecto, questão”.",a:["Esse é o ponto principal da discussão.","O ônibus parou no ponto.","Ele bateu o ponto às 8h.","A carne está no ponto.","Coloque um ponto no fim da frase."],c:"Polissemia: parada, registro de horário, cozimento ideal e sinal gráfico são outros sentidos."},
{id:"p2-53",n:3,e:"Complete corretamente: “O juiz ______ o pedido, e a liberdade foi concedida.”",a:["deferiu","indeferiu","diferiu","diferenciou","adiou"],c:"Deferir = conceder. Indeferir é negar; diferir é adiar ou ser diferente."},
{id:"p2-54",n:3,e:"Em “A prefeitura recebeu uma doação <strong>vultosa</strong>”, a palavra destacada significa",a:["de grande valor.","de rosto inchado.","insignificante.","anônima.","irregular."],c:"Vultoso = volumoso, de grande valor. Vultuoso (com “u”) refere-se a rosto inchado e avermelhado."},
{id:"p2-55",n:3,e:"“O guarda emprestou a lanterna ao colega.” Assinale a reescrita que mantém o sentido usando o antônimo recíproco.",a:["O colega tomou emprestada a lanterna do guarda.","O colega emprestou a lanterna ao guarda.","O guarda devolveu a lanterna ao colega.","O colega comprou a lanterna do guarda.","O guarda pediu a lanterna ao colega."],c:"Emprestar e tomar emprestado descrevem a mesma cena pelos dois lados. (B) inverte quem empresta."},
{id:"p2-56",n:3,e:"Assinale o par de antônimos que admite meio-termo.",a:["jovem / idoso","vivo / morto","presente / ausente","verdadeiro / falso","casado / solteiro"],c:"Entre jovem e idoso há “adulto”, “meia-idade”: antônimos graduais. Os demais são complementares."},
{id:"p2-57",n:3,e:"Em “Foi um comportamento <strong>atípico</strong> para o horário”, a palavra destacada significa",a:["fora do padrão.","muito comum.","típico da região.","perigoso.","ilegal."],c:"O prefixo “a-” nega “típico”: o que não é habitual."},
{id:"p2-58",n:3,e:"Em “O guarda fez o <strong>registro</strong> da ocorrência”, assinale a substituição que ALTERA o sentido.",a:["o cancelamento","o relato formal","a anotação","o lançamento","o apontamento"],c:"Registrar é anotar formalmente; cancelar é desfazer. As demais mantêm a ideia de registrar."},
{id:"p2-59",n:3,tx:"ta",e:"No último parágrafo, a expressão “tem sido decisiva” pode ser substituída, mantendo o sentido e o grau de certeza, por",a:["tem sido fundamental.","foi a única solução.","será sempre suficiente.","nunca foi importante.","deve ser obrigatória."],c:"Mantém tempo e intensidade. (B) e (C) absolutizam; (D) contradiz; (E) muda para obrigação."},
{id:"p2-60",n:3,e:"Assinale a frase em que “sede” se pronuncia com “é” aberto.",a:["A sede da Guarda fica no centro.","Os guardas sentiram sede após a corrida.","Ele bebeu água para matar a sede.","Tenho sede de justiça.","A sede apertou ao meio-dia."],c:"Homógrafos: sede (local) tem “é” aberto; sede (vontade de beber, também em sentido figurado) tem “ê” fechado."}
];

BANCO["pt-3"] = [
{id:"p3-01",n:1,e:"Assinale a frase em que “fogo” está em sentido próprio.",a:["Os bombeiros controlaram o fogo no terreno.","A discussão pegou fogo.","O time está pegando fogo no campeonato.","Ele tinha fogo nos olhos.","Aquela reunião foi um fogo cruzado de críticas."],c:"Só em (A) há fogo de verdade. Nas demais, o sentido é figurado."},
{id:"p3-02",n:1,e:"Em “Ele tem um coração de pedra”, a expressão “coração de pedra” indica",a:["insensibilidade.","força física.","doença cardíaca.","peso excessivo.","coragem."],c:"Sentido figurado: a dureza da pedra representa a falta de sentimentos."},
{id:"p3-03",n:1,e:"Assinale a frase que apresenta comparação.",a:["O guarda era forte como um touro.","O guarda era um touro.","Li Machado de Assis.","Morri de rir.","O vento uivava."],c:"Há o conectivo “como”. (B) é metáfora; (C), metonímia; (D), hipérbole; (E), personificação."},
{id:"p3-04",n:1,e:"Em “Já te liguei mil vezes”, a figura de linguagem é",a:["hipérbole.","eufemismo.","metáfora.","onomatopeia.","catacrese."],c:"Exagero intencional para dar ênfase."},
{id:"p3-05",n:1,e:"Em “O vento uivava na janela”, a figura de linguagem é",a:["personificação.","hipérbole.","metonímia.","eufemismo.","ironia."],c:"O vento recebe uma ação de ser vivo (uivar)."},
{id:"p3-06",n:1,e:"A expressão “pisar na bola” significa",a:["errar, falhar.","jogar futebol.","chutar com força.","ganhar uma disputa.","tropeçar na rua."],c:"Expressão idiomática: sentido figurado fixo."},
{id:"p3-07",n:1,e:"A expressão “custar os olhos da cara” significa",a:["ser muito caro.","causar dor nos olhos.","ser muito bonito.","ser fácil de achar.","estar em promoção."],c:"Expressão idiomática de exagero para indicar preço alto."},
{id:"p3-08",n:1,e:"Em “Trim! O telefone tocou na base”, “trim” é exemplo de",a:["onomatopeia.","metáfora.","eufemismo.","antítese.","catacrese."],c:"Palavra que imita um som."},
{id:"p3-09",n:1,e:"Em “O depoente faltou com a verdade”, há eufemismo, porque a expressão suaviza a ideia de que ele",a:["mentiu.","se atrasou.","esqueceu os fatos.","não compareceu.","ficou em silêncio."],c:"“Faltar com a verdade” é forma suave de dizer “mentir”."},
{id:"p3-10",n:1,e:"Em “O pé da mesa quebrou”, a expressão “pé da mesa” é exemplo de",a:["catacrese.","hipérbole.","ironia.","eufemismo.","onomatopeia."],c:"Metáfora gasta, que virou o nome comum da peça."},
{id:"p3-11",n:1,e:"Em “A avenida é um estacionamento no horário de pico”, há",a:["metáfora.","comparação.","metonímia.","onomatopeia.","eufemismo."],c:"Semelhança sem conectivo: a avenida é um estacionamento."},
{id:"p3-12",n:1,e:"“Que motorista prudente: passou o sinal vermelho a 100 km/h.” A figura de linguagem é",a:["ironia.","hipérbole.","personificação.","catacrese.","comparação."],c:"O elogio “prudente” é desmentido pelo fato: diz o contrário do que pensa."},
{id:"p3-13",n:1,e:"Denotação é",a:["o sentido literal da palavra, registrado no dicionário.","o sentido figurado criado pela frase.","a repetição de sons em um verso.","o exagero intencional.","a troca de uma palavra por outra semelhante."],c:"Conotação é o sentido figurado; denotação, o literal."},
{id:"p3-14",n:1,e:"A expressão “fazer vista grossa” significa",a:["fingir que não viu.","enxergar mal.","observar com atenção.","usar óculos.","ver de longe."],c:"Expressão idiomática: ignorar algo de propósito."},
{id:"p3-15",n:1,e:"Em “Ela tem uma voz doce”, ocorre",a:["sinestesia.","onomatopeia.","metonímia.","elipse.","ironia."],c:"Mistura de sentidos: voz (audição) e doce (paladar)."},
{id:"p3-16",n:1,tx:"te",e:"No verso “Minha terra tem palmeiras”, a palavra “terra” significa",a:["pátria, terra natal.","solo agrícola.","o planeta Terra.","poeira.","um terreno comprado."],c:"O eu lírico fala da terra natal, de que sente saudade."},
{id:"p3-17",n:1,e:"A expressão “dar com a língua nos dentes” significa",a:["revelar um segredo.","morder a língua.","falar uma língua estrangeira.","ficar em silêncio.","ir ao dentista."],c:"Expressão idiomática: contar o que deveria ficar em segredo."},
{id:"p3-18",n:1,e:"Em um boletim de ocorrência, deve predominar a linguagem",a:["denotativa, objetiva e precisa.","conotativa, com metáforas.","irônica, para criticar o infrator.","poética, com rimas.","hiperbólica, para dar ênfase."],c:"Textos oficiais pedem sentido literal e uma única leitura possível."},
{id:"p3-19",n:1,e:"Em “O rato roeu a roupa do rei de Roma”, há",a:["aliteração.","assonância.","metáfora.","eufemismo.","antítese."],c:"Repetição do som consonantal “r”."},
{id:"p3-20",n:1,e:"A expressão “enxugar gelo” significa",a:["fazer um esforço inútil.","secar a cozinha.","resfriar uma bebida.","resolver rápido um problema.","trabalhar no frio."],c:"Expressão idiomática: o gelo derrete enquanto se enxuga, o esforço nunca termina."},
{id:"p3-21",n:2,e:"Em “Li Machado de Assis nas férias”, há metonímia porque se emprega",a:["o autor no lugar da obra.","a obra no lugar do autor.","a parte no lugar do todo.","o efeito no lugar da causa.","a marca no lugar do produto."],c:"Lê-se a obra, não a pessoa: autor pela obra."},
{id:"p3-22",n:2,e:"Em “O Paço Municipal anunciou novas regras”, ocorre",a:["metonímia, com o lugar no lugar da instituição.","metáfora, por semelhança.","personificação de um prédio.","hipérbole, por exagero.","catacrese."],c:"O prédio representa a administração que funciona nele: relação de proximidade."},
{id:"p3-23",n:2,e:"Em “Depois do serviço, bebeu dois copos”, a metonímia consiste em empregar",a:["o continente no lugar do conteúdo.","o autor no lugar da obra.","o abstrato no lugar do concreto.","a matéria no lugar do objeto.","o efeito no lugar da causa."],c:"Bebe-se o líquido, não o copo."},
{id:"p3-24",n:2,e:"Em “Riso e choro dividiam a mesma sala”, a figura é",a:["antítese.","paradoxo.","gradação.","eufemismo.","onomatopeia."],c:"Ideias opostas lado a lado, sem contradição lógica."},
{id:"p3-25",n:2,e:"Em “Andou, correu, voou para chegar a tempo”, há",a:["gradação.","antítese.","eufemismo.","catacrese.","lítotes."],c:"Enumeração em intensidade crescente."},
{id:"p3-26",n:2,e:"Em “Ele não é nada bobo”, a figura é",a:["lítotes.","hipérbole.","metáfora.","paradoxo.","pleonasmo."],c:"Afirma (é esperto) negando o contrário (não é bobo)."},
{id:"p3-27",n:2,tx:"tc",e:"No 3º parágrafo, “transforma a prevenção em arquivo” é uma expressão",a:["figurada, que mostra a prevenção reduzida a mero registro.","literal, que descreve um setor de arquivos.","técnica, própria da informática.","irônica, que elogia as câmeras.","onomatopeica."],c:"Não há transformação física: é imagem do que deveria evitar o problema e só o registra."},
{id:"p3-28",n:2,tx:"td",e:"A expressão “ilha de calor” é empregada em sentido",a:["figurado: a área mais quente é vista como uma ilha cercada por áreas mais frescas.","literal: uma porção de terra cercada de água.","literal: uma praia muito quente.","irônico, para criticar os especialistas.","hiperbólico, para exagerar o frio."],c:"Não há água nem ilha: a imagem nasce da semelhança (uma região isolada pelas condições ao redor)."},
{id:"p3-29",n:2,tx:"tf",e:"O efeito de humor da tirinha se aproxima da",a:["ironia, pois a atitude do homem contradiz sua própria reclamação.","eufemismo, pois a crítica é suavizada.","onomatopeia, pois há sons imitados.","catacrese, pois há metáfora gasta.","sinestesia, pois há mistura de sentidos."],c:"É a ironia de situação: quem reclama da sujeira suja a praça."},
{id:"p3-30",n:2,e:"Em “Faltam braços na lavoura”, a palavra “braços” representa",a:["trabalhadores, numa relação de parte pelo todo.","máquinas agrícolas.","braços feridos.","ferramentas de colheita.","a força da natureza."],c:"Metonímia do tipo parte pelo todo (sinédoque)."},
{id:"p3-31",n:2,e:"Em “A juventude ocupou as ruas”, há metonímia porque se emprega",a:["o abstrato no lugar do concreto.","o concreto no lugar do abstrato.","o continente pelo conteúdo.","o autor pela obra.","a marca pelo produto."],c:"“Juventude” (abstrato) está no lugar de “os jovens” (concreto)."},
{id:"p3-32",n:2,e:"Assinale a frase com pleonasmo vicioso.",a:["Vamos subir para cima do palco.","Vi com meus próprios olhos.","Ele gosta de futebol; ela, de vôlei.","Chegou, olhou, saiu.","O vento uivava."],c:"“Subir” já indica “para cima”: repetição sem função expressiva. (B) é pleonasmo literário, intencional."},
{id:"p3-33",n:2,e:"Em “Ele gosta de futebol; ela, de vôlei”, há",a:["zeugma.","polissíndeto.","pleonasmo.","antítese.","catacrese."],c:"Omissão de um termo já citado (gosta)."},
{id:"p3-34",n:2,e:"Em “E corria, e gritava, e pedia ajuda”, há",a:["polissíndeto.","assíndeto.","zeugma.","elipse.","lítotes."],c:"Repetição do conectivo “e”."},
{id:"p3-35",n:2,e:"A antonomásia “a Princesa d’Oeste” refere-se a",a:["Campinas.","São Paulo.","Rio de Janeiro.","Brasília.","Santos."],c:"Antonomásia: nomear por uma característica ou apelido consagrado."},
{id:"p3-36",n:2,e:"Em “Fiquei um século parado no trânsito”, a figura é",a:["hipérbole.","ironia.","metonímia.","eufemismo.","catacrese."],c:"Exagero sem inversão de sentido. Seria ironia se dissesse, por exemplo, “que trânsito rápido!”."},
{id:"p3-37",n:2,e:"No verso de Camões “é ferida que dói, e não se sente”, há",a:["paradoxo.","comparação.","metonímia.","onomatopeia.","catacrese."],c:"A mesma ferida dói e não se sente: opostos no mesmo ser."},
{id:"p3-38",n:2,tx:"te",e:"No poema, a oposição entre “aqui” e “lá” constitui",a:["antítese.","onomatopeia.","catacrese.","eufemismo.","pleonasmo vicioso."],c:"Ideias opostas aproximadas (o lugar onde está e a terra natal)."},
{id:"p3-39",n:2,e:"Assinale a alternativa que apresenta comparação.",a:["Os prédios, tal qual gigantes, cercavam a praça.","Os prédios eram gigantes cercando a praça.","A praça dorme depois das dez.","A juventude ocupou a praça.","A praça era um deserto à noite."],c:"“Tal qual” é conectivo de comparação. (B) e (E) são metáforas."},
{id:"p3-40",n:2,e:"A expressão “tirar o cavalo da chuva” significa",a:["desistir de uma expectativa.","proteger um animal.","começar uma viagem.","esperar a chuva passar.","vencer uma corrida."],c:"Expressão idiomática."},
{id:"p3-41",n:3,e:"Assinale a alternativa em que NÃO há linguagem figurada.",a:["O guarda registrou a ocorrência às 22h.","A cidade engoliu o rio com o asfalto.","A notícia caiu como uma bomba na redação.","O silêncio gritava na sala vazia.","Ele é uma raposa nos negócios."],c:"Só (A) é denotativa. As demais trazem metáfora, comparação e personificação."},
{id:"p3-42",n:3,e:"Ao comunicar um óbito, o médico disse à família: “Ele descansou.” A figura empregada é",a:["eufemismo.","ironia.","hipérbole.","antítese.","catacrese."],c:"Suaviza a ideia de morte, sem intenção crítica."},
{id:"p3-43",n:3,e:"Em “Ganha a vida com o suor do rosto”, a metonímia consiste em empregar",a:["o efeito no lugar da causa.","a causa no lugar do efeito.","o continente pelo conteúdo.","o lugar pela instituição.","a marca pelo produto."],c:"O suor é efeito do trabalho, que é a causa."},
{id:"p3-44",n:3,e:"Assinale a alternativa com catacrese.",a:["O dente de alho caiu no chão.","Ela é uma flor de pessoa.","O tempo voa.","Seus olhos são estrelas.","Ele é um leão no trabalho."],c:"“Dente de alho” é o nome comum da parte do alho. As demais são metáforas criativas."},
{id:"p3-45",n:3,e:"Assinale a alternativa que apresenta paradoxo.",a:["Era um silêncio ensurdecedor.","Riso e choro dividiam a sala.","O dia e a noite se alternam.","Uns chegavam, outros partiam.","Ganhou pouco e gastou muito."],c:"O silêncio não pode ensurdecer: opostos no mesmo ser (oxímoro). As demais são antíteses."},
{id:"p3-46",n:3,tx:"tc",e:"No trecho “A câmera registra; ela não acolhe a vítima, não orienta o pedestre perdido”, ao negar à câmera ações humanas, o autor",a:["destaca, por contraste, que essas ações dependem de pessoas.","atribui sentimentos à câmera para elogiá-la.","usa ironia para defender as câmeras.","emprega hipérbole para exagerar o custo dos agentes.","usa eufemismo para suavizar a crítica aos agentes."],c:"A personificação negada mostra o limite da tecnologia e sustenta a tese."},
{id:"p3-47",n:3,e:"Assinale a alternativa com sinestesia.",a:["Havia um silêncio pesado na sala.","A sala parecia um forno.","Morri de rir com a história.","Li Camões na escola.","O vento chorava lá fora."],c:"Silêncio (audição) + pesado (tato). As demais: comparação, hipérbole, metonímia e personificação."},
{id:"p3-48",n:3,e:"Assinale a frase mais adequada para um relatório de ocorrência.",a:["O condutor deixou o local em alta velocidade, sentido centro.","O condutor saiu voando como um foguete.","O motorista evaporou diante dos nossos olhos.","O carro sumiu num piscar de olhos.","O veículo fugiu feito um raio."],c:"Relatório pede denotação: direção e fato, sem figuras."},
{id:"p3-49",n:3,e:"Após três horas de atraso, o passageiro comentou: “Pontualidade impecável!” A fala constitui",a:["ironia, pois o elogio contradiz o fato.","hipérbole, pois exagera o atraso.","eufemismo, pois suaviza a crítica.","lítotes, pois nega o contrário.","comparação, pois aproxima dois termos."],c:"Inverte o sentido: diz “pontual” querendo dizer “atrasado”."},
{id:"p3-50",n:3,e:"Em “Passou Bombril na panela”, a metonímia emprega",a:["a marca no lugar do produto.","o autor pela obra.","a parte pelo todo.","o abstrato pelo concreto.","o lugar pela instituição."],c:"Nome de marca usado para o produto em geral (palha de aço)."},
{id:"p3-51",n:3,e:"Nos versos “É ferida que dói... é um contentamento descontente, é dor...”, a repetição de “é” no início é",a:["anáfora, figura de construção.","catáfora, mecanismo de coesão.","elipse.","zeugma.","pleonasmo vicioso."],c:"Como figura, anáfora é a repetição no início de versos ou frases; não confundir com a anáfora coesiva (retomada)."},
{id:"p3-52",n:3,e:"Em “Na praça, só dois guardas”, ocorre",a:["elipse do verbo “haver”.","zeugma do verbo “ser”.","pleonasmo.","polissíndeto.","catacrese."],c:"O verbo (“havia”) é omitido sem ter aparecido antes: elipse. Seria zeugma se já tivesse sido citado."},
{id:"p3-53",n:3,e:"Em “O resultado da operação não foi dos piores”, há",a:["lítotes, que sugere um resultado razoável ou bom.","hipérbole, que exagera o fracasso.","ironia, que critica a operação.","catacrese.","assonância."],c:"Nega o contrário (“piores”) para afirmar de modo atenuado."},
{id:"p3-54",n:3,e:"Em “A Câmara aprovou o projeto”, ocorre",a:["metonímia: a instituição no lugar dos vereadores.","personificação de um prédio.","metáfora por semelhança.","hipérbole.","eufemismo."],c:"Quem aprova são os vereadores; a Câmara os representa por proximidade. Não há ação humana atribuída a um ser não humano."},
{id:"p3-55",n:3,e:"“Os moradores reclamam que a prefeitura faz vista grossa para o lixo acumulado.” A frase significa que a prefeitura",a:["finge não ver o problema.","observa o problema com atenção.","recolhe o lixo com frequência.","enxerga mal o problema.","aumentou a fiscalização."],c:"Expressão idiomática: ignorar algo de propósito."},
{id:"p3-56",n:3,e:"“Repetir que o trânsito é perigoso nos feriados é chover no molhado.” A expressão destacada indica que repetir isso é",a:["dizer o óbvio.","dar uma notícia nova.","exagerar o perigo.","prever a chuva.","criticar os motoristas."],c:"Chover no molhado = insistir no que todos já sabem."},
{id:"p3-57",n:3,e:"Assinale a afirmação INCORRETA.",a:["A comparação dispensa o conectivo, e a metáfora o exige.","A metonímia baseia-se em proximidade, e não em semelhança.","A ironia inverte o sentido do que se diz.","O eufemismo suaviza uma ideia desagradável.","A catacrese é uma metáfora que virou nome comum."],c:"É o contrário: a comparação tem conectivo; a metáfora não."},
{id:"p3-58",n:3,e:"Assinale a frase em que há hipérbole, e não ironia.",a:["Esperei uma eternidade pelo ônibus.","Que ônibus pontual: só duas horas de atraso.","Belo trabalho: o relatório veio todo errado.","Que dia tranquilo, com três ocorrências ao mesmo tempo!","Parabéns pela organização: ninguém achou a viatura."],c:"(A) só exagera; as demais elogiam para criticar (ironia)."},
{id:"p3-59",n:3,e:"Em “A lua nua flutua na rua”, há",a:["assonância, pela repetição do som vocálico “u”.","aliteração, pela repetição de consoantes.","onomatopeia.","zeugma.","catacrese."],c:"Assonância repete vogais; aliteração, consoantes."},
{id:"p3-60",n:3,e:"Em “O novo regulamento abriu uma brecha para irregularidades”, a palavra “brecha” significa",a:["falha que permite a irregularidade.","buraco em uma parede.","regra rígida.","punição severa.","fiscalização rigorosa."],c:"Sentido figurado: uma abertura, não física, que deixa espaço para algo indevido."}
];

BANCO["pt-4"] = [
{id:"p4-01",n:1,e:"Assinale a frase corretamente pontuada.",a:["Durante a madrugada, a equipe percorreu o centro.","A equipe, percorreu o centro durante a madrugada.","A equipe percorreu, o centro durante a madrugada.","Os agentes da equipe da noite, percorreram o centro.","A equipe percorreu o centro, durante, a madrugada."],c:"A vírgula isola o adjunto adverbial deslocado. As outras separam sujeito e verbo, verbo e complemento ou partem o adjunto."},
{id:"p4-02",n:1,e:"Em “Moradores, mantenham distância da área”, a vírgula isola",a:["um vocativo.","um aposto.","o sujeito do verbo.","uma oração intercalada.","um adjunto adverbial."],c:"“Moradores” é chamamento: vocativo."},
{id:"p4-03",n:1,e:"Em “Foram apreendidos celulares, documentos e uma bicicleta”, as vírgulas separam",a:["itens de uma enumeração.","um vocativo.","orações adversativas.","um aposto.","o sujeito do verbo."],c:"Termos de mesma função enumerados."},
{id:"p4-04",n:1,e:"Em “Campinas, a Princesa d’Oeste, recebeu o evento”, as vírgulas isolam",a:["um aposto explicativo.","um vocativo.","uma conjunção deslocada.","uma oração restritiva.","um adjunto adverbial."],c:"“A Princesa d’Oeste” explica “Campinas”."},
{id:"p4-05",n:1,e:"Assinale a frase em que o ponto de interrogação está corretamente empregado.",a:["Quem chamou a equipe?","O guarda perguntou quem chamou a equipe?","Ninguém sabe quem chamou a equipe?","Quero saber quem chamou a equipe?","Ela não disse quem chamou a equipe?"],c:"Só a pergunta direta leva interrogação. As demais são perguntas indiretas ou declarações."},
{id:"p4-06",n:1,e:"Em “Foram apreendidos três objetos: um celular, uma carteira e um relógio”, os dois-pontos",a:["anunciam uma enumeração.","introduzem uma fala.","isolam um vocativo.","indicam dúvida.","separam sujeito e verbo."],c:"Os dois-pontos anunciam os itens que vêm a seguir."},
{id:"p4-07",n:1,e:"Em “A testemunha declarou: ‘Vi o carro avançar o sinal.’”, as aspas indicam",a:["citação literal da fala.","ironia.","palavra estrangeira.","título de obra.","gíria."],c:"Reproduzem exatamente as palavras da testemunha."},
{id:"p4-08",n:1,e:"Em “Eu vi... acho que eram dois homens”, as reticências indicam",a:["hesitação.","enumeração.","ordem.","citação.","conclusão."],c:"A fala é interrompida pela dúvida da testemunha."},
{id:"p4-09",n:1,e:"Assinale a frase com ERRO de pontuação.",a:["O motorista do caminhão, avançou o sinal.","O motorista do caminhão avançou o sinal.","Ontem, o motorista avançou o sinal.","O motorista, ontem, avançou o sinal.","O motorista avançou o sinal e foi autuado."],c:"A vírgula separa o sujeito (“o motorista do caminhão”) do verbo."},
{id:"p4-10",n:1,e:"Em “A equipe chegou rápido, mas o suspeito já tinha fugido”, a vírgula aparece antes de",a:["conjunção adversativa.","vocativo.","aposto.","conjunção aditiva com o mesmo sujeito.","pronome relativo restritivo."],c:"Antes de “mas” usa-se vírgula."},
{id:"p4-11",n:1,e:"Em “Campinas, 21 de março de 2027”, a vírgula separa",a:["o nome do lugar da data.","o sujeito do verbo.","um vocativo.","duas orações.","um aposto restritivo."],c:"Em datas, a vírgula separa o local."},
{id:"p4-12",n:1,e:"Em “O telefone da Guarda (153) funciona 24 horas”, os parênteses isolam",a:["uma informação acessória.","uma fala.","um vocativo.","uma ironia.","o verbo."],c:"Parênteses guardam informação complementar, de menor destaque."},

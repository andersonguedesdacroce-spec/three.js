const TEXTOS = {
tg1: "<strong>Equipe da Guarda atende duas ocorrências na mesma noite</strong><br><br>Durante ronda preventiva no Jardim Proença, uma equipe da Guarda Municipal se deparou com um motociclista caído na via, ferido após uma queda. Os agentes prestaram os primeiros socorros, sinalizaram o local e acionaram o Samu. Quando uma viatura da polícia militar chegou, a equipe repassou as informações e permaneceu dando apoio até a remoção da vítima.<br><br>Pouco depois, a equipe foi chamada a um galpão abandonado que pertence à prefeitura e não tem uso público. Lá, flagrou um homem saindo com fios de cobre retirados da instalação elétrica. O suspeito não resistiu e foi contido sem uso de força além da necessária.<br><br>Os agentes deixaram o portão do galpão como estava, impediram a entrada de curiosos até a chegada da perícia e conduziram o suspeito ao delegado de polícia de plantão.",
tg2: "<strong>Município de Vale Verde discute a criação de sua guarda</strong><br><br>O prefeito de Vale Verde, cidade fictícia de 40 mil habitantes, anunciou que pretende criar a guarda municipal por decreto, com efetivo de 80 agentes, todos desarmados no primeiro momento. Para comandar a corporação no primeiro ano, ele indicou um coronel da reserva da polícia militar, sem vínculo com a guarda.<br><br>O projeto apresentado à imprensa prevê que os agentes usem as patentes de soldado, cabo e sargento e propõe dispensar a ouvidoria, “por se tratar de uma guarda pequena e desarmada”.<br><br>Para cobrir a falta de efetivo nos primeiros meses, a prefeitura estuda usar os serviços da guarda de Serra Alta, município vizinho que faz divisa com Vale Verde.",
mt1a: "<strong>Guarda renova frota e reduz gasto com combustível</strong><br><br>A Guarda Municipal de Vila Nova, cidade fictícia, recebeu 12 viaturas novas. O tanque de cada uma comporta 50 litros. Em abril, uma delas gastou 3/5 do tanque na primeira semana e 1/4 do tanque na segunda. O litro do combustível custou R$ 6,40 no período. A Guarda informou ainda que, com a nova frota, a economia mensal estimada é de 0,15 do gasto anterior, que era de R$ 20.000,00.",
mt1b: "<strong>Relatório de ronda</strong><br><br>Na manhã de terça-feira, a equipe 3 da Guarda Municipal percorreu 18,6 km em ronda preventiva pelos parques da região norte. À tarde, percorreu 2/3 da distância feita pela manhã, em trajeto pelas escolas do bairro. A viatura saiu da base às 7h e retornou às 12h, na ronda da manhã.",
mt2a: "<strong>Escala de rondas do Parque Linear</strong><br><br>Três equipes da Guarda Municipal fazem rondas circulares no Parque Linear, partindo juntas do portão principal às 22h. A equipe A completa uma volta a cada 12 minutos; a equipe B, a cada 18 minutos; e a equipe C, a cada 30 minutos. Sempre que duas ou mais equipes passam juntas pelo portão, aproveitam para trocar informações.",
mt2b: "<strong>Distribuição de material</strong><br><br>A Secretaria de Segurança recebeu 72 coletes, 108 lanternas e 144 apitos. O material será distribuído em kits idênticos, sem sobra de nenhum item, com o maior número possível de kits.",
mt3a: "<strong>Furtos de bicicleta caem após campanha de registro</strong><br><br>Segundo balanço da Guarda Municipal de Vila Nova, cidade fictícia, os furtos de bicicleta somaram 250 ocorrências no primeiro semestre. Após uma campanha de registro das bicicletas, o número caiu 20% no segundo semestre. No terceiro semestre, houve aumento de 10% em relação ao segundo. Das bicicletas furtadas no primeiro semestre, 30% foram recuperadas.",
mt3b: "<strong>Compra de camisas de uniforme</strong><br><br>A Guarda Municipal de Vila Nova pretende comprar 200 camisas de uniforme. O fornecedor A cobra R$ 80,00 por camisa e oferece 15% de desconto para compras acima de 150 unidades. O fornecedor B cobra R$ 75,00 por camisa e oferece dois descontos sucessivos: 10% e, em seguida, mais 5% sobre o valor já reduzido.",
mt4a: "<strong>Gratificação por produtividade</strong><br><br>A Guarda Municipal de Vila Nova, cidade fictícia, destinou R$ 12.000,00 a uma gratificação por produtividade, a ser dividida entre três guardas, de forma diretamente proporcional ao número de ocorrências atendidas no mês: Ana atendeu 5, Bruno atendeu 7 e Carla atendeu 8.",
mt4b: "<strong>Planejamento de ronda</strong><br><br>Em um mapa de escala 1:50.000, o trajeto da ronda noturna mede 6 cm. Uma viatura percorre esse trajeto em 30 minutos, em velocidade constante. Para a ronda de reforço, o comando quer que o mesmo trajeto seja feito em 20 minutos.",
mt5a: "<strong>Consumo de material na Guarda</strong><br><br>O almoxarifado da Guarda Municipal de Vila Nova, cidade fictícia, registrou que 12 guardas consomem 480 litros de água potável em 8 dias de plantão. A direção quer prever o consumo para um evento que durará 10 dias, com 18 guardas escalados, mantido o consumo diário por pessoa.",
mt5b: "<strong>Mutirão de vistorias</strong><br><br>Uma equipe de 5 fiscais vistoria 60 estabelecimentos em 4 dias, trabalhando 6 horas por dia. Para um mutirão, a Prefeitura reunirá 10 fiscais, que trabalharão 8 horas por dia, e precisa vistoriar 160 estabelecimentos.",
mt6a: "<strong>Compra de coletes</strong><br><br>A Guarda Municipal de Vila Nova, cidade fictícia, comprou 5 coletes de mesmo preço. O fornecedor cobrou um frete fixo de R$ 30,00, e o valor total da compra foi de R$ 280,00.",
mt6b: "<strong>Cerca de um terreno</strong><br><br>Um terreno retangular, ao lado do quartel, tem comprimento 3 metros maior que a largura e área de 40 metros quadrados. A Prefeitura pretende cercá-lo.",
mt7a: "<strong>Compra de caixas de material</strong><br><br>A Guarda Municipal de Vila Nova, cidade fictícia, comprou caixas de dois tipos de material: A e B. Duas caixas do tipo A e três do tipo B custaram R$ 190,00. Uma caixa do tipo A e duas do tipo B custaram R$ 110,00.",
mt7b: "<strong>Pátio da Guarda</strong><br><br>No pátio da Guarda Municipal de Vila Nova há 20 veículos, entre carros e motocicletas, que somam 64 rodas.",
mt8a: "<strong>Parque da Guarda</strong><br><br>O parque que a Guarda Municipal de Vila Nova, cidade fictícia, patrulha é retangular, com 400 m por 150 m. Em volta há uma pista de caminhada de 1,8 km por volta. Um reservatório de 12 m³ abastece o parque e tem consumo de 400 litros por dia.",
mt8b: "<strong>Escala de plantão</strong><br><br>O plantão noturno da Guarda Municipal começa às 22h45 e termina às 6h15 do dia seguinte. Cada guarda faz 5 plantões por semana.",
mt9a: "<strong>Ocorrências atendidas, de janeiro a maio</strong><br><br>A tabela mostra o número de ocorrências atendidas pela Guarda Municipal de Vila Nova, cidade fictícia, em cada mês.<br><br><table><thead><tr><th>Mês</th><th>Ocorrências</th></tr></thead><tbody><tr><td>Janeiro</td><td>42</td></tr><tr><td>Fevereiro</td><td>38</td></tr><tr><td>Março</td><td>50</td></tr><tr><td>Abril</td><td>46</td></tr><tr><td>Maio</td><td>54</td></tr></tbody></table>",
mt9b: "<strong>Ocorrências do semestre por tipo</strong><br><br>No semestre, a Guarda registrou 400 ocorrências. O gráfico de setores do relatório mostra: furtos, 40%; perturbação do sossego, 25%; trânsito, 20%; outras, 15%.",
tp: "<strong>Guarda vistoria quiosques da orla do lago</strong><br><br>A Guarda Municipal procedeu, na manhã de ontem, à vistoria dos quiosques instalados às margens do lago do parque. A ação atende a um pedido dos frequentadores, que reclamavam do som alto nos fins de semana.<br><br>Os comerciantes foram informados das novas regras e terão 15 dias para se adequar. Segundo a coordenação, o descumprimento implica multa e, em caso de reincidência, a suspensão da licença.<br><br>A medida agradou aos moradores do entorno, com quem a Guarda se reuniu na semana passada. A corporação prefere orientar a multar, mas lembra que as regras a que todos devem obedecer estão afixadas em cada quiosque.",
tq: "<strong>Guarda encontra idoso desaparecido</strong><br><br>Um idoso de 78 anos que estava desaparecido desde a manhã de domingo foi encontrado por agentes da Guarda Municipal na tarde de ontem. Os guardas avistaram-no sentado em um banco da praça central, confuso e com frio.<br><br>Segundo a corporação, a equipe aproximou-se com calma, ofereceu-lhe água e conversou com ele até que se lembrasse do nome da filha. Não se sabe ainda como ele chegou ao centro.<br><br>A família agradeceu aos agentes e disse que nunca se esquecerá do cuidado com que o idoso foi tratado. Encaminhá-lo-ão, nos próximos dias, a uma avaliação médica.",
tr: "<strong>Guarda reforça rondas no terminal à noite</strong><br><br>A partir da próxima segunda-feira, a Guarda Municipal reforçará as rondas no terminal central, das 18h às 23h. A medida atende às reclamações de passageiros, que relataram furtos à saída das plataformas.<br><br>Os agentes circularão a pé e ficarão à disposição dos usuários para qualquer orientação. Segundo a coordenação, a operação deve durar de 10 a 30 de novembro e poderá ser estendida a outros terminais.<br><br>Há duas semanas, a corporação já havia instalado uma base móvel à frente da bilheteria. Quem precisar de ajuda deve dirigir-se a qualquer agente uniformizado.",
ta: "<strong>Bicicleta furtada é localizada após aviso de comerciante</strong><br><br>Uma bicicleta furtada na última quinta-feira foi localizada na manhã de sábado em uma praça da região central. Segundo a Guarda Municipal, um comerciante reconheceu o veículo pela foto que o dono havia divulgado nas redes sociais e acionou a equipe pelo telefone 153.<br><br>Os guardas encontraram a bicicleta presa a um poste, sem o cadeado original. Ninguém foi detido. O dono, um estudante de 19 anos, retirou o veículo no mesmo dia e disse que pretende instalar um rastreador.<br><br>De acordo com a corporação, a colaboração de moradores e comerciantes tem sido decisiva para a recuperação de objetos furtados na região.",
tb: "<strong>O ponto de ônibus</strong><br><br>Todo dia, às 6h40, a mesma senhora chega ao ponto antes de mim. Traz uma sacola de pano e um guarda-chuva, faça sol ou faça chuva. Nunca trocamos uma palavra além do “bom dia”, mas já sei que ela desce três pontos depois do meu e que prefere o banco da janela.<br><br>Na semana passada, ela não apareceu. O ônibus chegou, eu subi e passei a viagem inteira olhando para o banco da janela, vazio. Fiquei imaginando doenças, mudanças, aposentadorias. Nenhuma das hipóteses era da minha conta, e todas me ocuparam até o trabalho.<br><br>Na segunda-feira, lá estava ela, com a sacola e o guarda-chuva. Disse “bom dia”, como sempre. Respondi “bom dia”, como sempre. Mas desta vez eu sorri, e ela também. A cidade grande tem dessas coisas: a gente só percebe que conhecia alguém quando sente a falta dele.",
tc: "<strong>Câmera não substitui gente</strong><br><br>Toda vez que um bairro registra uma sequência de furtos, a primeira resposta é a mesma: instalar câmeras. Elas são úteis, sem dúvida. Ajudam a identificar suspeitos e a reconstituir ocorrências. Mas é um erro acreditar que, sozinhas, tornam a rua segura.<br><br>A câmera registra; ela não acolhe a vítima, não orienta o pedestre perdido, não percebe o morador que mudou de comportamento. Essas tarefas dependem de pessoas presentes no território, que conhecem a comunidade e são conhecidas por ela.<br><br>Dirão que contratar e formar agentes custa caro. Custa. Mas um equipamento que apenas grava o problema, sem ninguém para agir, sai mais caro ainda, porque transforma a prevenção em arquivo.<br><br>Câmeras devem existir. Só não podem servir de desculpa para tirar as pessoas das ruas.",
td: "<strong>Por que algumas ruas são mais quentes</strong><br><br>Em uma mesma cidade, a temperatura pode variar bastante de um bairro para outro. O fenômeno, conhecido como ilha de calor, aparece com mais força em áreas com muito asfalto, concreto e pouca vegetação.<br><br>Isso acontece porque esses materiais absorvem o calor do sol durante o dia e o liberam lentamente à noite. As árvores, ao contrário, fazem sombra e liberam umidade pelas folhas, o que ajuda a resfriar o ambiente.<br><br>Por esse motivo, o plantio de árvores e a criação de áreas verdes estão entre as medidas mais citadas por especialistas para reduzir o calor nas cidades.",
te: "<strong>Canção do exílio</strong> (trecho), de Gonçalves Dias, 1843 — domínio público<br><br>Minha terra tem palmeiras,<br>Onde canta o Sabiá;<br>As aves, que aqui gorjeiam,<br>Não gorjeiam como lá.<br><br>Nosso céu tem mais estrelas,<br>Nossas várzeas têm mais flores,<br>Nossos bosques têm mais vida,<br>Nossa vida mais amores.",
tf: "<strong>Tirinha (descrição)</strong><br><br>Quadro 1: um homem passa por uma praça com lixo espalhado pelo chão e reclama em voz alta: “Ninguém cuida desta cidade!”.<br>Quadro 2: ele termina de beber um refrigerante em lata.<br>Quadro 3: ele joga a lata no chão, ao lado de uma lixeira vazia, e segue andando, ainda resmungando: “Um absurdo...”.",
tg: "<strong>Orientações ao pedestre</strong><br><br>Atravesse sempre na faixa e, se houver semáforo, aguarde o sinal verde para pedestres. Antes de atravessar, olhe para os dois lados, mesmo em ruas de mão única. À noite, prefira roupas claras. Nunca atravesse entre veículos estacionados.",
th: "<strong>Guarda orienta moradores após série de furtos em condomínios</strong><br><br>A Guarda Municipal reuniu moradores de três condomínios de um bairro da região sul para orientá-los sobre medidas de prevenção. Segundo o inspetor responsável, que coordenou o encontro, os furtos ocorreram sempre à noite, quando os portões ficam abertos por mais tempo.<br><br>Os síndicos receberam um roteiro com cuidados simples, cujo objetivo é reduzir as chances de novas ocorrências. Entre eles, estão a troca de fechaduras e a instalação de iluminação nas áreas comuns. Isso, de acordo com a corporação, já ajudou a diminuir os casos em outros bairros.<br><br>Os moradores também foram convidados a registrar qualquer atitude suspeita pelo telefone 153. Quem tiver imagens de câmeras pode entregá-las à equipe, que as analisará.",
ti: "<strong>Rua cheia, cidade viva</strong><br><br>Há quem defenda que a segurança de uma cidade depende apenas de policiamento. Essa é uma ideia incompleta. A rua movimentada, onde há comércio aberto, gente caminhando e luz acesa, desestimula a ação de criminosos, que preferem lugares vazios.<br><br>Os moradores de bairros bem cuidados costumam conhecer seus vizinhos. Isso cria uma rede de atenção mútua: quem percebe algo estranho avisa o outro. É essa rede, cuja força depende da convivência, que ajuda a prevenir ocorrências.<br><br>Não se trata de dispensar a guarda ou a polícia, mas de reconhecer que elas atuam melhor com o apoio da comunidade. Esta, por sua vez, só se envolve quando se sente ouvida.",
tj: "<strong>Comerciante tem loja arrombada pela segunda vez no mês</strong><br><br>Uma loja de eletrônicos do centro foi arrombada na madrugada de ontem. Quando a equipe da Guarda Municipal chegou, por volta das 3h, os autores já haviam deixado o local. Segundo vizinhos, eles teriam fugido em um carro escuro.<br><br>Foram levados celulares e um computador. O proprietário, que fechava a loja todos os dias às 19h, contou que instalara um alarme na semana anterior, mas o aparelho não disparou.<br><br>A Guarda informou que as imagens das câmeras da rua serão analisadas nos próximos dias. Se os autores forem identificados, o caso seguirá para a Polícia Civil.",
tk: "<strong>A pressa da avenida</strong><br><br>Todo fim de tarde, a avenida vira um teste de paciência. Os motoristas avançam lentamente, buzinam sem parar e, quase sempre, culpam alguém que nem está ali. Felizmente, há quem prefira esperar com calma.<br><br>Ontem, um senhor parou o carro bem perto da faixa e fez sinal para uma criança atravessar. Ela cruzou depressa, meio assustada, e agradeceu de longe. Ninguém buzinou naquele instante.<br><br>Talvez a cidade mude quando mais gente entender que chegar dois minutos depois raramente é um problema. Atravessar a rua com medo, sim.",
tl: "<strong>Feira noturna terá reforço na segurança</strong><br><br>A partir da próxima sexta-feira, a feira noturna do centro contará com equipes da Guarda Municipal. A medida foi adotada porque os comerciantes registraram, nos últimos meses, uma série de furtos de celulares entre os frequentadores.<br><br>Segundo a coordenação da Guarda, os agentes circularão a pé pelos corredores, para que possam atender rapidamente qualquer chamado. Embora a feira tenha poucas entradas, todas terão um ponto de apoio com rádio.<br><br>Os feirantes aprovaram a iniciativa, mas pedem também melhor iluminação nas ruas próximas. Caso a experiência dê certo, o modelo poderá ser levado a outras feiras da cidade.",
tm: "<strong>Atenção ao que é pequeno</strong><br><br>Muitos acreditam que só os grandes crimes merecem preocupação. Contudo, quem trabalha nas ruas sabe que, quando pequenas desordens são toleradas, o ambiente se degrada e outros problemas aparecem.<br><br>Uma lixeira quebrada ou uma lâmpada apagada parecem detalhes. Mas, à medida que se acumulam, transmitem a ideia de que ninguém cuida do lugar, e quem pretende cometer um delito se sente mais à vontade. Por isso, a manutenção do espaço público não é apenas uma questão estética.<br><br>Isso não significa punir com rigor cada pequena falha, e sim agir cedo. Cuidar do que é pequeno, portanto, é também uma forma de prevenção.",
tn: "<strong>Bairro tem aumento de furtos em residências</strong><br><br>Na última semana, foram registrados três furtos em residências do bairro, todos no período da tarde. Segundo a Guarda Municipal, os autores aproveitaram horários em que os moradores estavam no trabalho.<br><br>Faltam dois agentes na escala da região, informou o comando, que prometeu reforço até o fim do mês. Em reunião com a corporação, a maioria dos moradores aprovou a criação de uma rede de vizinhos por aplicativo.<br><br>O comandante pediu que qualquer movimentação estranha seja comunicada pelo telefone 153. Seguem anexas ao relatório entregue ao delegado as imagens das câmeras da rua. É necessário cautela antes de divulgar fotos de suspeitos nas redes."
};

/* ---------- Índices ---------- */
const POSTOS = [];
TRILHAS.forEach(tr=>tr.postos.forEach((p,i)=>POSTOS.push({id:tr.id+"-"+(i+1), t:p[0], r:p[1], tr, n:i})));
const POSTO = Object.fromEntries(POSTOS.map(p=>[p.id,p]));
const TRILHA = Object.fromEntries(TRILHAS.map(t=>[t.id,t]));
const postosDe = tid => POSTOS.filter(p=>p.tr.id===tid);

/* ---------- Estado ---------- */
const KEY = "rota-gm-campinas-v2";
function novoEstado(){ return {acesso:false, aprovados:{}, tentativas:{}, vistas:{}, atualizado:0}; }
let S = (()=>{ try{ return JSON.parse(localStorage.getItem(KEY)) || novoEstado(); }catch(e){ return novoEstado(); } })();
let docRef = null;
let IS_OWNER = false;
async function salvar(){
  S.atualizado = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(docRef){ try{ await docRef.set({estado: JSON.stringify(S), atualizado: S.atualizado}); }catch(e){} }
}
(async ()=>{
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await claude.use("db"); const user = await claude.use("user");
    if(user){ try{ IS_OWNER = !!(await user.isOwner()); if(IS_OWNER && V.tela==="posto") render(); }catch(e){} }
    if(!db || !user) return;
    const uid = await user.id(); if(!uid) return;
    docRef = db.doc("data/users/" + uid + "/progresso");
    const snap = await docRef.get();
    if(snap.exists){
      const remoto = JSON.parse(snap.data().estado);
      if((remoto.atualizado||0) > (S.atualizado||0)){ S = remoto; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} render(); }
    } else if(S.atualizado){ salvar(); }
  }catch(e){}
})();

/* ---------- Utilidades ---------- */
const $app = document.getElementById("app");
const LETRAS = ["A","B","C","D","E"];
const embaralhar = arr => { const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const diasAte = d => Math.max(0, Math.ceil((d - new Date())/86400000));
const feitos = tid => postosDe(tid).filter(p=>S.aprovados[p.id]).length;
const MODO_REVISAO = true; // true = todos os postos liberados, sem nota mínima. Voltar para false para reativar a trava.
function liberado(pid){ const p = POSTO[pid]; if(!S.acesso) return false; if(MODO_REVISAO || p.n===0) return true; return !!S.aprovados[p.tr.id+"-"+p.n]; }
function proximo(tid){ return postosDe(tid).find(p=>!S.aprovados[p.id]) || null; }
document.getElementById("dias").textContent = diasAte(PROVA);

/* ---------- Modo claro e escuro ---------- */
const TEMA_KEY = "rota-gm-tema";
const SOL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const LUA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>';
function temaAtual(){ const t = document.documentElement.dataset.theme; if(t) return t; return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
function aplicarTema(t){
  document.documentElement.dataset.theme = t;
  const b = document.getElementById("tema");
  b.innerHTML = t==="dark" ? SOL : LUA;
  b.title = t==="dark" ? "Mudar para modo claro" : "Mudar para modo escuro";
  b.setAttribute("aria-label", b.title);
}
(()=>{
  let salvo = null; try{ salvo = localStorage.getItem(TEMA_KEY); }catch(e){}
  aplicarTema(salvo || temaAtual());
  document.getElementById("tema").onclick = ()=>{ const novo = temaAtual()==="dark" ? "light" : "dark"; aplicarTema(novo); try{ localStorage.setItem(TEMA_KEY, novo); }catch(e){} };
})();

/* ---------- Navegação ---------- */
let V = {tela:"home"};
let Q = null;
function ir(v){ if(v.posto && !("modo" in v)) v = Object.assign({modo:undefined}, v); V = Object.assign({}, V, v); render(); window.scrollTo(0,0); }
document.getElementById("brand").onclick = ()=>ir({tela: S.acesso ? "painel" : "home"});
function render(){
  const t = V.tela;
  if(t==="home") return telaHome();
  if(t==="checkout") return S.acesso ? telaPainel() : telaCheckout();
  if(!S.acesso) return telaHome();
  if(t==="painel") return telaPainel();
  if(t==="trilha") return telaTrilha();
  if(t==="posto") return telaPosto();
  if(t==="prova") return telaProva();
  if(t==="resultado") return telaResultado();
  if(t==="taf") return telaTAF();
  if(t==="banco") return telaBanco();
}

/* ---------- Página de vendas ---------- */

    return `<p class="bloco-tit">${cab}</p><ul class="lista-materias">${trs.map(t=>`<li><span>${t.nome}</span><span>${t.postos.length} ${t.postos.length===1?"posto":"postos"}</span></li>`).join("")}</ul>`;
  }).join("");
  $app.innerHTML = `

    <div class="cta-row">
      ${S.acesso ? `<button class="btn" data-go="painel">Ir para o meu painel</button>` : `<button class="btn amber" data-go="checkout">Quero meu acesso</button>`}
      <a class="btn sec" href="#materias">Ver as trilhas</a>
    </div>
    <div class="credencial" aria-label="Dados do concurso">
      <div class="faixa"><strong>Edital 02/2026 · Prefeitura de Campinas</strong><span>Vunesp</span></div>
      <dl>
        <div><dt>Cargo</dt><dd>Guarda Municipal 3ª Classe</dd></div>
        <div><dt>Vagas</dt><dd>100</dd></div>

function pagamento(){
  const box = document.getElementById("pagbox");
  const quadro = modoPag==="pix"
    ? `<p><strong>Escaneie o QR Code no app do seu banco</strong></p>${qrFake()}<p class="ref">Código válido por 30 minutos</p>`
    : `<p><strong>Pagamento com cartão</strong></p><p class="ref">Na versão final, aqui entra o formulário seguro do gateway.</p>`;

}
function qrFake(){
  let r=""; const n=21; let seed=7;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const olho=(x,y,ox,oy)=>{ const dx=x-ox, dy=y-oy; if(dx<0||dy<0||dx>6||dy>6) return null; return (dx===0||dy===0||dx===6||dy===6||(dx>1&&dx<5&&dy>1&&dy<5)); };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    let v = olho(x,y,0,0); if(v===null) v = olho(x,y,n-7,0); if(v===null) v = olho(x,y,0,n-7);
    if(v===null) v = rnd()>.5;
    if(v) r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 ${n+2} ${n+2}" role="img" aria-label="QR Code de demonstração" fill="currentColor">${r}</svg>`;
}

/* ---------- Aula: formato apostila ---------- */
function txtDe(el){ return (el.textContent||"").replace(/\s+/g," ").trim(); }
function montarAula(art, pid){
  if(!art) return;
  art.classList.add("apostila");
  const hs = [...art.querySelectorAll(":scope > h3")];
  if(hs.length > 2){

    nav.innerHTML = '<p>Nesta aula</p><ul>' + hs.map((h,i)=>`<li><a href="#" data-i="${i}">${txtDe(h)}</a></li>`).join("") + '</ul>';
    nav.querySelectorAll("a").forEach(a=>a.onclick = e=>{ e.preventDefault(); hs[+a.dataset.i].scrollIntoView({block:"start"}); });
    hs[0].before(nav);
  }
  art.querySelectorAll(".tabela > table").forEach(tb=>{
    const rows = [...tb.rows].map(r=>[...r.cells]); if(rows.length < 2) return;
    const head = rows[0].map(txtDe), box = tb.parentElement, corpo = rows.slice(1);
    if(head.length !== 2) return;
    const w = document.createElement("div");
    if(/^armadilha/i.test(head[0])){
      w.innerHTML = '<ul class="pegas">' + corpo.map(r=>`<li><span class="pg-t">${r[0].innerHTML}</span> — ${r[1].innerHTML}</li>`).join("") + '</ul>';
    } else if(/fala corrente|errad|evite|não diga/i.test(head[0]) && /norma|cert|use|padrão/i.test(head[1])){
      w.innerHTML = '<ol class="exs">' + corpo.map(r=>`<li><span class="rej">${r[0].innerHTML}</span>${r[1].innerHTML}</li>`).join("") + '</ol>' + (art.querySelector(".exs") ? "" : '<p class="exs-nota">O asterisco marca a forma que a norma-padrão não aceita.</p>');
    } else {
      w.innerHTML = '<dl class="pares">' + (head[0]||head[1] ? `<div class="pares-h"><dt>${head[0]}</dt><dd>${head[1]}</dd></div>` : "") + corpo.map(r=>`<div><dt>${r[0].innerHTML}</dt><dd>${r[1].innerHTML}</dd></div>`).join("") + '</dl>';
    }
    box.replaceWith(...w.childNodes);
  });
  art.querySelectorAll(".box").forEach(b=>{ const a = document.createElement("aside"); a.className = "nota"; a.innerHTML = b.innerHTML; b.replaceWith(a); });
  art.querySelectorAll("ol.alts").forEach(ol=>{

    if(n && n.tagName==="P" && /^Resposta:/.test(txtDe(n))){ const d = document.createElement("details"); d.className = "gab"; d.innerHTML = "<summary>Ver resposta comentada</summary>"; n.before(d); d.appendChild(n); }
  });
  if(window.innerWidth <= 520) art.querySelectorAll(".fig").forEach(f=>{ const d = document.createElement("p"); d.className = "ref"; d.textContent = "Arraste o esquema para o lado para ver tudo."; f.insertBefore(d, f.firstChild); });
  const nq = (BANCO[pid]||[]).length;

}

/* ---------- Sorteio: evita repetir a última tentativa e prioriza as menos vistas ---------- */
const POR_NIVEL = {1:3, 2:4, 3:3}; // fáceis, médias, difíceis em cada tentativa
function sortear(pid){
  const tent = S.tentativas[pid] || [];
  const ultima = new Set(tent.length ? tent[tent.length-1].ids : []);
  const peso = q => (S.vistas[q.id]||0)*10 + (ultima.has(q.id) ? 100 : 0) + Math.random();
  const banco = BANCO[pid].slice().sort((a,b)=>peso(a)-peso(b));
  if(!banco.some(q=>q.n)) return banco.slice(0, N_QUESTOES);
  let sel = [];
  [1,2,3].forEach(n=>{ sel = sel.concat(banco.filter(q=>q.n===n).slice(0, POR_NIVEL[n])); });
  if(sel.length < N_QUESTOES) sel = sel.concat(banco.filter(q=>!sel.includes(q)).slice(0, N_QUESTOES-sel.length));
  return sel.sort((a,b)=>(a.n||0)-(b.n||0));
}
function iniciarProva(pid){
  Q = {pid, i:0, itens: sortear(pid).map(q=>({q, ordem: embaralhar(q.a.map((txt,i)=>({txt, certa:i===0}))), escolha:null}))};
  ir({tela:"prova"});
}

async function corrigir(){
  const nota = Q.itens.filter(it=>it.ordem[it.escolha].certa).length;
  (S.tentativas[Q.pid] = S.tentativas[Q.pid] || []).push({nota, data:Date.now(), ids:Q.itens.map(it=>it.q.id)});
  Q.itens.forEach(it=>{ S.vistas[it.q.id] = (S.vistas[it.q.id]||0)+1; });
  if(nota>=NOTA_MIN && !S.aprovados[Q.pid]) S.aprovados[Q.pid] = {nota, data:Date.now()};
  Q.nota = nota;
  await salvar();
  ir({tela:"resultado"});
}

/* ---------- Revisão do banco (visível só para o dono) ---------- */
function telaBanco(){
  const p = POSTO[V.posto], qs = BANCO[p.id] || [];
  const nome = {1:"Fácil",2:"Média",3:"Difícil"};
  const cont = [1,2,3].map(n=>`${nome[n]}: ${qs.filter(q=>q.n===n).length}`).join(" · ");
  $app.innerHTML = `<section class="topico"><button class="voltar" id="voltar">‹ ${p.t}</button><h2>Banco de questões</h2><p class="meta">${qs.length} questões · ${cont} · a alternativa correta aparece em negrito</p>${qs.map((q,i)=>`<div class="rev ok"><div class="st">${i+1}. ${nome[q.n]||""} · ${q.id}</div>${q.tx?`<blockquote class="txt">${TEXTOS[q.tx]}</blockquote>`:""}<p>${q.e}</p><ol class="alts" type="A">${q.a.map((x,k)=>`<li>${k===0?`<strong>${x}</strong>`:x}</li>`).join("")}</ol><p class="ref">${q.c}</p></div>`).join("")}</section>`;
  document.getElementById("voltar").onclick = ()=>ir({tela:"posto", aba:"questoes"});
}

/* ---------- Guia do TAF (Anexo II do edital) ---------- */
function telaTAF(){
  $app.innerHTML = `
  <section class="topico">
    <button class="voltar" data-go="painel">‹ Voltar ao painel</button>
    <h2>Guia do Teste de Aptidão Física</h2>
    <p class="meta">Edital 02/2026, Capítulo XIII e Anexo II · previsto para 05 e 06/06/2027</p>
    <article class="aula">
      <h3>Por que o TAF pesa tanto</h3>
      <p>A nota final é a soma da prova objetiva (até 50 pontos) com a nota do TAF (até 100 pontos), e a maior nota no TAF é o primeiro critério de desempate. <span class="ref">(itens 13.31, 15.1 e 15.2)</span></p>
      <h3>Como a nota é calculada</h3>
      <p>Cada uma das cinco provas vale de 20 a 100 pontos, e a nota do TAF é a média das cinco. Para seguir no concurso, é preciso média de pelo menos 50 e no mínimo 20 pontos em cada prova. Não há segunda tentativa. <span class="ref">(itens 13.27 a 13.30)</span></p>
      <h3>Índices mínimo (20 pontos) e máximo (100 pontos)</h3>
      <div class="tabela"><table>
        <tr><th>Prova</th><th>Feminino</th><th>Masculino</th></tr>
        <tr><td>Barra fixa (isometria F / flexão M)</td><td>5 s a 45 s</td><td>3 a 11 repetições</td></tr>
        <tr><td>Abdominal com flexão dos joelhos, 1 min</td><td>22 a 38</td><td>30 a 46</td></tr>
        <tr><td>Flexão de braço, 1 min</td><td>12 a 28 (joelhos apoiados)</td><td>14 a 30</td></tr>
        <tr><td>Corrida de 50 m</td><td>9”50 a 7”50</td><td>8”25 a 6”25</td></tr>
        <tr><td>Corrida de 12 minutos</td><td>1.800 m a 2.600 m</td><td>2.200 m a 3.000 m</td></tr>
      </table></div>
      <div class="box"><strong>Atenção às regras de execução:</strong> sem luvas na barra; na flexão masculina na barra não valem impulso, balanço ou kipping; repetições fora do padrão do Anexo II não contam.</div>
      <p class="ref">Fonte: Edital 02/2026 da Guarda Municipal de Campinas, Anexo II. Confira sempre o texto oficial.</p>
    </article>
  </section>`;
  bindGo();
}

render();
</script>

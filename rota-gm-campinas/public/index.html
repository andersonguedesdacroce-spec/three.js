{id:"p9-56",n:3,tx:"tn",e:"No último parágrafo do texto, “É necessário cautela” está correto porque",a:["o substantivo “cautela” aparece sem artigo, e a expressão fica invariável.", "“cautela” é masculino.", "o verbo ser concorda com o predicativo.", "a frase está na voz passiva.", "“necessário” concorda com “Guarda”."],c:"Sem artigo ou pronome antes do substantivo, “é necessário” não varia. Com artigo: é necessária a cautela."},
{id:"p9-57",n:3,e:"Assinale a alternativa que completa corretamente: “Os agentes ____ cansados e ____ pessoas ficaram na praça depois da meia-noite.”",a:["estavam meio / menos", "estavam meios / menas", "estava meio / menos", "estavam meio / menas", "estavam meios / menos"],c:"Meio (advérbio) e menos não variam; o verbo concorda com “os agentes”."},
{id:"p9-58",n:3,e:"Assinale a alternativa em que a palavra destacada deveria variar e não variou.",a:["Seguem anexo as declarações das testemunhas.", "A agente ficou meio confusa com a ordem.", "Os guardas falaram alto com o motorista.", "As motos custaram caro.", "Os cones laranja foram recolhidos."],c:"Anexo é adjetivo e concorda: seguem anexas as declarações. Nas demais, as palavras são invariáveis."},
{id:"p9-59",n:3,e:"Assinale a afirmação INCORRETA sobre concordância.",a:["O verbo sempre concorda com a palavra mais próxima dele.", "O verbo concorda com o núcleo do sujeito.", "Haver no sentido de existir é impessoal.", "O verbo ser pode concordar com o predicativo.", "“Menos” é palavra invariável."],c:"O verbo concorda com o núcleo do sujeito, que pode estar longe dele."},
{id:"p9-60",n:3,e:"Assinale a alternativa em que a concordância segue a norma-padrão em todos os pontos.",a:["Devem existir soluções, mas deve haver também cautela.", "Devem haver soluções, mas deve existir também cautela.", "Deve existir soluções, mas devem haver também cautelas.", "Devem haver soluções, mas devem existir também cautela.", "Deve haver soluções, mas devem existir também cautela."],c:"Existir concorda (devem existir soluções); haver de existir é impessoal (deve haver cautela)."}
];

BANCO["pt-10"] = [
{id:"p10-01",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Assisti ao jogo na casa do parceiro.", "Assisti o jogo na casa do parceiro.", "Assisti no jogo na casa do parceiro.", "Assisti com o jogo na casa do parceiro.", "Assisti do jogo na casa do parceiro."],c:"No sentido de ver, assistir pede a preposição a."},
{id:"p10-02",n:1,e:"Em “O médico assistiu o ferido na calçada”, o verbo assistir significa",a:["prestar assistência, socorrer.", "ver, presenciar.", "morar.", "caber, pertencer.", "desejar."],c:"Transitivo direto, no sentido de ajudar."},
{id:"p10-03",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["O guarda aspira ao cargo de inspetor.", "O guarda aspira o cargo de inspetor.", "O guarda aspira pelo cargo de inspetor.", "O guarda aspira no cargo de inspetor.", "O guarda aspira com o cargo de inspetor."],c:"No sentido de desejar, aspirar pede a preposição a."},
{id:"p10-04",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Os agentes obedecem ao regulamento.", "Os agentes obedecem o regulamento.", "Os agentes obedecem do regulamento.", "Os agentes obedecem no regulamento.", "Os agentes obedecem pelo regulamento."],c:"Obedecer é transitivo indireto: obedecer a."},
{id:"p10-05",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Prefiro patrulhar a ficar na base.", "Prefiro patrulhar do que ficar na base.", "Prefiro mais patrulhar do que ficar na base.", "Prefiro patrulhar que ficar na base.", "Prefiro mil vezes patrulhar do que ficar na base."],c:"Preferir A a B, sem “mais” nem “do que”."},
{id:"p10-06",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["A viatura chegou à delegacia às 23h.", "A viatura chegou na delegacia às 23h.", "A viatura chegou em a delegacia às 23h.", "A viatura chegou pela delegacia às 23h.", "A viatura chegou com a delegacia às 23h."],c:"Chegar pede a: chegou à delegacia."},
{id:"p10-07",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["O suspeito reside na Rua das Flores.", "O suspeito reside à Rua das Flores.", "O suspeito reside a Rua das Flores.", "O suspeito reside pela Rua das Flores.", "O suspeito reside para a Rua das Flores."],c:"Residir pede em."},
{id:"p10-08",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Esqueci o crachá na viatura.", "Esqueci do crachá na viatura.", "Esqueci-me o crachá na viatura.", "Me esqueci o crachá na viatura.", "Esqueci com o crachá na viatura."],c:"Esquecer algo (sem pronome) ou esquecer-se de algo."},
{id:"p10-09",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Lembrei-me do horário da escala.", "Lembrei do horário da escala.", "Lembrei-me o horário da escala.", "Me lembrei o horário da escala.", "Lembrei-me com o horário da escala."],c:"Lembrar-se de algo, ou lembrar algo."},
{id:"p10-10",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["A demora implica prejuízo à investigação.", "A demora implica em prejuízo à investigação.", "A demora implica no prejuízo à investigação.", "A demora implica para prejuízo à investigação.", "A demora implica com prejuízo à investigação."],c:"Implicar, no sentido de acarretar, é transitivo direto."},
{id:"p10-11",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Ela namora um colega da Guarda.", "Ela namora com um colega da Guarda.", "Ela namora de um colega da Guarda.", "Ela namora a um colega da Guarda.", "Ela namora por um colega da Guarda."],c:"Namorar é transitivo direto."},
{id:"p10-12",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Simpatizo com a nova escala.", "Simpatizo-me com a nova escala.", "Me simpatizo com a nova escala.", "Simpatizo a nova escala.", "Simpatizo-me a nova escala."],c:"Simpatizar não é pronominal: simpatizo com."},
{id:"p10-13",n:1,e:"Em “Procederam à vistoria do prédio”, o verbo proceder significa",a:["dar início, realizar.", "ter fundamento.", "originar-se.", "comportar-se.", "desistir."],c:"Proceder a = realizar."},
{id:"p10-14",n:1,e:"Em “A denúncia não procede”, o verbo proceder significa",a:["ter fundamento.", "realizar.", "originar-se.", "dar início.", "comportar-se mal."],c:"Sem complemento, proceder = ter fundamento."},
{id:"p10-15",n:1,e:"Assinale o nome que pede a preposição “a”.",a:["favorável", "capaz", "compatível", "residente", "ansioso"],c:"Favorável a. Capaz de; compatível com; residente em; ansioso por."},
{id:"p10-16",n:1,e:"Complete: “A medida é compatível ____ o orçamento.”",a:["com", "de", "em", "por", "sobre"],c:"Compatível com."},
{id:"p10-17",n:1,e:"Complete: “Ele é residente ____ Campinas.”",a:["em", "a", "de", "para", "com"],c:"Residente em."},
{id:"p10-18",n:1,e:"Complete: “O filme ____ assisti era longo.”",a:["a que", "que", "de que", "em que", "com que"],c:"Assisti ao filme → o filme a que assisti."},
{id:"p10-19",n:1,e:"Complete: “O cargo ____ aspiro exige curso superior.”",a:["a que", "que", "de que", "com que", "em que"],c:"Aspiro ao cargo → o cargo a que aspiro."},
{id:"p10-20",n:1,tx:"tp",e:"No primeiro parágrafo, em “procedeu [...] à vistoria”, o verbo proceder significa",a:["realizar, dar início.", "ter fundamento.", "originar-se.", "desistir.", "comportar-se."],c:"Proceder a = realizar: a Guarda fez a vistoria."},
{id:"p10-21",n:2,e:"Assinale a frase em que “assistir” está empregado no sentido de “caber, ser de direito”.",a:["Assiste ao preso o direito de permanecer calado.", "Assisti ao jogo no domingo.", "O médico assistiu o ferido.", "Os guardas assistiram à palestra.", "Ninguém assistiu ao acidente."],c:"Assistir a = caber: o direito cabe ao preso."},
{id:"p10-22",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["O jogo? Assisti a ele no domingo.", "O jogo? Assisti-lhe no domingo.", "O jogo? Assisti-o no domingo.", "O jogo? Lhe assisti no domingo.", "O jogo? O assisti no domingo."],c:"No sentido de ver, assistir não aceita lhe: assisti a ele."},
{id:"p10-23",n:2,e:"Em “O guarda aspirou o ar frio da madrugada”, o verbo aspirar significa",a:["respirar, sorver.", "desejar.", "pretender um cargo.", "mirar.", "ajudar."],c:"Transitivo direto, no sentido de respirar."},
{id:"p10-24",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["O atirador visou o alvo com cuidado.", "O atirador visou ao alvo com cuidado.", "O atirador visou no alvo com cuidado.", "O atirador visou para o alvo com cuidado.", "O atirador visou com o alvo com cuidado."],c:"No sentido de mirar, visar é transitivo direto."},
{id:"p10-25",n:2,e:"Em “Quero-lhe muito bem”, o verbo querer significa",a:["estimar, ter afeto.", "desejar possuir.", "exigir.", "procurar.", "permitir."],c:"No sentido de estimar, querer pede a: quero-lhe bem."},
{id:"p10-26",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Informei o motorista da multa.", "Informei o motorista a multa.", "Informei ao motorista da multa.", "Informei do motorista a multa.", "Informei para o motorista da multa."],c:"Informar alguém de algo. Só um dos complementos leva preposição."},
{id:"p10-27",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Comunicou o fato à delegacia.", "Comunicou à delegacia do fato.", "Comunicou do fato a delegacia.", "Comunicou a delegacia o fato.", "Comunicou-se o fato a delegacia."],c:"Comunicar algo a alguém."},
{id:"p10-28",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Paguei o conserto ao mecânico.", "Paguei o mecânico.", "Paguei do mecânico o conserto.", "Paguei ao conserto o mecânico.", "Paguei o conserto do mecânico a ele."],c:"Pagar a coisa (direto) a alguém (com a)."},
{id:"p10-29",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Agradeci ao guarda pela ajuda.", "Agradeci o guarda pela ajuda.", "Agradeci do guarda pela ajuda.", "Agradeci com o guarda pela ajuda.", "Agradeci pelo guarda a ajuda."],c:"Agradecer a alguém."},
{id:"p10-30",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Custou-me entender a nova escala.", "Custei-me entender a nova escala.", "Custou-me de entender a nova escala.", "Custei-me a entender a nova escala.", "Eu custo de entender a nova escala."],c:"No sentido de ser difícil, custar tem como sujeito a coisa difícil: entender custou a mim."},
{id:"p10-31",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["O guarda foi ao centro buscar a viatura.", "O guarda foi no centro buscar a viatura.", "O guarda foi em o centro buscar a viatura.", "O guarda foi com o centro buscar a viatura.", "O guarda foi sobre o centro buscar a viatura."],c:"Ir pede a: foi ao centro."},
{id:"p10-32",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Chamei o guarda para a reunião.", "Chamei ao guarda para a reunião.", "Chamei do guarda para a reunião.", "Chamei-lhe para a reunião.", "Chamei com o guarda para a reunião."],c:"No sentido de convocar, chamar é transitivo direto: chamei-o."},
{id:"p10-33",n:2,e:"Assinale a alternativa em que as duas formas estão de acordo com a norma-padrão.",a:["Chamou-o de covarde. / Chamou-lhe covarde.", "Assisti o jogo. / Assisti ao jogo.", "Implica em atraso. / Implica atraso.", "Prefiro isto do que aquilo. / Prefiro isto a aquilo.", "Obedeço o regulamento. / Obedeço ao regulamento."],c:"No sentido de qualificar, chamar aceita objeto direto ou indireto, com ou sem de."},
{id:"p10-34",n:2,e:"Complete: “O regulamento ____ todos devem obedecer está na parede.”",a:["a que", "que", "de que", "com que", "em que"],c:"Obedecer a: o regulamento a que todos obedecem."},
{id:"p10-35",n:2,e:"Complete: “A escala ____ discordo foi publicada ontem.”",a:["de que", "que", "a que", "com que", "em que"],c:"Discordar de: a escala de que discordo."},
{id:"p10-36",n:2,e:"Complete: “As pessoas ____ trabalho são pontuais.”",a:["com quem", "que", "quem", "a quem", "de quem"],c:"Trabalhar com: as pessoas com quem trabalho."},
{id:"p10-37",n:2,e:"Complete: “A rua ____ moro é escura.”",a:["em que", "que", "a que", "de que", "com que"],c:"Morar em: a rua em que moro."},
{id:"p10-38",n:2,e:"Complete: “Ele é fiel ____ seus princípios.”",a:["a", "com", "de", "em", "por"],c:"Fiel a."},
{id:"p10-39",n:2,e:"Assinale a frase em que a regência nominal está de acordo com a norma-padrão.",a:["A obediência às normas é inerente ao cargo.", "A obediência com as normas é inerente do cargo.", "A obediência das normas é inerente no cargo.", "A obediência pelas normas é inerente com o cargo.", "A obediência em as normas é inerente para o cargo."],c:"Obediência a; inerente a."},
{id:"p10-40",n:2,tx:"tp",e:"No segundo parágrafo, “o descumprimento implica multa” está de acordo com a norma-padrão porque",a:["implicar, no sentido de acarretar, é transitivo direto.", "implicar exige sempre a preposição “em”.", "“multa” é sujeito de implicar.", "implicar é verbo intransitivo.", "o verbo está na voz passiva."],c:"Implicar algo: implica multa."},
{id:"p10-41",n:3,tx:"tp",e:"No último parágrafo, “as regras a que todos devem obedecer” está de acordo com a norma-padrão porque",a:["obedecer exige a preposição “a”, que vem antes do relativo.", "o relativo “que” sempre pede a preposição “a”.", "“regras” é palavra feminina.", "a preposição indica lugar.", "obedecer é transitivo direto."],c:"Todos obedecem às regras → as regras a que todos obedecem."},
{id:"p10-42",n:3,tx:"tp",e:"No último parágrafo, “A Guarda prefere orientar a multar” poderia ser reescrito, de acordo com a norma-padrão, como",a:["A Guarda prefere a orientação à multa.", "A Guarda prefere mais orientar do que multar.", "A Guarda prefere orientar do que multar.", "A Guarda prefere a orientação do que a multa.", "A Guarda prefere mais a orientação que a multa."],c:"Preferir A a B: a orientação à multa (com crase, porque “multa” tem artigo)."},
{id:"p10-43",n:3,tx:"tp",e:"No primeiro parágrafo, em “A ação atende a um pedido dos frequentadores”, a preposição “a”",a:["é aceita, pois atender, nesse sentido, admite complemento com ou sem preposição.", "é obrigatória, e sem ela a frase estaria errada.", "indica lugar.", "indica tempo.", "está errada, pois atender só admite objeto direto."],c:"Atender a um pedido e atender um pedido são formas aceitas."},
{id:"p10-44",n:3,tx:"tp",e:"No terceiro parágrafo, “com quem a Guarda se reuniu” está de acordo com a norma-padrão porque",a:["reunir-se pede a preposição “com”, que antecede o relativo.", "“quem” dispensa preposição.", "a preposição indica instrumento.", "o relativo retoma “a medida”.", "reunir-se é transitivo direto."],c:"A Guarda se reuniu com os moradores → os moradores com quem a Guarda se reuniu."},
{id:"p10-45",n:3,tx:"tp",e:"No segundo parágrafo, “Os comerciantes foram informados das novas regras”. Na voz ativa, a frase de acordo com a norma-padrão é",a:["A Guarda informou os comerciantes das novas regras.", "A Guarda informou aos comerciantes das novas regras.", "A Guarda informou os comerciantes as novas regras.", "A Guarda informou dos comerciantes as novas regras.", "A Guarda informou-lhes das novas regras."],c:"Informar alguém de algo: um complemento direto e outro com de."},
{id:"p10-46",n:3,e:"Assinale a frase em que a regência verbal está INCORRETA.",a:["Assisti o filme da operação no auditório.", "Aspiro ao cargo de inspetor.", "Obedeço ao regulamento.", "Prefiro a ronda à base.", "Esqueci-me do crachá."],c:"No sentido de ver, assistir pede a: assisti ao filme."},
{id:"p10-47",n:3,e:"Assinale a frase em que a regência verbal está INCORRETA.",a:["Ele namora com a irmã do colega.", "Procedemos à leitura do relatório.", "A denúncia não procede.", "O fiscal visou o passaporte do estrangeiro.", "Simpatizo com a ideia."],c:"Namorar é transitivo direto: namora a irmã do colega."},
{id:"p10-48",n:3,e:"Assinale a alternativa em que o pronome “lhe” está empregado de acordo com a norma-padrão.",a:["Obedeço-lhe sem discutir. (ao comandante)", "Assisti-lhe no estádio. (ao jogo)", "Aspiro-lhe há anos. (ao cargo)", "Chamei-lhe para a reunião. (o guarda, convocando)", "Vi-lhe na praça. (o suspeito)"],c:"Obedecer a uma pessoa aceita lhe. Assistir (ver) e aspirar (desejar) pedem a ele; chamar (convocar) e ver pedem o."},
{id:"p10-49",n:3,e:"Assinale a alternativa em que a preposição antes do relativo está de acordo com a norma-padrão.",a:["O inspetor a cujo pedido atendemos é novo.", "O inspetor cujo o pedido atendemos é novo.", "O inspetor de cujo pedido atendemos é novo.", "O inspetor com cujo pedido atendemos é novo.", "O inspetor que o pedido atendemos é novo."],c:"Atendemos ao pedido do inspetor → o inspetor a cujo pedido atendemos."},
{id:"p10-50",n:3,e:"Complete: “Esta é a escala ____ você se referiu, e aquela é a ____ todos preferem.”",a:["a que / que", "que / a que", "de que / que", "a que / a que", "em que / de que"],c:"Referir-se a → a que; preferir algo → que."},
{id:"p10-51",n:3,e:"Assinale a alternativa em que a regência nominal está INCORRETA.",a:["Ele tem aversão com barulho.", "Ele é apto para o serviço.", "A medida é favorável aos moradores.", "O suspeito é residente em Campinas.", "A decisão é compatível com a lei."],c:"Aversão a ou por."},
{id:"p10-52",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["O dinheiro é necessário à compra dos coletes.", "O dinheiro é necessário com a compra dos coletes.", "O dinheiro é necessário em a compra dos coletes.", "O dinheiro é necessário pela compra dos coletes.", "O dinheiro é necessário sobre a compra dos coletes."],c:"Necessário a (ou para)."},
{id:"p10-53",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Prefiro o turno da noite ao da manhã.", "Prefiro o turno da noite do que o da manhã.", "Prefiro mais o turno da noite que o da manhã.", "Prefiro antes o turno da noite do que o da manhã.", "Prefiro o turno da noite mais do que o da manhã."],c:"Preferir A a B."},
{id:"p10-54",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Os comerciantes foram informados de que haveria vistoria.", "Os comerciantes foram informados a vistoria.", "Os comerciantes foram informados com que haveria vistoria.", "Os comerciantes foram informados em que haveria vistoria.", "Os comerciantes foram informados para que haveria vistoria."],c:"Informar alguém de algo: informados de que haveria vistoria."},
{id:"p10-55",n:3,e:"Assinale a alternativa em que a mudança de regência altera o sentido do verbo.",a:["Assisti o doente. / Assisti ao jogo.", "Esqueci o crachá. / Esqueci-me do crachá.", "Lembrei o horário. / Lembrei-me do horário.", "Atendi o pedido. / Atendi ao pedido.", "Chamou-o covarde. / Chamou-lhe covarde."],c:"Assistir alguém = ajudar; assistir a algo = ver. Nas demais, o sentido não muda."},
{id:"p10-56",n:3,e:"Em “Custa-me acreditar na versão do motorista”, o sujeito de “custar” é",a:["acreditar na versão do motorista.", "me.", "o motorista.", "a versão.", "indeterminado."],c:"O que custa é acreditar: o sujeito é a oração."},
{id:"p10-57",n:3,e:"Assinale a frase de acordo com a norma-padrão quanto à regência de “ir” e “chegar”.",a:["Fomos ao local e chegamos à conclusão de que era furto.", "Fomos no local e chegamos na conclusão de que era furto.", "Fomos ao local e chegamos na conclusão de que era furto.", "Fomos no local e chegamos à conclusão de que era furto.", "Fomos ao local e chegamos em conclusão de que era furto."],c:"Ir a e chegar a."},
{id:"p10-58",n:3,e:"Assinale a frase em que o verbo “visar” significa “pretender, ter em vista”.",a:["A operação visa à redução dos furtos.", "O atirador visou o alvo.", "O fiscal visou o documento.", "O soldado visou a placa do carro com a arma.", "O gerente visou o cheque."],c:"Visar à redução = ter como objetivo. Nas demais: mirar ou pôr visto."},
{id:"p10-59",n:3,e:"Assinale a afirmação INCORRETA sobre regência.",a:["A preposição exigida pelo verbo da oração relativa desaparece diante do pronome relativo.", "Alguns verbos mudam de sentido conforme a regência.", "Preferir pede a preposição “a” no segundo termo.", "Implicar, no sentido de acarretar, é transitivo direto.", "Nomes também podem exigir preposição."],c:"A preposição não desaparece: ela vai para antes do relativo (o filme a que assisti)."},
{id:"p10-60",n:3,e:"Assinale a alternativa em que a regência está correta em todas as frases.",a:["Obedeço ao regulamento; prefiro a ronda à base; resido em Campinas.", "Obedeço o regulamento; prefiro a ronda à base; resido em Campinas.", "Obedeço ao regulamento; prefiro a ronda do que a base; resido em Campinas.", "Obedeço ao regulamento; prefiro a ronda à base; resido à Rua Campinas.", "Obedeço ao regulamento; prefiro mais a ronda à base; resido em Campinas."],c:"Obedecer a; preferir A a B sem mais; residir em."}
];

BANCO["pt-11"] = [
{id:"p11-01",n:1,e:"Em “Não me avisaram da operação”, o pronome está em",a:["próclise, atraído pela palavra negativa.", "ênclise.", "mesóclise.", "posição proibida pela norma.", "próclise sem motivo, apenas aceita."],c:"A negativa “não” atrai o pronome."},
{id:"p11-02",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Diga-me a verdade.", "Me diga a verdade.", "Me diga-me a verdade.", "Lhe diga a verdade.", "Te diga a verdade."],c:"A norma-padrão não inicia frase com pronome átono."},
{id:"p11-03",n:1,e:"Assinale a frase em que o pronome está em mesóclise.",a:["Entregar-lhe-ei o relatório amanhã.", "Entregarei-lhe o relatório amanhã.", "Não lhe entregarei o relatório.", "Vou entregar-lhe o relatório.", "Entreguei-lhe o relatório."],c:"O pronome está no meio do verbo, no futuro do presente."},
{id:"p11-04",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Ninguém me informou sobre a mudança.", "Ninguém informou-me sobre a mudança.", "Ninguém informou me sobre a mudança.", "Me ninguém informou sobre a mudança.", "Ninguém informar-me-ia-ou sobre a mudança."],c:"Ninguém atrai o pronome."},
{id:"p11-05",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["O guarda que me atendeu foi gentil.", "O guarda que atendeu-me foi gentil.", "O guarda que atendeu me foi gentil.", "O guarda me que atendeu foi gentil.", "O guarda que atender-me-ou foi gentil."],c:"O pronome relativo atrai."},
{id:"p11-06",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Quando o vi, chamei a central.", "Quando vi-o, chamei a central.", "Quando vi o, chamei a central.", "Quando o vi-o, chamei a central.", "O quando vi, chamei a central."],c:"A conjunção subordinativa atrai."},
{id:"p11-07",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Entregue-me os documentos, por favor.", "Me entregue os documentos, por favor.", "Me entregue-me os documentos.", "Lhe entregue os documentos.", "Entregue me-os documentos."],c:"Imperativo afirmativo, sem atrativa: ênclise."},
{id:"p11-08",n:1,e:"Em “Saiu, deixando-o sozinho na praça”, o pronome está em ênclise porque",a:["o verbo está no gerúndio, sem palavra atrativa.", "o verbo está no futuro.", "há palavra negativa antes do verbo.", "o verbo está no particípio.", "a frase é interrogativa."],c:"Gerúndio sem “em” pede ênclise."},
{id:"p11-09",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Quem te contou sobre a operação?", "Quem contou-te sobre a operação?", "Quem contou te sobre a operação?", "Te quem contou sobre a operação?", "Quem contar-te-ia-ou sobre a operação?"],c:"Frase interrogativa com pronome interrogativo pede próclise."},
{id:"p11-10",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Alguém me chamou no rádio.", "Alguém chamou-me no rádio.", "Alguém chamou me no rádio.", "Me alguém chamou no rádio.", "Alguém me chamou-me no rádio."],c:"O indefinido “alguém” atrai."},
{id:"p11-11",n:1,e:"A forma de “entregar + o” de acordo com a norma-padrão é",a:["entregá-lo", "entregar-o", "entregar-lo", "entregá-o", "entrega-lo"],c:"O -r cai e o pronome vira “lo”; a última sílaba ganha acento."},
{id:"p11-12",n:1,e:"A forma de “encontraram + o” de acordo com a norma-padrão é",a:["encontraram-no", "encontraram-o", "encontraram-lo", "encontrara-no", "encontraram-lhe"],c:"Depois de som nasal, o pronome vira “no”."},
{id:"p11-13",n:1,e:"A forma de “fiz + o” de acordo com a norma-padrão é",a:["fi-lo", "fiz-o", "fiz-lo", "fi-o", "fizo"],c:"O -z cai e o pronome vira “lo”."},
{id:"p11-14",n:1,e:"Assinale a frase em que o pronome está em ênclise.",a:["Aproximou-se do suspeito com calma.", "Não se aproximou do suspeito.", "Ninguém se aproximou do suspeito.", "Quando se aproximou, viu a arma.", "Aproximar-se-á do suspeito."],c:"O pronome está depois do verbo, com hífen."},
{id:"p11-15",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Tudo se resolveu no fim do turno.", "Tudo resolveu-se no fim do turno.", "Tudo resolveu se no fim do turno.", "Se tudo resolveu no fim do turno.", "Tudo se resolveu-se no fim do turno."],c:"O indefinido “tudo” atrai."},
{id:"p11-16",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Aqui se trabalha em silêncio.", "Aqui trabalha se em silêncio.", "Se aqui trabalha em silêncio.", "Aqui se trabalha-se em silêncio.", "Aqui trabalhar-se-ia-á em silêncio."],c:"O advérbio, sem vírgula depois, atrai o pronome."},
{id:"p11-17",n:1,e:"Com o verbo no futuro do presente, sem palavra atrativa e no início da frase, a colocação de acordo com a norma-padrão é",a:["a mesóclise: entregar-lhe-ei.", "a ênclise: entregarei-lhe.", "a próclise: lhe entregarei.", "qualquer uma das três.", "nenhuma: o pronome deve ser omitido."],c:"Futuro sem atrativa, abrindo a frase: mesóclise."},
{id:"p11-18",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Tinha-me avisado da escala.", "Tinha avisado-me da escala.", "Tinha avisado me da escala.", "Me tinha avisado-me da escala.", "Tinha-me avisado-me da escala."],c:"Nunca há pronome depois do particípio."},
{id:"p11-19",n:1,e:"Em “Deus o acompanhe!”, a próclise ocorre porque a frase",a:["exprime desejo.", "está no futuro.", "começa com verbo.", "tem verbo no gerúndio.", "tem verbo no particípio."],c:"Frases de desejo (optativas) pedem próclise."},
{id:"p11-20",n:1,tx:"tq",e:"No terceiro parágrafo, a forma “Encaminhá-lo-ão” é exemplo de",a:["mesóclise com o verbo no futuro do presente.", "ênclise com o verbo no infinitivo.", "próclise com palavra atrativa.", "erro de colocação, pois o certo seria “encaminharão-lo”.", "mesóclise com o verbo no pretérito."],c:"Encaminharão + o: o pronome entra no meio do futuro, na forma “lo”."},
{id:"p11-21",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Não lhe entregarei o relatório.", "Não entregar-lhe-ei o relatório.", "Não entregarei-lhe o relatório.", "Entregarei-lhe não o relatório.", "Não entregarei lhe o relatório."],c:"Com palavra atrativa, o futuro fica com próclise."},
{id:"p11-22",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Far-se-ia a vistoria se houvesse tempo.", "Faria-se a vistoria se houvesse tempo.", "Se faria-se a vistoria se houvesse tempo.", "Fazer-se-ia-se a vistoria.", "Faria se a vistoria se houvesse tempo."],c:"Futuro do pretérito, sem atrativa, abrindo a frase: mesóclise."},
{id:"p11-23",n:2,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Ontem encontrei-o na praça.", "Ontem o encontrei na praça.", "Ontem, encontrei-o na praça.", "Encontrei-o ontem na praça.", "Não o encontrei ontem na praça."],c:"Advérbio sem vírgula atrai: ontem o encontrei."},
{id:"p11-24",n:2,e:"Em “Ontem, encontrei-o na praça”, a ênclise é possível porque",a:["a vírgula depois do advérbio desfaz a atração.", "o verbo está no futuro.", "há palavra negativa.", "o pronome é reflexivo.", "a frase é exclamativa."],c:"A pausa marcada pela vírgula desfaz a atração do advérbio."},
{id:"p11-25",n:2,e:"Assinale a locução verbal com colocação de acordo com a norma-padrão.",a:["Vou-lhe entregar o relatório.", "Lhe vou entregar o relatório.", "Vou entregar-lhe-ei o relatório.", "Vou-lhe entregar-lhe o relatório.", "Vou lhe-entregar o relatório."],c:"Na locução com infinitivo, o pronome pode ficar depois do auxiliar, com hífen."},
{id:"p11-26",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Não lhe vou entregar o relatório.", "Não vou-lhe entregar o relatório.", "Lhe não vou entregar o relatório.", "Não vou entregar-lhe-ei o relatório.", "Não vou lhe-entregar o relatório."],c:"Com palavra atrativa, o pronome vai antes do auxiliar (ou depois do principal)."},
{id:"p11-27",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Os agentes tinham-se preparado para a operação.", "Os agentes tinham preparado-se para a operação.", "Os agentes tinham preparado se para a operação.", "Os agentes se tinham preparado-se para a operação.", "Os agentes tinham-se preparado-se para a operação."],c:"Com particípio, o pronome fica junto do auxiliar."},
{id:"p11-28",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["É preciso avisá-lo da mudança.", "É preciso avisar-lo da mudança.", "É preciso avisar-o da mudança.", "É preciso avisá-o da mudança.", "É preciso avisa-lo da mudança."],c:"Avisar + o = avisá-lo."},
{id:"p11-29",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Em se tratando de segurança, todo cuidado é pouco.", "Em tratando-se de segurança, todo cuidado é pouco.", "Em tratando se de segurança, todo cuidado é pouco.", "Se em tratando de segurança, todo cuidado é pouco.", "Em tratar-se-ia de segurança, todo cuidado é pouco."],c:"Em + gerúndio pede próclise."},
{id:"p11-30",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Embora se esforçasse, não alcançou a meta.", "Embora esforçasse-se, não alcançou a meta.", "Embora esforçasse se, não alcançou a meta.", "Se embora esforçasse, não alcançou a meta.", "Embora se esforçasse-se, não alcançou a meta."],c:"A conjunção subordinativa atrai."},
{id:"p11-31",n:2,e:"A forma de “põe + o” de acordo com a norma-padrão é",a:["põe-no", "põe-o", "põe-lo", "pô-lo", "põe-lho"],c:"Depois de som nasal, “no”. “Pô-lo” é a forma de “pôr + o”."},
{id:"p11-32",n:2,e:"A forma de “queremos + o” de acordo com a norma-padrão é",a:["queremo-lo", "queremos-o", "queremos-lo", "queremo-no", "querêmo-lo"],c:"O -s cai e o pronome vira “lo”."},
{id:"p11-33",n:2,e:"Assinale a alternativa em que a combinação está de acordo com a norma-padrão.",a:["Ele fê-lo sem ajuda. (fez + o)", "Ele fez-lo sem ajuda.", "Ele fê-o sem ajuda.", "Ele fez-o sem ajuda.", "Ele fe-lo sem ajuda."],c:"Fez + o = fê-lo, com acento."},
{id:"p11-34",n:2,e:"Assinale a frase em que a próclise é obrigatória.",a:["Jamais o abandonaremos.", "Os guardas o abandonaram.", "Abandonaram-no ontem.", "Abandoná-lo-emos.", "Vamos abandoná-lo."],c:"A palavra negativa “jamais” obriga a próclise. Em (B), com sujeito expresso, a próclise é apenas aceita."},
{id:"p11-35",n:2,e:"Em “Os guardas se aproximaram com calma”, a próclise é",a:["aceita, pois com o sujeito expresso antes do verbo a próclise e a ênclise são possíveis.", "obrigatória, por causa de palavra negativa.", "proibida, pois a frase começa com pronome.", "obrigatória, por causa do pronome relativo.", "proibida, pois o verbo está no pretérito."],c:"Sem palavra atrativa e com sujeito expresso, as duas posições são aceitas."},
{id:"p11-36",n:2,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Me avisaram tarde da mudança na escala.", "Avisaram-me tarde da mudança na escala.", "Não me avisaram da mudança na escala.", "Avisar-me-ão da mudança na escala.", "Quem me avisou da mudança na escala?"],c:"A norma-padrão não inicia frase com pronome átono."},
{id:"p11-37",n:2,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Entregarei-lhe a chave amanhã.", "Entregar-lhe-ei a chave amanhã.", "Não lhe entregarei a chave amanhã.", "Eu lhe entregarei a chave amanhã.", "Vou entregar-lhe a chave amanhã."],c:"O futuro nunca aceita ênclise."},
{id:"p11-38",n:2,e:"Em “Que Deus nos proteja nesta operação!”, a colocação do pronome se explica por",a:["tratar-se de frase que exprime desejo.", "haver verbo no futuro.", "haver verbo no gerúndio.", "haver vírgula antes do pronome.", "haver verbo no imperativo afirmativo."],c:"Frase de desejo pede próclise."},
{id:"p11-39",n:2,tx:"tq",e:"No segundo parágrafo, em “até que se lembrasse do nome da filha”, a próclise ocorre porque",a:["a conjunção subordinativa atrai o pronome.", "o verbo está no futuro.", "a frase é imperativa.", "o verbo está no gerúndio.", "há vírgula antes do pronome."],c:"“Até que” é locução conjuntiva subordinativa."},
{id:"p11-40",n:2,tx:"tq",e:"No segundo parágrafo, em “Não se sabe ainda como ele chegou ao centro”, a colocação do pronome se deve",a:["à palavra negativa “não”.", "ao advérbio “ainda”.", "ao verbo no futuro.", "ao início da frase.", "ao gerúndio."],c:"A negativa atrai o pronome."},
{id:"p11-41",n:3,tx:"tq",e:"No primeiro parágrafo, em “Os guardas avistaram-no”, a forma “no” aparece porque",a:["o verbo termina em som nasal.", "o verbo termina em -r.", "o verbo está no futuro.", "o pronome é reflexivo.", "o pronome é objeto indireto."],c:"Avistaram termina em som nasal: o pronome “o” vira “no”."},
{id:"p11-42",n:3,tx:"tq",e:"No terceiro parágrafo, em “nunca se esquecerá do cuidado”, a próclise é obrigatória, e a mesóclise não seria possível, porque",a:["a palavra negativa “nunca” atrai o pronome para antes do verbo.", "o verbo está no presente.", "o pronome é objeto direto.", "a frase é interrogativa.", "o sujeito está oculto."],c:"Com palavra atrativa, o futuro fica com próclise."},
{id:"p11-43",n:3,tx:"tq",e:"No segundo parágrafo, em “ofereceu-lhe água”, o pronome “lhe” se refere a",a:["o idoso.", "a equipe.", "a filha.", "a água.", "a corporação."],c:"A equipe ofereceu água ao idoso."},
{id:"p11-44",n:3,tx:"tq",e:"Se o último período do texto começasse por “Não”, a forma de acordo com a norma-padrão seria",a:["Não o encaminharão, nos próximos dias, a uma avaliação médica.", "Não encaminhá-lo-ão, nos próximos dias, a uma avaliação médica.", "Não encaminharão-no, nos próximos dias, a uma avaliação médica.", "Não encaminharão-o, nos próximos dias, a uma avaliação médica.", "Não o encaminhá-lo-ão, nos próximos dias, a uma avaliação médica."],c:"Com a negativa, a mesóclise dá lugar à próclise."},
{id:"p11-45",n:3,e:"Assinale a alternativa em que as duas colocações estão de acordo com a norma-padrão.",a:["Vou entregar-lhe o relatório. / Vou-lhe entregar o relatório.", "Tinha avisado-me. / Tinha-me avisado.", "Entregarei-lhe. / Entregar-lhe-ei.", "Me diga. / Diga-me.", "Ninguém avisou-me. / Ninguém me avisou."],c:"Na locução com infinitivo, o pronome pode ficar depois do auxiliar ou do principal."},
{id:"p11-46",n:3,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Os documentos que entregaram-me estavam incompletos.", "Os documentos que me entregaram estavam incompletos.", "Entregaram-me documentos incompletos.", "Não me entregaram os documentos.", "Entregar-me-ão os documentos amanhã."],c:"O relativo “que” atrai: que me entregaram."},
{id:"p11-47",n:3,e:"Assinale a frase em que a ênclise é obrigatória.",a:["Disseram-me que a escala mudou.", "Não me disseram que a escala mudou.", "Quem me disse que a escala mudou?", "Ninguém me disse que a escala mudou.", "Quando me disseram, já era tarde."],c:"Verbo no início da frase, sem atrativa: ênclise obrigatória."},
{id:"p11-48",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Ter-se-ia evitado o acidente com sinalização.", "Teria-se evitado o acidente com sinalização.", "Se teria evitado-se o acidente com sinalização.", "Ter-se-ia-se evitado o acidente.", "Teria evitado-se o acidente com sinalização."],c:"Auxiliar no futuro do pretérito, sem atrativa, abrindo a frase: mesóclise no auxiliar."},
{id:"p11-49",n:3,e:"Assinale a frase em que a colocação dos pronomes está de acordo com a norma-padrão.",a:["Tudo se resolveu quando o encontramos.", "Tudo resolveu-se quando encontramo-lo.", "Tudo se resolveu quando encontramo-lo.", "Tudo resolveu-se quando o encontramos.", "Se tudo resolveu quando o encontramos."],c:"“Tudo” e “quando” atraem os dois pronomes."},
{id:"p11-50",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Abordamo-lo na saída do terminal.", "Abordamos-lo na saída do terminal.", "Abordamos-o na saída do terminal.", "Abordamo-o na saída do terminal.", "Abordámo-no na saída do terminal."],c:"Abordamos + o: o -s cai e o pronome vira “lo”."},
{id:"p11-51",n:3,e:"Assinale a alternativa em que o pronome “o” assume a forma “lo”.",a:["Vamos vendê-lo no leilão.", "Venderam-no no leilão.", "Vendem-no no leilão.", "Vendeu-o no leilão.", "Não o venderam no leilão."],c:"Vender + o = vendê-lo (o -r cai)."},
{id:"p11-52",n:3,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Tinha esquecido-me do crachá.", "Tinha-me esquecido do crachá.", "Não me tinha esquecido do crachá.", "Eu me tinha esquecido do crachá.", "Esquecera-me do crachá."],c:"Nunca há pronome depois do particípio."},
{id:"p11-53",n:3,e:"Assinale a frase em que há próclise obrigatória por causa de pronome indefinido.",a:["Alguém nos avisou da blitz.", "Não nos avisaram da blitz.", "Quando nos avisaram da blitz, já era tarde.", "O agente que nos avisou da blitz saiu.", "Avisaram-nos da blitz."],c:"Em (A), a atração vem do indefinido “alguém”. Nas demais, de negativa, conjunção e relativo, ou não há próclise."},
{id:"p11-54",n:3,e:"Assinale a frase em que há próclise obrigatória por causa de conjunção subordinativa.",a:["Se o virem, avisem a central.", "Não o viram na praça.", "Alguém o viu na praça.", "O agente que o viu avisou a central.", "Viram-no na praça."],c:"O “se” condicional é conjunção subordinativa."},
{id:"p11-55",n:3,e:"Assinale a frase de acordo com a norma-padrão.",a:["Dir-se-ia que ninguém viu nada.", "Diria-se que ninguém viu nada.", "Se diria-se que ninguém viu nada.", "Dizer-se-ia-se que ninguém viu nada.", "Diria se que ninguém viu nada."],c:"Futuro do pretérito, sem atrativa, abrindo a frase: mesóclise."},
{id:"p11-56",n:3,e:"Assinale a alternativa em que a colocação admite as duas formas.",a:["Eu o vi. / Eu vi-o.", "Não o vi. / Não vi-o.", "Quem o viu? / Quem viu-o?", "Vê-lo-ei. / Verei-o.", "Ninguém o viu. / Ninguém viu-o."],c:"Com sujeito expresso e sem atrativa, próclise e ênclise são aceitas."},
{id:"p11-57",n:3,e:"Assinale a frase em que a colocação está INCORRETA.",a:["Quanto custou-me aquela multa!", "Quanto me custou aquela multa!", "Aquela multa custou-me caro.", "Não me custou caro aquela multa.", "Custar-me-ia caro aquela multa."],c:"Frase exclamativa com “quanto” pede próclise."},
{id:"p11-58",n:3,e:"Assinale a frase em que a ênclise contraria a norma-padrão.",a:["Ninguém respondeu-me na central.", "Responderam-me na central.", "Ontem, responderam-me na central.", "Responda-me pelo rádio.", "Ao responder-me, saiu da sala."],c:"“Ninguém” atrai: ninguém me respondeu."},
{id:"p11-59",n:3,e:"Assinale a afirmação INCORRETA sobre colocação pronominal.",a:["A mesóclise pode ocorrer com qualquer tempo verbal.", "A norma-padrão não inicia frase com pronome oblíquo átono.", "Palavras negativas atraem o pronome para antes do verbo.", "Não há ênclise depois de particípio.", "Com o futuro, sem palavra atrativa, usa-se a mesóclise."],c:"A mesóclise só ocorre com o futuro do presente e o futuro do pretérito."},
{id:"p11-60",n:3,e:"Assinale a alternativa em que todas as frases seguem a norma-padrão.",a:["Não me avisaram; avisar-me-ão amanhã; diga-me a hora.", "Não avisaram-me; avisar-me-ão amanhã; diga-me a hora.", "Não me avisaram; me avisarão amanhã; diga-me a hora.", "Não me avisaram; avisarão-me amanhã; diga-me a hora.", "Não me avisaram; avisar-me-ão amanhã; me diga a hora."],c:"Negativa com próclise; futuro sem atrativa com mesóclise; imperativo com ênclise."}
];

{id:"p12-16",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["Ele começou a trabalhar cedo.", "Ele começou à trabalhar cedo.", "Ele começou há trabalhar cedo.", "Ele começou á trabalhar cedo.", "Ele começou às trabalhar cedo."],c:"Antes de verbo, nunca há crase."},
{id:"p12-17",n:1,e:"Assinale a frase de acordo com a norma-padrão.",a:["O carro estava à venda na esquina.", "O carro estava há venda na esquina.", "O carro estava á venda na esquina.", "O carro estava às venda na esquina.", "O carro estava àa venda na esquina."],c:"Locução feminina: à venda."},

{id:"p12-20",n:1,tx:"tr",e:"No primeiro parágrafo, em “das 18h às 23h”, o acento grave se justifica porque",a:["indica horas determinadas, com preposição e artigo.", "antecede verbo.", "antecede palavra masculina.", "antecede nome de cidade.", "é facultativo."],c:"Horas determinadas levam crase."},
{id:"p12-21",n:2,e:"Assinale a frase em que o acento grave é facultativo.",a:["Refiro-me à sua escala.", "Refiro-me à escala.", "Refiro-me àquela escala.", "Cheguei às 22h.", "Saiu às pressas."],c:"Antes de possessivo feminino singular, o artigo é opcional."},
{id:"p12-22",n:2,e:"Assinale a frase em que o acento grave é facultativo.",a:["Foi até à delegacia.", "Foi à delegacia.", "Foi às pressas.", "Voltou à noite.", "Assistiu à palestra."],c:"Depois de “até”, a crase é facultativa."},

{id:"p12-24",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Voltou a casa depois do plantão.", "Voltou à casa depois do plantão.", "Voltou há casa depois do plantão.", "Voltou às casa depois do plantão.", "Voltou á casa depois do plantão."],c:"Casa no sentido de lar, sem determinante: sem crase."},
{id:"p12-25",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Voltou à casa dos pais depois do plantão.", "Voltou a casa dos pais depois do plantão.", "Voltou há casa dos pais depois do plantão.", "Voltou ás casa dos pais depois do plantão.", "Voltou às casa dos pais depois do plantão."],c:"Com determinante (dos pais), casa aceita artigo: crase."},
{id:"p12-26",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Fui à Campinas da minha infância.", "Fui a Campinas da minha infância.", "Fui há Campinas da minha infância.", "Fui às Campinas da minha infância.", "Fui á Campinas da minha infância."],c:"Cidade com determinante aceita artigo: crase."},
{id:"p12-27",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["A ocorrência de hoje é semelhante à de ontem.", "A ocorrência de hoje é semelhante a de ontem.", "A ocorrência de hoje é semelhante há de ontem.", "A ocorrência de hoje é semelhante á de ontem.", "A ocorrência de hoje é semelhante àa de ontem."],c:"Semelhante a + a (= aquela) de ontem: à de ontem."},
{id:"p12-28",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["A escala à qual me refiro foi alterada.", "A escala a qual me refiro foi alterada.", "A escala há qual me refiro foi alterada.", "A escala á qual me refiro foi alterada.", "A escala às qual me refiro foi alterada."],c:"Referir-se a + a qual: à qual."},
{id:"p12-29",n:2,e:"Assinale a frase de acordo com a norma-padrão.",a:["Fui a reuniões a semana toda.", "Fui à reuniões a semana toda.", "Fui às reunião a semana toda.", "Fui á reuniões a semana toda.", "Fui há reuniões a semana toda."],c:"“A” no singular antes de plural é só preposição."},

<h3>1. A ideia de “por cento”</h3>
<p>Por cento quer dizer “por cem”. Dizer que 25% dos guardas estão de folga é dizer que, a cada 100 guardas, 25 estão de folga; é a fração 25/100, ou 1/4, ou o decimal 0,25. Porcentagem, fração e decimal são três nomes para a mesma coisa. Para passar de porcentagem a decimal, divide-se por 100, ou seja, anda-se com a vírgula duas casas para a esquerda: 35% = 0,35; 8% = 0,08; 150% = 1,5. Para voltar, multiplica-se por 100.</p>
<p>Calcular uma porcentagem de um valor é multiplicar o valor pelo decimal. A palavra “de” continua sendo multiplicação: 20% de 300 é 0,20 × 300 = 60. Alguns atalhos poupam conta. Para achar 10%, divida por 10. Para 1%, divida por 100. Para 50%, divida por 2; para 25%, divida por 4. Os demais saem por combinação: 15% de 80 é 10% mais a metade de 10%, ou 8 + 4 = 12. Porcentagem acima de 100% é válida e significa mais que o todo: 150% de 40 é 60.</p>
<p>Se o todo é o preço de um produto, 100% é o preço inteiro. Um produto que custa R$ 200,00 e tem 15% de desconto custa 85% do preço original, porque 100% − 15% = 85%. Guarde esta ideia, porque ela vai simplificar tudo mais adiante: em vez de calcular o desconto e subtrair, calcule direto quanto sobra.</p>
<h3>2. Parte, todo e taxa</h3>
<p>Todo problema simples de porcentagem tem três ingredientes: o todo, a parte e a taxa. A relação entre eles é parte = taxa × todo. A pergunta é que ingrediente falta, e há três versões.</p>
<p>Na primeira, falta a parte. Quanto é 30% de 250? A parte é 0,30 × 250 = 75. Na segunda, falta a taxa. 15 é quantos por cento de 60? A taxa é parte ÷ todo = 15 ÷ 60 = 0,25, ou 25%. Na terceira, falta o todo. Se 35% de um número é 70, que número é esse? O todo é parte ÷ taxa = 70 ÷ 0,35 = 200.</p>
<p>A dica de leitura é perguntar “em relação a quê?”. A palavra que vem depois de “de”, ou depois de “em relação a”, é o todo, e é por ele que se divide quando se quer a taxa. Se 8 pessoas são aprovadas num grupo de 32, a taxa de aprovação é 8 ÷ 32 = 25%, e não 32 ÷ 8.</p>
<p>Exemplo resolvido. Em um grupo de 60 guardas, 45% são mulheres. Quantos são homens? Há dois caminhos. No primeiro, calcula-se o número de mulheres, 0,45 × 60 = 27, e subtrai-se: 60 − 27 = 33 homens. No segundo, usa-se o complemento: se 45% são mulheres, 55% são homens, e 0,55 × 60 = 33. O segundo caminho é mais curto e é o que a prova premia.</p>
<h3>3. Aumento e desconto: o fator multiplicador</h3>
<p>Aumentar um valor em 15% é ficar com 100% + 15% = 115% dele, e 115% é 1,15. Descontar 20% é ficar com 100% − 20% = 80% dele, e 80% é 0,80. Esses números, 1,15 e 0,80, são os fatores multiplicadores. Em vez de calcular o aumento e depois somar, multiplica-se uma só vez.</p>
<p>Com taxa de aumento i, o fator é 1 + i. Com taxa de desconto i, o fator é 1 − i. Assim, um produto de R$ 80,00 com aumento de 15% passa a custar 80 × 1,15 = R$ 92,00. Um produto de R$ 150,00 com desconto de 20% passa a custar 150 × 0,80 = R$ 120,00. Aumento de 30% tem fator 1,30; desconto de 15% tem fator 0,85; aumento de 100% tem fator 2, porque o valor dobra.</p>
<p>O fator multiplicador também resolve a pergunta inversa, a de descobrir a variação. Se um valor passou de 80 para 100, o fator é 100 ÷ 80 = 1,25, e a variação é fator − 1 = 0,25, um aumento de 25%. Se passou de 100 para 80, o fator é 0,80, e a variação é −20%, uma queda de 20%. Note que a mesma diferença de 20 unidades vale 25% quando a base é 80 e 20% quando a base é 100. A variação percentual é sempre calculada sobre o valor inicial.</p>
<div class="box">Variação percentual = (valor final − valor inicial) ÷ valor inicial. A base é o valor de antes, nunca o de depois.</div>
<h3>4. Variações sucessivas</h3>
<p>Quando há dois aumentos, dois descontos ou um aumento seguido de desconto, os percentuais não se somam. O segundo incide sobre o resultado do primeiro, e por isso os fatores se multiplicam. A razão é simples: depois do primeiro aumento, o valor é outro, e a segunda porcentagem é calculada sobre esse valor novo.</p>
<p>O caso que a prova ama é o de um aumento de 20% seguido de um desconto de 20%. Muita gente conclui que o valor volta ao que era. Não volta. Os fatores são 1,20 e 0,80, e 1,20 × 0,80 = 0,96. O resultado final é 96% do valor original, uma queda de 4%. Com um preço de R$ 100,00, o aumento leva a R$ 120,00, e 20% de 120 é 24, que deixa R$ 96,00. O desconto de 20% foi aplicado sobre uma base maior, e por isso tirou mais do que o aumento acrescentou.</p>
<p>O mesmo vale para dois descontos. Um desconto de 10% seguido de outro de 20% tem fator 0,90 × 0,80 = 0,72, e o desconto total é 1 − 0,72 = 28%, não 30%. Dois aumentos de 10% têm fator 1,10 × 1,10 = 1,21, ou seja, aumento total de 21%. Três descontos de 10% têm fator 0,90<sup>3</sup> = 0,729, e o desconto total é 27,1%.</p>
<p>O mesmo raciocínio explica o crescimento composto: um valor que cresce 10% ao mês durante 3 meses fica multiplicado por 1,10<sup>3</sup> = 1,331, ou seja, 33,1% de aumento total, e não 30%.</p>
<p>Exemplo resolvido. O salário de R$ 2.400,00 recebeu um aumento de 15% e, no mês seguinte, outro de 10%. Qual o salário final? Os fatores são 1,15 e 1,10. Então 2.400 × 1,15 = 2.760 e 2.760 × 1,10 = 3.036. O salário final é R$ 3.036,00, e o aumento total foi de 26,5%, e não de 25%, porque 1,15 × 1,10 = 1,265.</p>
<h3>5. Voltar ao valor original e outras armadilhas</h3>
<p>Se um valor foi multiplicado por um fator, para recuperar o original divide-se pelo mesmo fator. Um produto que, depois de um aumento de 25%, custa R$ 150,00, tinha preço original de 150 ÷ 1,25 = R$ 120,00. Um produto que, depois de um desconto de 20%, foi vendido por R$ 144,00, custava 144 ÷ 0,80 = R$ 180,00. O erro típico é calcular 25% de 150 e subtrair, o que dá R$ 112,50, porque o aumento incidiu sobre o valor antigo e não sobre o novo.</p>
<p>Pela mesma lógica, o aumento que desfaz um desconto não é igual ao desconto. Depois de um desconto de 20%, o valor é 0,80 do original, e para voltar a 1 é preciso multiplicar por 1 ÷ 0,80 = 1,25, ou seja, um aumento de 25%. Da mesma forma, um aumento de 25% é desfeito por um desconto de 20%, porque 1,25 × 0,80 = 1.</p>
<p>Outra confusão é entre porcentagem e pontos percentuais. Se a taxa de aprovação subiu de 40% para 55%, a diferença é de 15 pontos percentuais. Já o aumento relativo é de 15 ÷ 40 = 37,5%. Quando o enunciado diz “pontos percentuais”, é a subtração das taxas; quando diz “aumento de X%”, é a variação relativa.</p>
<p>Por fim, em problemas de mistura, como 40 litros de uma solução a 30% de álcool com 60 litros de outra a 20%, somam-se as partes e divide-se pelo total. O álcool é 0,30 × 40 + 0,20 × 60 = 12 + 12 = 24 litros, num total de 100 litros: concentração de 24%. A média simples dos percentuais, 25%, estaria errada, porque as quantidades são diferentes.</p>
<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>O preço de uma jaqueta recebeu dois descontos sucessivos, o primeiro de 20% e o segundo de 10%. O desconto total sobre o preço original foi de</p>
<ol class="alts" type="A"><li>30%</li><li>32%</li><li>27%</li><li>28%</li><li>25%</li></ol>
<p><strong>Resposta: D.</strong> Fatores 0,80 e 0,90: 0,80 × 0,90 = 0,72. O preço final é 72% do original, e o desconto total é 100% − 72% = 28%. Os descontos não se somam.</p>
<h4>Questão 2</h4>
<p>Em uma sala, 40% dos candidatos são mulheres. Depois de 10 homens saírem, as mulheres passam a ser 50% dos presentes. O número inicial de candidatos era</p>
<ol class="alts" type="A"><li>50</li><li>40</li><li>60</li><li>80</li><li>100</li></ol>
<p><strong>Resposta: A.</strong> Seja N o total. Mulheres: 0,4N; homens: 0,6N. Saindo 10 homens, as mulheres (0,4N) igualam os homens restantes (0,6N − 10). Então 0,4N = 0,6N − 10, e 0,2N = 10, logo N = 50. Conferindo: 20 mulheres e 30 homens; saem 10, ficam 20 e 20.</p>
<h4>Questão 3</h4>
<p>Depois de um aumento de 25%, um produto passou a custar R$ 150,00. O preço antes do aumento era</p>
<ol class="alts" type="A"><li>R$ 112,50</li><li>R$ 125,00</li><li>R$ 120,00</li><li>R$ 130,00</li><li>R$ 187,50</li></ol>
<p><strong>Resposta: C.</strong> O preço novo é 125% do antigo: 1,25 × antigo = 150, então antigo = 150 ÷ 1,25 = 120. O erro seria tirar 25% de 150, que dá 112,50, porque os 25% incidiram sobre o preço antigo.</p>
<h4>Questão 4</h4>
<p>A taxa de aprovação em um curso passou de 40% para 55%. É correto afirmar que a taxa</p>
<ol class="alts" type="A"><li>aumentou 15%, em termos relativos.</li><li>aumentou 15 pontos percentuais, ou 37,5% em termos relativos.</li><li>aumentou 15 pontos percentuais, ou 15% em termos relativos.</li><li>aumentou 37,5 pontos percentuais.</li><li>aumentou 27,5%, em termos relativos.</li></ol>
<p><strong>Resposta: B.</strong> A diferença entre as taxas é 55 − 40 = 15 pontos percentuais. A variação relativa é 15 ÷ 40 = 0,375, ou 37,5%. Pontos percentuais e porcentagem são medidas diferentes.</p>
<h3>7. Na rotina do guarda</h3>
<ul>
<li><strong>Estatística de ocorrências:</strong> “os furtos caíram 20% em relação ao semestre anterior” exige calcular sobre o valor do semestre anterior. Se foram 250 e caíram 20%, passaram a 200.</li>
<li><strong>Compras do órgão:</strong> em uma licitação, dois descontos sucessivos de 10% e 5% não valem 15%; valem 1 − 0,90 × 0,95 = 14,5%.</li>
<li><strong>Relatório de efetivo:</strong> “45% do efetivo é feminino” vira número de pessoas só depois de multiplicar pelo total.</li>
<li><strong>Orçamento de combustível:</strong> um reajuste de 8% sobre R$ 2.500,00 leva a R$ 2.700,00, e esse novo valor é a base do reajuste seguinte.</li>
<li><strong>Leitura de gráficos e tabelas:</strong> “aumentou 10 pontos percentuais” e “aumentou 10%” são afirmações diferentes, e a prova costuma explorar a diferença.</li>
</ul>
<h3>8. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Somar 20% e −20% e dizer que volta ao original</td>
<td>Multiplique os fatores: 1,20 × 0,80 = 0,96, queda de 4%</td>
</tr>
<tr>
<td>Somar 10% e 20% de descontos como 30%</td>
<td>Multiplique 0,90 × 0,80 = 0,72, desconto de 28%</td>
</tr>
<tr>
<td>Calcular 25% sobre o preço novo para achar o original</td>
<td>Divida o preço novo pelo fator: 150 ÷ 1,25</td>
</tr>
<tr>
<td>Calcular a variação sobre o valor final</td>
<td>A base é sempre o valor inicial</td>
</tr>
<tr>
<td>Confundir pontos percentuais com porcentagem</td>
<td>De 40% para 55% são 15 pontos e 37,5% relativos</td>
</tr>
<tr>
<td>Fazer a média simples de percentuais com bases diferentes</td>
<td>Some as partes e divida pelo total</td>
</tr>
<tr>
<td>Achar que 100% mais 100% é o triplo</td>
<td>Aumento de 100% dobra: fator 2</td>
</tr>
<tr>
<td>Dar a resposta como fração quando pedem porcentagem</td>
<td>Multiplique por 100 e escreva o símbolo %</td>
</tr>
</tbody>
</table></div>
<h3>9. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>Por cento</td>
<td>Fração de denominador 100: 35% = 35/100 = 0,35</td>
</tr>
<tr>
<td>Parte, todo e taxa</td>
<td>parte = taxa × todo; taxa = parte ÷ todo; todo = parte ÷ taxa</td>
</tr>
<tr>
<td>Aumento de i</td>
<td>Fator 1 + i</td>
</tr>
<tr>
<td>Desconto de i</td>
<td>Fator 1 − i</td>
</tr>
<tr>
<td>Variação percentual</td>
<td>(final − inicial) ÷ inicial</td>
</tr>
<tr>
<td>Variações sucessivas</td>
<td>Multiplicam-se os fatores; não se somam as taxas</td>
</tr>
<tr>
<td>Voltar ao original</td>
<td>Divide-se pelo fator</td>
</tr>
<tr>
<td>Pontos percentuais</td>
<td>Diferença entre duas taxas</td>
</tr>
</tbody>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Iezzi, Dolce e Murakami, <em>Fundamentos de Matemática Elementar</em>, v. 11 (Matemática comercial); Dante, <em>Matemática: contexto e aplicações</em>. Exemplos criados para a aula; resultados recalculados em código.</p>

"mt-4": `
<span class="status">Versão 1 · em revisão</span>
<p>Razão e proporção é o assunto que explica por que a regra de três funciona. A Vunesp cobra três coisas: calcular e comparar razões (inclusive com unidades diferentes e escalas), resolver proporções e reconhecer se duas grandezas variam na mesma direção ou em direções opostas, para então dividir um valor proporcionalmente. A ideia central cabe em uma frase: duas grandezas são proporcionais quando mudam juntas, mantendo uma relação fixa.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Razão e proporção: da comparação à divisão" font-size="13">
<text x="24" y="28" font-size="16" font-weight="600">Razão e proporção: da comparação à divisão</text>
<rect class="ac" x="24" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="74" text-anchor="middle" font-weight="600">Razão</text>
<text x="136" y="96" text-anchor="middle" font-size="12">quociente a/b</text>
<text x="136" y="112" text-anchor="middle" font-size="12">mesmas unidades</text>
<text x="136" y="128" text-anchor="middle" font-size="12">escala, velocidade, densidade</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">Proporção</text>
<text x="380" y="96" text-anchor="middle" font-size="12">a/b = c/d</text>
<text x="380" y="112" text-anchor="middle" font-size="12">meios × meios = extremos</text>
<text x="380" y="128" text-anchor="middle" font-size="12">soma dos termos</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Grandezas diretas</text>
<text x="624" y="96" text-anchor="middle" font-size="12">crescem juntas</text>
<text x="624" y="112" text-anchor="middle" font-size="12">razão constante</text>
<text x="624" y="128" text-anchor="middle" font-size="12">preço × quantidade</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Grandezas inversas</text>
<text x="136" y="224" text-anchor="middle" font-size="12">uma cresce, outra decresce</text>
<text x="136" y="240" text-anchor="middle" font-size="12">produto constante</text>
<text x="136" y="256" text-anchor="middle" font-size="12">velocidade × tempo</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Divisão proporcional</text>
<text x="380" y="224" text-anchor="middle" font-size="12">soma das razões</text>
<text x="380" y="240" text-anchor="middle" font-size="12">k = total ÷ soma</text>
<text x="380" y="256" text-anchor="middle" font-size="12">inversa: usa os inversos</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Escala</text>
<text x="624" y="224" text-anchor="middle" font-size="12">1:50.000 = 1 cm para 500 m</text>
<text x="624" y="240" text-anchor="middle" font-size="12">converter antes</text>
<text x="624" y="256" text-anchor="middle" font-size="12">mapa e planta</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 1</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: pergunte se as grandezas crescem juntas ou em sentidos opostos</text>
</svg>
<figcaption>A razão é a peça básica; a proporção iguala duas razões; as grandezas e a divisão proporcional usam as duas.</figcaption>
</figure>
<h3>1. Razão: comparar por divisão</h3>
<p>Razão entre dois números é o quociente entre eles. Dizer que há 12 guardas para cada 20 viaturas é dizer que a razão entre guardas e viaturas é 12/20, ou 3/5. Lê-se “3 para 5”, e significa que, a cada 3 guardas, há 5 viaturas. A ordem importa: a razão entre viaturas e guardas é 5/3, outro número.</p>
<p>Para comparar, as unidades precisam ser iguais. A razão entre 40 minutos e 2 horas não é 40/2. Primeiro converta: 2 horas são 120 minutos, e a razão é 40/120 = 1/3. Quando as unidades são diferentes de propósito, a razão ganha nome e unidade própria: velocidade é a razão entre distância e tempo (120 km em 2 h dão 60 km/h); densidade é a razão entre massa e volume; escala é a razão entre o desenho e a realidade.</p>
<p>Escala 1:50.000 significa que 1 cm no mapa representa 50.000 cm no terreno. Como 50.000 cm são 500 m, cada centímetro do mapa vale meio quilômetro. Uma distância de 3 cm no mapa equivale a 3 × 500 = 1.500 m, ou 1,5 km. Na escala 1:100, 5 cm no desenho são 500 cm, ou 5 m, no real.</p>
<h3>2. Proporção: duas razões iguais</h3>
<p>Proporção é a igualdade entre duas razões: a/b = c/d. Em 3/4 = 15/20, os dois lados valem 0,75. Os termos de fora, a e d, são os extremos; os de dentro, b e c, são os meios. A propriedade fundamental diz que o produto dos meios é igual ao produto dos extremos: a × d = b × c. No exemplo, 3 × 20 = 4 × 15 = 60. É a conhecida “multiplicação em cruz”, e ela existe porque multiplicar os dois lados da igualdade por b e por d elimina os denominadores.</p>
<p>Para achar o termo que falta, aplique a propriedade. Em 5/x = 10/4, tem-se 10x = 5 × 4 = 20, logo x = 2. Em x/6 = 10/15, tem-se 15x = 60, logo x = 4.</p>
<p>Há uma segunda propriedade, muito usada em divisões: em uma proporção, a soma dos antecedentes está para a soma dos consequentes como cada antecedente para o seu consequente. Em a/b = c/d, vale (a + c)/(b + d) = a/b. Com 3/4 = 15/20, (3 + 15)/(4 + 20) = 18/24 = 3/4.</p>
<h3>3. Grandezas diretamente e inversamente proporcionais</h3>
<p>Duas grandezas são diretamente proporcionais quando, dobrando uma, a outra também dobra; triplicando uma, a outra triplica. A razão entre elas é constante. Oito canetas a R$ 3,00 custam R$ 24,00, e 16 canetas custam R$ 48,00: a razão preço por caneta é sempre 3. O distanciamento acompanha o tempo, a velocidade se mantendo.</p>
<p>Duas grandezas são inversamente proporcionais quando, dobrando uma, a outra cai pela metade; triplicando uma, a outra cai à terça parte. Neste caso, o que se mantém constante é o produto. Se 4 guardas fazem uma vistoria em 6 horas, então 8 guardas, o dobro, fazem em 3 horas, a metade: 4 × 6 = 8 × 3 = 24 “guarda-horas” de trabalho. Velocidade e tempo, para uma mesma distância, são inversamente proporcionais.</p>
<p>A pergunta que decide o caso é: “se uma aumentar, a outra aumenta ou diminui?”. Se as duas crescem juntas, é direta; se uma cresce e a outra decresce, é inversa. Cuidado com o falso proporcional: a idade de uma pessoa e a sua altura crescem juntas, mas não de forma proporcional, porque a razão entre elas não é constante.</p>
<div class="box">Na direta, as razões são iguais (a/b = c/d). Na inversa, uma razão é igual ao inverso da outra (a/b = d/c), ou seja, o produto é constante.</div>
<h3>4. Divisão proporcional</h3>
<p>Dividir um valor em partes proporcionais é repartir de modo que cada parte siga a razão dada. A ideia é achar a constante k que multiplica cada número do grupo. Dividir R$ 12.000,00 entre três guardas, proporcionalmente ao número de ocorrências que atenderam (5, 7 e 8), funciona assim: some os números, 5 + 7 + 8 = 20; divida o total pela soma, 12.000 ÷ 20 = 600, que é o valor de cada “unidade”; e multiplique: 5 × 600 = 3.000, 7 × 600 = 4.200 e 8 × 600 = 4.800. A soma volta a ser 12.000.</p>
<p>Na divisão inversamente proporcional, usam-se os inversos. Dividir 130 em partes inversamente proporcionais a 2 e 3 é dividir proporcionalmente a 1/2 e 1/3. Com denominador comum, 3/6 e 2/6, as razões são 3 e 2. Soma 5, constante 130 ÷ 5 = 26, partes 78 e 52. Note que a parte maior foi para o menor número, como pede a inversão.</p>
<p>Exemplo resolvido. Dividir 90 em partes proporcionais a 2 e 3. Soma 5; 90 ÷ 5 = 18; partes 36 e 54.</p>
<h3>5. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Em um mapa de escala 1:25.000, a distância entre dois postos é de 8 cm. A distância real é de</p>
<ol class="alts" type="A"><li>200 m.</li><li>20 km.</li><li>2 km.</li><li>3,2 km.</li><li>2,5 km.</li></ol>
<p><strong>Resposta: C.</strong> 1 cm no mapa são 25.000 cm, ou 250 m. Então 8 cm são 8 × 250 = 2.000 m = 2 km.</p>
<h4>Questão 2</h4>
<p>Quatro guardas fazem uma vistoria em 6 horas. Mantido o ritmo, 6 guardas fariam a mesma vistoria em</p>
<ol class="alts" type="A"><li>9 horas.</li><li>3 horas.</li><li>5 horas.</li><li>8 horas.</li><li>4 horas.</li></ol>
<p><strong>Resposta: E.</strong> Guardas e tempo são inversamente proporcionais: o produto é constante. 4 × 6 = 24 e 24 ÷ 6 = 4 horas.</p>
<h4>Questão 3</h4>
<p>Um prêmio de R$ 1.800,00 será dividido, de forma diretamente proporcional ao tempo de serviço, entre dois guardas de 4 e 5 anos de casa. O guarda de 5 anos receberá</p>
<ol class="alts" type="A"><li>R$ 1.000,00</li><li>R$ 800,00</li><li>R$ 900,00</li><li>R$ 1.080,00</li><li>R$ 720,00</li></ol>
<p><strong>Resposta: A.</strong> Soma 4 + 5 = 9; 1.800 ÷ 9 = 200 por unidade. O de 5 anos recebe 5 × 200 = 1.000; o de 4 anos, 800.</p>
<h4>Questão 4</h4>
<p>Dividir 130 em partes inversamente proporcionais a 2 e a 3 resulta em</p>
<ol class="alts" type="A"><li>52 e 78.</li><li>65 e 65.</li><li>80 e 50.</li><li>78 e 52.</li><li>60 e 70.</li></ol>
<p><strong>Resposta: D.</strong> Usam-se os inversos 1/2 e 1/3, que valem 3/6 e 2/6, razões 3 e 2. Constante 130 ÷ 5 = 26: 3 × 26 = 78 e 2 × 26 = 52. A maior parte vai ao menor número.</p>
<h3>6. Na rotina do guarda</h3>
<ul>
<li><strong>Mapa e escala:</strong> ao medir 8 cm entre dois pontos num mapa 1:25.000, a distância real é 8 × 250 = 2.000 m, ou 2 km.</li>
<li><strong>Rateio de gratificação:</strong> valor proporcional às ocorrências atendidas, como na divisão proporcional da seção 4.</li>
<li><strong>Efetivo e tempo:</strong> inversamente proporcionais; dobrar as equipes em uma vistoria reduz o tempo à metade, mantidas as condições.</li>
<li><strong>Consumo e distância:</strong> a viatura que faz 10 km por litro gasta 5 litros em 50 km, e o gasto é diretamente proporcional.</li>
</ul>
<h3>7. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Montar a razão sem converter as unidades</td>
<td>Converta antes: 40 min e 2 h viram 40 e 120</td>
</tr>
<tr>
<td>Inverter a ordem da razão</td>
<td>A razão “de A para B” é A/B</td>
</tr>
<tr>
<td>Tratar como direta uma grandeza inversa</td>
<td>Pergunte: aumentando uma, a outra aumenta ou diminui?</td>
</tr>
<tr>
<td>Dividir inversamente usando os próprios números</td>
<td>Use os inversos e leve a maior parte ao menor número</td>
</tr>
<tr>
<td>Errar a escala trocando cm por km</td>
<td>1:50.000 é 1 cm para 500 m</td>
</tr>
<tr>
<td>Esquecer de conferir a soma das partes</td>
<td>As partes devem somar o total</td>
</tr>
</tbody>
</table></div>
<h3>8. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>Razão</td>
<td>Quociente a/b; mesmas unidades</td>
</tr>
<tr>
<td>Escala</td>
<td>Desenho para real; 1:50.000 é 1 cm para 500 m</td>
</tr>
<tr>
<td>Proporção</td>
<td>a/b = c/d; a × d = b × c</td>
</tr>
<tr>
<td>Grandezas diretas</td>
<td>Razão constante; crescem juntas</td>
</tr>
<tr>
<td>Grandezas inversas</td>
<td>Produto constante; uma cresce, a outra decresce</td>
</tr>
<tr>
<td>Divisão proporcional</td>
<td>Soma das razões; k = total ÷ soma; parte = razão × k</td>
</tr>
<tr>
<td>Divisão inversa</td>
<td>Usa os inversos dos números</td>
</tr>
</tbody>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Iezzi, Dolce e Murakami, <em>Fundamentos de Matemática Elementar</em>, v. 11; Dante, <em>Matemática: contexto e aplicações</em>. Exemplos criados para a aula; resultados recalculados em código.</p>

"mt-5": `
<span class="status">Versão 1 · em revisão</span>
<p>Regra de três é o método para resolver, com uma conta só, problemas em que três valores são conhecidos e um quarto precisa ser descoberto. A Vunesp cobra a regra simples direta, a simples inversa e a composta, com três ou mais grandezas. O ponto decisivo não é a conta, que é uma multiplicação em cruz, e sim classificar cada grandeza como direta ou inversa em relação à que se procura. Esta aula ensina a classificar primeiro e calcular depois.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Regra de três: classifique primeiro, calcule depois" font-size="13">
<text x="24" y="28" font-size="16" font-weight="600">Regra de três: classifique primeiro, calcule depois</text>
<rect class="ac" x="24" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="74" text-anchor="middle" font-weight="600">Simples direta</text>
<text x="136" y="96" text-anchor="middle" font-size="12">as duas crescem juntas</text>
<text x="136" y="112" text-anchor="middle" font-size="12">razões iguais</text>
<text x="136" y="128" text-anchor="middle" font-size="12">3/5 = 24/x</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">Simples inversa</text>
<text x="380" y="96" text-anchor="middle" font-size="12">uma cresce, a outra decresce</text>
<text x="380" y="112" text-anchor="middle" font-size="12">produto constante</text>
<text x="380" y="128" text-anchor="middle" font-size="12">trabalho total fixo</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Composta</text>
<text x="624" y="96" text-anchor="middle" font-size="12">compare com a incógnita</text>
<text x="624" y="112" text-anchor="middle" font-size="12">inverta as inversas</text>
<text x="624" y="128" text-anchor="middle" font-size="12">multiplique as razões</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Redução à unidade</text>
<text x="136" y="224" text-anchor="middle" font-size="12">ache o valor de 1</text>
<text x="136" y="240" text-anchor="middle" font-size="12">multiplique depois</text>
<text x="136" y="256" text-anchor="middle" font-size="12">funciona sempre</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Trabalho total</text>
<text x="380" y="224" text-anchor="middle" font-size="12">homens × horas × dias</text>
<text x="380" y="240" text-anchor="middle" font-size="12">guarda-hora, máquina-dia</text>
<text x="380" y="256" text-anchor="middle" font-size="12">divida pelo ritmo novo</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Conferência</text>
<text x="624" y="224" text-anchor="middle" font-size="12">unidades iguais</text>
<text x="624" y="240" text-anchor="middle" font-size="12">sentido coerente</text>
<text x="624" y="256" text-anchor="middle" font-size="12">mais gente, menos tempo</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 6</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: pergunte se uma cresce quando a outra cresce e confira o sentido da resposta</text>
</svg>
<figcaption>A classificação em direta ou inversa decide a conta; a redução à unidade e o trabalho total servem de rede de segurança.</figcaption>
</figure>
<h3>1. Regra de três simples direta</h3>
<p>A ideia vem da proporção. Se 3 viaturas gastam 24 litros de combustível em uma ronda, quantos litros gastam 5 viaturas na mesma ronda? Organize os dados em duas linhas, com cada grandeza na sua coluna, e a incógnita x no lugar do que se quer:</p>
<p>viaturas: 3 e 5; litros: 24 e x.</p>
<p>Mais viaturas gastam mais combustível, então as grandezas crescem juntas: são diretamente proporcionais. Nesse caso as razões são iguais: 3/5 = 24/x. Multiplicando em cruz, 3x = 5 × 24 = 120, e x = 40 litros.</p>
<p>Uma segunda forma de pensar dispensa o esquema: primeiro ache o valor de uma unidade. Se 3 viaturas gastam 24 litros, 1 viatura gasta 8 litros, e 5 viaturas gastam 5 × 8 = 40 litros. É a chamada redução à unidade, e vale a pena porque funciona também quando o esquema embaralha.</p>
<h3>2. Regra de três simples inversa</h3>
<p>Se 4 guardas fazem uma vistoria em 6 horas, em quanto tempo 8 guardas fazem a mesma vistoria? Mais guardas, menos tempo: as grandezas variam em sentidos opostos, e são inversamente proporcionais. Aqui a razão de uma é igual ao inverso da razão da outra: 4/8 = x/6. Resolvendo, 8x = 24, e x = 3 horas.</p>
<p>A segunda forma é mais intuitiva: o trabalho total vale 4 × 6 = 24 guarda-horas, uma quantidade que se mantém. Com 8 guardas, o tempo é 24 ÷ 8 = 3 horas.</p>
<p>O erro mais comum é aplicar a multiplicação em cruz da direta a um problema inverso. Por isso, o primeiro passo é sempre o mesmo: pergunte “aumentando uma, a outra aumenta ou diminui?” e só então monte a proporção.</p>
<h3>3. Regra de três composta</h3>
<p>Na regra composta há mais de duas grandezas. O método é comparar cada uma, separadamente, com a grandeza que contém a incógnita, mantendo as demais fixas, e dizer se é direta ou inversa em relação a ela. Depois, multiplicam-se as razões, invertendo as das grandezas inversas.</p>
<p>Exemplo resolvido. Seis guardas, trabalhando 8 horas por dia, patrulham um parque em 5 dias. Em quantos dias 10 guardas, trabalhando 6 horas por dia, patrulham o mesmo parque? A incógnita são os dias. Comparando com os dias: guardas, quanto mais, menos dias, então é inversa; horas por dia, quanto mais, menos dias, também inversa. Escreve-se a razão dos dias como o produto dos inversos: 5/x = (10/6) × (6/8). Calculando, 5/x = 60/48 = 5/4, e x = 4 dias. Pelo caminho do trabalho total: 6 × 8 × 5 = 240 guarda-horas, e 10 × 6 = 60 por dia, logo 240 ÷ 60 = 4 dias.</p>
<p>Exemplo resolvido com direta e inversa juntas. Três máquinas produzem 120 peças em 4 horas. Quantas peças 5 máquinas produzem em 6 horas? A incógnita são as peças. Com mais máquinas, mais peças (direta), e com mais horas, mais peças (direta). Então x/120 = (5/3) × (6/4) = 30/12 = 5/2, e x = 300 peças.</p>
<h3>4. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Três viaturas gastam 24 litros de combustível em uma ronda. Para a mesma ronda, cinco viaturas gastarão</p>
<ol class="alts" type="A"><li>14,4 litros.</li><li>30 litros.</li><li>40 litros.</li><li>45 litros.</li><li>120 litros.</li></ol>
<p><strong>Resposta: C.</strong> Mais viaturas, mais combustível: direta. 3/5 = 24/x → x = 40.</p>
<h4>Questão 2</h4>
<p>Quatro guardas fazem uma vistoria em 6 horas. Oito guardas, no mesmo ritmo, fariam em</p>
<ol class="alts" type="A"><li>3 horas.</li><li>12 horas.</li><li>4 horas.</li><li>2 horas.</li><li>24 horas.</li></ol>
<p><strong>Resposta: A.</strong> Mais guardas, menos tempo: inversa. 4 × 6 = 8 × x → x = 3.</p>
<h4>Questão 3</h4>
<p>Seis guardas, trabalhando 8 horas por dia, patrulham um parque em 5 dias. Dez guardas, trabalhando 6 horas por dia, patrulham o mesmo parque em</p>
<ol class="alts" type="A"><li>6 dias.</li><li>5 dias.</li><li>7,5 dias.</li><li>3 dias.</li><li>4 dias.</li></ol>
<p><strong>Resposta: E.</strong> Trabalho total: 6 × 8 × 5 = 240 guarda-horas. Por dia, 10 × 6 = 60. Logo 240 ÷ 60 = 4 dias.</p>
<h4>Questão 4</h4>
<p>Três máquinas produzem 120 peças em 4 horas. Cinco máquinas, em 6 horas, produzem</p>
<ol class="alts" type="A"><li>200 peças.</li><li>300 peças.</li><li>240 peças.</li><li>180 peças.</li><li>150 peças.</li></ol>
<p><strong>Resposta: B.</strong> Cada máquina produz 120 ÷ (3 × 4) = 10 peças por hora. 5 máquinas × 6 horas × 10 = 300.</p>
<h3>5. Na rotina do guarda</h3>
<ul>
<li><strong>Combustível:</strong> se 3 viaturas gastam 24 litros em uma ronda, 5 viaturas gastam 40 litros, supondo mesmo trajeto.</li>
<li><strong>Escala de serviço:</strong> com mais guardas por turno, a mesma vistoria termina antes; a relação é inversa.</li>
<li><strong>Material de escritório:</strong> 1.200 folhas para 20 dias; para 30 dias, mantido o consumo diário, são 1.800 folhas.</li>
<li><strong>Plantões:</strong> o número de horas extras pagas cresce de modo direto com o número de plantões feitos.</li>
</ul>
<h3>6. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>Usar multiplicação em cruz direta num problema inverso</td>
<td>Classifique antes: aumenta uma, a outra aumenta ou diminui?</td>
</tr>
<tr>
<td>Comparar as grandezas entre si, e não com a incógnita</td>
<td>Compare cada uma com a que tem o x</td>
</tr>
<tr>
<td>Misturar unidades (min e h, m e km)</td>
<td>Converta tudo antes de montar</td>
</tr>
<tr>
<td>Esquecer de inverter a razão da grandeza inversa</td>
<td>Na dúvida, use o trabalho total constante</td>
</tr>
<tr>
<td>Dar o resultado sem conferir se faz sentido</td>
<td>Mais gente e menos tempo; menos gente e mais tempo</td>
</tr>
</tbody>
</table></div>
<h3>7. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>Simples direta</td>
<td>As duas crescem juntas; razões iguais</td>
</tr>
<tr>
<td>Simples inversa</td>
<td>Uma cresce, a outra decresce; produto constante</td>
</tr>
<tr>
<td>Composta</td>
<td>Compare cada grandeza com a incógnita; multiplique as razões</td>
</tr>
<tr>
<td>Redução à unidade</td>
<td>Ache o valor de 1 e depois multiplique</td>
</tr>
<tr>
<td>Conferência</td>
<td>Unidades iguais; resposta coerente com o sentido</td>
</tr>
</tbody>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Iezzi, Dolce e Murakami, <em>Fundamentos de Matemática Elementar</em>, v. 11; Dante, <em>Matemática: contexto e aplicações</em>. Exemplos criados para a aula; resultados recalculados em código.</p>
`,
"mt-6": `
<span class="status">Versão 1 · em revisão</span>
<p>Equação é uma igualdade com um valor desconhecido, e resolvê-la é descobrir esse valor. A Vunesp cobra duas coisas: resolver equações do 1º e do 2º graus e, principalmente, montar a equação a partir de um problema escrito. A conta costuma ser curta; o trabalho difícil é traduzir o texto. Esta aula começa pela imagem da balança, passa à resolução passo a passo e dedica uma seção inteira à tradução do enunciado.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Equações: traduzir, resolver, conferir" font-size="13">
<text x="24" y="28" font-size="16" font-weight="600">Equações: traduzir, resolver, conferir</text>
<rect class="ac" x="24" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="74" text-anchor="middle" font-weight="600">Balança</text>
<text x="136" y="96" text-anchor="middle" font-size="12">mesma operação nos dois lados</text>
<text x="136" y="112" text-anchor="middle" font-size="12">operação inversa</text>
<text x="136" y="128" text-anchor="middle" font-size="12">muda de lado, muda de sinal</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">1º grau</text>
<text x="380" y="96" text-anchor="middle" font-size="12">x = −b/a</text>
<text x="380" y="112" text-anchor="middle" font-size="12">tira parênteses e denominadores</text>
<text x="380" y="128" text-anchor="middle" font-size="12">confere substituindo</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Tradução</text>
<text x="624" y="96" text-anchor="middle" font-size="12">defina a incógnita</text>
<text x="624" y="112" text-anchor="middle" font-size="12">dobro = 2x; consecutivos</text>
<text x="624" y="128" text-anchor="middle" font-size="12">“é” vira igual</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">2º grau incompleto</text>
<text x="136" y="224" text-anchor="middle" font-size="12">b = 0: raiz quadrada</text>
<text x="136" y="240" text-anchor="middle" font-size="12">c = 0: x em evidência</text>
<text x="136" y="256" text-anchor="middle" font-size="12">raízes: ±; 0 e outro</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Bhaskara</text>
<text x="380" y="224" text-anchor="middle" font-size="12">Δ = b² − 4ac</text>
<text x="380" y="240" text-anchor="middle" font-size="12">x = (−b ± √Δ)/2a</text>
<text x="380" y="256" text-anchor="middle" font-size="12">Δ < 0: sem raiz real</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Soma e produto</text>
<text x="624" y="224" text-anchor="middle" font-size="12">x₁ + x₂ = −b/a</text>
<text x="624" y="240" text-anchor="middle" font-size="12">x₁ · x₂ = c/a</text>
<text x="624" y="256" text-anchor="middle" font-size="12">sem resolver a equação</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: monte a equação em símbolos e descarte a raiz que não faz sentido</text>
</svg>
<figcaption>A tradução do texto é a etapa mais cobrada; as demais caixas são as ferramentas para resolver a equação montada.</figcaption>
</figure>
<h3>1. A equação como uma balança</h3>
<p>Pense numa balança de dois pratos em equilíbrio. Num prato há uma caixa de peso desconhecido x mais 3 pesos de 1 kg; no outro, 10 pesos de 1 kg. A balança só continua equilibrada se, para qualquer coisa que se faça num prato, se faça a mesma coisa no outro. Tirando 3 kg de cada lado, resta x = 7. Essa é toda a técnica: aplicar a mesma operação nos dois lados para isolar a incógnita.</p>
<p>Na prática, a operação inversa isola o x. Se algo foi somado, subtrai-se; se foi multiplicado, divide-se. Em x + 3 = 10, subtrai-se 3: x = 7. Em 3x = 21, divide-se por 3: x = 7. Em x/4 = 6, multiplica-se por 4: x = 24. É o que se resume na frase “muda de lado, muda de sinal”: ela é só um atalho para somar ou subtrair o mesmo valor dos dois lados.</p>
<h3>2. Equação do 1º grau, passo a passo</h3>
<p>A equação do 1º grau tem a forma ax + b = 0, com a diferente de zero, e uma única solução, x = −b/a. Quando a equação vem desarrumada, a ordem é sempre a mesma: eliminar parênteses, eliminar denominadores multiplicando tudo pelo MMC, juntar os termos com x de um lado e os números do outro, e dividir pelo coeficiente de x.</p>
<p>Exemplo resolvido 1. Resolva 3(x − 2) = 2x + 5. Eliminando os parênteses, 3x − 6 = 2x + 5. Passando 2x para a esquerda e −6 para a direita, 3x − 2x = 5 + 6, ou seja, x = 11. Conferindo: 3 × 9 = 27 e 2 × 11 + 5 = 27.</p>
<p>Exemplo resolvido 2, com frações. Resolva x/3 + x/2 = 10. O MMC de 3 e 2 é 6. Multiplicando tudo por 6, 2x + 3x = 60, então 5x = 60 e x = 12. Conferindo: 12/3 + 12/2 = 4 + 6 = 10.</p>
<p>Sempre vale substituir a resposta na equação original: é a conferência que a prova permite.</p>
<h3>3. Do texto à equação</h3>
<p>Quase toda questão cobra a tradução. O método é escolher a incógnita, escrever o que o texto diz sobre ela e montar a igualdade. Algumas traduções aparecem o tempo todo: “o dobro de um número” é 2x; “o triplo” é 3x; “a metade” é x/2; “um número aumentado de 5” é x + 5; “a soma de dois números consecutivos” é x + (x + 1); “três números consecutivos” são x, x + 1 e x + 2; “a idade de Ana daqui a 5 anos” é x + 5; “há 3 anos” é x − 3; “é igual a” ou “resulta em” é o sinal de igual.</p>
<p>Exemplo resolvido 1. A soma de três números inteiros consecutivos é 72. Quais são eles? Sendo x o menor, o texto diz x + (x + 1) + (x + 2) = 72. Então 3x + 3 = 72, 3x = 69, x = 23. Os números são 23, 24 e 25.</p>
<p>Exemplo resolvido 2. Cinco coletes e um frete de R$ 30,00 custaram R$ 280,00. Qual o preço de cada colete? Com x o preço do colete, 5x + 30 = 280, então 5x = 250 e x = 50.</p>
<p>Exemplo resolvido 3. Em 50 moedas de 5 e de 10 centavos, que somam R$ 3,50, quantas são de 10 centavos? Seja a o número de moedas de 5 centavos. As de 10 centavos são 50 − a, e o valor em centavos fica 5a + 10(50 − a) = 350. Então 500 − 5a = 350, 5a = 150 e a = 30. As de 10 centavos são 50 − 30 = 20.</p>
<h3>4. Equação do 2º grau</h3>
<p>A equação do 2º grau tem a forma ax<sup>2</sup> + bx + c = 0, com a diferente de zero, e pode ter duas soluções, uma ou nenhuma entre os reais. Os casos incompletos resolvem-se sem fórmula. Se falta o termo em x (b = 0), isola-se o quadrado: x<sup>2</sup> = 49 dá x = 7 ou x = −7, porque ambos ao quadrado dão 49. Se falta o termo independente (c = 0), coloca-se x em evidência: x<sup>2</sup> − 5x = 0 vira x(x − 5) = 0, e um produto é zero quando um dos fatores é zero, então x = 0 ou x = 5.</p>
<p>Para a equação completa, usa-se a fórmula de Bhaskara. Calcula-se o discriminante Δ = b<sup>2</sup> − 4ac, que diz quantas soluções existem: Δ positivo dá duas soluções reais diferentes; Δ igual a zero dá uma solução dupla; Δ negativo não dá solução real. As soluções são x = (−b ± √Δ) / (2a).</p>
<p>Exemplo resolvido. Resolva 2x<sup>2</sup> − 3x − 2 = 0. Aqui a = 2, b = −3 e c = −2. Δ = (−3)<sup>2</sup> − 4 × 2 × (−2) = 9 + 16 = 25 e √Δ = 5. Então x = (3 ± 5) / 4, ou seja, x = 8/4 = 2 e x = −2/4 = −1/2.</p>
<p>Há um caminho mais rápido em muitas questões, o da soma e produto das raízes. Se x<sub>1</sub> e x<sub>2</sub> são as raízes, então x<sub>1</sub> + x<sub>2</sub> = −b/a e x<sub>1</sub> × x<sub>2</sub> = c/a. Em x<sup>2</sup> − 7x + 12 = 0, a soma é 7 e o produto é 12, o que leva a 3 e 4, porque 3 + 4 = 7 e 3 × 4 = 12. Essas relações permitem dizer a soma ou o produto das raízes sem resolver a equação.</p>
<div class="box">Em problemas, nem toda raiz serve. Se a incógnita é uma idade, um comprimento ou um número de pessoas, a raiz negativa é descartada.</div>
<h3>5. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>A solução da equação 3(x − 2) = 2x + 5 é</p>
<ol class="alts" type="A"><li>−1</li><li>7</li><li>11</li><li>3</li><li>1</li></ol>
<p><strong>Resposta: C.</strong> 3x − 6 = 2x + 5, então 3x − 2x = 5 + 6, x = 11.</p>
<h4>Questão 2</h4>
<p>As raízes da equação x<sup>2</sup> − 7x + 12 = 0 são</p>
<ol class="alts" type="A"><li>−3 e −4</li><li>2 e 6</li><li>1 e 12</li><li>−3 e 4</li><li>3 e 4</li></ol>
<p><strong>Resposta: E.</strong> Soma 7 e produto 12: 3 e 4.</p>
<h4>Questão 3</h4>
<p>A soma de três números inteiros consecutivos é 72. O menor deles é</p>
<ol class="alts" type="A"><li>24</li><li>23</li><li>22</li><li>21</li><li>25</li></ol>
<p><strong>Resposta: B.</strong> x + (x + 1) + (x + 2) = 72, 3x + 3 = 72, x = 23.</p>
<h4>Questão 4</h4>
<p>As raízes da equação 2x<sup>2</sup> − 3x − 2 = 0 são</p>
<ol class="alts" type="A"><li>−2 e 1/2</li><li>3 e −2</li><li>1 e −2</li><li>2 e −1/2</li><li>2 e 1/2</li></ol>
<p><strong>Resposta: D.</strong> Δ = 9 + 16 = 25; x = (3 ± 5)/4: 2 e −1/2.</p>
<h3>6. Na rotina do guarda</h3>
<ul>
<li><strong>Compras e orçamento:</strong> valor unitário desconhecido, frete fixo e total conhecido formam uma equação do 1º grau, como a dos coletes.</li>
<li><strong>Rateios:</strong> dividir uma verba entre um número de guardas que muda leva a equações com fração, resolvidas ao multiplicar tudo pelo MMC.</li>
<li><strong>Áreas de terrenos e salas:</strong> lados que se relacionam por “3 m a mais” levam a equações do 2º grau.</li>
<li><strong>Escalas e tempos:</strong> distâncias e velocidades entre duas viaturas também levam a equações.</li>
</ul>

<text x="624" y="96" text-anchor="middle" font-size="12">soma ou subtrai</text>
<text x="624" y="112" text-anchor="middle" font-size="12">elimina uma incógnita</text>

<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Problemas</text>
<text x="136" y="224" text-anchor="middle" font-size="12">moedas e ingressos</text>

</svg>
<figcaption>Os dois métodos resolvem o mesmo sistema; os dois últimos quadros dizem quando ele não tem uma solução única.</figcaption>

<h3>1. Por que duas equações</h3>
<p>Uma equação com duas incógnitas, como x + y = 10, tem infinitas soluções: (1, 9), (2, 8), (5, 5) e tantas outras. Para fixar um par só, é preciso uma segunda informação, e a ela corresponde uma segunda equação. O conjunto das duas é um sistema, e a solução é o par (x, y) que satisfaz as duas ao mesmo tempo. Com x + y = 10 e x − y = 2, só o par (6, 4) serve: 6 + 4 = 10 e 6 − 4 = 2.</p>
<p>A imagem geométrica ajuda: cada equação é uma reta, e a solução é o ponto em que as retas se cruzam. Isso explica os dois casos especiais, tratados na seção 4.</p>
<h3>2. Método da substituição</h3>
<p>A ideia é isolar uma incógnita em uma equação e colocar o resultado na outra, que passa a ter só uma incógnita. Considere x + y = 11 e x = y + 3. A segunda já traz x isolado. Trocando na primeira, (y + 3) + y = 11, então 2y + 3 = 11, 2y = 8 e y = 4. De volta a x = y + 3, x = 7. Confira nas duas: 7 + 4 = 11 e 7 = 4 + 3.</p>
<p>Escolha para isolar a incógnita que tem coeficiente 1, porque evita frações. Em 2x + y = 9 e x − y = 0, isole y = 2x − ... ou melhor, perceba que x = y na segunda e troque: 2y + y = 9, y = 3, x = 3.</p>
<h3>3. Método da adição</h3>
<p>A ideia é somar (ou subtrair) as duas equações de modo que uma incógnita desapareça. Em x + y = 10 e x − y = 2, somando termo a termo, 2x = 12 e x = 6; depois, y = 4. Quando os coeficientes não se anulam, multiplica-se uma ou as duas equações por números que os igualem.</p>
<p>Exemplo resolvido. Duas canetas e um lápis custam R$ 7,00, e uma caneta e um lápis custam R$ 5,00. Quanto custa a caneta? Com c a caneta e l o lápis, 2c + l = 7 e c + l = 5. Subtraindo a segunda da primeira, o lápis some: c = 2. Então l = 3.</p>
<p>Outro exemplo. Resolva 3x + 2y = 16 e x + y = 6. Multiplicando a segunda por 2, 2x + 2y = 12. Subtraindo da primeira, x = 4, e então y = 2. Conferindo: 3 × 4 + 2 × 2 = 16.</p>
<h3>4. Problemas e casos especiais</h3>
<p>Para montar o sistema, dê um nome a cada incógnita e escreva uma equação para cada informação do texto. Em problemas de moedas e ingressos, uma equação conta quantos objetos há, e a outra soma os valores.</p>
<p>Exemplo resolvido 1. Em 25 notas de R$ 5,00 e de R$ 10,00, que somam R$ 190,00, quantas notas são de R$ 10,00? Sendo a o número de notas de 5 e b o de 10, a + b = 25 e 5a + 10b = 190. Multiplicando a primeira por 5, 5a + 5b = 125. Subtraindo, 5b = 65 e b = 13. Então a = 12.</p>
<p>Exemplo resolvido 2, com rodas. Em um pátio há 20 veículos, entre carros e motos, e 64 rodas. Quantos carros? Com c carros e m motos, c + m = 20 e 4c + 2m = 64. Multiplicando a primeira por 2, 2c + 2m = 40. Subtraindo, 2c = 24 e c = 12. Então m = 8.</p>
<p>Exemplo resolvido 3, com correnteza. Um barco faz um trecho a favor da correnteza com velocidade 18 km/h e, contra, com 12 km/h. A soma da velocidade do barco b com a da correnteza c é 18, e a diferença é 12. Somando, 2b = 30 e b = 15. Então c = 3.</p>
<p>Os casos especiais aparecem quando as retas não se cruzam num único ponto. Se as retas são paralelas, o sistema é impossível, sem solução: x + y = 3 e 2x + 2y = 8, porque a segunda dá x + y = 4, que contradiz a primeira. Se as retas coincidem, o sistema é possível e indeterminado, com infinitas soluções: x + y = 3 e 2x + 2y = 6, porque a segunda é só a primeira multiplicada por 2. O sistema com um único par é possível e determinado.</p>
<h3>5. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Duas canetas e um lápis custam R$ 7,00, e uma caneta e um lápis custam R$ 5,00. O preço de uma caneta é</p>
<ol class="alts" type="A"><li>R$ 3,00</li><li>R$ 1,50</li><li>R$ 2,00</li><li>R$ 2,50</li><li>R$ 4,00</li></ol>
<p><strong>Resposta: C.</strong> 2c + l = 7 e c + l = 5. Subtraindo, c = 2 (e l = 3).</p>
<h4>Questão 2</h4>
<p>Em um pátio há 20 veículos, entre carros e motos, e 64 rodas. O número de motos é</p>
<ol class="alts" type="A"><li>12</li><li>6</li><li>10</li><li>14</li><li>8</li></ol>
<p><strong>Resposta: E.</strong> c + m = 20 e 4c + 2m = 64. Multiplicando a primeira por 2 e subtraindo, 2c = 24: c = 12 e m = 8.</p>
<h4>Questão 3</h4>
<p>A soma de dois números é 40 e a diferença entre eles é 12. O maior deles é</p>
<ol class="alts" type="A"><li>26</li><li>28</li><li>14</li><li>24</li><li>32</li></ol>
<p><strong>Resposta: A.</strong> x + y = 40 e x − y = 12. Somando, 2x = 52 e x = 26.</p>
<h4>Questão 4</h4>
<p>O sistema x + y = 3 e 2x + 2y = 8 é</p>
<ol class="alts" type="A"><li>possível e determinado.</li><li>possível e indeterminado.</li><li>satisfeito por (1, 2).</li><li>impossível.</li><li>satisfeito por (2, 1).</li></ol>
<p><strong>Resposta: D.</strong> A segunda equação, dividida por 2, dá x + y = 4, que contradiz x + y = 3. Não há solução.</p>
<h3>6. Na rotina do guarda</h3>
<ul>
<li><strong>Compras:</strong> dois produtos e dois pedidos com quantidades diferentes formam um sistema, como as canetas e os lápis.</li>
<li><strong>Pátio e frota:</strong> número de veículos e número de rodas dão o sistema de carros e motos.</li>
<li><strong>Rateios desiguais:</strong> duas condições sobre dois valores, como “soma de R$ 1.000,00 e diferença de R$ 300,00”.</li>
<li><strong>Idades:</strong> quando a prova dá a relação entre as idades hoje e daqui a alguns anos, monta-se um sistema.</li>
</ul>

<th>Como escapar</th>
</tr>
</thead>

<td>Montar duas equações iguais com palavras diferentes</td>
<td>Cada equação deve trazer uma informação nova</td>
</tr>
<tr>
<td>Esquecer de multiplicar todos os termos ao ajustar coeficientes</td>
<td>Multiplique os dois lados e todos os termos</td>
</tr>
<tr>
<td>Responder só x quando pedem x + y ou o maior valor</td>
<td>Releia a pergunta antes de responder</td>

<td>Trocar o sinal ao subtrair equações</td>
<td>Subtraia termo a termo, com atenção aos negativos</td>

<tr>
<td>Dar por solução um par que só satisfaz uma equação</td>
<td>Teste nas duas equações</td>
</tr>

<div class="tabela"><table>

<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>Sistema</td>
<td>Duas equações; o par que satisfaz as duas</td>
</tr>
<tr>
<td>Substituição</td>

"mt-8": `
<span class="status">Versão 1 · em revisão</span>
<p>Grandezas e medidas é o assunto das conversões: metros e quilômetros, minutos e horas, litros e metros cúbicos, gramas e toneladas. A Vunesp cobra três habilidades: converter unidades de comprimento, superfície, volume, capacidade, massa e tempo; operar com horas e minutos, que não seguem o sistema decimal; e usar as conversões dentro de problemas de área, volume e velocidade. A conta é sempre simples, e o erro típico é o de mover a vírgula o número errado de casas.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Grandezas e medidas: o degrau de cada escada" font-size="13">

<rect class="ac" x="24" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="74" text-anchor="middle" font-weight="600">Comprimento</text>
<text x="136" y="96" text-anchor="middle" font-size="12">degrau de 10</text>
<text x="136" y="112" text-anchor="middle" font-size="12">km, hm, dam, m, dm, cm, mm</text>
<text x="136" y="128" text-anchor="middle" font-size="12">3,5 km = 3.500 m</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">Superfície</text>
<text x="380" y="96" text-anchor="middle" font-size="12">degrau de 100</text>
<text x="380" y="112" text-anchor="middle" font-size="12">1 m² = 10.000 cm²</text>
<text x="380" y="128" text-anchor="middle" font-size="12">1 ha = 10.000 m²</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Volume e capacidade</text>
<text x="624" y="96" text-anchor="middle" font-size="12">degrau de 1.000</text>
<text x="624" y="112" text-anchor="middle" font-size="12">1 dm³ = 1 L</text>
<text x="624" y="128" text-anchor="middle" font-size="12">1 m³ = 1.000 L</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Massa</text>
<text x="136" y="224" text-anchor="middle" font-size="12">1 kg = 1.000 g</text>
<text x="136" y="240" text-anchor="middle" font-size="12">1 t = 1.000 kg</text>
<text x="136" y="256" text-anchor="middle" font-size="12">1 L de água ≈ 1 kg</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 4</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Tempo</text>
<text x="380" y="224" text-anchor="middle" font-size="12">60 min = 1 h</text>
<text x="380" y="240" text-anchor="middle" font-size="12">2 h 30 min = 2,5 h</text>
<text x="380" y="256" text-anchor="middle" font-size="12">empresta 1 h</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 5</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Velocidade</text>
<text x="624" y="224" text-anchor="middle" font-size="12">km/h ÷ 3,6 = m/s</text>
<text x="624" y="240" text-anchor="middle" font-size="12">distância ÷ tempo</text>
<text x="624" y="256" text-anchor="middle" font-size="12">72 km/h = 20 m/s</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 5</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: confira se o número deve crescer ou diminuir ao trocar de unidade</text>
</svg>
<figcaption>Cada caixa tem a sua escada: de 10 em 10 no comprimento, de 100 na área, de 1.000 no volume e de 60 no tempo.</figcaption>

<h3>1. O sistema métrico e o comprimento</h3>
<p>As unidades do sistema métrico seguem a escada dos prefixos: quilo (mil), hecto (cem), deca (dez), a unidade, deci (um décimo), centi (um centésimo) e mili (um milésimo). No comprimento, a unidade é o metro. Cada degrau da escada vale 10: para ir de uma unidade maior para uma menor, multiplica-se por 10 a cada degrau, ou seja, a vírgula anda para a direita; para ir de uma menor para uma maior, divide-se, e a vírgula anda para a esquerda.</p>
<p>Assim, 3,5 km são 3,5 × 1.000 = 3.500 m, porque se descem três degraus (km, hm, dam, m). E 250 cm são 250 ÷ 100 = 2,5 m, porque se sobem dois degraus. Um jeito de não errar é perguntar se o número deve crescer ou diminuir: o mesmo comprimento, medido numa unidade menor, dá um número maior.</p>
<h3>2. Superfície: o degrau vale 100</h3>
<p>Na área, a escada anda de 100 em 100, porque a área é comprimento vezes comprimento: 1 m = 100 cm, então 1 m² = 100 × 100 = 10.000 cm². Por isso, 4 m² são 40.000 cm². Também, 1 km² = 1.000 × 1.000 = 1.000.000 m².</p>
<p>Para terrenos há unidades agrárias. O are vale 100 m² (um quadrado de 10 m por 10 m) e o hectare (ha) vale 10.000 m² (um quadrado de 100 m por 100 m). Um km² tem 100 ha. Um terreno de 60.000 m² tem 6 ha.</p>
<p>Exemplo resolvido. Uma sala retangular de 5 m por 4 m tem área de 20 m². Em centímetros quadrados, a área é 20 × 10.000 = 200.000 cm². Se o piso for coberto por ladrilhos de 20 cm por 20 cm, cada um cobre 400 cm², e são necessários 200.000 ÷ 400 = 500 ladrilhos.</p>
<h3>3. Volume e capacidade: o degrau vale 1.000</h3>
<p>No volume, a escada anda de 1.000 em 1.000, porque é comprimento vezes comprimento vezes comprimento: 1 m³ = 100 × 100 × 100 = 1.000.000 cm³. A capacidade, medida em litros, se liga ao volume por uma relação que vale decorar: 1 litro é o volume de um cubo de 10 cm de aresta, ou seja, 1 dm³. Daí vêm 1 m³ = 1.000 dm³ = 1.000 litros, e 1 cm³ = 1 mL.</p>
<p>Uma caixa de 40 cm por 30 cm por 20 cm tem volume de 24.000 cm³, ou 24 litros. Uma piscina de 8 m por 4 m e 1,5 m de profundidade tem 48 m³, ou 48.000 litros. Um reservatório de 12 m³ guarda 12.000 litros e, se o consumo é de 400 litros por dia, dura 30 dias.</p>
<p>Para a capacidade, os prefixos seguem a escada de 10 em 10: 1 litro tem 1.000 mL, e 1 hectolitro (hL) tem 100 litros.</p>
<h3>4. Massa</h3>
<p>A unidade de massa é o grama, e o quilograma vale 1.000 g. A tonelada vale 1.000 kg. Então 1,5 kg são 1.500 g, 800 g são 0,8 kg e 1,2 t são 1.200 kg. Um litro de água pesa, aproximadamente, 1 kg; por isso, um tanque de 3 m³ cheio de água tem massa de 3.000 kg, ou 3 t.</p>
<h3>5. Tempo: o sistema que não é decimal</h3>
<p>O tempo não segue a escada de 10: 1 hora tem 60 minutos, 1 minuto tem 60 segundos e 1 dia tem 24 horas. Por isso, 2 h 30 min valem 150 minutos, e não 2,3 hora. Para passar de minutos a horas decimais, divide-se por 60: 90 min = 1,5 h, e 45 min = 0,75 h. Para passar de horas decimais a horas e minutos, multiplica-se a parte decimal por 60: 5,25 h = 5 h + 0,25 × 60 min = 5 h 15 min.</p>
<p>Na soma, quando os minutos passam de 59, “vai um” para as horas. Em 2 h 40 min + 1 h 35 min, os minutos são 40 + 35 = 75, que dão 1 h 15 min; as horas são 2 + 1 + 1 = 4. O total é 4 h 15 min. Na subtração, quando faltam minutos, empresta-se 1 hora. Em 5 h 10 min − 2 h 45 min, não dá para tirar 45 de 10; empresta-se 1 hora, e a conta vira 4 h 70 min − 2 h 45 min = 2 h 25 min.</p>
<p>Para a duração entre dois horários que cruzam a meia-noite, calcule até 24h e some o resto. De 22h45 a 6h15 do dia seguinte: até 24h são 1 h 15 min, e mais 6 h 15 min dão 7 h 30 min.</p>
<p>A velocidade liga distância e tempo e exige cuidado com a unidade. Para passar de km/h para m/s, divide-se por 3,6: 72 km/h = 20 m/s e 36 km/h = 10 m/s. Uma viatura a 18 km/h faz 3,6 km em 3,6 ÷ 18 = 0,2 h, ou 12 minutos.</p>
<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Uma sala retangular mede 5 m por 4 m. O piso será coberto com ladrilhos quadrados de 20 cm de lado. O número de ladrilhos necessário é</p>
<ol class="alts" type="A"><li>50</li><li>5.000</li><li>500</li><li>250</li><li>400</li></ol>
<p><strong>Resposta: C.</strong> Área: 20 m² = 200.000 cm². Cada ladrilho: 20 × 20 = 400 cm². 200.000 ÷ 400 = 500.</p>
<h4>Questão 2</h4>
<p>Um reservatório com 12 m³ de água abastece uma base que consome 400 litros por dia. A água dura</p>
<ol class="alts" type="A"><li>30 dias.</li><li>3 dias.</li><li>48 dias.</li><li>300 dias.</li><li>12 dias.</li></ol>
<p><strong>Resposta: A.</strong> 12 m³ = 12.000 litros. 12.000 ÷ 400 = 30 dias.</p>
<h4>Questão 3</h4>
<p>Um plantão começa às 22h45 e termina às 6h15 do dia seguinte. Sua duração é de</p>
<ol class="alts" type="A"><li>7 h 70 min.</li><li>8 h 30 min.</li><li>7 h 15 min.</li><li>8 h.</li><li>7 h 30 min.</li></ol>
<p><strong>Resposta: E.</strong> Até 24h: 1 h 15 min. Mais 6 h 15 min: 7 h 30 min.</p>
<h4>Questão 4</h4>
<p>A velocidade de 72 km/h equivale, em metros por segundo, a</p>
<ol class="alts" type="A"><li>72</li><li>20</li><li>259,2</li><li>7,2</li><li>200</li></ol>
<p><strong>Resposta: B.</strong> Divide-se por 3,6: 72 ÷ 3,6 = 20 m/s.</p>
<h3>7. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório de distância:</strong> o hodômetro e o mapa usam quilômetros e metros; converter antes de comparar.</li>
<li><strong>Cobertura de terreno:</strong> a área de um parque em hectares vira m² para dividir o patrulhamento por guarda.</li>
<li><strong>Escala de plantão:</strong> de 22h45 a 6h15 são 7 h 30 min, não 8 horas nem 7,3 horas.</li>
<li><strong>Reservatórios e viaturas-pipa:</strong> a capacidade vem em m³ ou em litros e precisa ser uniformizada.</li>
</ul>
<h3>8. Onde a Vunesp pega</h3>

"mt-9": `
<span class="status">Versão 1 · em revisão</span>
<p>Tabelas, gráficos e média aritmética formam o assunto mais próximo do dia a dia de quem trabalha com relatórios. A Vunesp cobra a leitura de dados em tabelas e gráficos (barras, linhas e setores), o cálculo da média aritmética simples e problemas em que a média muda quando um valor entra ou sai. A ideia por trás da média cabe numa imagem: é o valor que cada um receberia se a soma de tudo fosse repartida igualmente.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 368" role="img" aria-label="Média e gráficos: do dado à conclusão" font-size="13">

<text x="136" y="96" text-anchor="middle" font-size="12">título, unidades, eixos</text>
<text x="136" y="112" text-anchor="middle" font-size="12">setor: 100% = 360°</text>
<text x="136" y="128" text-anchor="middle" font-size="12">barras e linhas</text>
<text class="q" x="136" y="148" text-anchor="middle" font-size="12">seção 1</text>
<rect class="ac" x="268" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="74" text-anchor="middle" font-weight="600">Média aritmética</text>
<text x="380" y="96" text-anchor="middle" font-size="12">soma ÷ quantidade</text>
<text x="380" y="112" text-anchor="middle" font-size="12">soma = média × quantidade</text>
<text x="380" y="128" text-anchor="middle" font-size="12">repartir igualmente</text>
<text class="q" x="380" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="512" y="48" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="74" text-anchor="middle" font-weight="600">Quando a média muda</text>
<text x="624" y="96" text-anchor="middle" font-size="12">valor que sai</text>
<text x="624" y="112" text-anchor="middle" font-size="12">valor que entra</text>
<text x="624" y="128" text-anchor="middle" font-size="12">nova soma ÷ nova quantidade</text>
<text class="q" x="624" y="148" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="24" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="136" y="202" text-anchor="middle" font-weight="600">Mediana e moda</text>
<text x="136" y="224" text-anchor="middle" font-size="12">mediana: valor do meio</text>
<text x="136" y="240" text-anchor="middle" font-size="12">moda: o que mais se repete</text>
<text x="136" y="256" text-anchor="middle" font-size="12">média é sensível a extremos</text>
<text class="q" x="136" y="276" text-anchor="middle" font-size="12">seção 2</text>
<rect class="ac" x="268" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="380" y="202" text-anchor="middle" font-weight="600">Propriedades</text>
<text x="380" y="224" text-anchor="middle" font-size="12">somar k soma k à média</text>
<text x="380" y="240" text-anchor="middle" font-size="12">multiplicar multiplica</text>
<text x="380" y="256" text-anchor="middle" font-size="12">média das médias só se iguais</text>
<text class="q" x="380" y="276" text-anchor="middle" font-size="12">seção 3</text>
<rect class="ac" x="512" y="176" width="224" height="112" rx="8" style="stroke-width:1.5"/><text x="624" y="202" text-anchor="middle" font-weight="600">Variação</text>
<text x="624" y="224" text-anchor="middle" font-size="12">(final − inicial) ÷ inicial</text>
<text x="624" y="240" text-anchor="middle" font-size="12">base = valor inicial</text>
<text x="624" y="256" text-anchor="middle" font-size="12">queda e alta não se anulam</text>
<text class="q" x="624" y="276" text-anchor="middle" font-size="12">seção 1</text>
<rect class="tint" x="24" y="304" width="712" height="44" rx="8"/><text x="380" y="331" text-anchor="middle" font-size="13">Na prova: passe pela soma (soma = média × quantidade) e confira a quantidade</text>
</svg>
<figcaption>A soma é a ponte entre a média e todos os problemas de entrada e saída de valores.</figcaption>
</figure>
<h3>1. Ler tabelas e gráficos</h3>
<p>Antes de qualquer conta, leia o título, as unidades e os eixos. Em uma tabela, cada linha é um caso e cada coluna é uma grandeza. Em um gráfico de barras, a altura da barra mostra o valor, e é fácil comparar categorias. Em um gráfico de linhas, a inclinação mostra como o valor varia no tempo: subida, descida ou estabilidade. Em um gráfico de setores (a pizza), cada fatia mostra a parte do todo, e o círculo inteiro vale 100% e 360°.</p>
<p>A leitura correta evita erros que a prova explora. Confira se o gráfico trata de quantidades ou de porcentagens, e se a escala começa no zero. Para converter um setor em ângulo, multiplique a porcentagem por 360°: 40% correspondem a 0,40 × 360° = 144°. Para achar a quantidade de um setor, multiplique a porcentagem pelo total: 25% de 200 pessoas são 50 pessoas.</p>
<p>Para comparar duas leituras de um gráfico de linhas, calcule a variação relativa: (valor final − valor inicial) ÷ valor inicial. Se as ocorrências foram de 50 para 40, a variação é −10/50 = −20%; se depois foram de 40 para 60, a variação é +20/40 = +50%.</p>
<h3>2. Média aritmética simples</h3>
<p>A média aritmética de um conjunto de valores é a soma deles dividida pela quantidade. Em 4, 6 e 8, a soma é 18, e dividindo por 3 vem 6. A imagem é a de repartir: se três guardas têm 4, 6 e 8 ocorrências para atender e elas forem redistribuídas igualmente, cada um fica com 6.</p>
<p>Dessa imagem sai a relação mais útil: soma = média × quantidade. Se a média de 5 números é 8, a soma é 40. Quase todos os problemas de média se resolvem passando pela soma. Quando um valor sai, subtrai-se da soma; quando entra, soma-se; e só no fim divide-se pela nova quantidade.</p>
<p>Exemplo resolvido 1. A média de 5 números é 12. Se um deles, que vale 20, for retirado, qual a média dos 4 restantes? A soma era 5 × 12 = 60. Sem o 20, a soma é 40. A nova média é 40 ÷ 4 = 10.</p>
<p>Exemplo resolvido 2. Em 3 provas, um candidato tirou 5 e 7. Qual deve ser a terceira nota para a média ser 7? A soma precisa ser 3 × 7 = 21. As duas primeiras somam 12. A terceira é 21 − 12 = 9.</p>
<p>Exemplo resolvido 3. A idade média de 10 pessoas é 30 anos. Entra uma pessoa de 41 anos. A soma era 300; passa a 341; e há 11 pessoas. A nova média é 341 ÷ 11 = 31.</p>
<p>A média é sensível aos valores extremos. Duas medidas ajudam a descrever um conjunto sem se deixar levar por eles: a mediana é o valor do meio, depois de ordenar os dados (se a quantidade for par, é a média dos dois centrais), e a moda é o valor que mais se repete. Em 2, 3, 3, 4, 5, a moda é 3 e a mediana é 3; em 2, 4, 6, 8, a mediana é (4 + 6)/2 = 5.</p>
<h3>3. Propriedades úteis da média</h3>
<p>Algumas propriedades poupam contas. Somar um mesmo valor a todos os dados soma esse valor à média: se cada nota recebe 5 pontos de bônus, a média sobe 5. Multiplicar todos os dados por um número multiplica a média por ele: se todas as notas dobram, a média dobra. A média está sempre entre o menor e o maior valor do conjunto. E a soma dos desvios em relação à média é zero: o que sobra em uns compensa o que falta em outros.</p>
<p>Quando se juntam dois grupos, a média do conjunto não é a média das médias, a não ser que os grupos tenham o mesmo tamanho. Um grupo de 3 números com média 5 e outro de 2 números com média 10 formam um conjunto de 5 números cuja média é (15 + 20) ÷ 5 = 7, e não (5 + 10) ÷ 2 = 7,5.</p>
<h3>4. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>A média de cinco números é 12. Retirando-se um deles, que vale 20, a média dos quatro restantes é</p>
<ol class="alts" type="A"><li>12</li><li>8</li><li>15</li><li>10</li><li>16</li></ol>
<p><strong>Resposta: D.</strong> Soma: 5 × 12 = 60. Sem o 20, 40. Média: 40 ÷ 4 = 10.</p>
<h4>Questão 2</h4>
<p>Um candidato fez duas provas e tirou 5 e 7. Para obter média 7 em três provas, a terceira nota deve ser</p>
<ol class="alts" type="A"><li>7</li><li>8</li><li>9</li><li>10</li><li>6</li></ol>
<p><strong>Resposta: C.</strong> A soma precisa ser 21; já tem 12; faltam 9.</p>
<h4>Questão 3</h4>
<p>Em um gráfico de setores, o setor dos furtos representa 40% do total de 400 ocorrências. Esse setor corresponde a</p>
<ol class="alts" type="A"><li>160 ocorrências e 144°.</li><li>160 ocorrências e 40°.</li><li>40 ocorrências e 144°.</li><li>100 ocorrências e 90°.</li><li>160 ocorrências e 100°.</li></ol>
<p><strong>Resposta: A.</strong> 0,40 × 400 = 160 ocorrências; 0,40 × 360° = 144°.</p>
<h4>Questão 4</h4>
<p>Um grupo de 3 números tem média 5 e outro de 2 números tem média 10. A média dos 5 números juntos é</p>
<ol class="alts" type="A"><li>7,5</li><li>8</li><li>6</li><li>5,5</li><li>7</li></ol>
<p><strong>Resposta: E.</strong> Somas: 15 e 20. Total 35. 35 ÷ 5 = 7. A média das médias, 7,5, seria um erro, porque os grupos têm tamanhos diferentes.</p>
<h3>5. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório mensal:</strong> a média de ocorrências por mês dá a referência para dizer se um mês ficou acima ou abaixo do normal.</li>
<li><strong>Gráficos de setores nos balanços:</strong> a fatia dos furtos em 40% de 400 ocorrências são 160 casos e, no círculo, 144°.</li>
<li><strong>Planejamento de efetivo:</strong> a média de atendimentos por guarda orienta a escala.</li>
<li><strong>Variação de um mês para outro:</strong> calcula-se sobre o mês anterior, como em qualquer porcentagem.</li>
</ul>

<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: IBGE, <em>Tabulações e gráficos: noções de estatística</em> (apoio didático); Iezzi, Dolce e Murakami, <em>Fundamentos de Matemática Elementar</em>, v. 11. Exemplos criados para a aula.</p>

<figcaption>Os três primeiros grupos dizem o que a guarda é; os três últimos, o que ela faz e como o STF lê a lei hoje.</figcaption>

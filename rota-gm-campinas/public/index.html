<h3>1. Vírgula: a regra de ouro</h3>
<div class="box"><strong>Não se separa por vírgula o que está ligado pela estrutura da frase.</strong></div>
<div class="tabela"><table>
<tr><th>Ligação proibida</th><th>Errado</th><th>Certo</th></tr>
<tr><td>Sujeito e verbo</td><td>Os guardas da equipe noturna<strong>,</strong> isolaram a área.</td><td>Os guardas da equipe noturna isolaram a área.</td></tr>
<tr><td>Verbo e complemento</td><td>A equipe encontrou<strong>,</strong> a bicicleta furtada.</td><td>A equipe encontrou a bicicleta furtada.</td></tr>
<tr><td>Nome e complemento</td><td>A necessidade<strong>,</strong> de reforço era evidente.</td><td>A necessidade de reforço era evidente.</td></tr>
</table></div>
<p>Por maior que seja o sujeito, ele não se separa do verbo. Se houver algo <strong>intercalado</strong>, usam-se <strong>duas</strong> vírgulas: “Os guardas, segundo o comandante, isolaram a área.”</p>

<h3>2. Vírgula dentro da oração</h3>
<div class="tabela"><table>
<tr><th>Uso</th><th>Exemplo</th></tr>
<tr><td>Enumeração</td><td>“Foram apreendidos celulares, documentos e uma bicicleta.”</td></tr>
<tr><td>Aposto explicativo</td><td>“Campinas, a Princesa d’Oeste, recebeu o evento.”</td></tr>
<tr><td>Vocativo</td><td>“Senhor, apresente o documento, por favor.”</td></tr>
<tr><td>Adjunto adverbial deslocado (obrigatória se longo; facultativa se curto)</td><td>“Na manhã de sábado, a equipe recuperou a bicicleta.” / “Ontem(,) a equipe saiu cedo.”</td></tr>
<tr><td>Expressões explicativas (isto é, ou seja, por exemplo, aliás)</td><td>“O suspeito fugiu, isto é, deixou o local antes da equipe.”</td></tr>
<tr><td>Conjunção deslocada (porém, contudo, entretanto, portanto)</td><td>“A ronda, porém, foi mantida.”</td></tr>
<tr><td>Omissão de verbo (zeugma)</td><td>“Eu fiquei na base; ele, na viatura.”</td></tr>
<tr><td>Datas e locais</td><td>“Campinas, 21 de março de 2027.”</td></tr>
</table></div>
<p><strong>Vocativo ou aposto?</strong> “Carlos, o guarda chegou.” (fala-se com Carlos) x “Carlos, o guarda, chegou.” (Carlos é o guarda).</p>

<h3>3. Vírgula entre orações</h3>
<div class="tabela"><table>
<tr><th>Situação</th><th>Exemplo</th></tr>
<tr><td>Orações sem conectivo</td><td>“Chegou, olhou, saiu.”</td></tr>
<tr><td>Antes de mas, porém, contudo</td><td>“A equipe chegou rápido, mas o suspeito já tinha fugido.”</td></tr>
<tr><td>Antes de pois, portanto, logo</td><td>“Isolem a área, pois há risco de desabamento.”</td></tr>
<tr><td>Antes de “e”: em geral, não</td><td>“O guarda chegou e isolou a área.”</td></tr>
<tr><td>“E” com sujeitos diferentes, valor de oposição ou repetido</td><td>“O guarda chamou, e o suspeito correu.” / “Estudou o ano todo, e não passou.”</td></tr>
<tr><td>Adverbial antes da principal</td><td>“Quando a viatura chegou, o local já estava vazio.”</td></tr>
<tr><td>Adverbial depois da principal: facultativa</td><td>“O local já estava vazio(,) quando a viatura chegou.”</td></tr>
<tr><td>Oração intercalada</td><td>“A operação, disse o comandante, foi um sucesso.”</td></tr>
</table></div>
<h4>Restritiva ou explicativa: a vírgula que muda o sentido</h4>
<figure class="fig">
<svg viewBox="0 0 760 280" role="img" aria-label="Tirar as vírgulas muda quem foi convocado" font-size="13">
<text x="24" y="28" font-size="16" font-weight="600">Tirar as vírgulas muda quem foi convocado</text>
<rect class="bx" x="24" y="44" width="340" height="192" rx="10"/><text x="194" y="70" text-anchor="middle" font-weight="600">Com vírgulas: explicativa</text><text class="q" x="194" y="92" text-anchor="middle" font-size="12">Os guardas, que estavam de folga, foram...</text>
<circle class="ac" cx="74" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="122" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="170" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="218" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="266" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="314" cy="146" r="16" style="fill-opacity:.85"/>
<text x="194" y="208" text-anchor="middle" font-size="12">Todos estavam de folga; todos convocados</text>
<rect class="bx" x="396" y="44" width="340" height="192" rx="10"/><text x="566" y="70" text-anchor="middle" font-weight="600">Sem vírgulas: restritiva</text><text class="q" x="566" y="92" text-anchor="middle" font-size="12">Os guardas que estavam de folga foram...</text>
<circle class="ac" cx="446" cy="146" r="16" style="fill-opacity:.85"/><circle class="ac" cx="494" cy="146" r="16" style="fill-opacity:.85"/><circle class="bx" cx="542" cy="146" r="16"/><circle class="bx" cx="590" cy="146" r="16"/><circle class="bx" cx="638" cy="146" r="16"/><circle class="bx" cx="686" cy="146" r="16"/>
<text x="566" y="208" text-anchor="middle" font-size="12">Só os de folga foram convocados</text>
<circle class="ac" cx="250" cy="258" r="7" style="fill-opacity:.85"/><text class="q" x="264" y="262" font-size="12">convocado</text><circle class="bx" cx="394" cy="258" r="7"/><text class="q" x="408" y="262" font-size="12">não convocado</text>
</svg>
<figcaption>Com vírgulas, a informação vale para o grupo inteiro; sem vírgulas, escolhe uma parte do grupo.</figcaption>
</figure>

<h3>4. Ponto e vírgula, dois-pontos, travessão, parênteses e aspas</h3>
<ul>
<li><strong>Ponto e vírgula:</strong> enumeração com vírgulas internas (“a Guarda, com dez agentes; a PM, com seis; e a Defesa Civil, com quatro”); orações longas (“A equipe chegou às 22h; o suspeito, porém, já havia deixado o local.”); incisos de leis.</li>
<li><strong>Dois-pontos:</strong> enumeração (“três objetos: um celular, uma carteira e um relógio”); fala ou citação; explicação (“Só havia uma saída: chamar reforço.”).</li>
<li><strong>Travessão:</strong> fala no diálogo (“— Onde fica a delegacia? — perguntou a turista.”); isolamento com destaque (“A praça — reformada no ano passado — voltou a receber famílias.”); destaque final (“Faltou apenas uma coisa à operação — sorte.”).</li>
<li><strong>Parênteses:</strong> informação acessória (“O telefone da Guarda (153) funciona 24 horas.”).</li>
<li><strong>Aspas:</strong> citação literal; ironia (“O ‘atalho’ levou ao engarrafamento.”); estrangeirismo e gíria; títulos.</li>
</ul>
<p>Vírgulas, travessões e parênteses podem isolar a mesma intercalação: muda o destaque, não o sentido.</p>

<h3>5. Ponto, interrogação, exclamação e reticências</h3>
<p>Ponto encerra a declarativa; interrogação marca pergunta <strong>direta</strong> (a indireta, “perguntou quem chegou”, não leva “?”); exclamação marca emoção ou ordem enfática; reticências indicam interrupção, hesitação ou suspense.</p>
<h4>Pontuação que muda o sentido</h4>
<div class="tabela"><table>
<tr><th>Versão 1</th><th>Versão 2</th><th>O que muda</th></tr>
<tr><td>“Não, pare!”</td><td>“Não pare!”</td><td>Parar x continuar</td></tr>
<tr><td>“Carlos, o guarda chegou.”</td><td>“Carlos, o guarda, chegou.”</td><td>Vocativo x aposto</td></tr>
<tr><td>“Os moradores, que reclamaram, foram ouvidos.”</td><td>“Os moradores que reclamaram foram ouvidos.”</td><td>Todos x só parte</td></tr>
<tr><td>“O suspeito disse: o guarda mentiu.”</td><td>“O suspeito, disse o guarda, mentiu.”</td><td>Quem acusa quem</td></tr>
</table></div>

<h3>6. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase corretamente pontuada.</p>
<ol class="alts" type="A"><li>Os agentes da equipe noturna, isolaram a área.</li><li>A equipe encontrou, a bicicleta na praça.</li><li>Na manhã de sábado, a equipe encontrou a bicicleta na praça.</li><li>A equipe, encontrou a bicicleta na praça.</li><li>A necessidade, de reforço era evidente.</li></ol>
<p><strong>Resposta: C.</strong> A vírgula isola o adjunto deslocado; as demais quebram a regra de ouro.</p>
<h4>Questão 2</h4>
<p>Compare: (I) “Os guardas, que estavam de folga, foram convocados.” (II) “Os guardas que estavam de folga foram convocados.” É correto afirmar que</p>
<ol class="alts" type="A"><li>as duas frases têm o mesmo sentido.</li><li>em I, só parte dos guardas estava de folga.</li><li>em II, todos os guardas estavam de folga.</li><li>em I, todos os guardas citados estavam de folga; em II, só os de folga foram convocados.</li><li>as duas frases estão incorretas.</li></ol>
<p><strong>Resposta: D.</strong> Explicativa (todos) x restritiva (só parte).</p>

<h3>7. Na rotina do guarda</h3>
<ul><li>“Os envolvidos, que estavam alcoolizados, foram conduzidos” afirma que <strong>todos</strong> estavam alcoolizados; sem vírgulas, só os alcoolizados foram conduzidos. A diferença pode ter consequência jurídica.</li><li>Para registrar a fala da testemunha: dois-pontos e aspas.</li><li>“Não, aguarde” e “Não aguarde” dizem o contrário uma da outra.</li></ul>

<h3>8. Onde a Vunesp costuma pegar</h3>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>Vírgula depois de sujeito longo</td><td>Ache o verbo e confira se há vírgula antes dele sem intercalação</td></tr>
<tr><td>Uma vírgula só na intercalação</td><td>Intercalação pede duas vírgulas</td></tr>
<tr><td>Retirar vírgulas de explicativa</td><td>Muda de “todos” para “só parte”</td></tr>
<tr><td>Vírgula antes de “e” tida como sempre errada</td><td>Aceita com sujeitos diferentes, oposição ou “e” repetido</td></tr>
<tr><td>Interrogação em pergunta indireta</td><td>Não se usa</td></tr>
</table></div>

<h3>9. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><td>Regra de ouro</td><td>Nunca separar sujeito/verbo, verbo/complemento, nome/complemento</td></tr>
<tr><td>Intercalação</td><td>Duas vírgulas</td></tr>
<tr><td>Explicativa x restritiva</td><td>Com vírgulas = todos; sem = só parte</td></tr>
<tr><td>Ponto e vírgula</td><td>Enumeração com vírgulas internas; orações longas</td></tr>
<tr><td>Dois-pontos</td><td>Enumeração, fala, explicação</td></tr>
<tr><td>Travessão / parênteses</td><td>Destaca / diminui</td></tr>
<tr><td>Aspas</td><td>Citação, ironia, estrangeirismo, título</td></tr>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Bechara, <em>Moderna Gramática Portuguesa</em>; Cunha e Cintra, <em>Nova Gramática do Português Contemporâneo</em>. Frases criadas para esta aula.</p>`,
"pt-5": `
<span class="status">Versão 1 · em revisão</span>
<p>O edital pede as classes de palavras pelo “emprego e sentido que imprimem às relações que estabelecem”. A Vunesp não cobra decoreba: pergunta qual classe uma palavra assume naquela frase, que sentido ela acrescenta e o que muda quando ela troca de forma ou de lugar.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 356" role="img" aria-label="A classe da palavra depende da função na frase" font-size="13">
<defs><marker id="mk7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker></defs>
<text x="24" y="28" font-size="16" font-weight="600">A classe da palavra depende da função na frase</text>
<rect class="bx" x="24" y="48" width="216" height="88" rx="8"/><text x="132" y="72" text-anchor="middle" font-weight="600">Substantivo</text><text x="132" y="92" text-anchor="middle" font-size="12">Nomeia seres e coisas</text><text x="132" y="108" text-anchor="middle" font-size="12">a vítima; o/a agente</text><text class="q" x="132" y="124" text-anchor="middle" font-size="12">Seção 1</text>
<rect class="bx" x="272" y="48" width="216" height="88" rx="8"/><text x="380" y="72" text-anchor="middle" font-weight="600">Adjetivo</text><text x="380" y="92" text-anchor="middle" font-size="12">Caracteriza o substantivo</text><text x="380" y="108" text-anchor="middle" font-size="12">grande homem × homem grande</text><text class="q" x="380" y="124" text-anchor="middle" font-size="12">Seção 2</text>
<rect class="bx" x="520" y="48" width="216" height="88" rx="8"/><text x="628" y="72" text-anchor="middle" font-weight="600">Numeral</text><text x="628" y="92" text-anchor="middle" font-size="12">Quantidade e ordem</text><text x="628" y="108" text-anchor="middle" font-size="12">Art. 9º nono; Art. 10 dez</text><text class="q" x="628" y="124" text-anchor="middle" font-size="12">Seção 3</text>
<text class="q" x="380" y="176" text-anchor="middle" font-size="12">Mesma palavra, três classes (seção 4)</text>
<rect class="ac" x="320" y="192" width="120" height="44" rx="8"/><text x="380" y="219" text-anchor="middle" font-weight="600">alto</text>
<path class="ln" d="M380 236V256H132V274" marker-end="url(#mk7)"/><path class="ln" d="M380 256V274" marker-end="url(#mk7)"/><path class="ln" d="M380 256H628V274" marker-end="url(#mk7)"/>
<rect class="bx" x="24" y="276" width="216" height="56" rx="8"/><text x="132" y="298" text-anchor="middle">“O prédio é alto.”</text><text class="q" x="132" y="318" text-anchor="middle" font-size="12">adjetivo</text>
<rect class="bx" x="272" y="276" width="216" height="56" rx="8"/><text x="380" y="298" text-anchor="middle">“O guarda falou alto.”</text><text class="q" x="380" y="318" text-anchor="middle" font-size="12">advérbio</text>
<rect class="bx" x="520" y="276" width="216" height="56" rx="8"/><text x="628" y="298" text-anchor="middle">“Subiram ao alto do morro.”</text><text class="q" x="628" y="318" text-anchor="middle" font-size="12">substantivo</text>
</svg>
<figcaption>As três classes têm funções próprias, mas é a posição na frase que decide a classe de cada palavra.</figcaption>
</figure>

<h3>1. Substantivo</h3>
<p>Nomeia seres, objetos, lugares, sentimentos, ações e estados. Comum ou próprio (guarda / Campinas); concreto ou abstrato (viatura / segurança); coletivo (tropa, frota, quadrilha).</p>
<div class="tabela"><table>
<tr><th>Gênero</th><th>O que acontece</th><th>Exemplos</th></tr>
<tr><td><strong>Comum de dois</strong></td><td>Mesma forma; o artigo indica o gênero</td><td>o/a agente, o/a guarda, o/a policial, o/a motorista</td></tr>
<tr><td><strong>Sobrecomum</strong></td><td>Uma forma e um artigo para homem ou mulher</td><td>a vítima, a testemunha, a criança, o indivíduo</td></tr>
<tr><td><strong>Epiceno</strong></td><td>Animais; sexo indicado por macho/fêmea</td><td>a cobra macho, o jacaré fêmea</td></tr>
</table></div>
<p>No boletim: “a vítima, um homem de 40 anos, foi socorrid<strong>a</strong>”. O adjetivo concorda com “vítima”.</p>
<div class="tabela"><table>
<tr><th>Masculino</th><th>Feminino</th></tr>
<tr><td>o capital (dinheiro)</td><td>a capital (cidade sede)</td></tr>
<tr><td>o cabeça (líder)</td><td>a cabeça (parte do corpo)</td></tr>
<tr><td>o grama (massa)</td><td>a grama (planta)</td></tr>
<tr><td>o rádio (aparelho)</td><td>a rádio (emissora)</td></tr>
<tr><td>o guia (pessoa)</td><td>a guia (documento)</td></tr>
<tr><td>o caixa (funcionário)</td><td>a caixa (recipiente)</td></tr>
</table></div>
<div class="box"><strong>Compostos com “guarda”:</strong> se “guarda” é a pessoa, vai ao plural (guardas-civis, guardas-noturnos); se é o verbo guardar, não varia (guarda-chuvas, guarda-roupas, guarda-volumes).</div>
<p><strong>Grau afetivo ou pejorativo:</strong> “um jeitinho” (malícia), “um livreco” (desprezo), “um golaço” (admiração). <strong>Substantivação:</strong> artigo + qualquer palavra = substantivo (“o não foi firme”, “o porquê da abordagem”, “o andar do suspeito”).</p>

<h3>2. Adjetivo</h3>
<div class="tabela"><table>
<tr><th>Locução</th><th>Adjetivo</th><th>Locução</th><th>Adjetivo</th></tr>
<tr><td>da cidade</td><td>urbano</td><td>de guerra</td><td>bélico</td></tr>
<tr><td>do município</td><td>municipal</td><td>do campo</td><td>rural</td></tr>
<tr><td>da polícia</td><td>policial</td><td>de fogo</td><td>ígneo</td></tr>
<tr><td>de criança</td><td>infantil</td><td>de pedra</td><td>pétreo</td></tr>
<tr><td>de chuva</td><td>pluvial</td><td>sem cor</td><td>incolor</td></tr>
</table></div>
<p><strong>Pátrios:</strong> campineiro (Campinas); paulistano (cidade de São Paulo); paulista (estado).</p>
<div class="tabela"><table>
<tr><th>Antes do substantivo</th><th>Depois do substantivo</th></tr>
<tr><td>um grande homem (importante)</td><td>um homem grande (alto, corpulento)</td></tr>
<tr><td>um pobre homem (digno de pena)</td><td>um homem pobre (sem dinheiro)</td></tr>
<tr><td>um velho amigo (de longa data)</td><td>um amigo velho (idoso)</td></tr>
<tr><td>um alto funcionário (cargo elevado)</td><td>um funcionário alto (estatura)</td></tr>
<tr><td>um simples guarda (apenas, mero)</td><td>um guarda simples (modesto)</td></tr>
</table></div>
<p><strong>Objetivo x subjetivo:</strong> “carro vermelho” é verificável; “motorista irresponsável” é opinião. No relatório, descreva o fato em vez de julgar.</p>
<div class="tabela"><table>
<tr><th>Grau</th><th>Exemplo</th></tr>
<tr><td>Comparativo (superioridade, igualdade, inferioridade)</td><td>mais... que; tão... quanto; menos... que</td></tr>
<tr><td>Superlativo relativo</td><td>“É a praça mais segura da cidade.”</td></tr>
<tr><td>Superlativo absoluto analítico</td><td>“muito fácil”</td></tr>
<tr><td>Superlativo absoluto sintético</td><td>“facílimo”, “paupérrimo”</td></tr>
</table></div>
<p>Formas especiais: bom → melhor; mau → pior; grande → maior; pequeno → menor. “Mais bom” só ao comparar duas qualidades do mesmo ser: “Ele é mais bom do que esperto.”</p>

<h3>3. Numeral</h3>
<p>Cardinal (dois), ordinal (segundo), multiplicativo (dobro), fracionário (terço) e dual (ambos).</p>
<div class="box"><strong>Artigos de lei:</strong> ordinal até o 9º e cardinal a partir do 10 (LC 95/1998, art. 10, I). Art. 5º = “artigo quinto”; Art. 13 = “artigo treze”. O mesmo vale para parágrafos.</div>
<p>Romanos: ordinal até o décimo, cardinal depois (século X “décimo”; século XXI “vinte e um”; Dom Pedro II “segundo”; João XXIII “vinte e três”).</p>
<p><strong>Numeral ou artigo?</strong> “Chegou um guarda para atender” (artigo) x “Chegou um guarda, e não os três que pedimos” (numeral).</p>

<h3>4. A classe depende da função</h3>
<div class="tabela"><table>
<tr><th>Frase</th><th>Classe</th></tr>
<tr><td>“O prédio é <strong>alto</strong>.”</td><td>adjetivo</td></tr>
<tr><td>“O guarda falou <strong>alto</strong>.”</td><td>advérbio</td></tr>
<tr><td>“Subiram ao <strong>alto</strong> do morro.”</td><td>substantivo</td></tr>
<tr><td>“Chegou <strong>primeiro</strong> à ocorrência.”</td><td>advérbio</td></tr>
<tr><td>“Foi o <strong>primeiro</strong> guarda a chegar.”</td><td>numeral</td></tr>
</table></div>

<h3>5. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a alternativa em que a palavra destacada é substantivo sobrecomum.</p>
<ol class="alts" type="A"><li>O <strong>agente</strong> registrou a ocorrência.</li><li>A <strong>vítima</strong> foi socorrida pela equipe.</li><li>A <strong>motorista</strong> foi autuada.</li><li>A <strong>cobra</strong> foi capturada no parque.</li><li>A <strong>estudante</strong> chamou a guarda.</li></ol>
<p><strong>Resposta: B.</strong> (A), (C) e (E) são comuns de dois; (D) é epiceno.</p>
<h4>Questão 2</h4>
<p>O plural correto é</p>
<ol class="alts" type="A"><li>guarda-civis.</li><li>guardas-civil.</li><li>guardas-civis.</li><li>guardas-chuvas.</li><li>guarda-roupa.</li></ol>
<p><strong>Resposta: C.</strong> “Guarda” (pessoa) e “civil” variam.</p>

<h3>6. Rotina e pegadinhas</h3>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>Classificar fora do contexto</td><td>Veja o papel da palavra na frase</td></tr>
<tr><td>Sobrecomum x comum de dois</td><td>Sobrecomum não troca o artigo (a vítima)</td></tr>
<tr><td>“Paulista” para a capital</td><td>Paulistano é da cidade</td></tr>
<tr><td>“Duzentas gramas”</td><td>O grama (peso) é masculino</td></tr>
<tr><td>“Guardas-chuvas”</td><td>“Guarda” verbo não varia</td></tr>
<tr><td>Posição do adjetivo</td><td>“Velho amigo” não é “amigo velho”</td></tr>
</table></div>
<h3>7. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><th>Ponto</th><th>O essencial</th></tr>
<tr><td>Comum de dois</td><td>o/a agente, o/a guarda, o/a policial</td></tr>
<tr><td>Sobrecomum</td><td>a vítima, a testemunha, a criança</td></tr>
<tr><td>Gênero que muda o sentido</td><td>o/a capital, o/a cabeça, o/a grama, o/a rádio, o/a guia</td></tr>
<tr><td>Compostos com “guarda”</td><td>substantivo varia (guardas-civis); verbo não (guarda-chuvas)</td></tr>
<tr><td>Substantivação</td><td>artigo + qualquer palavra: o não, o porquê</td></tr>
<tr><td>Locução adjetiva</td><td>da cidade = urbano; de chuva = pluvial; de guerra = bélico</td></tr>
<tr><td>Pátrios</td><td>campineiro; paulistano (cidade); paulista (estado)</td></tr>
<tr><td>Posição do adjetivo</td><td>grande homem x homem grande; velho amigo x amigo velho</td></tr>
<tr><td>Graus</td><td>comparativo; superlativo relativo e absoluto (facílimo)</td></tr>
<tr><td>Numeral em lei</td><td>ordinal até o 9º; cardinal a partir do 10</td></tr>
<tr><td>Numeral x artigo</td><td>“um” de quantidade x “um” indefinido</td></tr>
<tr><td>Classe pela função</td><td>alto: adjetivo, advérbio ou substantivo</td></tr>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I; LC 95/1998, art. 10, I. Referências de base: Bechara, <em>Moderna Gramática Portuguesa</em>; Cunha e Cintra, <em>Nova Gramática do Português Contemporâneo</em>; ABL, VOLP. Exemplos criados para a aula.</p>`,
"pt-6": `
<span class="status">Versão 1 · em revisão</span>
<p>O edital pede o pronome pelo emprego, pela colocação no texto e pela função de retomada. A Vunesp quase nunca cobra a lista decorada: pergunta a quem o pronome se refere, que valor ele tem e se a forma escolhida está certa naquela frase.</p>

<h3>Mapa do assunto</h3>
<figure class="fig">
<svg viewBox="0 0 760 404" role="img" aria-label="O pronome retoma ou antecipa um termo do texto" font-size="13">

<text x="568" y="122" text-anchor="middle" class="q" font-size="12">isto aponta para o que vem depois</text>

<text x="380" y="184" text-anchor="middle" class="q" font-size="12">Seis grupos de pronomes fazem essas duas funções (seções 1 a 7)</text>

<text x="132" y="224" text-anchor="middle" font-weight="600">Pessoais e tratamento</text>

<h3>1. Pronomes pessoais</h3>
<p>Indicam as pessoas do discurso: quem fala (1ª), com quem se fala (2ª) e de quem se fala (3ª). O caso, reto ou oblíquo, depende da função na frase.</p>
<div class="tabela"><table>
<tr><th>Pessoa</th><th>Reto (sujeito)</th><th>Oblíquo átono</th><th>Oblíquo tônico</th></tr>
<tr><td>1ª singular</td><td>eu</td><td>me</td><td>mim, comigo</td></tr>
<tr><td>2ª singular</td><td>tu</td><td>te</td><td>ti, contigo</td></tr>
<tr><td>3ª singular</td><td>ele, ela</td><td>o, a, lhe, se</td><td>ele, ela, si, consigo</td></tr>
<tr><td>1ª plural</td><td>nós</td><td>nos</td><td>nós, conosco</td></tr>
<tr><td>2ª plural</td><td>vós</td><td>vos</td><td>vós, convosco</td></tr>
<tr><td>3ª plural</td><td>eles, elas</td><td>os, as, lhes, se</td><td>eles, elas, si, consigo</td></tr>
</table></div>
<h4>Eu ou mim?</h4>
<ul>
<li><strong>Sujeito pede o reto</strong>, inclusive o de infinitivo: “O chefe pediu para <strong>eu</strong> chegar mais cedo.”</li>
<li><strong>Preposição + pronome que não é sujeito pede o tônico</strong>: “Esse presente é para <strong>mim</strong>.” “Entre <strong>mim</strong> e você não há segredo.”</li>
<li>Depois de <strong>exceto, salvo, menos, fora, segundo, conforme, consoante e como</strong>, a norma tradicional pede o reto: “Todos saíram, exceto <strong>eu</strong>.”</li>
</ul>
<div class="tabela"><table>
<tr><th>Na fala corrente</th><th>Na norma-padrão</th></tr>
<tr><td>Entre eu e ela</td><td>Entre <strong>mim</strong> e ela</td></tr>
<tr><td>Deram o documento para mim assinar</td><td>Deram o documento para <strong>eu</strong> assinar</td></tr>
<tr><td>Todos foram, menos mim</td><td>Todos foram, menos <strong>eu</strong></td></tr>
</table></div>
<h4>Com + pronome</h4>
<p>Fundem-se em <strong>comigo, contigo, conosco, convosco</strong>. <strong>Consigo</strong> é reflexivo de 3ª pessoa: só aparece quando se refere ao sujeito da própria oração (“O guarda levou a arma <strong>consigo</strong>”). Para se dirigir a alguém, “com você”.</p>
<h4>O, a, os, as x lhe, lhes</h4>
<p><strong>o, a, os, as</strong> são objeto direto (“Chamei-<strong>a</strong>”, “Vi-<strong>os</strong>”); <strong>lhe, lhes</strong> são objeto indireto (“Entreguei-<strong>lhe</strong> o relatório”). O reto não serve de objeto direto na norma-padrão: “Vi ele” vira “Vi-<strong>o</strong>”. As formas lo, la, no, na e a posição do pronome no verbo ficam para o posto 11.</p>
<h4>Sujeito do infinitivo</h4>
<p>Com <strong>deixar, mandar, fazer, ver, ouvir e sentir</strong> + infinitivo, o oblíquo átono é o sujeito do infinitivo: “Deixe-<strong>me</strong> sair” (eu saio), “Mandou-<strong>os</strong> entrar”. Com preposição, volta o reto: “para <strong>eu</strong> sair”.</p>
<h4>Reflexivo e recíproco</h4>
<p><strong>Reflexivo</strong>: a ação volta ao sujeito (“O agente feriu-<strong>se</strong>”, “Ela só pensa em <strong>si</strong>”). <strong>Recíproco</strong>: a ação é trocada entre dois ou mais (“Os guardas abraçaram-<strong>se</strong>”).</p>

<h3>2. Pronomes de tratamento</h3>
<p>Formas de respeito para falar <strong>com</strong> ou <strong>sobre</strong> alguém. Embora se dirijam a quem ouve (2ª pessoa), verbo, possessivo e oblíquo ficam na <strong>3ª pessoa</strong>.</p>
<div class="tabela"><table>
<tr><th>Pronome</th><th>Para quem</th></tr>
<tr><td>Vossa Excelência</td><td>autoridades dos Poderes da República: presidente, ministros, governadores, parlamentares, juízes</td></tr>
<tr><td>Vossa Senhoria</td><td>demais autoridades e particulares, em comunicação formal</td></tr>
<tr><td>Vossa Magnificência</td><td>reitores de universidades</td></tr>
<tr><td>Vossa Eminência</td><td>cardeais</td></tr>
<tr><td>Vossa Santidade</td><td>papa</td></tr>
<tr><td>Vossa Majestade</td><td>reis e imperadores</td></tr>
</table></div>
<ul>
<li><strong>Vossa</strong>: a pessoa com quem se fala. <strong>Sua</strong>: a pessoa de quem se fala. “Vossa Excelência trouxe os documentos?” / “Pedi a Sua Excelência, o ministro, que recebesse a comissão.”</li>
<li>Possessivo na 3ª pessoa: “Vossa Excelência trouxe <strong>seus</strong> documentos”, nunca “vossos”.</li>
<li>O adjetivo concorda com o sexo da pessoa: “Vossa Excelência está ocupado / ocupada”.</li>
<li><strong>Você</strong> e <strong>vocês</strong> também levam a 3ª pessoa: “Você trouxe seu crachá?”</li>
</ul>

<h3>3. Pronomes possessivos</h3>
<p><strong>meu, teu, seu, nosso, vosso, seu</strong> concordam com a coisa possuída, não com o possuidor: “os <strong>meus</strong> colegas”, “as <strong>nossas</strong> viaturas”.</p>
<ul>
<li><strong>“Seu” ambíguo</strong>: “O guarda disse ao colega que <strong>seu</strong> carro estava mal estacionado” (carro de quem?). Nomeie o dono: “o carro do colega”.</li>
<li><strong>Seu = de você</strong>: “Seu nome, por favor?”</li>
<li><strong>Aproximação</strong>: “Ele tem <strong>seus</strong> 40 anos” = cerca de 40.</li>
</ul>

<h3>4. Pronomes demonstrativos</h3>
<div class="tabela"><table>
<tr><th></th><th>1ª pessoa</th><th>2ª pessoa</th><th>3ª pessoa</th></tr>
<tr><td>Formas</td><td>este, esta, isto</td><td>esse, essa, isso</td><td>aquele, aquela, aquilo</td></tr>
<tr><td>Espaço</td><td>perto de quem fala</td><td>perto de quem ouve</td><td>longe dos dois</td></tr>
<tr><td>Tempo</td><td>presente (neste ano)</td><td>passado ou futuro próximos</td><td>passado distante (naquele tempo)</td></tr>
</table></div>
<ul>
<li><strong>Esse, essa, isso</strong> retomam o que já foi dito: “A rua é escura. <strong>Isso</strong> favorece os furtos.”</li>
<li><strong>Este, esta, isto</strong> apontam o que vem: “Digo <strong>isto</strong>: prevenção vale mais que repressão.”</li>
<li><strong>Este… aquele</strong>: este é o último citado; aquele, o primeiro. “Escrevi a Pedro e a João; <strong>este</strong> respondeu logo, <strong>aquele</strong> demorou.” (este = João)</li>
<li><strong>Isso</strong> e <strong>aquilo</strong> podem retomar uma ideia inteira: “Os guardas chegaram cedo, e <strong>isso</strong> facilitou a ronda.”</li>
<li><strong>O, a, os, as</strong> antes de “que” ou “de” = aquele(s), aquilo: “<strong>O</strong> que mais me preocupa é a demora.” Se dá para trocar por “aquilo”, é demonstrativo; se acompanha substantivo, é artigo.</li>
<li><strong>Mesmo, próprio, tal</strong> variam: “Elas <strong>mesmas</strong> conduziram a vistoria.”</li>
</ul>
<div class="box"><strong>Regra tradicional:</strong> é a que a prova segue; no texto, esse retoma e este anuncia.</div>

<h3>5. Indefinidos e interrogativos</h3>
<p><strong>Variáveis:</strong> algum, nenhum, todo, outro, muito, pouco, certo, vários, tanto, qualquer, bastante. <strong>Invariáveis:</strong> alguém, ninguém, algo, nada, tudo, outrem, cada.</p>
<div class="tabela"><table>
<tr><th>Caso</th><th>Regra</th><th>Exemplo</th></tr>
<tr><td>todo o / todo</td><td>com artigo = inteiro; sem = qualquer, cada</td><td>“todo o dia” (inteiro); “Todo guarda deve zelar” (qualquer)</td></tr>
<tr><td>algum depois do nome</td><td>reforça a negação</td><td>“dúvida alguma” = nenhuma</td></tr>
<tr><td>cada</td><td>não varia; com substantivo ou “um”</td><td>cada guarda, cada um</td></tr>
<tr><td>qualquer</td><td>plural: quaisquer</td><td>quaisquer irregularidades</td></tr>
<tr><td>bastante</td><td>pronome varia (= muitos); advérbio não (= muito)</td><td>“bastantes guardas”; “bastante cansados”</td></tr>
</table></div>
<p><strong>Interrogativos</strong> (quem, que, qual, quanto): direta, “<strong>Quem</strong> chegou?”; indireta, sem ponto de interrogação, “Quero saber <strong>qual</strong> é o procedimento.”</p>

<h3>6. Pronomes relativos</h3>
<p>Retomam um termo já dito, o <strong>antecedente</strong>, e ligam duas orações.</p>
<div class="tabela"><table>
<tr><th>Relativo</th><th>Retoma</th><th>Cuidado</th></tr>
<tr><td>que</td><td>pessoa ou coisa</td><td>teste: trocar por “o qual”</td></tr>
<tr><td>o qual, a qual, os quais, as quais</td><td>pessoa ou coisa</td><td>varia; evita ambiguidade; após preposição longa</td></tr>
<tr><td>quem</td><td>só pessoas</td><td>sempre com preposição: “a quem”</td></tr>
<tr><td>cujo, cuja, cujos, cujas</td><td>posse</td><td>concorda com o possuído; sem artigo</td></tr>
<tr><td>onde</td><td>lugar</td><td>movimento: aonde</td></tr>
<tr><td>quanto</td><td>tudo, todos</td><td>“Tudo <strong>quanto</strong> vi foi anotado.”</td></tr>
</table></div>
<ul>
<li><strong>Regência</strong>: “O documento <strong>de que</strong> preciso”; “O filme <strong>a que</strong> assisti”; “A cidade <strong>em que</strong> moro.” (lista no posto 10)</li>
<li><strong>Restritiva x explicativa</strong>: “Os guardas <strong>que</strong> estavam de folga foram convocados” (só esses) x “Os guardas, <strong>que</strong> estavam de folga, foram convocados” (todos).</li>
<li><strong>Cujo</strong> nunca leva artigo: “o guarda <strong>cujo</strong> carro”, não “cujo o carro”.</li>
<li><strong>Onde é lugar.</strong> Para situação, ano, dia ou pessoa: “em que”, “a quem”. <strong>Aonde</strong> = a + onde, com movimento: “A cidade aonde vamos”; com verbo de estado: “A cidade onde moro”.</li>
<li><strong>Sem antecedente</strong>: “<strong>Quem</strong> estuda passa.” “Há <strong>quem</strong> defenda essa ideia.”</li>
</ul>

<h3>7. O “se” e o “que”</h3>
<div class="tabela"><table>
<tr><th>“Se”</th><th>Como reconhecer</th><th>Exemplo</th></tr>
<tr><td>Reflexivo</td><td>a ação volta ao sujeito</td><td>O agente feriu-<strong>se</strong>.</td></tr>
<tr><td>Recíproco</td><td>ação trocada entre dois ou mais</td><td>Os guardas abraçaram-<strong>se</strong>.</td></tr>
<tr><td>Apassivador</td><td>verbo transitivo direto + se; concorda com o sujeito</td><td>Vendem-<strong>se</strong> casas.</td></tr>
<tr><td>Indeterminação do sujeito</td><td>verbo sem objeto direto + se; singular</td><td>Precisa-<strong>se</strong> de guardas.</td></tr>
<tr><td>Parte do verbo</td><td>verbo pronominal, sem função</td><td>Ele queixou-<strong>se</strong>.</td></tr>
<tr><td>Conjunção (não é pronome)</td><td>introduz oração</td><td>Não sei <strong>se</strong> veio. <strong>Se</strong> chover, não saio.</td></tr>
</table></div>
<p><strong>“Que”: pronome ou conjunção?</strong> Se dá para trocar por “o qual”, é relativo. Senão: conjunção integrante (“Disse <strong>que</strong> chegaria”, “Pediu <strong>que</strong> saíssem”), consecutiva (“tão cansativo <strong>que</strong> dormiu”) ou exclamativo (“<strong>Que</strong> dia difícil!”).</p>
<p><strong>“O”, “a”:</strong> artigo (“o guarda”), pessoal oblíquo (“Vi-<strong>o</strong>”) ou demonstrativo (“<strong>O</strong> que importa é a prevenção”).</p>

<h3>8. Retomada e colocação no texto</h3>
<p><strong>Anáfora</strong>: o pronome retoma o que já foi dito. <strong>Catáfora</strong>: antecipa o que vem. É o que mantém o texto coeso.</p>
<div class="tabela"><table>
<tr><th>Pronome</th><th>Retoma</th><th>Exemplo</th></tr>
<tr><td>Pessoal</td><td>um termo</td><td>“A vítima chegou; <strong>ela</strong> estava ferida.”</td></tr>
<tr><td>Demonstrativo</td><td>termo ou ideia inteira</td><td>“Chegaram cedo, e <strong>isso</strong> facilitou a ronda.”</td></tr>
<tr><td>Relativo</td><td>o antecedente, ligando orações</td><td>“o inspetor, <strong>que</strong> coordenou o encontro”</td></tr>
<tr><td>Possessivo</td><td>o dono</td><td>“conhecem <strong>seus</strong> vizinhos”</td></tr>
</table></div>
<p><strong>Como descobrir o que o pronome retoma:</strong> veja gênero e número; procure para trás o termo que combina, em geral o mais próximo; troque o pronome pelo termo e teste; com isso, aquilo e o, o antecedente costuma ser uma oração inteira.</p>
<ul>
<li><strong>Ambiguidade</strong>: “Os guardas falaram com os moradores e <strong>eles</strong> anotaram as queixas.” (quem?) Repita o termo.</li>
<li>“O delegado disse ao guarda que <strong>ele</strong> deveria assumir o caso.” Use discurso direto: “Você deverá assumir o caso.”</li>
<li><strong>Pronome sem antecedente</strong> é falha de coesão: “Chegou à praça e <strong>eles</strong> fugiram.”</li>
<li>Gênero e número iguais aos do antecedente: “A comunidade só se envolve quando se sente <strong>ouvida</strong>.”</li>
</ul>
<p>Próclise, ênclise e mesóclise: posto 11.</p>

<h3>9. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a frase em que o pronome relativo está empregado de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>O pedido de que ele precisava foi aprovado.</li><li>O pedido que ele precisava foi aprovado.</li><li>O pedido onde ele precisava foi aprovado.</li><li>O pedido cujo ele precisava foi aprovado.</li><li>O pedido aonde ele precisava foi aprovado.</li></ol>
<p><strong>Resposta: A.</strong> Quem precisa, precisa <em>de</em> algo: “de que”. “Onde” e “aonde” são só de lugar.</p>
<h4>Questão 2</h4>
<p>Assinale a frase em que “todo” significa “inteiro”.</p>
<ol class="alts" type="A"><li>Todo guarda precisa de treinamento.</li><li>Ficou toda a noite de plantão.</li><li>Toda cidade tem problemas.</li><li>Todo cidadão tem direitos.</li><li>Todo suspeito deve ser ouvido.</li></ol>
<p><strong>Resposta: B.</strong> Com artigo, “toda a noite” é a noite inteira. Sem artigo, “todo” é qualquer ou cada.</p>
<h4>Questão 3</h4>
<p>Assinale a frase correta quanto à concordância com o “se”.</p>
<ol class="alts" type="A"><li>Vendem-se viaturas usadas.</li><li>Vende-se viaturas usadas.</li><li>Precisam-se de guardas.</li><li>Aluga-se casas e apartamentos.</li><li>Procura-se motoristas experientes.</li></ol>
<p><strong>Resposta: A.</strong> Apassivador: o verbo concorda com o sujeito. “Precisa-se de guardas”: indeterminação, singular.</p>
<h4>Questão 4</h4>
<p>Em “A diretora falou com a síndica e ela anotou o pedido”, o problema de redação é</p>
<ol class="alts" type="A"><li>a ambiguidade do pronome “ela”.</li><li>o uso de “com” antes de “síndica”.</li><li>a falta de concordância do verbo “anotou”.</li><li>o uso de relativo sem antecedente.</li><li>a ausência de artigo antes de “pedido”.</li></ol>
<p><strong>Resposta: A.</strong> Dois termos femininos no singular servem de antecedente. Reescreva: “...com a síndica, que anotou o pedido”.</p>

<h3>10. Rotina e pegadinhas</h3>
<ul>
<li><strong>Relatório</strong>: deixe claro quem é “ele”; na dúvida, repita o nome ou a função.</li>
<li><strong>Ofício a autoridade</strong>: “Vossa Excelência encaminhará seu parecer.” De fora: “Sua Excelência”.</li>
<li><strong>Boletim</strong>: pronome para evitar repetição, só com antecedente claro.</li>
</ul>
<div class="tabela"><table>
<tr><th>Armadilha</th><th>Como escapar</th></tr>
<tr><td>“Entre eu e ela”, “para mim fazer”</td><td>sujeito = eu; preposição sem sujeito = mim</td></tr>
<tr><td>“Vossa Excelência... vossos”</td><td>3ª pessoa: seus</td></tr>
<tr><td>“Seu” com dois donos</td><td>nomear o dono</td></tr>
<tr><td>“Cujo o”</td><td>cujo concorda e dispensa artigo</td></tr>
<tr><td>“A situação onde...”</td><td>em que</td></tr>
<tr><td>“A cidade aonde moro”</td><td>estado: onde; movimento: aonde</td></tr>
<tr><td>Este x esse</td><td>este = o que vem; esse = o que já foi dito</td></tr>
<tr><td>Todo o x todo</td><td>com artigo: inteiro; sem: qualquer</td></tr>
<tr><td>“Vi ele”</td><td>vi-o</td></tr>
<tr><td>“Vende-se casas”</td><td>vendem-se casas</td></tr>
<tr><td>Todo “que” é pronome?</td><td>teste do “o qual”</td></tr>
<tr><td>“Consigo” = com você</td><td>consigo é reflexivo</td></tr>
</table></div>
<h3>11. Quadro-resumo</h3>
<div class="tabela"><table>
<tr><th>Ponto</th><th>O essencial</th></tr>
<tr><td>Pessoais</td><td>reto = sujeito; átono = me, te, o, a, lhe, nos, vos; tônico = depois de preposição</td></tr>
<tr><td>Eu x mim</td><td>para eu fazer; entre mim e ti; exceto eu</td></tr>
<tr><td>o, a x lhe</td><td>o/a = objeto direto; lhe = objeto indireto; “vi ele” vira “vi-o”</td></tr>
<tr><td>Sujeito do infinitivo</td><td>deixe-me sair; mandou-os entrar</td></tr>
<tr><td>Tratamento</td><td>Vossa = com quem se fala; Sua = de quem se fala; verbo e possessivo na 3ª pessoa</td></tr>
<tr><td>Possessivo</td><td>concorda com o possuído; “seu” ambíguo; “seus 40 anos” = cerca de</td></tr>
<tr><td>Demonstrativos</td><td>este = perto e o que vem; esse = o que foi dito; aquele = longe; este/aquele = último/primeiro</td></tr>
<tr><td>Indefinidos</td><td>todo o = inteiro; todo = qualquer; dúvida alguma = nenhuma; quaisquer</td></tr>
<tr><td>Relativos</td><td>que (teste: o qual); quem (pessoa, com preposição); cujo (posse, sem artigo); onde (lugar); aonde (movimento)</td></tr>
<tr><td>Regência do relativo</td><td>de que preciso; a que assisti; em que moro</td></tr>
<tr><td>Restritiva x explicativa</td><td>sem vírgula restringe; com vírgulas vale para todos</td></tr>
<tr><td>“Se”</td><td>reflexivo, recíproco, apassivador, indeterminação, parte do verbo, conjunção</td></tr>
<tr><td>Retomada</td><td>anáfora = o que já foi dito; catáfora = o que vem; isso/aquilo retomam ideia inteira</td></tr>
<tr><td>Ambiguidade</td><td>dois antecedentes possíveis: repetir o termo ou reescrever</td></tr>
</table></div>

<h3>1. O verbo e suas flexões</h3>
<p><strong>Verbo</strong> é a palavra que indica ação, estado ou fenômeno. Ele varia em <strong>pessoa</strong> (eu, tu, ele...), <strong>número</strong> (singular, plural), <strong>tempo</strong> (presente, passado, futuro), <strong>modo</strong> (indicativo, subjuntivo, imperativo) e <strong>voz</strong> (ativa, passiva, reflexiva).</p>
<ul>
<li>Ação: “O guarda <strong>apreendeu</strong> a moto.”</li>
<li>Estado: “A rua <strong>está</strong> interditada.”</li>
<li>Fenômeno: “<strong>Choveu</strong> a noite toda.”</li>
</ul>
<h3>2. Modos: certeza, hipótese ou ordem</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Modo</th>
<th>Expressa</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td>Indicativo</td>
<td>fato tido como certo</td>
<td>“O suspeito <strong>fugiu</strong> pela rua lateral.”</td>
</tr>
<tr>
<td>Subjuntivo</td>
<td>hipótese, desejo, dúvida</td>
<td>“Espero que ele <strong>compareça</strong>.” “Se ele <strong>fugisse</strong>...”</td>
</tr>
<tr>
<td>Imperativo</td>
<td>ordem, pedido, conselho</td>
<td>“<strong>Desligue</strong> o motor, por favor.”</td>
</tr>
</tbody>
</table></div>
<p>Trocar o modo muda o sentido: “Acho que ele <strong>está</strong> em casa” é quase certeza; “Duvido que ele <strong>esteja</strong> em casa” é dúvida.</p>
<h3>3. Tempos do indicativo e o sentido de cada um</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Tempo</th>
<th>Valor principal</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td>Presente</td>
<td>o que acontece agora, o hábito, a verdade geral</td>
<td>“A guarda <strong>patrulha</strong> o centro todas as noites.”</td>
</tr>
<tr>
<td>Pretérito perfeito</td>
<td>ação concluída</td>
<td>“A equipe <strong>atendeu</strong> a ocorrência às 22h.”</td>
</tr>
<tr>
<td>Pretérito imperfeito</td>
<td>ação contínua ou habitual no passado</td>
<td>“O comerciante <strong>fechava</strong> a loja às 19h.”</td>
</tr>
<tr>
<td>Pretérito mais-que-perfeito</td>
<td>passado anterior a outro passado</td>
<td>“Quando a viatura chegou, o suspeito já <strong>fugira</strong> (tinha fugido).”</td>
</tr>
<tr>
<td>Futuro do presente</td>
<td>fato posterior ao momento da fala</td>
<td>“A operação <strong>começará</strong> amanhã.”</td>
</tr>
<tr>
<td>Futuro do pretérito</td>
<td>fato que dependeria de uma condição</td>
<td>“Com mais câmeras, a praça <strong>seria</strong> mais segura.”</td>
</tr>
</tbody>
</table></div>
<h4>Usos que a prova adora</h4>
<ul>
<li><strong>Presente histórico:</strong> o presente narra o passado e dá vida ao relato. “Naquela noite, o guarda <strong>entra</strong> na loja e <strong>encontra</strong> o caixa aberto.”</li>
<li><strong>Presente com valor de futuro:</strong> “Amanhã <strong>começa</strong> a operação.”</li>
<li><strong>Imperfeito de cortesia:</strong> “<strong>Queria</strong> pedir uma informação” equivale a “quero”, dito com educação.</li>
<li><strong>Futuro do pretérito de cortesia:</strong> “<strong>Gostaria</strong> de ver seus documentos.”</li>
<li><strong>Futuro do pretérito para fato não confirmado:</strong> “O suspeito <strong>teria fugido</strong> de moto.” Quem escreve não garante a informação; é o tempo do noticiário.</li>
<li><strong>Futuro do presente de probabilidade:</strong> “O suspeito <strong>terá</strong>, no máximo, 20 anos.” É uma estimativa, não uma certeza.</li>
</ul>
<h3>4. Subjuntivo, correlação e verbos irregulares</h3>
<p>O subjuntivo tem três tempos simples: presente (que eu <strong>faça</strong>), pretérito imperfeito (se eu <strong>fizesse</strong>) e futuro (quando, se eu <strong>fizer</strong>).</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Na condição</th>
<th>Na consequência</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td>Se + pretérito imperfeito do subjuntivo</td>
<td>futuro do pretérito</td>
<td>“Se a rua <strong>tivesse</strong> luz, <strong>haveria</strong> menos furtos.”</td>
</tr>
<tr>
<td>Se, quando + futuro do subjuntivo</td>
<td>futuro do presente</td>
<td>“Se a rua <strong>tiver</strong> luz, <strong>haverá</strong> menos furtos.”</td>
</tr>
<tr>
<td>Verbo de pedido ou desejo no presente</td>
<td>presente do subjuntivo</td>
<td>“Peço que todos <strong>mantenham</strong> distância.”</td>
</tr>
</tbody>
</table></div>
<h4>Futuro do subjuntivo dos irregulares</h4>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>se ele ver o suspeito</td>
<td>se ele <strong>vir</strong> o suspeito</td>
</tr>
<tr>
<td>quando ele vir amanhã (= chegar)</td>
<td>quando ele <strong>vier</strong> amanhã</td>
</tr>
<tr>
<td>se eu por a mochila no chão</td>
<td>se eu <strong>puser</strong> a mochila no chão</td>
</tr>
<tr>
<td>se o motorista manter a calma</td>
<td>se o motorista <strong>mantiver</strong> a calma</td>
</tr>
<tr>
<td>quando o agente deter o autor</td>
<td>quando o agente <strong>detiver</strong> o autor</td>
</tr>
<tr>
<td>se eles trazerem os documentos</td>
<td>se eles <strong>trouxerem</strong> os documentos</td>
</tr>
<tr>
<td>quando eu saber do caso</td>
<td>quando eu <strong>souber</strong> do caso</td>
</tr>
</tbody>
</table></div>
<h4>Os derivados seguem o verbo de origem</h4>
<p>Intervir segue vir (veio → <strong>interveio</strong>). Deter, manter, conter e obter seguem ter (teve → <strong>deteve</strong>). Propor, compor e repor seguem pôr (puseram → <strong>propuseram</strong>).</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>O guarda interviu na briga</td>
<td>O guarda <strong>interveio</strong> na briga</td>
</tr>
<tr>
<td>A equipe deteu o suspeito</td>
<td>A equipe <strong>deteve</strong> o suspeito</td>
</tr>
<tr>
<td>Ele manteu a calma</td>
<td>Ele <strong>manteve</strong> a calma</td>
</tr>
<tr>
<td>Os guardas se proporam a ajudar</td>
<td>Os guardas se <strong>propuseram</strong> a ajudar</td>
</tr>
</tbody>
</table></div>
<h3>5. Imperativo</h3>
<ul>
<li><strong>Afirmativo:</strong> tu e vós vêm do presente do indicativo sem o “s” (tu falas → <strong>fala</strong>; vós falais → <strong>falai</strong>). As demais pessoas vêm do presente do subjuntivo: <strong>fale</strong> você, <strong>falemos</strong>, <strong>falem</strong> vocês.</li>
<li><strong>Negativo:</strong> todas as pessoas vêm do presente do subjuntivo: não <strong>fales</strong>, não <strong>fale</strong>, não <strong>falemos</strong>, não <strong>falem</strong>.</li>
<li><strong>Você é 3ª pessoa.</strong> Na abordagem: “<strong>Pare</strong> o carro e <strong>mostre</strong> os documentos”, nunca “pare e mostra”. Não misture tu e você na mesma ordem.</li>
</ul>
<h3>6. Formas nominais: infinitivo, gerúndio e particípio</h3>
<ul>
<li><strong>Infinitivo</strong> é o nome do verbo (deter). Com sujeito próprio, pode ir ao plural: “Pediu para <strong>os guardas saírem</strong>.”</li>
<li><strong>Gerúndio</strong> indica ação em curso ou simultânea: “O guarda chegou <strong>correndo</strong>.” Evite o <strong>gerundismo</strong>: em vez de “vou estar enviando”, escreva “vou enviar” ou “enviarei”.</li>
<li><strong>Particípio</strong> indica ação concluída e forma a voz passiva e os tempos compostos.</li>
</ul>
<p>Alguns verbos têm dois particípios: o regular vai com ter e haver; o irregular, com ser e estar.</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Verbo</th>
<th>Com ter ou haver</th>
<th>Com ser ou estar</th>
</tr>
</thead>
<tbody>
<tr>
<td>prender</td>
<td>tinha prendido</td>
<td>foi preso</td>
</tr>
<tr>
<td>aceitar</td>
<td>tinha aceitado</td>
<td>foi aceito</td>
</tr>
<tr>
<td>entregar</td>
<td>tinha entregado</td>
<td>foi entregue</td>
</tr>
<tr>
<td>salvar</td>
<td>tinha salvado</td>
<td>foi salvo</td>
</tr>
<tr>
<td>eleger</td>
<td>tinha elegido</td>
<td>foi eleito</td>
</tr>
</tbody>
</table></div>
<h3>7. Vozes verbais</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Voz</th>
<th>Estrutura</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td>Ativa</td>
<td>o sujeito pratica a ação</td>
<td>“O guarda <strong>deteve</strong> o suspeito.”</td>
</tr>
<tr>
<td>Passiva analítica</td>
<td>ser + particípio (+ agente da passiva)</td>
<td>“O suspeito <strong>foi detido</strong> pelo guarda.”</td>
</tr>
<tr>
<td>Passiva sintética</td>
<td>verbo transitivo direto + se</td>
<td>“<strong>Detiveram-se</strong> dois suspeitos.”</td>
</tr>
<tr>
<td>Reflexiva</td>
<td>o sujeito pratica e sofre a ação</td>
<td>“O guarda <strong>feriu-se</strong> na perseguição.”</td>
</tr>
</tbody>
</table></div>
<h4>Da ativa para a passiva, passo a passo</h4>
<ol>
<li>O objeto direto da ativa vira sujeito da passiva.</li>
<li>O sujeito da ativa vira agente da passiva (por, pelo, pela).</li>
<li>O verbo ser fica no mesmo tempo e modo do verbo da ativa, e o verbo principal vai para o particípio, concordando com o novo sujeito.</li>
</ol>
<div class="tabela"><table>
<thead>
<tr>
<th>Ativa</th>
<th>Passiva</th>
</tr>
</thead>
<tbody>
<tr>
<td>A equipe <strong>apreende</strong> as motos.</td>
<td>As motos <strong>são apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>apreendeu</strong> as motos.</td>
<td>As motos <strong>foram apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>apreendia</strong> as motos.</td>
<td>As motos <strong>eram apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>apreenderá</strong> as motos.</td>
<td>As motos <strong>serão apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>apreenderia</strong> as motos.</td>
<td>As motos <strong>seriam apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>tinha apreendido</strong> as motos.</td>
<td>As motos <strong>tinham sido apreendidas</strong> pela equipe.</td>
</tr>
<tr>
<td>A equipe <strong>está apreendendo</strong> as motos.</td>
<td>As motos <strong>estão sendo apreendidas</strong> pela equipe.</td>
</tr>
</tbody>
</table></div>
<p>Só o verbo transitivo direto vai para a passiva: “O guarda registrou a ocorrência” vira “A ocorrência foi registrada”, mas “O guarda precisou de ajuda” não tem passiva.</p>
<h3>8. Haver e fazer impessoais</h3>
<ul>
<li><strong>Haver</strong> no sentido de existir, ou de tempo decorrido, fica no singular: “<strong>Houve</strong> três ocorrências.” “<strong>Havia</strong> muitos guardas.” Na locução, o auxiliar também fica no singular: “<strong>Deve haver</strong> soluções.”</li>
<li><strong>Existir</strong> concorda normalmente: “<strong>Existem</strong> soluções.”</li>
<li><strong>Fazer</strong> de tempo decorrido ou de clima fica no singular: “<strong>Faz</strong> dez anos que entrei na Guarda.” “<strong>Fazia</strong> 35 graus.”</li>
</ul>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Houveram muitas ocorrências</td>
<td><strong>Houve</strong> muitas ocorrências</td>
</tr>
<tr>
<td>Devem haver soluções</td>
<td><strong>Deve</strong> haver soluções</td>
</tr>
<tr>
<td>Fazem dois anos que trabalho aqui</td>
<td><strong>Faz</strong> dois anos que trabalho aqui</td>
</tr>
</tbody>
</table></div>
<h3>9. Advérbio</h3>
<p><strong>Advérbio</strong> é a palavra invariável que modifica o verbo, o adjetivo, outro advérbio ou a oração inteira, acrescentando uma circunstância.</p>
<ul>
<li>Verbo: “O guarda agiu <strong>rapidamente</strong>.”</li>
<li>Adjetivo: “A rua estava <strong>muito</strong> escura.”</li>
<li>Outro advérbio: “Chegou <strong>bem</strong> cedo.”</li>
<li>Oração inteira: “<strong>Infelizmente</strong>, ninguém anotou a placa.” Aqui o advérbio traz a opinião de quem fala.</li>
</ul>
<div class="tabela"><table>
<thead>
<tr>
<th>Circunstância</th>
<th>Advérbios e locuções</th>
</tr>
</thead>
<tbody>
<tr>
<td>Tempo</td>
<td>ontem, hoje, já, ainda, logo, sempre, à noite</td>
</tr>
<tr>
<td>Lugar</td>
<td>aqui, ali, lá, perto, longe, dentro, de longe</td>
</tr>
<tr>
<td>Modo</td>
<td>bem, mal, assim, depressa, às pressas, com cuidado, palavras em -mente</td>
</tr>
<tr>
<td>Intensidade</td>
<td>muito, pouco, bastante, tão, demais, meio, quase</td>
</tr>
<tr>
<td>Afirmação</td>
<td>sim, certamente, realmente, sem dúvida</td>
</tr>
<tr>
<td>Negação</td>
<td>não, nunca, jamais, de modo algum</td>
</tr>
<tr>
<td>Dúvida</td>
<td>talvez, provavelmente, possivelmente</td>
</tr>
</tbody>
</table></div>
<ul>
<li><strong>Não varia:</strong> “As testemunhas estavam <strong>meio</strong> nervosas” (um pouco), “As motos custaram <strong>caro</strong>”, “Os guardas falaram <strong>alto</strong>”.</li>
<li><strong>Dois advérbios em -mente seguidos:</strong> o sufixo pode ficar só no último: “agiu <strong>rápida e cuidadosamente</strong>”.</li>
</ul>
<h4>Circunstâncias expressas por expressões</h4>
<div class="tabela"><table>
<thead>
<tr>
<th>Circunstância</th>
<th>Exemplo</th>
</tr>
</thead>
<tbody>
<tr>
<td>Causa</td>
<td>“A rua foi interditada <strong>por causa da chuva</strong>.”</td>
</tr>
<tr>
<td>Concessão</td>
<td>“<strong>Apesar do frio</strong>, a ronda continuou.”</td>
</tr>
<tr>
<td>Condição</td>
<td>“<strong>Sem autorização</strong>, ninguém entra.”</td>
</tr>
<tr>
<td>Finalidade</td>
<td>“A equipe ficou no local <strong>para preservar a cena</strong>.”</td>
</tr>
<tr>
<td>Instrumento</td>
<td>“Abriu o portão <strong>com a chave reserva</strong>.”</td>
</tr>
<tr>
<td>Companhia</td>
<td>“Fez a ronda <strong>com o parceiro</strong>.”</td>
</tr>
<tr>
<td>Meio</td>
<td>“Chegou <strong>de moto</strong>.”</td>
</tr>
</tbody>
</table></div>
<h3>10. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Em “Segundo testemunhas, o autor teria fugido pela mata”, a forma verbal “teria fugido” indica</p>
<ol class="alts" type="A"><li>uma ordem dada ao autor.</li><li>um fato habitual no passado.</li><li>um fato apresentado como não confirmado.</li><li>um fato certo e concluído.</li><li>um desejo de quem escreve.</li></ol>
<p><strong>Resposta: C.</strong> O futuro do pretérito marca que quem escreve não garante a informação, que vem das testemunhas.</p>
<h4>Questão 2</h4>
<p>Transpondo para a voz passiva a frase “A equipe apreendeu duas motos”, obtém-se</p>
<ol class="alts" type="A"><li>Duas motos eram apreendidas pela equipe.</li><li>Duas motos foram apreendidas pela equipe.</li><li>Duas motos foram apreendido pela equipe.</li><li>Duas motos serão apreendidas pela equipe.</li><li>Duas motos tinham apreendido a equipe.</li></ol>
<p><strong>Resposta: B.</strong> Apreendeu (pretérito perfeito) vira foram apreendidas: ser no mesmo tempo e particípio concordando com “motos”. As alternativas com eram e serão mudam o tempo; a com “apreendido” não concorda.</p>
<h4>Questão 3</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Se o guarda ver o suspeito, deve avisar a central.</li><li>Quando o guarda por a viatura na garagem, deve trancá-la.</li><li>Se o guarda manter a calma, a abordagem será tranquila.</li><li>Se o guarda vir o suspeito, deve avisar a central.</li><li>O guarda interviu na discussão.</li></ol>
<p><strong>Resposta: D.</strong> Futuro do subjuntivo de ver: vir. Nas demais: puser, mantiver, interveio.</p>
<h4>Questão 4</h4>
<p>Em “Apesar do frio, a ronda continuou”, a expressão “apesar do frio” indica</p>
<ol class="alts" type="A"><li>causa.</li><li>tempo.</li><li>condição.</li><li>finalidade.</li><li>concessão.</li></ol>
<p><strong>Resposta: E.</strong> Concessão: um obstáculo que não impede o fato. O frio não impediu a ronda.</p>
<h3>11. Na rotina do guarda</h3>
<ul>
<li><strong>Boletim e relatório:</strong> narre no pretérito perfeito (“A equipe <strong>chegou</strong> às 22h e <strong>encontrou</strong> a porta arrombada”) e use o imperfeito para o cenário (“A rua <strong>estava</strong> escura”).</li>
<li><strong>Informação não confirmada:</strong> “Segundo testemunhas, o autor <strong>teria fugido</strong> a pé.” O futuro do pretérito deixa claro que você não garante o fato.</li>
<li><strong>Ordem na abordagem:</strong> imperativo com você, na 3ª pessoa: “<strong>Desligue</strong> o motor e <strong>desça</strong> do veículo.”</li>
<li><strong>Voz passiva no relatório:</strong> “<strong>Foram apreendidos</strong> dois celulares.” O particípio concorda com o que foi apreendido.</li>
</ul>
<h3>12. Onde a Vunesp pega</h3>

<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>

</tr>
<tr>
<td>“Interviu”, “deteu”</td>
<td>os derivados seguem a base: interveio, deteve</td>
</tr>
<tr>
<td>“Houveram ocorrências”</td>
<td>haver no sentido de existir fica no singular</td>
</tr>
<tr>
<td>“Fazem dois anos”</td>
<td>fazer de tempo fica no singular</td>
</tr>
<tr>
<td>Trocar o tempo ao passar para a passiva</td>
<td>ser no mesmo tempo da ativa</td>
</tr>
<tr>
<td>Particípio sem concordar</td>
<td>“as motos foram apreendidas”</td>
</tr>
<tr>
<td>“Teria fugido” lido como certeza</td>
<td>é fato não confirmado</td>
</tr>
<tr>
<td>“Meias nervosas”</td>
<td>meio, advérbio, não varia</td>
</tr>
<tr>
<td>“Pare e mostra”</td>
<td>com você: pare e mostre</td>
</tr>
<tr>
<td>“Tinha preso”, “foi prendido”</td>
<td>ter + prendido; ser + preso</td>
</tr>
<tr>
<td>“Vou estar enviando”</td>
<td>vou enviar ou enviarei</td>
</tr>
<tr>
<td>Passiva com verbo transitivo indireto</td>
<td>só o transitivo direto vai para a passiva</td>
</tr>
</tbody>
</table></div>
<h3>13. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>

</tr>
<tr>

<p>Preposição e conjunção são as palavras que ligam. A preposição liga um termo a outro; a conjunção liga orações. A Vunesp quase sempre pergunta a mesma coisa: que relação de sentido essa palavra cria, e por qual outra ela poderia ser trocada sem mudar o sentido.</p>

<h3>1. Preposição: o que é</h3>
<p><strong>Preposição</strong> é a palavra invariável que liga dois termos, fazendo o segundo depender do primeiro. Em “a viatura <strong>da</strong> Guarda”, o “de” prende “Guarda” a “viatura” e cria uma relação de posse.</p>
<p>As preposições <strong>essenciais</strong> só funcionam como preposição: a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre e trás. As <strong>acidentais</strong> são palavras de outras classes que às vezes fazem esse papel: conforme, segundo, consoante, durante, mediante, exceto, salvo, como, fora.</p>
<p>Quando duas ou mais palavras funcionam juntas como preposição, há uma <strong>locução prepositiva</strong>, que sempre termina em preposição: apesar de, a fim de, por causa de, em vez de, de acordo com, junto a, perto de.</p>
<p>A preposição pode se unir a outra palavra. Se nenhuma perde som, é <strong>combinação</strong> (a + o = ao; a + onde = aonde). Se alguma perde, é <strong>contração</strong> (de + o = do; em + a = na; por + o = pelo; de + este = deste). A fusão de “a” com “a”, a crase, é assunto do posto 12.</p>
<h3>2. O sentido de cada preposição</h3>
<p>A mesma preposição muda de sentido conforme as palavras que liga. Por isso a prova nunca pergunta “o que é a preposição de”, e sim “que relação ela estabelece nesta frase”. Estes são os valores mais cobrados.</p>
<ul>
<li><strong>De:</strong> posse (a viatura <strong>da</strong> Guarda), origem (chegou <strong>de</strong> Sorocaba), matéria (grade <strong>de</strong> ferro), causa (tremia <strong>de</strong> frio), assunto (falaram <strong>do</strong> caso), meio (chegou <strong>de</strong> moto), tempo (saiu <strong>de</strong> madrugada).</li>
<li><strong>Em:</strong> lugar (<strong>na</strong> praça), tempo (<strong>em</strong> 2026), modo (ficou <strong>em</strong> silêncio).</li>
<li><strong>Com:</strong> companhia (fez a ronda <strong>com</strong> o parceiro), instrumento (abriu <strong>com</strong> a chave reserva), modo (agiu <strong>com</strong> cuidado), causa (<strong>com</strong> o calor, a praça esvaziou).</li>
<li><strong>Por:</strong> causa (foi preso <strong>por</strong> furto), lugar por onde se passa (passou <strong>pela</strong> praça), agente da passiva (foi detido <strong>pelo</strong> guarda), preço ou troca (vendeu a moto <strong>por</strong> cinco mil reais), duração (trabalhou ali <strong>por</strong> dois anos).</li>
<li><strong>Para:</strong> finalidade (ficou no local <strong>para</strong> preservar a cena), destino (foi <strong>para</strong> o centro), prazo (o relatório é <strong>para</strong> amanhã).</li>
<li><strong>A:</strong> destino (foi <strong>a</strong> Campinas), tempo (chegou <strong>às</strong> 22h), modo ou meio (saiu <strong>a</strong> pé), distância (ficou <strong>a</strong> dois quilômetros do posto).</li>
<li><strong>Sem:</strong> ausência (saiu <strong>sem</strong> o celular) e, no início da frase, condição (<strong>sem</strong> autorização, ninguém entra).</li>
<li><strong>Sob</strong> e <strong>sobre:</strong> sob indica posição inferior ou sujeição (<strong>sob</strong> custódia, <strong>sob</strong> suspeita); sobre indica posição superior ou assunto (a pasta está <strong>sobre</strong> a mesa; falou <strong>sobre</strong> o caso).</li>
<li><strong>Contra:</strong> oposição (lutou <strong>contra</strong> o crime). <strong>Desde:</strong> ponto de partida (<strong>desde</strong> a manhã). <strong>Até:</strong> limite (<strong>até</strong> a praça; <strong>até</strong> as 22h). <strong>Entre:</strong> posição intermediária (<strong>entre</strong> os frequentadores).</li>
</ul>
<div class="box">Na prova, troque a preposição por uma expressão de mesmo sentido para conferir: “preso por furto” = preso por causa de furto; “ficou para preservar a cena” = ficou a fim de preservar a cena.</div>
<h3>3. Três usos que a norma-padrão controla</h3>
<p>O primeiro é o da preposição antes do sujeito de um infinitivo. Quando o termo que vem depois da preposição é o sujeito do verbo no infinitivo, a norma-padrão não junta os dois: escreve-se “a hora <strong>de o</strong> guarda sair”, porque “o guarda” é quem sai.</p>
<p>O segundo é a diferença entre <strong>ao invés de</strong> e <strong>em vez de</strong>. “Ao invés de” significa ao contrário de e só cabe entre ideias opostas (ao invés de subir, o preço caiu). “Em vez de” significa no lugar de e serve para qualquer troca (em vez de café, pediu chá).</p>
<p>O terceiro é a diferença entre <strong>de encontro a</strong> e <strong>ao encontro de</strong>. “De encontro a” indica choque ou oposição (o carro foi de encontro ao poste). “Ao encontro de” indica direção ou concordância (a proposta vem ao encontro do que pedimos).</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Evite</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Chegou a hora do guarda sair</td>
<td>Chegou a hora <strong>de o</strong> guarda sair</td>
</tr>
<tr>
<td>Apesar do motorista ter parado, foi multado</td>
<td>Apesar <strong>de o</strong> motorista ter parado, foi multado</td>
</tr>
<tr>
<td>Ao invés de café, pediu chá</td>

</tr>
<tr>
<td>A decisão veio de encontro ao que pedimos (querendo dizer “a favor”)</td>
<td>A decisão veio <strong>ao encontro do</strong> que pedimos</td>
</tr>
</tbody>
</table></div>
<h3>4. Conjunções coordenativas</h3>
<p><strong>Conjunção</strong> é a palavra que liga orações, ou termos com a mesma função. As <strong>coordenativas</strong> ligam orações independentes: cada uma teria sentido sozinha, e a conjunção só acrescenta a relação entre elas.</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Tipo</th>
<th>Relação</th>
<th>Conjunções mais cobradas</th>
</tr>
</thead>
<tbody>
<tr>
<td>Aditiva</td>
<td>soma de ideias</td>
<td>e, nem, não só... mas também</td>
</tr>
<tr>
<td>Adversativa</td>
<td>oposição, contraste</td>
<td>mas, porém, contudo, todavia, entretanto, no entanto</td>
</tr>
<tr>
<td>Alternativa</td>
<td>escolha ou alternância</td>
<td>ou, ou... ou, ora... ora, quer... quer</td>
</tr>
<tr>
<td>Conclusiva</td>
<td>conclusão do que veio antes</td>
<td>logo, portanto, por isso, assim, pois (depois do verbo)</td>
</tr>
<tr>
<td>Explicativa</td>
<td>justificativa do que veio antes</td>
<td>pois (antes do verbo), porque, que</td>
</tr>
</tbody>
</table></div>
<p>Duas armadilhas são frequentes. A conjunção <strong>e</strong> pode ter valor adversativo quando liga ideias que se chocam:</p>
<ol>
<li>Estudou muito <strong>e</strong> não passou. (= mas não passou)</li>
</ol>
<p>E o <strong>pois</strong> muda de sentido conforme a posição. Antes do verbo, explica; depois do verbo, entre vírgulas, conclui:</p>
<ol>
<li>Leve o guarda-chuva, <strong>pois</strong> vai chover. (explicação)</li>
<li>Choveu muito; a ronda, <strong>pois</strong>, foi adiada. (conclusão, = portanto)</li>
</ol>
<h3>5. Conjunções subordinativas</h3>
<p>As <strong>subordinativas</strong> ligam uma oração que depende de outra. As que mais caem são as <strong>adverbiais</strong>, que acrescentam uma circunstância à oração principal.</p>
<div class="tabela"><table>
<thead>
<tr>
<th>Tipo</th>
<th>Relação</th>
<th>Conjunções mais cobradas</th>
</tr>
</thead>
<tbody>
<tr>
<td>Causal</td>
<td>o motivo</td>
<td>porque, como (no início), já que, visto que, uma vez que</td>
</tr>
<tr>
<td>Consecutiva</td>
<td>o resultado</td>
<td>que (depois de tão, tanto, tal), de modo que</td>
</tr>
<tr>
<td>Concessiva</td>
<td>um obstáculo que não impede</td>
<td>embora, ainda que, mesmo que, conquanto, por mais que</td>
</tr>
<tr>
<td>Condicional</td>
<td>a condição</td>
<td>se, caso, desde que (com subjuntivo), contanto que, a menos que</td>
</tr>
<tr>
<td>Conformativa</td>
<td>o acordo com algo</td>
<td>conforme, segundo, consoante, como (= conforme)</td>
</tr>
<tr>
<td>Comparativa</td>
<td>a comparação</td>
<td>como, (mais/menos) do que, tal qual, assim como</td>
</tr>
<tr>
<td>Final</td>
<td>o objetivo</td>
<td>para que, a fim de que</td>
</tr>
<tr>
<td>Proporcional</td>
<td>a variação conjunta</td>
<td>à medida que, à proporção que, quanto mais... mais</td>
</tr>
<tr>
<td>Temporal</td>
<td>o momento</td>
<td>quando, enquanto, assim que, logo que, desde que (com indicativo), mal</td>
</tr>
</tbody>
</table></div>
<p>Causa e consequência são o par que mais confunde. A causa vem antes no tempo e explica o fato; a consequência vem depois e resulta dele:</p>
<ol>
<li>A ronda foi adiada <strong>porque</strong> choveu. (causa)</li>
<li>Choveu <strong>tanto que</strong> a ronda foi adiada. (consequência)</li>
</ol>
<p>As <strong>integrantes</strong>, “que” e “se”, não têm valor de circunstância: apenas introduzem uma oração que funciona como substantivo, como em “Disse <strong>que</strong> a escala mudou” e “Não sei <strong>se</strong> ele veio”.</p>
<h3>6. Mesma palavra, sentidos diferentes</h3>
<p>Algumas conjunções mudam de valor conforme a frase. Nesses casos, decida pelo sentido, nunca pela palavra.</p>
<p>O <strong>como</strong> pode indicar causa, conformidade ou comparação:</p>
<ol>
<li><strong>Como</strong> o sinal estava fechado, o motorista parou. (causa)</li>
<li>Fiz o relatório <strong>como</strong> o chefe pediu. (conformidade, = conforme)</li>
<li>A sirene grita <strong>como</strong> um alarme de incêndio. (comparação)</li>
</ol>
<p>O <strong>desde que</strong> é condicional com subjuntivo e temporal com indicativo:</p>
<ol>
<li>Pode estacionar aqui, <strong>desde que</strong> não ultrapasse duas horas. (condição)</li>
<li><strong>Desde que</strong> entrou na Guarda, ele trabalha à noite. (tempo)</li>
</ol>
<p>O <strong>mas</strong> é adversativo, exceto no par “não só... mas também”, em que soma:</p>
<ol>
<li>Chamou a central, <strong>mas</strong> ninguém atendeu. (oposição)</li>
<li>Não só patrulhou a praça, <strong>mas também</strong> orientou os moradores. (adição)</li>
</ol>
<div class="box">O “que” depois de uma ordem costuma ser explicativo: “Estude, que a prova está chegando” equivale a “estude, pois a prova está chegando”.</div>
<h3>7. Trocar o conectivo sem mudar o sentido</h3>
<p>Grande parte das questões pede uma reescrita “sem alteração de sentido”. Duas regras resolvem quase todas.</p>
<p>A primeira é trocar por um conectivo do <strong>mesmo tipo</strong>. Causa por causa (porque, já que, visto que, uma vez que), condição por condição (se, caso), concessão por concessão (embora, ainda que, mesmo que), conclusão por conclusão (portanto, logo, por conseguinte).</p>
<p>A segunda é <strong>ajustar o modo do verbo</strong> quando o conectivo exige. “Embora” e “caso” pedem subjuntivo; “mas” e “se” com fato real, não. Assim, “<strong>Embora</strong> estivesse cansado, continuou a ronda” vira “Estava cansado, <strong>mas</strong> continuou a ronda”, e “<strong>Caso</strong> a experiência <strong>dê</strong> certo” vira “<strong>Se</strong> a experiência <strong>der</strong> certo”.</p>
<p>Concessão e oposição dizem quase o mesmo com estruturas diferentes: a concessiva subordina (embora), a adversativa coordena (mas). Por isso uma pode virar a outra, desde que a frase seja reorganizada.</p>
<h3>8. Questões resolvidas</h3>
<h4>Questão 1</h4>
<p>Assinale a alternativa em que a preposição “com” indica causa.</p>
<ol class="alts" type="A"><li>Saiu com o parceiro.</li><li>Abriu o portão com a chave.</li><li>Agiu com cuidado.</li><li>Com o calor, a praça esvaziou.</li><li>Chegou com fome ao posto.</li></ol>
<p><strong>Resposta: D.</strong> “Com o calor” = por causa do calor. Nas demais: companhia, instrumento, modo e estado.</p>
<h4>Questão 2</h4>
<p>Em “Embora a rua seja movimentada, há poucos furtos”, a conjunção pode ser trocada, sem alterar o sentido, por</p>
<ol class="alts" type="A"><li>Porque</li><li>Ainda que</li><li>Se</li><li>Para que</li><li>Quando</li></ol>
<p><strong>Resposta: B.</strong> Embora e ainda que são concessivas e pedem o mesmo modo (subjuntivo).</p>
<h4>Questão 3</h4>
<p>Assinale a frase de acordo com a norma-padrão.</p>
<ol class="alts" type="A"><li>Antes dos agentes chegarem, a rua foi fechada.</li><li>Apesar do motorista ter parado, foi multado.</li><li>Na hora dele assinar, desistiu.</li><li>Depois do suspeito ser ouvido, foi liberado.</li><li>Antes de os agentes chegarem, a rua foi fechada.</li></ol>
<p><strong>Resposta: E.</strong> “Os agentes” é sujeito de “chegarem”: a preposição não se junta ao artigo.</p>
<h4>Questão 4</h4>
<p>Em “Quanto mais câmeras instalam, menos furtos ocorrem”, a expressão “quanto mais... menos” indica</p>
<ol class="alts" type="A"><li>causa.</li><li>comparação.</li><li>proporção.</li><li>concessão.</li><li>condição.</li></ol>
<p><strong>Resposta: C.</strong> Uma coisa varia junto com a outra: relação proporcional.</p>
<h3>9. Na rotina do guarda</h3>
<ul>
<li><strong>Relatório:</strong> o conectivo certo poupa explicação. “O suspeito foi conduzido à delegacia <strong>porque</strong> portava objeto furtado” (causa) diz mais que duas frases soltas.</li>
<li><strong>Base legal:</strong> “<strong>conforme</strong> o art. 5º” e “<strong>segundo</strong> o regulamento” indicam conformidade.</li>
<li><strong>Objetivo da ação:</strong> “A equipe permaneceu no local <strong>a fim de</strong> preservar a cena” deixa clara a finalidade.</li>
<li><strong>Fato contrário ao esperado:</strong> “<strong>Embora</strong> houvesse sinalização, o motorista avançou” mostra a concessão sem precisar de duas frases.</li>
</ul>
<h3>10. Onde a Vunesp pega</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Armadilha</th>
<th>Como escapar</th>
</tr>
</thead>
<tbody>
<tr>
<td>“E” sempre aditivo</td>
<td>pode ser adversativo: estudou e não passou</td>
</tr>
<tr>
<td>“Pois” sempre explicativo</td>
<td>depois do verbo, entre vírgulas, é conclusivo</td>
</tr>
<tr>
<td>“Como” sempre comparativo</td>
<td>pode ser causa (no início) ou conformidade</td>
</tr>
<tr>
<td>“Desde que” sempre temporal</td>
<td>com subjuntivo, é condição</td>
</tr>
<tr>
<td>“Mas também” lido como oposição</td>
<td>no par “não só... mas também”, é adição</td>
</tr>
<tr>
<td>Causa e consequência trocadas</td>
<td>causa explica; consequência resulta (tanto... que)</td>
</tr>
<tr>
<td>Trocar “embora” por “mas” sem reescrever</td>
<td>ajuste o modo e a ordem da frase</td>
</tr>
<tr>
<td>“Do guarda sair”, “apesar do motorista ter”</td>
<td>sujeito de infinitivo não se junta à preposição</td>
</tr>
<tr>
<td>“Ao invés de” para simples troca</td>
<td>ao invés de = ao contrário de; em vez de = no lugar de</td>
</tr>
<tr>
<td>“De encontro a” no sentido de “a favor”</td>
<td>de encontro a = choque; ao encontro de = concordância</td>
</tr>
</tbody>
</table></div>
<h3>11. Quadro-resumo</h3>
<div class="tabela"><table>
<thead>
<tr>
<th>Ponto</th>
<th>O essencial</th>
</tr>
</thead>
<tbody>
<tr>
<td>Preposição</td>
<td>liga termos; essenciais (de, em, por...) e acidentais (conforme, segundo...)</td>
</tr>
<tr>
<td>Combinação e contração</td>
<td>ao, aonde (sem perda); do, na, pelo, deste (com perda)</td>
</tr>
<tr>
<td>Com</td>
<td>companhia, instrumento, modo, causa</td>
</tr>
<tr>
<td>Por</td>
<td>causa, lugar por onde, agente da passiva, preço, duração</td>
</tr>
<tr>
<td>Sob e sobre</td>
<td>sob = abaixo, sujeição; sobre = acima, assunto</td>
</tr>
<tr>
<td>Sujeito de infinitivo</td>
<td>a hora de o guarda sair</td>
</tr>
<tr>
<td>Ao invés de e em vez de</td>
<td>contrário; no lugar de</td>
</tr>
<tr>
<td>Coordenativas</td>
<td>aditiva, adversativa, alternativa, conclusiva, explicativa</td>
</tr>
<tr>
<td>Pois</td>
<td>antes do verbo explica; depois, entre vírgulas, conclui</td>
</tr>
<tr>
<td>Subordinativas adverbiais</td>
<td>causa, consequência, concessão, condição, conformidade, comparação, finalidade, proporção, tempo</td>
</tr>
<tr>
<td>Como</td>
<td>causa, conformidade, comparação</td>
</tr>
<tr>
<td>Desde que</td>
<td>condição (subjuntivo); tempo (indicativo)</td>
</tr>
<tr>
<td>Trocar conectivo</td>
<td>mesmo tipo; ajustar o modo do verbo</td>
</tr>
</tbody>
</table></div>
<p class="ref">Fontes: Edital 02/2026, Anexo I. Referências de base: Bechara, <em>Moderna Gramática Portuguesa</em>; Cunha e Cintra, <em>Nova Gramática do Português Contemporâneo</em>; ABL, VOLP. Exemplos criados para a aula.</p>

<text x="624" y="224" text-anchor="middle" font-size="12">verde-claros (varia o fim)</text>

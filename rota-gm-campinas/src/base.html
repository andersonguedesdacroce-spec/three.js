<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota GM Campinas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Preparação completa para o concurso da Guarda Municipal de Campinas (Vunesp, Edital 02/2026): aulas, questões comentadas, revisão e caderno de erros.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: faixa azul-marinho fixa no topo; painel em grade de duas colunas no computador, uma no celular; aula em coluna de leitura de 66ch. */
  --bg:#EEF2F6; --surface:#FFFFFF; --ink:#0F1E33; --muted:#56667C; --line:#CDD6E1;
  --navy:#16325C; --on-navy:#FFFFFF; --amber:#E39B0B; --ok:#1F7A4D; --bad:#B3261E;
  --soft-ok:#E3F2EA; --soft-bad:#FBE7E5; --soft-amber:#FDF1D8;
  --blue:#1D5FB8; --soft-blue:#E4EEFB; --violet:#6B4BB8; --soft-violet:#EEE9FA; --navy-2:#20406F;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1626; --surface:#13223A; --ink:#E7EDF5; --muted:#9AAABF; --line:#28405F;
    --navy:#8FB3E8; --on-navy:#0C1626; --amber:#F2B53A; --ok:#4CC38A; --bad:#F2766B;
    --soft-ok:#123A2A; --soft-bad:#3E1A1A; --soft-amber:#3A2C10;
    --blue:#7FB0F0; --soft-blue:#142C4D; --violet:#B9A2F0; --soft-violet:#2A2148; --navy-2:#1A2F4E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1626; --surface:#13223A; --ink:#E7EDF5; --muted:#9AAABF; --line:#28405F;
  --navy:#8FB3E8; --on-navy:#0C1626; --amber:#F2B53A; --ok:#4CC38A; --bad:#F2766B;
  --soft-ok:#123A2A; --soft-bad:#3E1A1A; --soft-amber:#3A2C10;
  --blue:#7FB0F0; --soft-blue:#142C4D; --violet:#B9A2F0; --soft-violet:#2A2148; --navy-2:#1A2F4E; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#16325C}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;line-height:1.08;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.largo{max-width:1080px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font:600 13px "Barlow",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#16325C;color:#fff;border-bottom:3px solid #E39B0B}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:10px;max-width:1180px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;text-align:left;padding:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1.05}
.brand svg{width:34px;height:38px;flex:0 0 auto}
.brand small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:13px;opacity:.85}
.count{text-align:right;line-height:1.1}
.count b{font-family:"Barlow Condensed",sans-serif;font-size:28px;display:block;font-variant-numeric:tabular-nums}
.count span{font-size:12px;opacity:.85}
.topo-dir{display:flex;align-items:center;gap:12px}
.tema{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;width:38px;height:38px;display:grid;place-items:center;padding:0;opacity:.9}
.tema svg{width:18px;height:18px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 20px;font-weight:600;background:var(--navy);color:var(--on-navy);text-decoration:none;text-align:center}
.btn.amber{background:var(--amber);color:#1b1300}
.btn.sec{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.peq{padding:8px 14px;font-size:15px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}
.voltar{background:none;border:0;color:var(--navy);font-weight:600;padding:16px 0 4px}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Página de vendas */
.lp{max-width:1080px}
.lp-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:36px;align-items:center;padding:40px 0 18px}
.lp-hero h1{font-size:52px;letter-spacing:-.3px;margin-top:10px}
.lp-hero p.sub{font-size:19.5px;color:var(--muted);max-width:34em;margin:16px 0 22px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cta-row .nota-cta{font-size:14px;color:var(--muted)}
.credencial{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(15,30,51,.45)}
.credencial .faixa{background:#16325C;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid #E39B0B}
.credencial .faixa strong{font-family:"Barlow Condensed",sans-serif;font-size:21px}
.credencial dl{display:grid;grid-template-columns:1fr 1fr;margin:0}
.credencial dl div{padding:12px 16px;border-top:1px solid var(--line)}
.credencial dl div:nth-child(odd){border-right:1px solid var(--line)}
.credencial dt{font-size:13.5px;color:var(--muted)}
.credencial dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 0}
.numeros div{padding:18px 14px;border-left:1px solid var(--line)}
.numeros div:first-child{border-left:0;padding-left:0}
.numeros b{display:block;font:700 40px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.numeros span{font-size:14.5px;color:var(--muted)}
.lp-sec{padding:46px 0 6px}
.lp-sec h2{font-size:36px;max-width:22em}
.lp-sec > p{color:var(--muted);margin:10px 0 18px;max-width:40em}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.bloco-tit{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;margin:22px 0 8px}
.lista-materias{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lista-materias li{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.lista-materias li:first-child{border-top:0}
.lista-materias span:last-child{color:var(--muted);font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.passos{list-style:none;counter-reset:p;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.passos li{counter-increment:p;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.passos li::before{content:counter(p);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--on-navy);font-weight:700;margin-bottom:10px}
.passos strong{display:block;margin-bottom:4px}
.recursos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.recurso{padding:16px 0 0;border-top:3px solid var(--navy)}
.recurso h3{font-size:22px;margin-bottom:6px}
.recurso p{margin:0;color:var(--muted);font-size:16px}
.destaque{background:var(--soft-amber);border-left:5px solid var(--amber);border-radius:0 14px 14px 0;padding:20px}
.destaque h2{font-size:30px}
.destaque p{margin:8px 0 0}
.oferta-box{background:var(--surface);border:2px solid var(--navy);border-radius:16px;padding:24px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.oferta-box ul{padding-left:0;list-style:none;margin:12px 0 0}
.oferta-box li{margin:8px 0;padding-left:26px;position:relative}
.oferta-box li::before{content:"";position:absolute;left:2px;top:7px;width:12px;height:7px;border-left:3px solid var(--ok);border-bottom:3px solid var(--ok);transform:rotate(-45deg)}
.preco{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.preco b{font-family:"Barlow Condensed",sans-serif;font-size:60px;line-height:1}
.preco span{color:var(--muted)}
.faq details{border-bottom:1px solid var(--line);padding:14px 0}
.faq summary{font-weight:600;cursor:pointer}
.faq p{margin:8px 0 0;color:var(--muted)}
.aviso{font-size:13.5px;color:var(--muted);text-align:center;padding:30px 0 40px}
/* amostra de aula na página de vendas */
.amostra{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.amostra .aula{font-size:17px}

/* Peso da prova */
.peso{margin:10px 0 4px}
.peso .barra{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.peso .barra span{display:flex;align-items:center;justify-content:center;font:600 14px "Barlow",sans-serif;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.peso .pt{background:#16325C}.peso .mt{background:#2F5E9E}.peso .lm{background:#6C8FBF}.peso .ce{background:#C47F06}
.peso ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0;margin:10px 0 0;font-size:14.5px;color:var(--muted)}
.peso li{display:flex;align-items:center;gap:6px;border:0!important;padding:0!important}
.peso li i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Checkout */
.pag{display:grid;gap:10px;margin-top:14px}
.pix{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center;margin-top:16px}
.pix svg{width:170px;height:170px;display:block;margin:10px auto}
.demo{font-size:13.5px;color:var(--muted);margin-top:12px}

/* Painel */
.hero{padding:24px 0 6px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:end}
.hero h1{font-size:36px}
.hero p{margin:6px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 30px/1.05 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.kpi span{font-size:13.5px;color:var(--muted)}
.bar{display:block;height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
.bar.fina{height:6px;margin:10px 0 6px}
.stats{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.grade{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start;margin-top:14px}
.lado{display:grid;gap:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.caixa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.caixa h3{font-size:21px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.caixa h3 .pill{font:600 13px "Barlow",sans-serif}
.caixa p{margin:6px 0 10px;font-size:15px;color:var(--muted)}
.caixa ul{list-style:none;margin:6px 0 10px;padding:0}
.caixa li{padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.caixa li:first-child{border-top:0}
.caixa li button{background:none;border:0;padding:0;color:var(--ink);text-align:left;font-weight:600}
.caixa li small{display:block;color:var(--muted);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font:600 13px "Barlow",sans-serif;background:var(--soft-blue);color:var(--blue)}
.pill.ok{background:var(--soft-ok);color:var(--ok)}
.pill.bad{background:var(--soft-bad);color:var(--bad)}
.pill.amb{background:var(--soft-amber);color:var(--ink)}
.continuar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:#16325C;color:#fff;border-radius:14px;padding:18px 20px;margin:14px 0 6px}
.continuar .eyebrow{color:#C9D6EA}
.continuar h2{font-size:26px;margin-top:4px}
.continuar p{margin:4px 0 0;color:#C9D6EA;font-size:15px}
.continuar .btn{background:#E39B0B;color:#1b1300}
.busca{position:relative}
.busca input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.res-busca{list-style:none;margin:8px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.res-busca:empty{display:none}
.res-busca li{border-top:1px solid var(--line)}
.res-busca li:first-child{border-top:0}
.res-busca button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;color:var(--ink)}
.res-busca small{display:block;color:var(--muted);font-size:13px}
.trilhas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.tcard{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tcard .nome{display:block;font-weight:600;font-size:17px;line-height:1.3}
.tcard .info{display:block;font-size:14px;color:var(--muted);line-height:1.4}
.tcard .linha{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tcard .linha .q{font-size:13px;color:var(--muted);white-space:nowrap}
.tcard.feita{border-color:var(--ok)}
.tcard.taf{border:2px solid var(--amber)}
.tcard.trava{opacity:.6;cursor:not-allowed}
.tcard:hover:not(.trava){border-color:var(--navy)}
.bloco-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 0 6px}
.bloco-cab h2{font-size:24px}
.bloco-cab span{font-size:14px;color:var(--muted)}

/* Rota */
.rota{list-style:none;margin:18px 0 40px;padding:0;position:relative}
.rota::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--line)}
.posto{position:relative;padding:0 0 14px 56px}
.posto .pin{position:absolute;left:6px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);background:var(--bg);font-size:14px;font-weight:600;color:var(--muted)}
.posto.ok .pin{background:var(--ok);border-color:var(--ok);color:#fff}
.posto.atual .pin{border-color:var(--amber);background:var(--amber);color:#1b1300}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px}
.posto.atual .card{border:2px solid var(--amber)}
.posto.bloq .card{opacity:.62;cursor:not-allowed}
.card .tit{display:block;font-weight:600;line-height:1.3}
.card .sub{display:block;font-size:14px;color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion:no-preference){
  .posto.atual .pin{animation:pulso 2.2s ease-in-out infinite}
  @keyframes pulso{0%,100%{box-shadow:0 0 0 0 rgba(227,155,11,.55)}50%{box-shadow:0 0 0 9px rgba(227,155,11,0)}}
}

/* Mapa do edital */
.mapa-ed{margin:14px 0 40px}
.mapa-ed details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;padding:0 14px}
.mapa-ed summary{cursor:pointer;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-weight:600}
.mapa-ed summary span{font-weight:500;font-size:14px;color:var(--muted);white-space:nowrap}
.mapa-ed table{margin:0 0 12px}
.mapa-ed td button{background:none;border:0;padding:0;color:var(--navy);font-weight:600;text-align:left}
.legenda{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

/* Tópico */
.topico h2{font-size:30px;margin-top:4px}
.meta{color:var(--muted);font-size:14px;margin-top:4px}
.abas{display:flex;gap:6px;margin:16px 0 0;border-bottom:2px solid var(--line);overflow-x:auto}
.abas button{background:none;border:0;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}
.painel{padding:16px 0 40px}
.aula h3{font-size:22px;margin:22px 0 6px}
.aula p{margin:8px 0}
.aula ul{padding-left:20px;margin:8px 0}
.aula li{margin:4px 0}
.ref{font-size:13.5px;color:var(--muted)}
.box{border-left:4px solid var(--amber);background:var(--soft-amber);border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0}
.aula h4{font-family:"Barlow Condensed",sans-serif;font-size:19px;margin:18px 0 4px}
.aula blockquote{margin:12px 0;padding:10px 14px;border-left:4px solid var(--line);background:var(--surface);border-radius:0 10px 10px 0}
.aula ol.alts{margin:6px 0 8px;padding-left:28px}
.status{display:inline-block;font-size:13px;font-weight:600;background:var(--soft-amber);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.fig{margin:16px 0}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{font-size:14px;color:var(--muted);margin-top:6px}
.fig text{fill:var(--ink)}
.fig .q{fill:var(--muted)}
.fig .ln{fill:none;stroke:var(--muted);stroke-width:1.25}
.fig .bx{fill:none;stroke:var(--muted);stroke-width:1.25}
.fig .ac{fill:var(--navy);fill-opacity:.12;stroke:var(--navy);stroke-width:2}
.fig .tint{fill:var(--soft-amber);stroke:var(--muted);stroke-width:1.25}
.fig .bad{fill:none;stroke:var(--bad);stroke-width:1.5;stroke-dasharray:6 5}
.fig .good{fill:none;stroke:var(--ok);stroke-width:1.5}
.fig .mk{fill:var(--muted)}
.tabela{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
th{font-weight:600}
.vazio{border:2px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted)}
.regra{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.historico{font-size:14px;color:var(--muted);margin-top:10px}
.confirma{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--soft-bad);border-radius:10px;padding:10px 12px;margin:8px 0}
.confirma p{margin:0;flex:1 1 220px;font-size:15px}

/* Questões */
.qtopo{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted);margin:14px 0 8px}
.marcar{background:none;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted)}
.marcar[aria-pressed="true"]{border-color:var(--amber);background:var(--soft-amber);color:var(--ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.qcard .enun{font-weight:500;margin:0 0 12px}
.txt{margin:0 0 12px;padding:10px 14px;border-left:4px solid var(--line);background:var(--bg);border-radius:0 10px 10px 0;font-size:15.5px}
ol.alts{margin:6px 0 8px;padding-left:28px}
.alt{display:flex;gap:10px;width:100%;text-align:left;align-items:flex-start;background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:10px 12px;margin:8px 0}
.alt .l{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:600;font-size:14px}
.alt[aria-pressed="true"]{border-color:var(--navy)}
.alt[aria-pressed="true"] .l{background:var(--navy);color:var(--on-navy)}
.acoes{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:14px}

/* Resultado */
.nota{font-family:"Barlow Condensed",sans-serif;font-size:72px;font-weight:700;line-height:1}
.res{border-radius:14px;padding:20px;margin:16px 0}
.res.ok{background:var(--soft-ok)}
.res.bad{background:var(--soft-bad)}
.res h2{font-size:28px;margin-top:6px}
.rev{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin:10px 0}
.rev .st{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rev.ok .st{color:var(--ok)}
.rev.bad .st{color:var(--bad)}
.rev p{margin:6px 0}
.rodape{text-align:center;padding:10px 0 34px}
.rodape button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px}
.reportar{font-family:"Barlow",system-ui,sans-serif;margin-top:18px;padding:14px 16px;border:1px dashed var(--line);border-radius:12px}
.reportar textarea{width:100%;min-height:90px;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin:8px 0}
.reportar p{margin:0!important;font-size:15px}

/* Caixas com função (legal design) */
.callout{position:relative;margin:18px 0!important;padding:12px 16px 12px 16px!important;border-radius:10px!important;border-left:5px solid!important;font-family:"Barlow",system-ui,sans-serif;font-size:16.5px;line-height:1.5}
.callout p{margin:0!important}
.callout .rot{display:inline-flex;align-items:center;gap:6px;font:700 13px "Barlow",sans-serif;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.callout .rot svg{width:16px;height:16px}
.callout.cuidado{background:var(--soft-bad)!important;border-color:var(--bad)!important}
.callout.cuidado .rot{color:var(--bad)}
.callout.caimuito{background:var(--soft-amber)!important;border-color:var(--amber)!important}
.callout.caimuito .rot{color:var(--ink)}
.callout.macete{background:var(--soft-violet)!important;border-color:var(--violet)!important}
.callout.macete .rot{color:var(--violet)}
.callout.conceito{background:var(--soft-blue)!important;border-color:var(--blue)!important}
.callout.conceito .rot{color:var(--blue)}
.callout.regra-p{background:var(--soft-ok)!important;border-color:var(--ok)!important}
.callout.regra-p .rot{color:var(--ok)}
.legenda-cores{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 13.5px "Barlow",sans-serif;color:var(--muted);margin:10px 0 0}
.legenda-cores span{display:inline-flex;align-items:center;gap:6px}
.legenda-cores i{width:12px;height:12px;border-radius:3px;display:inline-block}
.resumo-topo{font-family:"Barlow",system-ui,sans-serif;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:6px;font-size:15.5px}



/* Navegação principal: no topo no computador, barra inferior no celular */
.nav{display:flex;gap:2px;margin:0 auto 0 18px}
.nav button{position:relative;background:none;border:0;color:#C9D6EA;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:9px;font-weight:600;font-size:15px}
.nav button svg{display:none;width:22px;height:22px}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.15);color:#fff}
.nav .bdg{font:700 11px Barlow,sans-serif;font-style:normal;background:#E39B0B;color:#1b1300;border-radius:999px;padding:1px 6px;min-width:18px;text-align:center}
@media (max-width:1000px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;margin:0;background:#16325C;border-top:3px solid #E39B0B;justify-content:space-around;gap:0;padding:5px max(4px,env(safe-area-inset-left,0px)) calc(5px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-right,0px))}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:1px;font-size:11px;padding:5px 2px;border-radius:8px}
  .nav button svg{display:block}
  .nav .bdg{position:absolute;top:1px;left:54%}
  body.com-nav main{padding-bottom:86px}
}
/* Vídeo, preferências, feedback imediato, simulado, desempenho */
.video-box{background:#0A1730;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.video-box video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#0A1730}
.ferr{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:13.5px;color:var(--muted);margin-bottom:4px}
.ferr button{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;min-width:40px;padding:4px 8px;font-weight:600}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin:0 0 12px;background:var(--surface)}
.seg button{background:none;border:0;padding:8px 14px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--navy);color:var(--on-navy)}
.alt.certa{border-color:var(--ok);background:var(--soft-ok)}
.alt.certa .l{background:var(--ok);color:#fff}
.alt.errada{border-color:var(--bad);background:var(--soft-bad)}
.alt.errada .l{background:var(--bad);color:#fff}
.alt[disabled]{cursor:default;opacity:1;color:var(--ink)}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px;border-left:5px solid}
.fb.ok{background:var(--soft-ok);border-color:var(--ok)}
.fb.bad{background:var(--soft-bad);border-color:var(--bad)}
.fb p{margin:4px 0 0;font-size:15.5px}
.dica-tecla{font-size:13.5px;color:var(--muted);margin:14px 0 0}
@media (hover:none){.dica-tecla{display:none}}
.qmapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.qmapa button{position:relative;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.qmapa button.feita{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.qmapa button.marc::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.qmapa button[aria-current="true"]{outline:3px solid var(--amber);outline-offset:1px}
.regras{color:var(--muted);padding-left:20px;margin:14px 0 18px}
.regras li{margin:4px 0}
.res.neutro{background:var(--surface);border:1px solid var(--line)}
.kpi.feita{border-color:var(--ok)}
.kpi .bar{margin:8px 0 0}
.desemp{display:grid;gap:8px}
.dl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 56px;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;color:var(--ink)}
.dl:hover{border-color:var(--navy)}
.dn{font-weight:600;line-height:1.3;min-width:0}
.dn small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.db{display:block;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.db i{display:block;height:100%;border-radius:6px}
.dp{font:700 24px "Barlow Condensed",sans-serif;text-align:right}
.spark{display:flex;align-items:flex-end;gap:8px;height:110px;margin:10px 0 12px}
.spark span{flex:1 1 0;max-width:48px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.spark i{display:block;width:100%;background:var(--navy);border-radius:5px 5px 0 0}
.spark b{font-size:13px;font-variant-numeric:tabular-nums}
@media (max-width:600px){ .dl{grid-template-columns:minmax(0,1fr) 52px} .db{grid-column:1/-1;grid-row:2} }

/* Conta e ranking */
.conta-btn{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;opacity:.9}
.conta-box{max-width:460px}
.form{display:grid;gap:6px;margin-top:16px}
.form label{font-weight:600;font-size:15px;margin-top:6px}
.form input,.linha-form input{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.form .btn{margin-top:12px}
.dica{font-size:13.5px;color:var(--muted);margin:0}
.erro-form{background:var(--soft-bad);color:var(--ink);border-left:4px solid var(--bad);border-radius:0 8px 8px 0;padding:8px 12px;margin:6px 0 0;font-size:15px}
.ok-form{background:var(--soft-ok);color:var(--ink);border-left:4px solid var(--ok);border-radius:0 8px 8px 0;padding:8px 12px;margin:10px 0 0;font-size:15px}
.links-conta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:16px 0 40px;font-size:15px}
.linha-form{display:flex;gap:8px}
.linha-form input{flex:1 1 auto;min-width:0}
.nivel{display:block;margin:10px 0 0}
.nivel-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nivel-nome{font:700 22px "Barlow Condensed",sans-serif}
.nivel .meta{display:block}
.ganho{margin:8px 0 0}
.rank{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rank li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank .pos{font:700 22px "Barlow Condensed",sans-serif;color:var(--muted);text-align:center}
.rank .quem{min-width:0;overflow-wrap:anywhere}
.rank .quem small{display:block;color:var(--muted);font-size:13px}
.rank .val{font-weight:700;white-space:nowrap}
.rank li.p1 .pos{color:#C48A00}.rank li.p2 .pos{color:#7D8A99}.rank li.p3 .pos{color:#A0623A}
.rank li.podio .pos{font-size:26px}
.rank li.eu{background:var(--soft-amber)}

@media (max-width:900px){
  .grade{grid-template-columns:minmax(0,1fr)}
  .lado{position:static}
  .lado .caixa:last-child{display:none}
  .lp-hero{grid-template-columns:minmax(0,1fr)}
  .passos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .recursos{grid-template-columns:repeat(2,minmax(0,1fr))}
  .oferta-box{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .lp-hero h1{font-size:38px}
  .lp-sec h2{font-size:30px}
  .numeros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .numeros div:nth-child(3){border-left:0;padding-left:0}
  .numeros div:nth-child(n+3){border-top:1px solid var(--line)}
  .duas,.trilhas,.passos,.recursos{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:minmax(0,1fr)}
  .continuar{grid-template-columns:minmax(0,1fr)}
  .brand small{display:none}
  .count span{display:none}
  .conta-btn{padding:5px 11px;font-size:14px}
}

/* ---------- Aula: formato apostila ---------- */
.aula.apostila{font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-size:var(--aula-fs,18.5px);line-height:1.66;max-width:66ch;padding-bottom:12px}
.aula.apostila .status{background:none;padding:0;font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);margin:0 0 10px;display:block}
.aula.apostila>.status+p{font-size:20.5px;line-height:1.55}
.aula.apostila h3{font-size:29px;line-height:1.1;margin:44px 0 12px;scroll-margin-top:84px}
.aula.apostila h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:21px;margin:28px 0 6px}
.aula.apostila p{margin:0 0 14px}
.aula.apostila ul{padding-left:22px;margin:0 0 16px}
.aula.apostila li{margin:0 0 8px}
.aula.apostila strong{font-weight:600}
.sumario{font-family:"Barlow",system-ui,sans-serif;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0 8px;margin:22px 0 6px}
.sumario p{font-weight:600;font-size:14.5px;color:var(--muted);margin:0 0 6px!important}
.sumario ul{list-style:none;padding:0!important;margin:0!important;columns:2 230px;column-gap:28px}
.sumario li{margin:0 0 5px!important;break-inside:avoid}
.sumario a{color:var(--ink);text-decoration:none;font-size:15.5px}
.sumario a:hover{text-decoration:underline;text-underline-offset:3px}
/* tabelas de livro: só fios horizontais */
.aula.apostila .tabela{border:0;background:none;border-radius:0;margin:20px 0 22px}
.aula.apostila table{font-family:"Barlow",system-ui,sans-serif;font-size:15.5px;line-height:1.45;border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.aula.apostila th{background:none;font:600 15.5px "Barlow",system-ui,sans-serif;border-bottom:1px solid var(--ink)}
.aula.apostila th,.aula.apostila td{padding:7px 14px 7px 0}
.aula.apostila td{border-bottom:0}
/* pares de duas colunas viram texto */
.pares{margin:14px 0 20px}
.pares>div{display:grid;grid-template-columns:minmax(120px,36%) 1fr;gap:2px 20px;padding:4px 0}
.pares dt{font-weight:600}
.pares dd{margin:0}
.pares>.pares-h{font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.pares>.pares-h dt{font-weight:500}
/* exemplos numerados, como nas gramáticas */
.exs{list-style:none;counter-reset:ex;padding:0!important;margin:14px 0 8px!important}
.exs li{counter-increment:ex;position:relative;padding-left:44px;margin:0 0 12px!important}
.exs li::before{content:"(" counter(ex) ")";position:absolute;left:0;top:0;font-family:"Barlow",system-ui,sans-serif;color:var(--muted)}
.exs .rej{display:block;color:var(--muted)}
.exs .rej::before{content:"*";color:var(--bad);font-weight:700;margin-right:3px}
.aula.apostila>ol:not(.alts):not(.exs){list-style:none;counter-reset:ex;padding-left:0;margin:12px 0 18px}
.aula.apostila>ol:not(.alts):not(.exs)>li{counter-increment:ex;position:relative;padding-left:44px;margin:0 0 10px}
.aula.apostila>ol:not(.alts):not(.exs)>li::before{content:"(" counter(ex) ")";position:absolute;left:0;top:0;font-family:"Barlow",system-ui,sans-serif;color:var(--muted)}
.exs-nota{font:500 13.5px "Barlow",system-ui,sans-serif;color:var(--muted);margin:0 0 20px!important}
/* pegadinhas em lista corrida */
.pegas{list-style:none;padding:0!important;margin:12px 0 20px!important}
.pegas li{padding:9px 0;margin:0!important;border-bottom:1px solid var(--line)}
.pegas .pg-t{font-weight:600}
/* notas na margem */
.aula.apostila .nota{display:block;font:400 15.5px/1.5 "Barlow",system-ui,sans-serif;color:var(--muted);border-left:2px solid var(--amber);padding:2px 0 2px 14px;margin:16px 0;background:none;border-radius:0}
.aula.apostila .nota strong{color:var(--ink);font-weight:600}
@media (min-width:1200px){
  .aula.apostila .nota{float:right;clear:right;width:230px;margin:4px -272px 14px 0;border-left:0;border-top:2px solid var(--amber);padding:8px 0 0}
}
/* questões resolvidas: gabarito recolhido */
.aula.apostila ol.alts{font-size:17.5px;margin:6px 0 10px;padding-left:30px}
.aula.apostila ol.alts li{margin:0 0 4px}
.gab{margin:0 0 18px}
.gab summary{cursor:pointer;font:600 15.5px "Barlow",system-ui,sans-serif;color:var(--navy);list-style:none;display:inline-block;padding:4px 0}
.gab summary::-webkit-details-marker{display:none}
.gab summary::before{content:"▸ "}
.gab[open] summary::before{content:"▾ "}
.gab p{margin:6px 0 0!important}
/* figuras sem moldura */
.aula.apostila .fig{background:none;border:0;padding:0;margin:22px 0}
.aula.apostila .fig figcaption{font:400 14.5px/1.45 "Barlow",system-ui,sans-serif}
.aula.apostila .ref{font-family:"Barlow",system-ui,sans-serif}
.fim-aula{font-family:"Barlow",system-ui,sans-serif;border-top:1px solid var(--line);padding-top:14px;margin-top:28px!important;font-size:16.5px}
.fim-aula a{font-weight:600}
@media (max-width:520px){
  .aula.apostila{font-size:calc(var(--aula-fs,18.5px) - .5px)}
  .aula.apostila h3{font-size:26px;margin-top:38px}
  .pares>div{grid-template-columns:1fr;gap:0}
  .pares>.pares-h{display:none}
  .aula.apostila .fig{overflow-x:auto}
  .aula.apostila .fig svg{min-width:620px}
}

.aula.apostila blockquote.lei{margin:16px 0 18px 18px;padding:2px 0 2px 16px;border-left:2px solid var(--ink);background:none;border-radius:0;font-size:17.5px;line-height:1.6}
.aula.apostila blockquote.lei p{margin:0 0 4px}
.aula.apostila blockquote.lei cite{display:block;font:500 13.5px "Barlow",system-ui,sans-serif;font-style:normal;color:var(--muted)}
@media (max-width:520px){.aula.apostila blockquote.lei{margin-left:6px;padding-left:12px;font-size:17px}}
</style>

<script>

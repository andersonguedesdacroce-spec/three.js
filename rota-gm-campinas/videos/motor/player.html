<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=block" rel="stylesheet">
<style>
:root{--navy:#16325C;--noite:#0A1730;--ink:#0F1E33;--amber:#E39B0B;--paper:#F4F6F9;--line:#CDD6E1;--muted:#56667C}
.cor-red{--c:#B3261E;--c2:#FBE7E5}.cor-blue{--c:#1D5FB8;--c2:#E4EEFB}.cor-amber{--c:#A86F00;--c2:#FDF1D8}.cor-green{--c:#1F7A4D;--c2:#E3F2EA}.cor-violet{--c:#6B4BB8;--c2:#EEE9FA}.cor-navy{--c:#16325C;--c2:#E6ECF5}
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--noite);font-family:Barlow,sans-serif;color:var(--ink)}
.cena{position:absolute;inset:0;overflow:hidden;padding:120px 130px 150px;display:flex;flex-direction:column;justify-content:center;visibility:hidden}
.cd{font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1.02}
.eb{font:700 30px Barlow;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.an{opacity:0;will-change:transform,opacity}
b{font-weight:700}
/* capa */
.capa{background:var(--navy);color:#fff;justify-content:center}
.capa .eb{color:#C9D6EA;margin-top:36px}
.capa h1{font:800 120px/1.02 "Barlow Condensed";margin:18px 0 0;max-width:1500px}
.capa .gancho{align-self:flex-start;margin-top:44px;font:800 58px "Barlow Condensed";background:var(--amber);color:#1b1300;border-radius:14px;padding:14px 34px 8px}
/* lei */
.lei{background:var(--c2);flex-direction:row;align-items:center;gap:70px}
.lei .c1{flex:0 0 760px}.lei .c2{flex:1;display:grid;gap:18px}
.lei .eb{color:var(--c)}
.lei .selo{display:inline-block;margin-top:26px;font:800 150px/1 "Barlow Condensed";color:var(--c);border:9px solid var(--c);border-radius:18px;padding:14px 30px 4px;background:rgba(255,255,255,.55);max-width:760px}
.lei .def{font:500 40px/1.3 Barlow;margin-top:30px}
.pena{display:inline-block;margin-top:30px;background:var(--c);color:#fff;border-radius:12px;padding:12px 24px;font:700 36px Barlow}
.item{background:#fff;border-radius:16px;padding:20px 28px;font:500 40px/1.25 Barlow;box-shadow:0 14px 30px -24px rgba(15,30,51,.6)}
.item b{color:var(--c)}
/* lista */
.lista{background:var(--paper)}
.lista h2,.caso h2,.versus h2{font:800 92px/1.03 "Barlow Condensed";margin:10px 0 34px}
.lista .ls{display:grid;gap:16px}
.lista .ln{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:22px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 26px;font:500 42px/1.22 Barlow}
.lista .ln i{font:800 46px "Barlow Condensed";font-style:normal;width:64px;height:64px;border-radius:50%;background:var(--c,#16325C);color:#fff;display:grid;place-items:center}
.lista .ln b{color:var(--c,#16325C)}
/* versus */
.versus{background:#fff;padding:0;flex-direction:row;align-items:stretch}
.versus .pn{flex:1;background:var(--c2);padding:150px 80px 150px;display:flex;flex-direction:column;justify-content:center}
.versus .pn h3{font:800 100px/1 "Barlow Condensed";color:var(--c);margin:8px 0 30px}
.versus .pn .eb{color:var(--c)}
.versus .pn .item{margin-bottom:16px}
.versus .topo{position:absolute;left:0;right:0;top:56px;text-align:center}
.versus .topo span{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:10px 34px 8px;font:800 50px "Barlow Condensed"}
/* caso */
.caso{background:var(--paper)}
.caso .card{background:#fff;border:3px solid var(--line);border-radius:30px;padding:44px 52px;font:600 58px/1.28 Barlow;box-shadow:0 30px 60px -40px rgba(15,30,51,.6);max-width:1500px}
.caso .ver{display:flex;align-items:center;gap:26px;margin-top:40px;flex-wrap:wrap}
.caso .selo{font:800 70px/1 "Barlow Condensed";color:var(--c);border:7px solid var(--c);border-radius:14px;padding:14px 28px 8px;background:#fff}
.caso .resp{font:800 64px "Barlow Condensed";color:var(--c)}
.caso .porque{font:500 40px/1.3 Barlow;color:var(--muted);margin-top:22px;max-width:1500px}
/* alerta */
.alerta{background:var(--c2);flex-direction:row;align-items:center;gap:60px}
.alerta .c1{flex:1.35}.alerta .c2{flex:1;text-align:center}
.alerta .eb{color:var(--c);font-size:36px}
.alerta h2{font:800 88px/1.04 "Barlow Condensed";margin:14px 0 30px}
.alerta .ls{display:grid;gap:16px}
.alerta .grande{font:800 250px/1 "Barlow Condensed";color:var(--c)}
.alerta .sub{font:700 44px/1.2 Barlow;margin-top:6px}
/* resumo */
.resumo{background:var(--navy);color:#fff}
.resumo .eb{color:#C9D6EA;font-size:34px;margin-bottom:26px}
.resumo .rw{display:grid;grid-template-columns:minmax(0,1.1fr) 110px minmax(0,1fr);align-items:center;margin-bottom:16px}

.resumo .cor-navy{--c:#3E6FB5}
.resumo{padding-bottom:170px}
.resumo .ra{font:800 64px/1.02 "Barlow Condensed"}
.resumo .st{font:800 80px "Barlow Condensed";color:var(--amber);text-align:center}
.resumo .rb span{display:inline-block;background:var(--c,#1D5FB8);border-radius:22px;padding:10px 30px 6px;font:800 56px/1.05 "Barlow Condensed"}
.resumo .final{margin-top:24px;text-align:center;font:800 90px/1.05 "Barlow Condensed"}
.resumo .final em{font-style:normal;color:var(--amber)}
/* fim */
.fim{background:var(--navy);color:#fff;align-items:center;gap:24px}
.fim .nm{font:800 110px "Barlow Condensed"}.fim .sb{font:500 40px Barlow;color:#C9D6EA}
/* fixos */
.prog{position:absolute;left:0;top:0;height:8px;background:var(--amber);z-index:9}
.marca{position:absolute;right:56px;top:34px;display:flex;align-items:center;gap:14px;font:700 28px "Barlow Condensed";z-index:8;color:#16325C}
.leg{position:absolute;left:220px;right:220px;bottom:34px;text-align:center;z-index:8}
.leg span{display:inline-block;font:600 34px/1.3 Barlow;color:#fff;background:rgba(10,23,48,.9);border-radius:12px;padding:10px 26px}
</style></head><body>
<div class="prog" id="prog"></div>
<div id="palco"></div>
<div class="marca" id="marca"><svg viewBox="0 0 34 38" width="38" height="43"><path d="M17 1 L32 6 V18 C32 28 25 34 17 37 C9 34 2 28 2 18 V6 Z" fill="#E39B0B"/><path d="M17 5 L28 8.6 V18 C28 25.6 23 30.4 17 33 C11 30.4 6 25.6 6 18 V8.6 Z" fill="#16325C"/><text x="17" y="23.5" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="13" fill="#fff">GM</text></svg><span>Rota GM Campinas</span></div>
<div class="leg"><span id="leg"></span></div>
<script>
const ESCUDO = s=>`<svg viewBox="0 0 34 38" width="${s}" height="${s*1.12}"><path d="M17 1 L32 6 V18 C32 28 25 34 17 37 C9 34 2 28 2 18 V6 Z" fill="#E39B0B"/><path d="M17 5 L28 8.6 V18 C28 25.6 23 30.4 17 33 C11 30.4 6 25.6 6 18 V8.6 Z" fill="#16325C"/><text x="17" y="23.5" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="13" fill="#fff">GM</text></svg>`;
const esc = t=>String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const rico = t=>{ t = esc(t); const i = t.indexOf("|"); t = i>=0 ? `<b>${t.slice(0,i)}</b> ${t.slice(i+1)}` : t; return t.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); };
const A = (cue,fx,html,cls="",tag="div")=>`<${tag} class="an ${cls}" data-cue="${cue}" data-fx="${fx}">${html}</${tag}>`;
const itens = (c,fx="pop",ini=1)=>(c.itens||[]).map((x,i)=>A(i+ini,fx,rico(x),"item")).join("");
const TIPOS = {
 capa:c=>A("0","pop",ESCUDO(130)) + A("0","sobe",esc(c.sobre),"eb") + A("00","sobe",esc(c.titulo),"fit","h1") + (c.gancho ? A("1","bate",esc(c.gancho),"gancho") : ""),
 lei:c=>`<div class="c1">${A("0","sobe",esc(c.rotulo),"eb")}${c.selo ? A("s","bate",esc(c.selo),"selo fit") : ""}${c.def ? A("d","sobe",rico(c.def),"def") : ""}${c.pena ? "<div>"+A("p","sobe",esc(c.pena),"pena")+"</div>" : ""}</div><div class="c2">${itens(c)}</div>`,
 lista:c=>(c.sobre ? A("0","sobe",esc(c.sobre),"eb") : "") + A("0","sobe",esc(c.titulo),"fit","h2") + `<div class="ls">${(c.itens||[]).map((x,i)=>A(i+1,"sobe",`<i>${i+1}</i><span>${rico(x)}</span>`,"ln")).join("")}</div>`,
 versus:c=>{ let n = 0; const pn = (p)=>`<div class="pn cor-${p.cor}">${A("0","sobe",esc(p.rotulo||""),"eb")}${A("0","sobe",esc(p.titulo),"fit","h3")}${(p.itens||[]).map(x=>A(++n,"pop",rico(x),"item")).join("")}</div>`; return pn(c.a) + pn(c.b) + (c.titulo ? `<div class="topo">${A("0","pop","<span>"+esc(c.titulo)+"</span>")}</div>` : ""); },
 caso:c=>A("0","sobe",esc(c.sobre||"Na prática"),"eb") + A("0","sobe",esc(c.titulo||""),"fit","h2") + A("00","sobe",rico(c.texto),"card") + `<div class="ver">${A("s","bate",esc(c.selo),"selo")}${A("r","sobe","→ "+esc(c.resposta),"resp")}</div>` + (c.porque ? A("q","sobe",rico(c.porque),"porque") : ""),
 alerta:c=>`<div class="c1">${A("0","sobe",esc(c.rotulo||"Cai em prova"),"eb")}${A("00","sobe",esc(c.titulo),"fit","h2")}<div class="ls">${itens(c)}</div></div>` + (c.grande ? `<div class="c2">${A("g","bate",esc(c.grande),"grande")}${c.sub ? A("g","sobe",esc(c.sub),"sub") : ""}</div>` : ""),
 resumo:c=>A("0","sobe",esc(c.sobre||"Resumindo"),"eb") + (c.linhas||[]).map((l,i)=>`<div class="rw cor-${l[2]||"blue"}">${A(i+1,"sobe",esc(l[0]),"ra")}${A(i+1,"sobe","→","st")}<div class="rb">${A(i+1,"pop","<span>"+esc(l[1])+"</span>")}</div></div>`).join("") + (c.final ? A("f","sobe",esc(c.final).replace(/\*(.+?)\*/,"<em>$1</em>"),"final") : ""),
 fim:c=>ESCUDO(170) + `<div class="nm">Rota GM Campinas</div><div class="sb">${esc(c.texto||"Agora faça as questões deste posto")}</div>`
};
let R, T, CENAS = [], FIM = 0;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), ease=x=>1-Math.pow(1-cl(x),3), back=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
function montar(roteiro, tempos){
  R = roteiro; T = tempos; FIM = T.dur + 2.6;
  const palco = document.getElementById("palco"); palco.innerHTML = "";
  const todas = R.cenas.concat([{tipo:"fim", texto:R.chamada}]);
  CENAS = todas.map((c,i)=>{
    const el = document.createElement("div"); el.className = `cena ${c.tipo} ${c.cor ? "cor-"+c.cor : ""}`; el.innerHTML = TIPOS[c.tipo](c); palco.appendChild(el);
    const tc = T.cenas[i], ini = tc ? (i===0 ? 0 : tc.ini - 0.3) : T.dur + 0.5, fim = tc ? (T.cenas[i+1] ? T.cenas[i+1].ini - 0.3 : T.dur + 0.5) : FIM + 1;
    const ans = [...el.querySelectorAll(".an")], semCue = ans.filter(a=>!/^0+$/.test(a.dataset.cue) && !(tc && tc.cues[a.dataset.cue]!=null));
    ans.forEach(a=>{ const k = a.dataset.cue; let t;
      if(k==="0") t = ini + 0.35; else if(k==="00") t = ini + 0.7;
      else if(tc && tc.cues[k]!=null) t = tc.cues[k] - 0.12;
      else { const chaves = [...new Set(semCue.map(x=>x.dataset.cue))]; t = ini + 1 + (chaves.indexOf(k)+1)/(chaves.length+1)*(fim-ini-1.5); }
      a._t = Math.max(t, ini + 0.3); });
    return {el, ini, fim, ans, escura: ["capa","resumo","fim"].includes(c.tipo)};
  });
  // ajusta títulos longos
  CENAS.forEach(c=>{ c.el.style.visibility = "visible"; c.el.querySelectorAll(".fit").forEach(f=>{ let fs = parseFloat(getComputedStyle(f).fontSize), n = 0; const max = f.classList.contains("selo") ? 150 : 260; while((f.scrollWidth > f.clientWidth + 2 || f.offsetHeight > max*1.6 || (f.classList.contains("selo") && f.offsetHeight > 190)) && n++ < 40){ fs *= 0.94; f.style.fontSize = fs + "px"; } }); c.el.style.visibility = ""; });
}
function frame(t){
  document.getElementById("prog").style.width = (cl(t/FIM)*100) + "%";
  let escura = true;
  CENAS.forEach((c,i)=>{
    const on = t >= c.ini && t < c.fim, k = Math.min(cl((t-c.ini)/.35), i===CENAS.length-1 ? 1 : cl((c.fim-t)/.3));
    c.el.style.visibility = on ? "visible" : "hidden"; c.el.style.opacity = on ? (i===0 && t<.4 ? 1 : k) : 0;
    if(!on) return; escura = c.escura;
    c.ans.forEach(a=>{ const x = (t - a._t), fx = a.dataset.fx;
      if(fx==="sobe"){ const e = ease(x/.5); a.style.opacity = e; a.style.transform = `translateY(${(1-e)*34}px)`; }
      else if(fx==="pop"){ const u = x/.4; a.style.opacity = cl(u*3); a.style.transform = `scale(${u<=0?0:back(u)})`; }
      else { const u = x/.35; a.style.opacity = cl(u*2); a.style.transform = `scale(${u<=0?2:2-back(u)}) rotate(-3deg)`; } });
  });
  const m = document.getElementById("marca"); m.style.color = escura ? "#fff" : "#16325C"; m.style.opacity = (t > CENAS[0].fim && t < T.dur + 0.5) ? 1 : 0;
  const c = T.legendas.find(l=>t >= l[0]-0.05 && t <= l[1]+0.25), lg = document.getElementById("leg");
  lg.textContent = c ? c[2] : ""; lg.style.display = c ? "inline-block" : "none";
}
</script></body></html>
